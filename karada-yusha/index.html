<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ふれ！さけべ！からだで勇者！</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b2550;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
  #cam{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;box-sizing:border-box;background:rgba(20,28,70,.82);text-align:center}
  .panel.hide{display:none}
  h1{margin:0;font-size:clamp(26px,6vw,48px);line-height:1.25;color:#ffe35a;text-shadow:0 3px 0 #b3541e}
  .how{display:grid;gap:8px;font-size:clamp(14px,3.4vw,19px);text-align:left;background:rgba(255,255,255,.1);border-radius:14px;padding:14px 18px;max-width:520px}
  .how b{color:#8ff0ff}
  button{font:inherit;font-weight:700;font-size:clamp(16px,4vw,22px);color:#23306b;background:#ffe35a;border:0;border-radius:999px;padding:14px 28px;box-shadow:0 5px 0 #b98a12;cursor:pointer}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #b98a12}
  button.sub{background:#cfe0ff;box-shadow:0 5px 0 #7a8fc4;font-size:clamp(13px,3.2vw,17px);padding:10px 20px}
  #msg{min-height:1.5em;font-size:clamp(13px,3.2vw,17px);color:#ffd0d0;max-width:520px}
  .note{font-size:clamp(11px,2.8vw,14px);opacity:.8;max-width:520px}
  #score2{font-size:clamp(22px,6vw,40px);font-weight:700}
  #pad{position:absolute;left:0;right:0;bottom:44px;display:none;justify-content:center;gap:10px;padding:0 10px}
  #pad.show{display:flex}
  #pad button{font-size:clamp(13px,3.4vw,17px);padding:12px 16px;background:#fff;box-shadow:0 4px 0 #8a93b8}
  #pad button.on{background:#8ff0ff}
</style>
<script data-goatcounter="https://hiroism.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>
<body>
<video id="cam" playsinline muted></video>
<canvas id="cv"></canvas>

<div id="pad">
  <button id="pL">← よける</button>
  <button id="pGuard">ガード</button>
  <button id="pR">よける →</button>
</div>

<div id="title" class="panel">
  <h1>ふれ！さけべ！<br>からだで勇者！</h1>
  <div class="how">
    <div>👊 <b>てきに むかって うでを つきだす</b> … パンチ</div>
    <div>💥 <b>はやく れんぞくで うつ</b> … うった分だけ ぜんぶ 当たる。コンボで 点が ふえる</div>
    <div>👹 <b>ときどき ボスが 出る</b> … なんども なぐって たおす</div>
    <div>🔴 <b>赤い玉が とんできたら 頭を よこに うごかす</b> … よける（ガードでは ふせげない）</div>
    <div>🛡️ <b>むねの前で うでを クロス</b> … ガード（ぶつかってくる てきを はねかえす）</div>
  </div>
  <button id="bCam">カメラで あそぶ</button>
  <button id="bNoCam" class="sub">カメラなしで ためす（マウス・ゆび）</button>
  <div id="msg"></div>
  <div class="note">カメラは この たんまつの中だけで つかいます。えいぞうは どこにも おくりません。<br>上半身が うつるように、すこし はなれて 立ってください。</div>
</div>

<div id="over" class="panel hide">
  <h1>おつかれさま！</h1>
  <div id="score2"></div>
  <div id="best"></div>
  <button id="bRetry">もういちど</button>
  <button id="bBack" class="sub">タイトルへ</button>
</div>

<script type="module">
const MP_VER = '0.10.14';
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

// 調整用の数値（速さの単位は「肩はば何個ぶん／秒」）
const PUNCH_SPEED = 3.5;   // こぶしが これより速く動いていて、
const PUNCH_DIST  = 0.4;   // 動きだした所から これだけ進んだら「パンチ」（ふるえ・ゆれでは 出ない）
const PUNCH_REARM = 1.8;   // これより おそくなるか、引きもどしたら 次のパンチを受けつける
const PUNCH_GAP   = 0.1;   // 同じ手の パンチとパンチの 最短の間（秒）
const Z_WEIGHT    = 0.5;   // 奥行きは ふるえやすいので、たて・よこより 軽く見る
const WRIST_VIS   = 0.6;   // 手首が これより はっきり 見えているときだけ 数える
const PUNCH_REACH = 0.6;   // こぶしの当たりはんい（肩はば単位）
const FIST_LEN    = 0.3;   // ひじ→手首の長さに対して、手首の先の どこを こぶしとするか
const COMBO_TIME  = 1.2;   // コンボが つづく秒数
const MAX_HEART   = 5;
const SHOT_FIRST  = 12;    // 最初の玉が とんでくる時間（秒）
const SHOT_TIME   = 1.3;   // 玉が うたれてから とどくまで（秒）。だんだん短くなる
const SHOT_HIT    = 0.6;  // 玉の当たりはんい（ねらわれた所から 頭が これだけ はなれれば セーフ）
const BOSS_FIRST  = 20;    // 最初のボスが出る時間（秒）
const BOSS_EVERY  = 25;    // ボスを たおしてから 次のボスまで（秒）

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const video = document.getElementById('cam');
const $ = id => document.getElementById(id);
let W = 0, H = 0;
function resize(){
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize); resize();

const S = {
  mode: null, running: false, now: 0, elapsed: 0, score: 0, hearts: MAX_HEART,
  enemies: [], fx: [], spawnT: 0, bossT: BOSS_FIRST, bossN: 0,
  body: false, poseGuard: false, padGuard: false, hurt: 0,
  combo: 0, comboT: 0, best: 0,
  shots: [], shotT: SHOT_FIRST, lean: 0
};
const head = { x: 0, y: 0, tx: 0, ty: 0 };   // よける判定に使う 頭の位置
const anchor = { x: 0, y: 0, unit: 100, tx: 0, ty: 0, tunit: 100 };
const hands = [0, 1].map(() => ({ x: 0, y: 0, p: [0, 0, 0], org: [0, 0, 0], vis: false, armed: true, punchAt: -9 }));
window.__game = { S, hands, anchor, head };

// ---------- 音 ----------
let ac = null, master = null, noiseBuf = null;
function tone(freq, dur, type = 'sine', vol = 0.12, slide = 0, at = 0){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur);
}
// ザーッという音をフィルターに通して鳴らす（風切り・打撃）
function noise(dur, vol, type = 'bandpass', f1 = 1000, f2 = 0, q = 1, at = 0){
  if (!ac) return;
  const n = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime + at;
  n.buffer = noiseBuf; n.loop = true;
  f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f1, t);
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(f).connect(g).connect(master); n.start(t, Math.random()); n.stop(t + dur);
}
const arp = (fs, step, dur, type, vol) => fs.forEach((f, i) => tone(f, dur, type, vol, 0, i * step));
const sfx = {
  miss:  () => noise(0.1, 0.16, 'bandpass', 700, 2600, 2),
  // コンボが のびるほど 音が高くなる
  hit:   () => { const k = Math.min(S.combo, 24); tone(110 + k * 5, 0.12, 'sine', 0.34, -60); noise(0.07, 0.3, 'lowpass', 1500 + k * 80, 300); tone(500 + k * 35, 0.05, 'square', 0.04); },
  pop:   () => { tone(500, 0.08, 'square', 0.07, 600); tone(900, 0.12, 'sine', 0.08, 300, 0.06); noise(0.1, 0.15, 'bandpass', 1800, 600); },
  guard: () => { tone(180, 0.18, 'square', 0.08, 120); tone(1400, 0.2, 'triangle', 0.06, -300); noise(0.05, 0.2, 'highpass', 3000); },
  hurt:  () => { tone(220, 0.30, 'sawtooth', 0.07, -120); tone(90, 0.25, 'sine', 0.3, -40); },
  spawn: () => tone(300, 0.08, 'sine', 0.03, 200),
  shoot: () => { tone(900, 0.3, 'sawtooth', 0.06, -600); tone(1300, 0.08, 'square', 0.04); },
  dodge: () => { noise(0.18, 0.2, 'bandpass', 500, 3000, 2); tone(660, 0.1, 'sine', 0.07, 400, 0.05); },
  warn:  () => { tone(990, 0.07, 'square', 0.04); tone(990, 0.07, 'square', 0.04, 0, 0.12); },
  boss:  () => { arp([196, 185, 175, 165], 0.16, 0.3, 'sawtooth', 0.09); tone(55, 1.0, 'sine', 0.3); },
  bossHit: () => { tone(80, 0.16, 'sine', 0.4, -30); noise(0.09, 0.3, 'lowpass', 900); },
  boom:  () => { tone(80, 0.8, 'sine', 0.5, -50); noise(1.0, 0.5, 'lowpass', 2500, 100); arp([523, 659, 784, 1047], 0.08, 0.25, 'square', 0.05); },
  start: () => arp([523, 659, 784, 1047], 0.09, 0.2, 'square', 0.05),
  over:  () => arp([523, 440, 349, 262], 0.16, 0.35, 'triangle', 0.08)
};

// ---------- カメラ・姿勢 ----------
let pose = null, lastVT = -1, lastPoseT = 0;
function vidRect(){
  const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
  const sc = Math.max(W / vw, H / vh), w = vw * sc, h = vh * sc;
  return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}
function onPose(lm, dt){
  const r = vidRect();
  const P = i => ({ x: r.x + (1 - lm[i].x) * r.w, y: r.y + lm[i].y * r.h, v: lm[i].visibility ?? 1 });
  const ls = P(11), rs = P(12);
  S.body = ls.v > 0.5 && rs.v > 0.5;
  if (!S.body){ clearPose(); return; }
  const unit = Math.max(40, Math.hypot(ls.x - rs.x, ls.y - rs.y));
  anchor.tx = (ls.x + rs.x) / 2; anchor.ty = (ls.y + rs.y) / 2; anchor.tunit = unit;
  const nose = P(0), seen = nose.v > 0.5;
  head.tx = seen ? nose.x : anchor.tx; head.ty = seen ? nose.y : anchor.ty - unit * 0.9;
  const lw = P(15), rw = P(16);
  [[lw, P(13), ls, 11, 15], [rw, P(14), rs, 12, 16]].forEach(([w, e, sh, si, wi], i) => {
    if (w.v < WRIST_VIS || e.v < 0.5){ feedHand(i, 0, 0, 0, dt, false); return; }
    // z は小さいほどカメラに近い。肩より どれだけ前に出ているかを 肩はば単位にする
    feedHand(i, w.x + (w.x - e.x) * FIST_LEN, w.y + (w.y - e.y) * FIST_LEN, ((lm[si].z || 0) - (lm[wi].z || 0)) * r.w / unit, dt, true, sh.x, sh.y);
  });
  // 手首の左右が肩の左右と入れかわっていたら「クロス」
  const both = lw.v > 0.4 && rw.v > 0.4;
  const cross = (lw.x - rw.x) * Math.sign(ls.x - rs.x);
  const top = Math.min(ls.y, rs.y) - unit * 0.3, bot = Math.max(ls.y, rs.y) + unit * 1.3;
  S.poseGuard = both && cross < -unit * 0.15 && lw.y > top && lw.y < bot && rw.y > top && rw.y < bot;
}
function clearPose(){
  S.body = false; S.poseGuard = false;
  hands.forEach(h => { h.vis = false; });
}
// こぶしの位置を「同じがわの肩から見た位置」で追う（体ごと ゆれても パンチにならない）。
// 肩から はなれる向きに 速く動き、動きだした所から PUNCH_DIST 進んだら 1発。
// おそくなるか 引きもどすと 動きだしの所を 取りなおすので、
// 行って もどっての くり返しが、うった回数ぶん そのまま パンチになる。
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
function feedHand(i, x, y, fwd, dt, vis, sx = 0, sy = 0){
  const h = hands[i];
  if (!vis){ h.vis = false; return; }
  const u = anchor.unit, p = [(x - sx) / u, (y - sy) / u, fwd * Z_WEIGHT];
  if (!h.vis){ Object.assign(h, { x, y, p, org: p, vis: true, armed: true }); return; }
  const d = Math.max(dt, 0.001);
  const np = p.map((c, k) => h.p[k] + (c - h.p[k]) * 0.75);
  const v = np.map((c, k) => (c - h.p[k]) / d), sp = Math.hypot(...v);
  h.x += (x - h.x) * 0.7; h.y += (y - h.y) * 0.7; h.p = np;
  if (sp < PUNCH_REARM || dot(v, np) <= 0){ h.org = np; h.armed = true; return; }
  if (h.armed && sp > PUNCH_SPEED && Math.hypot(np[0] - h.org[0], np[1] - h.org[1], np[2] - h.org[2]) > PUNCH_DIST && S.now - h.punchAt > PUNCH_GAP){
    h.armed = false; h.punchAt = S.now;
    punch(h.x, h.y);
  }
}

// ---------- 敵 ----------
const TYPES = {
  mochi: { hp: 1, time: 5.5, score: 10, size: 0.55 },
  iwa:   { hp: 2, time: 7.0, score: 30, size: 0.62 },
  kumo:  { hp: 1, time: 3.6, score: 40, size: 0.5 },    // はやい
  boss:  { hp: 10, time: 16, score: 300, size: 1.2, boss: true }
};
function spawn(type){
  const T = TYPES[type], t = S.elapsed, n = S.bossN;
  const hp = T.boss ? T.hp + n * 5 : T.hp;
  S.enemies.push({
    type, hp, maxHp: hp, z: 1, speed: 1 / (T.time * Math.max(0.55, 1 - t * 0.004)),
    ux: (Math.random() * 2 - 1) * (T.boss ? 0.8 : 1.9), uy: T.boss ? -0.3 : -1.0 + Math.random() * 1.6,
    flash: 0, wob: Math.random() * 6.28, x: 0, y: 0, r: 0
  });
  if (T.boss){ S.bossN++; sfx.boss(); text(W / 2, H * 0.35, 'ボスだ！', '#ff7a7a', 48, 1.4); } else sfx.spawn();
}
function spawnSmall(){
  const r = Math.random(), t = S.elapsed;
  spawn(t > 30 ? (r < 0.45 ? 'mochi' : r < 0.75 ? 'iwa' : 'kumo') : t > 10 ? (r < 0.65 ? 'mochi' : r < 0.9 ? 'iwa' : 'kumo') : 'mochi');
}
function place(e){
  const s = 0.3 + 0.7 * Math.pow(1 - e.z, 1.5);
  e.r = anchor.unit * TYPES[e.type].size * s;
  e.x = Math.min(W - e.r, Math.max(e.r, anchor.x + e.ux * anchor.unit));
  e.y = Math.min(H - e.r - 50, Math.max(e.r + 60, anchor.y + e.uy * anchor.unit + Math.sin(S.now * 3 + e.wob) * e.r * 0.08));
}
function punch(x, y){
  if (!S.running) return;
  S.fx.push({ kind: 'fist', x, y, rot: (Math.random() - 0.5) * 0.8, size: anchor.unit * 0.8, t: 0, life: 0.18 });
  let hit = false;
  for (const e of S.enemies){
    if (e.dead || Math.hypot(e.x - x, e.y - y) > e.r + anchor.unit * PUNCH_REACH) continue;
    if (!hit){ hit = true; S.combo++; S.comboT = COMBO_TIME; }
    damage(e);
  }
  if (!hit) sfx.miss();
}
function damage(e){
  const T = TYPES[e.type];
  e.hp--; e.flash = 0.12;
  e.z = Math.min(1, e.z + (T.boss ? 0.02 : 0.1));   // なぐると すこし おしもどす
  S.fx.push({ kind: 'burst', x: e.x, y: e.y, r: e.r, t: 0, life: 0.18 });
  if (e.hp > 0){ T.boss ? sfx.bossHit() : sfx.hit(); return; }
  e.dead = true;
  const pts = T.score + (T.boss ? (S.bossN - 1) * 100 : 0) + Math.min(S.combo, 50);
  S.score += pts;
  text(e.x, e.y - e.r, '+' + pts, '#ffe35a', T.boss ? 40 : 24, T.boss ? 1.4 : 0.8);
  dots(e.x, e.y, T.boss ? 40 : 10, T.boss ? '#ff7a7a' : e.type === 'mochi' ? '#ffb3d1' : e.type === 'iwa' ? '#c9ccd6' : '#ffffff', T.boss ? 2 : 1);
  if (T.boss){
    sfx.boom(); S.bossT = BOSS_EVERY;
    S.fx.push({ kind: 'ring', x: e.x, y: e.y, t: 0, life: 0.6 });
    text(W / 2, H * 0.35, 'ボスを たおした！', '#ffe35a', 40, 1.5);
  } else sfx.pop();
}
// てきが 頭を ねらって 玉を うつ。ねらう場所は うった しゅんかんの 頭の位置で 固定。
function shoot(){
  const c = S.enemies.filter(e => !e.dead && e.z > 0.25);
  if (!c.length) return false;
  const e = c[Math.floor(Math.random() * c.length)];
  e.flash = 0.2;
  S.shots.push({ sx: e.x, sy: e.y, tx: head.x, ty: head.y, t: 0, life: Math.max(0.9, SHOT_TIME - S.elapsed * 0.004) });
  sfx.shoot();
  return true;
}
function dots(x, y, n, col, pow = 1){
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.28, v = (80 + Math.random() * 160) * pow;
    S.fx.push({ kind: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 0.5, col });
  }
}
function text(x, y, str, col, size = 24, life = 0.8){ S.fx.push({ kind: 'text', x, y, str, col, size, t: 0, life }); }

// ---------- 進行 ----------
function update(dt){
  const k = Math.min(1, dt * 8);
  if (S.mode !== 'cam' || !S.body){ anchor.tx = W / 2; anchor.ty = H * 0.5; anchor.tunit = Math.min(W, H) * 0.16; }
  anchor.x += (anchor.tx - anchor.x) * k; anchor.y += (anchor.ty - anchor.y) * k; anchor.unit += (anchor.tunit - anchor.unit) * k;
  if (S.mode === 'nocam') S.poseGuard = S.padGuard;
  if (S.mode !== 'cam' || !S.body){ head.tx = anchor.x + (S.mode === 'nocam' ? S.lean : 0) * anchor.unit * 1.3; head.ty = anchor.y - anchor.unit * 0.9; }
  const hk = Math.min(1, dt * 14);
  head.x += (head.tx - head.x) * hk; head.y += (head.ty - head.y) * hk;
  S.hurt = Math.max(0, S.hurt - dt);
  for (const f of S.fx){ f.t += dt; if (f.kind === 'dot'){ f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 400 * dt; } }
  S.fx = S.fx.filter(f => f.t < f.life);
  if (!S.running) return;

  S.elapsed += dt;
  S.comboT -= dt;
  if (S.comboT <= 0){ S.best = Math.max(S.best, S.combo); S.combo = 0; }
  // 時間がたつほど、出るのが早くなり、同時に出る数も ふえる
  const boss = S.enemies.some(e => TYPES[e.type].boss);
  if (!boss){ S.bossT -= dt; if (S.bossT <= 0) spawn('boss'); }
  S.spawnT -= dt;
  const maxN = Math.min(12, 4 + Math.floor(S.elapsed / 8));
  if (S.spawnT <= 0 && S.enemies.length < maxN){ spawnSmall(); S.spawnT = Math.max(0.5, 1.6 - S.elapsed * 0.02) * (boss ? 1.4 : 1); }
  for (const e of S.enemies){
    e.z -= e.speed * dt; e.flash = Math.max(0, e.flash - dt); place(e);
    if (!e.warned && e.z < 0.3){ e.warned = true; sfx.warn(); }
    if (e.z > 0 || e.dead) continue;
    const big = TYPES[e.type].boss;
    if (S.poseGuard){ e.z = big ? 0.4 : 0.6; e.warned = false; sfx.guard(); text(e.x, e.y - e.r, 'ガード！', '#b6ffb0'); }
    else {
      // ボスは たおすまで いなくならない
      if (big){ e.z = 0.5; e.warned = false; } else e.dead = true;
      S.hearts -= big ? 2 : 1; S.hurt = 0.4; S.combo = 0; sfx.hurt();
      if (S.hearts <= 0) gameOver();
    }
  }
  S.enemies = S.enemies.filter(e => !e.dead);
  if (!S.running) return;
  // 玉：体が うつっていない間は うたない
  S.shotT -= dt;
  if (S.shotT <= 0 && (S.mode !== 'cam' || S.body)) S.shotT = shoot() ? Math.max(2.2, 5 - S.elapsed * 0.03) * (boss ? 0.6 : 1) : 0.5;
  for (const s of S.shots){
    s.t += dt;
    if (s.t < s.life) continue;
    s.done = true;
    if (Math.hypot(head.x - s.tx, head.y - s.ty) < anchor.unit * SHOT_HIT){
      S.hearts--; S.hurt = 0.4; S.combo = 0; sfx.hurt(); dots(s.tx, s.ty, 12, '#ff7a5a');
      if (S.hearts <= 0){ gameOver(); break; }
    } else { S.score += 20; text(s.tx, s.ty, 'よけた！ +20', '#b6ffb0'); sfx.dodge(); }
  }
  S.shots = S.shots.filter(s => !s.done);
}
function begin(){
  Object.assign(S, { running: true, elapsed: 0, score: 0, hearts: MAX_HEART, enemies: [], fx: [], spawnT: 1.0, bossT: BOSS_FIRST, bossN: 0, hurt: 0, combo: 0, comboT: 0, best: 0, shots: [], shotT: SHOT_FIRST, lean: 0 });
  $('title').classList.add('hide'); $('over').classList.add('hide');
  $('pad').classList.toggle('show', S.mode === 'nocam');
  sfx.start();
}
function gameOver(){
  S.running = false; S.enemies = []; S.shots = []; sfx.over();
  let best = S.score;
  try { best = Math.max(S.score, +localStorage.getItem('karadaYushaBest') || 0); localStorage.setItem('karadaYushaBest', best); } catch (e) {}
  $('score2').textContent = 'スコア ' + S.score;
  $('best').textContent = `さいこう ${best}　／　さいだいコンボ ${Math.max(S.best, S.combo)}`;
  $('pad').classList.remove('show'); $('over').classList.remove('hide');
}

// ---------- 描画 ----------
function drawEnemy(e){
  const { x, y, r } = e, big = TYPES[e.type].boss, near = e.z < 0.3;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x, y + r * 1.05, r * 0.8, r * 0.18, 0, 0, 6.28); ctx.fill();
  // せまってくる合図の輪
  ctx.strokeStyle = near ? '#ff9a3c' : 'rgba(255,255,255,.5)'; ctx.lineWidth = near ? 5 : 3;
  ctx.beginPath(); ctx.arc(x, y, r * (1.15 + e.z * 0.9), 0, 6.28); ctx.stroke();
  if (big){
    const bw = r * 1.6, by = y - r * 1.35;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x - bw / 2, by, bw, 10);
    ctx.fillStyle = '#ff5a5a'; ctx.fillRect(x - bw / 2, by, bw * e.hp / e.maxHp, 10);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(x - bw / 2, by, bw, 10);
  }
  const sq = 1 + Math.sin(S.now * 5 + e.wob) * 0.05;
  ctx.translate(x + (e.flash > 0 ? (Math.random() - 0.5) * r * 0.15 : 0), y); ctx.scale(1 / sq, sq);
  if (e.type === 'mochi'){
    ctx.fillStyle = '#ffb3d1'; ctx.beginPath(); ctx.ellipse(0, r * 0.1, r, r * 0.85, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.35, r * 0.22, r * 0.12, -0.5, 0, 6.28); ctx.fill();
  } else if (e.type === 'iwa'){
    ctx.fillStyle = '#a9adba'; ctx.beginPath();
    for (let i = 0; i < 8; i++){ const a = i / 8 * 6.28, rr = r * (0.9 + (i % 2) * 0.12); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
    if (e.hp < 2){ ctx.strokeStyle = '#5c6070'; ctx.lineWidth = r * 0.06; ctx.beginPath(); ctx.moveTo(-r * 0.1, -r * 0.9); ctx.lineTo(r * 0.15, -r * 0.5); ctx.lineTo(-r * 0.05, -r * 0.3); ctx.stroke(); }
  } else if (e.type === 'kumo'){
    ctx.fillStyle = '#fff';
    [[-0.55, 0.1, 0.5], [0, -0.2, 0.65], [0.55, 0.1, 0.5], [0, 0.25, 0.6]].forEach(([cx, cy, cr]) => { ctx.beginPath(); ctx.arc(cx * r, cy * r, cr * r, 0, 6.28); ctx.fill(); });
  } else {
    // ボス：とげとげの体に つの
    ctx.fillStyle = '#8b3fb8'; ctx.beginPath();
    for (let i = 0; i < 20; i++){ const a = i / 20 * 6.28, rr = r * (i % 2 ? 0.88 : 1.02); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe35a';
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.moveTo(s * r * 0.3, -r * 0.8); ctx.lineTo(s * r * 0.55, -r * 1.3); ctx.lineTo(s * r * 0.65, -r * 0.65); ctx.fill(); });
    ctx.strokeStyle = '#2a1238'; ctx.lineWidth = r * 0.08; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.3); ctx.lineTo(-r * 0.15, -r * 0.15); ctx.moveTo(r * 0.5, -r * 0.3); ctx.lineTo(r * 0.15, -r * 0.15); ctx.stroke();
  }
  // 顔（ボスは への字の口）
  ctx.fillStyle = '#3a2f4a';
  ctx.beginPath(); ctx.arc(-r * 0.28, 0, r * 0.09, 0, 6.28); ctx.arc(r * 0.28, 0, r * 0.09, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#3a2f4a'; ctx.lineWidth = Math.max(2, r * 0.06); ctx.lineCap = 'round';
  ctx.beginPath();
  if (big) ctx.arc(0, r * 0.42, r * 0.2, Math.PI + 0.3, -0.3); else ctx.arc(0, r * 0.12, r * 0.16, 0.2, Math.PI - 0.2);
  ctx.stroke();
  if (e.flash > 0){ ctx.globalAlpha = 0.7; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, r * 1.05, 0, 6.28); ctx.fill(); }
  ctx.restore();
}
function draw(){
  if (S.mode === 'cam' && video.readyState >= 2){
    const r = vidRect();
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(video, W - r.x - r.w, r.y, r.w, r.h); ctx.restore();
    ctx.fillStyle = 'rgba(24,34,90,.45)'; ctx.fillRect(0, 0, W, H);
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2b3a8c'); g.addColorStop(1, '#6a4fa3');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  [...S.enemies].sort((a, b) => b.z - a.z).forEach(drawEnemy);

  const u = anchor.unit;
  // カメラなしのときは 頭の位置が わかるように 顔を かく。カメラのときは 玉が 来ている間だけ 頭に 輪を 出す
  if (S.mode === 'nocam'){
    ctx.fillStyle = '#ffe0b0'; ctx.beginPath(); ctx.arc(head.x, head.y, u * 0.32, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#3a2f4a'; ctx.beginPath(); ctx.arc(head.x - u * 0.1, head.y - u * 0.03, u * 0.035, 0, 6.28); ctx.arc(head.x + u * 0.1, head.y - u * 0.03, u * 0.035, 0, 6.28); ctx.fill();
  } else if (S.mode === 'cam' && S.shots.length){
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(head.x, head.y, u * 0.32, 0, 6.28); ctx.stroke();
  }
  // とんでくる玉と、当たる場所
  for (const s of S.shots){
    const k = s.t / s.life, R = u * SHOT_HIT, e = k * k;
    ctx.fillStyle = `rgba(255,60,60,${0.12 + 0.22 * k})`; ctx.beginPath(); ctx.arc(s.tx, s.ty, R, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(s.tx, s.ty, R * (2.4 - 1.4 * k), 0, 6.28); ctx.stroke();
    const bx = s.sx + (s.tx - s.sx) * e, by = s.sy + (s.ty - s.sy) * e, br = u * (0.12 + 0.38 * e);
    const g = ctx.createRadialGradient(bx - br * 0.3, by - br * 0.3, br * 0.1, bx, by, br);
    g.addColorStop(0, '#fff2b0'); g.addColorStop(0.4, '#ff8a3c'); g.addColorStop(1, '#d92a2a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.28); ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  // こぶし
  if (S.mode === 'cam') for (const h of hands){
    if (!h.vis) continue;
    ctx.globalAlpha = 0.85; ctx.font = `${Math.round(u * 0.5)}px sans-serif`; ctx.fillText('👊', h.x, h.y); ctx.globalAlpha = 1;
  }
  if (S.poseGuard){
    ctx.strokeStyle = 'rgba(182,255,176,.9)'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(anchor.x, anchor.y + u * 0.4, u * 1.3, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  }
  for (const f of S.fx){
    const a = 1 - f.t / f.life;
    if (f.kind === 'dot'){ ctx.fillStyle = f.col; ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(f.x, f.y, 6, 0, 6.28); ctx.fill(); ctx.globalAlpha = 1; }
    else if (f.kind === 'fist'){
      const k = 0.7 + 0.6 * f.t / f.life;
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.globalAlpha = Math.min(1, a * 2);
      ctx.font = `${Math.round(f.size * k)}px sans-serif`; ctx.fillStyle = '#fff'; ctx.fillText('👊', 0, 0); ctx.restore();
    }
    else if (f.kind === 'burst'){
      ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 5; ctx.beginPath();
      for (let i = 0; i < 8; i++){ const an = i / 8 * 6.28, r1 = f.r * (0.6 + f.t / f.life), r2 = r1 + f.r * 0.5; ctx.moveTo(f.x + Math.cos(an) * r1, f.y + Math.sin(an) * r1); ctx.lineTo(f.x + Math.cos(an) * r2, f.y + Math.sin(an) * r2); }
      ctx.stroke();
    }
    else if (f.kind === 'ring'){ ctx.strokeStyle = `rgba(255,227,90,${a})`; ctx.lineWidth = 16 * a + 2; ctx.beginPath(); ctx.arc(f.x, f.y, (f.t / f.life) * Math.hypot(W, H), 0, 6.28); ctx.stroke(); }
    else { ctx.font = `700 ${f.size}px sans-serif`; ctx.globalAlpha = a; ctx.lineWidth = 4; ctx.strokeStyle = '#23306b'; ctx.strokeText(f.str, f.x, f.y - f.t * 40); ctx.fillStyle = f.col; ctx.fillText(f.str, f.x, f.y - f.t * 40); ctx.globalAlpha = 1; }
  }
  if (S.hurt > 0){ ctx.fillStyle = `rgba(255,150,150,${S.hurt})`; ctx.fillRect(0, 0, W, H); }
  if (!S.mode) return;

  // 画面上の表示
  ctx.font = '700 22px sans-serif'; ctx.fillStyle = '#fff';
  ctx.textAlign = 'left'; ctx.fillText('❤️'.repeat(Math.max(0, S.hearts)), 14, 28);
  ctx.textAlign = 'right'; ctx.fillText('スコア ' + S.score, W - 14, 28);
  ctx.textAlign = 'center';
  if (S.combo >= 3){
    // コンボ数。当たった しゅんかんに 少し大きくなる
    const pop = 1 + Math.max(0, S.comboT - (COMBO_TIME - 0.12)) * 3;
    ctx.font = `700 ${Math.round(44 * pop)}px sans-serif`; ctx.lineWidth = 6; ctx.strokeStyle = '#b3541e'; ctx.fillStyle = '#ffe35a';
    ctx.strokeText(S.combo + ' HIT', W / 2, 84); ctx.fillText(S.combo + ' HIT', W / 2, 84);
  }
  const cam = S.mode === 'cam';
  const tips = cam
    ? ['てきに むかって うでを つきだす → パンチ', 'はやく れんぞくで うつと コンボ！', '赤い玉は 頭を よこに うごかして よける', 'むねの前で うでを クロス → ガード']
    : ['タップ → パンチ', 'はやく れんだすると コンボ！', '赤い玉は ← → で よける', 'ガードを おしっぱなし → ガード'];
  let hint = tips[Math.floor(S.now / 3.5) % tips.length];
  if (cam && !S.body) hint = 'からだが うつっていません。すこし はなれてください';
  else if (S.shots.length) hint = cam ? '赤い玉だ！ 頭を よこに よけろ！' : '赤い玉だ！ ← → で よけろ！';
  else if (S.enemies.some(e => TYPES[e.type].boss)) hint = 'ボスだ！ れんぞくパンチ！';
  ctx.font = '700 18px sans-serif'; ctx.fillStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,28,70,.8)';
  ctx.strokeText(hint, W / 2, H - 22, W - 20); ctx.fillText(hint, W / 2, H - 22, W - 20);
}

function frame(ts){
  const now = ts / 1000, dt = Math.max(0, Math.min(0.05, now - S.now || 0));
  S.now = now;
  if (W !== innerWidth || H !== innerHeight) resize();
  if (S.mode === 'cam' && pose && video.readyState >= 2 && video.currentTime !== lastVT){
    const pdt = lastPoseT ? Math.min(0.2, now - lastPoseT) : 0.033;
    lastVT = video.currentTime; lastPoseT = now;
    const res = pose.detectForVideo(video, ts);
    if (res.landmarks && res.landmarks[0]) onPose(res.landmarks[0], pdt); else clearPose();
  }
  update(dt); draw();
}
Object.assign(window.__game, { tick: frame, onPose, punch, spawn, shoot, sfx });   // テスト用：手動で1コマ進める／関節データを直接わたす
const loop = ts => { frame(ts); requestAnimationFrame(loop); };
requestAnimationFrame(loop);

// ---------- はじめる ----------
function ensureAudio(){
  if (!ac){
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createDynamicsCompressor(); master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
async function startCam(){
  ensureAudio();
  const msg = $('msg');
  if (pose){ S.mode = 'cam'; begin(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ msg.textContent = 'この ひらきかたでは カメラを つかえません。https か localhost で ひらいてください。'; return; }
  msg.textContent = 'カメラを じゅんび中…';
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } } }); }
  catch (e){ msg.textContent = 'カメラを つかえませんでした。ブラウザで カメラを きょかしてください。'; return; }
  video.srcObject = stream;
  await video.play();
  msg.textContent = 'うごきを 見る じゅんび中…（はじめは すこし かかります）';
  try {
    const { PoseLandmarker, FilesetResolver } = await import(`${MP_URL}/vision_bundle.mjs`);
    const files = await FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
    const make = delegate => PoseLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: MODEL_URL, delegate }, runningMode: 'VIDEO', numPoses: 1 });
    try { pose = await make('GPU'); } catch (e){ pose = await make('CPU'); }
  } catch (e){ msg.textContent = 'うごきを 見る しくみを よみこめませんでした。ネットに つながっているか かくにんしてください。'; return; }
  msg.textContent = '';
  S.mode = 'cam'; begin();
}
$('bCam').onclick = startCam;
$('bNoCam').onclick = () => { ensureAudio(); S.mode = 'nocam'; clearPose(); begin(); };
$('bRetry').onclick = begin;
$('bBack').onclick = () => { $('over').classList.add('hide'); $('title').classList.remove('hide'); };

// ---------- カメラなしの操作 ----------
cv.addEventListener('pointerdown', e => { if (S.mode === 'nocam') punch(e.clientX, e.clientY); });
function holdBtn(id, on, off){
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); on(); b.classList.add('on'); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => b.addEventListener(n, () => { if (b.classList.contains('on')){ off(); b.classList.remove('on'); } }));
}
holdBtn('pGuard', () => { S.padGuard = true; }, () => { S.padGuard = false; });
holdBtn('pL', () => { S.lean = -1; }, () => { if (S.lean < 0) S.lean = 0; });
holdBtn('pR', () => { S.lean = 1; }, () => { if (S.lean > 0) S.lean = 0; });
const KEYS = { KeyG: v => { S.padGuard = v; }, ArrowLeft: v => { S.lean = v ? -1 : S.lean < 0 ? 0 : S.lean; }, ArrowRight: v => { S.lean = v ? 1 : S.lean > 0 ? 0 : S.lean; } };
KEYS.KeyA = KEYS.ArrowLeft; KEYS.KeyD = KEYS.ArrowRight;
addEventListener('keydown', e => { if (S.mode === 'nocam' && KEYS[e.code]) KEYS[e.code](true); });
addEventListener('keyup', e => { if (KEYS[e.code]) KEYS[e.code](false); });
</script>
</body>
