<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2546">

<style>
:root{--ink:#16203f;--glass:#ffffff22;--line:#ffffffcc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2546;color:#fff;
  font-family:'Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#gl,#streaks{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
#streaks{pointer-events:none;z-index:2}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 58%,rgba(8,12,30,.32) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;background:#fff;opacity:0}
#fade{position:fixed;inset:0;pointer-events:none;z-index:60;background:#0d1330;opacity:1;transition:opacity 1.6s ease}
#fade.off{opacity:0}
#camVideo{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px;top:-10px}
.hide{display:none!important}
svg{display:block}

/* 題名 */
.logo{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;letter-spacing:.06em;color:#fff;
  text-shadow:0 0 30px #ffd9b080,0 2px 16px #0003;line-height:1}

/* よみこみ */
#load{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  background:radial-gradient(ellipse at 50% 70%,#f2b48e 0%,#7b6f9e 45%,#1b2546 100%);transition:opacity 1.2s}
#load .logo{font-size:min(22vw,150px)}
#load .bar{width:min(52vw,320px);height:2px;background:#ffffff30;border-radius:2px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:#fff;transition:width .25s}
#load.off{opacity:0;pointer-events:none}
#load .err{max-width:80vw;font-size:14px;line-height:1.6;text-align:center;opacity:.9}

/* 入口 */
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;transition:opacity 1s}
#gate .logo{font-size:min(24vw,170px);margin-top:-8vh;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-6px);text-shadow:0 0 44px #ffd9b0aa,0 2px 16px #0003}}
#gate .row{display:flex;gap:min(5vw,34px)}
.ib{width:min(19vw,104px);height:min(19vw,104px);border-radius:50%;border:1.5px solid #ffffffaa;background:#ffffff1a;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;transition:transform .2s,background .2s,box-shadow .2s;color:#fff}
.ib:hover,.ib:focus-visible{background:#ffffff33;transform:translateY(-3px) scale(1.04);box-shadow:0 0 30px #ffe2c080;outline:none}
.ib:active{transform:scale(.96)}
.ib svg{width:62%;height:62%}
#gate.off{opacity:0;pointer-events:none}
#gmsg{min-height:1.6em;font-size:14px;max-width:80vw;text-align:center;line-height:1.6;text-shadow:0 1px 6px #0008}

/* カメラの じゅんび（絵だけ） */
#guide{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:4vw;transition:opacity .8s}
#guide.off{opacity:0;pointer-events:none}
#mirrorWrap{position:relative;width:min(56vw,78vh);aspect-ratio:4/3;border-radius:22px;overflow:hidden;border:1.5px solid #ffffffaa;
  box-shadow:0 10px 40px #0006;background:#0d1330}
#mirror{width:100%;height:100%;display:block}
#ghost{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55;transition:opacity .4s}
#ghost.ok{opacity:.9}
#ghint{position:absolute;right:10px;top:10px;width:30%;aspect-ratio:1;pointer-events:none;opacity:0;transition:opacity .3s}
#ghint.on{opacity:1}
#gring{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .2s}
#gring.on{opacity:1}
#setupPic{width:min(26vw,36vh);opacity:.95}
#guideBack{position:absolute;left:16px;top:16px;width:46px;height:46px}

/* とんでいる間の 絵の合図 */
#cue{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%) translateY(-12px);z-index:15;
  width:min(30vw,170px);aspect-ratio:1;pointer-events:none;opacity:0;transition:opacity .5s,transform .5s;
  filter:drop-shadow(0 2px 8px #0007)}
#cue.on{opacity:1;transform:translateX(-50%)}
#cue.ok{opacity:0;transform:translateX(-50%) scale(1.25);transition:opacity .6s,transform .6s}
#cue svg{width:100%;height:100%}

/* 小さな 鏡（からだが 見えているか） */
#mini{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:min(20vw,150px);aspect-ratio:4/3;
  z-index:14;border-radius:12px;overflow:hidden;opacity:0;transition:opacity .8s;pointer-events:none;background:#0d133055;border:1px solid #ffffff55}
#mini.on{opacity:.75}
#miniCv{width:100%;height:100%;display:block}
#lost{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:54px;height:54px;z-index:14;
  opacity:0;transition:opacity .5s;pointer-events:none;filter:drop-shadow(0 2px 6px #0008)}
#lost.on{opacity:.9;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* タッチ */
#touch{position:fixed;inset:0;z-index:12;display:none;pointer-events:none}
#touch.on{display:block}
#stick{position:absolute;left:max(4vw,env(safe-area-inset-left));bottom:max(6vh,env(safe-area-inset-bottom));width:min(30vh,150px);aspect-ratio:1;border-radius:50%;
  border:1.5px solid #ffffff88;background:#ffffff14;pointer-events:auto;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:#ffffffaa;box-shadow:0 0 18px #fff8}
#flapBtn{position:absolute;right:max(5vw,env(safe-area-inset-right));bottom:max(7vh,env(safe-area-inset-bottom));width:min(24vh,118px);aspect-ratio:1;border-radius:50%;
  border:1.5px solid #ffffff88;background:#ffffff1c;pointer-events:auto;display:flex;align-items:center;justify-content:center;touch-action:none}
#flapBtn svg{width:64%;height:64%}
#flapBtn.hit{background:#ffffff55}

/* おわり */
#endUI{position:fixed;left:50%;bottom:max(9vh,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:22px;
  opacity:0;pointer-events:none;transition:opacity 2s}
#endUI.on{opacity:1;pointer-events:auto}
#bAgain{position:relative}
#endRing{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none;transform:rotate(-90deg)}
#endTp{width:70px;height:70px;opacity:.8}

#rotate{position:fixed;inset:0;z-index:90;background:#1b2546;display:none;align-items:center;justify-content:center}
#rotate svg{width:min(40vw,180px);height:min(40vw,180px)}
@media (orientation:portrait){body.touch #rotate{display:flex}}

#dbgInfo{position:fixed;right:6px;top:6px;z-index:95;font:11px/1.35 ui-monospace,Consolas,monospace;color:#fff;background:#000a;
  padding:4px 6px;border-radius:6px;white-space:pre;pointer-events:none;display:none}
</style>
<script data-goatcounter="https://hiroism.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>

<script type="module">
import * as THREE from 'three';
// =====================================================================
//  Fly — 体で 空を とぶ。世界の 名所を めぐって、宇宙の 入り口まで。
// =====================================================================
const Q = new URLSearchParams(location.search);
const DBG = Q.has('dbg');
const TOUCH = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
if (TOUCH) document.body.classList.add('touch');
const QUALITY = Q.get('q') || (TOUCH ? 'low' : 'high');
const HI = QUALITY === 'high';
const $ = id => document.getElementById(id);

// ---------- 小さな 道具 ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (c, t, tau, dt) => tau <= 0 ? t : c + (t - c) * (1 - Math.exp(-dt / tau));
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const V3 = THREE.Vector3;
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(r));
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; } return s / n; }
function ridged(x, y, o = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * (1 - Math.abs(vnoise(x * f + i * 7.1, y * f + i * 3.3) * 2 - 1)); n += a; a *= 0.5; f *= 2.1; } return s / n; }
const col = h => new THREE.Color(h);
const ex2 = v => Math.exp(-v * v);

// ---------- 空と 霧（すべての 物で 同じ 式を つかう） ----------
const SU = {
  uZen: { value: col('#3a5ba8') }, uHor: { value: col('#f0c9a6') }, uSunDir: { value: new V3(0, 0.1, 1).normalize() },
  uSunCol: { value: col('#ffd2a0') }, uGlow: { value: 1 }, uFogDens: { value: 0.002 }, uFogBase: { value: 0 }, uFogFall: { value: 0.02 },
  uHaze: { value: 0.0002 }, uCloudFog: { value: 0 }, uCloudCol: { value: col('#ffffff') }, uCloudShadow: { value: col('#8c90b8') },
  uTime: { value: 0 }, uStars: { value: 0 }, uSunDisc: { value: 1 }
};
const GL_COMMON = /* glsl */`
uniform vec3 uZen; uniform vec3 uHor; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uGlow;
uniform float uFogDens; uniform float uFogBase; uniform float uFogFall; uniform float uHaze; uniform float uCloudFog;
uniform vec3 uCloudCol; uniform vec3 uCloudShadow; uniform float uTime; uniform float uStars; uniform float uSunDisc;
vec3 skyCol(vec3 d){
  float y=d.y;
  vec3 c=mix(uHor,uZen,pow(clamp(y,0.0,1.0),0.5));
  c=mix(c,uHor*0.88,clamp(-y*5.0,0.0,1.0));
  float sd=max(dot(d,uSunDir),0.0);
  float hb=exp(-abs(y)*4.0);
  c+=uSunCol*uGlow*(pow(sd,3.0)*0.28*hb+pow(sd,20.0)*0.32+pow(sd,260.0)*0.9);
  return c;
}
float fogAmt(vec3 p){
  vec3 v=p-cameraPosition; float d=length(v);
  float k=uFogFall;
  float e0=exp(-k*(cameraPosition.y-uFogBase)); float e1=exp(-k*(p.y-uFogBase));
  float hf=abs(v.y)>0.5?(e0-e1)/(k*v.y):e0;
  hf=clamp(hf,0.0,30.0);
  float od=uFogDens*d*hf+uHaze*d+uCloudFog*uCloudFog*d*0.08;
  return 1.0-exp(-od);
}
vec3 fogCol(vec3 dir){ return mix(skyCol(dir),uCloudCol,clamp(uCloudFog*1.2,0.0,1.0)); }
vec3 toOut(vec3 c){
#ifdef TONE_MAPPING
  c=toneMapping(c);
#endif
  return linearToOutputTexel(vec4(c,1.0)).rgb;
}
vec3 applyFog(vec3 outc, vec3 wp){ return mix(outc,toOut(fogCol(normalize(wp-cameraPosition))),fogAmt(wp)); }
float h13(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
`;
// three.js の 材料（Lambert など）にも 同じ 霧を つける
function fogPatch(m) {
  m.onBeforeCompile = sh => {
    for (const k in SU) sh.uniforms[k] = SU[k];
    sh.vertexShader = sh.vertexShader
      .replace('#include <fog_pars_vertex>', 'varying vec3 vFW;')
      .replace('#include <fog_vertex>', 'vec4 fwp=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nfwp=instanceMatrix*fwp;\n#endif\nvFW=(modelMatrix*fwp).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <fog_pars_fragment>', 'varying vec3 vFW;\n' + GL_COMMON)
      .replace('#include <fog_fragment>', 'gl_FragColor.rgb=applyFog(gl_FragColor.rgb,vFW);');
  };
  m.customProgramCacheKey = () => 'fogp1';
  return m;
}
function shaderMat(o) {
  const u = Object.assign({}, SU, o.uniforms || {});
  return new THREE.ShaderMaterial(Object.assign({}, o, { uniforms: u, fragmentShader: GL_COMMON + o.fragmentShader }));
}

// ---------- 描画の じゅんび ----------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: HI, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
let PR = Math.min(devicePixelRatio || 1, HI ? 1.75 : 1.35);
renderer.setPixelRatio(PR);
if (HI) { renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.3, 14000);
scene.add(camera);
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
const hemi = new THREE.HemisphereLight(0x9db1e8, 0xb89880, 1.0);
scene.add(sun, sun.target, hemi);
if (HI) {
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.5;
  const sc = sun.shadow.camera; sc.near = 10; sc.far = 2600;
}
const SpaceCam = new THREE.PerspectiveCamera(70, 1, 0.5, 60000);
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  SpaceCam.aspect = w / h; SpaceCam.updateProjectionMatrix();
  const sc = $('streaks'); const k = Math.min(devicePixelRatio || 1, 1.5);
  sc.width = Math.round(w * k); sc.height = Math.round(h * k);
}

// ---------- 手で 作る 絵（キャンバス） ----------
function canvasTex(w, h, draw, opt = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h, c);
  const t = new THREE.CanvasTexture(c);
  if (opt.noflip) t.flipY = false;
  t.colorSpace = opt.srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  if (opt.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  if (opt.aniso) t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const TEX = {};
function makeTextures() {
  // 地面の こまかい ざらざら（くり返しても つなぎ目が 出ない）
  TEX.detail = canvasTex(256, 256, (g, w, h) => {
    const im = g.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0, a = 0.5, n = 0;
      for (let o = 0; o < 5; o++) {
        const p = 8 << o, fx = x / w * p, fy = y / h * p;
        const xi = Math.floor(fx), yi = Math.floor(fy), xf = fx - xi, yf = fy - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const H = (i, j) => hash2(((i % p) + p) % p + o * 131, ((j % p) + p) % p + o * 71);
        const A = H(xi, yi), B = H(xi + 1, yi), C = H(xi, yi + 1), D = H(xi + 1, yi + 1);
        s += a * (A + (B - A) * u + (C - A) * v + (A - B - C + D) * u * v); n += a; a *= 0.55;
      }
      const vv = Math.round(clamp(s / n, 0, 1) * 255), i = (y * w + x) * 4;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = vv; im.data[i + 3] = 255;
    }
    g.putImageData(im, 0, 0);
  }, { repeat: true, aniso: true });
  // 雲の かたまり（2×2 の 4しゅるい）。R = 光の あたり具合、A = こさ
  TEX.puff = canvasTex(512, 512, (g, w, h) => {
    const im = g.createImageData(w, h);
    const R = rng(77);
    for (let k = 0; k < 4; k++) {
      const balls = [];
      const nb = 5 + Math.floor(R() * 4);
      for (let i = 0; i < nb; i++) balls.push([0.5 + (R() - 0.5) * 0.42, 0.56 + (R() - 0.5) * 0.3 - i * 0.012, 0.13 + R() * 0.12]);
      const dens = (x, y) => {
        let d = 0; for (const b of balls) { const dx = x - b[0], dy = y - b[1]; d += Math.exp(-(dx * dx + dy * dy) / (b[2] * b[2])); }
        d += (fbm(x * 9 + k * 10, y * 9, 4) - 0.5) * 0.9;
        const e = Math.min(x, 1 - x, y, 1 - y); return d * smooth(0.0, 0.16, e);
      };
      const ox = (k % 2) * 256, oy = Math.floor(k / 2) * 256;
      for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
        const u = x / 256, v = y / 256;
        const d = dens(u, v), up = dens(u - 0.03, v - 0.07);
        const rr = Math.hypot(u - 0.5, (v - 0.54) * 1.15);
        const a = smooth(0.12, 1.0, d) * smooth(0.5, 0.26, rr);
        const lit = clamp(0.62 + (d - up) * 0.9 - (v - 0.4) * 0.35, 0, 1);
        const i = ((oy + y) * w + ox + x) * 4;
        im.data[i] = Math.round(lit * 255); im.data[i + 1] = im.data[i + 2] = 0; im.data[i + 3] = Math.round(a * 255);
      }
    }
    g.putImageData(im, 0, 0);
  });
  TEX.puff.flipY = false;
  // やわらかい 点
  TEX.dot = canvasTex(64, 64, (g, w, h) => {

function axisPts(min, max, dmin, dmax, fine, coarse) {
  const a = []; let v = min;
  while (v < max - 1e-6) {
    a.push(v);
    const dist = v < dmin ? dmin - v : v > dmax ? v - dmax : 0;
    v += Math.min(coarse, fine + dist * 0.05);

}
function findIdx(arr, v) {
  const hi0 = arr.length - 1;
  if (v <= arr[0]) return 0; if (v >= arr[hi0]) return hi0 - 1;
  let lo = 0, hi = hi0;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (arr[m] <= v) lo = m; else hi = m; }
  return lo;
}
class Grid {
  constructor(xs, zs, fn) {
    this.xs = xs; this.zs = zs; this.nx = xs.length; this.nz = zs.length;
    this.H = new Float32Array(this.nx * this.nz);
    for (let j = 0; j < this.nz; j++) for (let i = 0; i < this.nx; i++) this.H[j * this.nx + i] = fn(xs[i], zs[j]);
  }
  // 三角形の わけ方に あわせた 高さ（見た目と 当たりが 同じ）
  h(x, z) {
    const i = findIdx(this.xs, x), j = findIdx(this.zs, z);
    const x0 = this.xs[i], x1 = this.xs[i + 1], z0 = this.zs[j], z1 = this.zs[j + 1];
    const u = clamp((x - x0) / (x1 - x0), 0, 1), v = clamp((z - z0) / (z1 - z0), 0, 1);
    const H = this.H, n = this.nx, a = H[j * n + i], b = H[j * n + i + 1], c = H[(j + 1) * n + i], d = H[(j + 1) * n + i + 1];
    if (u + v <= 1) return a + (b - a) * u + (c - a) * v;
    return d + (c - d) * (1 - u) + (b - d) * (1 - v);
  }
  mesh(colorFn, mat, uvScale = 1 / 14) {
    const { nx, nz, xs, zs, H } = this, n = nx * nz;
    const pos = new Float32Array(n * 3), uv = new Float32Array(n * 2);
    for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
      const k = j * nx + i;
      pos[k * 3] = xs[i]; pos[k * 3 + 1] = H[k]; pos[k * 3 + 2] = zs[j];
      uv[k * 2] = xs[i] * uvScale; uv[k * 2 + 1] = zs[j] * uvScale;
    }
    const idx = new Uint32Array((nx - 1) * (nz - 1) * 6); let q = 0;
    for (let j = 0; j < nz - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
      idx[q++] = a; idx[q++] = c; idx[q++] = b; idx[q++] = b; idx[q++] = c; idx[q++] = d;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeVertexNormals();
    const nor = g.attributes.normal.array, cols = new Float32Array(n * 3);
    for (let k = 0; k < n; k++) {
      const c = colorFn(pos[k * 3], pos[k * 3 + 2], pos[k * 3 + 1], nor[k * 3 + 1]);
      cols[k * 3] = c.r; cols[k * 3 + 1] = c.g; cols[k * 3 + 2] = c.b;
    }
    g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    const m = new THREE.Mesh(g, mat); m.receiveShadow = true;
    return m;
  }
}

// ---------- 形を まとめて 1つに する（色つき・角ばった 見た目） ----------
class GeoB {
  constructor() { this.P = []; this.N = []; this.C = []; }
  add(geo, mtx, color, cfn) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    if (mtx) g.applyMatrix4(mtx);
    g.deleteAttribute('normal'); g.computeVertexNormals();
    const p = g.attributes.position.array, n = g.attributes.normal.array;
    for (let i = 0; i < p.length; i += 3) {
      this.P.push(p[i], p[i + 1], p[i + 2]); this.N.push(n[i], n[i + 1], n[i + 2]);
      const c = cfn ? cfn(p[i], p[i + 1], p[i + 2], color) : color; this.C.push(c.r, c.g, c.b);

  geo() {
    const g = new THREE.BufferGeometry();

const M4 = () => new THREE.Matrix4();
function mtx(x, y, z, ry = 0, rx = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  return new THREE.Matrix4().compose(new V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ')), new V3(sx, sy, sz));

// 石：箱を ゆがめて 角を けずった 感じに
function rockBox(w, h, d, seg = [2, 3, 2], amp = 0.07, seed = 1) {
  const g = new THREE.BoxGeometry(w, h, d, seg[0], seg[1], seg[2]);
  const p = g.attributes.position, s = Math.min(w, h, d) * amp;

    p.setXYZ(i,
      x + (vnoise(x * k + seed, y * k + z * 0.7) - 0.5) * 2 * s,
      y + (vnoise(y * k + seed * 2.3, z * k + x * 0.3) - 0.5) * 2 * s * 0.6,

function roofGeo(w, d, h, over = 1.2) {

// ---------- 当たる 物（向きつきの 箱） ----------
class Obb {
  constructor(x, y, z, hx, hy, hz, yaw = 0, whoosh = true) {
    this.c = new V3(x, y, z); this.hx = hx; this.hy = hy; this.hz = hz; this.cos = Math.cos(yaw); this.sin = Math.sin(yaw);
    this.whoosh = whoosh; this.near = 99; this.played = false;
  }
  local(p) { const dx = p.x - this.c.x, dz = p.z - this.c.z; return [dx * this.cos - dz * this.sin, p.y - this.c.y, dx * this.sin + dz * this.cos]; }
  inside(p, m) { const l = this.local(p); return Math.abs(l[0]) < this.hx + m && Math.abs(l[1]) < this.hy + m && Math.abs(l[2]) < this.hz + m; }
  dist(p) {
    const l = this.local(p), qx = Math.abs(l[0]) - this.hx, qy = Math.abs(l[1]) - this.hy, qz = Math.abs(l[2]) - this.hz;
    return Math.hypot(Math.max(qx, 0), Math.max(qy, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qy, qz), 0);
  }

// ---------- 道すじ（決めた 線の まわりを 自由に とぶ） ----------
class Path {
  constructor(ctrl, zone) {
    this.zone = zone;
    const groundAt = (x, z) => zone.groundAt(x, z);
    const n = ctrl.length;
    const pts = ctrl.map(c => new V3(c.p[0], c.g != null ? groundAt(c.p[0], c.p[2]) + c.g : c.p[1], c.p[2]));
    const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
    let L0 = 0; for (let k = 1; k < n; k++) L0 += pts[k].distanceTo(pts[k - 1]);
    curve.arcLengthDivisions = Math.ceil(L0 * 1.5);
    const len = curve.getLength(), N = Math.max(2, Math.ceil(len));
    const sp = curve.getSpacedPoints(N);
    // 決めた 値（速さ・視線・自由の はば）を 点ごとに
    const keys = ['v', 'gaze', 'wx', 'wu', 'wd', 'g'];
    const D = { v: 40, gaze: 0, wx: 60, wu: 200, wd: 200, g: null };
    const A = {}; for (const k of keys) A[k] = new Float32Array(N + 1);
    const hasG = new Uint8Array(N + 1);
    for (let i = 0; i <= N; i++) {
      const t = curve.getUtoTmapping(i / N) * (n - 1);
      const k = Math.min(n - 2, Math.floor(t)), f = t - k, e = f * f * (3 - 2 * f);
      const a = ctrl[k], b = ctrl[k + 1];
      for (const key of keys) {
        const va = a[key] != null ? a[key] : D[key], vb = b[key] != null ? b[key] : D[key];
        A[key][i] = va == null || vb == null ? (va ?? vb ?? 0) : va + (vb - va) * e;
      }
      hasG[i] = a.g != null && b.g != null ? 1 : 0;
    }
    // 地面に そう ところは 地面の 形に あわせる
    const Y = sp.map(p => p.y);
    for (let i = 0; i <= N; i++) if (hasG[i]) Y[i] = groundAt(sp[i].x, sp[i].z) + A.g[i];
    const Y2 = Y.slice();
    for (let i = 0; i <= N; i++) if (hasG[i]) {
      let s = 0, w = 0;
      for (let k = -10; k <= 10; k++) { const j = i + k; if (j < 0 || j > N) continue; const ww = 1 - Math.abs(k) / 11; s += Y[j] * ww; w += ww; }
      Y2[i] = Math.max(s / w, groundAt(sp[i].x, sp[i].z) + A.g[i] * 0.75);
    }
    this.N = N; this.len = N;
    const P = this.P = new Float32Array((N + 1) * 3);
    for (let i = 0; i <= N; i++) { P[i * 3] = sp[i].x; P[i * 3 + 1] = Y2[i]; P[i * 3 + 2] = sp[i].z; }
    this.A = A;
    // 向き（前 T・上 U・右 R）
    const T = this.T = new Float32Array((N + 1) * 3), U = this.U = new Float32Array((N + 1) * 3), R = this.R = new Float32Array((N + 1) * 3);
    const tmp = new V3(), t2 = new V3();
    for (let i = 0; i <= N; i++) {
      const a = Math.max(0, i - 2), b = Math.min(N, i + 2);
      tmp.set(P[b * 3] - P[a * 3], P[b * 3 + 1] - P[a * 3 + 1], P[b * 3 + 2] - P[a * 3 + 2]).normalize();
      T[i * 3] = tmp.x; T[i * 3 + 1] = tmp.y; T[i * 3 + 2] = tmp.z;
    }
    const up = new V3(), prevU = new V3(0, 1, 0), tv = new V3();
    for (let i = 0; i <= N; i++) {
      tv.set(T[i * 3], T[i * 3 + 1], T[i * 3 + 2]);
      if (Math.abs(tv.y) < 0.96) up.set(0, 1, 0).addScaledVector(tv, -tv.y).normalize();
      else up.copy(prevU).addScaledVector(tv, -prevU.dot(tv)).normalize();
      prevU.copy(up);
      U[i * 3] = up.x; U[i * 3 + 1] = up.y; U[i * 3 + 2] = up.z;
    }
    // なめらかに
    for (let pass = 0; pass < 3; pass++) {
      const C = U.slice();
      for (let i = 0; i <= N; i++) {
        let sx = 0, sy = 0, sz = 0;
        for (let k = -6; k <= 6; k++) { const j = clamp(i + k, 0, N); sx += C[j * 3]; sy += C[j * 3 + 1]; sz += C[j * 3 + 2]; }
        tv.set(T[i * 3], T[i * 3 + 1], T[i * 3 + 2]); up.set(sx, sy, sz); up.addScaledVector(tv, -up.dot(tv)).normalize();
        U[i * 3] = up.x; U[i * 3 + 1] = up.y; U[i * 3 + 2] = up.z;
      }
    }
    for (let i = 0; i <= N; i++) {
      tv.set(T[i * 3], T[i * 3 + 1], T[i * 3 + 2]); up.set(U[i * 3], U[i * 3 + 1], U[i * 3 + 2]);
      t2.crossVectors(tv, up).normalize();
      R[i * 3] = t2.x; R[i * 3 + 1] = t2.y; R[i * 3 + 2] = t2.z;
    }
    // よこへの まがり（かたむきに つかう）
    const K = new Float32Array(N + 1);
    for (let i = 1; i < N; i++) {
      const dx = T[(i + 1) * 3] - T[(i - 1) * 3], dy = T[(i + 1) * 3 + 1] - T[(i - 1) * 3 + 1], dz = T[(i + 1) * 3 + 2] - T[(i - 1) * 3 + 2];
      K[i] = (dx * R[i * 3] + dy * R[i * 3 + 1] + dz * R[i * 3 + 2]) / 2;
    }
    this.K = new Float32Array(N + 1);
    for (let i = 0; i <= N; i++) { let s = 0, w = 0; for (let k = -24; k <= 24; k++) { const j = i + k; if (j < 0 || j > N) continue; const ww = 1 - Math.abs(k) / 25; s += K[j] * ww; w += ww; } this.K[i] = s / w; }
  }
  // 自由に とべる はば（左右・上下）を 先に 調べておく
  corridor() {
    const { N, P, R, U, A, zone } = this;
    const lim = [new Float32Array(N + 1), new Float32Array(N + 1), new Float32Array(N + 1), new Float32Array(N + 1)];
    const p = new V3();
    const STEP = 3;
    const dirs = [[R, 1, 'wx'], [R, -1, 'wx'], [U, 1, 'wu'], [U, -1, 'wd']];
    for (let i = 0; i <= N; i += STEP) {
      for (let d = 0; d < 4; d++) {
        const [V, sg, key] = dirs[d], maxT = A[key][i];
        let t = 1.5, L = maxT;
        while (t < maxT) {
          p.set(P[i * 3] + V[i * 3] * t * sg, P[i * 3 + 1] + V[i * 3 + 1] * t * sg, P[i * 3 + 2] + V[i * 3 + 2] * t * sg);
          if (zone.blocked(p)) { L = Math.max(0, t - 2.2); break; }
          t += 1.5 + t * 0.045;
        }
        lim[d][i] = L;
      }
    }
    for (const a of lim) {
      for (let i = 0; i <= N; i++) if (i % STEP) { const i0 = i - (i % STEP), i1 = Math.min(N, i0 + STEP); a[i] = Math.min(a[i0], a[i1]); }
      const k = 0.55;
      for (let i = 1; i <= N; i++) a[i] = Math.min(a[i], a[i - 1] + k);
      for (let i = N - 1; i >= 0; i--) a[i] = Math.min(a[i], a[i + 1] + k);
    }
    [this.limR, this.limL, this.limU, this.limD] = lim;
  }
  // s の 場所の 値を out に 入れる
  at(s, o) {
    const N = this.N; s = clamp(s, 0, N - 1e-4);
    const i = Math.floor(s), f = s - i, j = Math.min(N, i + 1);
    const L = (arr, k) => arr[i * 3 + k] + (arr[j * 3 + k] - arr[i * 3 + k]) * f;
    o.P.set(L(this.P, 0), L(this.P, 1), L(this.P, 2));
    o.T.set(L(this.T, 0), L(this.T, 1), L(this.T, 2)).normalize();
    o.U.set(L(this.U, 0), L(this.U, 1), L(this.U, 2)).normalize();
    o.R.set(L(this.R, 0), L(this.R, 1), L(this.R, 2)).normalize();
    const S = arr => arr[i] + (arr[j] - arr[i]) * f;
    o.v = S(this.A.v); o.gaze = S(this.A.gaze); o.k = S(this.K);
    o.limL = S(this.limL); o.limR = S(this.limR); o.limU = S(this.limU); o.limD = S(this.limD);
    return o;
  }
}

function waterMat(deep, waveK = 1.0) {
  return shaderMat({
    uniforms: { uNoise: { value: TEX.detail }, uDeep: { value: col(deep) }, uWaveK: { value: waveK } },
    vertexShader: /* glsl */`varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: /* glsl */`varying vec3 vW; uniform sampler2D uNoise; uniform vec3 uDeep; uniform float uWaveK;
    void main(){
      vec2 p=vW.xz; float t=uTime;

  }

}

  const R = rng(seed), list = [];

  while (list.length < count && tries < count * 30) {

    if (R() > dens(x, z)) continue;
    list.push([x, zone.grid.h(x, z) - 0.4, z, lerp(sMin, sMax, R()), R() * 6.28, R()]);
  }

  const o = new THREE.Object3D(), tc = col(tint), cc = new THREE.Color();
  list.forEach((t, i) => {

function axisBands(min, max, bands, coarse) {
  const a = []; let v = min;
  while (v < max - 1e-6) {
    a.push(v);
    let st = coarse;
    for (const [lo, hi, s] of bands) { const d = v < lo ? lo - v : v > hi ? v - hi : 0; st = Math.min(st, s + d * 0.05); }
    v += st;
  }
  a.push(max); return Float32Array.from(a);
}

const Streaks = {
  cv: $('streaks'), lines: [],
  init() { const R = rng(3); for (let i = 0; i < 46; i++) this.lines.push({ a: R() * Math.PI * 2, r: 0.55 + R() * 0.5, l: 0.1 + R() * 0.2, s: R(), v: 0.6 + R() * 0.8 }); },
  draw(k, dt) {
    const c = this.cv.getContext('2d'), w = this.cv.width, h = this.cv.height;
    c.clearRect(0, 0, w, h);
    if (k < 0.02) return;
    const cx = w / 2, cy = h / 2, R = Math.hypot(cx, cy);
    c.lineCap = 'round';
    for (const L of this.lines) {
      L.s = (L.s + dt * L.v * (1.2 + k * 2)) % 1;
      const r0 = R * (L.r + L.s * 0.5), r1 = r0 + R * L.l * (0.5 + k);
      const a = Math.sin(L.s * Math.PI) * k * 0.32;
      c.strokeStyle = `rgba(255,255,255,${a})`; c.lineWidth = Math.max(1, w / 900) * (1 + L.v);
      c.beginPath(); c.moveTo(cx + Math.cos(L.a) * r0, cy + Math.sin(L.a) * r0 * 0.8); c.lineTo(cx + Math.cos(L.a) * r1, cy + Math.sin(L.a) * r1 * 0.8); c.stroke();
    }
  }
};

//  宇宙の 入り口（地球の 丸み・大気の 線・日の出）。単位は km
// =====================================================================
const Space = {
  scene: new THREE.Scene(), t: 0, on: false, R: 6371,
  build() {
    this.U = { uSun: { value: new V3() }, uAlt: { value: 3 }, uR: { value: this.R }, uTime: SU.uTime, uSunVis: { value: 0 }, uFade: { value: 1 }, uFlash: { value: 0 } };
    const mat = new THREE.ShaderMaterial({
      uniforms: this.U,
      vertexShader: /* glsl */`varying vec3 vD; void main(){ vD=position; vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position=p.xyww; }`,
      fragmentShader: /* glsl */`varying vec3 vD; uniform vec3 uSun; uniform float uAlt; uniform float uR; uniform float uTime; uniform float uSunVis; uniform float uFade; uniform float uFlash;
      float h13(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      float hash31(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.yzx+33.33); return fract((p.x+p.y)*p.z); }
      float vn3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
        return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z); }
      float fbm3(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*vn3(p); p*=2.07; a*=0.5; } return s; }
      float starL(vec3 d, float sc, float th){
        vec3 p=d*sc; vec3 i=floor(p); vec3 f=fract(p);
        float h=h13(i); if(h<th) return 0.0;
        vec3 c=vec3(h13(i+1.7),h13(i+3.1),h13(i+5.3))*0.6+0.2;
        float tw=0.8+0.2*sin(uTime*(1.0+h*3.0)+h*40.0);
        return smoothstep(0.1,0.0,length(f-c))*(h-th)/(1.0-th)*tw;
      }
      void main(){
        vec3 d=normalize(vD);
        vec3 o=vec3(0.0,uR+uAlt,0.0);
        float ol=length(o); vec3 on=o/ol;
        float b=dot(o,d);
        float sn=length(cross(on,d));
        float hm=ol*sn;                       // 中心から 線までの きょり
        bool toward=b<0.0;
        float hmin=(toward?hm:ol)-uR;         // いちばん 近づく 高さ
        vec3 col=vec3(0.0);
        float sunU=max(dot(d,uSun),0.0);
        // 星
        float st=starL(d,190.0,0.986)*1.4+starL(d,420.0,0.992)*0.9+starL(d,90.0,0.996)*1.6;
        vec3 star=vec3(0.92,0.95,1.0)*st;
        if(toward && hm<uR){
          // 地球に 当たる
          float tt=-b-sqrt((uR-hm)*(uR+hm));
          vec3 p=o+d*tt; vec3 n=normalize(p);
          float mu=dot(n,uSun);
          float land=smoothstep(0.58,0.63,fbm3(n*7.0+vec3(3.1)));
          float cl=smoothstep(0.48,0.78,fbm3(n*48.0+vec3(uTime*0.002,0.0,0.0)))*0.8+smoothstep(0.55,0.8,fbm3(n*160.0))*0.3;
          vec3 day=mix(vec3(0.015,0.06,0.2),vec3(0.12,0.14,0.08),land);
          day=mix(day,vec3(0.92),clamp(cl,0.0,1.0));
          vec3 night=mix(vec3(0.004,0.006,0.016),vec3(0.03,0.036,0.06),clamp(cl,0.0,1.0));
          float dayK=smoothstep(-0.1,0.18,mu);
          col=mix(night,day*1.5,dayK);
          col+=vec3(1.0,0.4,0.15)*exp(-pow((mu-0.02)/0.07,2.0))*0.35;
          // 地平線ちかくの 空気
          float rim=pow(1.0-max(dot(n,-d),0.0),4.0);
          vec3 atm=mix(vec3(0.1,0.3,0.9),vec3(1.0,0.5,0.22),pow(sunU,3.0));
          col=mix(col,atm*(0.08+1.2*smoothstep(-0.2,0.25,mu)),rim*0.85);
        } else {
          // 空気の 線（地球の ふち）
          float g=exp(-max(hmin,0.0)/8.5);
          float lit=0.1+1.6*pow(sunU,5.0)+2.2*pow(sunU,30.0);
          vec3 blue=vec3(0.12,0.34,1.0), org=vec3(1.0,0.48,0.16);
          col=(blue*(0.08+lit*0.9)+org*(pow(sunU,4.0)*1.8+pow(sunU,24.0)*2.6))*g;
          col+=vec3(0.18,0.62,0.36)*0.025*exp(-abs(hmin-92.0)/5.0)*(toward?1.0:0.0);
          col+=vec3(0.02,0.05,0.12)*exp(-uAlt/7.0)*(1.0-pow(1.0-max(d.y,0.0),2.0));
          col+=star*(1.0-clamp(g*4.0,0.0,1.0));
          // 太陽
          float sd=dot(d,uSun);
          col+=vec3(1.0,0.96,0.88)*smoothstep(0.99986,0.99994,sd)*60.0*uSunVis;
          col+=vec3(1.0,0.82,0.6)*pow(max(sd,0.0),900.0)*5.0*uSunVis+vec3(1.0,0.7,0.45)*pow(max(sd,0.0),40.0)*0.35*uSunVis;
        }
        col+=vec3(1.0,0.85,0.7)*uFlash*pow(sunU,2.0)*0.6;
        col*=uFade;
        col=NeutralToneMapping(col*1.2);
        gl_FragColor=vec4(pow(col,vec3(1.0/2.2)),1.0);
      }`,
      side: THREE.BackSide, depthWrite: false
    });
    // NeutralToneMapping を ここで 使えるように
    mat.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('void main(){', THREE.ShaderChunk.tonemapping_pars_fragment.replace(/uniform float toneMappingExposure;/, 'float toneMappingExposure=1.0;') + '\nvoid main(){'); };
    mat.toneMapped = false;
    this.mesh = new THREE.Mesh(new THREE.SphereGeometry(10, 64, 32), mat);
    this.mesh.frustumCulled = false;
    this.scene.add(this.mesh);
  },
  start() {
    this.on = true; this.t = 0;
    this.sun = new V3(0, Math.sin(-7.2 * D2R), Math.cos(-7.2 * D2R));
    this.U.uSun.value.copy(this.sun);
  },
  alt(t) { return 2.5 + 120 * Math.pow(smooth(0.5, 17, t), 1.6); },
  update(dt) {
    this.t += dt; const t = this.t;
    const a = this.alt(t); this.U.uAlt.value = a;
    // 見上げる → 地平線へ
    const pitch = lerp(78, -9.5, smooth(3, 15, t)) * D2R + Math.sin(t * 0.3) * 0.004;
    const yaw = Math.sin(t * 0.07) * 0.02;
    const dir = new V3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
    SpaceCam.position.set(0, 0, 0);
    SpaceCam.up.set(Math.sin(t * 0.05) * 0.03, 1, 0).normalize();
    SpaceCam.lookAt(dir);
    const fov = lerp(80, 62, smooth(2, 16, t)) + (innerHeight > innerWidth ? 12 : 0);
    if (Math.abs(SpaceCam.fov - fov) > 0.01) { SpaceCam.fov = fov; SpaceCam.updateProjectionMatrix(); }
    // 太陽が 地球の かげから 出るか
    const o = new V3(0, this.R + a, 0), b = o.dot(this.sun);
    const closest = b > 0 ? a : Math.sqrt(Math.max(0, o.lengthSq() - b * b)) - this.R;
    const vis = smooth(4, 22, closest);
    this.U.uSunVis.value = vis;
    this.U.uFlash.value = damp(this.U.uFlash.value, vis * (1 - smooth(0, 6, (t - this.riseT) || 0)) * 0.9, 0.4, dt);
    if (vis > 0.3 && !this.riseT) this.riseT = t;
    this.U.uFade.value = smooth(0, 1.4, t);
    $('flash').style.opacity = clamp((1 - smooth(0.0, 1.6, t)) * 0.9, 0, 1).toFixed(3);
    Audio_.quiet = clamp(1 - smooth(1, 11, t), 0, 1);
    return t;
  }
};

}
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && App.awake) keepAwake(); });
async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { gmsg('この ひらきかたでは カメラを つかえません。https か localhost で ひらいてね。'); return; }

}

// ---------- 毎コマ ----------
let last = 0, fpsAcc = 0, fpsN = 0, fps = 60;
const IDLE_IN = { steer: 0, climb: 0, dive: 0, flap: false };
function loop(ts) {
  requestAnimationFrame(loop);
  const raw = last ? (ts - last) / 1000 : 0.016; last = ts;
  fpsAcc += raw; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  if (App.paused) return;
  step(Math.min(0.05, raw), ts);
  render();
}
function step(dt, ts = performance.now()) {
  SU.uTime.value += dt; App.t += dt;
  Body.tick(ts);
  const inp = Input.read(dt);
  const st = App.state;
  if (st === 'space' || st === 'end') {
    const t = Space.update(dt);
    if (st === 'space' && t > 21) { App.setState('end'); App.endHold = 0; }
    if (st === 'end') {
      // もう一回：T の ポーズ か ボタン
      if (Body.mode === 'cam') { if (Body.tposeT > 0.05) App.endHold += dt; else App.endHold = Math.max(0, App.endHold - dt * 2); if (App.endHold > 1.3) { App.endHold = 0; App.again(); } }
      if (Keys.flap !== App.lastKF) { App.lastKF = Keys.flap; App.again(); }
      $('endRingFg').setAttribute('stroke-dashoffset', (295.3 * (1 - clamp(App.endHold / 1.3, 0, 1))).toFixed(1));
      $('endTp').style.display = Body.mode === 'cam' ? '' : 'none';
    }
    Audio_.update({ dt, speed: 60 * Audio_.quiet, boost: 0, roll: 0, sideL: 0, sideR: 0, agl: 999, cloud: 0 });
    return;
  }
  App.lastKF = Keys.flap;
  if (st === 'fly') {
    Fly.update(dt, inp);
    Cue.update(dt, inp);
  } else {
    Fly.place(false);
    if (st === 'ready') {
      if (Body.mode === 'cam') {
        if (Body.tposeT === 0) App.readyArm = true;
        if (App.readyArm && Body.tposeT > 0.8) App.takeoff();
      } else if (Keys.flap !== Input.lastKF0) { Input.lastKF0 = Keys.flap; if (App.t > 0.3) App.takeoff(); }
    }
    if (st === 'guide') guideUpdate(dt);
  }
  Input.lastKF0 = Keys.flap;
  Fly.env(dt);
  // とぶ前は ゆっくり 息をする
  const flyIn = Fly.flying ? inp : IDLE_IN;
  Fly.cam(dt, flyIn);
  if (!Fly.flying) {
    const t = App.t;
    camera.position.y += Math.sin(t * 0.8) * 0.05;
    camera.rotateX(Math.sin(t * 0.37) * 0.006); camera.rotateY(Math.sin(t * 0.23) * 0.01);
  }
  Fly.fx(dt, flyIn);
  Sky.update(); Puffs.update(dt);
  Arms.update(dt, { eL: Input.eL, eR: Input.eR, speed: Fly.v }, (Fly.flying || st === 'ready') && !(TOUCH && Body.mode !== 'cam') ? 1 : 0);
  // 小さい 鏡
  const showMini = Body.mode === 'cam' && (st === 'fly' || st === 'ready') && (Fly.zi === 0 || Body.lostT > 0.8);
  $('mini').classList.toggle('on', showMini);
  if (showMini) drawMirror($('miniCv'), $('camVideo'), false, 240);
  $('lost').classList.toggle('on', Body.mode === 'cam' && st === 'fly' && Body.lostT > 1.2);
  Streaks.draw(Fly.flying ? smooth(55, 110, Fly.vel.length()) + Fly.kick * 0.04 : 0, dt);
  Audio_.update({ dt, speed: Fly.flying ? Fly.vel.length() : 3, boost: Fly.boost, roll: inp.steer, sideL: Fly.sideL, sideR: Fly.sideR, agl: Fly.agl, cloud: SU.uCloudFog.value });
  if (DBG) dbgInfo();
}
function render() {
  if (App.state === 'space' || App.state === 'end') renderer.render(Space.scene, SpaceCam);
  else renderer.render(scene, camera);
}
function dbgInfo() {
  const el = $('dbgInfo'); el.style.display = 'block';
  el.textContent = `${fps.toFixed(0)}fps ${App.state} z${Fly.zi} ${Fly.z ? Fly.z.key : ''} s${Fly.s.toFixed(0)}/${Fly.z ? Fly.z.path.len : 0}\nv${Fly.v.toFixed(1)} x${Fly.x.toFixed(1)} y${Fly.y.toFixed(1)} agl${Fly.agl.toFixed(1)} t${Fly.time.toFixed(1)}\nst${Input.steer.toFixed(2)} cl${Input.climb.toFixed(2)} dv${Input.dive.toFixed(2)} tp${Body.tposeT.toFixed(1)} draws${renderer.info.render.calls} tri${(renderer.info.render.triangles / 1000).toFixed(0)}k`;
}

// ---------- よみこみ ----------
async function boot() {
  const bar = $('loadBar');
  const prog = p => { bar.style.width = (p * 100).toFixed(0) + '%'; };
  resize(); addEventListener('resize', resize);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', () => setTimeout(resize, 150));
  makeTextures(); makeMats(); buildTreeGeos();
  Sky.build(); Puffs.build(); Grass.build(); Motes.build(); Dust.build(); Shade.build(); Arms.build(); Space.build();
  setIcons(); setupTouch(); Streaks.init();
  prog(0.06); await frame();
  for (let i = 0; i < ZONES.length; i++) {
    const z = ZONES[i];
    const t0 = performance.now();
    const ctrl = z.build(z);
    z.path = new Path(ctrl, z);
    z.path.corridor();
    z.puffList = z.clouds ? z.clouds(z, z.path) : [];
    scene.add(z.group);
    if (DBG) console.log('zone', z.key, 'len', z.path.len, 'ms', (performance.now() - t0).toFixed(0));
    prog(0.08 + 0.8 * (i + 1) / ZONES.length); await frame();
  }
  // 先に 絵の しくみを 作っておく（とちゅうで 止まらないように）
  Fly.reset();
  for (const z of ZONES) { z.group.visible = true; }
  try { renderer.compile(scene, camera); } catch (e) {}
  for (const z of ZONES) { z.group.visible = false; }
  Fly.reset();
  prog(1); await frame();
  App.setState('gate');
  $('load').classList.add('off'); $('fade').classList.add('off');
  requestAnimationFrame(loop);
  if (DBG) setupDbg();
}

    App, Fly, Body, Input, ZONES, Space, SU, renderer, camera,
    ready: true,
    pause(b) { App.paused = b; },
    // ゾーン i の s から とぶ
    go(i, s = 0) { Body.mode = Body.mode === 'cam' ? 'cam' : 'off'; Fly.reset(); if (i > 0) { Fly.enter(i, s); } else Fly.s = s; Fly.flying = true; Fly.v = Fly.z.path.at(s, pathPoint()).v; App.setState('fly'); for (let k = 0; k < 4; k++) step(1 / 60); render(); return this.info(); },
    step(sec, d = 1 / 60) { const n = Math.round(sec / d); for (let k = 0; k < n; k++) step(d); render(); return this.info(); },
    // 好きな 場所から 見る（確認用）
    view(i, s, p, l) { Fly.reset(); if (i > 0) Fly.enter(i, s); else Fly.s = s; App.setState('fly'); Fly.flying = true; step(1 / 60); App.paused = true; camera.position.set(...p); camera.up.set(0, 1, 0); camera.lookAt(new V3(...l)); camera.fov = 60; camera.updateProjectionMatrix(); Sky.update(); render(); return this.info(); },
    space(t = 0) { App.toSpace(); for (let k = 0; k < t * 30; k++) step(1 / 30); render(); return this.info(); },
    input(o) { Input.auto = o ? () => o : null; },
    info() { return { st: App.state, zone: Fly.zi, key: Fly.z && Fly.z.key, s: +Fly.s.toFixed(1), len: Fly.z && Fly.z.path.len, v: +Fly.v.toFixed(1), x: +Fly.x.toFixed(1), y: +Fly.y.toFixed(1), agl: +Fly.agl.toFixed(1), time: +Fly.time.toFixed(1), fog: +SU.uCloudFog.value.toFixed(2), pos: Fly.pos.toArray().map(v => +v.toFixed(1)) }; },
    // 道すじが 物や 地面に めりこんでいないか
    // とちゅうの 点を しらべる
    probe(i, s) { const z = ZONES[i], o = z.path.at(s, pathPoint()); return { P: o.P.toArray().map(v => +v.toFixed(1)), g: +z.groundAt(o.P.x, o.P.z).toFixed(1), grid: +z.grid.h(o.P.x, o.P.z).toFixed(1), obst: z.obst.filter(b => b.inside(o.P, 2.4)).map(b => b.c.toArray().map(v => +v.toFixed(0))), lim: [o.limL, o.limR, o.limU, o.limD].map(v => +v.toFixed(1)) }; },
    check() {
      const out = [];
      for (const z of ZONES) { const P = z.path.P, bad = []; for (let i = 0; i <= z.path.N; i += 2) { const p = new V3(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]); if (z.blocked(p)) bad.push(i); } out.push([z.key, z.path.len, bad.length, bad.slice(0, 12).join(',')]); }
      return out;
    },
    // 全部を とおして 時間を はかる
    runAll(d = 1 / 30) { Fly.reset(); Fly.flying = true; App.setState('fly'); let n = 0; const times = []; let zi = 0; while (App.state === 'fly' && n < 60 * 600) { step(d); n++; if (Fly.zi !== zi) { times.push(+(n * d).toFixed(1)); zi = Fly.zi; } } return { total: +(n * d).toFixed(1), zones: times }; }
  });
}
boot().catch(e => { console.error(e); $('loadErr').textContent = 'よみこみに しっぱいしました：' + (e && e.message || e); });
</script>
</body>
</html>
