<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>かきじゅん はなまる</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{
  /* layout: 夜の 縁日の空に、かきとりプリントが 1まい うかぶ。花火は その上で ひらく */
  --sky-top:#0e1236; --sky-mid:#251f5e; --sky-low:#4b2c6b;
  --paper:#fffdf7; --ink:#1d2333; --shu:#e8412c; --gold:#ffc83d; --gold-deep:#d99a00;
  --on-night:#f6f2ff; --on-night-dim:#b9b2e6;
  --orange:#ff8a1f; --orange-s:#c45a00;
  --green:#22b77a; --green-s:#13804f;
  --blue:#4c8dff; --blue-s:#2a5bc4;
  --red:#ff4d6d; --red-s:#b8233f;
  --grape:#9a5bff; --grape-s:#6331c4;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-hand:"Klee One","Yu Kyokasho","Hiragino Mincho ProN",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
body{margin:0}
.ds,.tag,.nm,.top h2,.ptitle,.res-msg{word-break:keep-all;overflow-wrap:anywhere}
html,body{height:100%;overflow:hidden;background:var(--sky-top);color:var(--on-night);font-family:var(--f-display);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}
#fx{z-index:8;pointer-events:none}
#pops{position:fixed;inset:0;z-index:9;pointer-events:none;overflow:hidden}
#app{position:relative;z-index:1;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  animation:scrIn .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes scrIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{--c:var(--blue);--cs:var(--blue-s);font-family:var(--f-display);font-weight:900;font-size:clamp(16px,1.6vmin + 10px,22px);
  border:0;border-radius:18px;padding:.55em 1.2em;color:#fff;background:var(--c);cursor:pointer;letter-spacing:.04em;
  box-shadow:0 6px 0 var(--cs),0 10px 18px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cs),0 3px 8px rgba(0,0,0,.3)}
.btn:focus-visible,.card:focus-visible,.cbtn:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.primary{--c:var(--orange);--cs:var(--orange-s)}
.btn.green{--c:var(--green);--cs:var(--green-s)}
.btn.grape{--c:var(--grape);--cs:var(--grape-s)}
.btn.ghost{--c:#3a3478;--cs:#221d55}
.btn.sm{font-size:clamp(14px,1.2vmin + 9px,18px);padding:.45em .9em;border-radius:14px}
.btn.big{font-size:clamp(22px,3vmin + 12px,34px);padding:.5em 1.6em;border-radius:24px;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.back{width:48px;height:48px;flex:none;border-radius:50%;border:0;background:#3a3478;color:#fff;font-size:28px;font-weight:900;line-height:1;cursor:pointer;
  box-shadow:0 4px 0 #221d55;font-family:var(--f-display)}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 #221d55}
.top{display:flex;align-items:center;gap:12px;flex:none;min-height:48px;padding-right:52px}
.top h2{margin:0;font-size:clamp(20px,2vmin + 14px,30px);font-weight:900;letter-spacing:.06em;text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.top .sp{flex:1}

#mute{position:fixed;z-index:10;top:calc(10px + env(safe-area-inset-top,0px));right:calc(max(16px,env(safe-area-inset-right,0px)));
  width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center}
#mute svg{width:24px;height:24px}

/* ---------- title ---------- */
.title-main{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,64px);min-height:0}
.logo-col{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.4vmin,22px)}
.logo{display:flex;gap:clamp(4px,1vmin,10px)}
.logo span{display:grid;place-items:center;width:clamp(52px,11vmin,104px);height:clamp(52px,11vmin,104px);border-radius:22%;
  font-family:var(--f-hand);font-size:clamp(34px,7.4vmin,72px);color:#fff;background:var(--c);box-shadow:0 6px 0 var(--cs),0 12px 24px rgba(0,0,0,.4);
  animation:hop 2.4s cubic-bezier(.3,1.6,.5,1) infinite;animation-delay:calc(var(--i) * .12s);rotate:calc((var(--i) - 2) * 3deg)}
.logo span:nth-child(1){--c:var(--red);--cs:var(--red-s);--i:0}
.logo span:nth-child(2){--c:var(--orange);--cs:var(--orange-s);--i:1}
.logo span:nth-child(3){--c:var(--green);--cs:var(--green-s);--i:2}
.logo span:nth-child(4){--c:var(--blue);--cs:var(--blue-s);--i:3}
.logo span:nth-child(5){--c:var(--grape);--cs:var(--grape-s);--i:4}
@keyframes hop{0%,60%,100%{transform:translateY(0)}20%{transform:translateY(-16px)}35%{transform:translateY(0) scale(1.05,.95)}}
.logo-sub{font-family:var(--f-hand);font-size:clamp(30px,6.6vmin,64px);color:var(--gold);letter-spacing:.12em;
  text-shadow:0 0 18px rgba(255,200,61,.55),0 4px 0 #7a4b00}
.tag{margin:0;color:var(--on-night-dim);font-size:clamp(14px,1.4vmin + 8px,19px);font-weight:700}
.title-paper{width:min(42vmin,340px);aspect-ratio:1;max-width:100%;position:relative;flex:none;rotate:3deg}
.title-paper canvas{width:100%;height:100%;display:block;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.credit{text-align:center;font-size:11px;color:var(--on-night-dim);opacity:.7;flex:none}
@media (orientation:portrait){.title-main{flex-direction:column}.title-paper{width:min(60vw,320px)}}

/* ---------- cards ---------- */
.cards{flex:1;display:flex;gap:clamp(12px,2.4vw,28px);justify-content:center;align-items:center;flex-wrap:wrap;overflow:auto;min-height:0;padding:8px 4px 18px}
.card{--c:var(--blue);--cs:var(--blue-s);width:clamp(150px,25vw,250px);border:0;border-radius:26px;padding:14px 14px 16px;color:#fff;background:var(--c);
  box-shadow:0 8px 0 var(--cs),0 16px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:var(--f-display);
  transition:transform .12s;animation:cardIn .6s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i,0) * .08s)}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) rotate(-4deg) scale(.8)}}
.card:hover{transform:translateY(-4px) rotate(-1deg)}
.card:active{transform:translateY(6px);box-shadow:0 2px 0 var(--cs),0 6px 12px rgba(0,0,0,.3)}
.card canvas{width:min(100%,30vh,170px);aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--paper);display:block}
.card .lv{font-size:13px;font-weight:700;letter-spacing:.12em;opacity:.9}
.card .nm{font-size:clamp(18px,1.6vmin + 12px,26px);font-weight:900;line-height:1.2;text-align:center;text-wrap:balance}
.card .ds{font-size:13px;font-weight:700;opacity:.95;text-align:center;line-height:1.45;text-wrap:balance}
.card .pg{font-size:13px;font-weight:900;background:rgba(0,0,0,.2);border-radius:99px;padding:2px 10px;font-variant-numeric:tabular-nums}

/* ---------- char grid ---------- */
.chal{display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:none}
.grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px;align-content:start;padding:6px 4px 20px}
.cbtn{aspect-ratio:1/1.12;border:0;border-radius:12px;background:var(--paper);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;box-shadow:0 4px 0 #b8b0e0;position:relative;font-family:var(--f-hand);
  animation:cardIn .45s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i,0) * 12ms)}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8b0e0}
.cbtn .g{font-size:34px;line-height:1.1}
.cbtn .st{font-family:var(--f-display);font-size:12px;letter-spacing:1px;color:#d8d3e8}
.cbtn .st b{color:var(--gold-deep);font-weight:900}
.cbtn.p3::after{content:"";position:absolute;inset:5px;border:2.5px solid var(--shu);border-radius:50%;opacity:.55;transform:rotate(-12deg) scale(.92,1)}

/* ---------- play ---------- */
.ptitle{flex:1;min-width:0;font-weight:900;font-size:clamp(15px,1.4vmin + 10px,20px);letter-spacing:.06em}
.pprog{font-weight:900;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.12);border-radius:99px;padding:4px 14px;white-space:nowrap;flex:none}
.play-main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.play-main.land{flex-direction:row}
.paper-wrap{position:relative;flex:none;border-radius:4px;box-shadow:0 20px 44px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.05)}
.paper-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:4px;touch-action:none;cursor:crosshair}
.paper-wrap.win{animation:win .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes win{30%{transform:scale(1.07) rotate(-2deg)}60%{transform:scale(.98) rotate(1deg)}}
.tape{position:absolute;width:64px;height:22px;background:rgba(255,214,120,.55);top:-9px;pointer-events:none;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tape.t1{left:-18px;rotate:-38deg}.tape.t2{right:-18px;rotate:38deg;background:rgba(140,220,255,.5)}
.bubble{position:absolute;left:50%;top:-6px;translate:-50% -100%;background:#fff;color:var(--ink);font-weight:900;font-size:clamp(15px,1.4vmin + 10px,21px);
  padding:.45em 1em;border-radius:18px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:bub .4s cubic-bezier(.2,1.8,.4,1);z-index:3;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;translate:-50% 0;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble.bad{background:#ffe3e3;color:#b8233f}.bubble.bad::after{border-top-color:#ffe3e3}
.bubble.good{background:#fff6d6;color:#9a5a00}.bubble.good::after{border-top-color:#fff6d6}
@keyframes bub{from{transform:scale(.3)}}
.side{display:flex;flex-direction:column;align-items:center;gap:10px;flex:none;width:190px}
.play-main:not(.land) .side{flex-direction:row;width:auto;max-width:100%;flex-wrap:wrap;justify-content:center}
.target{background:var(--paper);color:var(--ink);border-radius:16px;padding:6px 14px 8px;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 0 #b8b0e0;min-width:96px}
.tlabel{font-size:12px;font-weight:900;color:var(--shu);letter-spacing:.1em}
.tglyph{font-family:var(--f-hand);font-size:clamp(40px,8vmin,64px);line-height:1.1}
.tread{font-size:13px;font-weight:700;color:#5d5a78;min-height:1em}
.kakuinfo{display:flex;flex-direction:column;align-items:center;gap:6px}
.kaku{font-weight:900;font-size:16px}.kaku b{font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:180px}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18);transition:background .2s,transform .2s}
.dots i.on{background:var(--gold);box-shadow:0 0 10px var(--gold);animation:dotOn .5s cubic-bezier(.2,2,.4,1)}
.dots i.now{background:transparent;border:2.5px solid var(--gold);animation:dotNow 1s ease-in-out infinite}
@keyframes dotOn{from{transform:scale(2.4)}}
@keyframes dotNow{50%{transform:scale(1.25)}}
.sbtns{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.play-main:not(.land) .sbtns{flex-direction:column}

/* ---------- overlay / result ---------- */
.overlay{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(10,8,34,.45);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:fadeIn .3s both}
@keyframes fadeIn{from{opacity:0}}
.res-card{background:var(--paper);color:var(--ink);border-radius:28px;padding:18px 26px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;
  box-shadow:0 12px 0 #b8b0e0,0 30px 60px rgba(0,0,0,.5);max-width:100%;animation:cardPop .6s cubic-bezier(.2,1.6,.4,1) both;max-height:100%;overflow:auto}
@keyframes cardPop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.res-title{font-size:clamp(34px,6vmin + 10px,64px);font-weight:900;color:var(--shu);letter-spacing:.08em;line-height:1.1;
  text-shadow:0 4px 0 #ffd0c6;animation:titleWiggle 1.2s ease-in-out infinite}
@keyframes titleWiggle{25%{transform:rotate(-3deg) scale(1.04)}75%{transform:rotate(3deg) scale(1.04)}}
.res-stars{display:flex;gap:6px}
.res-stars span{font-size:clamp(40px,6vmin + 14px,66px);line-height:1;color:#e4e0ef;display:inline-block}
.res-stars span.on{color:var(--gold);text-shadow:0 0 16px rgba(255,200,61,.8),0 4px 0 var(--gold-deep);animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(3.2) rotate(-40deg);opacity:0}}
.res-msg{font-weight:700;font-size:16px;color:#5d5a78}
.res-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.final-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.final-list div{background:#f1eefb;border-radius:12px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;min-width:52px}
.final-list .g{font-family:var(--f-hand);font-size:28px;line-height:1.15}
.final-list .s{font-size:11px;color:var(--gold-deep);font-weight:900;letter-spacing:1px}

/* ---------- pops ---------- */
.pop{position:absolute;translate:-50% -50%;font-weight:900;white-space:nowrap;font-size:clamp(22px,3vmin + 10px,40px);color:#fff;
  -webkit-text-stroke:6px var(--orange-s);paint-order:stroke fill;animation:popUp 1.3s cubic-bezier(.2,1.6,.4,1) forwards;letter-spacing:.04em}
.pop.gold{color:var(--gold);-webkit-text-stroke-color:#7a3d00}
.pop.combo{color:#7cf7ff;-webkit-text-stroke-color:#1b3a8a;font-size:clamp(20px,2.4vmin + 10px,32px)}
.pop.huge{font-size:clamp(46px,10vmin,110px);color:#fff;-webkit-text-stroke:10px var(--shu);animation:popHuge 1.9s cubic-bezier(.2,1.6,.4,1) forwards}
.pop.banner{font-size:clamp(26px,4.4vmin + 8px,48px);color:#fff;-webkit-text-stroke:8px var(--green-s);animation:popHuge 1.6s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes popUp{0%{transform:scale(0) rotate(-10deg);opacity:1}25%{transform:scale(1.25) rotate(3deg)}45%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-60px) scale(.9);opacity:0}}
@keyframes popHuge{0%{transform:scale(0) rotate(-15deg)}20%{transform:scale(1.3) rotate(4deg)}35%{transform:scale(1) rotate(0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
#flash{position:fixed;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.75}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .logo span,.btn.big,.res-title,.dots i.now{animation:none}
}
</style>

<canvas id="bg"></canvas>
<div id="app">
  <!-- タイトル -->
  <section id="s-title" class="screen">
    <div class="title-main">
      <div class="logo-col">
        <div class="logo" aria-label="かきじゅん"><span>か</span><span>き</span><span>じ</span><span>ゅ</span><span>ん</span></div>
        <div class="logo-sub">はなまる</div>
        <p class="tag">ただしい じゅんばんで かけるかな？</p>
        <button id="btnStart" class="btn big primary">はじめる</button>
      </div>
      <div class="title-paper"><canvas id="titleCv"></canvas></div>
    </div>
    <div class="credit">かきじゅんデータ：KanjiVG（Ulrich Apel, CC BY-SA 3.0）</div>
  </section>

  <!-- レベル -->
  <section id="s-level" class="screen" hidden>
    <div class="top"><button class="back" data-go="s-title" aria-label="もどる">‹</button><h2>レベルを えらぼう</h2></div>
    <div class="cards" id="levelCards"></div>
  </section>

  <!-- モード -->
  <section id="s-mode" class="screen" hidden>
    <div class="top"><button class="back" data-go="s-level" aria-label="もどる">‹</button><h2 id="modeHead">モードを えらぼう</h2></div>
    <div class="cards" id="modeCards"></div>
  </section>

  <!-- もじ -->
  <section id="s-chars" class="screen" hidden>
    <div class="top"><button class="back" data-go="s-mode" aria-label="もどる">‹</button><h2 id="charsHead"></h2></div>
    <div class="chal"><button id="btnChal" class="btn primary sm">ランダム 10もん チャレンジ</button><span class="tag" id="charsNote">もじを タッチすると れんしゅう できるよ</span></div>
    <div class="grid" id="charGrid"></div>
  </section>

  <!-- プレイ -->
  <section id="s-play" class="screen" hidden>
    <div class="top">
      <button class="back" id="playBack" aria-label="もどる">‹</button>
      <div class="ptitle" id="pTitle"></div>
      <div class="pprog" id="pProg"></div>
    </div>
    <div class="play-main" id="playMain">
      <div class="paper-wrap" id="paperWrap">
        <canvas id="paper"></canvas>
        <div class="tape t1"></div><div class="tape t2"></div>
        <div id="bubble" class="bubble" hidden></div>
      </div>
      <div class="side">
        <div class="target"><div class="tlabel">かく もじ</div><div class="tglyph" id="tGlyph"></div><div class="tread" id="tRead"></div></div>
        <div class="kakuinfo"><div class="kaku"><b id="tKaku">0</b> かく</div><div class="dots" id="dots"></div></div>
        <div class="sbtns"><button id="btnShow" class="btn green sm">みほん</button><button id="btnRedo" class="btn ghost sm">かきなおす</button></div>
      </div>
    </div>
  </section>
</div>

<div id="result" class="overlay" hidden>
  <div class="res-card">
    <div class="res-title" id="resTitle"></div>
    <div class="res-stars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
    <div class="res-msg" id="resMsg"></div>
    <div class="final-list" id="finalList" hidden></div>
    <div class="res-btns">
      <button id="btnNext" class="btn primary">つぎの もじ ▶</button>
      <button id="btnAgain" class="btn green">もういちど</button>
      <button id="btnList" class="btn ghost">もじを えらぶ</button>
    </div>
  </div>
</div>

<canvas id="fx"></canvas>
<div id="pops"></div>
<div id="flash"></div>

function updFx(dt){

let modeMinis=[];
function buildModes(){
  $('#modeHead').textContent=`${LEVEL_NAMES[G.lv]} ・ モードを えらぼう`;
  const box=$('#modeCards');box.innerHTML='';modeMinis=[];
  MODES.forEach((m,i)=>{
    const b=document.createElement('button');b.className='card';b.style.setProperty('--c',MODE_COL[m.id][0]);b.style.setProperty('--cs',MODE_COL[m.id][1]);b.style.setProperty('--i',i);
    b.innerHTML=`<canvas></canvas><span class="nm">${m.name}</span><span class="ds">${m.ds}</span>`;
    box.appendChild(b);
    const cv=b.querySelector('canvas');modeMinis.push({c:sizeCanvas(cv,170),mode:m.id});
    b.addEventListener('click',()=>{ensureAudio();sfx.click();G.mode=m.id;show('s-chars')});
  });
}
function renderModeMinis(now){
  const ch=LEVEL_ICON[G.lv],g=geom(ch);
  for(const mm of modeMinis){const c=mm.c;c.setTransform(DPR*170/109,0,0,DPR*170/109,0,0);drawSheet(c);
    if(mm.mode!=='hard')drawGuide(c,g);
    const k=Math.floor(now/1600)%(g.strokes.length+1);
    for(let i=0;i<Math.min(k,g.strokes.length);i++)drawInk(c,g.strokes[i],1,INK);
    if(mm.mode==='easy'&&k<g.strokes.length)drawArrowGuide(c,g.strokes[k],now,k+1);
    if(mm.mode==='hard'&&k===g.strokes.length)drawHana(c,1,2.4);
  }
}
function starsStr(n){return'<b>'+'★'.repeat(n)+'</b>'+'★'.repeat(3-n)}
function buildChars(){
  const mname=MODES.find(m=>m.id===G.mode).name;
  $('#charsHead').textContent=`${LEVEL_NAMES[G.lv]} ・ ${mname}`;
  const box=$('#charGrid');box.innerHTML='';
  LEVELS[G.lv].split('').forEach((ch,i)=>{
    const s=save[skey(G.lv,G.mode,ch)]||0;
    const b=document.createElement('button');b.className='cbtn'+(s===3?' p3':'');b.style.setProperty('--i',i);
    b.innerHTML=`<span class="g">${ch}</span><span class="st">${starsStr(s)}</span>`;
    b.setAttribute('aria-label',ch);
    b.addEventListener('click',()=>{ensureAudio();sfx.click();G.chal=false;G.list=LEVELS[G.lv].split('');G.idx=i;G.results=[];startPlay()});
    box.appendChild(b);
  });
}
$('#btnChal').addEventListener('click',()=>{
  ensureAudio();sfx.fanfare(false);
  const all=LEVELS[G.lv].split('');for(let i=all.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[all[i],all[j]]=[all[j],all[i]]}
  G.chal=true;G.list=all.slice(0,10);G.idx=0;G.results=[];startPlay();
});
function startPlay(){show('s-play');startChar(G.list[G.idx])}

/* ================= play ================= */
const paperCv=$('#paper');let pctx=paperCv.getContext('2d'),paperS=300;let PL=null,drawing=null,lastMove=null;
function fitPaper(){
  const main=$('#playMain');const r=main.getBoundingClientRect();if(!r.width)return;
  const land=r.width>r.height*1.15;main.classList.toggle('land',land);
  const side=main.querySelector('.side').getBoundingClientRect();
  let S=land?Math.min(r.height-30,r.width-side.width-30):Math.min(r.width-12,r.height-side.height-40);
  S=Math.max(150,Math.floor(S));paperS=S;
  const w=$('#paperWrap');w.style.width=w.style.height=S+'px';pctx=sizeCanvas(paperCv,S);
}
addEventListener('resize',()=>{sizeBg();sizeFx();if(curScreen==='s-play')fitPaper()});

function startChar(ch){
  $('#result').hidden=true;
  PL={ch,g:geom(ch),cur:0,ink:[],misses:0,sMiss:0,combo:0,wrong:null,hint:null,demo:null,done:false,shake:0,finT:0,hana:0,glow:0};
  const n=PL.g.strokes.length;
  $('#pTitle').textContent=`${LEVEL_NAMES[G.lv]} ・ ${MODES.find(m=>m.id===G.mode).name}`;
  $('#pProg').textContent=G.chal?`${G.idx+1} / ${G.list.length} もんめ`:`${G.idx+1} / ${G.list.length}`;
  $('#tGlyph').textContent=ch;$('#tRead').textContent=READ[ch]?`（${READ[ch]}）`:'';$('#tKaku').textContent=n;
  $('#btnShow').textContent=G.mode==='easy'?'みほん':'ヒント';
  buildDots();hideBubble();
  if(G.mode==='easy')startDemo();
  else setTimeout(()=>{if(PL&&PL.ch===ch&&!PL.cur)bannerOnPaper(G.mode==='hard'?'じぶんで かいてみよう！':'なぞって かこう！')},250);
}
function buildDots(){
  const d=$('#dots');d.innerHTML='';
  PL.g.strokes.forEach((_,i)=>{const e=document.createElement('i');if(i<PL.cur)e.className='on';else if(i===PL.cur&&!PL.done)e.className='now';d.appendChild(e)});
}
function startDemo(){PL.demo={i:0,ts:performance.now()};sfx.demo(0)}
function paperToScreen(u){const r=paperCv.getBoundingClientRect();return[r.left+u[0]*r.width/109,r.top+u[1]*r.height/109]}
function bannerOnPaper(t,cls){const r=paperCv.getBoundingClientRect();pop(t,r.left+r.width/2,r.top+r.height/2,cls||'banner')}
let bubbleTimer=0;
function bubble(t,cls){const b=$('#bubble');b.textContent=t;b.className='bubble '+(cls||'');b.hidden=false;
  b.style.animation='none';void b.offsetWidth;b.style.animation='';clearTimeout(bubbleTimer);bubbleTimer=setTimeout(hideBubble,1900)}
function hideBubble(){$('#bubble').hidden=true}

function demoDur(st){return 380+st.L*5.5}
function renderPlay(now){
  const c=pctx,k=paperS/109;let ox=0;
  if(PL.shake){const p=(now-PL.shake)/420;if(p<1)ox=Math.sin(p*38)*2.4*(1-p);else PL.shake=0}
  c.setTransform(DPR*k,0,0,DPR*k,ox*DPR*k,0);c.clearRect(-6,-1,121,111);
  drawSheet(c);
  const S=PL.g.strokes,n=S.length;
  if(G.mode!=='hard')drawGuide(c,PL.g);
  // ヒント（むずかしい）
  if(PL.hint&&G.mode==='hard'){const p=(now-PL.hint)/1900;if(p<1){c.globalAlpha=Math.min(1,(1-p)*2);drawGuide(c,PL.g,'#e3e7ef');c.globalAlpha=1}}
  // 完成のきらめき
  if(PL.done){const p=(now-PL.finT)/900;if(p<1){c.save();c.strokeStyle=`rgba(255,200,61,${.75*(1-p)})`;c.lineWidth=6.6+10*p;c.lineCap='round';c.lineJoin='round';S.forEach(st=>c.stroke(st.p2));c.restore()}}
  // かいた線
  for(let i=0;i<PL.cur;i++){
    const age=now-PL.ink[i].t;const end=drawInk(c,S[i],age/200,INK);
    if(age<700&&PL.ink[i].perfect){c.save();c.globalAlpha=.6*(1-age/700);c.strokeStyle='#ffc83d';c.lineWidth=11;c.lineCap='round';c.stroke(S[i].p2);c.restore();drawInk(c,S[i],age/200,INK)}
    if(G.mode==='easy'&&!PL.done)drawNum(c,S[i],i+1,'#9aa3b5');
  }
  if(PL.demo){
    const d=PL.demo;let st=S[d.i],p=(now-d.ts)/demoDur(st);
    if(p>=1){if(d.i<n-1){d.i++;d.ts=now;st=S[d.i];p=0;sfx.demo(d.i)}else if(p>1.9){PL.demo=null;bannerOnPaper('なぞって みよう！');sfx.pop()}}
    if(PL.demo){
      for(let i=0;i<d.i;i++){drawInk(c,S[i],1,SHU,.95);drawNum(c,S[i],i+1)}
      const tip=drawInk(c,st,Math.min(1,p),SHU,.95);drawNum(c,st,d.i+1);
      if(p<1){c.fillStyle='rgba(255,200,61,.5)';circle(c,tip[0],tip[1],5);c.fill();c.fillStyle='#fff';circle(c,tip[0],tip[1],2);c.fill()}
    }
  }else if(!PL.done&&PL.cur<n){
    if(G.mode==='easy')drawArrowGuide(c,S[PL.cur],now,PL.cur+1);
    else if(PL.hint){const p=(now-PL.hint)/1900;if(p<1){c.globalAlpha=Math.min(1,(1-p)*2.5);drawArrowGuide(c,S[PL.cur],now,PL.cur+1);c.globalAlpha=1}else PL.hint=null}
  }
  if(PL.wrong){const p=(now-PL.wrong.t)/750;if(p<1){c.save();c.globalAlpha=1-p;c.strokeStyle='#ff3b5c';c.lineWidth=5.4;c.lineCap='round';c.lineJoin='round';
    const w=PL.wrong.pts;c.beginPath();c.moveTo(w[0][0],w[0][1]);for(const q of w)c.lineTo(q[0],q[1]);c.stroke();c.restore()}else PL.wrong=null}
  if(drawing&&drawing.length){c.strokeStyle=INK;c.lineWidth=5.8;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(drawing[0][0],drawing[0][1]);
    for(const q of drawing)c.lineTo(q[0],q[1]);if(drawing.length===1)c.lineTo(drawing[0][0]+.01,drawing[0][1]);c.stroke()}
  if(PL.hana)drawHana(c,(now-PL.hana)/1100);
}

function canDraw(){return PL&&!PL.done&&!PL.demo&&$('#result').hidden}
function toUnit(e){const r=paperCv.getBoundingClientRect();return[(e.clientX-r.left)*109/r.width,(e.clientY-r.top)*109/r.height]}
paperCv.addEventListener('pointerdown',e=>{
  ensureAudio();if(!canDraw())return;e.preventDefault();
  try{paperCv.setPointerCapture(e.pointerId)}catch(_){}
  drawing=[toUnit(e)];lastMove={x:e.clientX,y:e.clientY,t:performance.now()};scratchStart();
});
paperCv.addEventListener('pointermove',e=>{
  if(!drawing)return;e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e]))drawing.push(toUnit(ev));
  const now=performance.now(),dt=Math.max(1,now-lastMove.t),v=Math.hypot(e.clientX-lastMove.x,e.clientY-lastMove.y)/dt*1000;
  scratchSpeed(v);
  if(now-(lastMove.sp||0)>28){spawn({type:'dot',x:e.clientX+rand(-4,4),y:e.clientY+rand(-4,4),vx:rand(-40,40),vy:rand(-80,-10),g:120,life:rand(.4,.8),size:rand(1.5,3),color:pick(SPARK)});lastMove.sp=now}
  lastMove.x=e.clientX;lastMove.y=e.clientY;lastMove.t=now;
});
function endDraw(){if(!drawing)return;const pts=drawing;drawing=null;scratchStop();handleStroke(pts)}
paperCv.addEventListener('pointerup',endDraw);paperCv.addEventListener('pointercancel',endDraw);

function tolFor(){return G.mode==='hard'?19:G.mode==='normal'?15.5:15}
function judge(raw){
  const S=PL.g.strokes,st=S[PL.cur],uL=polyLen(raw);
  if(uL<2.2&&st.L>16)return null;
  const u=resample(raw.length>1?raw:[raw[0],raw[0]],32),tol=tolFor();
  const shortSt=L=>L<16;
  const near=(s)=>{
    if(shortSt(s.L)){const dc=dist(centroid(u),centroid(s.rs));return{d:dc,ok:dc<tol*1.1&&uL<s.L*3+12}}
    const d=avgDist(u,s.rs);return{d,ok:d<tol&&dist(u[0],s.rs[0])<tol*1.7&&dist(u[31],s.rs[31])<tol*1.7&&uL>s.L*.4}};
  const r=near(st);
  if(r.ok){
    if(shortSt(st.L)&&uL>5){const ud=[u[31][0]-u[0][0],u[31][1]-u[0][1]],ed=[st.rs[31][0]-st.rs[0][0],st.rs[31][1]-st.rs[0][1]];
      if(ud[0]*ed[0]+ud[1]*ed[1]<-0.3*Math.hypot(...ud)*Math.hypot(...ed))return{ok:false,why:'rev'}}
    return{ok:true,perfect:r.d<tol*.42};
  }
  if(!shortSt(st.L)&&avgDist(u,[...st.rs].reverse())<tol)return{ok:false,why:'rev'};
  for(let j=PL.cur+1;j<S.length;j++)if(near(S[j]).ok)return{ok:false,why:'order',j};
  return{ok:false,why:'shape'};
}
function handleStroke(pts){
  if(!PL||PL.done)return;
  const res=judge(pts);if(!res)return;
  const now=performance.now(),S=PL.g.strokes;
  if(res.ok){
    const st=S[PL.cur];PL.ink.push({t:now,perfect:res.perfect});PL.cur++;PL.sMiss=0;PL.hint=null;PL.combo++;
    sfx.stroke(PL.cur-1+(res.perfect?1:0),res.perfect);
    // ほし
    const nn=res.perfect?34:20;for(let i=0;i<nn;i++){const q=st.pts[(Math.random()*st.pts.length)|0],[x,y]=paperToScreen(q);
      spawn({type:Math.random()<.5?'star':'dot',x,y,vx:rand(-90,90),vy:rand(-220,-40),g:380,drag:1,life:rand(.6,1.1),size:rand(3,res.perfect?9:6),color:pick(SPARK),rot:rand(0,6),vr:rand(-6,6)})}
    const [ex,ey]=paperToScreen(st.pts[st.pts.length-1]);
    if(PL.cur<S.length){
      pop(res.perfect?pick(PERFECT):pick(PRAISE),ex,ey-20,res.perfect?'gold':'');
      if(PL.combo>=3)setTimeout(()=>{const r=paperCv.getBoundingClientRect();pop(`${PL.combo} れんぞく！`,r.left+r.width/2,r.top+r.height*.12,'combo')},160);
    }
    buildDots();
    if(PL.cur===S.length)setTimeout(finishChar,380);
  }else{
    PL.misses++;PL.sMiss++;PL.combo=0;PL.wrong={pts,t:now};PL.shake=now;sfx.miss();
    if(navigator.vibrate)try{navigator.vibrate(60)}catch(_){}
    const msg=res.why==='rev'?'むきが はんたいだよ！':res.why==='order'?`じゅんばんが ちがうよ！ つぎは ${PL.cur+1}かくめ`:pick(['おしい！ もういちど','あれれ？ もういちど']);
    bubble(msg,'bad');
    if(G.mode==='normal'||(G.mode==='hard'&&PL.sMiss>=2))PL.hint=now;
  }
}
function finishChar(){
  const now=performance.now();PL.done=true;PL.finT=now;buildDots();
  const stars=PL.misses===0?3:PL.misses<=2?2:1;PL.stars=stars;
  const key=skey(G.lv,G.mode,PL.ch);if((save[key]||0)<stars){save[key]=stars;persist()}
  G.results[G.idx]={ch:PL.ch,stars};
  const r=paperCv.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  sfx.fanfare(stars===3);flash();
  const w=$('#paperWrap');w.classList.remove('win');void w.offsetWidth;w.classList.add('win');
  starBurst(cx,cy,stars===3?90:55,Math.min(FW,FH)*1.1);
  pop(stars===3?'かんぺき！':stars===2?'はなまる！':'できた！',cx,cy-r.height*.05,'huge');
  setTimeout(()=>{if(PL&&PL.done){PL.hana=performance.now();sfx.swirl()}},450);
  launch(FW*.18,'peony');launch(FW*.82,stars===3?'heart':'ring');
  fireworks(stars*2+1,2400,stars===3);
  if(stars===3)confetti(160);
  setTimeout(()=>showResult(stars),1700);
}
function showResult(stars){
  if(curScreen!=='s-play'||!PL||!PL.done)return;
  const last=G.idx>=G.list.length-1;
  $('#result').hidden=false;$('#finalList').hidden=true;
  $('#resTitle').textContent=stars===3?'かんぺき！':stars===2?'はなまる！':'よく できました';
  $('#resMsg').textContent=PL.misses===0?'まちがい なし！':`まちがい ${PL.misses}かい`;
  stampStars(stars);
  $('#btnNext').hidden=false;
  $('#btnNext').textContent=G.chal&&last?'けっかを みる ▶':last?'さいしょから ▶':'つぎの もじ ▶';
  $('#btnAgain').hidden=false;$('#btnList').textContent='もじを えらぶ';
}
function stampStars(stars){
  const sp=[...$('#resStars').children];sp.forEach(s=>s.className='');
  for(let i=0;i<stars;i++)setTimeout(()=>{sp[i].className='on';sfx.stamp(i);const r=sp[i].getBoundingClientRect();starBurst(r.left+r.width/2,r.top+r.height/2,18,380)},350+i*330);
}
$('#btnNext').addEventListener('click',()=>{
  ensureAudio();sfx.click();
  if(G.chal&&G.idx>=G.list.length-1){showFinal();return}
  G.idx=(G.idx+1)%G.list.length;startChar(G.list[G.idx]);
});
$('#btnAgain').addEventListener('click',()=>{ensureAudio();sfx.click();startChar(G.list[G.idx])});
$('#btnList').addEventListener('click',()=>{ensureAudio();sfx.click();$('#result').hidden=true;PL=null;show('s-chars')});
$('#playBack').addEventListener('click',()=>{ensureAudio();sfx.click();$('#result').hidden=true;PL=null;drawing=null;scratchStop();show('s-chars')});
$('#btnRedo').addEventListener('click',()=>{ensureAudio();sfx.click();if(PL&&!PL.done)startChar(PL.ch)});
$('#btnShow').addEventListener('click',()=>{
  ensureAudio();sfx.click();if(!PL||PL.done||PL.demo)return;
  if(G.mode==='easy'){PL.cur=0;PL.ink=[];buildDots();startDemo();}
  else{PL.hint=performance.now();PL.misses++;bubble('ヒント！ （★が へるよ）','good')}
});
function showFinal(){
  const tot=G.results.reduce((a,r)=>a+(r?r.stars:0),0),max=G.list.length*3;
  $('#result').hidden=false;
  $('#resTitle').textContent=tot>=max?'かきじゅん はかせ！':tot>=max*.7?'すばらしい！':'がんばったね！';
  $('#resMsg').textContent=`ぜんぶで ★ ${tot} / ${max}`;
  const sp=[...$('#resStars').children];sp.forEach(s=>s.className='');
  const st=tot>=max?3:tot>=max*.7?2:1;stampStars(st);
  const fl=$('#finalList');fl.hidden=false;fl.innerHTML=G.results.map(r=>`<div><span class="g">${r.ch}</span><span class="s">${'★'.repeat(r.stars)}</span></div>`).join('');
  $('#btnNext').hidden=true;$('#btnAgain').hidden=true;$('#btnList').textContent='もどる';
  sfx.fanfare(true);flash();confetti(260);fireworks(16,5000,true);
  setTimeout(()=>{launch(FW*.5,'heart',true)},800);
}

/* ================= title demo ================= */
const titleCv=$('#titleCv');let tctx=null,tS=0;
const TD={list:['あ','山','花','ネ','木','さ','犬','カ'],i:0,t0:0};
function renderTitle(now){
  const S=Math.round(titleCv.getBoundingClientRect().width);if(!S)return;
  if(S!==tS){tS=S;tctx=sizeCanvas(titleCv,S)}
  const c=tctx;c.setTransform(DPR*S/109,0,0,DPR*S/109,0,0);drawSheet(c);
  if(!TD.t0)TD.t0=now;
  const g=geom(TD.list[TD.i]);drawGuide(c,g);
  let t=now-TD.t0;
  for(let i=0;i<g.strokes.length;i++){const st=g.strokes[i],d=demoDur(st)*.8;
    if(t<=0)break;const p=Math.min(1,t/d);const tip=drawInk(c,st,p,INK);
    if(p<1){c.fillStyle='rgba(255,200,61,.5)';circle(c,tip[0],tip[1],5);c.fill()}
    t-=d+120}
  if(t>0){drawHana(c,t/900);if(t>2600){TD.i=(TD.i+1)%TD.list.length;TD.t0=now}}
}

/* ================= loop ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  drawBg(now);updFx(dt);drawFx();
  if(curScreen==='s-play'&&PL)renderPlay(now);
  else if(curScreen==='s-title')renderTitle(now);
  else if(curScreen==='s-mode')renderModeMinis(now);
  requestAnimationFrame(loop);
}
sizeBg();sizeFx();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
requestAnimationFrame(loop);

/* ================= debug ================= */
if(/[?&]dbg/.test(location.search)){
  window.dbg={
    go(lv,mode,i){G.lv=lv;G.mode=mode;G.chal=false;G.list=LEVELS[lv].split('');G.idx=i||0;G.results=[];startPlay()},
    chal(lv,mode){G.lv=lv;G.mode=mode;show('s-chars');$('#btnChal').click()},
    skipDemo(){if(PL)PL.demo=null},
    stroke(){if(PL&&!PL.done){PL.demo=null;handleStroke(PL.g.strokes[PL.cur].pts.map(p=>[p[0]+rand(-1,1),p[1]+rand(-1,1)]))}},
    wrong(){if(PL&&!PL.done){PL.demo=null;const S=PL.g.strokes;const j=Math.min(S.length-1,PL.cur+1);handleStroke(j>PL.cur?S[j].pts:S[PL.cur].pts.slice().reverse())}},
    solve(){if(!PL)return;PL.demo=null;const f=()=>{if(PL&&!PL.done){dbg.stroke();setTimeout(f,250)}};f()},
    get PL(){return PL},G,
  };
}
</script>
