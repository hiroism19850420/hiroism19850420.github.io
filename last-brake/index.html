// ───────── 物理（1ミリ秒刻みの決定的シミュレーション） ─────────
function compile(def) {
  const c = { def, id: def.id, name: def.name, theme: def.theme || 'field', v0: def.v0, len: def.len, x0: 200, guide: !!def.guide };
  c.edge = c.x0 + HALF + def.len;
  c.patches = (def.patches || []).map(p => ({ type: p.type, a: c.edge - p.from, b: c.edge - p.to }));
  c.slopes = (def.slopes || []).map(s => ({ a: c.edge - s.from, b: c.edge - s.to, dh: s.dh }));
  c.h0 = -c.slopes.reduce((t, s) => t + s.dh, 0);
  c.night = c.theme === 'night';
  const drop = c.slopes.reduce((t, s) => t + Math.max(0, -s.dh), 0);
  const vmax = Math.sqrt(c.v0 * c.v0 + 2 * G * drop);
  const minMul = c.patches.reduce((m, p) => Math.min(m, SURF[p.type].mul), 1);
  const s1 = vmax * vmax / (2 * A * Math.max(minMul, 0.3));
  c.lead = clamp(240 + (s1 - 250) * 0.55, 240, 600);
  c.zoom = clamp(1 - (s1 - 380) / 1600, 0.76, 1);
  return c;
}
function hAt(c, x) {
  if (x >= c.edge) return 0;
  let h = c.h0;
  for (const s of c.slopes) { if (x >= s.b) h += s.dh; else if (x > s.a) h += s.dh * (x - s.a) / (s.b - s.a); }
  return h;
}
function gradeAt(c, x) { for (const s of c.slopes) if (x > s.a && x < s.b) return s.dh / (s.b - s.a); return 0; }
function patchAt(c, x) { for (const p of c.patches) if (x >= p.a && x < p.b) return p.type; return null; }
function mulAt(c, x) { const p = patchAt(c, x); return p ? SURF[p].mul : 1; }
function mkBody(c, tPress = Infinity) { return { x: c.x0, v: c.v0, t: 0, tPress, braking: false, st: 'move' }; }
function stepBody(b, c, until) {
  let guard = 0;
  while (b.st === 'move' && b.t < until - 1e-9 && guard++ < 400000) {
    if (!b.braking && b.t >= b.tPress) b.braking = true;
    let h = Math.min(SUB, until - b.t);
    if (!b.braking && b.t + h > b.tPress) h = b.tPress - b.t;
    let a = -G * gradeAt(c, b.x);
    if (b.braking) a -= A * mulAt(c, b.x);
    let v2 = b.v + a * h;
    if (b.braking && v2 <= 0 && a < 0) {
      const tau = b.v / -a; b.x += b.v * tau + 0.5 * a * tau * tau; b.v = 0; b.t += tau; b.st = 'stop'; break;
    }
    if (!b.braking && v2 < 40) v2 = 40;
    b.x += (b.v + v2) * 0.5 * h; b.v = v2; b.t += h;
    if (b.x > c.edge) b.st = 'fly';
  }
}
function simFinal(c, tPress) { const b = mkBody(c, tPress); stepBody(b, c, 200); return b; }
function finalD(c, b) { return b.st === 'fly' ? -1e9 : c.edge - (b.x + HALF); }
function tEdge(c) { const b = mkBody(c); stepBody(b, c, 200); return b.t; }
// 止まる位置が d cm になる押し時刻を、二分探索で求める
function findPress(c, d) {
  let lo = 0, hi = tEdge(c);
  for (let i = 0; i < 46; i++) { const m = (lo + hi) / 2; if (finalD(c, simFinal(c, m)) > d) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
function frontAt(c, t) { const b = mkBody(c); stepBody(b, c, t); return b.x + HALF; }

// ランダムなコース（れんぞく・きょうの1本）
function genCourse(r, L, id, name) {
  const len = Math.round(1800 + r() * 1100 + Math.min(L, 10) * 40);
  const v0 = Math.round(clamp(480 + L * 22 + (r() - 0.5) * 120, 450, 920));
  const patches = [], slopes = [];
  const pool = L >= 6 ? ['wet', 'sand', 'ice', 'snow'] : ['wet', 'sand'];
  const n = L < 1 ? 0 : L < 4 ? 1 : 2;
  let cursor = 40 + r() * 80;
  for (let i = 0; i < n; i++) {
    const type = pool[r() * pool.length | 0], length = Math.round(80 + r() * 240), to = Math.round(cursor), from = to + length;
    if (from > 650) break;
    patches.push({ type, from, to }); cursor = from + 60 + r() * 120;
  }
  if (L >= 3 && r() < 0.6) {
    const from = Math.round(Math.min(len - 200, 900 + r() * 600)), to = Math.round(Math.max(700, from - 300 - r() * 300));
    const down = r() < 0.65; slopes.push({ from, to, dh: down ? -Math.round(60 + r() * 90) : Math.round(30 + r() * 50) });
  }
  const night = L >= 6 && L % 7 === 6;
  const theme = night ? 'night' : patches.some(p => p.type === 'ice' || p.type === 'snow') ? 'snow' : slopes.length ? 'autumn' : patches.length ? 'rain' : 'field';
  return { id, name, len, v0, patches, slopes, theme };
}
function todayKey() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }

// ───────── 音 ─────────
const AU = {
  ctx: null, muted: SV.muted,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const c = this.ctx = new C();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 0.85;
    this.lp = c.createBiquadFilter(); this.lp.type = 'lowpass'; this.lp.frequency.value = 18000;
    const comp = c.createDynamicsCompressor(); this.master.connect(this.lp); this.lp.connect(comp); comp.connect(c.destination);
    const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
    const loop = (rate, type, f, q) => {
      const n = c.createBufferSource(); n.buffer = b; n.loop = true; n.playbackRate.value = rate;
      const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
      const g = c.createGain(); g.gain.value = 0; n.connect(fl); fl.connect(g); g.connect(this.master); n.start();
      return { f: fl, g };
    };
    this.rumble = loop(1, 'lowpass', 180, 0.8);
    this.wind = loop(0.7, 'bandpass', 900, 0.6);
    this.rain = loop(1.3, 'highpass', 3000, 0.5);
    const o1 = c.createOscillator(), o2 = c.createOscillator(); o1.type = 'sawtooth'; o2.type = 'square';
    o1.frequency.value = 2100; o2.frequency.value = 2147;
    const sf = c.createBiquadFilter(); sf.type = 'bandpass'; sf.frequency.value = 2500; sf.Q.value = 5;
    const sg = c.createGain(); sg.gain.value = 0;
    o1.connect(sf); o2.connect(sf); sf.connect(sg); sg.connect(this.master); o1.start(); o2.start();
    this.sq = { o1, o2, f: sf, g: sg };
    if (this.pendingWeather) this.weather(this.pendingWeather);
    document.addEventListener('visibilitychange', () => { if (!this.ctx) return; document.hidden ? this.ctx.suspend() : this.ctx.resume(); });
  },
  mute(m) { this.muted = m; SV.muted = m; save(); if (this.ctx) this.set(this.master.gain, m ? 0 : 0.85, 0.05); },
  set(p, v, t = 0.04) { if (this.ctx) p.setTargetAtTime(v, this.ctx.currentTime, t); },
  tone(f, dur, o = {}) {
    if (!this.ctx) return; const c = this.ctx, t = o.when != null ? o.when : c.currentTime + (o.at || 0);
    const os = c.createOscillator(), g = c.createGain(); os.type = o.type || 'sine';
    os.frequency.setValueAtTime(f, t); if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(o.vol || 0.25, t + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    os.connect(g); g.connect(this.master); os.start(t); os.stop(t + dur + 0.05);
  },
  burst(dur, o = {}) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + (o.at || 0);
    const n = c.createBufferSource(); n.buffer = this.noise; n.playbackRate.value = o.rate || 1;
    const fl = c.createBiquadFilter(); fl.type = o.type || 'lowpass'; fl.frequency.value = o.f || 800; fl.Q.value = o.q || 1;
    if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(o.vol || 0.3, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(fl); fl.connect(g); g.connect(this.master); n.start(t, Math.random()); n.stop(t + dur + 0.05);
  },
  slow(k) { if (this.ctx && isFinite(k)) this.set(this.lp.frequency, 18000 - 16000 * k, 0.08); },
  weather(kind) { this.pendingWeather = kind || 'none'; if (!this.ctx) return; this.set(this.rain.g.gain, kind === 'rain' ? 0.05 : 0, 0.3); },
  roll(k, ts) { if (!this.ctx) return; this.set(this.rumble.g.gain, 0.32 * k * (0.4 + 0.6 * ts)); this.set(this.rumble.f.frequency, 110 + 260 * k * ts);
    this.set(this.wind.g.gain, 0.12 * k * k * ts); this.set(this.wind.f.frequency, 500 + 900 * k); },
  squeal(k, ts, soft) { if (!this.ctx) return; const j = 1 + (Math.random() - 0.5) * 0.04;
    this.set(this.sq.g.gain, k > 0 ? (0.03 + 0.07 * k) * (soft ? 0.35 : 1) : 0, k > 0 ? 0.03 : 0.015);
    const f = (1700 + 900 * k) * (0.55 + 0.45 * ts) * j; this.set(this.sq.o1.frequency, f, 0.02); this.set(this.sq.o2.frequency, f * 1.022, 0.02); this.set(this.sq.f.frequency, f * 1.15, 0.02); },
  clack(k) { this.burst(0.035, { type: 'bandpass', f: 2200, q: 2, vol: 0.16 + 0.12 * k }); this.tone(160, 0.07, { type: 'triangle', vol: 0.12 + 0.1 * k }); },
  heart(big) { const v = big ? 0.55 : 0.32; this.tone(72, 0.13, { vol: v }); this.tone(60, 0.15, { vol: v * 0.7, at: 0.15 }); },
  clunk() { this.burst(0.09, { type: 'bandpass', f: 900, q: 1.5, vol: 0.4 }); this.tone(190, 0.12, { type: 'square', vol: 0.08, f2: 120 }); },
  squeak() { this.tone(2900, 0.09, { type: 'square', vol: 0.05, f2: 3600 }); },
  creak() { this.tone(300 + Math.random() * 120, 0.25, { type: 'sawtooth', vol: 0.035, f2: 220 }); },
  meow(at = 0) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(560, t); o.frequency.linearRampToValueAtTime(980, t + 0.09); o.frequency.linearRampToValueAtTime(620, t + 0.38);
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.6; f.frequency.setValueAtTime(1100, t); f.frequency.linearRampToValueAtTime(1700, t + 0.1); f.frequency.linearRampToValueAtTime(900, t + 0.38);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.2, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    o.connect(f); f.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.5);
  },
  notes(list, type = 'triangle', vol = 0.2) { list.forEach(([f, at, d]) => { this.tone(f, d || 0.5, { type, vol, at }); this.tone(f * 2, (d || 0.5) * 0.6, { type: 'sine', vol: vol * 0.25, at }); }); },
  ding() { this.notes([[1047, 0, 0.6], [1568, 0.09, 0.8]]); },
  soft() { this.notes([[784, 0, 0.5], [988, 0.1, 0.6]], 'triangle', 0.14); },
  perfect() { this.notes([[1047, 0], [1319, 0.07], [1568, 0.14], [2093, 0.21, 0.9]], 'triangle', 0.2); this.burst(0.6, { type: 'highpass', f: 6000, vol: 0.08, at: 0.2 }); },
  fanfare() { this.notes([[784, 0, 0.2], [1047, 0.12, 0.2], [1319, 0.24, 0.2], [1568, 0.36, 0.35], [1319, 0.52, 0.15], [1568, 0.62, 1.0]], 'square', 0.07); this.notes([[523, 0.36, 0.9], [659, 0.62, 1]], 'triangle', 0.12); },

    b.draw = (col = o.color || 0xffd75e, dis = false) => {
      g.clear(); const r = Math.min(22, h / 2);
      g.fillStyle(0x000000, 0.15); g.fillRoundedRect(-w / 2 + 3, -h / 2 + 7, w, h, r);
      g.fillStyle(dis ? 0xe6dccd : col); g.fillRoundedRect(-w / 2, -h / 2, w, h, r);
      g.fillStyle(0xffffff, dis ? 0.15 : 0.35); g.fillRoundedRect(-w / 2 + 8, -h / 2 + 6, w - 16, h * 0.28, r / 2);
      g.lineStyle(4, OL); g.strokeRoundedRect(-w / 2, -h / 2, w, h, r);
    };
    b.draw();
    c.add(g);
    b.t = this.T(0, o.sub ? -11 : 0, label, o.size || 28); c.add(b.t);
    if (o.sub) { b.st = this.T(0, 20, o.sub, 17, '#7a5a44', { fontStyle: '700' }); c.add(b.st); }

  buyOrEquip(kind, it) {
    const key = (kind === 'hat' ? 'hat_' : 'col_') + it.id;
    if (!SV.owned.includes(key)) {
      if (SV.fish < it.price) { AU.nope(); this.toast('さかなが たりない'); this.tweens.add({ targets: this.shopC, x: { from: -12, to: 0 }, duration: 300, ease: 'Bounce.out' }); return; }
      SV.fish -= it.price; SV.owned.push(key); AU.buy(); this.heartE.emitParticleAt(this.cat.x, this.cat.y - 60, 6);
    } else AU.pop();
    if (kind === 'hat') SV.hat = it.id; else SV.color = it.id;
    save(); this.applyLook(); this.showShop();

  fmt(d) { return d == null ? '—' : d < 0 ? 'はみだし ' + (-d).toFixed(1) + 'cm' : d.toFixed(1) + 'cm'; }

  drawGauge(v) {
    const g = this.gaugeG; g.clear();
    const cx = 120, cy = 668, r = 64;
    g.fillStyle(0xfffaf0, 0.92); g.beginPath(); g.arc(cx, cy, r + 14, Math.PI, 0, false); g.closePath(); g.fillPath();
    g.lineStyle(4, OL); g.strokePath();
    [[0x8fd06f, 0, 0.45], [0xffd75e, 0.45, 0.72], [0xf27b6b, 0.72, 1]].forEach(([c, a0, a1]) => {
      g.lineStyle(12, c); g.beginPath(); g.arc(cx, cy, r - 4, Math.PI * (1 + a0), Math.PI * (1 + a1), false); g.strokePath();
    });
    const a = Math.PI * (1 + clamp(v / 1000, 0, 1));
    g.lineStyle(5, OL); g.lineBetween(cx, cy, cx + Math.cos(a) * (r - 12), cy + Math.sin(a) * (r - 12));
    g.fillStyle(OL); g.fillCircle(cx, cy, 7);
  }

    for (let i = this.buttons.length - 1; i >= 0; i--) {

      if (Math.abs(px - b.x) <= b.w / 2 && Math.abs(py - b.y) <= b.h / 2) {

    const q = Object.assign({}, this.P); stepBody(q, this.course, q.t + 200);
    this.pred = q; this.predD = finalD(this.course, q);
    AU.clunk(); vib(18); this.setCat('scared'); this.cameras.main.shake(90, 0.003);
    this.tweens.add({ targets: this.hint, alpha: 0, duration: 300 });

  update(time, delta) {
    const dtR = Math.min(delta, 50) / 1000, t = time / 1000;
    this.lastUpd = performance.now();
    if (!this.course) return;
    this.drawFlag(t);
    const running = this.state === 'run';
    drawTail(this.tailG, Math.sin(t * (running ? 9 : 3)) * (running ? 0.6 : 1), this.catAttached);
    this.fishList.forEach(f => { if (!f.got && f.img) f.img.y = f.y + Math.sin(t * 3 + f.ph) * 4; });

    // プレイヤーが先に止まっても、ゴーストは最後まで走らせる
    if (this.state !== 'run' && this.G && this.G.st === 'move' && this.state !== 'menu' && this.state !== 'intro') this.stepGhost(this.G.t + dtR, dtR);
    if (this.state === 'run') this.updRun(dtR);
    else if (this.state === 'settle') this.updSettle(dtR);
    else if (this.state === 'fall') this.updFall(dtR);
    else {
      AU.roll(0, 1); AU.squeal(0, 1);
      if (this.catAttached) { this.catLean += (0 - this.catLean) * damp(6, dtR); this.placeCat(); this.cat.y += Math.sin(t * 3) * 1.2; }
      else if (this.catLanded) { this.cat.y = this.landY + Math.sin(t * 2) * 3; this.cat.rotation = Math.sin(t * 1.6) * 0.08; }
      if (this.state === 'menu') this.setCat(Math.sin(t * 1.3) > 0.97 ? 'wind' : 'norm');
    }
    if (this.state !== 'run') this.ts += (1 - this.ts) * damp(6, dtR);
    const sk = clamp((1 - this.ts) / 0.75, 0, 1);
    this.vigG.setAlpha(sk); AU.slow(sk * 0.6);
    const c = this.cameras.main, k = this.camK;
    c.setZoom(k.z); c.centerOn(k.x, k.y);
    if (this.course.night) this.drawNight(t);
    const sx = c.midPoint.x;
    this.bgClouds.tilePositionX = sx * 0.06 + t * 6;
    this.bgMount.tilePositionX = sx * 0.12;
    this.bgSea.tilePositionX = sx * 0.3;
    this.bgStars.tilePositionX = sx * 0.03;
    this.sun.x = 1010 - (sx * 0.02) % 200;
    if (this.hudC.visible && this.P) this.drawMini();
  }

  drawNight(t) {
    this.flyG.clear();
    if (this.state === 'menu') return;
    let cx, cy, r;
    if (this.catAttached) { cx = this.cart.x + 110; cy = this.cart.y - 60; r = 300 + Math.sin(t * 9) * 5; }
    else { cx = this.cat.x; cy = this.cat.y - 40; r = 240; }
    if ((this.state === 'result' || this.state === 'settle') && this.catAttached) { cx = this.cart.x + HALF; r = 360; }
    // ワールド座標 → 画面に貼りついた幕の中の座標
    const k = this.camK, lx = cx - k.x + W / 2 + (BGW - W) / 2, ly = cy - k.y + H / 2 + (BGH - H) / 2;
    const rt = this.darkRT; rt.clear(); rt.fill(0x0a0e2a, 0.92);
    this.lightImg.setScale(2 * r / 256).setPosition(lx, ly); rt.erase(this.lightImg);
    const f = this.flyG, E = this.course.edge;
    this.flies.forEach(q => {
      const x = E - 1400 + q.dx * 1700 + Math.sin(t * q.s + q.p) * 40, y = RY - 60 - q.dy * 160 + Math.cos(t * q.s * 1.3 + q.p) * 20;
      const a = 0.5 + 0.5 * Math.sin(t * 3 + q.p * 2);
      f.fillStyle(0xfff6a0, 0.25 * a); f.fillCircle(x, y, 9); f.fillStyle(0xfffbd0, a); f.fillCircle(x, y, 2.5);
    });
  }

  updRun(dtR) {
    const c = this.course, P = this.P;
    const near = this.pressed && this.predD < 70 && ((this.pred.st === 'fly' ? c.edge : this.pred.x) - P.x) < 220;
    this.tsT = near ? 0.25 : 1;
    this.ts += (this.tsT - this.ts) * damp(10, dtR);
    const dt = dtR * this.ts, x0 = P.x; this.simT += dt;
    stepBody(P, c, this.simT);
    if (this.G) this.stepGhost(this.simT, dt);
    if (P.braking && !this.pressed) this.onPressed();
    const x = P.x, v = P.v;
    this.placeOnRail(this.cart, x);
    this.wheels.forEach(w => w.rotation += (x - x0) / 17);
    const jf = Math.floor((x + WHEEL) / JOINT), jr = Math.floor((x - WHEEL) / JOINT), k = v / 800;
    if (jf !== this.jF && x + WHEEL < c.edge) { this.jF = jf; AU.clack(k); }
    if (jr !== this.jR) { this.jR = jr; AU.clack(k * 0.8); }
    // さかな
    while (this.fishIdx < this.fishList.length && x + HALF >= this.fishList[this.fishIdx].x) {
      const f = this.fishList[this.fishIdx]; if (f.gold && x + HALF - c.edge >= SAFE) break;
      this.collectFish(f, this.fishIdx); this.fishIdx++;
    }
    // 地形の上の演出
    const pt = patchAt(c, x);
    if (pt !== this.curPatch) { this.curPatch = pt; if (pt === 'wet') AU.splash(); else if (pt === 'sand' || pt === 'snow') AU.crunch(); else if (pt === 'ice') AU.ting(); }
    if (pt && v > 40 && Math.random() < 0.8) {
      const wx = x - WHEEL, wy = this.railY(wx);
      if (pt === 'wet') this.waterE.emitParticleAt(wx, wy, 2); else if (pt === 'snow') this.snowE.emitParticleAt(wx, wy, 1);
      else if (pt === 'sand') this.dustE.emitParticleAt(wx, wy, 1); else if (pt === 'ice' && Math.random() < 0.3) this.starE.emitParticleAt(wx, wy, 1);
    }
    if (P.st === 'fly') { this.startFall('fly', v); return; }
    AU.roll(k, this.ts);
    const gap = c.edge - (x + HALF);
    if (this.pressed) {
      const soft = pt === 'ice' || pt === 'wet';
      AU.squeal(v > 0 ? k : 0, this.ts, soft);
      if (v > 0 && pt !== 'snow') {
        const n = soft ? 0 : 1;
        if (Math.random() < 0.9) this.sparkE.emitParticleAt(x - WHEEL - 10, this.railY(x - WHEEL) - 2, n + (k * 3 | 0));
        if (Math.random() < 0.9) this.sparkE.emitParticleAt(x + WHEEL - 10, this.railY(x + WHEEL) - 2, n + (k * 2 | 0));
      }
      this.catLean += (0.32 - this.catLean) * damp(8, dtR);
      if (this.tsT < 1) { this.heartT -= dtR; if (this.heartT <= 0) { this.heartT = 0.62; AU.heart(true); } }
      if (P.st === 'stop') { AU.squeal(0, 1); AU.squeak(); this.onStop(); return; }
    } else {
      this.catLean += (-0.06 - this.catLean) * damp(6, dtR);
      this.dustT -= dtR; if (this.dustT <= 0 && !pt) { this.dustT = 0.07; this.dustE.emitParticleAt(x - WHEEL - 14, this.railY(x - WHEEL), 1); }
      if (gap < 1100) { this.heartT -= dtR; if (this.heartT <= 0) { this.heartT = 0.24 + 0.5 * clamp(gap / 1100, 0, 1); AU.heart(false); } }
    }
    this.placeCat();
    this.drawGauge(v);
    let offT = c.lead, yT = this.cart.y - 156, zT = c.zoom;
    if (this.tsT < 1) { offT = HALF / 2 + (c.edge - x) / 2; yT = RY - 70; zT = 1.4; }
    const kk = this.camK; kk.off += (offT - kk.off) * damp(4, dtR);
    kk.x = x + kk.off; kk.y += (yT - kk.y) * damp(4, dtR); kk.z += (zT - kk.z) * damp(3, dtR);
  }

  stepGhost(until, dt) {
    const G = this.G, c = this.course;
    stepBody(G, c, until);
    this.placeOnRail(this.ghost, Math.min(G.x, c.edge + HALF));
    this.ghostWheels.forEach(w => w.rotation += G.v * dt / 17);
    this.ghostT.setPosition(this.ghost.x, this.ghost.y - 130);
  }
  collectFish(f, i) {
    f.got = true; this.runFish += f.gold ? 5 : 1;
    AU.fish(i, f.gold); vib(8);
    this.starE.emitParticleAt(f.x, f.y, f.gold ? 10 : 4);
    this.tweens.add({ targets: f.img, y: f.y - 70, alpha: 0, scale: f.img.scale * 1.4, duration: 420, ease: 'Cubic.out' });
  }

  onStop() {
    const c = this.course, x = this.P.x, o = x + HALF - c.edge;
    this.placeOnRail(this.cart, x); this.placeCat(); this.drawGauge(0); AU.roll(0, 1);
    if (o <= 0) { this.endRun('stop', -o); return; }
    this.state = 'settle'; this.setT = 0; this.o = o; this.survive = o < SAFE;
    const q = Math.min(o / SAFE, 1);
    this.tiltMax = this.survive ? 0.035 + 0.16 * q * q : 0.2;
    this.hold = this.survive ? 0.2 + 0.9 * q * q : 0.8 + Math.random() * 0.35;
    this.tipA = 0; this.tipV = 0; this.backPlayed = false; this.heartT = 0.15;
    this.setCat('scared');
  }
  pivot(th) {
    const px = HALF - this.o, E = this.course.edge;
    this.cart.rotation = th; this.cart.x = E - px * Math.cos(th); this.cart.y = RY - px * Math.sin(th);
  }
  updSettle(dtR) {
    const t = this.setT += dtR;
    let th;
    if (t < 0.35) { th = this.tiltMax * (1 - Math.pow(1 - t / 0.35, 3)); if (t - dtR <= 0) AU.creak(); }
    else if (t < 0.35 + this.hold) {
      th = this.tiltMax + Math.sin(t * 38) * 0.005;
      if (Math.random() < 0.12) this.pebE.emitParticleAt(this.course.edge - 4 + Math.random() * 6, RY + 10, 1);
      this.heartT -= dtR; if (this.heartT <= 0) { this.heartT = 0.42; AU.heart(true); vib(10); }
      this.creakT -= dtR; if (this.creakT <= 0) { this.creakT = 0.5; AU.creak(); }
    } else {
      const u = t - 0.35 - this.hold;
      if (this.survive) {
        if (!this.backPlayed) { this.backPlayed = true; AU.clunk(); }
        th = this.tiltMax * Math.exp(-5 * u) * Math.abs(Math.cos(11 * u));
        if (u > 0.6) { this.pivot(0); this.placeCat(); this.endRun('stop', -this.o); return; }
      } else {
        this.tipV += dtR * 5; this.tipA += this.tipV * dtR; th = this.tiltMax + this.tipA;
        if (th > 0.55) { this.pivot(th); this.startFall('tip', 0); return; }
      }
    }
    this.pivot(th);
    this.catLean += (-0.3 - this.catLean) * damp(6, dtR);
    this.placeCat();
    const kk = this.camK, E = this.course.edge;
    kk.x += (E - kk.x) * damp(3, dtR); kk.y += (RY - 70 - kk.y) * damp(3, dtR); kk.z += (1.65 - kk.z) * damp(2.5, dtR);
  }

  startFall(kind, v) {
    this.state = 'fall'; this.fallT = 0; this.sunk = false; this.catLanded = false; this.umbOpen = false; this.resShown = false;
    AU.squeal(0, 1); AU.roll(0, 1); vib([30, 40, 30]);
    this.cvx = kind === 'fly' ? v : 70; this.cvy = kind === 'fly' ? -30 : 80; this.cav = kind === 'fly' ? 0.9 : 2.6;
    this.placeCat();
    this.catAttached = false; this.cat.setDepth(60); this.catLean = 0;
    this.setCat('shock');
    this.catVx = kind === 'fly' ? v * 0.4 : 90; this.catVy = -460;
    AU.whistle(); AU.meow(0.05);
    this.gaugeG.setVisible(false); this.gaugeT.setVisible(false); this.hint.setVisible(false);
    // 取ったさかなは にげる
    this.fishList.forEach(f => { if (f.got && f.img) { this.tweens.killTweensOf(f.img); f.img.setAlpha(1).setPosition(this.cart.x, this.cart.y - 80).setScale(0.8);
      this.tweens.add({ targets: f.img, x: this.cart.x + 200 + Math.random() * 300, y: this.cart.y + 300, angle: 360, alpha: 0, duration: 1100 + Math.random() * 500, ease: 'Quad.in' }); } });
  }
  updFall(dtR) {
    const t = this.fallT += dtR, c = this.cart;
    if (!this.sunk) {
      this.cvy += 1700 * dtR; c.x += this.cvx * dtR; c.y += this.cvy * dtR; c.rotation += this.cav * dtR;
      if (c.y > this.cloudTop + 34) {
        this.sunk = true; c.setVisible(false);
        this.puffE.emitParticleAt(c.x, this.cloudTop + 10, 18); AU.puff(); this.cameras.main.shake(160, 0.004);
      }
    }
    const k = this.cat;
    if (!this.umbOpen && t > 0.42) { this.umbOpen = true; this.umbG.setVisible(true); AU.pop(); this.setCat('norm');
      this.umbG.setScale(0.2); this.tweens.add({ targets: this.umbG, scale: 1, duration: 260, ease: 'Back.out' }); }
    if (!this.catLanded) {
      if (this.umbOpen) { this.catVy += (95 - this.catVy) * damp(5, dtR); this.catVx *= 1 - damp(1.6, dtR); k.rotation = Math.sin(t * 2.6) * 0.16; }
      else { this.catVy += 1500 * dtR; k.rotation += dtR * 5; }
      k.x += this.catVx * dtR; k.y += this.catVy * dtR;
      this.landY = this.cloudTop - 16;
      if (k.y >= this.landY && this.umbOpen) { this.catLanded = true; k.y = this.landY; this.puffE.emitParticleAt(k.x, this.cloudTop + 14, 6); this.setCat('happy'); AU.meow(); }
    } else { k.y = this.landY + Math.sin(t * 2) * 3; k.rotation = Math.sin(t * 1.6) * 0.08; }
    if (!this.resShown && t > 1.15) { this.resShown = true; this.endRun('fall'); }
    const kk = this.camK, E = this.course.edge;
    kk.x += (E + 60 - kk.x) * damp(2.5, dtR); kk.y += (RY - 50 - kk.y) * damp(2.5, dtR); kk.z += (1.0 - kk.z) * damp(2.5, dtR);
  }

  drawRuler(front, edge) {
    const g = this.rulerG; g.clear();
    const a = Math.min(front, edge), b = Math.max(front, edge), y = RY + 20;
    g.lineStyle(2.5, OL, 0.85);
    for (let yy = RY - 104; yy < y; yy += 10) g.lineBetween(front, yy, front, yy + 5);
    for (let yy = RY + 8; yy < y; yy += 10) g.lineBetween(edge, yy, edge, yy + 5);
    if (b - a < 0.5) return;
    g.fillStyle(0xffd75e); g.fillRect(a, y, b - a, 12); g.lineStyle(2.5, OL); g.strokeRect(a, y, b - a, 12);
    g.lineStyle(1.5, OL);
    for (let i = 0; edge - i >= a || edge + i <= b; i += 5) {
      const h = i % 10 === 0 ? 7 : 4;
      if (edge - i >= a) g.lineBetween(edge - i, y, edge - i, y + h);
      if (edge + i <= b && i) g.lineBetween(edge + i, y, edge + i, y + h);
    }
  }

  // ───── 結果 ─────
  starsFor(d) { return d < 0 ? 3 : d < 3 ? 3 : d < 15 ? 2 : d < 60 ? 1 : 0; }
  pts(d) { return d < 0 ? 1000 + Math.round(40 * -d) : Math.round(1000 * Math.exp(-d / 25)); }
  mult() { return 1 + 0.1 * Math.min(this.E.streak, 10); }

  endRun(kind, d) {
    this.state = 'result'; this.resAt = this.time.now;
    const c = this.course, fell = kind === 'fall';
    this.gaugeG.setVisible(false); this.gaugeT.setVisible(false); this.hint.setVisible(false);
    const stars = fell ? 0 : this.starsFor(d), fishGot = fell ? 0 : this.runFish;
    SV.fish += fishGot;
    let rank = '', color = '#ffd75e', sub = '', sub2 = '', newRec = false;
    if (!fell) {
      const front = this.cart.x + HALF; this.drawRuler(front, c.edge);
      const mid = (front + c.edge) / 2, ad = Math.abs(d), z = ad < 40 ? 1.6 : ad < 150 ? 1.3 : clamp(1280 / (ad + 900), 0.8, 1.1);
      this.tweens.add({ targets: this.camK, x: mid - 260 / z, y: RY - 110, z, duration: 700, ease: 'Sine.out' });
    }
    if (fell) {
      this.resLabel.setText(''); this.resVal.setText('おっこちた〜').setFontSize(62).setColor('#ffffff');
      sub = '（ネコは ぶじです）'; AU.sad();
    } else {
      this.resLabel.setText(d < 0 ? 'ふちから はみだし' : 'がけまで');
      this.resVal.setText(Math.abs(d).toFixed(1) + 'cm').setFontSize(76).setColor(d < 3 ? '#ffd75e' : '#ffffff');
      const front = this.cart.x + HALF;
      if (d < 0) { rank = 'はみだし セーフ!!'; AU.fanfare(); this.celebrate(70, front); this.setCat('happy'); AU.meow(0.5); vib([20, 30, 20]); }
      else if (d < 3) { rank = 'ピッタリ!!'; AU.perfect(); this.celebrate(55, front); this.setCat('happy'); AU.meow(0.4); vib(25); }
      else if (d < 15) { rank = 'すごい!'; color = '#ffb347'; AU.ding(); this.celebrate(26, front); this.setCat('happy'); AU.meow(0.3); }
      else if (d < 60) { rank = 'いいね!'; color = '#8fd06f'; AU.ding(); this.setCat('wind'); this.heartE.emitParticleAt(this.cat.x, this.cat.y - 60, 3); }
      else if (d < 150) { rank = 'もうすこし'; color = '#79c3ec'; AU.soft(); this.setCat('norm'); }
      else { rank = 'とおすぎ…'; color = '#c9b8a8'; AU.sad(); this.setCat('meh'); }
    }
    this.resFish.setText(fell ? (this.runFish ? 'さかなは にげちゃった' : '') : 'さかな +' + fishGot);
    const btns = [];
    if (this.mode === 'tour') {
      const id = this.def.id, before = STAGES.map((_, i) => this.stageOpen(i)), prevBest = SV.best[id];
      if (!fell && (prevBest == null || d < prevBest)) { newRec = true; SV.best[id] = d; SV.ghost[id] = this.P.tPress; }
      if (stars > (SV.stars[id] || 0)) SV.stars[id] = stars;
      { const n = SV.stars[id] || 0; this.subT.setText('ベスト ' + this.fmt(SV.best[id]) + '   ' + '★'.repeat(n) + '☆'.repeat(3 - n)); }
      STAGES.forEach((_, i) => { if (this.stageOpen(i) && !before[i]) this.time.delayedCall(900, () => { this.toast('ステージ' + (i + 1) + ' ' + STAGES[i].name + ' が ひらいた！', '#6aae5e'); AU.fanfare(); }); });
      if (!fell && !newRec && prevBest != null) sub2 = 'ベストまで あと ' + (d - prevBest).toFixed(1) + 'cm';
      const idx = TOUR.findIndex(t => t.id === id), nx = TOUR[idx + 1];
      btns.push(['マップ', () => this.showMap(), 0xfff3df]);
      if (nx && this.stageOpen(nx.stage)) btns.push(['つぎへ ▶', () => this.startCourse(nx, 'tour'), 0xffd75e]);
      this.retry.setText('タップで もういちど');
    } else if (this.mode === 'daily') {
      const dk = todayKey();
      if (!SV.daily || SV.daily.date !== dk) SV.daily = { date: dk, best: null, ghost: null, tries: 0 };
      SV.daily.tries++;
      if (!fell && (SV.daily.best == null || d < SV.daily.best)) { newRec = true; SV.daily.best = d; SV.daily.ghost = this.P.tPress; }
      sub2 = 'きょうの ベスト ' + this.fmt(SV.daily.best);
      btns.push(['タイトル', () => this.showTitle(), 0xfff3df]);
      if (SV.daily.best != null) btns.push(['シェア', () => this.share(), 0x9fd8f0]);
      this.retry.setText('タップで もういちど');
    } else {
      const E = this.E, fail = fell || d >= 150;
      if (fail) { E.hearts--; E.streak = 0; if (!fell) sub = 'ハートが へった'; }
      else { const p = Math.round(this.pts(d) * this.mult()); E.score += p; sub2 = '+' + p + 'てん' + (E.streak ? '（×' + this.mult().toFixed(1) + '）' : ''); E.streak++; }
      this.heartImgs.forEach((h, i) => h.setTexture(i < E.hearts ? 'heartUI' : 'heartOff'));
      if (fail && this.heartImgs[E.hearts]) this.tweens.add({ targets: this.heartImgs[E.hearts], scale: { from: 1.6, to: 1 }, duration: 400, ease: 'Back.out' });
      this.subT.setText('スコア ' + E.score);
      E.L++;
      if (E.hearts <= 0) {
        E.over = true;
        if (E.score > SV.endlessBest) { SV.endlessBest = E.score; E.newBest = true; }
        this.time.delayedCall(1300, () => this.showGameOver());
        this.retry.setText('');
      } else this.retry.setText('タップで つぎへ');
    }
    save(); this.refreshChips(); if (fishGot) this.bumpFish();
    this.resRank.setText(rank).setColor(color);
    this.resSub.setText(sub); this.resSub2.setText(sub2);
    this.resRec.setVisible(newRec && !fell);
    this.resStars.forEach(s => s.setTexture('starOff').setScale(1).setVisible(this.mode !== 'endless'));
    if (this.mode !== 'endless') for (let i = 0; i < stars; i++) this.time.delayedCall(380 + i * 170, () => { if (this.state !== 'result') return; this.resStars[i].setTexture('starOn').setScale(0.2); this.tweens.add({ targets: this.resStars[i], scale: 1, duration: 300, ease: 'Back.out' }); AU.star(i); });
    this.resC.setVisible(true).setScale(0.6).setAlpha(0);
    this.tweens.add({ targets: this.resC, scale: 1, alpha: 1, duration: 380, ease: 'Back.out' });
    this.clearButtons(this.resBtnC); this.resBtnC.setVisible(true);
    btns.forEach(([l, f, col], i) => this.btn(this.resBtnC, btns.length === 1 ? 295 : 165 + i * 260, 590, 230, 70, l, f, { color: col, size: 26 }));
    this.time.delayedCall(350, () => { if (this.state === 'result') this.retry.setVisible(true); });
  }

  celebrate(n, front) {
    this.confE.emitParticleAt(860, 140, n);
    this.starE.emitParticleAt(front, RY - 40, Math.min(14, n / 3 | 0));
    this.heartE.emitParticleAt(this.cat.x, this.cat.y - 60, 6);
    this.ring.setPosition(this.course.edge, RY - 20).setVisible(true).setScale(0.2).setAlpha(1);
    this.tweens.add({ targets: this.ring, scale: 2.2, alpha: 0, duration: 700, ease: 'Cubic.out' });
  }

  afterResult() {
    if (this.mode === 'endless') { if (!this.E.over) this.nextEndless(); return; }
    this.startCourse(this.def, this.mode);
  }
  leaveRun() {
    AU.roll(0, 1); AU.squeal(0, 1);
    if (this.mode === 'tour') this.showMap(); else this.showTitle();
  }

  // ───── れんぞく ─────
  startEndless() { this.E = { L: 0, hearts: 3, score: 0, streak: 0, seed: (Math.random() * 1e9) | 0, over: false, newBest: false }; this.nextEndless(); }
  nextEndless() { const E = this.E; this.startCourse(genCourse(rng(E.seed + E.L * 7919), E.L, 'endless', ''), 'endless'); }
  showGameOver() {
    if (this.mode !== 'endless' || this.state !== 'result') return;
    const E = this.E;
    this.resLabel.setText('ゲームオーバー'); this.resVal.setText(String(E.score)).setFontSize(76).setColor('#ffd75e');
    this.resRank.setText('てん').setColor('#ffffff');
    this.resFish.setText('ベスト ' + SV.endlessBest); this.resSub.setText(E.newBest ? 'しんきろく！' : ''); this.resSub2.setText(E.L + 'ほん はしった');
    this.resStars.forEach(s => s.setVisible(false)); this.resRec.setVisible(false);
    this.clearButtons(this.resBtnC);
    this.btn(this.resBtnC, 165, 590, 230, 70, 'もういちど', () => this.startEndless(), { color: 0xf7a8c8, size: 26 });
    this.btn(this.resBtnC, 425, 590, 230, 70, 'タイトル', () => this.showTitle(), { color: 0xfff3df, size: 26 });
    this.tweens.add({ targets: this.resC, scale: { from: 0.8, to: 1 }, duration: 300, ease: 'Back.out' });
    if (E.newBest) { AU.fanfare(); this.confE.emitParticleAt(300, 140, 60); } else AU.soft();
  }

  // ───── きょうの1本 ─────
  startDaily() { this.startCourse(genCourse(rng(todayKey()), 7, 'daily', 'きょうの1本'), 'daily'); }
  share() {
    const d = SV.daily, n = this.starsFor(d.best), dt = new Date();
    const text = 'ラスト1秒ブレーキ きょうの1本 ' + (dt.getMonth() + 1) + '/' + dt.getDate() + ' ' + (d.best < 0 ? 'はみだし ' + (-d.best).toFixed(1) + 'cm' : 'がけまで ' + d.best.toFixed(1) + 'cm') + ' ' + '★'.repeat(n) + '☆'.repeat(3 - n);
    const done = () => this.toast('コピーしたよ！', '#6aae5e');
    try {
      if (navigator.share) navigator.share({ text }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => this.toast(text, '#5b3a29'));
      else this.toast(text, '#5b3a29');
    } catch (e) { this.toast(text, '#5b3a29'); }
  }
}

function boot() {
  new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', width: W, height: H, backgroundColor: '#f6e7c8', banner: false,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 2 }, scene: [Main]
  });
}
let booted = false; const go = () => { if (!booted) { booted = true; boot(); } };
Promise.all([document.fonts.load('900 40px "Zen Maru Gothic"'), document.fonts.load('700 20px "Zen Maru Gothic"')]).then(go, go);
setTimeout(go, 2500);
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
