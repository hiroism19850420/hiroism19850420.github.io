<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ヒカリノタネ ぜんしん版</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:min(100vw,calc(100vh*960/544));height:min(100vh,calc(100vw*544/960))}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(#1c2c1c,#000)}
.seed{width:24px;height:24px;border-radius:50%;background:#fff6c0;box-shadow:0 0 30px 10px #ffe680;animation:b 2s infinite}
@keyframes b{50%{transform:translateY(-8px)}}
#name{font-size:22px;padding:8px 12px;border-radius:10px;border:2px solid #ffe680;background:#111;color:#fff;text-align:center;width:200px;outline:none}
#start{font-size:26px;width:70px;height:50px;border-radius:12px;border:none;background:#ffe680;cursor:pointer}
.keys{color:#888;display:flex;gap:10px;font:16px sans-serif}
.keys span{border:1px solid #555;border-radius:6px;padding:3px 9px}
#touch{display:none;position:fixed;inset:0;pointer-events:none}
#pad{position:absolute;left:20px;bottom:20px;display:flex;gap:14px;pointer-events:auto}
#pad span,#jump{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}
#jump{position:absolute;right:28px;bottom:28px;width:90px;height:90px;pointer-events:auto}
#rotate{display:none;position:fixed;inset:0;background:#000;align-items:center;justify-content:center;z-index:9}
.phone{width:40px;height:70px;border:3px solid #ffe680;border-radius:8px;animation:r 2s infinite}
@keyframes r{50%{transform:rotate(-90deg)}}
@media (pointer:coarse){#touch.on{display:block}}
@media (pointer:coarse) and (orientation:portrait){#rotate{display:flex}}
</style>
<script data-goatcounter="https://hiroism.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>
<body>
<div id="wrap"><canvas id="c" width="960" height="544"></canvas></div>
<div id="overlay">
  <div class="seed"></div>
  <input id="name" maxlength="10" placeholder="✎" autocomplete="off">
  <button id="start">▶</button>
  <div class="keys"><span>←</span><span>→</span><span>␣</span></div>
</div>
<div id="touch"><div id="pad"><span>◀</span><span>▶</span></div><div id="jump"></div></div>
<div id="rotate"><div class="phone"></div></div>
<script src="body.js"></script>
<script>
(()=>{'use strict';
// ===== 調整用の数値 =====
const GRAV=1900, WALK=210, ACC=1500, JUMP_V=660;
const WEIGHT_PER=15, WEIGHT_MAX=12;      // 光1個ごとのジャンプ低下と上限
const COYOTE=0.05, BUFFER=0.07, STOMP_BOUNCE=380;
const FPL=5, FINAL_BLOOM=40;             // 犠牲の満開
const QUIET_FPL=1, QUIET_FINAL=6;        // 誰も潰さない控えめな花
const NS_T=4.2, CR_SPEED=110, CR_Y=318;
const DARK_BASE=100, DARK_PER=14, DARK_ALPHA=0.86;   // 暗闇の見える範囲・暗さ(やさしめ)
const HURT_INV=1.5, KNOCK=260, DROP_LIFE=6;   // 無敵時間、はじかれる強さ、散った光が残る秒数
// ========================
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');
const VW=960,VH=544,TS=32,ROWS=17,W=230;
const dk=document.createElement('canvas');dk.width=VW;dk.height=VH;const dkx=dk.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const SKEY='hikari_sprouts',NKEY='hikari_name';
let sprouts=[];try{sprouts=JSON.parse(localStorage.getItem(SKEY)||'[]')}catch(e){}
const nameEl=$('name');nameEl.value=localStorage.getItem(NKEY)||'';
const treeX=213*TS, DARK_A=76*TS, DARK_B=149*TS, CPS=[3,74,97,134,151];
let state='title',map,sh,orbs,plats,crushed,stomps,lights,cpi,P,tr,cr,parts=[],camX=0,T=0,fade=0,flash=0,pname='',quiet=false,finalBloom=0;

// ---------- ステージ ----------
const solid=(x,y)=>(x<0||x>=W)?1:(y<0||y>=ROWS)?0:map[y][x];
function ground(a,b,h){for(let x=a;x<=b;x++)for(let y=ROWS-h;y<ROWS;y++)map[y][x]=1}
function blk(x,y,w,h){for(let i=0;i<w;i++)for(let j=0;j<h;j++)map[y+j][x+i]=1}
function surf(tx){for(let y=0;y<ROWS;y++)if(map[y][tx])return y;return ROWS}
function surfY(tx){const s=surf(tx);return s<ROWS?s*TS:14*TS}
function small(tx,pers,dir=-1){const s={big:0,x:tx*TS,y:0,w:20,h:18,vx:0,vy:0,dir,pers,alive:1,sp:40,t:Math.random()*9,hopCd:0,lead:null,idx:0,strag:0,ride:null};s.y=surfY(Math.floor(tx))-s.h-0.01;sh.push(s);return s}
function bigS(tx,dir=-1,sp=32){const b={big:1,x:tx*TS,y:0,w:64,h:56,vx:0,vy:0,dir,sp,alive:1,t:Math.random()*9,solid:1};b.y=surfY(tx)-b.h-0.01;sh.push(b);plats.push(b);return b}
function proc(tx,n,dir,strag){const b=bigS(tx,dir);for(let i=0;i<n;i++){const s=small(tx-dir*(2+i*1.2),'follow',dir);s.lead=b;s.idx=i;s.strag=(i===strag)}return b}
function buildWorld(){
  map=[];for(let y=0;y<ROWS;y++)map.push(new Uint8Array(W));
  ground(0,20,3);ground(21,30,4);ground(31,44,3);ground(48,72,3);blk(64,12,3,1);
  ground(73,90,3);ground(93,109,3);ground(110,110,4);ground(111,118,5);ground(119,129,3);ground(133,165,3);   // 暗闇のすきまをせまく
  ground(172,172,4);ground(173,173,5);ground(174,175,6);ground(176,192,3);ground(193,196,6);ground(197,W-1,3);
  for(let y=0;y<ROWS;y++)map[y][W-1]=1;
  plats=[];sh=[];orbs=[];crushed=[];parts=[];
  plats.push({k:'branch',x:92*TS,y:448,y0:448,w:64,h:10,solid:1});
  plats.push({k:'leaf',x0:131*TS-20,x:131*TS-20,y:440,y0:440,w:72,h:8,t:0,solid:1});
  for(let i=166;i<=171;i++)plats.push({k:'crumble',x:i*TS,y:448,w:32,h:26,tm:0,fall:0,solid:1});
  small(16,'walk');small(36,'hop');proc(60,2,-1,1);
  small(84,'curious');small(102,'shy');proc(104,2,-1,1);small(125,'walk',1);small(146,'shy',1);   // 暗闇の敵をへらす
  const B=bigS(178,1,42);const rd=small(178,'ride');rd.ride=B;
  small(181,'walk');small(184,'hop',1);small(187,'shy');small(190,'curious');small(185,'walk',1);
  proc(204,2,1,1);
  const O=[[8,40],[14,90],[26,40],[33,70],[40,40],[46,90],[55,50],[65,30],[70,40],[80,40],[88,80],[93,100],[99,40],[108,110],[115,40],[124,90],[131,110],[138,40],[145,70],[158,40],[168,80],[184,150],[188,40],[200,40],[206,60],[98,40],[103,50],[120,40],[136,40],[142,40]];   // 暗闇に光を追加
  for(const[t,u]of O)orbs.push({x:t*TS+16,y:surfY(t)-u,got:0,ph:Math.random()*6});
  P={x:3*TS,y:0,w:18,h:20,vx:0,vy:0,onG:0,coy:0,buf:0,jh:1,on:null,py:0,inv:0,hurt:0,face:1,lastX:3*TS,lastY:448,hide:0};
  P.y=surfY(3)-P.h-0.01;stomps=0;lights=0;cpi=0;tr=null;cr=null;fade=0;flash=0;camX=0;
}

// ---------- 物理 ----------
function hitTiles(x,y,w,h){const x0=Math.floor(x/TS),x1=Math.floor((x+w-0.01)/TS),y0=Math.floor(y/TS),y1=Math.floor((y+h-0.01)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty))return true;return false}
function move(o,dt,pl){o.onG=false;const dx=o.vx*dt;o.x+=dx;o.wall=false;
  if(hitTiles(o.x,o.y,o.w,o.h)){if(dx>0)o.x=Math.floor((o.x+o.w)/TS)*TS-o.w-0.01;else if(dx<0)o.x=(Math.floor(o.x/TS)+1)*TS+0.01;o.vx=0;o.wall=true}
  const dy=o.vy*dt;o.y+=dy;
  if(hitTiles(o.x,o.y,o.w,o.h)){if(dy>0){o.y=Math.floor((o.y+o.h)/TS)*TS-o.h-0.01;o.onG=true}else if(dy<0)o.y=(Math.floor(o.y/TS)+1)*TS+0.01;o.vy=0}
  if(pl&&o.vy>=0)for(const p of pl){if(!p.solid)continue;
    if(o.x+o.w>p.x+2&&o.x<p.x+p.w-2&&o.y+o.h>=p.y&&o.y+o.h-dy<=p.y+3){o.y=p.y-o.h;o.vy=0;o.onG=true;o.on=p}}}
const ov=(a,b,m)=>a.x+m<b.x+b.w&&a.x+a.w-m>b.x&&a.y+m<b.y+b.h&&a.y+a.h-m>b.y;

// ---------- 入力 ----------
const keys={};
addEventListener('keydown',e=>{if(document.activeElement===nameEl)return;keys[e.code]=1;if(['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
const touch={l:0,r:0,j:0};
function readInput(){let l=keys.ArrowLeft||keys.KeyA,r=keys.ArrowRight||keys.KeyD,j=keys.Space||keys.ArrowUp||keys.KeyW||keys.KeyZ;
  const gps=navigator.getGamepads?navigator.getGamepads():[];
  for(const g of gps){if(!g)continue;const ax=g.axes[0]||0;if(ax<-0.4||(g.buttons[14]&&g.buttons[14].pressed))l=1;if(ax>0.4||(g.buttons[15]&&g.buttons[15].pressed))r=1;if((g.buttons[0]&&g.buttons[0].pressed)||(g.buttons[1]&&g.buttons[1].pressed))j=1}
  if(touch.l)l=1;if(touch.r)r=1;if(touch.j)j=1;return{l:!!l,r:!!r,j:!!j}}
const pads=document.querySelectorAll('#pad span');
function hold(el,k){el.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=1;if(el.setPointerCapture)el.setPointerCapture(e.pointerId)});
  ['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,()=>touch[k]=0))}
hold(pads[0],'l');hold(pads[1],'r');hold($('jump'),'j');
addEventListener('contextmenu',e=>e.preventDefault());

// ---------- 音 ----------
let AC=null,MG,SG,cur=null,nextT=0,stp=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(m,t,dur,type,vol,dest,vib){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=mtof(m);
  if(vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=5.5;lg.gain.value=mtof(m)*0.012;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+0.1)}
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(vib?0.06:0.005));g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g);g.connect(dest||MG);o.start(t);o.stop(t+dur+0.05)}
const SONGS={
 field:{bpm:96,prog:[[57,60,64],[53,57,60],[48,52,55],[55,59,62],[57,60,64],[53,57,60],[55,59,62],[52,56,59]],
  mel:[76,74,72,72,0,69,67,69,72,74,0,71,72,71,69,69,0,65,67,71,74,71,0,68,76,77,76,74,72,0,72,74,76,79,0,74,76,74,72,72,0,69,71,69,68,64,0,0]},
 tree:{bpm:62,prog:[[57,60,64],[52,55,59],[53,57,60],[48,52,55],[50,53,57],[57,60,64],[53,57,60],[52,56,59]],
  mel:[72,0,71,67,0,0,69,0,72,67,0,0,65,67,69,72,0,69,69,0,68,64,0,0]}};
function sched(){if(!AC||!cur)return;const S=SONGS[cur],e=60/S.bpm/2;
  while(nextT<AC.currentTime+0.15){const bar=Math.floor(stp/6),inb=stp%6,ch=S.prog[bar%S.prog.length];
    const n=ch[[0,1,2,1,2,1][inb]]+(inb===3?12:0);tone(n,nextT,e*2.2,'triangle',0.08);
    if(inb===0)tone(ch[0]-12,nextT,e*5,'sine',0.13);
    if(inb%2===0){const m=S.mel[Math.floor(stp/2)%S.mel.length];if(m)tone(m,nextT,e*1.9,'sine',0.065,null,1)}
    nextT+=e;stp++}}
function initAudio(){if(AC){AC.resume();return}AC=new(window.AudioContext||window.webkitAudioContext)();
  MG=AC.createGain();MG.gain.value=0.55;MG.connect(AC.destination);SG=AC.createGain();SG.gain.value=0.6;SG.connect(AC.destination);setInterval(sched,25)}
function setSong(n){if(!AC||cur===n)return;cur=n;stp=0;nextT=AC.currentTime+0.1}
function sfx(n){if(!AC)return;const t=AC.currentTime;
  if(n==='jump'){tone(72,t,0.12,'sine',0.07,SG);tone(79,t+0.04,0.1,'sine',0.04,SG)}
  else if(n==='orb')[84,88,91].forEach((m,i)=>tone(m,t+i*0.05,0.4,'sine',0.05,SG));
  else if(n==='stomp')tone(40,t,0.2,'square',0.06,SG);
  else if(n==='die')[67,63,60,55].forEach((m,i)=>tone(m,t+i*0.09,0.25,'triangle',0.06,SG));
  else if(n==='hurt')[76,72,67].forEach((m,i)=>tone(m,t+i*0.06,0.2,'triangle',0.06,SG));
  else if(n==='bloom')[69,72,76,81,84].forEach((m,i)=>tone(m,t+i*0.08,1.8,'sine',0.05,SG,1));
  else if(n==='chord')[57,61,64,69,73].forEach((m,i)=>tone(m,t+i*0.06,3,'sine',0.05,SG,1))}

// ---------- パーティクル ----------
function puff(x,y,n,col,sp=120,life=0.7){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life,max:life,col,r:2+Math.random()*2,g:200})}}
function petal(x,y){parts.push({x,y,vx:-20-Math.random()*30,vy:10+Math.random()*20,life:5,max:5,col:['#ffd6e8','#ffffff','#ffb8cc'][Math.random()*3|0],r:2.2,g:6})}

// ---------- 影 ----------
function updSmall(s,dt){s.t+=dt;
  if(s.ride){if(s.ride.alive){s.x=s.ride.x+4;s.y=s.ride.y-s.h;s.vy=0;return}s.ride=null}
  const dxp=P.x-s.x,near=Math.abs(dxp)<150&&Math.abs(P.y-s.y)<90;let v=s.dir*s.sp,hold=false;
  if(s.lead&&s.lead.alive){const L=s.lead,gap=(s.idx+1)*28+(s.strag?20+Math.sin(s.t*0.8)*16:0);
    const tx=L.x+L.w/2-L.dir*(L.w/2+gap)-s.w/2;v=clamp((tx-s.x)*2.5,-75,75);if(s.strag&&s.t%5<1.2)v=0;hold=true}
  else if(s.pers==='shy'&&near&&Math.abs(dxp)<130){v=-Math.sign(dxp)*72;hold=true}
  else if(s.pers==='curious'&&near){v=Math.sign(dxp)*55;hold=true}
  if(s.pers==='hop'){s.hopCd-=dt;if(Math.abs(dxp)<80&&Math.abs(P.y-s.y)<90&&s.onG&&s.hopCd<=0){s.vy=-340;s.hopCd=1.2}}
  if(s.onG&&v!==0){const ah=v>0?s.x+s.w+2:s.x-2;if(!solid(Math.floor(ah/TS),Math.floor((s.y+s.h+4)/TS))){if(hold)v=0;else{s.dir*=-1;v=-v}}}
  s.vx=v;s.vy=Math.min(s.vy+GRAV*dt,900);move(s,dt);if(s.wall&&!hold)s.dir*=-1}
function updBig(b,dt){b.t+=dt;b.vx=b.dir*b.sp;b.vy=Math.min(b.vy+GRAV*dt,900);
  if(b.onG){const ah=b.dir>0?b.x+b.w+2:b.x-2;if(!solid(Math.floor(ah/TS),Math.floor((b.y+b.h+4)/TS))){b.dir*=-1;b.vx=b.dir*b.sp}}
  move(b,dt);if(b.wall)b.dir*=-1}
function crush(s){s.alive=0;stomps++;const c=s.x+s.w/2;crushed.push({x:c,y:surfY(Math.floor(c/TS))});puff(c,s.y+s.h,8,'#111',90);sfx('stomp')}

// ---------- プレイヤー ----------
function updPlayer(dt,I){const jp=I.j&&!P.jh;P.jh=I.j;if(jp)P.buf=BUFFER;else P.buf-=dt;
  const tgt=P.hurt>0?P.vx:((I.r?1:0)-(I.l?1:0))*WALK;P.vx+=clamp(tgt-P.vx,-ACC*dt,ACC*dt);
  if(P.onG)P.coy=COYOTE;else P.coy-=dt;
  const jv=JUMP_V-Math.min(lights,WEIGHT_MAX)*WEIGHT_PER;
  if(P.buf>0&&P.coy>0&&!(P.hurt>0)){P.vy=-jv;P.buf=0;P.coy=0;sfx('jump')}
  if(!I.j&&!(P.hurt>0)&&P.vy<-jv*0.45)P.vy=-jv*0.45;
  P.vy=Math.min(P.vy+GRAV*dt,900);
  if(P.on){P.x+=P.on.x-P.on.px;P.y+=P.on.y-P.on.py}
  P.py=P.y;P.on=null;move(P,dt,plats)}
function respawn(){const c=CPS[cpi];P.x=c*TS;P.y=surfY(c)-P.h-0.01;P.vx=P.vy=0;P.inv=1.2;P.hurt=0;P.on=null}
function die(){sprouts.push({x:P.lastX,y:P.lastY,n:pname});if(sprouts.length>80)sprouts.shift();
  try{localStorage.setItem(SKEY,JSON.stringify(sprouts))}catch(e){}puff(P.x+9,P.y+10,16,'#fff3a0');sfx('die');respawn()}
function hurt(s){if(lights<=0){die();return true}
  const lose=Math.ceil(lights/2);lights-=lose;
  const dir=(P.x+P.w/2<s.x+s.w/2)?-1:1;
  for(let i=0;i<lose;i++){const a=-Math.PI/2+(Math.random()-0.5)*2.2;
    orbs.push({x:P.x+9,y:P.y+6,vx:Math.cos(a)*170,vy:Math.sin(a)*300-60,got:0,ph:0,drop:1,cd:0.8,life:DROP_LIFE})}
  P.vx=dir*KNOCK;P.vy=-300;P.onG=false;P.inv=HURT_INV;P.hurt=0.35;
  puff(P.x+9,P.y+10,10,'#fff3a0',100);sfx('hurt');return false}
function updDrops(dt){for(const o of orbs){if(!o.drop||o.got)continue;o.cd-=dt;o.life-=dt;
  o.vy=Math.min(o.vy+900*dt,600);o.x+=o.vx*dt;
  if(solid(Math.floor(o.x/TS),Math.floor(o.y/TS))){o.x-=o.vx*dt;o.vx*=-0.5}
  o.y+=o.vy*dt;
  if(o.vy>0&&solid(Math.floor(o.x/TS),Math.floor((o.y+6)/TS))){o.y=Math.floor((o.y+6)/TS)*TS-6;o.vy*=-0.45;o.vx*=0.85}
  if(o.life<=0||o.y>VH+40)o.got=1}}

// ---------- 更新 ----------
function updPlats(dt){for(const p of plats){p.px=p.x;p.py=p.y}
  for(const p of plats){
    if(p.k==='branch'){if(P.on===p)p.y=Math.min(p.y+45*dt,p.y0+36);else p.y=Math.max(p.y-25*dt,p.y0)}
    else if(p.k==='leaf'){p.t+=dt;p.x=p.x0+Math.sin(p.t*0.9)*64;p.y=p.y0+Math.sin(p.t*1.8)*4}
    else if(p.k==='crumble'){if(p.solid){if(P.on===p||p.tm>0)p.tm+=dt;if(p.tm>0.45){p.solid=0;p.fall=0;p.tm=0}}else{p.fall+=dt;if(p.fall>3){p.solid=1;p.tm=0}}}}
  for(const s of sh){if(!s.alive)continue;if(s.big)updBig(s,dt);else updSmall(s,dt);if(s.y>VH+100)s.alive=0}}
function updPlay(dt){updPlats(dt);updPlayer(dt,readInput());
  if(P.inv>0)P.inv-=dt;if(P.hurt>0)P.hurt-=dt;updDrops(dt);
  if(P.onG&&!P.on){P.lastX=P.x+P.w/2;P.lastY=P.y+P.h}
  for(const o of orbs)if(!o.got&&!(o.cd>0)&&Math.hypot(o.x-(P.x+9),o.y-(P.y+10))<22){o.got=1;lights++;puff(o.x,o.y,10,'#fff3a0');sfx('orb')}
  for(const s of sh){if(!s.alive||s.big)continue;if(ov(P,s,2)){if(P.vy>0&&P.py+P.h<=s.y+10){crush(s);P.vy=-STOMP_BOUNCE}else if(P.inv<=0){if(hurt(s))return}}}

    else if(T%3.2<0.12){cx.beginPath();cx.moveTo(px-2.6,ey);cx.lineTo(px+2.6,ey);cx.stroke()}
    else{cx.fillStyle='#2a1c14';cx.beginPath();cx.ellipse(px,ey,2.6,3.3,0,0,7);cx.fill();
      cx.fillStyle='#fff';cx.beginPath();cx.arc(px+0.9,ey-1.3,1.05,0,7);cx.fill();cx.beginPath();cx.arc(px-0.8,ey+1.2,0.5,0,7);cx.fill()}}
  cx.strokeStyle='#8a4a2a';cx.lineWidth=1.3;cx.beginPath();
  if(P.hurt>0){cx.ellipse(ex,ey+7,1.6,1.3,0,0,7)}
  else if(!P.onG){cx.ellipse(ex,ey+6.5,1.8,2,0,0,7)}
  else{cx.arc(ex,ey+4.6,2.3,0.15*Math.PI,0.85*Math.PI)}
  cx.stroke()}

function render(){drawSky();if(state==='title')return;
  drawTiles();drawPlats();drawSprouts();
  if(state==='credits'){
    if(!quiet)drawCrushed();drawTree(finalBloom,quiet?0.75:1);
    for(const s of cr.sh){const cxs=s.x+s.w/2,lightNear=Math.abs(cr.x-cxs)<90;
      if(quiet){const up=cr.end>=0&&s.fol;drawShadow(s,up?treeX:(s.fol||lightNear?cr.x:cxs),up?200:(s.fol||lightNear?cr.ly:s.y+s.h+10),false)}
      else if(s.big){let tx=cxs,ty=s.y+s.h+20,best=400;for(const c of crushed){const d=Math.abs(c.x-cxs);if(d<best){best=d;tx=c.x;ty=c.y}}
        if(lightNear){tx=cr.x;ty=cr.ly}drawShadow(s,tx,ty,true);tear(s)}
      else drawShadow(s,cr.x,cr.ly,false)}
    drawSeed(cr.seed);if(!cr.merged)glow(cr.x-camX,cr.ly,20);drawParts();
    if(cr.end>=1.5){const a=clamp((cr.end-1.5)/1.2,0,1);   // エンディング表示(隠し=HAPPY END / 通常=BAD END)
      cx.save();cx.globalAlpha=a;cx.textAlign='center';cx.textBaseline='middle';cx.font='bold 64px sans-serif';cx.lineJoin='round';
      cx.shadowColor=quiet?'rgba(255,230,120,0.9)':'rgba(0,0,0,0.8)';cx.shadowBlur=quiet?24:12;
      cx.lineWidth=8;cx.strokeStyle=quiet?'#b8791f':'#2a0a0a';cx.strokeText(quiet?'HAPPY END':'BAD END',VW/2,120+(1-a)*10);
      cx.shadowBlur=0;cx.fillStyle=quiet?'#fff2a8':'#e0393e';cx.fillText(quiet?'HAPPY END':'BAD END',VW/2,120+(1-a)*10);cx.restore()}}
  else{
    drawCrushed();drawTree(tr?tr.bloom:0,tr&&tr.quiet?0.75:1);
    for(const o of orbs)if(!o.got&&!(o.drop&&o.life<2&&Math.floor(T*10)%2))glow(o.x-camX,o.y+(o.drop?0:Math.sin(T*2+o.ph)*3),o.drop?11:14);
    const lookUp=state==='tree'&&tr.quiet&&tr.ph>=2;
    for(const s of sh)if(s.alive)drawShadow(s,lookUp?treeX:P.x+9,lookUp?220:P.y+10,false);
    if(!P.hide&&!(P.inv>0&&Math.floor(T*12)%2))drawHero();
    if(tr){for(const f of tr.fly){const k=f.t;glow(f.x0+(f.x1-f.x0)*k-camX,f.y0+(f.y1-f.y0)*k-Math.sin(k*3.14)*60,10)}
      if(tr.ph>=3&&tr.ph<5)glow(treeX-camX,250,Math.max(0,40-tr.t*8));if(tr.seed)drawSeed(tr.seed)}
    drawParts();
    if(drawDark()>0.3)for(const s of sh)if(s.alive)drawShadow(s,P.x+9,P.y+10,false,true);
    if(state==='play')drawHUD();
    if(tr&&tr.nameT>=0&&pname){const n=tr.nameT,a=n<1?n:Math.max(0,1-(n-2.5)/1.5);cx.globalAlpha=a;cx.fillStyle='#fff';cx.font='20px sans-serif';cx.textAlign='center';cx.fillText(pname,treeX-camX,200-n*8);cx.globalAlpha=1}}
  if(flash>0){cx.fillStyle=`rgba(255,255,240,${flash*0.7})`;cx.fillRect(0,0,VW,VH)}
  if(fade>0){cx.fillStyle=`rgba(0,0,0,${fade})`;cx.fillRect(0,0,VW,VH)}}

// ---------- 進行 ----------
function startGame(){pname=nameEl.value.trim().slice(0,10);try{localStorage.setItem(NKEY,pname)}catch(e){}
  nameEl.blur();initAudio();buildWorld();state='play';setSong('field');$('overlay').style.display='none';
  if('ontouchstart' in window)$('touch').classList.add('on');
  const d=document.documentElement;if(d.requestFullscreen)d.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{})}
function toTitle(){state='title';cur=null;fade=0;$('overlay').style.display='flex';$('touch').classList.remove('on')}
$('start').addEventListener('click',startGame);
nameEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();startGame()}});
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,1/30);last=now;T+=dt;
  if(state==='play')updPlay(dt);else if(state==='tree')updTree(dt);else if(state==='credits')updCredits(dt);
  if(state!=='title')updParts(dt);if(flash>0)flash=Math.max(0,flash-dt*1.5);
  if(AC&&state==='play')MG.gain.setTargetAtTime(darkAmt(P.x)>0.5?0.3:0.55,AC.currentTime,0.5);
  render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// ---------- ぜんしん版：立つ場所（または うでを横にのばす）で 左右に進む、とびあがる＝ジャンプ ----------
const BODY={ZONE:0.22,ARM:1.1,JUMP_HOLD:0.35};   // ZONE：画面のまん中から これだけ ずれたら進む／ARM：手が肩から これだけ横に出たら進む（肩はば単位）
let jumpEnd=0;
Body.on('pose',()=>{
  if(Body.mode!=='cam')return;
  const h=Body.hands,arm=i=>h[i].vis&&Math.abs(h[i].py)<0.7&&(i?h[i].px>BODY.ARM:h[i].px<-BODY.ARM);
  touch.l=Body.pos<-BODY.ZONE||arm(0)?1:0;
  touch.r=Body.pos>BODY.ZONE||arm(1)?1:0;
  if(touch.l&&touch.r)touch.l=touch.r=0;
  touch.j=performance.now()<jumpEnd?1:0;
});
Body.on('jump',()=>{if(Body.mode==='cam'){jumpEnd=performance.now()+BODY.JUMP_HOLD*1000;touch.j=1;}});
Body.gate({title:'ヒカリノタネ',corner:'tr',needFull:true,lines:['⬅ カメラの <b>左がわに 立つ</b> … 左へ 進む','➡ <b>右がわに 立つ</b> … 右へ 進む','（うでを 横に のばしても 進む）','まん中に 立つ … 止まる','🦘 <b>とびあがる</b> … ジャンプ']});
window.__game={touch,get state(){return state;}};
})();
</script>
