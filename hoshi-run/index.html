<style>
:root{--ink:#1d1640;--gold:#ffd54a}

.hide{display:none!important}

.pstar{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;color:var(--gold);font-size:18px;line-height:18px;text-align:center;text-shadow:0 0 6px #fa0}

#prompt{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 22px);left:50%;transform:translateX(-50%);width:120px;text-align:center;transition:opacity .2s}
#prompt .disc{position:relative;width:104px;height:104px;margin:0 auto}
#prompt canvas{position:absolute;inset:0;width:104px;height:104px}
#plabel{margin-top:-6px;font-weight:900;font-size:22px;letter-spacing:.04em;text-shadow:0 0 0 #000,0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),0 0 12px #000}
#plabel small{display:block;font-size:11px;opacity:.85;letter-spacing:.15em}
#prompt.now .disc{animation:pulse .32s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}

  color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 20px rgba(0,0,0,.4);transition:transform .15s}
#bottom.now{color:var(--gold);transform:scale(1.08)}
#bottom.small{font-size:clamp(22px,4.2vw,44px);bottom:max(30px,calc(env(safe-area-inset-bottom) + 26px))}
#kcal{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));font-weight:900;font-size:15px;text-shadow:0 2px 0 var(--ink),0 0 8px #000;opacity:.95}
#kcal b{font-size:24px}
#combo{position:absolute;right:16px;top:calc(max(10px,env(safe-area-inset-top)) + 26px);text-align:center;font-weight:900;line-height:1;opacity:0;transition:opacity .2s}
#combo b{display:block;font-size:46px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
#combo span{font-size:13px;letter-spacing:.2em;text-shadow:0 2px 0 var(--ink)}
#combo.pop b{animation:cpop .25s}
@keyframes cpop{0%{transform:scale(1.5)}100%{transform:scale(1)}}

#bossbar.fight{top:calc(max(10px,env(safe-area-inset-top)) + 30px)}
#pad button.cL{background:rgba(30,110,220,.75)}#pad button.cR{background:rgba(220,40,70,.75)}#pad button.cU{background:rgba(30,170,90,.75)}
#bossHp{height:14px;margin-top:4px;border-radius:8px;background:rgba(20,0,20,.6);box-shadow:0 0 0 2px #fff;overflow:hidden}
#bossHp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3d6e,#ffb03d);transition:width .3s}
#banner{position:absolute;top:38%;left:0;right:0;text-align:center;font-weight:900;pointer-events:none}
#banner .s{font-size:clamp(16px,3vw,26px);letter-spacing:.3em;color:var(--gold);text-shadow:0 3px 0 var(--ink)}

#big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(70px,18vw,200px);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 10px 0 var(--ink);pointer-events:none}
#big{opacity:0}
#big.go{animation:bigin .7s forwards}
@keyframes bigin{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}

#talk:after{content:'';position:absolute;left:50%;bottom:-14px;margin-left:-10px;border:10px solid transparent;border-top:14px solid #fff;border-bottom:0}
#pip{position:absolute;left:12px;bottom:max(12px,env(safe-area-inset-bottom));width:min(24vw,200px);border-radius:12px;box-shadow:0 0 0 3px rgba(255,255,255,.7),0 4px 12px #0008;background:#0b0b20}
#pad{position:absolute;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,58px);gap:6px;pointer-events:auto}
#pad button{width:58px;height:58px;border-radius:16px;border:0;background:rgba(20,16,60,.7);box-shadow:0 0 0 2px rgba(255,255,255,.6) inset;padding:4px;touch-action:none}
#pad button img{width:100%;height:100%;pointer-events:none}
#pad button:active{background:rgba(255,213,74,.8)}
#giongo{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.gi{position:absolute;font-weight:900;white-space:nowrap;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);animation:gi .9s forwards}
@keyframes gi{0%{transform:translate(-50%,-50%) rotate(var(--r)) scale(.2)}18%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.25)}30%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) rotate(var(--r)) scale(1.05)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#title{background:radial-gradient(ellipse at 50% 38%,rgba(60,30,120,.25),rgba(5,3,25,.85) 70%)}
#title h1{margin:0;font-weight:900;line-height:1.05;font-size:clamp(34px,7.6vw,84px);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink),0 0 40px rgba(190,120,255,.7)}

#title h1 .b{color:var(--gold)}

.btn.b2{background:linear-gradient(#d9f3ff,#7fd0ff);box-shadow:0 6px 0 #2d7fb3,0 10px 20px #0006}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b4791a}
.btn.b3{background:linear-gradient(#ffd6ee,#ff8ac8);box-shadow:0 6px 0 #b3407e,0 10px 20px #0006}
.note{font-size:13px!important;opacity:.75!important;margin-top:16px!important}
#calib{background:#000}
#silh{width:min(70vw,60vh);height:min(70vw,60vh)}
#calib h2{margin:8px 0 4px;font-weight:900;font-size:clamp(22px,4.5vw,40px)}

#calib .bar i{display:block;height:100%;width:0;background:var(--gold)}
#calibMsg{font-weight:800;font-size:14px;opacity:.8;min-height:1.4em}
#result{background:#000}
#result h2{margin:0;font-weight:900;font-size:clamp(40px,9vw,96px);letter-spacing:.02em}
#rsilh{width:min(40vw,34vh);height:min(40vw,34vh)}

.rgrid div{font-size:13px;opacity:.9}
.rgrid b{display:block;font-size:clamp(26px,5vw,44px);color:var(--gold)}

#camvid{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}

<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="hud" class="hide">
  <div id="prog"><div id="progFill"></div><div id="progMark"></div></div>
  <div id="prompt" style="opacity:0"><div class="disc"><canvas id="ring" width="208" height="208"></canvas></div><div id="plabel"></div></div>
  <div id="combo"><b id="comboN">0</b><span>COMBO</span></div>

  <div id="banner"><div class="s"></div><div class="n"></div></div>
  <div id="talk" class="hide"></div>
  <div id="big"></div>
  <div id="bottom"></div>
  <div id="kcal"><b id="kcalN">0.0</b> kcal</div>
  <canvas id="pip" width="240" height="180" class="hide"></canvas>
  <div id="pad" class="hide"></div>
</div>
<div id="giongo"></div>
<div id="title" class="screen">
  <h1><span class="a">★ ぜんしんで うごく ★</span>ほしのゲート<br><span class="b">ぜんしんラン！</span></h1>
  <p>ゲートの むこうへ いっしょに はしろう！<br>ジャンプ・しゃがむ・よける・はくしゅ・パンチ・ばんざい</p>
  <div class="btns">
    <button class="btn" id="bCam">📷 カメラで あそぶ</button>
    <button class="btn b2" id="bKey">👆 ボタンで あそぶ</button>
  </div>
  <div class="btns" style="margin-top:12px"><button class="btn b3" id="bTwo">👥 ふたりで あそぶ（カメラ）</button></div>
  <p class="note">カメラは スマホを よこにおき、2〜3m はなれて 全身が うつるように。<br>キーボード：↑ジャンプ ↓しゃがむ ←→よける C はくしゅ Z X パンチ B ばんざい<br>ボス戦：Z ひだりパンチ X みぎパンチ ←→ あしぶみ ↑ アッパー</p>
  <div id="rot"></div>
</div>
<div id="calib" class="screen hide">
  <canvas id="silh" width="600" height="600"></canvas>
  <h2 id="calibT">りょうてを よこに ひろげてね</h2>
  <div class="bar"><i id="calibBar"></i></div>
  <div id="calibMsg"></div>
  <div class="btns" style="margin-top:10px"><button class="btn b2" id="bCalibSkip" style="font-size:15px;padding:10px 20px">ボタンで あそぶ に かえる</button></div>
</div>
<div id="result" class="screen hide">
  <canvas id="rsilh" width="400" height="400"></canvas>
  <h2>おつかれさま！</h2>
  <div class="rgrid"><div><b id="rK">0</b>kcal</div><div><b id="rOk">0</b>せいこう</div><div><b id="rC">0</b>さいだいコンボ</div></div>
  <div id="rank"></div>
  <div class="btns"><button class="btn" id="bAgain">もういちど</button><button class="btn b2" id="bTop">タイトルへ</button></div>
</div>
<div id="flash"></div>
<video id="camvid" playsinline muted autoplay></video>
