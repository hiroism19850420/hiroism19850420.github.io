// ================= 道具 =================
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ez=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, ezIn=t=>t*t, ezOut=t=>1-(1-t)*(1-t), lin=t=>t;
const hex=c=>c[0]==='#'?[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]:c.match(/[\d.]+/g).slice(0,3).map(Number);
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'};
const rgba=(c,a)=>{const A=hex(c);return `rgba(${A[0]},${A[1]},${A[2]},${a})`};
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};

function poly(g,pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,Math.max(0,r),0,Math.PI*2)}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function vgrad(g,y0,y1,stops){const gr=g.createLinearGradient(0,y0,0,y1);stops.forEach(([o,c])=>gr.addColorStop(o,c));return gr}
function glow(g,x,y,r,c,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(c,a));gr.addColorStop(1,rgba(c,0));g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}

{const g=paper.getContext('2d'),im=g.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=Math.random()<.5?0:255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=Math.random()*26}g.putImageData(im,0,0)}

// ================= 時間（ゲーム内の時計で待つ） =================
let T=0; const waits=[], tweens=[];

// 同じ値への 前の動きは 打ち切る（あとから始めたほうが勝つ）
const tween=(o,k,to,d,e=ez)=>new Promise(r=>{for(let i=tweens.length-1;i>=0;i--)if(tweens[i].o===o&&tweens[i].k===k){const w=tweens[i];tweens.splice(i,1);w.r()}tweens.push({o,k,from:o[k],to,d,t:0,e,r})});
function tick(dt){
  T+=dt;
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt;const u=clamp(w.t/w.d);w.o[w.k]=lerp(w.from,w.to,w.e(u));if(u>=1){tweens.splice(i,1);w.r()}}
  for(let i=waits.length-1;i>=0;i--)if(T>=waits[i].t){const w=waits[i];waits.splice(i,1);w.r()}
}

// ================= 音 =================
let AC=null,master,humG,humLP,musG,noiseBuf;
function initAudio(){
  if(AC)return; const A=window.AudioContext||window.webkitAudioContext; if(!A)return;
  AC=new A(); master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate);
  {const d=noiseBuf.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.2}}
  humLP=AC.createBiquadFilter(); humLP.type='lowpass'; humLP.frequency.value=1800;
  humG=AC.createGain(); humG.gain.value=0; humLP.connect(humG); humG.connect(master);
  const n=AC.createBufferSource(); n.buffer=noiseBuf; n.loop=true; const nl=AC.createBiquadFilter(); nl.type='lowpass'; nl.frequency.value=260;
  const ng=AC.createGain(); ng.gain.value=.9; n.connect(nl); nl.connect(ng); ng.connect(humLP); n.start();
  [[46,.10],[92.6,.045],[138,.02]].forEach(([f,v])=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;const l=AC.createBiquadFilter();l.type='lowpass';l.frequency.value=180;const og=AC.createGain();og.gain.value=v;o.connect(l);l.connect(og);og.connect(humLP);o.start()});
  musG=AC.createGain(); musG.gain.value=0; musG.connect(master);
}
function ramp(p,v,d){if(!AC)return;const t=AC.currentTime;p.cancelScheduledValues(t);p.setValueAtTime(p.value,t);p.linearRampToValueAtTime(v,t+d)}
function note(f,vol=.2,dur=2.2,dest,at=0){
  if(!AC)return; const t=AC.currentTime+at, g=AC.createGain(); g.connect(dest||master);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  [['sine',1,1],['triangle',2,.22],['sine',3,.08]].forEach(([ty,m,v])=>{const o=AC.createOscillator(),og=AC.createGain();o.type=ty;o.frequency.value=f*m;og.gain.value=v;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.1)});
}
function hiss(dur=.9,vol=.25,freq=2400){
  if(!AC)return; const s=AC.createBufferSource(); s.buffer=noiseBuf; const b=AC.createBiquadFilter(); b.type='highpass'; b.frequency.value=freq;
  const g=AC.createGain(), t=AC.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.06); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(b); b.connect(g); g.connect(master); s.start(t,Math.random()*2); s.stop(t+dur+.1);
}
// 回想の音楽（ゆっくりの分散和音）

function musTick(dt){if(!musOn)return;musT-=dt;if(musT<=0){musT=.95;const f=MUS[musI%MUS.length];note(f,.11,3.2,musG);if(musI%4===0)note(f/2,.09,4,musG);musI++}}

const YOMI=[['開店','かいてん'],['お店','おみせ'],['店','みせ'],['来な','こな'],['来て','きて'],['来た','きた'],['来ま','きま'],['一台','いちだい'],['一杯','いっぱい'],['大将','たいしょう'],['晩','ばん'],['昼','ひる'],['客','きゃく'],['疑い','うたがい'],['晴れた','はれた'],['下まで','したまで'],['車の下','くるまのした'],['跡','あと'],['地面','じめん'],['四角く','しかくく'],['屋根','やね'],['駅前','えきまえ'],['売り上げ','うりあげ'],['片づけ','かたづけ'],['夜中','よなか'],['今夜','こんや'],['今日は','きょうは'],['今度','こんど'],['寄って','よって'],['出前','でまえ'],['止めた','とめた'],['帰した','かえした'],['最後','さいご'],['閉めた','しめた'],['去年の子','きょねんのこ'],['あの子','あのこ'],['いい子','いいこ'],['バスの中','ばすのなか'],['続かなくて','つづかなくて'],['球','たま'],['替えた','かえた'],['街灯','がいとう'],['三丁目','さんちょうめ'],['上から','うえから'],['運が','うんが'],['消えて','きえて'],['今週','こんしゅう'],['先輩','せんぱい'],['困らない','こまらない'],['眠れて','ねむれて'],['寝つき','ねつき'],['悪くて','わるくて'],['早く寝た','はやくねた'],['閉めて','しめて'],['入った','はいった'],['外が','そとが'],['目が','めが'],['年を','としを'],['具合','ぐあい'],['気づかなかった','きづかなかった'],['人助け','ひとだすけ'],['事故','じこ'],['救急車','きゅうきゅうしゃ'],['呼んだ','よんだ'],['目の前','めのまえ'],['迷わなかった','まよわなかった'],['動画','どうが'],['見る','みる'],['見たい','みたい'],['見て','みて'],['大丈夫','だいじょうぶ'],['薬','くすり'],['買いに','かいに'],['寄った','よった'],['五分','ごふん'],['戻って','もどって'],['動かした','うごかした'],['動いた','うごいた'],['迷惑','めいわく'],['前に','まえに'],['車が','くるまが'],['非常識','ひじょうしき'],['人が','ひとが'],['市民病院前','しみんびょういんまえ']];
const TTS={on:!DBG&&!Q.has('mute'),none:false,vA:null,vB:null,same:true,keep:null,
  init(){
    if(!('speechSynthesis' in window)){this.on=false;this.none=true;return}
    const pick=()=>{
      const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)); if(!vs.length)return;
      const by=ns=>{for(const n of ns){const v=vs.find(v=>v.name.includes(n));if(v)return v}return null};
      const nat=vs.find(v=>/Natural|Enhanced|Premium|拡張|プレミアム/i.test(v.name));
      this.vA=by(['Keita','Daichi','Naoki','Otoya','Ichiro','Hattori'])||nat||by(['Google 日本語','Nanami','Kyoko','O-Ren','Haruka'])||vs[0];
      this.vB=by(['Nanami','Aoi','Mayu','Shiori','Kyoko','O-Ren','Google 日本語','Haruka','Ayumi'])||nat||vs[0];
      this.same=this.vA===this.vB;
    };
    pick(); speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pick);
  },
  speak(text,who){
    return new Promise(res=>{
      let t=text.replace(/[「」]/g,'').replace(/……/g,'、');
      for(const [a,b] of YOMI)t=t.split(a).join(b);
      const u=this.keep=new SpeechSynthesisUtterance(t);
      u.lang='ja-JP'; u.rate=.84; u.volume=1;   // 少しゆっくり
      const gen=who==='N'?'f':who==='A'?(CUR.gA||'m'):(CUR.gB||'f'), dup=who==='N'?0:(CUR.gA||'m')===(CUR.gB||'f')&&who==='B'?.14:0;   // 同じ性別の2人は 高さで分ける
      u.pitch=gen==='c'?1.6:(gen==='m'?(this.same?.72:.92):(this.same?1.22:1.04))+dup;
      const v=gen==='m'?this.vA:this.vB; if(v)u.voice=v;
      let done=false; const fin=()=>{if(!done){done=true;clearTimeout(tm);res()}};
      const tm=setTimeout(fin,3000+text.length*480);   // 終了の合図が来ない端末への備え
      u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
    });
  },
  stop(){try{speechSynthesis.cancel()}catch(e){}}
};

async function line(who,text,gap=.45){

  if(who==='N'){bus.talker=null}
  else if(scene==='bus'&&CUR.phone){bus.talker=PA;tween(PA,'yaw',34,.8)}

  // 一週間 巻きもどす（太陽と月が ぐるぐる回り、時計が逆に走る）
  tween(L,'snow',0,.8); tween(L,'orbit',1,.8); await tween(L,'clockA',1,.8);
  await Promise.all([tween(L,'t',-7,3.4),tween(L,'web',0,3.4)]);
  L.t=0; await wait(.8);
  // 灯りが ちらついて、消える
  for(const v of[1,1,.3,1,.15,.9,0,.6,0,0,.4,0]){L.lit=v;await wait(.13)}
  await wait(1.3);
  // 七日ぶん 早送り。消えたまま。だれも来ない。くもの巣が張っていく
  await Promise.all([tween(L,'t',7,7.5,ez),tween(L,'web',1,7.5,lin)]);
  L.t=0; await wait(1);
  tween(L,'orbit',0,.6); tween(L,'clockA',0,.6);
  // 机の上で、はんこだけが進む
  await tween(L,'blk',1,.6); think.sel=1; D.rows=0; D.hand=1; D.blk=1; await tween(D,'blk',0,.6); await wait(.6);
  for(let i=0;i<7;i++){D.bob=1;await tween(D,'bob',0,.15,lin);D.rows=i+1;note(150,.16,.14);D.bob=1;await wait(.27)}
  D.hand=0; await wait(1.2); await tween(D,'blk',1,.6);
  think.sel=2; D.blk=0; L.snow=.8; await tween(L,'blk',0,.8);
}
async function solveCross(){
  const L=walk5;
  // まっ暗な中で、ドーンという音
  await veilTo('#0b0806',1,.8); think.sel=3; L.a=L.a0; L.rec=-1; L.pose=0; L.clock=23.02; L.amb=0;
  await wait(.8); hiss(.5,.3,90); note(58,.42,1.3); note(43,.36,1.9,null,.05); note(29,.3,2.4,null,.08);
  await wait(2.2);
  // 自転車と、倒れている人
  await veilTo('#0b0806',0,1.8); await wait(2);
  // スマホで撮りながら、まわりを ゆっくり一周する
  L.rec=0;
  await Promise.all([tween(L,'a',L.a0+Math.PI*2,14,lin),tween(L,'rec',14,14,lin)]);
  await wait(.8);
  // それから、耳にあてる
  L.rec=-1; L.pose=2; await wait(2.8);
  // なかなか来ない
  await tween(L,'clock',23.45,6);
  await tween(L,'amb',1,2.6); await wait(1.4);
}
async function solveLane(){
  const L=lane;
  await tween(L,'she',0,.8); L.bag=0;
  // 巻きもどす（十一時四十分 → 十一時五分）
  await Promise.all([tween(L,'clock',23.08,2.8),tween(L,'rs',.05,2.8)]);
  await wait(.6); await tween(L,'she',1,.6); await wait(.9); await tween(L,'she',0,.8);
  await tween(L,'read',1,1); await wait(.8);
  // 道の奥から 赤い光が来て、車のうしろで止まる
  tween(L,'clock',23.2,8,lin); tween(L,'rs',.32,8,lin);
  await tween(L,'amb',1,1.2); await tween(L,'ad',1,3.4,ezOut);
  await wait(3.6);
  // 通れない。下がっていく
  await tween(L,'ad',0,3.4,ezIn); await tween(L,'amb',0,1); await wait(1.2);
  // まだ 店の中
  await Promise.all([tween(L,'clock',23.67,4.4),tween(L,'rs',1,4.4)]);
  await tween(L,'read',0,.8); L.bag=1; await tween(L,'she',1,.8);
}
CASES[5].solve=solveLane;
CASES[0].solve=solveLot; CASES[1].solve=solveShop; CASES[2].solve=solveSoba; CASES[3].solve=solveLamp; CASES[4].solve=solveCross;
// 停留所に止まり、次に話す人たちが乗ってくる（通路を歩いて 席につく）
async function boardStop(ids){
  if(AC)ramp(humG.gain,.24,3.5);
  await tween(bus,'speed',0,4,ezOut); await wait(.6); hiss(1.1,.2); await wait(1);
  await Promise.all(ids.map(async(id,k)=>{
    const q=pax[id], X=q.X, z=q.z;
    await wait(k*1.5);
    q.out=0; q.a=0; q.stand=1; q.walk=1; q.X=-.72; q.z=5.05; q.yaw=138;
    tween(q,'a',1,.5); await tween(q,'X',0,.9);
    await tween(q,'z',z,(5.05-z)*1.15,lin);
    tween(q,'yaw',60,.9); await tween(q,'X',X,1.1);
    q.walk=0; tween(q,'yaw',k?10:-8,.9); await tween(q,'stand',0,.8);
  }));
  await wait(.6); hiss(.9,.18); await wait(.8);
  if(AC)ramp(humG.gain,.5,3);
  await tween(bus,'speed',1,3.5,ezIn);
  await wait(2.5);
}
async function playCase(i){
  CUR=CASES[i]; caseI=i; PA=pax[CUR.A]; PB=CUR.phone||CUR.lap?{yaw:0}:pax[CUR.B]; solved=false;
  if(CUR.phone){await wait(1);tween(PA,'phone',1,.6);await tween(PA,'yaw',34,1)}
  if(CUR.jam){await wait(1.5);if(AC)ramp(humG.gain,.26,3);await tween(bus,'speed',0,3.6,ezOut);await wait(1);note(392,.09,.7);note(311,.09,.7);await wait(1.8)}
  for(const l of CUR.intro)await line(l[0],l[1]);
  // 思考：回想へ
  ramp(humLP.frequency,260,1.6); ramp(humG.gain,.14,1.6);
  await veilTo('#e9d9b4',1,1.5);
  scene='flash'; fl.cur=CUR.flash[0].s; fl.prev=-1; fl.a=1; fl.t0=T; musOn=true; musT=.2; ramp(musG.gain,1,2);
  await veilTo('#e9d9b4',0,1.4);
  for(const l of CUR.flash){setStill(l.s);await line('A',l.t,.6)}
  await wait(.6);
  // 考える
  scene='think'; think.on=true; think.sel=0; think.misses=0; think.heard=''; think.rip.length=0; tween(think,'ui',1,.8);
  solved=await new Promise(r=>think.res=r);
  if(solved){solvedN++;note(880,.1,1.6);tween(think,'ui',0,.6);await wait(.9);await CUR.solve();note(110,.2,5);note(164.8,.12,5,null,.05);await wait(2.2)}
  else {tween(think,'ui',0,.5);await wait(.6)}
  // バスへ戻る
  ramp(musG.gain,0,1.8);
  await veilTo('#e9d9b4',1,1.4);
  scene='bus'; musOn=false; ramp(humLP.frequency,1800,1.6); ramp(humG.gain,.5,1.6); PA.yaw=CUR.phone?34:CUR.lap?-20:CUR.flip?90:-90; PB.yaw=CUR.flip?-70:70;
  await veilTo('#e9d9b4',0,1.6);
  await wait(1);
  for(const l of CUR.outro1)await line(l[0],l[1]);
  if(solved){
    // 目が合って、色が抜ける
    await wait(1.2); tween(PB,'yaw',12,1.6); await tween(PA,'yaw',-10,1.6);
    await wait(2.2);
    ramp(humG.gain,.2,2.5); cam.x=P(PA.X,-.1,PA.z)[0]; cam.y=P(PA.X,-.1,PA.z)[1];
    tween(cam,'s',1.14*Math.pow(PA.z/1.6,.6),7); await tween(PA,'yaw',CUR.look||-166,2.6);   // 通路がわへ 振り返る
    await wait(2.8);
    await tween(PA,'gray',1,3.6);
    await wait(1.8);
    tween(cam,'s',1,3.5); ramp(humG.gain,.5,3); await tween(PA,'yaw',-20,2.4);
    await wait(1.4);
  } else await wait(1.5);
  for(let k=0;k<CUR.outro2.length;k++){const l=CUR.outro2[k];await line(l[0],l[1]);if(CUR.jam&&k===0){if(AC)ramp(humG.gain,.5,3);tween(bus,'speed',1,3.4,ezIn);await wait(1.2)}}
  if(CUR.phone)tween(PA,'phone',0,.8);
  tween(PA,'yaw',-22,1.5); tween(PB,'yaw',12,1.5);
}
async function run(from=0){
  for(let j=0;j<from;j++){pax[CASES[j].A].gray=1;solvedN++}
  for(let j=1;j<=from&&j<CASES.length;j++)(CASES[j].board||[]).forEach(id=>pax[id].out=0);   // 途中から：前の人は 気づいたことにする
  initAudio(); if(AC&&AC.state==='suspended')AC.resume();
  if(TTS.on)VO.preload();
  if(TTS.on){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}   // スマホは 最初のタップの中で一度しゃべらせておく
  ramp(humG.gain,.5,2);
  tween(titleUI,'a',0,1); await tween(bus.dim,'a',0,2.2);
  scene='bus'; tween(bus,'dusk',.4,40,lin);
  await wait(3.2);
  for(let i=from;i<CASES.length;i++){
    await playCase(i);
    if(i<CASES.length-1){tween(bus,'dusk',.4+.5*(i+1)/(CASES.length-1),30,lin);await wait(5);if(CASES[i+1].board)await boardStop(CASES[i+1].board);else await wait(2)}
  }
  tween(bus,'dusk',1,14,lin);
  await wait(3);
  // 降車ボタン
  await tween(bus,'btn',1,1.5);
  await new Promise(r=>bus.pressR=r);
  bus.pressed=true; bus.btn=0; note(659.3,.22,1.4); note(523.3,.22,2.2,null,.42); tween(bus,'sign',1,.4);
  await wait(2.6);
  await line('N','つぎは、市民病院前。市民病院前です。',.4);
  await wait(1.6);
  if(AC)ramp(humG.gain,.22,4);
  await tween(bus,'speed',0,4.5,ezOut);
  await wait(.6); hiss(1.1,.22);
  await wait(1.4);
  await veilTo('#000000',1,1.6);
  scene='out'; out.d=1; if(AC)ramp(humG.gain,.34,1);
  await wait(.8); hiss(.9,.2);
  await veilTo('#000000',0,2.2);
  await wait(1.6);
  // バスが 遠くなっていく
  if(AC){ramp(humG.gain,.5,1.5);setTimeout(()=>AC&&ramp(humG.gain,0,15),1600)}
  await tween(out,'d',70,22,t=>Math.pow(t,2.2));
  await wait(5);
  await tween(endUI,'a',1,2);
}
function pressStop(){if(bus.pressR&&!bus.pressed){const r=bus.pressR;bus.pressR=null;r()}}

// ================= 入力 =================
const inR=(x,y,r)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
function tap(x,y){
  if(scene==='title'){
    if(titleUI.a<1)return;
    if(!TTS.none&&inR(x,y,VBTN)){TTS.on=!TTS.on;return}
    if(inR(x,y,SKIP)){startFrom=(startFrom+1)%(CASES.length+(TESTOPT?1:0));return}
    if(inR(x,y,{x:START.x-30,y:START.y-20,w:START.w+60,h:START.h+40})){titleUI.a=.999;run(startFrom)}
    return;
  }
  if(scene==='think'&&think.on){
    for(let i=0;i<(CUR.thumbs||CUR.stills.length);i++)if(inR(x,y,thumb(i))){think.sel=i;return}
    if(SR&&Math.hypot(x-MIC.x,y-MIC.y)<MIC.r+14){listen();return}
    if(inR(x,y,GIVE)){thinkDone(false);return}
    if(inR(x,y,MR)){
      think.rip.push({x,y,t:T}); if(think.rip.length>6)think.rip.shift();
      const u=(x-MR.x)/MR.w*W, v=(y-MR.y)/MR.h*H;
      if(hots().some(h=>think.sel===h.s&&u>=h.x&&u<=h.x+h.w&&v>=h.y&&v<=h.y+h.h))thinkDone(true); else think.misses++;
    }
    return;
  }
  if(scene==='bus'&&bus.pressR&&Math.hypot(x-BTN.x,y-BTN.y)<90){pressStop();return}
  if(scene==='out'&&endUI.a>.6&&inR(x,y,{x:W/2-120,y:618,w:240,h:70})){location.reload();return}
  if(skipR){TTS.stop();VO.stop();const r=skipR;skipR=null;r()}
}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();tap((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);e.preventDefault()});

// ================= ループ =================
let speed=1;
function update(dt){
  tick(dt); musTick(dt);
  bus.scroll+=dt*150*bus.speed;
  bus.bumpT-=dt*bus.speed; if(bus.bumpT<=0){bus.bumpT=4+Math.random()*6;bus.bumpK=1}
  bus.bumpK=(bus.bumpK||0)*Math.pow(.02,dt); bus.bump=Math.sin(T*26)*4*bus.bumpK;
}
function draw(){
  ctx.setTransform(K,0,0,K,0,0);
  if(scene==='title'||scene==='bus')drawBus();
  else if(scene==='flash')drawFlash();
  else if(scene==='think')drawThink();
  else drawOut();
  drawSub();
  if(scene==='title')drawTitle(); else if(titleUI.a>0&&titleUI.a<1)drawTitle();
  if(veil.a>0){ctx.fillStyle=rgba(veil.c,veil.a);ctx.fillRect(0,0,W,H)}
}
bus.dim.a=.74;
let last=performance.now();
let fw=innerWidth,fh=innerHeight;
function frame(now){
  if(innerWidth!==fw||innerHeight!==fh){fw=innerWidth;fh=innerHeight;fit()}
  const dt=Math.min(.05,(now-last)/1000)*speed;last=now;update(dt);draw();requestAnimationFrame(frame)
}
requestAnimationFrame(frame);

if(DBG)window.dbg={
  get s(){return {scene,c:caseI,n:solvedN,T:+T.toFixed(1),sub:sub&&sub.text,think:think.on,sel:think.sel,solved,btn:!!bus.pressR,yaw:PA.yaw|0,gray:+PA.gray.toFixed(2),d:+out.d.toFixed(1),end:endUI.a}},
  set speed(v){speed=v}, VO, voiceOn(v){TTS.on=v}, tap, lot, shop, soba, lamp, desk, cross, walk5, lane, bus, think,
  async step(sec){const n=Math.round(sec*30);for(let i=0;i<n;i++){update(1/30);await new Promise(r=>setTimeout(r,0))}draw();return this.s},
  solve(){think.sel=hots()[0].s;thinkDone(true)}, giveup(){thinkDone(false)}, press:pressStop, start(n){titleUI.a=.999;run(n||0)}
};
})();
