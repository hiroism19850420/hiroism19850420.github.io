<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>パパの ひげ ぬき</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2b2233;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}

<script data-goatcounter="https://hiroism.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ===== 画面（PC・スマホ縦横） =====
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W=1280,H=720,SC=1,OX=0,OY=0,DPR=1,PORT=false;
let FX=640,FY=262,WS=1;const RX=240,RY=222;
const FONT='"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';
const BTN={normal:{x:0,y:0,w:300,h:104,txt:'ふつう'},hard:{x:0,y:0,w:300,h:104,txt:'むずかしい'}};
const RB={again:{x:0,y:0,w:280,h:84,txt:'もういちど'},title:{x:0,y:0,w:280,h:84,txt:'タイトルへ'}};
let BOX={x:0,y:0,w:900,h:600};
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);const w=innerWidth,h=innerHeight;
  cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);cv.style.width=w+'px';cv.style.height=h+'px';
  PORT=h>w*1.1;
  if(PORT){W=720;H=Math.round(clamp(720*h/w,1000,1560));FX=W/2;FY=Math.round(H*.40);WS=1;}
  else{H=720;W=Math.round(clamp(720*w/h,1000,1560));FX=W/2;FY=318;WS=.82;}
  SC=Math.min(w/W,h/H);OX=(w-W*SC)/2;OY=(h-H*SC)/2;
  BTN.normal.x=W/2-315;BTN.hard.x=W/2+15;BTN.normal.y=BTN.hard.y=PORT?H-300:H-178;
  BOX.w=Math.min(900,W-40);BOX.h=600;BOX.x=(W-BOX.w)/2;BOX.y=(H-BOX.h)/2;
  RB.again.x=W/2-300;RB.title.x=W/2+20;RB.again.y=RB.title.y=BOX.y+490;
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
const DBG=/[?&]dbg/.test(location.search);
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3), easeIn=t=>Math.pow(clamp(t,0,1),3);
const easeBack=t=>{t=clamp(t,0,1);const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};

// ===== 音 =====
let AC=null,MASTER=null,NOISE=null;
function initAudio(){
  if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
  MASTER=AC.createGain();MASTER.gain.value=.8;
  const comp=AC.createDynamicsCompressor();MASTER.connect(comp);comp.connect(AC.destination);
  NOISE=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  // iOS の無音解除
  const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);
}
function env(gn,t,a,peak,dcy){gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(peak,t+a);gn.gain.exponentialRampToValueAtTime(0.0001,t+a+dcy);}
function osc(type,f,t,dur,peak,f2,dest){const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(gn,t,.005,peak,dur);o.connect(gn);gn.connect(dest||MASTER);o.start(t);o.stop(t+dur+.05);}
function noise(t,dur,peak,ftype,freq,q){const s=AC.createBufferSource();s.buffer=NOISE;const f=AC.createBiquadFilter();f.type=ftype;f.frequency.value=freq;f.Q.value=q||1;const gn=AC.createGain();env(gn,t,.002,peak,dur);s.connect(f);f.connect(gn);gn.connect(MASTER);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
const SND={
  kick:t=>osc('sine',150,t,.16,.55,45),
  snare:t=>{noise(t,.13,.2,'bandpass',1900,.8);osc('triangle',220,t,.07,.1,140);},
  hat:(t,v)=>noise(t,.035,v||.06,'highpass',7500),
  bass:(t,f,d)=>{const o=AC.createOscillator(),fl=AC.createBiquadFilter(),gn=AC.createGain();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=520;env(gn,t,.01,.15,d);o.connect(fl);fl.connect(gn);gn.connect(MASTER);o.start(t);o.stop(t+d+.05);},
  lead:(t,f,d)=>{const o=AC.createOscillator(),fl=AC.createBiquadFilter(),gn=AC.createGain();o.type='square';o.frequency.value=f;fl.type='lowpass';fl.frequency.value=2200;env(gn,t,.01,.045,d);o.connect(fl);fl.connect(gn);gn.connect(MASTER);o.start(t);o.stop(t+d+.05);},
  bell:(t,f,d)=>{osc('sine',f,t,d||.5,.08);osc('sine',f*2.01,t,(d||.5)*.6,.03);},
  clack:t=>{noise(t,.03,.3,'bandpass',3800,4);osc('square',2400,t,.02,.05);},
  // おてほん：毛が はえる音
  sprout:t=>{osc('sine',480,t,.11,.42,1150);osc('triangle',960,t,.06,.1,2000);},
  grow:(t,d)=>{const o=AC.createOscillator(),lf=AC.createOscillator(),lg=AC.createGain(),gn=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(330,t);o.frequency.exponentialRampToValueAtTime(760,t+d);
    lf.frequency.value=14;lg.gain.value=28;lf.connect(lg);lg.connect(o.frequency);
    gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.38,t+.02);gn.gain.setValueAtTime(.38,t+d-.03);gn.gain.exponentialRampToValueAtTime(.0001,t+d+.04);
    o.connect(gn);gn.connect(MASTER);o.start(t);lf.start(t);o.stop(t+d+.1);lf.stop(t+d+.1);},
  pluck:t=>{osc('sine',700,t,.09,.35,1900);noise(t,.025,.25,'highpass',5000);},
  pull:(t,d)=>{const o=AC.createOscillator(),fl=AC.createBiquadFilter(),gn=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(820,t+d);fl.type='bandpass';fl.frequency.value=1200;fl.Q.value=3;gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(.14,t+.05);gn.gain.setValueAtTime(.14,t+Math.max(.06,d-.02));gn.gain.exponentialRampToValueAtTime(0.0001,t+d+.03);o.connect(fl);fl.connect(gn);gn.connect(MASTER);o.start(t);o.stop(t+d+.1);return {stop:(tt)=>{try{gn.gain.cancelScheduledValues(tt);gn.gain.setValueAtTime(.1,tt);gn.gain.exponentialRampToValueAtTime(0.0001,tt+.03);}catch(e){}}};},
  pon:t=>{osc('sine',520,t,.25,.45,1500);osc('triangle',1040,t+.03,.2,.15,2600);noise(t,.05,.3,'highpass',4000);},
  snap:t=>{noise(t,.08,.4,'lowpass',900);osc('square',160,t,.08,.08,90);},
  miss:t=>osc('triangle',140,t,.18,.25,80),
  whoosh:t=>{const s=AC.createBufferSource();s.buffer=NOISE;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2500,t+.3);const gn=AC.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.12,t+.12);gn.gain.exponentialRampToValueAtTime(.0001,t+.32);s.connect(f);f.connect(gn);gn.connect(MASTER);s.start(t);s.stop(t+.4);},
  meow:t=>{const o=AC.createOscillator(),gn=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(600,t);o.frequency.linearRampToValueAtTime(900,t+.12);o.frequency.linearRampToValueAtTime(500,t+.35);env(gn,t,.03,.12,.35);o.connect(gn);gn.connect(MASTER);o.start(t);o.stop(t+.45);},
  hai:t=>{osc('square',880,t,.05,.07);osc('square',1320,t+.06,.08,.07);},
  tap:t=>osc('sine',1300,t,.05,.12,900)
};

// ===== 曲と譜面 =====
// 1人の顔 = 12拍：0-2 登場 / 2-6 おてほん（毛がはえる）/ 6-10 まねして ぬく / 10.6- たいじょう
let BPM=118,BEAT=60/BPM,SLOT=BEAT/2,DIFF=0;
const FACE_BEATS=12,INTRO_BEATS=8,CALL_B=2,RESP_B=6;
// 1文字=8分音符。o=短い毛 L=長い毛(-でのばす。おしっぱなしで 1拍あとに はなす) .=なし。先頭 * = ねこが かくす
const PATS=[
 ['o.o.o.o.','oo..oo..','o.o.L-..','L-..L-..','*o.o.o.o.','oo.oo.o.','o.oo.oo.','L-o.L-o.',
  '*oo..oo..','ooo.ooo.','oo.oL-..','L-.L-.o.','*o.oo.oo.','oooo.oo.','*oo.L-.o.','oooooooo'],
 // むずかしい：はやい・うらはく・長い毛のつづけざま・ねこ多め
 ['o.o.o.o.','.o.o.o.o','o..o..o.','L-oL-oo.','*o..o..o.','oo.o.oo.','.oo.oo.o','L-L-L-L-',
  '*.o.o.oo.','ooooL-..','o.L-oooo','*L-oL-oo.','.ooo.ooo','oL-oL-o.','*oo.o.oo.','o.oooo.o',
  '.L-.L-.o','*.ooo.ooo','L-oooL-o','oooooooo']
];
const BPMS=[118,140];
let SEQ=[],N=0;
function setDiff(d){
  DIFF=d;BPM=BPMS[d];BEAT=60/BPM;SLOT=BEAT/2;
  SEQ=PATS[d].map((p,i)=>{const cover=p[0]==='*';const pat=cover?p.slice(1):p;const hairs=[];
    for(let s=0;s<8;s++){const c=pat[s];if(c==='o'||c==='L')hairs.push({s,long:c==='L'});}
    return {pat,cover,v:(i*2+(i>>2))%3,hairs};});
  N=SEQ.length;
}
setDiff(0);
const CHORDS=[[48,52,55],[45,48,52],[41,45,48],[43,47,50]]; // C Am F G
const mf=m=>440*Math.pow(2,(m-69)/12);
const RIFF=[[0,2,4,7,4,2,4,-1, 2,4,7,9,7,4,2,-1],[7,-1,4,7,9,7,4,2, 4,-1,2,4,0,-1,-1,-1]];
const SCALE=[0,2,4,5,7,9,11,12,14,16];

// ===== 状態 =====
let mode='title';
let start=0,hairs=[],parts=[],pops=[],stats=null,faceFX=[],holding=null,pullSnd=null;
let evq=[],evi=0,resultAt=0,dbgAuto=false,keyDown={},lat=0;
let titleT=0,shake=0,pressFX=-9;
function now(){return AC?AC.currentTime:performance.now()/1000;}
function songT(){return now()-start-lat;}
function faceStart(i){return (INTRO_BEATS+i*FACE_BEATS)*BEAT;}

function startGame(d){
  if(d!==undefined)setDiff(d);
  initAudio();AC.resume();
  lat=Math.min(.12,(AC.outputLatency||0)+(AC.baseLatency||0));
  start=AC.currentTime+.35;mode='play';
  hairs=[];parts=[];pops=[];faceFX=SEQ.map(()=>({react:'sleep',rt:-9}));holding=null;
  stats={hit:0,great:0,miss:0,brk:0,total:0};
  SEQ.forEach((f,i)=>f.hairs.forEach(h=>{
    const fs=faceStart(i);
    const o={face:i,s:h.s,long:h.long,ct:fs+CALL_B*BEAT+h.s*SLOT,t:fs+RESP_B*BEAT+h.s*SLOT,state:'on',seed:Math.random()*100};
    o.rt=o.t+2*SLOT;hairs.push(o);stats.total++;}));
  // 音
  evq=[];evi=0;
  const total=INTRO_BEATS+N*FACE_BEATS+4;
  for(let b=0;b<total;b++){
    const t=b*BEAT,bar=Math.floor(b/4),bi=b%4;
    if(b<INTRO_BEATS){ if(b>=4) evq.push({t,f:tt=>SND.clack(tt)}); else evq.push({t,f:tt=>SND.hat(tt,.08)}); continue;}
    if(b>=INTRO_BEATS+N*FACE_BEATS){ if(b===INTRO_BEATS+N*FACE_BEATS){evq.push({t,f:tt=>{SND.kick(tt);[60,64,67,72].forEach((m,k)=>SND.bell(tt+k*.07,mf(m+12),1.2));}});} continue;}
    const ch=CHORDS[bar%4];
    const fb=(b-INTRO_BEATS)%FACE_BEATS,fi=Math.floor((b-INTRO_BEATS)/FACE_BEATS);
    const quiet=fb>=CALL_B&&fb<RESP_B+4; // おてほん・本番中は 伴奏を軽く
    evq.push({t,f:tt=>{SND.kick(tt);if(bi%2===1)SND.snare(tt);SND.hat(tt,quiet?.035:.06);SND.hat(tt+SLOT,.03);
      SND.bass(tt,mf(ch[0]-12+(bi===3?7:0)),BEAT*.45);if(!quiet)SND.bass(tt+SLOT,mf(ch[0]),BEAT*.3);}});
    if(fb===0) evq.push({t:t-BEAT*.5,f:tt=>SND.whoosh(tt)});
    if(fb===0&&SEQ[fi].cover) evq.push({t:t+BEAT*.8,f:tt=>SND.meow(tt)});
    if(fb===RESP_B-1) evq.push({t:t+SLOT,f:tt=>SND.hai(tt)}); // 「はい」の合図
    if(fb<CALL_B||fb>=RESP_B+4){
      const riff=RIFF[(fi+(bar%2))%2];
      for(let k=0;k<2;k++){const st=((b%4)*2+k+(bar%2)*8)%16;const n=riff[st];
        if(n>=0) evq.push({t:t+k*SLOT,f:tt=>SND.lead(tt,mf(72+SCALE[(n+ch[0]-48+70)%8]),SLOT*.8)});}
    }
  }
  // おてほんの音（毛が はえる）
  for(const h of hairs){ if(h.long) evq.push({t:h.ct,f:tt=>SND.grow(tt,2*SLOT)}); else evq.push({t:h.ct,f:tt=>SND.sprout(tt)}); }
  evq.sort((a,b)=>a.t-b.t);
}
function schedule(){
  if(mode!=='play'&&mode!=='end')return;
  const t=now()-start;
  while(evi<evq.length&&evq[evi].t<t+.25){const e=evq[evi++];if(e.t>t-.05)e.f(start+e.t);}
}

// ===== 判定 =====
const WIN_GREAT=.075,WIN_OK=.15;
function press(){
  if(mode!=='play')return;
  const t=songT();
  if(holding){const hh=holding;if(t>=hh.rt-WIN_OK){holding=null;if(pullSnd)pullSnd.stop(now());finishLong(hh);}else return;}
  let best=null,bd=9;
  for(const h of hairs){ if(h.state!=='on')continue; const d=Math.abs(t-h.t); if(d<bd){bd=d;best=h;} if(h.t>t+.5)break;}
  pressFX=t;
  if(!best||bd>WIN_OK){SND.tap(now());return;}
  const great=bd<=WIN_GREAT;
  if(!best.long){
    best.state='gone';stats.hit++;if(great)stats.great++;
    SND.pluck(now());flyHair(best,false);react(best.face,'pop');
    addPop(best,great?'ピッ':'スッ',great?'#ff4f7b':'#7a6a8a');
  }else{
    best.state='hold';best.pt=t;best.great=great;holding=best;
    pullSnd=SND.pull(now(),Math.max(.08,best.rt-t));react(best.face,'pop');
  }
}
function release(){
  if(mode!=='play')return;
  const h=holding;if(!h)return;holding=null;
  const t=songT();if(pullSnd)pullSnd.stop(now());
  if(t>=h.rt-WIN_OK){finishLong(h);}else{
    h.state='broken';stats.brk++;SND.snap(now());react(h.face,'ouch');addPop(h,'ぷちっ','#666');shake=.25;
  }
}
function finishLong(h){
  h.state='gone';stats.hit++;if(h.great)stats.great++;SND.pon(now());flyHair(h,true);react(h.face,'laugh');addPop(h,'スポーン！','#ff7a00');
}
function react(i,r){faceFX[i].react=r;faceFX[i].rt=songT();}

// ===== 形 =====
function slotAng(s){return (155-s*(130/7))*Math.PI/180;}
function rootOf(s,ox){const a=slotAng(s);return {x:FX+ox+Math.cos(a)*RX*.97,y:FY+Math.sin(a)*RY*.97,nx:Math.cos(a)*RY,ny:Math.sin(a)*RX};}
function norm(r){const l=Math.hypot(r.nx,r.ny);return {x:r.nx/l,y:r.ny/l};}
function faceOffset(i,t){
  const b=(t-faceStart(i))/BEAT;const far=W*.9+300;
  if(b<0)return 9999; if(b<1.1)return lerp(far,0,easeBack(b/1.1));
  if(b<10.6)return 0; return lerp(0,-far,easeIn((b-10.6)/1.2));
}
function flyHair(h,big){
  const r=rootOf(h.s,0),n=norm(r);
  parts.push({type:'hair',x:r.x,y:r.y,vx:n.x*(big?520:300)+(Math.random()-.5)*120,vy:n.y*(big?520:300)-(big?520:330),rot:Math.atan2(n.y,n.x),vr:(Math.random()-.5)*(big?16:12),long:h.long,seed:h.seed,life:1.2,age:0});
  for(let k=0;k<(big?10:5);k++)parts.push({type:'star',x:r.x,y:r.y,vx:(Math.random()-.5)*400,vy:(Math.random()-.5)*400-80,life:.45,age:0,c:big?'#ffcf3a':'#fff'});
}
function addPop(h,txt,col){const r=rootOf(h.s,0),n=norm(r);pops.push({x:r.x+n.x*120,y:r.y+n.y*90,txt,col,age:0});}

// ===== 描画パーツ =====
function hairPath(x,y,ang,len,seed,taut){
  g.save();g.translate(x,y);g.rotate(ang);g.beginPath();g.moveTo(0,0);
  const w=taut?2:Math.sin(seed)*.5+1;
  g.bezierCurveTo(len*.35,-len*.18*w,len*.6,len*.2*w,len*.85,-len*.05*w);
  if(len>40&&!taut){g.bezierCurveTo(len*1.02,-len*.18,len*1.08,len*.06,len*.94,len*.06);}
  g.stroke();g.restore();
}
function drawHair(h,ox,t){
  if(t<h.ct)return null;
  const r=rootOf(h.s,ox),n=norm(r),ang=Math.atan2(n.y,n.x);
  g.lineCap='round';g.strokeStyle='#2a1d1d';g.lineWidth=8;
  const sway=Math.sin(t*6+h.seed)*.08;
  if(h.state==='hold'){
    const k=clamp((t-h.pt)/Math.max(.05,h.rt-h.pt),0,1);const d=30+k*90;
    const tx=r.x+n.x*d,ty=r.y+n.y*d;
    g.beginPath();g.moveTo(r.x,r.y);g.lineTo(tx,ty);g.stroke();
    hairPath(tx,ty,ang+.5+Math.sin(t*20)*.1,60,h.seed,false);
    g.fillStyle='rgba(0,0,0,.08)';g.beginPath();g.ellipse(r.x,r.y,10+k*8,6,ang,0,7);g.fill();
    return {x:tx,y:ty,ang};
  }
  if(h.state==='broken'){hairPath(r.x,r.y,ang+sway,h.long?26:16,h.seed,false);return null;}
  // はえる アニメ（長い毛は 1拍かけて のびる）
  const gd=h.long?2*SLOT:.09;const gk=clamp((t-h.ct)/gd,0,1);
  const len=(h.long?140:58)*(h.long?gk:easeBack(gk));
  if(len>2)hairPath(r.x,r.y,ang+sway+(1-gk)*.3*Math.sin(t*40),len,h.seed,false);
  if(t-h.ct<.25){g.fillStyle='rgba(255,255,255,'+(1-(t-h.ct)/.25)+')';star(r.x+n.x*20,r.y+n.y*20,14);}
  return null;
}
function drawFace(i,ox,t){
  const f=SEQ[i],fx=faceFX[i]||{react:'sleep',rt:-9},v=f.v;
  const pal=[{skin:'#ffd9b5',sh:'#f2b98f',ch:'#ffab9a'},{skin:'#ffe3cc',sh:'#ecc0a2',ch:'#ffb3a8'},{skin:'#eebf93',sh:'#d79c6d',ch:'#ef9878'}][v];
  const cx=FX+ox,cy=FY;
  const since=t-fx.rt;let react=fx.react;
  if(react==='pop'&&since>.3)react='sleep';
  if(react==='laugh'&&since>.6)react='sleep';
  if(react==='ouch'&&since>.7)react='sleep';
  const bob=Math.sin(t*Math.PI/BEAT)*4;
  const squash=react==='pop'?1+Math.max(0,.06-since*.2):1;
  g.save();g.translate(cx,cy+bob);g.scale(1/squash,squash);g.translate(-cx,-(cy+bob));
  g.fillStyle=pal.skin;g.strokeStyle='#3b2a2a';g.lineWidth=6;
  for(const sd of[-1,1]){g.beginPath();g.ellipse(cx+sd*RX*.98,cy+bob+10,34,48,0,0,7);g.fill();g.stroke();
    g.fillStyle=pal.sh;g.beginPath();g.ellipse(cx+sd*RX*.98,cy+bob+12,16,26,0,0,7);g.fill();g.fillStyle=pal.skin;}
  const gr=g.createRadialGradient(cx-70,cy+bob-90,30,cx,cy+bob,RX*1.1);gr.addColorStop(0,'#fff3e6');gr.addColorStop(.35,pal.skin);gr.addColorStop(1,pal.sh);
  g.fillStyle=gr;g.beginPath();g.ellipse(cx,cy+bob,RX,RY,0,0,7);g.fill();g.stroke();
  g.fillStyle='rgba(90,90,120,.13)';g.beginPath();g.ellipse(cx,cy+bob+120,150,82,0,0,Math.PI);g.fill();
  g.fillStyle='rgba(60,50,60,.22)';

let lastFrame=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-lastFrame)/1000||0);lastFrame=ts;titleT+=dt;
  schedule();
  g.setTransform(1,0,0,1,0,0);g.fillStyle='#2b2233';g.fillRect(0,0,cv.width,cv.height);
  g.setTransform(DPR*SC,0,0,DPR*SC,DPR*OX,DPR*OY);
  g.save();g.beginPath();g.rect(0,0,W,H);g.clip();
  if(mode==='title')drawTitle();
  else if(mode==='play'||mode==='end')drawPlay(dt);
  else if(mode==='result')drawResult();
  g.restore();
}
function drawPlay(dt){
  const t=songT();
  if(shake>0)shake-=dt;
  g.save();if(shake>0)g.translate((Math.random()-.5)*56*shake,(Math.random()-.5)*40*shake);
  drawBG(t);
  g.save();g.translate(FX,FY);g.scale(WS,WS);g.translate(-FX,-FY);
  if(dbgAuto&&mode==='play'){for(const h of hairs){if(h.state==='hold'&&t>=h.rt)release();if(h.state==='on'&&t>=h.t){press();if(!h.long)release();}}}
  if(mode==='play')for(const h of hairs){
    if(h.state==='on'&&t>h.t+WIN_OK){h.state='missed';stats.miss++;SND.miss(now());react(h.face,'ouch');addPop(h,'あれっ','#888');}
    if(h.state==='hold'&&t>h.rt+WIN_OK){holding=null;if(pullSnd)pullSnd.stop(now());finishLong(h);}
  }
  const cur=clamp(Math.floor((t/BEAT-INTRO_BEATS)/FACE_BEATS),0,N-1);

    drawFace(i,ox,t);
    for(const h of hairs){if(h.face!==i||h.state==='gone')continue;const r=drawHair(h,ox,t);if(r)holdPt=r;}
    if(SEQ[i].cover){const b=(t-faceStart(i))/BEAT;const k=b<1?0:b<1.9?(b-1)/.9:b<10.2?1:1-(b-10.2)/.8;if(k>0)drawCat(FX+ox,FY+250,t,clamp(k,0,1));}
  }
  // とぶ毛
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.age+=dt;if(p.age>p.life){parts.splice(k,1);continue;}
    p.vy+=1300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.type==='hair'){p.rot+=p.vr*dt;g.globalAlpha=1-p.age/p.life*.6;g.strokeStyle='#2a1d1d';g.lineWidth=8;g.lineCap='round';hairPath(p.x,p.y,p.rot,p.long?140:58,p.seed,false);
      g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,5,0,7);g.fill();g.globalAlpha=1;}
    else{const a=1-p.age/p.life;g.fillStyle=p.c;g.globalAlpha=a;star(p.x,p.y,10*a+4);g.globalAlpha=1;}}

      let lift=0;if(fb<RESP_B-1)lift=700;else if(fb<RESP_B-.2)lift=lerp(700,0,easeOut((fb-(RESP_B-1))/.8));

    const s=easeBack(p.age/.18);g.save();g.translate(p.x,p.y-p.age*40);g.scale(s,s);g.globalAlpha=1-Math.max(0,p.age-.45)/.25;
    outlineText(p.txt,0,0,34,p.col,8);g.restore();}

  // 「きいて」「まねして」

    let label='',col='#7a5ad0';
    if(fb>=1.4&&fb<RESP_B-.6){label=SEQ[cur].cover?'みみで きいて…':'よく きいて…';}
    else if(fb>=RESP_B-.6&&fb<RESP_B+4.2){label='おなじ リズムで ぬけ！';col='#ff5a7a';}
    if(label){g.save();g.textAlign='center';const ty=PORT?FY-RY-110:48;
      const k=fb<RESP_B-.6?easeBack((fb-1.4)/.3):easeBack((fb-RESP_B+.6)/.3);g.translate(W/2,ty);g.scale(k,k);

    // おてほんの 拍マーク

      for(let s=0;s<8;s++){const x=W/2-140+s*40;const c=f.pat[s];const isCall=fb<RESP_B;const at=(isCall?CALL_B:RESP_B)+s/2;const lit=fb>=at&&fb<at+.5;
        g.fillStyle=lit?(isCall?'#7a5ad0':'#ff5a7a'):'rgba(122,90,160,.25)';g.beginPath();g.arc(x,ty,lit?9:6,0,7);g.fill();}
      g.restore();}
  }
  if(PORT&&mode==='play'){const by=H-230,pr=(t-pressFX)<.1;g.save();g.globalAlpha=pr?.55:.3;g.fillStyle='#fff';g.beginPath();g.roundRect(W/2-200,by-60,400,120,60);g.fill();
    g.globalAlpha=pr?.9:.6;g.textAlign='center';g.textBaseline='middle';g.font='34px '+FONT;g.fillStyle='#3d5a9a';g.fillText('どこでも タップ',W/2,by);g.restore();}
  // のこり
  const left=N-clamp(Math.floor((t/BEAT-INTRO_BEATS+1.2)/FACE_BEATS),0,N);

  g.fillStyle='#ffd9b5';g.strokeStyle='#3b2a2a';g.lineWidth=4;g.beginPath();g.arc(58,H-55,24,0,7);g.fill();g.stroke();
  g.lineWidth=3;g.beginPath();g.arc(50,H-60,6,Math.PI*.15,Math.PI*.85);g.stroke();g.beginPath();g.arc(66,H-60,6,Math.PI*.15,Math.PI*.85);g.stroke();
  g.font='44px '+FONT;g.textAlign='left';g.fillStyle='#3b2a2a';g.fillText(left,96,H-38);g.restore();

    if(b<4){outlineText('パパが ねてる すきに…',0,0,56,'#ff5a7a',12);
      const hs=['① まず おてほんの リズムを きく','② おなじ リズムで タップして ぬく','ながい毛は おしっぱなし → 1拍あとに はなす'];

  const k=titleT-resultAt;drawBG(titleT);
  g.fillStyle='rgba(43,34,51,.55)';g.fillRect(0,0,W,H);
  const tot=stats.total,hit=stats.hit,gr=stats.great,bad=tot-hit,rate=hit/tot;
  let rank,col,cm;
  if(bad===0){rank='はなまる！';col='#ff5a7a';cm=['ぜんぶ ツルツル！','パパは さいごまで ぐっすりでした。','かんぺきな ひげぬき 職人です。'];}
  else if(rate>=.85){rank='いいかんじ';col='#ff9a1f';cm=['だいたい ツルツル。','ちょっと パパが ねがえりを うちました。','つぎは のこさず ぬいてみよう。'];}
  else {rank='もうすこし';col='#3d7bff';cm=['ひげが けっこう のこっています。','おてほんの リズムを よく きいて、','おなじように タップしてみよう。'];}
  const X=W/2,Y=BOX.y;
  g.save();g.textAlign='center';
  g.fillStyle='#fff';g.beginPath();g.roundRect(BOX.x,BOX.y,BOX.w,BOX.h,40);g.fill();
  g.font='34px '+FONT;g.fillStyle='#7a5a6a';g.fillText('ひげ チェック',X,Y+70);
  g.font='22px '+FONT;g.fillStyle=DIFF?'#7a3dd8':'#ff5a7a';g.fillText(DIFF?'【むずかしい】':'【ふつう】',X,Y+104);
  g.font=(BOX.w<700?25:28)+'px '+FONT;g.fillStyle='#3b2a2a';
  cm.forEach((s,i)=>{if(k>.4+i*.5)g.fillText(s,X,Y+140+i*46);});
  if(k>.4){g.font='24px '+FONT;g.fillStyle='#7a5a6a';g.fillText('ぬいた毛 '+hit+' / '+tot+'　（ピッ！'+gr+'）',X,Y+310);}
  if(k>2){const s=easeBack((k-2)/.35);g.save();g.translate(X,Y+420);g.rotate(-.05);g.scale(s,s);g.font='84px '+FONT;g.lineWidth=16;g.lineJoin='round';g.strokeStyle='#3b2a2a';g.strokeText(rank,0,0);g.fillStyle=col;g.fillText(rank,0,0);g.restore();}
  g.restore();
  if(k>2.6){drawBtn(RB.again,'#ff5a7a',true);drawBtn(RB.title,'#8a7a9a',false);}
}
function hit(b,x,y){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}

// ===== 入力（タッチ・マウス・キー） =====
let downs=0;
function toLocal(e){return {x:(e.clientX-OX)/SC,y:(e.clientY-OY)/SC};}
function tryFull(){if(!DBG&&matchMedia('(pointer:coarse)').matches&&document.documentElement.requestFullscreen&&!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(AC.state!=='running')AC.resume();
  const p=toLocal(e);
  if(mode==='title'){if(hit(BTN.normal,p.x,p.y)){tryFull();startGame(0);}else if(hit(BTN.hard,p.x,p.y)){tryFull();startGame(1);}return;}
  if(mode==='result'){if(titleT-resultAt<2.6)return;if(hit(RB.again,p.x,p.y))startGame();else if(hit(RB.title,p.x,p.y))mode='title';return;}
  downs++;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  press();},{passive:false});
const up=e=>{if(mode!=='play'&&mode!=='end'){downs=0;return;}if(downs>0)downs--;if(downs===0)release();};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.repeat||keyDown[e.code])return;
  if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
  if(mode==='title'){if(e.code==='Space'||e.code==='Enter'||e.code==='Digit1')startGame(0);else if(e.code==='Digit2'||e.code==='KeyH')startGame(1);return;}
  if(mode==='result'){if(titleT-resultAt>2.6&&(e.code==='Space'||e.code==='Enter'))startGame();if(e.code==='Escape')mode='title';return;}
  if(e.code==='Escape'){mode='title';return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  keyDown[e.code]=1;press();});
addEventListener('keyup',e=>{if(!keyDown[e.code])return;delete keyDown[e.code];if(Object.keys(keyDown).length===0)release();});
addEventListener('blur',()=>{keyDown={};downs=0;release();});

if(DBG){window.dbg={start:(d)=>startGame(d||0),auto:(v)=>{dbgAuto=v!==false;},skip:(i)=>{start-=faceStart(i)-songT();evi=evq.findIndex(e=>e.t>now()-start);if(evi<0)evi=evq.length;},state:()=>({mode,t:songT(),stats})};}
requestAnimationFrame(frame);
</script>
