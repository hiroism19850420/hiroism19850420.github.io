<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>グラフを歩こう — ダイヤグラム かいせつ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6ec; --card:#ffffff; --ink:#2b2a33; --mute:#8a8576; --line:#e4dccb;
  --p0:#2f6fed; --p1:#ef7d00; --road:#d9d2c0; --grass:#cfe8c3; --sky:#e8f3fb; --hl:#e0457b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d1c22;--card:#2a2931;--ink:#f1eee6;--mute:#a09ba8;--line:#3d3b47;--p0:#6aa0ff;--p1:#ffa733;--road:#4a4658;--grass:#2c4a2f;--sky:#243142;--hl:#ff6f9f}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:500;line-height:1.6;font-size:16px}
header{padding:10px 16px 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
header h1{margin:0;font-size:19px;font-weight:900}
header small{color:var(--mute)}
nav{display:flex;gap:6px;padding:8px 16px;overflow-x:auto}
nav button{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:900;font-size:16px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:0 16px 24px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.prob{grid-column:1/-1}
.prob h2{margin:0 0 2px;font-size:17px;font-weight:900}
.stars{color:#f0a000;letter-spacing:2px}
.prob p{margin:0}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
.right{display:flex;flex-direction:column;gap:12px;min-width:0}
#road{width:100%;height:auto;display:block;border-radius:12px}
.read{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.chip{border-radius:999px;padding:2px 12px;font-weight:900;border:2px solid var(--line);background:var(--bg)}
.chip.t{font-size:20px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.c0{border-color:var(--p0);color:var(--p0)} .chip.c1{border-color:var(--p1);color:var(--p1)}
.chip.gap{color:var(--mute)}
#graph{width:100%;height:auto;display:block}
svg text{font-family:"Zen Maru Gothic",sans-serif;font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl button,.ctl select{font:inherit;font-weight:900;font-size:15px;border-radius:999px;border:2px solid var(--ink);padding:6px 16px;cursor:pointer;background:var(--card);color:var(--ink)}
.ctl button.go{background:var(--ink);color:var(--bg)}
.ctl label{font-size:14px;color:var(--mute);display:flex;gap:4px;align-items:center;cursor:pointer}
.slidebox{position:relative;width:100%;padding-top:2px}
#slide{width:100%;margin:0}
#ticks{position:relative;height:14px}
#ticks i{position:absolute;top:0;width:3px;height:12px;border-radius:2px;background:var(--hl);transform:translateX(-1px)}
.say{min-height:120px}
.say h3{margin:0 0 2px;font-size:13px;color:var(--mute);font-weight:700}
.say .t{font-size:18px;font-weight:900}
.say .at{color:var(--mute);font-size:14px}
.subs h3{margin:0 0 6px;font-size:15px;font-weight:900}
.sub{border-top:1px dashed var(--line);padding:8px 0}
.sub:first-of-type{border-top:0}
.sub .q{font-weight:700}
.sub .b{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.sub button{font:inherit;font-weight:900;font-size:14px;border-radius:999px;border:2px solid var(--ink);padding:3px 14px;cursor:pointer;background:var(--card);color:var(--ink)}
.sub button.look{background:var(--hl);border-color:var(--hl);color:#fff}
.sub .ans{display:none;margin-top:6px;background:var(--bg);border-radius:12px;padding:6px 10px}
.sub .ans.open{display:block}
.sub .ans b{font-size:18px}
.sub .ans .s{font-size:14px;color:var(--mute)}
.pulse{animation:pl 1.1s ease-in-out infinite}
@keyframes pl{50%{opacity:.55}}
.bob{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
</style>
<script data-goatcounter="https://hiroism.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>
<body>
<header><h1>グラフを 歩こう</h1><small>人が 歩くと、グラフの 線が のびていくよ</small></header>
<nav id="nav"></nav>
<main>
  <section class="card prob" id="prob"></section>
  <div class="left">
    <section class="card">
      <svg id="road" viewBox="0 0 680 190"></svg>
      <div class="read" id="read"></div>
    </section>
    <section class="card">
      <svg id="graph" viewBox="0 0 480 300"></svg>
    </section>
  </div>
  <div class="right">
    <section class="card">
      <div class="ctl">
        <button id="restart" title="はじめから">⏮</button>
        <button id="play" class="go">▶ うごかす</button>
        <button id="next">つぎの できごと ▶</button>
        <select id="rate"><option value="1.5">ゆっくり</option><option value="3" selected>ふつう</option><option value="6">はやい</option></select>
        <label><input type="checkbox" id="stop" checked>できごとで とまる</label>
      </div>
      <div class="slidebox"><input type="range" id="slide" min="0" max="100" step="0.05" value="0"><div id="ticks"></div></div>
    </section>
    <section class="card say" id="say"></section>
    <section class="card subs" id="subs"></section>
  </div>
</main>

const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const COLORS=['var(--p0)','var(--p1)'];
let cur=null, T=0, playing=false, tween=null, hl=null, lastTs=0;

/* ---------- 計算 ---------- */
function posAt(p,t){
  const a=p.pts;
  if(t<=a[0][0])return a[0][1];
  for(let i=0;i<a.length-1;i++){
    const [t0,x0]=a[i],[t1,x1]=a[i+1];
    if(t>=t0&&t<=t1)return t1===t0?x0:x0+(x1-x0)*(t-t0)/(t1-t0);
  }
  return a[a.length-1][1];
}
function velAt(p,t){
  const a=p.pts;
  for(let i=0;i<a.length-1;i++){
    const [t0,x0]=a[i],[t1,x1]=a[i+1];
    if(t>=t0&&t<t1)return (x1-x0)/(t1-t0);
  }
  return 0;
}
function poseAt(p,t){
  const a=p.pts, s=a[0][0], e=a[a.length-1][0];
  if(t<s-1e-9)return 'wait';
  if(t>=e-1e-9)return 'done';
  return Math.abs(velAt(p,t))<1e-9?'rest':'walk';
}
function lastDir(p,t){
  const a=p.pts; let d=0;
  for(let i=0;i<a.length-1;i++){ if(a[i][0]<=t+1e-9){const v=a[i+1][1]-a[i][1]; if(v!==0)d=Math.sign(v);} }
  if(d===0){const v=a[a.length-1][1]-a[0][1]; d=v<0?-1:1;}
  return d;
}
const tEnd=q=>Math.max(...q.persons.map(p=>p.pts[p.pts.length-1][0]));

/* ---------- 棒人間 ---------- */
function figure(col){
  const g=document.createElementNS(NS,'g');
  g.innerHTML=`
   <g class="fl"><g class="body" stroke="${col}" stroke-width="3.2" stroke-linecap="round" fill="none">
     <circle class="head" cx="0" cy="-34" r="6.5" fill="var(--card)"/>
     <line class="torso" x1="0" y1="-27" x2="0" y2="-13"/>
     <line class="armL" x1="0" y1="-24" x2="-8" y2="-15"/><line class="armR" x1="0" y1="-24" x2="8" y2="-15"/>
     <line class="legL" x1="0" y1="-13" x2="-6" y2="0"/><line class="legR" x1="0" y1="-13" x2="6" y2="0"/>
   </g></g>
   <g class="fx"></g>`;
  return g;
}
function poseFigure(g,pose,phase,dir,t){
  const q=(c)=>g.querySelector(c);
  const fl=q('.fl'); fl.setAttribute('transform',`scale(${dir},1)`);
  const set=(el,x1,y1,x2,y2)=>{el.setAttribute('x1',x1);el.setAttribute('y1',y1);el.setAttribute('x2',x2);el.setAttribute('y2',y2);};
  const head=q('.head'),torso=q('.torso'),aL=q('.armL'),aR=q('.armR'),lL=q('.legL'),lR=q('.legR'),fx=q('.fx');
  g.style.opacity=pose==='wait'?'.55':'1';
  let fxh='';
  if(pose==='walk'){
    const s=Math.sin(phase);
    head.setAttribute('cy',-34);set(torso,0,-27,0,-13);
    set(aL,0,-24,-8*s,-14);set(aR,0,-24,8*s,-14);
    set(lL,0,-13,9*s,0);set(lR,0,-13,-9*s,0);
  }else if(pose==='rest'){
    /* 地面に すわって ひと休み：ひざを かかえる */
    head.setAttribute('cx',-3);head.setAttribute('cy',-22);
    set(torso,-3,-15,-3,-5);
    set(aL,-3,-12,8,-11);set(aR,-3,-12,9,-9);
    set(lL,-3,-5,9,-12);set(lR,9,-12,12,0);
    const b=(Math.sin(t*4)+1)/2;
    fxh=`<text x="${-16*dir}" y="${-36-b*3}" font-size="12" fill="var(--mute)" text-anchor="middle" transform="scale(${dir},1)" style="paint-order:stroke;stroke:var(--card);stroke-width:3px">ふぅ…</text><text x="${14*dir}" y="${-24+b*3}" font-size="11" text-anchor="middle">💧</text>`;
  }else if(pose==='done'){
    head.setAttribute('cx',0);head.setAttribute('cy',-34);set(torso,0,-27,0,-13);
    set(aL,0,-25,-8,-36);set(aR,0,-25,8,-36);set(lL,0,-13,-5,0);set(lR,0,-13,5,0);
  }else{
    head.setAttribute('cx',0);head.setAttribute('cy',-34);set(torso,0,-27,0,-13);
    set(aL,0,-24,-4,-14);set(aR,0,-24,4,-14);set(lL,0,-13,-4,0);set(lR,0,-13,4,0);
  }
  if(pose!=='rest'){head.setAttribute('cx',0);}
  fx.innerHTML=fxh;
}

/* ---------- 道 ---------- */
const RW=680, RX0=70, RX1=610, RY=118;
let figs=[], roadX=()=>0, gX=()=>0, gY=()=>0;
function buildRoad(q){
  const s=$('road'); s.innerHTML='';
  const px=m=>RX0+(RX1-RX0)*m/q.L; roadX=px;
  const mk=(tag,at,txt)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!==undefined)e.textContent=txt;s.appendChild(e);return e;};
  mk('rect',{x:0,y:0,width:RW,height:95,fill:'var(--sky)'});
  mk('rect',{x:0,y:95,width:RW,height:95,fill:'var(--grass)'});
  mk('rect',{x:RX0-30,y:RY-30,width:RX1-RX0+60,height:52,rx:10,fill:'var(--road)'});
  mk('line',{x1:RX0-20,y1:RY-5,x2:RX1+20,y2:RY-5,stroke:'var(--card)','stroke-width':2,'stroke-dasharray':'10 8',opacity:.8});
  // めもり
  const step=q.xstep>=300?q.xstep:300;
  for(let m=0;m<=q.L;m+=step){
    mk('line',{x1:px(m),y1:RY+18,x2:px(m),y2:RY+25,stroke:'var(--mute)','stroke-width':1.5});
    mk('text',{x:px(m),y:RY+39,'text-anchor':'middle','font-size':12,fill:'var(--mute)'},m+'m');
  }
  mk('line',{x1:px(q.L),y1:RY+18,x2:px(q.L),y2:RY+25,stroke:'var(--mute)','stroke-width':1.5});
  mk('text',{x:px(q.L),y:RY+39,'text-anchor':'middle','font-size':12,fill:'var(--mute)'},q.L+'m');
  // 場所
  mk('text',{x:RX0-30,y:RY-34,'font-size':34,'text-anchor':'middle'},q.ea);
  mk('text',{x:RX1+30,y:RY-34,'font-size':34,'text-anchor':'middle'},q.eb);
  mk('text',{x:RX0-30,y:34,'font-size':14,'text-anchor':'middle',fill:'var(--ink)'},q.a);
  mk('text',{x:RX1+30,y:34,'font-size':14,'text-anchor':'middle',fill:'var(--ink)'},q.b);
  mk('g',{id:'roadhl'});
  figs=q.persons.map((p,i)=>{
    const g=figure(COLORS[i]); s.appendChild(g);
    const tag=document.createElementNS(NS,'g');
    tag.innerHTML=`<text class="nm" y="-48" text-anchor="middle" font-size="14" font-weight="900" fill="${COLORS[i]}" style="paint-order:stroke;stroke:var(--card);stroke-width:4px">${p.name}</text>`;
    g.appendChild(tag);
    return g;
  });
}
/* ---------- グラフ ---------- */
const GW=480,GH=300,GL=56,GR=16,GT=18,GB=36;
function buildGraph(q){
  const s=$('graph'); s.innerHTML='';
  const tx=q.tmax, ty=q.xmax;
  gX=t=>GL+(GW-GL-GR)*t/tx; gY=x=>GH-GB-(GH-GB-GT)*x/ty;
  const mk=(tag,at,txt)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!==undefined)e.textContent=txt;s.appendChild(e);return e;};
  for(let t=0;t<=tx;t++)mk('line',{x1:gX(t),y1:gY(0),x2:gX(t),y2:gY(ty),stroke:'var(--line)','stroke-width':t%5?0.5:0.9,opacity:t%5?.6:1});
  const sub=q.xstep/3;
  for(let x=0;x<=ty+1e-9;x+=sub){const maj=Math.abs(x/q.xstep-Math.round(x/q.xstep))<1e-6;
    mk('line',{x1:gX(0),y1:gY(x),x2:gX(tx),y2:gY(x),stroke:'var(--line)','stroke-width':maj?0.9:0.5,opacity:maj?1:.6});
    if(maj)mk('text',{x:GL-6,y:gY(x)+4,'text-anchor':'end','font-size':11,fill:'var(--mute)'},Math.round(x));}
  for(let t=0;t<=tx;t+=5)mk('text',{x:gX(t),y:gY(0)+15,'text-anchor':'middle','font-size':11,fill:'var(--mute)'},t);
  mk('text',{x:GW-GR,y:gY(0)+30,'text-anchor':'end','font-size':12,fill:'var(--mute)'},'時間（分）');
  mk('text',{x:6,y:GT-6,'text-anchor':'start','font-size':12,fill:'var(--mute)'},'きょり（m）');
  q.persons.forEach((p,i)=>{
    const d=p.pts.map((a,k)=>(k?'L':'M')+gX(a[0])+' '+gY(a[1])).join(' ');
    mk('path',{d,fill:'none',stroke:COLORS[i],'stroke-width':2,opacity:.16,'stroke-dasharray':i?'6 4':''});
  });
  mk('line',{id:'cur',x1:0,y1:gY(0),x2:0,y2:gY(ty),stroke:'var(--mute)','stroke-width':1.5,'stroke-dasharray':'4 4'});
  q.persons.forEach((p,i)=>mk('path',{id:'gl'+i,fill:'none',stroke:COLORS[i],'stroke-width':3.6,'stroke-linecap':'round','stroke-linejoin':'round','stroke-dasharray':i?'9 5':''}));
  mk('g',{id:'gmarks'});
  mk('g',{id:'ghl'});
  q.persons.forEach((p,i)=>{mk('circle',{id:'gd'+i,r:6,fill:COLORS[i],stroke:'var(--card)','stroke-width':2});});
  q.persons.forEach((p,i)=>mk('text',{id:'gt'+i,'font-size':12,fill:COLORS[i],'text-anchor':'start','font-weight':900,style:'paint-order:stroke;stroke:var(--card);stroke-width:4px'},p.name));
}
function partialPath(p,t){
  const a=p.pts; if(t<a[0][0])return '';
  let d=`M${gX(a[0][0])} ${gY(a[0][1])}`;
  for(let i=0;i<a.length-1;i++){
    const [t0,x0]=a[i],[t1,x1]=a[i+1];
    if(t>=t1)d+=` L${gX(t1)} ${gY(x1)}`;
    else if(t>t0){const x=x0+(x1-x0)*(t-t0)/(t1-t0);d+=` L${gX(t)} ${gY(x)}`;break;}
    else break;
  }
  return d;
}

/* ---------- 1コマ ---------- */
function frame(){
  const q=cur, t=T;
  q.persons.forEach((p,i)=>{
    const x=posAt(p,t), pose=poseAt(p,t);
    const lane=i?22:-9;
    const d=lastDir(p,t);
    figs[i].setAttribute('transform',`translate(${roadX(x)},${RY+lane}) scale(1.4)`);
    const ph=(x/q.L)*q.L/22; // 進んだ きょりに 合わせて 足を ふる
    poseFigure(figs[i],pose,ph,d,t);
    $('gl'+i).setAttribute('d',partialPath(p,t));
    const gx=gX(Math.max(t,p.pts[0][0])), gy=gY(x);
    const dot=$('gd'+i); dot.setAttribute('cx',gx);dot.setAttribute('cy',gy);
    dot.style.opacity=t<p.pts[0][0]-1e-9?0.25:1;
    const tt=$('gt'+i); tt.setAttribute('x',Math.min(gx+9,GW-70));tt.setAttribute('y',gy-9+(i?24:0));
  });
  const cu=$('cur'); cu.setAttribute('x1',gX(t));cu.setAttribute('x2',gX(t));
  $('slide').value=t;
  const [a,b]=q.persons.map(p=>posAt(p,t));
  $('read').innerHTML=`<span class="chip t">⏱ ${fmt(t)}分</span><span class="chip c0">${q.persons[0].name} ${fmt(a)}m</span><span class="chip c1">${q.persons[1].name} ${fmt(b)}m</span><span class="chip gap">ふたりの あいだ ${fmt(Math.abs(a-b))}m</span>`;
  const ei=evIndex(t); renderSay(ei);
}
function fmt(v){return Math.abs(v-Math.round(v))<1e-6?String(Math.round(v)):v.toFixed(1);}
let lastEi=-2;
function evIndex(t){let k=-1;cur.events.forEach((e,i)=>{if(e.t<=t+1e-6)k=i;});return k;}
function renderSay(ei){
  if(ei===lastEi)return; lastEi=ei;
  const q=cur, box=$('say');
  if(ei<0){box.innerHTML=`<h3>いまの ようす</h3><div class="t">▶ を おすと、${q.persons.map(p=>p.name).join('と')}が 歩きはじめるよ。</div><div class="at">グラフの 線も いっしょに のびていくよ。「つぎの できごと」で 大事なところで 止まれるよ。</div>`;return;}
  const e=q.events[ei];
  box.innerHTML=`<h3>できごと ${ei+1} / ${q.events.length}</h3><div class="t">${e.text}</div><div class="at">${e.at}</div>`;
}

/* ---------- うごき ---------- */
function setT(v){T=Math.max(0,Math.min(tEnd(cur),v));frame();}
function loop(ts){
  if(playing){
    const dt=Math.min(0.05,(ts-lastTs)/1000);
    const prev=T; let nt=T+dt*parseFloat($('rate').value);
    const end=tEnd(cur);
    if($('stop').checked){
      const e=cur.events.find(e=>e.t>prev+1e-6&&e.t<=nt+1e-9);
      if(e){nt=e.t;playing=false;}
    }
    if(nt>=end){nt=end;playing=false;}
    T=nt;frame();syncPlay();
  }
  lastTs=ts;requestAnimationFrame(loop);
}
function syncPlay(){$('play').textContent=playing?'⏸ とめる':(T>=tEnd(cur)-1e-9?'↺ もういちど':'▶ うごかす');}
function animateTo(target,ms,done){
  playing=false;syncPlay();
  const from=T, t0=performance.now();
  tween=()=>{
    const k=Math.min(1,(performance.now()-t0)/ms), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    T=from+(target-from)*e;frame();
    if(k<1)requestAnimationFrame(tween);else{tween=null;if(done)done();}
  };
  requestAnimationFrame(tween);
}
function nextEvent(){
  clearHL();
  const e=cur.events.find(e=>e.t>T+1e-6);
  if(!e){animateTo(0,500,()=>{});return;}
  animateTo(e.t,Math.min(2200,300+Math.abs(e.t-T)*90),()=>{});
}

/* ---------- 小問のハイライト ---------- */
function clearHL(){hl=null;$('ghl').innerHTML='';$('roadhl').innerHTML='';}
function g(tag,at,txt){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!==undefined)e.textContent=txt;return e;}
function drawHL(f){
  const q=cur, G=$('ghl'), R=$('roadhl'); clearHL(); hl=f;
  const tl=(x,y,txt,anchor='middle',col='var(--hl)')=>g('text',{x,y,'text-anchor':anchor,'font-size':13,'font-weight':900,fill:col,style:'paint-order:stroke;stroke:var(--card);stroke-width:4px'},txt);
  if(f.type==='pt'){
    G.append(g('line',{x1:gX(f.t),y1:gY(f.x),x2:gX(f.t),y2:gY(0),stroke:'var(--hl)','stroke-width':2,'stroke-dasharray':'5 4'}),
             g('line',{x1:gX(f.t),y1:gY(f.x),x2:gX(0),y2:gY(f.x),stroke:'var(--hl)','stroke-width':2,'stroke-dasharray':'5 4'}),
             g('circle',{cx:gX(f.t),cy:gY(f.x),r:11,fill:'none',stroke:'var(--hl)','stroke-width':3,class:'pulse'}),
             tl(gX(f.t),gY(0)+28,fmt(f.t)+'分'),tl(gX(0)+4,gY(f.x)-6,fmt(f.x)+'m','start'));
    R.append(g('line',{x1:roadX(f.x),y1:RY-70,x2:roadX(f.x),y2:RY+20,stroke:'var(--hl)','stroke-width':2.5,'stroke-dasharray':'5 4'}),
             tl(roadX(f.x),RY-74,`${q.a}から ${fmt(f.x)}m`));
  }else if(f.type==='seg'){
    const p=q.persons[f.who];
    const pts=p.pts; let x0,x1;
    for(let i=0;i<pts.length-1;i++){if(Math.abs(pts[i][0]-f.t0)<1e-9&&Math.abs(pts[i+1][0]-f.t1)<1e-9){x0=pts[i][1];x1=pts[i+1][1];}}
    const dt=f.t1-f.t0, dx=Math.abs(x1-x0);
    G.append(g('line',{x1:gX(f.t0),y1:gY(x0),x2:gX(f.t1),y2:gY(x1),stroke:'var(--hl)','stroke-width':6,'stroke-linecap':'round',opacity:.9}));
    if(f.label==='rest'){
      G.append(tl((gX(f.t0)+gX(f.t1))/2,gY(x0)-12,`休けい ${fmt(dt)}分間`));
    }else{
      G.append(g('line',{x1:gX(f.t0),y1:gY(x0),x2:gX(f.t1),y2:gY(x0),stroke:'var(--hl)','stroke-width':2,'stroke-dasharray':'4 3'}),
               g('line',{x1:gX(f.t1),y1:gY(x0),x2:gX(f.t1),y2:gY(x1),stroke:'var(--hl)','stroke-width':2,'stroke-dasharray':'4 3'}),
               tl((gX(f.t0)+gX(f.t1))/2,gY(x0)+(x1>=x0?-8:16),`よこ ${fmt(dt)}分`),
               tl(gX(f.t1)+(gX(f.t1)>GW*0.6?-8:8),(gY(x0)+gY(x1))/2,`たて ${fmt(dx)}m`,gX(f.t1)>GW*0.6?'end':'start'),
               tl(GL+10,GT+16,`速さ ＝ ${fmt(dx)} ÷ ${fmt(dt)} ＝ ${fmt(dx/dt)}（分速）`,'start'));
    }
    R.append(g('line',{x1:roadX(x0),y1:RY-62,x2:roadX(x0),y2:RY+20,stroke:'var(--hl)','stroke-width':2,'stroke-dasharray':'4 3'}),
             g('line',{x1:roadX(x1),y1:RY-62,x2:roadX(x1),y2:RY+20,stroke:'var(--hl)','stroke-width':2,'stroke-dasharray':'4 3'}),
             g('line',{x1:roadX(x0),y1:RY-62,x2:roadX(x1),y2:RY-62,stroke:'var(--hl)','stroke-width':3}));
    R.append(tl((roadX(x0)+roadX(x1))/2,RY-68,f.label==='rest'?'ここで 休けい':`${fmt(dx)}m 進む`));
  }else if(f.type==='time'){
    q.persons.forEach((p,i)=>{
      const x=posAt(p,f.t);
      G.append(g('line',{x1:gX(f.t),y1:gY(x),x2:gX(0),y2:gY(x),stroke:COLORS[i],'stroke-width':2,'stroke-dasharray':'5 4'}),
               tl(gX(0)+4,gY(x)-6+(i?0:0),`${fmt(x)}m`,'start',COLORS[i]));
    });
    G.append(tl(gX(f.t),gY(0)+28,fmt(f.t)+'分'));
    if(f.mark!==undefined)G.append(g('circle',{cx:gX(f.t),cy:gY(f.mark),r:11,fill:'none',stroke:'var(--hl)','stroke-width':3,class:'pulse'}));
    const x=posAt(q.persons[f.who],f.t);
    R.append(tl(roadX(x),RY-74,`${fmt(f.t)}分のとき`));
  }
}

/* ---------- 画面の組み立て ---------- */
function load(i){
  cur=DATA[i];playing=false;lastEi=-2;T=0;clearHL&&0;
  document.querySelectorAll('#nav button').forEach((b,k)=>b.classList.toggle('on',k===i));
  $('prob').innerHTML=`<h2>${cur.id}　${cur.title}　<span class="stars">${'★'.repeat(cur.stars)}${'☆'.repeat(3-cur.stars)}</span></h2><p>${cur.text}</p>`;
  buildRoad(cur);buildGraph(cur);
  const sl=$('slide');sl.max=tEnd(cur);
  $('ticks').innerHTML=cur.events.map(e=>`<i style="left:${(e.t/tEnd(cur))*100}%"></i>`).join('');
  $('subs').innerHTML='<h3>もんだいの こたえを グラフで たしかめよう</h3>'+cur.subs.map((s,k)=>`
    <div class="sub"><div class="q">(${k+1}) ${s.q}</div>
    <div class="b">${s.focus?`<button class="look" data-k="${k}">グラフで 見てみる</button>`:''}<button class="ansb" data-k="${k}">こたえ</button></div>
    <div class="ans" id="ans${k}"><b>${s.ans}</b><div class="s">${s.sol}</div></div></div>`).join('');
  document.querySelectorAll('.sub .look').forEach(b=>b.onclick=()=>{
    const f=cur.subs[b.dataset.k].focus;clearHL();
    const target=f.type==='seg'?f.t1:f.t;
    animateTo(target,Math.min(2200,400+Math.abs(target-T)*80),()=>drawHL(f));
  });
  document.querySelectorAll('.sub .ansb').forEach(b=>b.onclick=()=>$('ans'+b.dataset.k).classList.toggle('open'));
  syncPlay();frame();
}
$('nav').innerHTML=DATA.map((_,i)=>`<button>${i+1}</button>`).join('');
document.querySelectorAll('#nav button').forEach((b,i)=>b.onclick=()=>load(i));
$('play').onclick=()=>{
  if(tween)return; clearHL();
  if(T>=tEnd(cur)-1e-9)T=0;
  playing=!playing;syncPlay();
};
$('restart').onclick=()=>{if(tween)return;playing=false;clearHL();T=0;lastEi=-2;frame();syncPlay();};
$('next').onclick=()=>{if(!tween)nextEvent();};
$('slide').oninput=e=>{playing=false;clearHL();T=parseFloat(e.target.value);frame();syncPlay();};
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();$('play').click();}else if(e.key==='ArrowRight')$('next').click();});
load(0);requestAnimationFrame(loop);
if(location.search.includes('dbg'))window.dbg={load,setT,animateTo,drawHL,get T(){return T;},get cur(){return cur;},DATA};
</script>
