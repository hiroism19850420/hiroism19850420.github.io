<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>かたむきボール ぜんしん版</title>
<style>
  html,body{margin:0;height:100%;background:#2b1508;overflow:hidden;touch-action:none;
    font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;justify-content:center}
  #c{height:100%;width:min(100vw,62vh);display:block}
  .panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,rgba(22,80,40,.93),rgba(6,30,16,.96));color:#fff;text-align:center;padding:20px;box-sizing:border-box}
  .panel.hide{display:none}
  #lvBtns{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:340px;margin:4px auto}
  #lvBtns button{display:inline-block;width:auto;margin:0;padding:8px 12px;font-size:15px;opacity:.6}
  #lvBtns button.on{opacity:1;outline:4px solid #fff}
  h1{font-size:40px;margin:0 0 10px;color:#ffd84a;letter-spacing:2px;text-shadow:0 3px 0 #7a3b12,2px 0 0 #7a3b12,-2px 0 0 #7a3b12,0 -2px 0 #7a3b12,0 6px 10px rgba(0,0,0,.5)}
  .leafs{font-size:34px;margin:0 0 4px;letter-spacing:6px}
  .sub{font-size:16px;line-height:1.8;margin:0 0 18px;color:#e3f6f4}
  .big{font-size:24px;line-height:1.8;margin:0 0 18px}
  button{display:block;width:min(78vw,300px);margin:7px auto;padding:15px 10px;font-size:21px;font-weight:bold;
    font-family:inherit;color:#1b1b1b;background:#ffd84a;border:0;border-radius:14px;box-shadow:0 5px 0 #b98f00}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #b98f00}
  #bgmBtn{position:fixed;right:10px;bottom:10px;width:44px;height:44px;margin:0;padding:0;font-size:20px;border-radius:50%;background:#e9c98a;box-shadow:0 3px 0 #7a4a1e;z-index:5}
  #bgmBtn.off{opacity:.45}
</style>
<script data-goatcounter="https://hiroism.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="title" class="panel">
  <div class="leafs">🌴🌿🌺🌿🌴</div>
  <h1>かたむきボール</h1>
  <p class="sub" id="subText">スマホを たてに もって ハンドルのように<br>左右に かたむけると 台が かたむくよ<br>1こでも おくの ゴールに<br>入れば せいこう！</p>
  <div id="lvBtns"></div>
  <button id="startBtn">はじめる</button>
</div>

<button id="bgmBtn" aria-label="おんがく">♪</button>

<div id="result" class="panel hide">
  <h1 id="resTitle"></h1>
  <p class="big" id="resText"></p>
  <button id="againBtn">もういちど</button>
</div>

<script src="body.js"></script>
<script>
(function(){
'use strict';

// ============ 台と物理の数値（長さは cm、角度は度） ============
// 公式の寸法は公開されていない。台の形は再現品の寸法図から、角度や転がり方は見積もり
const BALL_R = 3.5;        // ボールの半径
const HOLE_R = 3.7;        // 落とし穴の半径（ボールがぴったり入る大きさ）
const RAIL_R = 0.8;        // ガード（細い棒）の太さの半分
const PITCH = 8;           // 台が奥へ下がっている角度（固定）
const ROLL_MAX = 8;        // ハンドルを回しきったときの左右の傾き（PITCH 以下にしておくと手前へ戻らない）
const PHONE_GAIN = 0.5;    // スマホの傾き → 台の傾き（スマホ16度で回しきり）
const ROLL_LAG = 0.05;     // 台が傾きに追いつくまでの時間（秒）
const G = 981;             // 重力
const K_ROLL = 0.6;        // 中が空のボールがすべらず転がるときの係数（中まで詰まった球なら 5/7）
const ROLL_RES = 0.04;     // 転がり抵抗（軽いボールなので小さい）
const RAIL_BOUNCE = 0.2;    // ガードに当たったときのはね返り
const RAIL_RUB = 0.2;      // ガードにこすっている間の減速（軽いのであまり止まらない）
let BALLS = 4;
// むずかしさ。speed：ボールの 転がる速さ（重力に掛ける。小さいほど ゆっくり）、hole：落とし穴の大きさの倍率（0 で 穴なし）、
// retry：ふちから 落ちても 近くから 出なおせる、balls：ボールの数。「超むずかしい」が もとの（本物に近い）設定
const LEVELS = [
  { id: 'veasy', name: '超かんたん',   speed: 0.12, hole: 0,   retry: true,  balls: 6 },
  { id: 'easy',  name: 'かんたん',     speed: 0.22, hole: 0.45, retry: true,  balls: 5 },
  { id: 'norm',  name: 'ふつう',       speed: 0.38, hole: 0.8, retry: false, balls: 5 },
  { id: 'hard',  name: 'むずかしい',   speed: 0.62, hole: 1,   retry: false, balls: 4 },
  { id: 'vhard', name: '超むずかしい', speed: 1,    hole: 1,   retry: false, balls: 4 }
];
let LV = LEVELS[1];
// 「やりなおし」が ある むずかしさ では、ふちから 落ちても、通りすぎた 一番 近い ここから 出なおせる（ボールは へらない）
const CHECKS = [[0, 4], [6, 35], [-11, 61], [7, 84]];

// 台の形（上から見た図）。x=中心からの左右（右が＋）、y=手前からの奥行き
// ジャングルカーニバルを自作で再現した人の寸法図（奥行き 35・25・25・20・20cm、
// 中心からの幅 18・23・23・13cm）から起こした
const POLY = [
  [-10,0],[-3,36],[-23,60],[-1,84],[-13,99],[-13,115],[-6.5,115],[-6.5,125],   // 左側を手前から奥へ
  [3.5,125],[4,105],[23,85],[4,60],[5,54],[18,35],[10,0],                       // 右側を奥から手前へ
];
// ガード（細い棒）の両端
const RAIL_SEGS = [
  [[-9,1],[-2.5,33.5]], [[9,1],[16.5,33.5]],          // スタートの道の左右
  [[-3,38],[-17.5,55.5]],                             // 2本目（左奥へ）の左。右は空いている
  [[-15.5,67],[-4.5,78.5]], [[1,60.5],[18,81.5]],     // 3本目（右奥へ）の左右
  [[0,87],[-11,96]], [[11.5,94.5],[0,106]],           // 4本目（左奥へ）の左右。右のガードは穴のほうを向いている
];
const HOLE = [-8.4, 109];              // 落とし穴の中心
const GOAL_X0 = -6.5, GOAL_X1 = 3.5, GOAL_Y = 125;   // ゴールの出口（奥に突き出た細い板の先）
const START_Y = 4, START_X_MIN = -4.0, START_X_MAX = 4.6;   // ボールを置ける範囲
const BALL_COLORS = ['#f6f5ee','#f6f5ee','#f6f5ee','#f6f5ee'];   // 本物と同じ白

function inPoly(x, y){
  let c = false;
  for (let i = 0, j = POLY.length - 1; i < POLY.length; j = i++) {
    const a = POLY[i], b = POLY[j];
    if ((a[1] > y) !== (b[1] > y) && x < (b[0]-a[0]) * (y-a[1]) / (b[1]-a[1]) + a[0]) c = !c;
  }
  return c;
}

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 360; let viewH = 640, S = 4, ox = 0, oy = 0;
const BX0 = Math.min(...POLY.map(p => p[0])) - 6, BX1 = Math.max(...POLY.map(p => p[0])) + 6;
const BY0 = -6, BY1 = 139;
function resize(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  viewH = W * cv.height / cv.width;
  S = Math.min((W - 16) / (BX1 - BX0), (viewH - 164) / (BY1 - BY0));
  ox = (W - (BX1 - BX0) * S) / 2; oy = 46 + ((viewH - 164) - (BY1 - BY0) * S) / 2;
  buildBg();
}
window.addEventListener('resize', resize);
const sx = x => ox + (x - BX0) * S, sy = y => oy + (BY1 - y) * S;

// ---- 背景（ジャングルの屋台）。動かないので、画面の大きさが変わったときだけ描く ----
const bgCv = document.createElement('canvas');
function buildBg(){
  bgCv.width = cv.width; bgCv.height = cv.height;
  const c = bgCv.getContext('2d'), sc = cv.width / W;
  c.setTransform(sc, 0, 0, sc, 0, 0);
  let seed = 20261009; const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const leaf = (x, y, len, wid, ang, col, rib) => {
    c.save(); c.translate(x, y); c.rotate(ang);
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(len * .45, -wid, len, 0); c.quadraticCurveTo(len * .45, wid, 0, 0);
    c.fillStyle = col; c.fill();
    c.strokeStyle = rib; c.lineWidth = 1; c.beginPath(); c.moveTo(0, 0); c.lineTo(len * .9, 0); c.stroke();
    c.restore();
  };
  const fan = (x, y, n, len, a0, a1, cols, rib) => {
    for (let i = 0; i < n; i++) { const a = a0 + (a1 - a0) * (i + .5) / n + (rnd() - .5) * .15; leaf(x, y, len * (.8 + rnd() * .35), len * .2, a, cols[i % cols.length], rib); }
  };
  const flower = (x, y, r, col) => {
    c.fillStyle = col; for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(x + Math.cos(i * 1.257) * r * .6, y + Math.sin(i * 1.257) * r * .6, r * .55, 0, 6.3); c.fill(); }
    c.fillStyle = '#ffe066'; c.beginPath(); c.arc(x, y, r * .35, 0, 6.3); c.fill();
  };
  const plank = (x, y, w, h) => {
    const g = c.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, '#9a5a2a'); g.addColorStop(.12, '#8a4d22'); g.addColorStop(1, '#5e3215');
    c.fillStyle = g; c.fillRect(x, y, w, h);
    c.strokeStyle = 'rgba(40,18,5,.35)'; c.lineWidth = 1;
    for (let i = 0; i < h / 7; i++) { const yy = y + 4 + i * 7 + rnd() * 3; c.beginPath(); c.moveTo(x, yy); c.bezierCurveTo(x + w * .3, yy + rnd() * 4 - 2, x + w * .7, yy + rnd() * 4 - 2, x + w, yy); c.stroke(); }
  };

  // 水（板のまわりは、水の絵がかかれた箱になっている）
  const wg = c.createLinearGradient(0, 0, 0, viewH);
  wg.addColorStop(0, '#1b93ad'); wg.addColorStop(.6, '#1a86a3'); wg.addColorStop(1, '#136b85');
  c.fillStyle = wg; c.fillRect(0, 0, W, viewH);
  c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 1.5; c.lineCap = 'round';
  for (let i = 0; i < 46; i++) { const x = rnd() * W, y = 50 + rnd() * (viewH - 120), w = 14 + rnd() * 22; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + w / 2, y - 4, x + w, y); c.stroke(); }
  // ハスの葉と花
  [[-25,16,7],[26,12,6],[-27,44,5],[27,62,7],[-26,98,7],[25,112,6],[-22,124,5],[21,26,4]].forEach((l, i) => {
    const x = sx(l[0]), y = sy(l[1]), r = l[2] * S * .9;
    c.fillStyle = 'rgba(0,40,50,.25)'; c.beginPath(); c.arc(x + 2, y + 3, r, 0, 6.3); c.fill();
    c.fillStyle = i % 2 ? '#3fa45a' : '#2f9150'; c.beginPath(); c.moveTo(x, y); c.arc(x, y, r, .4 + i, 6.0 + i); c.fill();
    c.strokeStyle = 'rgba(20,90,50,.6)'; c.lineWidth = 1;
    for (let k = 0; k < 5; k++) { const a = 1 + i + k * 1.1; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * r * .85, y + Math.sin(a) * r * .85); c.stroke(); }
    if (i % 3 === 0) flower(x + r * .5, y - r * .4, r * .38, '#ff9ec4');
  });

  // 左右の木のわくと、そこから出る葉・つる
  const fw = 13;
  [[0, 1], [W - fw, -1]].forEach(([x, dir]) => {
    const g = c.createLinearGradient(x, 0, x + fw, 0);
    g.addColorStop(0, dir > 0 ? '#5a2f13' : '#8a4d22'); g.addColorStop(.5, '#9a5a2a'); g.addColorStop(1, dir > 0 ? '#8a4d22' : '#5a2f13');
    c.fillStyle = g; c.fillRect(x, 0, fw, viewH);
    c.fillStyle = '#7a4420';
    const ex = dir > 0 ? fw : W - fw;
    for (let y = 20; y < viewH; y += 34) { c.beginPath(); c.arc(ex, y, 7, 0, 6.3); c.fill(); }
    c.strokeStyle = '#2c6b2f'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(ex + dir * 4, 40);
    for (let y = 40; y < viewH - 70; y += 40) c.quadraticCurveTo(ex + dir * (14 + rnd() * 8), y + 20, ex + dir * 4, y + 40);
    c.stroke();
    for (let y = 70; y < viewH - 90; y += 46 + rnd() * 20) {
      const a0 = dir > 0 ? -.9 : Math.PI - .9, a1 = dir > 0 ? .9 : Math.PI + .9;
      fan(ex + dir * 2, y, 4, 24 + rnd() * 10, a0, a1, ['#2f8f3e', '#3fa64a', '#27793a'], 'rgba(15,70,30,.6)');
      if (rnd() < .45) flower(ex + dir * (10 + rnd() * 8), y + 8, 5, rnd() < .5 ? '#ff6b5a' : '#ffb347');
    }
  });

  // 奥のジャングル（ゴールのまわり）
  const gx = sx((GOAL_X0 + GOAL_X1) / 2), gy = sy(GOAL_Y), top = 40, bottom = gy + 4 * S;
  const jg = c.createLinearGradient(0, top, 0, bottom);
  jg.addColorStop(0, '#0d3b22'); jg.addColorStop(1, '#17592f');
  c.fillStyle = jg; c.fillRect(0, top, W, Math.max(10, bottom - top - 2 * S));
  c.fillStyle = '#6a3d1c'; c.fillRect(gx - 62, top, 15, bottom - top - 2 * S); c.fillRect(gx + 50, top, 12, bottom - top - 2 * S);   // 木の幹
  for (let x = -10; x < W + 20; x += 26) fan(x + rnd() * 10, top - 4 + rnd() * 8, 6, 34 + rnd() * 12, .25, Math.PI - .25, ['#1e6f33', '#195f2c', '#237a38'], 'rgba(8,50,22,.6)');
  for (let x = 6; x < W; x += 30) {
    if (Math.abs(x - gx) < 26) continue;
    fan(x + rnd() * 8, bottom - 2 * S + rnd() * 4, 6, 26 + rnd() * 12, -Math.PI + .3, -.3, ['#2f9a44', '#3bb04f', '#278a3c'], 'rgba(15,80,35,.6)');
  }
  // ゴールの入り口（暗いあな）と、それをかこむ葉
  c.fillStyle = '#03120a'; c.beginPath(); c.ellipse(gx, gy - 3 * S, (GOAL_X1 - GOAL_X0) * .62 * S, 6.5 * S, 0, 0, 6.3); c.fill();
  fan(gx - (GOAL_X1 - GOAL_X0) * .7 * S, gy + S, 5, 30, -Math.PI * .5 - .5, -Math.PI * .5 + .7, ['#3bb04f', '#2f9a44', '#48c25c'], 'rgba(15,80,35,.6)');
  fan(gx + (GOAL_X1 - GOAL_X0) * .7 * S, gy + S, 5, 30, -Math.PI * .5 - .7, -Math.PI * .5 + .5, ['#3bb04f', '#2f9a44', '#48c25c'], 'rgba(15,80,35,.6)');
  flower(gx - 44, top + 16, 6, '#ff6b5a'); flower(gx + 40, top + 22, 5, '#ffb347'); flower(40, top + 26, 5, '#ff8fb8'); flower(W - 44, top + 14, 6, '#ff6b5a');

  // 上の看板と、手前のカウンター（木）
  plank(0, 0, W, 40);
  c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(0, 40, W, 3);
  plank(0, viewH - 70, W, 70);
  c.fillStyle = '#b8743a'; c.fillRect(0, viewH - 70, W, 3);
  c.fillStyle = 'rgba(0,0,0,.3)'; c.fillRect(0, viewH - 74, W, 4);
  c.fillStyle = '#d9a441';
  [[10, 8], [W - 10, 8], [10, 32], [W - 10, 32], [12, viewH - 58], [W - 12, viewH - 58], [12, viewH - 12], [W - 12, viewH - 12]].forEach(p => { c.beginPath(); c.arc(p[0], p[1], 2.5, 0, 6.3); c.fill(); });
}

// ---- 入力 ----
const input = {tilt:0, gotTilt:false, key:0, touch:0, hold:0, override:null};
function onOrient(e){
  if (e.gamma == null || e.beta == null) return;
  input.gotTilt = true;
  const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
  // 重力の「画面の横向き」の成分。ねかせても立てても同じように使える
  let gx = Math.cos(b) * Math.sin(g), gy = Math.sin(b);
  const ang = (screen.orientation && screen.orientation.angle) || 0;
  if (ang === 90) gx = -gy; else if (ang === 270) gx = gy; else if (ang === 180) gx = -gx;
  input.tilt = gx;
}
function askTilt(){
  try {
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function') {
      D.requestPermission().then(s => { if (s === 'granted') window.addEventListener('deviceorientation', onOrient); }).catch(()=>{});
    } else {
      window.addEventListener('deviceorientation', onOrient);
    }
  } catch(e){}
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{}); } catch(e){}
}
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') input.key = -1;
  if (e.key === 'ArrowRight') input.key = 1;
  if (e.key === ' ' && T.state === 'ready') release();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' && input.key < 0) input.key = 0;
  if (e.key === 'ArrowRight' && input.key > 0) input.key = 0;
});
let placing = false;
function pointerX(e){ const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
function placeAt(px){
  // 指の位置を、スタートの線の上の左右位置に直す
  T.startX = clamp(BX0 + (px - ox) / S, START_X_MIN, START_X_MAX);
  setBallAtStart();
}
cv.addEventListener('pointerdown', e => {
  if (T.state === 'ready') { placing = true; placeAt(pointerX(e)); }
  else input.touch = pointerX(e) < W / 2 ? -1 : 1;
});
cv.addEventListener('pointermove', e => { if (placing && T.state === 'ready') placeAt(pointerX(e)); });
['pointerup','pointercancel','pointerleave'].forEach(n => cv.addEventListener(n, () => {
  input.touch = 0;
  if (placing) { placing = false; if (T.state === 'ready') release(); }
}));

// ---- 音 ----
// BGM とジングルは tools/music.py で作ったオリジナル曲。効果音はその場で合成する
let ac = null, master = null, bgmGain = null, bgmSrc = null, rollGain = null, rollFilt = null, noiseBuf = null;
const BGM_LOOP = [58.18182, 116.36364], BGM_VOL = .5;
const bufs = {};
let bgmOn = true;
try { bgmOn = localStorage.getItem('katamuki-bgm') !== 'off'; } catch(e){}
let keepAlive = null;
function audioOn(){
  // iPhone は消音スイッチが入っていると Web の音が出ない。「再生」あつかいに切りかえて鳴るようにする
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){}
  try {
    if (!keepAlive) {   // 古い iPhone 向け：無音の音声を流しておくと、消音スイッチでも音が出る
      const n = 2000, b = new Uint8Array(44 + n), v = new DataView(b.buffer);
      'RIFF'.split('').forEach((ch, i) => b[i] = ch.charCodeAt(0)); v.setUint32(4, 36 + n, true);
      'WAVEfmt '.split('').forEach((ch, i) => b[8 + i] = ch.charCodeAt(0)); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
      'data'.split('').forEach((ch, i) => b[36 + i] = ch.charCodeAt(0)); v.setUint32(40, n, true); b.fill(128, 44);
      keepAlive = new Audio(URL.createObjectURL(new Blob([b], {type:'audio/wav'})));
      keepAlive.loop = true; keepAlive.setAttribute('playsinline', '');
    }
    if (keepAlive.paused) keepAlive.play().catch(()=>{});
  } catch(e){}
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
      bgmGain = ac.createGain(); bgmGain.gain.value = bgmOn ? BGM_VOL : 0; bgmGain.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // ボールが板の上を転がる音（速さで大きさと高さが変わる）
      const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      rollFilt = ac.createBiquadFilter(); rollFilt.type = 'bandpass'; rollFilt.frequency.value = 300; rollFilt.Q.value = .8;
      rollGain = ac.createGain(); rollGain.gain.value = 0;
      src.connect(rollFilt); rollFilt.connect(rollGain); rollGain.connect(master); src.start();
      ['bgm','goal','miss'].forEach(n => fetch('assets/' + n + '.mp3').then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b))
        .then(b => { bufs[n] = b; if (n === 'bgm') startBgm(); }).catch(()=>{}));
    }
    if (ac.state !== 'running') ac.resume().catch(()=>{});
  } catch(e){}
}
// 許可のダイアログや画面の切りかえで音が止まることがあるので、さわるたびに起こし直す
['pointerdown','touchend','click'].forEach(n => window.addEventListener(n, () => { if (ac) audioOn(); }, true));
document.addEventListener('visibilitychange', () => { if (ac && !document.hidden) audioOn(); });
function startBgm(){
  if (!ac || bgmSrc || !bufs.bgm) return;
  bgmSrc = ac.createBufferSource(); bgmSrc.buffer = bufs.bgm; bgmSrc.loop = true;
  bgmSrc.loopStart = BGM_LOOP[0]; bgmSrc.loopEnd = BGM_LOOP[1];
  bgmSrc.connect(bgmGain); bgmSrc.start();
}
function setBgm(on){
  bgmOn = on;
  try { localStorage.setItem('katamuki-bgm', on ? 'on' : 'off'); } catch(e){}
  if (bgmGain) bgmGain.gain.setTargetAtTime(on ? BGM_VOL : 0, ac.currentTime, .1);
}
function playBuf(n, vol){
  if (!ac || !bufs[n]) return false;
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = bufs[n]; g.gain.value = vol; s.connect(g); g.connect(master); s.start();
  if (bgmOn) {   // ジングルの間は BGM を小さくする
    const t = ac.currentTime;
    bgmGain.gain.setTargetAtTime(BGM_VOL * .25, t, .05);
    bgmGain.gain.setTargetAtTime(BGM_VOL, t + Math.max(.3, bufs[n].duration - .8), .4);
  }
  return true;
}
function tone(f0, f1, dur, type, vol, delay){
  if (!ac) return;
  const t = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol || .2, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + .02);
}
function noise(dur, type, f0, f1, vol, delay){
  if (!ac) return;
  const t = ac.currentTime + (delay || 0);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = type; f.Q.value = 1;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t, Math.random()); s.stop(t + dur + .02);
}
const sfx = {
  go(){ tone(520, 780, .09, 'sine', .12); },
  // 木のガードに当たる「コツッ」
  rail(v){ const k = clamp(v / 90, .1, 1); tone(820, 520, .045, 'triangle', .22 * k); tone(300, 180, .07, 'sine', .22 * k); noise(.03, 'highpass', 2500, 2500, .12 * k); },
  // 穴に「ポコン」と落ちて、下で「ゴトン」
  hole(){ tone(420, 110, .22, 'sine', .3); tone(150, 70, .25, 'sine', .3, .24); noise(.08, 'lowpass', 400, 200, .2, .24); playBuf('miss', .7); },
  // 板のふちから水へ「ポチャン」
  fall(){ noise(.45, 'bandpass', 900, 2600, .3, .12); tone(240, 520, .16, 'sine', .16, .16); playBuf('miss', .7); },
  goal(){ if (!playBuf('goal', .9)) [523,659,784,1047].forEach((f,i) => tone(f, f, .25, 'triangle', .22, i*.13)); },
  roll(speed){
    if (!rollGain) return;
    const t = ac.currentTime;
    rollGain.gain.setTargetAtTime(clamp(speed / 90, 0, 1) * .14, t, .05);
    rollFilt.frequency.setTargetAtTime(220 + speed * 6, t, .05);
  },
};

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---- ゲームの状態 ----
const T = {
  state:'title', x:0, y:0, vx:0, vy:0, roll:0, startX:START_X_MIN,
  ball:0, wins:0, results:[], endT:0, endKind:'', railCool:0, time:0,
};
function setBallAtStart(){ T.x = T.startX; T.y = START_Y; T.vx = T.vy = 0; T.maxY = 0; T.wait = 0; }
function newGame(){ T.ball = 0; T.wins = 0; T.results = []; T.startX = START_X_MIN; nextBall(); show(null); }
function nextBall(){ T.state = 'ready'; T.time = 0; setBallAtStart(); }
function release(){ if (T.state !== 'ready') return; T.state = 'roll'; sfx.go(); }
function finish(kind){
  T.state = 'end'; T.endKind = kind; T.endT = 0;
  T.results.push(kind === 'goal');
  if (kind === 'goal') { T.wins++; sfx.goal(); } else if (kind === 'hole') sfx.hole(); else sfx.fall();
}

function targetRoll(dt){
  if (input.override != null) return input.override;
  // ボタン・キーは、ハンドルを少しずつ回すように効かせる
  const b = clamp(input.key + input.touch, -1, 1);
  input.hold += ((b * ROLL_MAX) - input.hold) * Math.min(1, dt * 6);
  const phone = Math.asin(clamp(input.tilt, -1, 1)) * 180 / Math.PI * PHONE_GAIN;
  return clamp(phone + input.hold, -ROLL_MAX, ROLL_MAX);
}

function step(dt){
  const rad = Math.PI / 180;
  const g = G * LV.speed;
  if (T.y > T.maxY) T.maxY = T.y;
  T.vx += K_ROLL * g * Math.sin(T.roll * rad) * dt;
  T.vy += K_ROLL * g * Math.sin(PITCH * rad) * dt;
  const res = 1 - ROLL_RES * dt; T.vx *= res; T.vy *= res;
  T.x += T.vx * dt; T.y += T.vy * dt;
  // ガード
  for (const r of RAIL_SEGS) {
    const ax = r[0][0], ay = r[0][1], ex = r[1][0] - ax, ey = r[1][1] - ay;
    const t = clamp(((T.x - ax) * ex + (T.y - ay) * ey) / (ex*ex + ey*ey), 0, 1);
    let nx = T.x - (ax + ex*t), ny = T.y - (ay + ey*t); const d = Math.hypot(nx, ny), min = BALL_R + RAIL_R;
    if (d >= min || d === 0) continue;
    nx /= d; ny /= d;
    T.x += nx * (min - d); T.y += ny * (min - d);
    const vn = T.vx*nx + T.vy*ny;
    if (vn < 0) {
      if (vn < -12 && T.railCool <= 0) { sfx.rail(-vn); T.railCool = .12; }
      const bounce = vn < -8 ? RAIL_BOUNCE : 0;
      T.vx -= (1 + bounce) * vn * nx; T.vy -= (1 + bounce) * vn * ny;
    }
    const rub = 1 - RAIL_RUB * dt; T.vx *= rub; T.vy *= rub;
  }
  if (T.vy < 0) T.vy = 0;   // 台は必ず奥へ下がっているので、手前へは戻さない
  // 落とし穴・ゴール・ふちから落ちる
  if (LV.hole && Math.hypot(T.x - HOLE[0], T.y - HOLE[1]) < HOLE_R * LV.hole * .9) return finish('hole');
  if (!inPoly(T.x, T.y)) {
    if (T.y >= GOAL_Y - .5 && T.x >= GOAL_X0 && T.x <= GOAL_X1) return finish('goal');
    if (!LV.retry) return finish('fall');
    // 出なおし：通りすぎた チェックポイントの うち 一番 奥の ものへ もどす
    let c = CHECKS[0];
    for (const k of CHECKS) if (k[1] < T.maxY - 4) c = k;
    T.x = c[0]; T.y = c[1]; T.vx = T.vy = 0; T.wait = .7; sfx.fall();
  }
}

function update(dt){
  T.railCool -= dt;
  sfx.roll(T.state === 'roll' ? Math.hypot(T.vx, T.vy) : 0);
  T.roll += (targetRoll(dt) - T.roll) * Math.min(1, dt / ROLL_LAG);
  if (T.state === 'ready') {
    if (input.key && !placing) { T.startX = clamp(T.startX + input.key * 8 * dt, START_X_MIN, START_X_MAX); setBallAtStart(); }
  } else if (T.state === 'roll') {
    T.time += dt;
    const n = Math.max(1, Math.ceil(dt / (1/240)));
    if (T.wait > 0) T.wait -= dt;   // 出なおした 直後は 少し 止まる
    else for (let i = 0; i < n && T.state === 'roll' && !(T.wait > 0); i++) step(dt / n);
  } else if (T.state === 'end') {
    T.endT += dt;
    if (T.endKind === 'goal') T.y += 25 * dt;
    else if (T.endKind === 'hole') { T.x += (HOLE[0] - T.x) * Math.min(1, dt * 10); T.y += (HOLE[1] - T.y) * Math.min(1, dt * 10); }
    else { T.x += T.vx * dt * .5; T.y += T.vy * dt * .5; }
    if (T.endT > 1.5) {
      T.ball++;
      if (T.ball >= BALLS) { T.state = 'result'; showResult(); } else nextBall();
    }
  }
}

// ---- 描画 ----
function path(pts){ ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(sx(p[0]), sy(p[1])) : ctx.moveTo(sx(p[0]), sy(p[1]))); ctx.closePath(); }
function draw(){
  const sc = cv.width / W;
  ctx.setTransform(sc, 0, 0, sc, 0, 0);
  ctx.drawImage(bgCv, 0, 0, W, viewH);

  // 台（かげ→板→さざ波）
  ctx.save(); ctx.translate(5, 9); path(POLY); ctx.fillStyle = 'rgba(0,25,35,.4)'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(0, 3); path(POLY); ctx.fillStyle = '#1f6f8c'; ctx.fill(); ctx.restore();   // 板の厚み
  path(POLY);
  const bd = ctx.createLinearGradient(0, sy(0), 0, sy(125));
  bd.addColorStop(0, '#49b5d6'); bd.addColorStop(1, '#6fd0e4');
  ctx.fillStyle = bd; ctx.fill();
  ctx.strokeStyle = '#2b8fb0'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.save(); path(POLY); ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.2;
  [[-12,60],[14,84],[-4,108]].forEach(p => { for (let r = 2; r <= 8; r += 2) { ctx.beginPath(); ctx.ellipse(sx(p[0]), sy(p[1]), r * S, r * S * .8, 0, 0, 6.3); ctx.stroke(); } });
  // 傾いている側を少し暗くする
  const lean = T.roll / ROLL_MAX;
  if (Math.abs(lean) > .02) {
    const sh = ctx.createLinearGradient(sx(BX0), 0, sx(BX1), 0);
    sh.addColorStop(lean > 0 ? 0 : 1, 'rgba(255,255,255,' + (.18 * Math.abs(lean)) + ')');
    sh.addColorStop(lean > 0 ? 1 : 0, 'rgba(0,30,60,' + (.3 * Math.abs(lean)) + ')');
    ctx.fillStyle = sh; ctx.fillRect(0, 0, W, viewH);
  }
  ctx.restore();

  // 落とし穴
  const HR = HOLE_R * LV.hole;
  const hg = ctx.createRadialGradient(sx(HOLE[0]), sy(HOLE[1]) + 2, 1, sx(HOLE[0]), sy(HOLE[1]), Math.max(1, HR * S));
  hg.addColorStop(0, '#000'); hg.addColorStop(.85, '#06202a'); hg.addColorStop(1, '#2b8fb0');
  if (HR) { ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(sx(HOLE[0]), sy(HOLE[1]), HR * S, 0, 6.3); ctx.fill(); }

  // ガード
  ctx.lineCap = 'round';
  RAIL_SEGS.forEach(r => {
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = RAIL_R * 2 * S;
    ctx.beginPath(); ctx.moveTo(sx(r[0][0]) + 2, sy(r[0][1]) + 3); ctx.lineTo(sx(r[1][0]) + 2, sy(r[1][1]) + 3); ctx.stroke();
    ctx.strokeStyle = '#c9f2dd';
    ctx.beginPath(); ctx.moveTo(sx(r[0][0]), sy(r[0][1])); ctx.lineTo(sx(r[1][0]), sy(r[1][1])); ctx.stroke();
  });
  ctx.lineCap = 'butt';

  // ボール
  let br = BALL_R * S, alpha = 1;
  if (T.state === 'end') {
    if (T.endKind === 'goal') br *= Math.max(0, 1 - T.endT / .5);
    else if (T.endKind === 'hole') br *= Math.max(0, 1 - T.endT / .5);
    else { br *= Math.max(.55, 1 - T.endT * .6); alpha = Math.max(0, 1 - T.endT / .8); }
  }
  if (T.state !== 'title' && T.state !== 'result' && br > .5 && alpha > 0) {
    const bx = sx(T.x), by = sy(T.y);
    ctx.globalAlpha = alpha;
    if (T.state !== 'end') { ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(bx + 3, by + 4, br, br * .85, 0, 0, 6.3); ctx.fill(); }
    const g2 = ctx.createRadialGradient(bx - br * .35, by - br * .4, br * .1, bx, by, br);
    g2.addColorStop(0, '#fff'); g2.addColorStop(.35, BALL_COLORS[T.ball % BALL_COLORS.length]); g2.addColorStop(1, 'rgba(60,80,110,.5)');
    ctx.fillStyle = BALL_COLORS[T.ball % BALL_COLORS.length]; ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.3); ctx.fill();
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.3); ctx.fill();
    ctx.globalAlpha = 1;
  }
  hud();
}

function text(str, x, y, size, col, align){
  ctx.font = 'bold ' + size + 'px "Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineJoin = 'round';
  ctx.strokeText(str, x, y); ctx.fillStyle = col; ctx.fillText(str, x, y);
}

function hud(){
  if (T.state === 'title') return;
  // のこりのボール
  text('ボール', 20, 27, 16, '#fff');
  for (let i = 0; i < BALLS; i++) {
    const x = 88 + i * 24, done = i < T.results.length;
    ctx.fillStyle = done ? (T.results[i] ? '#ffd84a' : 'rgba(255,255,255,.25)') : BALL_COLORS[i];
    ctx.beginPath(); ctx.arc(x, 21, 8, 0, 6.3); ctx.fill();
    if (i === T.ball && !done) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, 21, 10.5, 0, 6.3); ctx.stroke(); }
    if (done && T.results[i]) text('★', x, 26, 13, '#b45b00', 'center');
  }
  text('せいこう ' + T.wins, W - 20, 27, 16, '#ffd84a', 'right');

  // ハンドル（台の傾きを見せる）
  const hx = W / 2, hy = viewH - 36, hr = 24;
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(T.roll / ROLL_MAX * .9);
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(1, 3, hr, 0, 6.3); ctx.stroke();
  ctx.strokeStyle = '#3a1e0c'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(0, 0, hr, 0, 6.3); ctx.stroke();
  ctx.strokeStyle = '#c98a4b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, hr + 2, 0, 6.3); ctx.stroke();
  ctx.strokeStyle = '#3a1e0c';
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-hr, 0); ctx.lineTo(hr, 0); ctx.moveTo(0, 0); ctx.lineTo(0, hr); ctx.stroke();
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(0, -hr, 5, 0, 6.3); ctx.fill();
  ctx.restore();
  text('左', hx - 52, hy + 6, 15, '#fff', 'center'); text('右', hx + 52, hy + 6, 15, '#fff', 'center');

  if (T.state === 'ready') {
    text('ボールを おく ばしょを きめて', W / 2, viewH - 100, 15, '#fff', 'center');
    text('ゆびを はなすと スタート', W / 2, viewH - 80, 15, '#ffd84a', 'center');
  } else if (T.state === 'roll' && !input.gotTilt && T.time < 4) {
    text('かたむきが つかえないときは 画面の左右を おす', W / 2, viewH - 80, 13, '#fff', 'center');
  }
  if (ac && ac.state !== 'running') text('🔇 音が とまっています。画面を タップ', W / 2, 62, 14, '#ffd84a', 'center');
  if (T.state === 'end') {
    const m = T.endKind === 'goal' ? ['ゴール！', '#ffd84a'] : T.endKind === 'hole' ? ['おとしあな！', '#ff8a8a'] : ['おちた！', '#ff8a8a'];
    text(m[0], W / 2, viewH * .45, 46, m[1], 'center');
  }
}

// ---- 画面の切りかえ ----
const $ = id => document.getElementById(id);
function show(id){ ['title','result'].forEach(p => $(p).classList.toggle('hide', p !== id)); }
function showResult(){
  $('resTitle').textContent = T.wins > 0 ? 'せいこう！' : 'ざんねん…';
  $('resText').innerHTML = BALLS + 'この うち ' + T.wins + 'こ ゴール' + (T.wins > 0 ? '<br>けいひん ゲット！' : '<br>もういちど ちょうせん しよう');
  show('result');
}
function begin(){ audioOn(); askTilt(); newGame(); }
function setLevel(id){
  LV = LEVELS.find(l => l.id === id) || LEVELS[1]; BALLS = LV.balls;
  try { localStorage.setItem('katamukiBallZenshinLevel', LV.id); } catch (e) {}
  document.querySelectorAll('#lvBtns button').forEach(b => b.classList.toggle('on', b.dataset.lv === LV.id));
  $('lvNote').textContent = (LV.retry ? 'おちても 近くから やりなおせる・' : '') + (LV.hole ? '' : 'あな なし・') + 'ボール ' + LV.balls + 'こ';
}
LEVELS.forEach(l => { const b = document.createElement('button'); b.textContent = l.name; b.dataset.lv = l.id; b.onclick = () => setLevel(l.id); $('lvBtns').appendChild(b); });
$('lvBtns').insertAdjacentHTML('afterend', '<p class="sub" id="lvNote" style="margin:2px 0"></p>');
let savedLv = 'easy'; try { savedLv = localStorage.getItem('katamukiBallZenshinLevel') || 'easy'; } catch (e) {}
setLevel(savedLv);
$('startBtn').addEventListener('click', begin);
$('againBtn').addEventListener('click', begin);
$('bgmBtn').classList.toggle('off', !bgmOn);
$('bgmBtn').addEventListener('click', () => { audioOn(); setBgm(!bgmOn); $('bgmBtn').classList.toggle('off', !bgmOn); });

// ---- ループ ----
let last = 0;
function frame(t){
  const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
  if (!T.manual) { update(dt); draw(); }
  requestAnimationFrame(frame);
}
resize(); draw();
requestAnimationFrame(frame);

// ---- ぜんしん版：りょう手で ハンドルを 持つように かまえて、かたむける＝台が かたむく ----
const WHEEL_FULL = 30;     // ハンドルを これだけ（度）かたむけたら 回しきり
const WHEEL_DEAD = 3;      // これより小さい かたむきは まっすぐ とみなす（度）
const WHEEL_GAP = 0.5;     // りょう手の間が これより はなれていれば ハンドルを 持っている（肩はば単位）
const cam = () => Body.mode === 'cam';
let wheel = 0;
Body.on('pose', () => {
  if (!cam()) return;
  if (T.state === 'ready') { T.startX = clamp(START_X_MIN + (Body.pos + .5) * (START_X_MAX - START_X_MIN), START_X_MIN, START_X_MAX); setBallAtStart(); input.override = 0; wheel = 0; return; }
  // りょう手を結んだ線の かたむきだけを 見る（体や 肩が かたむいても 反応しない）。手が見えない間は 直前の かたむきを 保つ
  if (Body.both && Body.gap > WHEEL_GAP) {
    const deg = Body.angle * 180 / Math.PI, a = Math.abs(deg) < WHEEL_DEAD ? 0 : deg - Math.sign(deg) * WHEEL_DEAD;
    wheel += (a - wheel) * .5;
  }
  input.override = clamp(wheel / (WHEEL_FULL - WHEEL_DEAD) * ROLL_MAX, -ROLL_MAX, ROLL_MAX);
});
Body.on('clap', () => {
  if (!cam()) return;
  if (!$('title').classList.contains('hide') || !$('result').classList.contains('hide')) begin();
  else if (T.state === 'ready') release();
});
Body.gate({title:'かたむきボール', corner:'tr', lines:['↔ <b>立つ場所</b>を 左右に かえる … ボールを おく場所を えらぶ','👏 <b>手を たたく</b> … ボールを 出す','🚗 <b>りょう手で ハンドルを 持つ</b>ように かまえて、かたむける … 台が かたむく','👏 手を たたく … はじめる・もういちど'],
  onStart: m => { if (m === 'cam') $('subText').innerHTML = '手を たたくと ボールが 出るよ<br>りょう手で ハンドルを 持つように かまえて<br>かたむけると 台が かたむくよ<br>1こでも ゴールに 入れば せいこう！'; }});
window.KB = {LEVELS, setLevel, get LV(){ return LV; }, audio: () => ({state: ac && ac.state, bgm: !!bgmSrc, loaded: Object.keys(bufs), bgmOn}), T, input, update, draw, begin, release, setBallAtStart, START_X_MIN, START_X_MAX};  // 確認用
})();
</script>
</body>
