<script type="module">
let THREE;
try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'); }
catch (e) { document.getElementById('err').style.display = 'flex'; throw e; }

// ---- 調整する数値（長さはメートル、アバターの身長は 2.1） ----
const CFG = {
  SPEED: 7,          // 全力で走る速さ（m/秒）
  ACCEL: 14,         // 走りだし・止まるときの 速さの変わり方
  TURN: 2.0,         // 回る速さ（ラジアン/秒）
  JUMP_V: 9,         // ジャンプの 初めの速さ（高さ 約1.7m）
  BOUNCE_V: 14,      // ぴょんぴょんブロックで はねる速さ（高さ 約4m）
  GRAVITY: 24,
  // カメラ：足ぶみ。「左足と右足の高さの差」（ひざ どうし・足首 どうし、肩はば単位）が 直前 RUN_WIN 秒に どれだけ変わったか。
  // 左右が 入れかわりで 上がらないと 走らない（体のゆれ・ジャンプ・カメラのぶれ・うでの動きでは 走らない）。
  // RUN_MIN より小さいと 止まる、RUN_FULL で 全力。足が うつっていないときは 走らない
  RUN_WIN: 0.45, RUN_MIN: 0.25, RUN_FULL: 0.6, LEG_VIS: 0.6,
  // 立ち止まって 体をかたむけている間は、これ以上 大きく足ぶみしないと 歩きださない（その場で 向きを変えられるように）。
  // RUN_KEEP 秒 走りつづけた後なら、かたむけても そのまま 走りながら 曲がれる
  RUN_MIN_TURN: 0.45, RUN_KEEP: 0.4,
  // カメラ：体のかたむき（肩の線のかたむき＋腰に対する肩のずれ）。TILT_MIN より小さいと まっすぐ、TILT_FULL で 回しきり
  TILT_MIN: 0.12, TILT_FULL: 0.4, LEAN_W: 0.3,
  // カメラ：よこっとび（サイドステップ）。腰のまん中が 直前 SIDE_WIN 秒に 横へ SIDE_MIN（肩はば単位）より 動いたら、その向きへ 向きを変えずに 横に動く。
  // 肩はば 1つぶん 動くと アバターは SIDE_GAIN メートル 動く。よこっとびの間と その後 SIDE_HOLD 秒は 曲がらない
  SIDE_WIN: 0.25, SIDE_MIN: 0.45, SIDE_GAIN: 2.0, SIDE_MAX: 9, SIDE_HOLD: 0.35,
  SIDE_KEY: 6,       // カメラなし：Q・E や「よこ」ボタンで 横に動く速さ
  ARM_LEN: 1.45,     // うでを まっすぐ のばしたときの 肩から手首（肩はば単位）。短く見えたぶん 前に出す
  // パンチ：① うでを のばして ふる（body.js の「ふり」のうち、手が 肩から PUNCH_REACH より遠く、PUNCH_LOW より上で、肩から はなれる向き）
  // ② カメラのほうへ つきだす（手首の奥行きが Z_SPEED より速く Z_DIST 手前に来る）。② は 立ち止まっているときだけ（走るときの うでふりと 区別できないため）
  PUNCH_REACH: 1.0, PUNCH_LOW: 0.6,
  Z_SPEED: 6, Z_DIST: 0.8, Z_REARM: 1.5,
  PUNCH_RANGE: 2.6, PUNCH_COS: 0.3, PUNCH_GAP: 0.2,       // とどく距離、前から何度まで（cos）、同じ手の最短間隔
  // けん：両手首の間が GRIP_IN より近いのが GRIP_HOLD 秒つづくと 持つ。GRIP_OUT より はなすと しまう
  GRIP_IN: 0.6, GRIP_OUT: 1.1, GRIP_HOLD: 0.1, GRIP_VIS: 0.15,
  SLASH_SPEED: 3.5, SLASH_REARM: 1.5,                      // けんの向きが これより速く変わったら 切り（ラジアン/秒）
  SWORD_RANGE: 4.1, SWORD_COS: -0.2, SWORD_GAP: 0.3, SWORD_DMG: 3,
  SWORD_LEN: 2.0,     // さすまたの ぼうの長さ
  SWORD_UP: 1.4,      // けんを 上に立てる つよさ（大きいほど、むねの前で持っても 刃が 頭の上に出る）
  ENEMIES: 14, ENEMY_SEE: 14,                              // 同時にいる数、これより近いと よってくる
  // せんとう：てきに BATTLE_START まで 近づくと、その場に 立ったまま 戦闘モードに なる。BATTLE_JOIN 以内の てきも 加わる（さいだい BATTLE_FOES）。
  // てきは BATTLE_DIST 前に ならぶ。BATTLE_MAX 秒 かかると てきが にげて おわる。おわってから BATTLE_COOL 秒は 始まらない
  BATTLE_START: 4, BATTLE_JOIN: 9, BATTLE_FOES: 3, BATTLE_DIST: 3.4, BATTLE_INTRO: 1.3, BATTLE_COOL: 2.5, BATTLE_MAX: 90,
  // てきの こうげき（FOE_ATK を false にすると してこない）：FOE_WARN 秒 ひかって 合図 → たいあたり。
  // 当たる しゅんかんの 直前 DODGE_WIN 秒に とぶ・しゃがむ・よこっとび を していれば よけたことに なる。当たっても 泣き顔に なるだけ
  FOE_ATK: true, FOE_FIRST: 3, FOE_GAP: 3.5, FOE_WARN: 1.1, FOE_LUNGE: 0.5, DODGE_WIN: 0.3,
  // じゅもん（戦闘の間だけ）：両手を 頭より上に 広げて（手首の間が MAGIC_GAP 以上）MAGIC_CHARGE 秒 かまえる → 名前を さけぶ。
  // MAGIC_WAIT 秒 名前が 聞こえなければ「おまかせ」（MP の たりる じゅもんを じゅんばんに）。となえた後 MAGIC_CD 秒は ためられない。
  // MP は てきを 1ぴき たおすと MP_KO、ほしを 1こ とると MP_STAR ふえる。FREEZE：フリーザーで こおる 秒数
  MAGIC_GAP: 0.8, MAGIC_CHARGE: 0.6, MAGIC_WAIT: 1.6, MAGIC_CD: 1.5, MP_BASE: 8, MP_LV: 2, MP_KO: 1, MP_STAR: 2, FREEZE: 8,
  // レベル：てきを たおすと けいけんち。LV_MAX まで。次のレベルまで EXP_BASE + レベル × EXP_LV。MP の上限は MP_BASE + (レベル-1) × MP_LV で、レベルが上がると 全回復。
  // こうげき力は 1 + (レベル-1)÷2（切りすて）。パンチ＝こうげき力、さすまた＝その SWORD_DMG ばい。じゅもんも こうげき力の 何ばい
  LV_MAX: 10, EXP_BASE: 3, EXP_LV: 2,
  // たいりょく：上限は HP_BASE + (レベル-1) × HP_LV。てきの こうげきが 当たると へる。0 に なると テントで 目が さめる（なくす ものは ない）
  HP_BASE: 10, HP_LV: 3,
  // ひる DAY 秒 → よる NIGHT 秒。ひかる ワタは よるの しごとで FLUFFS こずつ 出て、1こ FLUFF_COIN まい
  DAY: 150, NIGHT: 70, FLUFFS: 8, FLUFF_COIN: 3,
  // 草むしり：ひるの しごとで WEEDS かしょ。近くで しゃがむ（か パンチ）と ぬけて WEED_COIN まい。WEED_BACK 秒で べつの所に 生える
  WEEDS: 10, WEED_COIN: 2, WEED_BACK: 1.5,
  // しごとば：おやかたに「はたらかせて ください」と 言うと WORK_TIME 秒の しごと。ひるは 草むしり、よるは ひかる ワタあつめ。草も ワタも しごとの間だけ はたけに 出る
  WORK_TIME: 45,
  // 落ちている たべもの：FOODS こ。たべると FOOD_BACK 秒で べつの所に 出る
  FOODS: 4, FOOD_BACK: 30,
  // ラーメンや：1ぱい RAMEN まい。聞かれてから ASK_TIME 秒 返事を まつ。テント：わに SLEEP_HOLD 秒 立つと ねる
  RAMEN: 20, ASK_TIME: 7, SLEEP_HOLD: 3,
  // れんしゅうの へや：1回 QUIZ_N もん。1もん QUIZ_TIME 秒 まつ。せいかいで QUIZ_COIN まい
  QUIZ_N: 5, QUIZ_TIME: 25, QUIZ_COIN: 3,
  // ひみつの ひろば：たからばこ CHEST まい。じゅもんが とどく 距離 FIELD_RANGE、いわは さすまたで ROCK_HP 回
  CHEST: 30, FIELD_RANGE: 9, ROCK_HP: 3,
  VOICE_HOLD: 1.5,   // 声の めいれい：手を 下ろしてからも この秒数は 聞きつづける
  HAND_CALLS: 2,     // どろの手が 1回の 戦闘で なかまを よぶ 回数
  LOGS: 5, LOG_R: 0.55, LOG_LEN: 4, LOG_SPEED: 5, LOG_PUSH: 10,   // ころころ どうろの まるた：本数、太さ、長さ、速さ、当たったとき おされる速さ
  CRY: 2.5,          // まるたに 当たったあと 泣き顔でいる 秒数
  WATER: 0.45,       // いけの中での 速さ（ふだんの 何倍か）
  LIFT_WAIT: 2.5, LIFT_MOVE: 3,                                   // エレベーター：上下で まつ秒数、動く秒数
  NEST_R: 1.9, NEST_HOLD: 3,     // ゲームの入口：光るわの まん中から この近さで、これだけの秒数 立っていると 入る
  STARS: 10, HALF: 58
};

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---- 画面 ----
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const SKY_LOW = 0xbfe3ff, SKY_HIGH = 0x3f8fe6;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY_LOW);
scene.fog = new THREE.Fog(SKY_LOW, 60, 150);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 320);
const hemi = new THREE.HemisphereLight(0xdfefff, 0x7a9a55, 1.25); scene.add(hemi);
// たいよう：アバターに ついていって、まわりにだけ かげを落とす
const SUN_DIR = new THREE.Vector3(30, 60, 20);
const sun = new THREE.DirectionalLight(0xfff1d6, 1.9); sun.position.copy(SUN_DIR); scene.add(sun); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 170 });
function resize(){
  const w = innerWidth || 800, h = innerHeight || 600;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w < h ? 75 : 60; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
// おそい機械では かげを やめて、あらく描く（はじめの 3秒の 速さで きめる）
function lite(){ sun.castShadow = false; renderer.setPixelRatio(1); resize(); }

const mats = {};
const mat = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
const flat = c => new THREE.MeshLambertMaterial({ color: c, flatShading: true });
function lit(m){ if (!m.material.isMeshBasicMaterial){ m.castShadow = true; m.receiveShadow = true; } return m; }
function box(w, h, d, color, x, y, z, parent){
  const m = lit(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof color === 'number' ? mat(color) : color));
  m.position.set(x, y, z); (parent || scene).add(m); return m;

// 聞こえた ことばから 数を とりだす（「7」「七」「なな」「ななひき」「3かい」など）。わからなければ null
const NUM_KANA = { ゼロ: 0, レイ: 0, イチ: 1, イッ: 1, ヒトツ: 1, ニ: 2, フタツ: 2, サン: 3, ミッツ: 3, ヨン: 4, ヨ: 4, シ: 4, ヨッツ: 4, ゴ: 5, イツツ: 5, ロク: 6, ロッ: 6, ムッツ: 6, ナナ: 7, シチ: 7, ナナツ: 7, ハチ: 8, ハッ: 8, ヤッツ: 8, キュウ: 9, キュ: 9, ク: 9, ココノツ: 9, ジュウ: 10, ジュ: 10, ジュッ: 10, ジッ: 10, トオ: 10 };
function hearNumber(str){
  const z = str.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)), d = z.match(/\d+/g);
  if (d) return +d[0];
  const k = z.match(/[〇一二三四五六七八九十]/g);
  if (k) return '〇一二三四五六七八九十'.indexOf(k[0]);
  for (const w of z.split(/\s+/)){
    const n = norm(w).replace(/(デス|ダヨ|ダ|カナ)$/, '').replace(/(ヒキ|ビキ|ピキ|カイ|マイ|コ|ツ)$/, m => m === 'ツ' ? m : '');
    if (n in NUM_KANA) return NUM_KANA[n];
  }
  return null;
}
// れんしゅう用の てきを 出して 戦闘を 始める。たいりょく・MP は れんしゅうの間だけの 数に して、おわったら もどす

  let steps;
  if (Math.random() < 0.5){                                 // どろの手：よぶ → こうげきされる → サンダー → さすまた
    const [hp0, td] = [[6, 2], [8, 2], [9, 3]][ri(0, 2)], h = ri(1, 2); for (let i = 0; i < h; i++) add(T('hand'), hp0);

}

let ac = null;
function beep(f, t, type, vol, slide){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, n); if (slide) o.frequency.exponentialRampToValueAtTime(slide, n + t);
    g.gain.setValueAtTime(vol || 0.12, n); g.gain.exponentialRampToValueAtTime(0.001, n + t);
    o.connect(g).connect(ac.destination); o.start(n); o.stop(n + t);
  } catch (e) {}
}

  if (now - sideLast < CFG.SIDE_HOLD) steerS = 0;   // よこっとびの間は 曲がらない（とぶとき 体が かたむくため）
  else steerS += (raw - steerS) * 0.35;
  poseAttack(lm, u, now);
  S.cam.steer = steerS; S.cam.wall = performance.now();
});
Body.on('jump', () => { if (Body.mode === 'cam') jump(); });

  if (Body.mode !== 'cam' || S.sword) return;
  pend[e.i] = { until: Body.now + 0.25, dx: e.dx, dy: e.dy };   // ふりの 終わりで うでが のびたかを poseAttack で見る
});
const pend = [null, null];
let atkT = 0, gripT = 0, lostT = 0, sdPrev = null, slashArmed = true;
const zs = [{ z: null, org: 0, armed: false }, { z: null, org: 0, armed: false }];
const sdNew = new THREE.Vector3();
function poseAttack(lm, u, now){
  const dt = clamp(now - atkT, 0.001, 0.1); atkT = now;
  const asp = Body.asp, lw = lm[15], rw = lm[16], ok = p => p.visibility == null || p.visibility > CFG.GRIP_VIS;
  // じゅもんの かまえ：両手首が 鼻より上で、はなれている
  S.cam.magic = ok(lw) && ok(rw) && lw.y < lm[0].y && rw.y < lm[0].y && Math.hypot((lw.x - rw.x) * asp, lw.y - rw.y) / u > CFG.MAGIC_GAP;
  // 声の めいれい：かた手でも 手首が 鼻より上に あれば「手を あげている」
  if ((ok(lw) && lw.y < lm[0].y) || (ok(rw) && rw.y < lm[0].y)) S.cam.handT = performance.now();
  if (S.cam.magic) pend[0] = pend[1] = null;   // 手を 上げる動きで パンチが 出ないように
  // けん：両手首を 近づける
  if (ok(lw) && ok(rw)){
    lostT = 0;
    const gap = dbg.gap = Math.hypot((lw.x - rw.x) * asp, lw.y - rw.y) / u;
    if (gap < CFG.GRIP_IN){ gripT += dt; if (gripT > CFG.GRIP_HOLD) setSword(true); }
    else { gripT = 0; if (gap > CFG.GRIP_OUT) setSword(false); }
    if (S.sword){
      // 肩のまん中から見た 両手のまん中の向きが けんの向き。手が体に近いほど 前（画面の奥）を向く
      const mx = ((lm[11].x + lm[12].x) - (lw.x + rw.x)) / 2 * asp / u, my = ((lw.y + rw.y) - (lm[11].y + lm[12].y)) / 2 / u;
      const fwd = Math.sqrt(Math.max(0.25, CFG.ARM_LEN * CFG.ARM_LEN - mx * mx - my * my));
      sdNew.set(mx, -my + CFG.SWORD_UP, -fwd * 0.6).normalize();
      if (sdPrev){
        const sp = sdNew.distanceTo(sdPrev) / dt;
        if (sp < CFG.SLASH_REARM) slashArmed = true;
        else if (slashArmed && sp > CFG.SLASH_SPEED){ slashArmed = false; slash(); }
      } else sdPrev = new THREE.Vector3();
      sdPrev.copy(sdNew); S.cam.sd.lerp(sdNew, 0.6).normalize();
    } else sdPrev = null;
  } else { lostT += dt; if (lostT > 1) setSword(false); }
  // パンチ：ふった手が 肩から遠く・高い所まで のびたら 1発
  pend.forEach((q, i) => {
    if (!q) return;
    const h = Body.hands[i], r = Math.hypot(h.px, h.py) || 1;
    if (now > q.until || S.sword || !h.vis){ pend[i] = null; return; }
    if (r > CFG.PUNCH_REACH && h.py < CFG.PUNCH_LOW && (h.px * q.dx + h.py * q.dy) / r > 0.3){ pend[i] = null; dbg.why = 'ふり'; punch(i); }
  });
  // パンチ：カメラのほうへ つきだす（手首の奥行き）
  [[15, 11], [16, 12]].forEach(([w, sh], i) => {
    const st = zs[i];
    if (!ok(lm[w]) || !isFinite(lm[w].z) || !isFinite(lm[sh].z) || S.sword || S.cam.magic || S.cam.run > 0 || S.speed > 0.5){ st.z = null; return; }
    const z = (lm[w].z - lm[sh].z) * asp / u;
    if (st.z == null){ st.z = z; st.org = z; st.armed = false; return; }
    const nz = st.z + (z - st.z) * 0.6, v = (nz - st.z) / dt; st.z = nz;
    if (v > -CFG.Z_REARM){ st.org = nz; st.armed = true; }
    else if (st.armed && v < -CFG.Z_SPEED && st.org - nz > CFG.Z_DIST){ st.armed = false; dbg.why = 'つきだし'; punch(i); }
  });
}
