(function ground(){

    g.strokeStyle = c; g.lineWidth = lw; g.lineCap = g.lineJoin = 'round'; g.beginPath();

  road([[14, 6], [20, 16], [27, 30], [29.5, 34]], 14);                             // → いけ
  road([[0, 0], [-12, -10], [-24, -24], [-36, -34], [-39.7, -37]], 16);            // → とう
  road([[-12, -10], [-12, -26]], 12); road([[30, 14], [34, 0]], 12); road([[0, 0], [-18, 12], [-36, 19.5]], 12);   // → いえ
  road([[-36, 19.5], [-39, 32], [-34, 45.5]], 14); road([[0, 0], [6, -14], [9, -30], [20, -44]], 14);                // → ゲームの入口
  g.fillStyle = '#b08a52'; g.fillRect(px(LANE.x0), px(LANE.z0 - 3), len(LANE.x1 - LANE.x0), len(LANE.z1 - LANE.z0 + 5));
  g.fillStyle = 'rgba(90,60,30,.25)'; for (let z = LANE.z0; z < LANE.z1; z += 3) g.fillRect(px(LANE.x0), px(z), len(LANE.x1 - LANE.x0), 5);
  const sand = g.createRadialGradient(px(POND.x), px(POND.z), len(POND.r) - 6, px(POND.x), px(POND.z), len(POND.r + 2.4));
  sand.addColorStop(0, '#e2cf96'); sand.addColorStop(0.7, '#d9c58a'); sand.addColorStop(1, 'rgba(217,197,138,0)');

(function sky(){

}
function placeEnemy(e){
  for (let n = 0; n < 99; n++){
    const x = (rnd() * 2 - 1) * (CFG.HALF - 4), z = (rnd() * 2 - 1) * (CFG.HALF - 4);
    if (!freeAt(x, z, 1.5) || Math.hypot(x - S.x, z - S.z) < 12) continue;
    e.x = x; e.z = z; break;
  }
  e.big = rnd() < 0.25; e.size = e.big ? 1.7 : 1; e.hp = e.big ? 3 : 1;
  e.color = e.big ? 0x9b5de5 : 0x4cd964; e.m.color.setHex(e.color);
  e.y = 0; e.vy = 0; e.kx = e.kz = 0; e.wait = rnd() * 1.5; e.dead = 0; e.flash = 0;
  e.g.scale.setScalar(e.size); e.g.visible = true;
}
function updateEnemies(dt){
  for (const e of enemies){
    if (e.dead > 0){ e.dead -= dt; if (e.dead <= 0) placeEnemy(e); continue; }
    const dx = S.x - e.x, dz = S.z - e.z, d = Math.hypot(dx, dz) || 1;
    let mx = e.kx * dt, mz = e.kz * dt;
    e.kx *= Math.max(0, 1 - dt * 6); e.kz *= Math.max(0, 1 - dt * 6);
    if (e.y <= 0 && e.vy <= 0){
      e.y = 0; e.wait -= dt;
      if (e.wait <= 0){
        e.vy = 6; e.wait = 0.3 + rnd() * 0.8;
        if (d < CFG.ENEMY_SEE && d > 1.2 + e.size * 0.5){ e.hx = dx / d * 3; e.hz = dz / d * 3; }
        else if (d >= CFG.ENEMY_SEE){ const a = rnd() * 6.283; e.hx = Math.cos(a) * 2; e.hz = Math.sin(a) * 2; }
        else e.hx = e.hz = 0;
      }
    } else { e.vy -= 20 * dt; e.y = Math.max(0, e.y + e.vy * dt); mx += e.hx * dt; mz += e.hz * dt; }
    const nx = clamp(e.x + mx, -CFG.HALF, CFG.HALF), nz = clamp(e.z + mz, -CFG.HALF, CFG.HALF);
    if (!blocked(nx, e.z, 0)) e.x = nx;
    if (!blocked(e.x, nz, 0)) e.z = nz;
    if (e.flash > 0){ e.flash -= dt; e.m.color.setHex(e.flash > 0 ? 0xffffff : e.color); }
    e.g.position.set(e.x, e.y, e.z);
    if (d < CFG.ENEMY_SEE) e.g.rotation.y = Math.atan2(-dx, -dz);
    e.g.scale.set(e.size, e.size * (e.y > 0 ? 1.12 : 1), e.size);
  }
}
function hurt(e, dmg){
  const dx = e.x - S.x, dz = e.z - S.z, d = Math.hypot(dx, dz) || 1;
  e.hp -= dmg; e.flash = 0.12; e.kx = dx / d * 5; e.kz = dz / d * 5;

  if (e.hp > 0){ sfx.hit(); return; }
  e.dead = 5; e.g.visible = false; S.ko++; sfx.ko(); hud();
  for (let i = 0; i < 7; i++) spark(e.x, 0.5, e.z, e.color, 0.3 * e.size, { life: 0.7, max: 0.7, grow: 0, grav: 18, vx: (rnd() - 0.5) * 7, vy: 4 + rnd() * 4, vz: (rnd() - 0.5) * 7 });
}
// 前にいる てきに 当てる。multi：とどく てき ぜんぶ（けん）。そうでなければ いちばん近い 1ぴき（パンチ）
function attack(range, cos, dmg, multi){
  const ax = -Math.sin(S.yaw), az = -Math.cos(S.yaw);
  const hits = [];
  for (const e of enemies){
    if (e.dead > 0 || Math.abs(e.y - S.y) > 2.4) continue;
    const dx = e.x - S.x, dz = e.z - S.z, d = Math.hypot(dx, dz);
    if (d > range + e.size * 0.5) continue;
    if (d > 1.1 && (dx * ax + dz * az) / d < cos) continue;
    hits.push([d, e]);
  }
  hits.sort((a, b) => a[0] - b[0]);
  (multi ? hits : hits.slice(0, 1)).forEach(h => hurt(h[1], dmg));
  return hits.length;
}
const lastPunch = [-9, -9]; let lastSlash = -9;

}

    g.gain.setValueAtTime(vol || 0.12, n); g.gain.exponentialRampToValueAtTime(0.001, n + t);

}

const S = {

  sv: 0, kx: 0, kz: 0, bumpT: -9, wetT: 0, sideSnd: 0,   // sv：横に動く速さ（右が＋）、kx・kz：まるたに おされた速さ
  got: 0, round: 0, dist: 0, phase: 0, t: 0, ko: 0, medal: 0,

let msgTimer = 0;

const R = 0.35, STEP = 0.35;   // 体の半径、そのまま のぼれる段差
const over = (s, x, z) => x + R > s.x0 && x - R < s.x1 && z + R > s.z0 && z - R < s.z1;
const blocked = (x, z, y) => solids.some(s => over(s, x, z) && s.h > y + STEP);
function floorAt(x, z, y){ let top = null, h = 0; solids.forEach(s => { if (over(s, x, z) && s.h <= y + STEP && s.h > h){ h = s.h; top = s; } }); return { h, top }; }

function jump(){

  S.vy = CFG.JUMP_V; S.ground = false; sfx.jump();
}

const TIP_CAM = 'あしぶみ＝はしる　かたむける＝まがる　よこっとび＝よこに うごく　りょうてを あわせる＝さすまた';
const DEBUG = location.search.includes('debug');
const qA = new THREE.Quaternion(), vDown = new THREE.Vector3(0, -1, 0), vUp = new THREE.Vector3(0, 1, 0), vDir = new THREE.Vector3(), vS = new THREE.Vector3(), vH = new THREE.Vector3();
S.cam.sd = new THREE.Vector3(0, 0.95, -0.35).normalize();
function update(dt){
  dt = Math.min(dt, 0.05);
  S.t += dt;
  const cam = Body.mode === 'cam';
  let run = 0, steer = 0, side = 0;
  if (S.on){
    if (cam){
      if (performance.now() - S.cam.wall < 400 && Body.ok){ run = S.cam.run; steer = S.cam.steer; side = S.cam.side; }
    } else {
      run = S.key.run ? 1 : 0; steer = (S.key.right ? 1 : 0) - (S.key.left ? 1 : 0);
      side = ((S.key.sr ? 1 : 0) - (S.key.sl ? 1 : 0)) * CFG.SIDE_KEY;
    }
  }
  const wet = inPond(S.x, S.z) && S.y < 0.12, slow = wet ? CFG.WATER : 1;
  S.yaw -= steer * CFG.TURN * dt;
  const target = run * CFG.SPEED * slow;
  S.speed += clamp(target - S.speed, -CFG.ACCEL * dt, CFG.ACCEL * dt);
  S.sv += clamp(side * slow - S.sv, -60 * dt, 60 * dt);
  if (Math.abs(S.sv) > 2 && S.t - S.sideSnd > 0.35){ S.sideSnd = S.t; sfx.side(); }
  S.kx *= Math.max(0, 1 - dt * 4); S.kz *= Math.max(0, 1 - dt * 4);
  // 前（-sin, -cos）と 右（cos, -sin）
  const fx = -Math.sin(S.yaw), fz = -Math.cos(S.yaw), step = S.speed * dt, ss = S.sv * dt;
  const ox = S.x, oz = S.z;
  const nx = clamp(S.x + fx * step + fz * -ss + S.kx * dt, -CFG.HALF, CFG.HALF); if (!blocked(nx, S.z, S.y)) S.x = nx;
  const nz = clamp(S.z + fz * step + fx * ss + S.kz * dt, -CFG.HALF, CFG.HALF); if (!blocked(S.x, nz, S.y)) S.z = nz;
  S.dist += Math.hypot(S.x - ox, S.z - oz);
  if (wet && (S.speed > 1 || Math.abs(S.sv) > 1) && S.t - S.wetT > 0.22){
    S.wetT = S.t; sfx.splash();
    for (let i = 0; i < 3; i++) spark(S.x, 0.25, S.z, 0xd8f3ff, 0.16, { life: 0.4, max: 0.4, grow: 0, grav: 16, vx: (rnd() - 0.5) * 3, vy: 3 + rnd() * 2, vz: (rnd() - 0.5) * 3 });
  }
  updateWorld(dt); updateGates(dt);

  const f = floorAt(S.x, S.z, S.y);
  S.vy -= CFG.GRAVITY * dt;
  S.y += S.vy * dt;
  if (S.y <= f.h){
    S.y = f.h;
    if (f.top && f.top.bounce && S.vy < -1){ S.vy = CFG.BOUNCE_V; S.ground = false; sfx.bounce(); }
    else { S.vy = 0; S.ground = true; }
  } else if (S.y > f.h + 0.05) S.ground = false;

  // ほし

    if (!s.hit && Math.hypot(s.x - S.x, s.z - S.z) < 1.4 && S.y > s.y - 1 && S.y < s.y + 2.5){
      s.hit = true; scene.remove(s.g); S.got++; sfx.star();
      const left = stars.length - S.got;
      if (left > 0) say(`⭐ ${S.got}こ！ あと ${left}こ`, 1.5);
      else { S.round++; sfx.clear(); say('ぜんぶ あつめた！ すごい！', 3); setTimeout(() => { placeStars(); say('あたらしい ほしが でたよ！'); }, 3200); }
      hud();
    }
  }
  if ((S.t * 4 | 0) !== ((S.t - dt) * 4 | 0)) hud();

  // アバターの うごき

  const k = S.speed / CFG.SPEED;

  S.crouch = cam && Body.ok && Body.crouch;

  // さすまた：手の位置（おなかの前）から さすまたの向きへ のびる。カメラなしのときは きまった ふり
  S.pAnim = Math.max(0, S.pAnim - dt); S.sAnim = Math.max(0, S.sAnim - dt);
  if (S.sword){
    if (cam && Body.ok) vS.copy(S.cam.sd);
    else if (S.sAnim > 0){ const q = 1 - S.sAnim / 0.22; vS.set(0.9 - 1.8 * q, 0.9 - 1.0 * q, -0.6).normalize(); }

    else if (cam && Body.ok && h.vis){

  }
  shadow.position.set(S.x, f.h + 0.02, S.z); shadow.scale.setScalar(clamp(1 - (S.y - f.h) * 0.15, 0.4, 1));

  // カメラ：アバターの うしろから ついていく
  let d = S.yaw - S.camYaw; d = Math.atan2(Math.sin(d), Math.cos(d));
  S.camYaw += d * Math.min(1, dt * 3);
  const back = 7.5, cx = S.x + Math.sin(S.camYaw) * back, cz = S.z + Math.cos(S.camYaw) * back;
  camera.position.set(cx, S.y + 4.2, cz);
  camera.lookAt(S.x, S.y + 1.7, S.z);
  dome.position.copy(camera.position);
  sun.position.set(S.x, 0, S.z).add(SUN_DIR); sun.target.position.set(S.x, 0, S.z);
}

// まるた・エレベーター・くも
function updateWorld(dt){
  const len = LANE.z1 - LANE.z0;
  for (const l of logs){
    l.z += CFG.LOG_SPEED * dt; l.roll += CFG.LOG_SPEED / CFG.LOG_R * dt;
    if (l.z > LANE.z1){ l.z -= len; l.x = LANE.x0 + CFG.LOG_LEN / 2 + rnd() * (LANE.x1 - LANE.x0 - CFG.LOG_LEN); }
    const sc = clamp(Math.min(l.z - LANE.z0, LANE.z1 - l.z) / 2.5, 0.01, 1);   // ほらあなから 出てきて、道の おわりで きえる
    l.g.position.set(l.x, CFG.LOG_R * sc, l.z); l.g.rotation.x = l.roll; l.g.scale.set(1, sc, sc);
    if (S.on && sc > 0.7 && S.y < CFG.LOG_R * 1.6 && Math.abs(S.z - l.z) < CFG.LOG_R + R && Math.abs(S.x - l.x) < CFG.LOG_LEN / 2 + R && S.t - S.bumpT > 0.6){
      S.bumpT = S.t; S.kz = CFG.LOG_PUSH; S.vy = 5; S.ground = false; sfx.bump();
      say('ごろん！ よこに よけるか とびこえよう', 1.6);
      for (let i = 0; i < 5; i++) spark(S.x, 0.6, S.z, 0xe2c08a, 0.22, { life: 0.5, max: 0.5, grow: 0, grav: 16, vx: (rnd() - 0.5) * 5, vy: 3 + rnd() * 3, vz: (rnd() - 0.5) * 5 });
    }
  }
  // エレベーター：下で まつ → のぼる → 上で まつ → おりる
  const W = CFG.LIFT_WAIT, M = CFG.LIFT_MOVE, t = (lift.t += dt) % ((W + M) * 2);
  const q = t < W ? 0 : t < W + M ? (t - W) / M : t < W * 2 + M ? 1 : 1 - (t - W * 2 - M) / M;
  lift.h = 0.3 + (TOWER.h - 0.3) * q * q * (3 - 2 * q);
  lift.m.scale.y = lift.h; lift.m.position.y = lift.h / 2;
  for (const c of clouds){ c.position.x += dt * 0.8; if (c.position.x > 170) c.position.x = -170; }
}

// ---- 中に入れた ゲーム ----
// 入口の わに NEST_HOLD 秒 立つと、画面いっぱいに そのゲームを かさねて開く。その間 はらっぱは 止めて、カメラも はなす。
// 中のゲームの ようす（クリア・ゲームオーバー）は 同じサイトなので 外から読める。読めなくても「もどる」ボタンで もどれる
let nest = null, nestPoll = 0, nestEnd = 0;
function updateGates(dt){
  for (const gm of GAMES){
    const d = Math.hypot(S.x - gm.px, S.z - gm.pz), pulse = 0.5 + 0.5 * Math.sin(S.t * 4);
    gm.ring.position.y = 0.2 + pulse * 0.12; gm.beam.material.opacity = 0.12 + pulse * 0.1 + (gm.t > 0 ? 0.25 : 0);
    if (gm.door) gm.door.material.opacity = 0.55 + pulse * 0.35;
    if (d > CFG.NEST_R + 1.5) gm.armed = true;
    if (S.on && !nest && gm.armed && d < CFG.NEST_R && S.y < 0.6){
      gm.t += dt;
      const n = Math.ceil(CFG.NEST_HOLD - gm.t);
      if (n !== gm.n && n > 0){ gm.n = n; say(`${gm.name} に はいるよ… ${n}`, 1.3); beep(660, 0.08, 'square', 0.08); }
      if (gm.t >= CFG.NEST_HOLD) openNest(gm);
    } else if (gm.t > 0){ gm.t = 0; gm.n = 0; }
  }
}
const DEV = !location.hostname.endsWith('github.io');
function openNest(gm){
  nest = gm; gm.t = 0; gm.n = 0; gm.armed = false; gm.clears = 0; gm.seen = ''; gm.won = false; gm.top = 0; nestEnd = 0;
  S.key.left = S.key.right = S.key.run = S.key.sl = S.key.sr = false; S.speed = 0; S.sv = 0;
  if (Body.mode === 'cam') Body.pause();
  $('nestName').textContent = gm.name; $('nestFrame').src = DEV ? gm.dev : gm.pub; $('nest').style.display = 'flex';
  beep(523, 0.15, 'triangle', 0.15, 1047);
  nestPoll = setInterval(watchNest, 400);
}
function watchNest(){
  if (!nest) return;
  let g = null;
  try { g = $('nestFrame').contentWindow.__game; } catch (e) {}
  if (!g) return;
  let over = false;
  if (nest.key === 'hold'){
    const st = g.state;
    if (st === 'clear' && nest.seen !== 'clear') nest.clears++;
    nest.seen = st; over = st === 'over';
  } else if (g.S){
    nest.top = Math.max(nest.top, g.S.chapter || 0);
    if (g.S.over === 'win'){ nest.won = true; over = true; }
  }
  // おわったら 少し 見せてから はらっぱに もどる
  if (!over) nestEnd = 0;
  else if (!nestEnd) nestEnd = performance.now();
  else if (performance.now() - nestEnd > (nest.won ? 7000 : 4500)) closeNest();
}
async function closeNest(){
  const gm = nest; if (!gm) return;
  nest = null; clearInterval(nestPoll);
  $('nestFrame').src = 'about:blank'; $('nest').style.display = 'none';
  // 入口の 外（スタートのほう）に 出して、スタートのほうを 向かせる
  const d = Math.hypot(gm.px, gm.pz) || 1, ux = -gm.px / d, uz = -gm.pz / d;
  S.x = gm.px + ux * (CFG.NEST_R + 2.5); S.z = gm.pz + uz * (CFG.NEST_R + 2.5); S.y = 0; S.vy = 0; S.speed = 0; S.sv = 0;
  S.yaw = S.camYaw = Math.atan2(-ux, -uz); last = 0;
  const got = gm.key === 'hold' ? gm.clears : gm.won ? 5 : gm.top;   // ホールド：クリアした ステージの数。クエスト：たおした ボスの数（さいごまで いくと 5）
  if (got > 0){ S.medal += got; hud(); sfx.clear(); say(`${gm.name} 🏅 +${got}！ おかえり！`, 3.5); }
  else say('はらっぱに もどったよ', 2);
  if (Body.mode === 'cam' && !(await Body.resume())) say('カメラを つなぎなおせませんでした。ページを ひらきなおしてね', 6);
}
$('nestBack').addEventListener('click', closeNest);

function tick(dt){ if (nest) return; update(dt); renderer.render(scene, camera); }
let last = 0;
let fpsT = 0, fpsN = 0;
function frame(ts){
  requestAnimationFrame(frame); const dt = last ? (ts - last) / 1000 : 0.016; last = ts; tick(dt);
  if (S.on && fpsT < 3 && dt < 0.5){ fpsT += dt; fpsN++; if (fpsT >= 3 && fpsN / fpsT < 24) lite(); }
}

// ---- カメラからの入力 ----
let legH = [], steerS = 0, runFrom = null, runLast = -9, sideH = [], sideOn = false, sideLast = -9, sideRun = false;
const LEGS = [[25, 26], [27, 28]], legS = {};   // ひざ どうし、足首 どうし
const dbg = { m: 0, min: 0, gap: 9, why: '', side: 0 };
Body.on('pose', () => {
  if (Body.mode !== 'cam') return;
  const lm = Body.lm, u = Body.unit, see = i => lm[i].visibility == null || lm[i].visibility > CFG.LEG_VIS;
  const now = Body.now, row = { t: now };
  let seen = 0;
  LEGS.forEach(([l, r]) => {
    if (!see(l) || !see(r)){ legS[l] = null; return; }
    seen++;
    // 同じがわの腰から見た高さの、左右の差（体をかたむけたり とんだりしても 変わらない）
    const d = ((lm[l].y - lm[23].y) - (lm[r].y - lm[24].y)) / u;
    legS[l] = legS[l] == null ? d : legS[l] + (d - legS[l]) * 0.5;
    row[l] = legS[l];
  });
  S.cam.legs = seen > 0;
  legH.push(row); while (legH.length && now - legH[0].t > CFG.RUN_WIN) legH.shift();
  let m = 0;
  LEGS.forEach(([l]) => { let lo = 9, hi = -9; legH.forEach(r => { if (r[l] != null){ lo = Math.min(lo, r[l]); hi = Math.max(hi, r[l]); } }); m = Math.max(m, hi - lo); });
  const tilt = Body.roll + Body.lean * CFG.LEAN_W, a = Math.abs(tilt);
  if (now - runLast > 0.3) runFrom = null;
  const running = runFrom != null && now - runFrom > CFG.RUN_KEEP;
  const min = a > CFG.TILT_MIN * 0.6 && !running ? CFG.RUN_MIN_TURN : CFG.RUN_MIN;
  // よこっとび：腰のまん中（鏡うつしの x）が SIDE_WIN 秒前から どれだけ 横に動いたか。腰が うつらないときは 見ない
  let sideV = 0;
  if (Body.full && see(23) && see(24)){
    const hx = (1 - (lm[23].x + lm[24].x) / 2) * Body.asp;
    sideH.push({ t: now, x: hx }); while (sideH.length > 2 && now - sideH[1].t >= CFG.SIDE_WIN) sideH.shift();
    const span = now - sideH[0].t, d = (hx - sideH[0].x) / u;
    dbg.side = d;
    if (span > CFG.SIDE_WIN * 0.5 && span < CFG.SIDE_WIN * 2){
      const was = sideOn;
      sideOn = Math.abs(d) > (sideOn ? CFG.SIDE_MIN * 0.5 : CFG.SIDE_MIN);
      if (sideOn && !was && now - sideLast > CFG.SIDE_HOLD) sideRun = running;   // 走っている とちゅうの よこっとびか
      if (sideOn){ sideV = clamp(d / span * CFG.SIDE_GAIN, -CFG.SIDE_MAX, CFG.SIDE_MAX); sideLast = now; }
    } else sideOn = false;
  } else { sideH.length = 0; sideOn = false; }
  S.cam.side = sideV;
  // 立ち止まってからの よこっとび（反復横とび）の間と その後 SIDE_HOLD 秒は、足が 動いても 前に走らない
  const hop = now - sideLast < CFG.SIDE_HOLD && !sideRun;
  if (hop) legH.length = 0;
  S.cam.run = m < min || hop ? 0 : clamp(m / CFG.RUN_FULL, 0.5, 1);
  dbg.m = m; dbg.min = min;
  if (S.cam.run){ if (runFrom == null) runFrom = now; runLast = now; }
  const raw = a < CFG.TILT_MIN ? 0 : Math.sign(tilt) * clamp((a - CFG.TILT_MIN) / (CFG.TILT_FULL - CFG.TILT_MIN), 0, 1);
  if (now - sideLast < CFG.SIDE_HOLD) steerS = 0;   // よこっとびの間は 曲がらない（とぶとき 体が かたむくため）
  else steerS += (raw - steerS) * 0.35;
  poseAttack(lm, u, now);
  S.cam.steer = steerS; S.cam.wall = performance.now();
});
Body.on('jump', () => { if (Body.mode === 'cam') jump(); });
Body.on('swing', e => {
  if (Body.mode !== 'cam' || S.sword) return;
  pend[e.i] = { until: Body.now + 0.25, dx: e.dx, dy: e.dy };   // ふりの 終わりで うでが のびたかを poseAttack で見る
});
const pend = [null, null];
let atkT = 0, gripT = 0, lostT = 0, sdPrev = null, slashArmed = true;
const zs = [{ z: null, org: 0, armed: false }, { z: null, org: 0, armed: false }];
const sdNew = new THREE.Vector3();
function poseAttack(lm, u, now){
  const dt = clamp(now - atkT, 0.001, 0.1); atkT = now;
  const asp = Body.asp, lw = lm[15], rw = lm[16], ok = p => p.visibility == null || p.visibility > CFG.GRIP_VIS;
  // けん：両手首を 近づける
  if (ok(lw) && ok(rw)){
    lostT = 0;
    const gap = dbg.gap = Math.hypot((lw.x - rw.x) * asp, lw.y - rw.y) / u;
    if (gap < CFG.GRIP_IN){ gripT += dt; if (gripT > CFG.GRIP_HOLD) setSword(true); }
    else { gripT = 0; if (gap > CFG.GRIP_OUT) setSword(false); }
    if (S.sword){
      // 肩のまん中から見た 両手のまん中の向きが けんの向き。手が体に近いほど 前（画面の奥）を向く
      const mx = ((lm[11].x + lm[12].x) - (lw.x + rw.x)) / 2 * asp / u, my = ((lw.y + rw.y) - (lm[11].y + lm[12].y)) / 2 / u;
      const fwd = Math.sqrt(Math.max(0.25, CFG.ARM_LEN * CFG.ARM_LEN - mx * mx - my * my));
      sdNew.set(mx, -my + CFG.SWORD_UP, -fwd * 0.6).normalize();
      if (sdPrev){
        const sp = sdNew.distanceTo(sdPrev) / dt;
        if (sp < CFG.SLASH_REARM) slashArmed = true;
        else if (slashArmed && sp > CFG.SLASH_SPEED){ slashArmed = false; slash(); }
      } else sdPrev = new THREE.Vector3();
      sdPrev.copy(sdNew); S.cam.sd.lerp(sdNew, 0.6).normalize();
    } else sdPrev = null;
  } else { lostT += dt; if (lostT > 1) setSword(false); }
  // パンチ：ふった手が 肩から遠く・高い所まで のびたら 1発
  pend.forEach((q, i) => {
    if (!q) return;
    const h = Body.hands[i], r = Math.hypot(h.px, h.py) || 1;
    if (now > q.until || S.sword || !h.vis){ pend[i] = null; return; }
    if (r > CFG.PUNCH_REACH && h.py < CFG.PUNCH_LOW && (h.px * q.dx + h.py * q.dy) / r > 0.3){ pend[i] = null; dbg.why = 'ふり'; punch(i); }
  });
  // パンチ：カメラのほうへ つきだす（手首の奥行き）
  [[15, 11], [16, 12]].forEach(([w, sh], i) => {
    const st = zs[i];
    if (!ok(lm[w]) || !isFinite(lm[w].z) || !isFinite(lm[sh].z) || S.sword || S.cam.run > 0 || S.speed > 0.5){ st.z = null; return; }
    const z = (lm[w].z - lm[sh].z) * asp / u;
    if (st.z == null){ st.z = z; st.org = z; st.armed = false; return; }
    const nz = st.z + (z - st.z) * 0.6, v = (nz - st.z) / dt; st.z = nz;
    if (v > -CFG.Z_REARM){ st.org = nz; st.armed = true; }
    else if (st.armed && v < -CFG.Z_SPEED && st.org - nz > CFG.Z_DIST){ st.armed = false; dbg.why = 'つきだし'; punch(i); }
  });
}

// ---- カメラなしの入力 ----
const KEYS = { ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ArrowUp: 'run', w: 'run', q: 'sl', e: 'sr' };
const ACT = { jump, punch: () => strike(S.pNext ^= 1), sword: () => setSword(!S.sword) };
const ACT_KEYS = { ' ': 'jump', z: 'punch', j: 'punch', x: 'sword', k: 'sword' };
addEventListener('keydown', e => { if (nest) return; if (ACT_KEYS[e.key]){ if (!e.repeat) ACT[ACT_KEYS[e.key]](); e.preventDefault(); } else if (KEYS[e.key]) S.key[KEYS[e.key]] = true; });
addEventListener('keyup', e => { if (KEYS[e.key]) S.key[KEYS[e.key]] = false; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); b.classList.add('on'); if (ACT[k]) ACT[k](); else S.key[k] = true; };
  const up = e => { e.preventDefault(); b.classList.remove('on'); if (!ACT[k]) S.key[k] = false; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});

placeStars();
for (let i = 0; i < CFG.ENEMIES; i++) makeEnemy();
requestAnimationFrame(frame);
Body.gate({
  title: 'からだアバター<br>はらっぱ ぼうけん', corner: 'tr', needFull: true,
  lines: ['🏃 その場で <b>あしぶみ</b> … はしる（あしが うつるように はなれてね）', '↔ からだを <b>よこに かたむける</b> … まがる', '⇆ <b>よこに ぴょんと とぶ</b> … むきを かえずに よこへ うごく', '🦘 <b>とびあがる</b> … ジャンプ', '👊 うでを <b>のばして はやく ふる・つきだす</b> … パンチ', '🔱 <b>りょうてを あわせる</b> … さすまたを もつ。ふると なぎはらう', '⭐ ひかりの はしらの 下に ほしが あるよ', '🚪 <b>ひかる わ</b>に 3びょう 立つ … べつの ゲームが はじまる'],
  onStart: async mode => {
    if (mode === 'cam'){ $('tip').textContent = TIP_CAM; await Body.countdown(5); }
    else { $('pad').style.display = 'flex'; $('tip').textContent = 'やじるし＋スペース、Q・E＝よこ、Z＝パンチ、X＝さすまた でも うごくよ'; }
    S.on = true; say(`ほしを ${stars.length}こ あつめよう！`, 3);
  }
});
window.__game = { S, CFG, tick, update, jump, punch, slash, strike, setSword, enemies, sword, fx, stars, solids, arms, legs, bodyG, logs, lift, lite, sun, POND, LANE, TOWER, GAMES, openNest, closeNest, get nest(){ return nest; }, placeStars, renderer, scene, camera, cry: () => { S.bumpT = S.t; } };
</script>
</body>
