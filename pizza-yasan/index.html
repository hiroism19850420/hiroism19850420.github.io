<script>
'use strict';
/* ================= 調整値 ================= */

  dur:90,
  win:{p:.05,g:.10,ok:.15},     // 判定幅（秒）
  touchExtra:.02,               // タッチは少し広げる
  green:[.55,.75],              // オーブンの緑ゾーン

/* ================= 基本 ================= */
const W=540,H=960;
const PZ={x:270,y:398,R:118};
const LANE_TOP=566,JUDGE=850,LW=180,FLOOR=550;

const TCOL={salami:'#ff4d3d',pepper:'#3fcf55',mushroom:'#c48a52'};
const TNAME={salami:'サラミ',pepper:'ピーマン',mushroom:'キノコ'};
const KEYS=['F','J','K'];
const FONT='"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';

const isTouchDev=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const vw=innerWidth,vh=innerHeight;
  scale=Math.min(vw/W,vh/H);
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);

addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
const now=()=>performance.now()/1000;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-Math.pow(1-clamp(t,0,1),3);
const back=t=>{t=clamp(t,0,1);const s=2.2;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const pick=a=>a[(Math.random()*a.length)|0];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,TAU)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);t=clamp(t,0,1);return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')'}
const yen=n=>Math.round(n).toLocaleString('ja-JP');
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

/* ================= 音（すべて合成・待ち時間なし） ================= */
let AC=null,master=null,NB=null,fire=null;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=8;comp.attack.value=.002;
    master=AC.createGain();master.gain.value=.8;master.connect(comp);comp.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    // iOS の解錠
    const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0);
  }catch(e){AC=null}
}
const at=(d)=>AC.currentTime+(d||0);
function osc(type,f,d,v,t0,f2,q){
  if(!AC)return;
  const t=at(t0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d*(q||1));
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0005,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
}
function nz(d,v,fc,type,t0,fc2,Q){
  if(!AC)return;
  const t=at(t0),s=AC.createBufferSource();s.buffer=NB;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(fc,t);if(Q)f.Q.value=Q;
  if(fc2)f.frequency.exponentialRampToValueAtTime(fc2,t+d);
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.05);
}
const kick=(t,v)=>{osc('sine',160,.16,v||.5,t,42,.6)};
const snare=(t,v)=>{nz(.14,(v||.3),1500,'highpass',t);osc('triangle',220,.08,(v||.3)*.5,t,140)};
const hat=(t,v)=>nz(.035,v||.08,8000,'highpass',t);
const clap=(t,v)=>{for(let i=0;i<3;i++)nz(.06,v||.22,1600,'bandpass',(t||0)+i*.011,null,1.2)};
const bell=(f,t,v,d)=>{osc('sine',f,d||.6,v||.12,t);osc('sine',f*2.76,(d||.6)*.5,(v||.12)*.35,t)};
const pluck=(f,t,v,d)=>{osc('triangle',f,d||.22,v||.16,t);osc('square',f*2,(d||.22)*.5,(v||.16)*.18,t)};
const crash=(t,v)=>{nz(1.4,v||.22,5000,'highpass',t)};
const PENTA=[0,2,4,7,9,12,14,16,19,21];
const semi=(base,s)=>base*Math.pow(2,s/12);
const SFX={
  tap(){hat(0,.12);osc('sine',1800,.04,.05)},
  hit(j,combo,mult){
    const shift=Math.round((mult-1)*4);
    const f=semi(523.25,PENTA[combo%PENTA.length]+shift);
    if(j==='PERFECT'){pluck(f,0,.22,.28);pluck(f*1.5,0,.12,.25);bell(f*2,0,.12,.5);clap(0,.2);kick(0,.45);nz(.25,.08,9000,'highpass',0);osc('sine',f*4,.15,.05,0,f*6)}
    else if(j==='GREAT'){pluck(f,0,.2,.22);clap(0,.16);kick(0,.3)}
    else{pluck(f*.5,0,.15,.18);hat(0,.14)}
    nz(.12,.1,600,'bandpass',.02,3000);
  },
  land(){osc('sine',520,.16,.22,0,150);kick(0,.25);nz(.05,.12,1200,'lowpass')},
  miss(){osc('sawtooth',420,.4,.12,0,80);nz(.2,.25,700,'lowpass',0);osc('square',150,.12,.06,.05,90)},
  splat(){nz(.18,.3,500,'lowpass',0,200);osc('sine',180,.15,.2,0,60)},
  pine(){osc('sine',500,.45,.18,0,1500,.5);setTimeout(()=>AC&&osc('sine',1500,.3,.15,0,400),220);osc('square',150,.12,.1,.05);osc('square',120,.18,.1,.2);SFX.land()},
  pineSkip(){nz(.2,.15,500,'bandpass',0,4000);bell(1568,.03,.1,.4);bell(2093,.09,.08,.4)},
  sauce(){nz(.3,.35,250,'lowpass',0,2400,3);osc('sine',180,.25,.3,0,620);kick(0,.4);osc('sine',90,.2,.2,.08,50)},
  cheese(){for(let i=0;i<8;i++)nz(.05,.14,6000,'highpass',i*.025);[1318,1568,1976,2637].forEach((f,i)=>bell(f,i*.04,.07,.35));kick(0,.3)},
  nope(){osc('square',110,.16,.16);osc('square',104,.16,.12,.02)},
  ovenOn(){nz(.6,.35,200,'lowpass',0,3500,2);osc('sawtooth',60,.5,.15,0,120);kick(0,.4)},
  tick(g){osc('square',300+g*900,.03,.05)},
  ding(){bell(1568,0,.2,1);bell(2093,.05,.15,1.2);crash(0,.1)},
  fanfare(){[523,659,784,1047,1319].forEach((f,i)=>{osc('sawtooth',f,.28,.07,i*.06);osc('square',f/2,.28,.04,i*.06)});crash(.3,.18)},
  raw(){osc('sine',300,.3,.2,0,150);osc('sine',150,.3,.15,.15,100)},
  burnt(){osc('sawtooth',90,.6,.2,0,40);nz(.6,.25,400,'lowpass',0,100);for(let i=0;i<3;i++)osc('square',1400,.08,.08,.2+i*.14)},
  register(){bell(2637,0,.18,.5);bell(3136,.06,.16,.6);nz(.06,.2,3000,'bandpass',0);nz(.04,.15,5000,'highpass',.12)},
  coins(n){for(let i=0;i<n;i++)bell(pick([1976,2349,2637,3136]),i*.045,.06,.25)},
  cheer(){nz(1.3,.0001,900,'bandpass');if(!AC)return;const t=at(),s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1100;f.Q.value=.7;const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.2);g.gain.exponentialRampToValueAtTime(.001,t+1.4);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+1.5);
    for(let i=0;i<10;i++)nz(.05,.12,3000,'highpass',.3+Math.random()*.9)},
  boo(){osc('sawtooth',220,.5,.1,0,160);osc('sawtooth',277,.5,.08,0,200);osc('sawtooth',110,.6,.08,.1,80)},
  angry(){osc('square',98,.35,.2);osc('square',92,.35,.18,.02);kick(0,.6);kick(.15,.6);nz(.3,.2,300,'lowpass')},
  door(){bell(1318,0,.12,.5);bell(1046,.18,.12,.6)},
  multUp(m){osc('sine',400,.35,.14,0,1600+m*300);[0,4,7,12].forEach((s,i)=>pluck(semi(660,s+(m-1)*4),i*.05,.12,.3))},
  combo(){[0,4,7,12,16].forEach((s,i)=>bell(semi(784,s),i*.05,.12,.4));crash(0,.15)},
  siren(){for(let i=0;i<3;i++){osc('sine',600,.35,.12,i*.4,1100);osc('sine',1100,.35,.12,i*.4+.2,600)}[262,330,392].forEach(f=>osc('sawtooth',f,.6,.07,0))},
  beep(hi){osc('square',hi?1320:880,hi?.5:.15,.14);if(hi){[523,659,784,1047].forEach(f=>osc('sawtooth',f,.6,.06));crash(0,.25);kick(0,.6)}},
  wood(p){osc('sine',800+p*60,.06,.2);osc('square',1600+p*120,.02,.05)},
  gong(){osc('sine',110,2.5,.3);osc('sine',165,2,.15);osc('sine',247,1.5,.1);crash(0,.35);kick(0,.7)},
  whoosh(){nz(.25,.18,400,'bandpass',0,5000,2)},
  firework(d){nz(.5,.2,1500,'lowpass',d||0,200);for(let i=0;i<6;i++)nz(.04,.08,6000,'highpass',(d||0)+.1+Math.random()*.4)},
  record(){[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>{osc('sawtooth',f,.3,.08,i*.09);bell(f*2,i*.09,.05,.3)});crash(.7,.3)},
  count(){osc('square',2200+Math.random()*400,.02,.03)},
};
function fireStart(){
  if(!AC||fire)return;
  const s=AC.createBufferSource();s.buffer=NB;s.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  const g=AC.createGain();g.gain.setValueAtTime(0,at());g.gain.linearRampToValueAtTime(.18,at(.2));
  s.connect(f);f.connect(g);g.connect(master);s.start();fire={s,g};
}
function fireStop(){
  if(!fire||!AC)return;const {s,g}=fire;fire=null;
  g.gain.cancelScheduledValues(at());g.gain.setValueAtTime(g.gain.value,at());g.gain.linearRampToValueAtTime(0,at(.15));s.stop(at(.2));
}
/* BGM（譜面とは同期しない。にぎやかし） */
let bNext=0,bStep=0;
const BASS=[[48,48,55,48],[53,53,60,53],[55,55,62,55],[57,57,64,52]];
function bgm(){
  if(!AC||S.mode!=='play'&&S.mode!=='count')return;
  const bpm=S.rush?158:S.el>30?132:118,st=60/bpm/4;
  if(bNext<AC.currentTime)bNext=AC.currentTime+.05;
  while(bNext<AC.currentTime+.15){
    const d=bNext-AC.currentTime,k=bStep%16,bar=Math.floor(bStep/16)%4;
    if(k%4===0)kick(d,.32);
    if(S.rush&&(k===10||k===14))kick(d,.25);
    if(k===4||k===12)snare(d,.14);
    if(k%2===0)hat(d,.035);else if(S.rush)hat(d,.025);
    if(k===0||k===3||k===6||k===8||k===11||k===14){const n=BASS[bar][(k>>2)%4];osc('triangle',440*Math.pow(2,(n-12-69)/12),.18,.11,d)}
    if(S.rush&&k%4===2)osc('square',880,.05,.03,d);
    if(k===0&&bar===0)crash(d,.04);
    bNext+=st;bStep++;
  }
}

/* ================= 状態 ================= */
const S={mode:'title',t0:0,el:0,queue:[],P:null,step:'wait',notes:[],fly:[],parts:[],floor:[],
  sales:0,shownSales:0,mult:1,combo:0,noteCombo:0,maxCombo:0,stats:[],angry:0,rush:false,
  shake:0,flash:null,punch:0,laneGlow:[0,0,0],judge:[null,null,null],banner:null,lastSpawn:-9,lastSec:-1,
  out:null,best:0,bestPizza:null,bestSat:-1,pendingServe:0,ovenStart:0,lastTick:0,closeAt:0,endT:0,newRecord:false,
  bot:false,bgPizzas:[],cStart:0,cBeep:-1,pressHint:0,countSnd:0};
try{S.best=+localStorage.getItem('rpz_best')||0}catch(e){}
for(let i=0;i<10;i++)S.bgPizzas.push({x:rnd(0,W),y:rnd(0,H),r:rnd(18,40),v:rnd(8,26),rot:rnd(0,TAU),vr:rnd(-.6,.6)});

/* ================= お客さん ================= */
function spawnCustomer(T){
  const r=Math.random(),type=r<.33?'gourmet':r<.7?'salary':'kid';
  const el=S.el;
  let total,ntypes,pines;
  if(el<30){total=ri(3,4);ntypes=2;pines=el<10?0:ri(0,1)}
  else if(el<60){total=ri(4,6);ntypes=ri(2,3);pines=1}
  else{total=ri(5,8);ntypes=3;pines=ri(1,2)}
  if(S.rush)pines=2;
  const ts=shuffle(TYPES.slice()).slice(0,ntypes),order={salami:0,pepper:0,mushroom:0};
  ts.forEach(t=>order[t]=1);
  for(let i=ntypes;i<total;i++)order[pick(ts)]++;
  const c={type,order,pines,born:T,pat:CTYPES[type].pat,x:W+60,y:150,s:.6,id:Math.random(),bob:Math.random()*9};
  S.queue.push(c);S.lastSpawn=T;
  SFX.door();
  burst(W-30,150,12,['#fff','#ffe066','#ff9ad5'],260,'confetti');
}
function queueTarget(){
  if(S.rush)return 5;
  if(S.el<30)return 1;
  if(S.el<50)return 2;
  return 3;
}
function custPos(i){return i===0?{x:92,y:156,s:1}:{x:300+(i-1)*58,y:132,s:.62}}

/* ================= ピザ ================= */
function newPizza(c,T){
  const left={...c.order},list=[];
  let k=0;
  while(list.length<c.order.salami+c.order.pepper+c.order.mushroom){const t=TYPES[k%3];if(left[t]>0){list.push(t);left[t]--}k++}
  const n=list.length,outer=Math.min(n,7),inner=n-outer,slots=[];
  for(let i=0;i<outer;i++){const a=-Math.PI/2+i/outer*TAU;slots.push({x:Math.cos(a)*74,y:Math.sin(a)*74})}
  for(let i=0;i<inner;i++){const a=-Math.PI/2+(i+.5)/inner*TAU,r=inner===1?0:30;slots.push({x:Math.cos(a)*r,y:Math.sin(a)*r})}
  slots.forEach((s,i)=>{s.type=list[i];s.state='empty'});
  return {c,slots,items:[],pines:[],sauce:-1,cheese:-1,g:0,baking:false,baked:false,bounce:-9,born:T,scores:[],bakeScore:0,
    spots:Array.from({length:20},()=>{const a=rnd(0,TAU),r=Math.sqrt(Math.random())*95;return {x:Math.cos(a)*r,y:Math.sin(a)*r,r:rnd(4,11)}}),
    wob:Array.from({length:36},()=>rnd(-1,1)*.018)};
}
function beginPizza(T){
  const c=S.queue[0];if(!c)return;
  S.P=newPizza(c,T);S.step='sauce';S.notes=[];S.fly=[];
  SFX.whoosh();
}
function makeChart(T){
  const P=S.P,c=P.c,ql=S.queue.length;
  let iv=Math.max(.26,TUNE.interval-.035*(ql-1))*(S.rush?.85:1);
  const travel=S.rush?.95:Math.max(.98,TUNE.travel-.03*(ql-1));
  const items=shuffle(P.slots.map((s,i)=>({slot:i,type:s.type})));
  for(let i=0;i<c.pines;i++)items.splice(ri(1,items.length),0,{pine:true});
  let t=T+travel+.12;
  const notes=[];
  for(let i=0;i<items.length;i++){
    const it=items[i];
    const lane=it.pine?ri(0,2):TYPES.indexOf(it.type);
    notes.push({lane,t,slot:it.slot,type:it.type,pine:!!it.pine,done:false,travel});
    const nx=items[i+1];
    const dbl=nx&&S.el>40&&Math.random()<.22&&!nx.pine&&!it.pine&&nx.type!==it.type;
    if(!dbl)t+=iv;
  }
  S.notes=notes;
}

/* ================= 演出の道具 ================= */
function addP(p){if(S.parts.length<900)S.parts.push(p)}
function burst(x,y,n,cols,sp,kind,opt){
  for(let i=0;i<n;i++){
    const a=rnd(0,TAU),v=rnd(sp*.3,sp);
    addP(Object.assign({k:kind||'dot',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(kind==='confetti'?sp*.4:0),life:0,max:rnd(.4,.9),s:rnd(3,7),col:pick(cols),rot:rnd(0,TAU),vr:rnd(-12,12),g:kind==='confetti'?700:kind==='spark'?0:300},opt||{}));
  }
}
function ring(x,y,col,r1,dur,w){addP({k:'ring',x,y,col,r:r1||80,life:0,max:dur||.35,w:w||6})}
function popText(x,y,text,col,size,dur,opt){addP(Object.assign({k:'text',x,y,text,col,size,life:0,max:dur||.5,vy:-40},opt||{}))}
function shake(v){S.shake=Math.max(S.shake,v)}
function flash(col,a){S.flash={col,a:a||.5}}
function banner(text,col,sub){S.banner={text,col,sub,t:now()}}
function firework(x,y,d){
  setTimeout(()=>{
    const cols=pick([['#ff4d6d','#ffd166','#fff'],['#4dd2ff','#b388ff','#fff'],['#7dff7a','#ffe066','#fff'],['#ff9f1c','#ff4d3d','#ffe066']]);
    burst(x,y,46,cols,420,'spark',{g:120,max:.9});
    ring(x,y,cols[0],140,.45,5);SFX.firework();
  },d*1000);
}
function coinsTo(x,y,n){

function evTime(e){
  const t=e&&e.timeStamp;
  const n=performance.now();
  if(t&&t>0&&t<=n+5&&n-t<300)return t/1000;
  return n/1000;
}
function toLocal(e){return {x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale}}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  const p=toLocal(e),T=evTime(e),touch=e.pointerType!=='mouse';
  tapFx(p.x,p.y);
  if(S.mode==='title'){startCount();return}
  if(S.mode==='end'){if(now()-S.endT>.8&&p.y>860)startCount();return}
  if(S.mode!=='play')return;
  if(p.y<LANE_TOP){return}
  if(S.step==='sauce'||S.step==='cheese'){act(p.x<W/2?'sauce':'cheese',T);return}
  if(S.step==='top'){press(clamp(Math.floor(p.x/LW),0,2),T,touch);return}
  if(S.step==='oven'){act('oven',T);return}
},{passive:false});
['touchstart','touchmove','gesturestart','dblclick','contextmenu'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase(),T=evTime(e);
  initAudio();
  if([' ','f','j','k','1','2','enter','r'].includes(k))e.preventDefault();
  if(S.mode==='title'){if(k===' '||k==='enter'){startCount()}return}
  if(S.mode==='end'){if((k===' '||k==='enter'||k==='r')&&now()-S.endT>.8)startCount();return}
  if(S.mode!=='play')return;
  if(k==='1')act('sauce',T);
  else if(k==='2')act('cheese',T);
  else if(k==='f')press(0,T,false);
  else if(k==='j')press(1,T,false);
  else if(k==='k')press(2,T,false);
  else if(k===' ')act('oven',T);
});

function press(lane,T,touch){
  const ext=touch?TUNE.touchExtra:0;
  let best=null,bd=1e9;
  for(const n of S.notes){if(n.done||n.lane!==lane)continue;const d=Math.abs(T-n.t);if(d<bd){bd=d;best=n}}
  S.laneGlow[lane]=1;
  if(!best||bd>TUNE.win.ok+ext){osc('triangle',300+lane*80,.06,.06);return}
  best.done=true;
  const lx=lane*LW+LW/2;
  if(best.pine){ // おとりを押してしまった
    S.noteCombo=0;
    SFX.pine();shake(14);flash('#ffd23f',.35);
    const a=rnd(0,TAU),r=rnd(10,80);
    S.fly.push({pine:true,x0:lx,y0:JUDGE,x1:PZ.x+Math.cos(a)*r,y1:PZ.y+Math.sin(a)*r,t0:T,dur:.32,rot:rnd(0,TAU)});

  }
  const j=bd<=TUNE.win.p+ext?'PERFECT':bd<=TUNE.win.g+ext?'GREAT':'GOOD';
  S.noteCombo++;S.maxNote=Math.max(S.maxNote||0,S.noteCombo);
  const P=S.P,sl=P.slots[best.slot];

  const tx=sl.x+dx/dl*off+rnd(-2,2)*(off?1:0),ty=sl.y+dy/dl*off;
  sl.state='coming';
  S.fly.push({type:best.type,slot:best.slot,j,x0:lx,y0:JUDGE,x1:PZ.x+tx,y1:PZ.y+ty,t0:T,dur:.24,rot:rnd(-.5,.5)});
  P.scores.push(j==='PERFECT'?100:j==='GREAT'?80:60);

    showJudge(lane,'PERFECT','rainbow');

    shake(6+S.mult*2);S.punch=Math.max(S.punch,.025);
  }else if(j==='GREAT'){
    showJudge(lane,'GREAT','#4dd2ff');
    burst(lx,JUDGE,18,[col,'#fff'],380,'spark');ring(lx,JUDGE,col,80,.25,5);shake(4);
  }else{
    showJudge(lane,'GOOD','#7dff7a');burst(lx,JUDGE,10,[col,'#fff'],260,'dot');ring(lx,JUDGE,col,60,.2,4);
  }
  if(S.noteCombo>0&&S.noteCombo%10===0){
    SFX.combo();banner(S.noteCombo+' COMBO!!','#ff4dd2');
    firework(rnd(100,440),rnd(600,760),0);firework(rnd(100,440),rnd(600,760),.15);
  }
}

function takeOut(g,T){
  const P=S.P;P.baking=false;P.baked=true;P.g=g;fireStop();

  if(g>=lo&&g<=hi){
    SFX.ding();SFX.fanfare();flash('#fff',.5);shake(10);

function serve(T){
  const P=S.P,c=P.c,ct=CTYPES[c.type];
  const sc=P.scores;
  let plate=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:0;
  plate=clamp(plate-20*P.pines.length,0,100);
  const ratio=(T-c.born)/c.pat;
  const speed=clamp(100-Math.max(0,ratio-.2)*125,0,100);
  const sat=Math.round(plate*ct.w[0]+P.bakeScore*ct.w[1]+speed*ct.w[2]);
  let rating=sat>=80?'great':sat>=50?'ok':'bad';
  const before=S.mult;
  if(rating==='great'){S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo)}
  else S.combo=0;
  const money=TUNE.price+Math.round(sat*TUNE.tipPer*S.mult/10)*10;
  if(rating==='great')S.mult=Math.min(TUNE.multMax,S.mult+TUNE.multStep);
  else if(rating==='bad')S.mult=1;

  addP({k:'verdict',x:pos.x+70,y:pos.y-20,sat,money,emo:rating==='great'?'😍':rating==='ok'?'🙂':'😞',life:0,max:1.1,rating});
  SFX.register();

    SFX.cheer();SFX.coins(8);flash('#ffd700',.4);shake(14);S.punch=.06;
    firework(120,180,0);firework(420,140,.12);firework(270,260,.25);
    for(let i=0;i<80;i++)addP({k:'confetti',x:rnd(0,W),y:rnd(-200,-10),vx:rnd(-60,60),vy:rnd(100,300),life:0,max:rnd(1.2,2),s:rnd(5,9),col:pick(['#ff4d6d','#ffd166','#06d6a0','#118ab2','#ff9ad5','#fff']),rot:rnd(0,TAU),vr:rnd(-10,10),g:200});

    if(S.mult>before){setTimeout(()=>{SFX.multUp(S.mult);banner('チップ ×'+S.mult.toFixed(1)+'!!','#ffd700',S.mult>=TUNE.multMax?'行列のできる店！':'')},250)}
  }else if(rating==='ok'){SFX.coins(4);coinsTo(pos.x,pos.y,6);burst(pos.x,pos.y,20,['#ffe066','#fff'],300,'star')}
  else{SFX.boo();addP({k:'cloud',x:pos.x,y:pos.y-80,life:0,max:1.2});if(before>1)popText(W/2,70,'倍率リセット…','#aaa',30,.8,{stroke:'#333'})}
  c.leaving={t:T,happy:rating!=='bad',emo:rating==='great'?'😍':rating==='ok'?'🙂':'😞'};
  S.leavers=(S.leavers||[]).concat([c]);
  S.queue.shift();
  S.out={P,t0:T,kind:'serve'};
  S.P=null;S.step='wait';S.notes=[];S.fly=[];
  if(S.queue.length)beginPizza(T);
}
function angryLeave(c,T){

/* ================= 進行 ================= */
function startCount(){
  S.mode='count';S.cStart=now();S.cBeep=-1;
  S.queue=[];S.P=null;S.step='wait';S.notes=[];S.fly=[];S.floor=[];S.leavers=[];S.out=null;
  S.sales=0;S.shownSales=0;S.mult=1;S.combo=0;S.noteCombo=0;S.maxCombo=0;S.maxNote=0;S.stats=[];S.angry=0;S.rush=false;
  S.bestPizza=null;S.bestSat=-1;S.lastSec=-1;S.newRecord=false;S.el=0;S.banner=null;
}
function startPlay(T){S.mode='play';S.t0=T;S.el=0;S.lastSpawn=-9;spawnCustomer(T);beginPizza(T)}
function closeShop(T){
  S.mode='closing';S.closeAt=T;fireStop();
  SFX.gong();shake(20);flash('#fff',.6);
  for(let i=0;i<120;i++)addP({k:'confetti',x:rnd(0,W),y:rnd(-300,-10),vx:rnd(-60,60),vy:rnd(100,300),life:0,max:rnd(1.5,2.5),s:rnd(5,9),col:pick(['#ff4d6d','#ffd166','#06d6a0','#118ab2','#ff9ad5','#fff']),rot:rnd(0,TAU),vr:rnd(-10,10),g:200});
  if(S.sales>S.best){S.newRecord=true;S.best=S.sales;try{localStorage.setItem('rpz_best',S.sales)}catch(e){}}
}
function update(){
  const T=now(),dt=Math.min(.05,T-(S.lastT||T));S.lastT=T;
  bgm();
  if(S.mode==='count'){
    const k=Math.floor((T-S.cStart)/.6);
    if(k!==S.cBeep&&k<=3){S.cBeep=k;SFX.beep(k===3);shake(k===3?14:6);if(k===3){flash('#fff',.5);burst(W/2,H/2,80,['#ff4d6d','#ffd166','#06d6a0','#4dd2ff','#fff'],700,'confetti')}}
    if(T-S.cStart>=2.1)startPlay(T);
  }
  if(S.mode==='play'){
    S.el=T-S.t0;
    if(S.el>=TUNE.dur){closeShop(T)}
    else{
      if(!S.rush&&S.el>=TUNE.dur-15){S.rush=true;SFX.siren();banner('ランチラッシュ!!','#ff3d3d','お客さんが どっと来た！');shake(20);flash('#ff3d3d',.5)}
      const sec=Math.ceil(TUNE.dur-S.el);
      if(sec<=10&&sec!==S.lastSec){S.lastSec=sec;SFX.wood(10-sec);S.secPop=T}
      const gap=S.rush?.8:S.el<30?.7:2.6;
      const fresh=S.el<30?S.queue.length===0:true;
      if(S.queue.length<queueTarget()&&T-S.lastSpawn>gap&&fresh)spawnCustomer(T);
      for(const c of S.queue.slice()){if(T-c.born>c.pat)angryLeave(c,T)}
      if(!S.P&&S.queue.length)beginPizza(T);
      if(S.step==='top'){
        const ext=TUNE.touchExtra;
        for(const n of S.notes)if(!n.done&&T>n.t+TUNE.win.ok+ext)missNote(n,T);
        if(S.notes.length&&S.notes.every(n=>n.done)&&S.fly.length===0){S.step='oven'}
      }
      if(S.step==='oven'&&S.P&&S.P.baking){
        const g=(T-S.ovenStart)/bakeTime();S.P.g=clamp(g,0,1);
        if(T-S.lastTick>.07){S.lastTick=T;SFX.tick(S.P.g)}
        if(Math.random()<.6)addP({k:'flame',x:PZ.x+rnd(-PZ.R,PZ.R),y:PZ.y+PZ.R*.6+rnd(-20,20),vx:rnd(-20,20),vy:rnd(-260,-120),life:0,max:rnd(.3,.6),s:rnd(10,22),col:pick(['#ff6a00','#ffd000','#ff3d00']),g:0});
        if(g>=1)takeOut(1,T);
      }
      if(S.step==='done'&&T>=S.pendingServe)serve(T);
    }
  }
  if(S.mode==='closing'&&T-S.closeAt>1.4){S.mode='end';S.endT=T;if(S.newRecord){SFX.record();for(let i=0;i<6;i++)firework(rnd(80,460),rnd(100,400),i*.2)}}
  if(S.mode==='end'&&S.shownSales<S.sales&&T-S.countSnd>.05){S.countSnd=T;SFX.count()}
  // 飛んでいる具材
  for(const f of S.fly){
    if(f.arrived)continue;
    if(T>=f.t0+f.dur){
      f.arrived=true;
      const P=S.P;if(!P)continue;
      if(f.pine){P.pines.push({x:f.x1-PZ.x,y:f.y1-PZ.y,rot:f.rot,land:T});P.bounce=T;SFX.land();
        burst(f.x1,f.y1,16,['#ffd23f','#fff'],250,'dot');popText(f.x1,f.y1-30,'ドーン','#ffd23f',34,.45,{stroke:'#7a5a00'})}
      else if(f.miss){
        addP({k:'fall',type:f.type,x:f.x1,y:f.y1,vx:Math.cos(f.a)*rnd(80,200),vy:-rnd(150,280),life:0,max:4,rot:f.rot,vr:rnd(-12,12),g:1600,bounced:0});
        popText(f.x1,f.y1-20,'ポロッ','#fff',28,.45,{stroke:'#555'});
      }else{
        P.items.push({type:f.type,x:f.x1-PZ.x,y:f.y1-PZ.y,rot:f.rot,land:T,j:f.j});
        P.slots[f.slot].state='filled';
        P.bounce=T;SFX.land();
        burst(f.x1,f.y1,f.j==='PERFECT'?16:8,[TCOL[f.type],'#fff'],f.j==='PERFECT'?300:180,'dot');
        if(f.j==='PERFECT'){ring(f.x1,f.y1,'#fff',40,.25,4);popText(f.x1,f.y1-24,'ピタッ！','#fff',24,.4,{stroke:TCOL[f.type]})}
      }
    }
  }
  S.fly=S.fly.filter(f=>!f.arrived);
  // パーティクル
  for(const p of S.parts){
    p.life+=dt;
    if(p.life<0)continue;
    if(p.k==='coin'){continue}
    if(p.vx!==undefined){p.x+=p.vx*dt;p.y+=p.vy*dt}
    if(p.g)p.vy+=p.g*dt;
    if(p.vr)p.rot+=p.vr*dt;
    if(p.k==='spark'||p.k==='star'){p.vx*=.93;p.vy*=.93}
    if(p.k==='fall'&&p.y>FLOOR&&p.vy>0){
      p.y=FLOOR;
      if(p.bounced<2){p.vy*=-.35;p.vx*=.5;p.bounced++;if(p.bounced===1){SFX.splat();shake(5);burst(p.x,p.y,8,[TCOL[p.type],'#fff'],160,'dot')}}
      else{p.vy=0;p.vx=0;p.vr=0;p.g=0}
    }
  }
  S.parts=S.parts.filter(p=>p.life<p.max);
  S.shake*=Math.pow(.0009,dt);S.punch*=Math.pow(.001,dt);
  if(S.flash){S.flash.a-=dt*2.2;if(S.flash.a<=0)S.flash=null}
  for(let i=0;i<3;i++)S.laneGlow[i]=Math.max(0,S.laneGlow[i]-dt*4);
  // 売上表示を数える
  if(S.shownSales<S.sales)S.shownSales=Math.min(S.sales,S.shownSales+Math.max(30,(S.sales-S.shownSales)*dt*(S.mode==='end'?2.2:8)));
  // お客さんの位置
  S.queue.forEach((c,i)=>{const p=custPos(i);c.x=lerp(c.x,p.x,1-Math.pow(.0005,dt));c.y=lerp(c.y,p.y,1-Math.pow(.0005,dt));c.s=lerp(c.s,p.s,1-Math.pow(.001,dt))});
  if(S.leavers)S.leavers=S.leavers.filter(c=>T-c.leaving.t<1);
  for(const b of S.bgPizzas){b.y-=b.v*dt*(S.rush?3:1);b.rot+=b.vr*dt;if(b.y<-50){b.y=H+50;b.x=rnd(0,W)}}
  if(S.bot)botDrive(T);
}

function bakeCol(g){
  if(g<.55)return mix('#f6e0ac','#eab567',g/.55);
  if(g<=.75)return mix('#eab567','#d48a3a',(g-.55)/.2);
  return mix('#d48a3a','#3a2210',(g-.75)/.25);
}
function drawPizza(c,P,T,still){
  const R=PZ.R,g=P.g;
  let s=1;
  if(!still){const b=T-P.bounce;if(b<.5)s=1+.08*Math.exp(-b*9)*Math.cos(b*32)}
  c.save();c.scale(s,s);
  // 生地
  c.beginPath();
  for(let i=0;i<=36;i++){const a=i/36*TAU,r=R*(1+P.wob[i%36]);i?c.lineTo(Math.cos(a)*r,Math.sin(a)*r):c.moveTo(Math.cos(a)*r,Math.sin(a)*r)}
  c.closePath();
  const dg=c.createRadialGradient(-30,-40,10,0,0,R);dg.addColorStop(0,bakeCol(g*.85));dg.addColorStop(1,bakeCol(Math.min(1,g*1.1+.05)));
  c.fillStyle=dg;c.fill();c.lineWidth=3;c.strokeStyle=g>.8?'#2a1608':'#a8692a';c.stroke();
  c.globalAlpha=.5;c.strokeStyle='#fff3d0';c.lineWidth=6;c.beginPath();c.arc(0,0,R-9,Math.PI*1.1,Math.PI*1.6);c.stroke();c.globalAlpha=1;
  // ソース
  if(P.sauce>0){
    const k=still?1:back((T-P.sauce)/.25);
    c.beginPath();c.arc(0,0,(R-16)*k,0,TAU);c.fillStyle=g>.8?mix('#c8301e','#401008',(g-.8)/.2):'#d8392a';c.fill();
    c.fillStyle='rgba(255,120,90,.35)';for(let i=0;i<6;i++){circ(c,Math.cos(i*1.3)*60*k,Math.sin(i*1.9)*50*k,6);c.fill()}
  }
  // チーズ
  if(P.cheese>0){
    const k=still?1:back((T-P.cheese)/.3);
    c.save();c.scale(k,k);
    c.beginPath();
    for(let i=0;i<=24;i++){const a=i/24*TAU,r=(R-24)*(1+.05*Math.sin(i*2.7));i?c.lineTo(Math.cos(a)*r,Math.sin(a)*r):c.moveTo(Math.cos(a)*r,Math.sin(a)*r)}
    c.closePath();
    c.fillStyle=g>.8?mix('#f2c35a','#3a2410',(g-.8)/.2):mix('#fff0b0','#f6c858',clamp(g/.65,0,1));c.fill();
    if(g>.3)for(const sp of P.spots){c.fillStyle='rgba(190,100,30,'+clamp((g-.3)*.8,0,.6)+')';circ(c,sp.x,sp.y,sp.r);c.fill()}
    c.restore();
  }
  // 穴（取り逃し）
  for(const sl of P.slots){if(sl.state==='hole'){c.save();c.setLineDash([4,4]);c.strokeStyle='rgba(90,40,10,.6)';c.lineWidth=2.5;circ(c,sl.x,sl.y,14);c.stroke();c.restore()}}
  // 具
  for(const it of P.items){
    c.save();c.translate(it.x,it.y);c.rotate(it.rot);
    const k=still?1:clamp((T-it.land)/.18,0,1);
    const sc=1+(1-k)*.5;
    c.fillStyle='rgba(60,25,5,.2)';c.beginPath();c.ellipse(2,3,14,11,0,0,TAU);c.fill();
    drawTop(c,it.type,sc*1.05);
    if(g>.8){c.globalAlpha=(g-.8)*3;c.fillStyle='#2a1608';circ(c,0,0,13);c.fill();c.globalAlpha=1}
    c.restore();
  }
  for(const p of P.pines){c.save();c.translate(p.x,p.y);c.rotate(p.rot);drawPineChunk(c,1.2);c.restore()}
  c.restore();
}

function drawLanes(c,T){
  for(let i=0;i<3;i++){

    const g=c.createLinearGradient(0,LANE_TOP,0,H);
    g.addColorStop(0,'rgba(0,0,0,.25)');g.addColorStop(1,col+'55');
    c.fillStyle=g;c.fillRect(x+3,LANE_TOP,LW-6,H-LANE_TOP);
    if(S.laneGlow[i]>0){

      c.fillStyle=bg;c.fillRect(x+3,LANE_TOP,LW-6,H-LANE_TOP);
      c.fillStyle=col;c.globalAlpha=a*.6;c.fillRect(x+3,LANE_TOP,LW-6,H-LANE_TOP);c.globalAlpha=1;
    }
    c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=2;c.strokeRect(x+3,LANE_TOP,LW-6,H-LANE_TOP);
  }
  // 判定ライン

  c.fillStyle='rgba(255,255,255,'+(.6+.3*pulse)+')';c.fillRect(0,JUDGE-3,W,6);
  for(let i=0;i<3;i++){
    const x=i*LW+LW/2;
    circ(c,x,JUDGE,40);c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=4;c.stroke();

    c.fillStyle='#fff';c.font='15px '+FONT;c.textAlign='left';c.textBaseline='middle';c.fillText(TNAME[TYPES[i]],x-6,916);
    if(!isTouchDev){rr(c,x+8,928,34,26,6);c.fillStyle='rgba(255,255,255,.85)';c.fill();c.fillStyle='#333';c.textAlign='center';c.fillText(KEYS[i],x+25,942)}
  }
  // ノーツ
  for(const n of S.notes){
    if(n.done)continue;
    const k=1-(n.t-T)/n.travel;
    if(k<0)continue;
    const y=LANE_TOP+(JUDGE-LANE_TOP)*k,x=n.lane*LW+LW/2;

      const col=TCOL[n.type];

      circ(c,0,0,36);c.fillStyle=col;c.fill();c.shadowBlur=0;
      circ(c,0,0,30);c.fillStyle='#fff5e0';c.fill();
      drawTop(c,n.type,1.55);
    }
    c.restore();
    // しっぽ
    if(!n.pine){c.fillStyle=TCOL[n.type]+'33';c.fillRect(x-14,y-80,28,44)}
  }
  // 判定文字

    c.fillText(j.text,0,0);
    c.restore();
  }
  if(S.noteCombo>=3){

    c.restore();
  }
}

    c.shadowColor='#fff';c.shadowBlur=20;c.fillStyle='#fff';rr(c,px-6,gy-14,12,gh+28,6);c.fill();c.shadowBlur=0;
    if(P&&P.baking)burst(px,gy+gh/2,1,['#fff','#ffe066'],140,'spark',{max:.25});
    c.restore();
    const baking=P&&P.baking;
    bigButton(c,70,740,400,180,baking?'とりだす！':'やく！',baking?'みどりで おす':'オーブンへ',  'Space',baking?['#ff9a3a','#d84a10']:['#ff6a50','#b81a10'],st==='oven',T);
    if(!baking&&st==='oven'){const b=Math.abs(Math.sin(T*6))*14;c.font='54px serif';c.textAlign='center';c.fillText('👇',270,722-b)}
  }else if(st==='wait'){
    c.fillStyle='rgba(255,255,255,.6)';c.font='28px '+FONT;c.textAlign='center';c.textBaseline='middle';c.fillText('お客さん まち…',W/2,760);
  }
}
function drawOvenFx(c,T){
  const P=S.P;if(!P||!P.baking)return;
  const a=.35+.15*Math.sin(T*20);
  const rg=c.createRadialGradient(PZ.x,PZ.y,PZ.R*.6,PZ.x,PZ.y,PZ.R*2);
  rg.addColorStop(0,'rgba(255,120,0,0)');rg.addColorStop(.5,'rgba(255,120,0,'+a+')');rg.addColorStop(1,'rgba(255,60,0,0)');
  c.fillStyle=rg;c.fillRect(0,PZ.y-PZ.R*2,W,PZ.R*4);
}
function drawParts(c,T,layer){
  for(const p of S.parts){
    if(p.life<0)continue;
    const k=p.life/p.max;
    if(layer==='top'?!(p.k==='text'||p.k==='verdict'||p.k==='coin'||p.k==='cloud'):(p.k==='text'||p.k==='verdict'||p.k==='coin'||p.k==='cloud'))continue;
    c.save();
    switch(p.k){
      case 'dot':c.globalAlpha=1-k;c.fillStyle=p.col;circ(c,p.x,p.y,p.s*(1-k*.5));c.fill();break;
      case 'drop':c.globalAlpha=1-k*k;c.fillStyle=p.col;circ(c,p.x,p.y,p.s);c.fill();break;
      case 'spark':c.globalAlpha=1-k;c.strokeStyle=p.col;c.lineWidth=p.s*.6;c.lineCap='round';c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);c.stroke();break;
      case 'star':{c.globalAlpha=1-k;c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;const r=p.s*1.6;c.beginPath();for(let i=0;i<10;i++){const rr2=i%2?r*.45:r,a=i/10*TAU;c.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}c.closePath();c.fill();break}
      case 'confetti':c.globalAlpha=k>.8?(1-k)*5:1;c.translate(p.x,p.y);c.rotate(p.rot);c.scale(1,Math.cos(p.life*8));c.fillStyle=p.col;c.fillRect(-p.s/2,-p.s,p.s,p.s*2);break;
      case 'shred':c.globalAlpha=1-k*.3;c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.col;rr(c,-p.s/2,-2,p.s,4,2);c.fill();break;
      case 'ring':c.globalAlpha=1-k;c.strokeStyle=p.col;c.lineWidth=p.w*(1-k)+1;circ(c,p.x,p.y,p.r*ease(k));c.stroke();break;
      case 'flame':c.globalAlpha=(1-k)*.85;c.fillStyle=p.col;circ(c,p.x,p.y,p.s*(1-k*.7));c.fill();break;
      case 'smoke':c.globalAlpha=(1-k)*.45;c.fillStyle=p.col||'#333';circ(c,p.x,p.y,p.s*(1+k));c.fill();break;
      case 'fall':c.globalAlpha=k>.8?(1-k)*5:1;c.translate(p.x,p.y);c.rotate(p.rot);drawTop(c,p.type,1.2);break;
      case 'pineaway':c.globalAlpha=1-k;c.translate(p.x,p.y);c.rotate(p.rot);drawPineWhole(c,1.1);break;
      case 'text':{
        const s=k<.15?lerp(1.8,1,k/.15):1;
        c.globalAlpha=k>.7?(1-k)/.3:1;c.translate(p.x,p.y+p.vy*p.life);c.rotate(p.rot||0);c.scale(s,s);
        c.font=p.size+'px '+FONT;c.textAlign='center';c.textBaseline='middle';
        if(p.stroke){c.lineWidth=p.size*.2;c.strokeStyle=p.stroke;c.lineJoin='round';c.strokeText(p.text,0,0)}
        c.fillStyle=p.col;c.fillText(p.text,0,0);break}
      case 'verdict':{
        const s=k<.18?back(k/.18)*1.3:1.3-Math.min(.3,(k-.18)*.6);
        c.globalAlpha=k>.8?(1-k)*5:1;c.translate(p.x,p.y-k*30);c.scale(s,s);
        rr(c,-120,-58,240,116,24);c.fillStyle=p.rating==='great'?'rgba(255,80,140,.95)':p.rating==='ok'?'rgba(255,170,40,.95)':'rgba(90,90,110,.95)';c.fill();
        c.strokeStyle='#fff';c.lineWidth=5;c.stroke();
        c.font='46px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(p.emo,-80,-6);
        c.fillStyle='#fff';c.font='16px '+FONT;c.fillText('満足度',25,-36);
        c.font='40px '+FONT;c.fillText(p.sat+'%',25,-4);
        c.fillStyle='#ffe066';c.font='24px '+FONT;c.fillText('+'+yen(p.money)+'円',25,34);
        if(p.rating==='great'){c.fillStyle='#fff';c.font='18px '+FONT;c.fillText('大満足！',0,-74)}
        break}
      case 'coin':{
        const q=ease(k);const x=lerp(p.x,p.tx,q),y=lerp(p.y,p.ty,q)-Math.sin(q*Math.PI)*120;
        c.translate(x,y);c.scale(Math.cos(p.life*16),1);circ(c,0,0,p.s);c.fillStyle='#ffd700';c.fill();c.strokeStyle='#b8860b';c.lineWidth=2;c.stroke();
        c.fillStyle='#b8860b';c.font='bold 11px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('¥',0,1);
        if(k>.95&&!p.dinged){p.dinged=true;if(Math.random()<.4)bell(pick([2637,3136]),0,.03,.15)}
        break}
      case 'cloud':{c.globalAlpha=1-k;c.translate(p.x,p.y);c.font='60px serif';c.textAlign='center';c.fillText('🌧️',0,0);break}
    }
    c.restore();
  }
}
function drawFly(c,T){
  for(const f of S.fly){
    const k=clamp((T-f.t0)/f.dur,0,1);
    const x=lerp(f.x0,f.x1,k),y=lerp(f.y0,f.y1,k)-Math.sin(k*Math.PI)*90;
    c.save();c.translate(x,y);c.rotate(f.rot+k*TAU);
    const s=lerp(1.7,1.1,k);
    // 軌跡
    if(f.pine)drawPineChunk(c,s*1.1);else drawTop(c,f.type,s);
    c.restore();
    if(Math.random()<.8)addP({k:'dot',x,y,vx:rnd(-30,30),vy:rnd(-30,30),life:0,max:.25,s:rnd(3,6),col:f.pine?'#ffd23f':TCOL[f.type],g:0});
  }
}
function drawBanner(c,T){
  const b=S.banner;if(!b)return;
  const k=(T-b.t)/1.3;if(k>1){S.banner=null;return}
  const x=k<.15?lerp(W+300,W/2,ease(k/.15)):k>.85?lerp(W/2,-300,ease((k-.85)/.15)):W/2;
  c.save();c.translate(x,480);c.rotate(-.06);
  c.fillStyle='rgba(0,0,0,.6)';c.fillRect(-W,-50,W*2,b.sub?110:90);
  c.font='50px '+FONT;c.textAlign='center';c.textBaseline='middle';
  c.lineWidth=10;c.strokeStyle='#000';c.strokeText(b.text,0,-6);
  const g=c.createLinearGradient(-200,0,200,0);g.addColorStop(0,b.col);g.addColorStop(.5,'#fff');g.addColorStop(1,b.col);
  c.fillStyle=g;c.fillText(b.text,0,-6);
  if(b.sub){c.font='22px '+FONT;c.fillStyle='#fff';c.fillText(b.sub,0,38)}
  c.restore();
}
function drawTitle(c,T){
  c.save();c.textAlign='center';c.textBaseline='middle';
  // 回るピザ
  c.save();c.translate(W/2,430);c.rotate(T*.6);
  if(!S.demo){const cu={order:{salami:3,pepper:2,mushroom:2},pines:0};S.demo=newPizza(cu,0);S.demo.sauce=1;S.demo.cheese=1;S.demo.g=.65;
    S.demo.slots.forEach(s=>{S.demo.items.push({type:s.type,x:s.x,y:s.y,rot:rnd(0,TAU),land:-9})})}
  c.scale(1.35,1.35);drawPizza(c,S.demo,T,true);c.restore();
  for(let i=0;i<3;i++){const a=T*2+i*TAU/3;c.font='40px serif';c.fillText(['🍅','🧀','🍄'][i],W/2+Math.cos(a)*215,430+Math.sin(a)*215)}
  const s=1+Math.sin(T*4)*.04;
  c.translate(W/2,170);c.scale(s,s);c.rotate(Math.sin(T*2)*.03);
  c.font='70px '+FONT;c.lineWidth=14;c.strokeStyle='#5a1a08';c.strokeText('リズム',0,-40);
  const g=c.createLinearGradient(0,-80,0,0);g.addColorStop(0,'#ffe066');g.addColorStop(1,'#ff7a1a');c.fillStyle=g;c.fillText('リズム',0,-40);
  c.font='64px '+FONT;c.strokeText('ピザ職人',0,40);c.fillStyle='#fff';c.fillText('ピザ職人',0,40);
  c.restore();
  c.save();c.textAlign='center';c.textBaseline='middle';
  c.globalAlpha=.6+.4*Math.sin(T*5);c.font='30px '+FONT;c.fillStyle='#fff';c.fillText(isTouchDev?'タップで 開店！':'Space / Enter で 開店！',W/2,690);
  c.globalAlpha=1;c.font='17px '+FONT;c.fillStyle='rgba(255,255,255,.8)';
  const lines=['90秒で どれだけ かせげるか！','ソース → チーズ → 具をリズムよく → やく','🍍パイナップルは おさずに スルー！'];
  lines.forEach((l,i)=>c.fillText(l,W/2,760+i*32));
  if(!isTouchDev)c.fillText('キー：1 ソース／2 チーズ／F J K 具／Space やく',W/2,870);
  if(S.best)c.fillText('自己ベスト '+yen(S.best)+'円',W/2,910);
  c.restore();
}
function avg(a,f){return a.length?a.reduce((s,x)=>s+f(x),0)/a.length:0}
function drawEnd(c,T){
  const k=T-S.endT;
  c.save();c.fillStyle='rgba(20,8,4,.82)';c.fillRect(0,0,W,H);
  c.textAlign='center';c.textBaseline='middle';
  c.fillStyle='#fff';c.font='22px '+FONT;c.fillText('本日の売上',W/2,52);
  const s=1+(S.shownSales<S.sales?Math.sin(T*30)*.03:0);
  c.save();c.translate(W/2,104);c.scale(s,s);c.font='54px '+FONT;c.lineWidth=10;c.strokeStyle='#5a1a08';c.strokeText(yen(S.shownSales)+'円',0,0);c.fillStyle='#ffe066';c.fillText(yen(S.shownSales)+'円',0,0);c.restore();
  if(S.newRecord&&k>.3){c.save();c.translate(W/2,150);c.rotate(-.05);c.scale(1+Math.sin(T*8)*.06,1+Math.sin(T*8)*.06);c.font='26px '+FONT;
    const g=c.createLinearGradient(-120,0,120,0);['#ff4d6d','#ffd166','#06d6a0','#4dd2ff','#b388ff'].forEach((cc,i)=>g.addColorStop(i/4,cc));c.fillStyle=g;c.fillText('★ 自己ベスト更新！ ★',0,0);c.restore()}
  else{c.font='18px '+FONT;c.fillStyle='rgba(255,255,255,.7)';c.fillText('自己ベスト '+yen(S.best)+'円',W/2,150)}
  let title=TITLES[0][1];for(const [th,n] of TITLES)if(S.sales>=th)title=n;
  c.font='30px '+FONT;c.fillStyle='#fff';c.fillText('称号：'+title,W/2,196);
  // 一番きれいなピザ
  if(S.bestPizza){c.save();c.translate(120,330);c.rotate(T*.3);c.drawImage(S.bestPizza,-110,-110,220,220);c.restore();
    c.font='15px '+FONT;c.fillStyle='#ffe066';c.fillText('きょうの いちばん（'+S.bestSat+'%）',120,452)}
  else{c.font='18px '+FONT;c.fillStyle='#aaa';c.fillText('ピザ 0まい…',120,330)}
  // 内訳
  const st=S.stats;
  const items=[['盛り付け',avg(st,x=>x.plate)],['焼き加減',avg(st,x=>x.bake)],['早さ',avg(st,x=>x.speed)]];
  let low=0;items.forEach((it,i)=>{if(it[1]<items[low][1])low=i});
  items.forEach(([n,v],i)=>{
    const y=250+i*56,x0=250;
    c.textAlign='left';c.font='17px '+FONT;c.fillStyle=st.length&&i===low?'#ff6a6a':'#fff';c.fillText(n,x0,y);
    rr(c,x0,y+12,200,14,7);c.fillStyle='rgba(255,255,255,.15)';c.fill();
    rr(c,x0,y+12,Math.max(6,200*v/100*ease(k-.2)),14,7);c.fillStyle=st.length&&i===low?'#ff4d4d':'#3fcf55';c.fill();
    c.textAlign='right';c.fillStyle='#fff';c.fillText(Math.round(v)+'点',x0+270,y+18);
  });
  if(st.length){
    const tips=['具が ラインに 重なる瞬間を ねらおう','緑ゾーンの まん中を ねらおう','行列が長いときほど 手早く！'];
    c.textAlign='left';c.font='15px '+FONT;c.fillStyle='#ffb0b0';
    c.fillText(items[low][0]+'の平均'+Math.round(items[low][1])+'点。',250,422);
    c.fillText(tips[low],250,444);
  }
  // タイプ別
  c.textAlign='center';c.font='17px '+FONT;
  const types=['gourmet','salary','kid'];
  types.forEach((t,i)=>{
    const a=st.filter(x=>x.type===t),x=90+i*180,y=510;
    rr(c,x-80,y-30,160,74,16);c.fillStyle='rgba(255,255,255,.1)';c.fill();
    c.font='30px serif';c.fillText(CTYPES[t].emo,x-48,y+6);
    c.font='15px '+FONT;c.fillStyle='#fff';c.fillText(CTYPES[t].name,x+20,y-10);
    c.font='22px '+FONT;c.fillStyle='#ffe066';c.fillText(a.length?Math.round(avg(a,z=>z.sat))+'%':'—',x+20,y+20);
  });
  // その他
  const rows=[['平均満足度',st.length?Math.round(avg(st,x=>x.sat))+'%':'—'],['大満足の最大連続',S.maxCombo+'回'],['提供したピザ',st.length+'まい'],['怒らせた人',S.angry+'人'],['最大コンボ',(S.maxNote||0)+'']];
  rows.forEach(([n,v],i)=>{const y=600+i*40;c.textAlign='left';c.font='19px '+FONT;c.fillStyle='rgba(255,255,255,.8)';c.fillText(n,70,y);c.textAlign='right';c.fillStyle='#fff';c.fillText(v,470,y)});
  // もう1回
  const on=k>.8;
  c.globalAlpha=on?1:.4;
  const pb=1+Math.sin(T*6)*.03;
  c.save();c.translate(W/2,900);c.scale(pb,pb);
  rr(c,-180,-44,360,88,30);const g=c.createLinearGradient(0,-44,0,44);g.addColorStop(0,'#ff6a50');g.addColorStop(1,'#c0261a');c.fillStyle=g;c.fill();c.strokeStyle='#fff';c.lineWidth=5;c.stroke();
  c.fillStyle='#fff';c.font='34px '+FONT;c.textAlign='center';c.fillText('もう1回！',0,0);
  if(!isTouchDev){c.font='14px '+FONT;c.fillText('Enter / Space',0,30)}
  c.restore();
  c.restore();
}
function render(){
  const T=now(),c=ctx;
  c.setTransform(1,0,0,1,0,0);c.fillStyle='#1c0f08';c.fillRect(0,0,cv.width,cv.height);
  const sh=S.shake;
  const sx=(Math.random()-.5)*sh,sy=(Math.random()-.5)*sh;
  const pu=1+S.punch;
  c.setTransform(dpr*scale*pu,0,0,dpr*scale*pu,(ox+sx*scale)*dpr-(pu-1)*W/2*dpr*scale,(oy+sy*scale)*dpr-(pu-1)*H/2*dpr*scale);
  c.save();c.beginPath();c.rect(0,0,W,H);c.clip();
  drawBg(c,T);
  if(S.mode==='title'){drawTitle(c,T)}
  else{
    // 作業台
    c.save();c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(PZ.x,PZ.y+12,165,150,0,0,TAU);c.fill();
    const bg=c.createRadialGradient(PZ.x-40,PZ.y-50,20,PZ.x,PZ.y,155);bg.addColorStop(0,'#e8bd86');bg.addColorStop(1,'#b07a44');
    circ(c,PZ.x,PZ.y,150);c.fillStyle=bg;c.fill();c.strokeStyle='#6a4020';c.lineWidth=4;c.stroke();c.restore();
    // 床
    c.fillStyle='rgba(0,0,0,.3)';c.fillRect(0,FLOOR+14,W,LANE_TOP-FLOOR-14);
    drawOvenFx(c,T);
    if(S.P){
      const k=ease((T-S.P.born)/.2);
      c.save();c.translate(lerp(-200,PZ.x,k),PZ.y);c.rotate((1-k)*-2);drawPizza(c,S.P,T);c.restore();
    }
    if(S.out){
      const k=(T-S.out.t0)/.35;
      if(k>=1)S.out=null;
      else{
        c.save();
        if(S.out.kind==='serve'){const p=custPos(0);c.translate(lerp(PZ.x,p.x,ease(k)),lerp(PZ.y,p.y,ease(k)));c.scale(1-k*.75,1-k*.75);c.rotate(k*3)}
        else{c.translate(PZ.x+k*60,PZ.y+k*k*700);c.rotate(k*6)}
        drawPizza(c,S.out.P,T,true);c.restore();
      }
    }
    for(let i=S.queue.length-1;i>=0;i--)drawCustomer(c,S.queue[i],i,T);
    if(S.leavers)for(const cu of S.leavers)drawLeaver(c,cu,T);
    if(S.mode==='play'||S.mode==='closing'){drawControls(c,T)}
    drawParts(c,T,'under');
    drawFly(c,T);
    drawParts(c,T,'top');
    drawHUD(c,T);
    drawBanner(c,T);
    if(S.mode==='count'){
      const k=Math.floor((T-S.cStart)/.6),f=((T-S.cStart)%.6)/.6;
      const txt=k<3?String(3-k):'開店！';
      c.save();c.fillStyle='rgba(0,0,0,.35)';c.fillRect(0,0,W,H);
      c.translate(W/2,H/2);const s=lerp(2.2,1,ease(f*2));c.scale(s,s);c.rotate((1-ease(f*2))*.3);
      c.font=(k<3?150:110)+'px '+FONT;c.textAlign='center';c.textBaseline='middle';c.lineWidth=16;c.strokeStyle='#5a1a08';c.strokeText(txt,0,0);c.fillStyle=k<3?'#fff':'#ffe066';c.fillText(txt,0,0);c.restore();
    }
    if(S.mode==='closing'){
      const k=(T-S.closeAt)/.3;
      c.save();c.translate(W/2,H/2);const s=lerp(3,1,ease(k));c.scale(s,s);c.rotate(-.12);
      c.font='120px '+FONT;c.textAlign='center';c.textBaseline='middle';c.lineWidth=18;c.strokeStyle='#fff';c.strokeText('閉店！',0,0);c.fillStyle='#e0301e';c.fillText('閉店！',0,0);c.restore();
    }
    if(S.mode==='end'){drawEnd(c,T);drawParts(c,T,'under')}
  }
  if(S.flash){c.globalAlpha=Math.max(0,S.flash.a);c.fillStyle=S.flash.col;c.fillRect(0,0,W,H);c.globalAlpha=1}
  c.restore();
}
function loop(){update();render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ================= 確認用 ?dbg ================= */
function botDrive(T){
  if(S.mode==='title'){startCount();return}
  if(S.mode!=='play')return;
  if(S.step==='sauce'&&T-(S.botT||0)>.15){S.botT=T;act('sauce',T)}
  else if(S.step==='cheese'&&T-(S.botT||0)>.15){S.botT=T;act('cheese',T)}
  else if(S.step==='top'){for(const n of S.notes)if(!n.done&&!n.pine&&T>=n.t)press(n.lane,n.t+S.botErr*(Math.random()*2-1),false)}
  else if(S.step==='oven'&&S.P){if(!S.P.baking)act('oven',T);else if(S.P.g>=S.botG)act('oven',T)}
}
if(/[?&]dbg/.test(location.search)){
  S.botErr=.02;S.botG=.65;
  window.dbg={S,TUNE,bot(on,err,g){S.bot=on!==false;if(err!=null)S.botErr=err;if(g!=null)S.botG=g},start:startCount,
    end(){S.t0-=TUNE.dur}};
}
