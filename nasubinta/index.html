<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ピーマン！トマトに！ナスビンタ！</title>
<style>
html,body{margin:0;height:100%;background:#333;display:flex;justify-content:center;align-items:center;font-family:sans-serif}
canvas{max-width:100vw;max-height:100vh;touch-action:none}
</style>
<script data-goatcounter="https://hiroism.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=720,KID_Y=528,MOUTH_X=240,MOUTH_Y=550,BTN_Y=600;
const TYPES=[
  {c:'#e33',d:'#a11',keys:['1','z','j'],fruit:'イチゴ'},
  {c:'#3b3',d:'#172',keys:['2','x','k'],fruit:'メロン'},
  {c:'#93c',d:'#537',keys:['3','c','l'],fruit:'ブドウ'}
];
let ents=[],effects=[],misses=0,score=0,elapsed=0,spawnT=0.5,state='title',best=0,overAt=0;
let pressed=[0,0,0],shake=0,face='normal',faceT=0;

function reset(){ents=[];effects=[];misses=0;score=0;elapsed=0;spawnT=0.5;state='play';face='normal';faceT=0;}

// ---------- 効果音 ----------
let actx=null,noiseBuf=null;
function initAudio(){
  if(!actx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    actx=new AC();
    noiseBuf=actx.createBuffer(1,Math.floor(actx.sampleRate*0.3),actx.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(actx.state==='suspended')actx.resume();
}

function playSlap(){          // バシッ！
  if(!actx)return;
  const t=actx.currentTime;
  // 手のひらの破裂音
  const n=actx.createBufferSource();n.buffer=noiseBuf;
  const bp=actx.createBiquadFilter();bp.type='bandpass';
  bp.frequency.value=1500+Math.random()*800;bp.Q.value=0.7;
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(1.0,t+0.003);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  n.connect(bp);bp.connect(g);g.connect(actx.destination);
  n.start(t);n.stop(t+0.16);
  // 低い衝撃音
  const o=actx.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(60,t+0.1);
  const g2=actx.createGain();
  g2.gain.setValueAtTime(0.7,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  o.connect(g2);g2.connect(actx.destination);
  o.start(t);o.stop(t+0.13);
}

function playCry(){           // うえ〜ん！
  if(!actx)return;
  const t=actx.currentTime;
  const o=actx.createOscillator();o.type='sawtooth';
  const f=o.frequency;
  f.setValueAtTime(380,t);                 // う
  f.linearRampToValueAtTime(420,t+0.15);
  f.linearRampToValueAtTime(650,t+0.22);   // え〜
  f.linearRampToValueAtTime(600,t+0.6);
  f.linearRampToValueAtTime(420,t+0.95);   // ん
  const lfo=actx.createOscillator();lfo.frequency.value=7;   // 泣き声の震え
  const lg=actx.createGain();lg.gain.value=30;
  lfo.connect(lg);lg.connect(o.frequency);
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.Q.value=4;
  lp.frequency.setValueAtTime(700,t);
  lp.frequency.linearRampToValueAtTime(700,t+0.15);
  lp.frequency.linearRampToValueAtTime(2200,t+0.22);
  lp.frequency.linearRampToValueAtTime(2000,t+0.6);
  lp.frequency.linearRampToValueAtTime(500,t+0.8);
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.25,t+0.03);
  g.gain.linearRampToValueAtTime(0.12,t+0.16);
  g.gain.linearRampToValueAtTime(0.3,t+0.24);
  g.gain.linearRampToValueAtTime(0.25,t+0.7);
  g.gain.linearRampToValueAtTime(0.0001,t+1.0);
  o.connect(lp);lp.connect(g);g.connect(actx.destination);
  o.start(t);o.stop(t+1.05);lfo.start(t);lfo.stop(t+1.05);
}

// ---------- 描画の道具 ----------
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function oval(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);ctx.fill();}
function star(cx,cy,n,ro,ri){
  ctx.beginPath();
  for(let k=0;k<n*2;k++){const r=k%2?ri:ro,a=-Math.PI/2+k*Math.PI/n;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r*0.5);}
  ctx.closePath();ctx.fill();
}
function bigText(t,x,y,size,color,rot=0,sc=1){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  ctx.font=`900 ${size}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.strokeStyle='#222';ctx.lineWidth=size/3.5;ctx.strokeText(t,0,0);
  ctx.strokeStyle='#fff';ctx.lineWidth=size/7;ctx.strokeText(t,0,0);
  ctx.fillStyle=color;ctx.fillText(t,0,0);
  ctx.restore();
}

// ---------- 野菜 ----------
function tomato(){
  ctx.fillStyle='#e33';oval(0,4,30,26);
  ctx.fillStyle='rgba(255,255,255,0.4)';oval(-14,-6,7,4,-0.5);
  ctx.fillStyle='#2a2';star(0,-20,5,15,5);ctx.fillRect(-2,-30,4,9);
}
function pepper(){
  ctx.fillStyle='#3b3';oval(-13,6,14,26);oval(13,6,14,26);
  ctx.fillStyle='#2a2';oval(0,6,11,27);
  ctx.fillStyle='rgba(255,255,255,0.35)';oval(-17,-4,4,10);
  ctx.fillStyle='#172';ctx.fillRect(-3,-30,6,12);oval(0,-19,12,5);
}
function eggplant(){
  ctx.fillStyle='#93c';oval(0,8,21,30);
  ctx.fillStyle='rgba(255,255,255,0.3)';oval(-10,4,4,14);
  ctx.fillStyle='#2a2';star(0,-18,4,18,7);ctx.fillRect(-3,-34,6,12);
}

// ---------- 果物（叩いてはいけない） ----------
function strawberry(){
  ctx.fillStyle='#e33';ctx.beginPath();
  ctx.moveTo(-28,-10);ctx.quadraticCurveTo(-28,-24,0,-20);ctx.quadraticCurveTo(28,-24,28,-10);
  ctx.quadraticCurveTo(24,18,0,34);ctx.quadraticCurveTo(-24,18,-28,-10);ctx.fill();
  ctx.fillStyle='#ffe066';
  for(const [x,y] of [[-20,-10],[20,-10],[-22,4],[22,4],[-12,20],[12,20],[0,27]])oval(x,y,1.8,2.8);
  ctx.fillStyle='#2a2';star(0,-20,6,17,6);
}
function melon(){
  ctx.fillStyle='#3b3';circle(0,4,28);
  ctx.save();ctx.beginPath();ctx.arc(0,4,28,0,Math.PI*2);ctx.clip();
  ctx.strokeStyle='rgba(230,255,210,0.8)';ctx.lineWidth=1.5;
  for(let k=-40;k<=40;k+=12){
    ctx.beginPath();ctx.moveTo(k-30,-30);ctx.lineTo(k+30,40);ctx.moveTo(k+30,-30);ctx.lineTo(k-30,40);ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle='#7a5a2a';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(0,-34);ctx.moveTo(-8,-34);ctx.lineTo(8,-34);ctx.stroke();
}
function grape(){
  ctx.strokeStyle='#537';ctx.lineWidth=2;
  for(const [x,y] of [[-18,-10],[0,-12],[18,-10],[-9,6],[9,6],[0,22]]){
    ctx.fillStyle='#93c';ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.4)';circle(x-4,y-4,2.5);
  }
  ctx.fillStyle='#2a2';oval(10,-26,10,5,-0.4);
  ctx.fillStyle='#7a5a2a';ctx.fillRect(-2,-32,4,10);
}

// ---------- 顔 ----------
function vegFace(){          // 野菜：いじわる顔
  ctx.fillStyle='#fff';circle(-9,2,6);circle(9,2,6);
  ctx.fillStyle='#000';circle(-8,3,3);circle(8,3,3);
  ctx.strokeStyle='#000';ctx.lineCap='round';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-16,-9);ctx.lineTo(-4,-4);ctx.moveTo(16,-9);ctx.lineTo(4,-4);ctx.stroke();
  ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,9,8,0.2,Math.PI-0.2);ctx.stroke();
}
function fruitFace(){        // 果物：にっこり顔
  ctx.strokeStyle='#000';ctx.lineCap='round';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(-8,4,4,Math.PI,0);ctx.stroke();
  ctx.beginPath();ctx.arc(8,4,4,Math.PI,0);ctx.stroke();
  ctx.beginPath();ctx.arc(0,10,4,0,Math.PI);ctx.stroke();
  ctx.fillStyle='rgba(255,150,180,0.8)';circle(-15,11,4);circle(15,11,4);
}
function dizzyFace(){        // ビンタされた顔
  ctx.strokeStyle='#000';ctx.lineCap='round';ctx.lineWidth=3;
  for(const cx of [-9,9]){
    ctx.beginPath();ctx.moveTo(cx-5,-3);ctx.lineTo(cx+5,7);ctx.moveTo(cx+5,-3);ctx.lineTo(cx-5,7);ctx.stroke();
  }
  ctx.beginPath();ctx.ellipse(0,14,5,4,0,0,Math.PI*2);ctx.stroke();
}
const BODY=[[tomato,strawberry],[pepper,melon],[eggplant,grape]];
function drawThing(i,fruit,mode){
  BODY[i][fruit?1:0]();
  if(mode==='dizzy')dizzyFace();
  else if(mode==='face')(fruit?fruitFace:vegFace)();
}

// ---------- 子ども ----------
function drawKid(){
  const x=MOUTH_X,y=KID_Y;
  ctx.fillStyle='#4a2f1b';ctx.beginPath();ctx.arc(x,y-4,66,Math.PI,0);ctx.fill();
  ctx.fillStyle='#ffd9b3';circle(x-58,y,12);circle(x+58,y,12);circle(x,y,58);
  ctx.fillStyle='#4a2f1b';oval(x,y-46,48,16);
  ctx.fillStyle='rgba(255,140,160,0.6)';circle(x-36,y+14,8);circle(x+36,y+14,8);
  ctx.strokeStyle='#000';ctx.fillStyle='#000';ctx.lineCap='round';ctx.lineWidth=3;
  if(face==='yuck'){
    ctx.beginPath();
    ctx.moveTo(x-30,y-12);ctx.lineTo(x-18,y-4);ctx.lineTo(x-30,y+4);
    ctx.moveTo(x+30,y-12);ctx.lineTo(x+18,y-4);ctx.lineTo(x+30,y+4);ctx.stroke();
    ctx.fillStyle='#733';oval(x,y+26,16,11);
    ctx.fillStyle='#f78';oval(x,y+36,9,8);
    ctx.strokeStyle='#66f';ctx.lineWidth=2;
    for(const k of [-12,-4,4,12]){ctx.beginPath();ctx.moveTo(x+k,y-28);ctx.lineTo(x+k,y-16);ctx.stroke();}
    ctx.fillStyle='#6cf';oval(x-30,y+10,4,7);oval(x+30,y+10,4,7);   // 涙
  }else if(face==='happy'){
    ctx.beginPath();ctx.arc(x-22,y-2,7,Math.PI,0);ctx.stroke();
    ctx.beginPath();ctx.arc(x+22,y-2,7,Math.PI,0);ctx.stroke();
    ctx.fillStyle='#733';ctx.beginPath();ctx.arc(x,y+18,16,0,Math.PI);ctx.fill();
    ctx.fillStyle='#f78';oval(x,y+28,7,4);
  }else{
    circle(x-22,y-4,6);circle(x+22,y-4,6);
    ctx.beginPath();ctx.moveTo(x-34,y-18);ctx.lineTo(x-14,y-26);ctx.moveTo(x+34,y-18);ctx.lineTo(x+14,y-26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-12,y+24);ctx.lineTo(x-6,y+20);ctx.lineTo(x,y+24);ctx.lineTo(x+6,y+20);ctx.lineTo(x+12,y+24);ctx.stroke();
  }
}

// ---------- ゲーム処理 ----------
function fx(x,y,text,color,size){
  x=Math.max(90,Math.min(W-90,x));
  effects.push({x,y,text,color,size,life:0.7,rot:(Math.random()-0.5)*0.3});
}

function spawn(){
  const fruit=elapsed>15&&Math.random()<0.15;                       // 15秒後から果物が混ざる
  const dur=Math.max(1.1,4.2-elapsed*0.035)*(0.85+Math.random()*0.3)*(fruit?0.8:1); // 時間経過で速くなる
  const sx=50+Math.random()*(W-100);
  ents.push({color:Math.floor(Math.random()*3),fruit,sx,x:sx,y:-40,p:0,s:0.55,dur,
    state:'move',t:0,ph:Math.random()*6,rot:0,vx:0,vy:0,vr:0});
}

function miss(){
  misses++;shake=0.3;
  playCry();
  if(misses>=3){state='over';best=Math.max(best,score);overAt=performance.now();face='yuck';faceT=1e9;}
}

function press(i){
  pressed[i]=0.12;
  if(state!=='play')return;
  let tg=null;
  for(const e of ents)
    if(e.state==='move'&&e.color===i&&(!tg||e.p>tg.p))tg=e;        // 同じ色で一番口に近い相手
  if(!tg){fx(W/2,450,'スカッ','#bbb',26);return;}                  // 空振りはペナルティなし
  playSlap();
  tg.state='slap';tg.t=0;
  tg.vx=(tg.x<MOUTH_X?-1:1)*(250+Math.random()*200);tg.vy=-550;tg.vr=(tg.vx>0?1:-1)*12;
  if(!tg.fruit){score++;fx(tg.x,tg.y,'バシッ!',TYPES[i].c,50);}
  else{fx(tg.x,tg.y,'あっ、'+TYPES[i].fruit+'が…!','#f80',30);face='yuck';faceT=0.8;miss();}
}

function update(dt){
  for(let i=0;i<3;i++)pressed[i]=Math.max(0,pressed[i]-dt);
  shake=Math.max(0,shake-dt);
  if(faceT>0){faceT-=dt;if(faceT<=0)face='normal';}
  effects.forEach(f=>{f.life-=dt;f.y-=30*dt;});
  effects=effects.filter(f=>f.life>0);
  if(state!=='play')return;
  elapsed+=dt;spawnT-=dt;
  if(spawnT<=0){
    spawn();
    spawnT=Math.max(0.15,0.7-elapsed*0.0075)*(0.7+Math.random()*0.6); // 時間経過で数が増える（倍の出現数）
  }
  for(const e of ents){
    e.t+=dt;
    if(e.state==='move'){
      e.p=Math.min(1,e.p+dt/e.dur);
      const q=e.p;
      e.x=e.sx+(MOUTH_X-e.sx)*q*q+Math.sin(e.t*4+e.ph)*10*(1-q);
      e.y=-40+(MOUTH_Y+40)*q-Math.abs(Math.sin(e.t*7+e.ph))*12*(1-q);  // ぴょこぴょこ跳ねながら接近
      e.s=0.55+0.6*q;                                                  // 近づくほど大きく
      if(e.p>=1){
        e.state='gone';
        if(e.fruit){score+=3;face='happy';faceT=0.7;fx(MOUTH_X,MOUTH_Y-110,'おいしい! +3','#f6a',38);}
        else{face='yuck';faceT=0.8;fx(MOUTH_X,MOUTH_Y-110,'うえ〜ん!','#6b3',46);miss();}
      }
    }else if(e.state==='slap'){
      e.x+=e.vx*dt;e.vy+=1400*dt;e.y+=e.vy*dt;e.rot+=e.vr*dt;
    }
    if(state!=='play')break;
  }
  ents=ents.filter(e=>e.state==='move'||(e.state==='slap'&&e.t<1.2&&e.y<H+60));
}

function drawEnt(e){
  ctx.save();ctx.translate(e.x,e.y);
  ctx.rotate(e.state==='slap'?e.rot:Math.sin(e.t*6+e.ph)*0.1);
  ctx.scale(e.s,e.s);
  drawThing(e.color,e.fruit,e.state==='slap'?'dizzy':'face');
  ctx.restore();
}

function drawButtons(){
  ctx.fillStyle='#6b4226';ctx.fillRect(0,BTN_Y,W,H-BTN_Y);
  ctx.fillStyle='#4e2f1a';ctx.fillRect(0,BTN_Y,W,6);
  TYPES.forEach((t,i)=>{
    const x=W/6+i*W/3,y=BTN_Y+62,p=pressed[i]>0,dy=p?6:0;
    ctx.fillStyle='#2a1a0e';circle(x,y+8,46);
    ctx.fillStyle=p?t.d:t.c;circle(x,y+dy,46);
    ctx.fillStyle='rgba(255,255,255,0.85)';circle(x,y+dy,30);
    ctx.save();ctx.translate(x,y+dy+2);ctx.scale(0.72,0.72);drawThing(i,false,null);ctx.restore();
  });
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*14,(Math.random()-0.5)*14);
  for(let y=0;y<BTN_Y;y+=40)for(let x=0;x<W;x+=40){         // ギンガムチェックのテーブルクロス
    ctx.fillStyle=((x+y)/40)%2?'#d6ecff':'#fff';ctx.fillRect(x,y,40,40);
  }
  drawKid();
  [...ents].sort((a,b)=>((a.state==='slap')-(b.state==='slap'))||(a.p-b.p)).forEach(drawEnt);
  drawButtons();
  for(const f of effects){
    const a=0.7-f.life,sc=a<0.08?0.5+a/0.08*0.8:Math.max(1,1.3-(a-0.08));
    ctx.globalAlpha=Math.min(1,f.life/0.2);
    bigText(f.text,f.x,f.y,f.size,f.color,f.rot,sc);
    ctx.globalAlpha=1;
  }
  ctx.restore();

  bigText('点数 '+score,80,34,24,'#fc3');
  bigText('♥'.repeat(Math.max(0,3-misses)),W-60,34,26,'#f45');

  if(state!=='play'){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    const wob=Math.sin(performance.now()/200)*0.05;
    if(state==='title'){
      bigText('ピーマン！',W/2,150,56,'#3b3',-0.08+wob);
      bigText('トマトに！',W/2,225,56,'#e33',0.06-wob);
      bigText('ナスビンタ！',W/2,305,60,'#93c',-0.04+wob);
    }else{
      bigText('ごちそうさま…',W/2,190,44,'#fc3',wob);
      bigText('点数 '+score,W/2,260,36,'#fff');
      bigText('ベスト '+best,W/2,310,26,'#fff');
    }
    ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillText('同じ色のボタンで野菜をビンタ！',W/2,380);
    ctx.fillText('イチゴ・メロン・ブドウは叩かず食べるとボーナス',W/2,408);
    ctx.fillText('キー: 1 2 3 / Z X C / J K L',W/2,436);
    bigText('スペース か タップでスタート',W/2,485,24,'#fff');
  }
}

function canStart(){return state==='title'||(state==='over'&&performance.now()-overAt>800);}

addEventListener('keydown',e=>{
  initAudio();
  if(state!=='play'){
    if((e.key===' '||e.key==='Enter')&&canStart()){e.preventDefault();reset();}
    return;
  }
  const k=e.key.toLowerCase();
  TYPES.forEach((t,i)=>{if(t.keys.includes(k))press(i);});
});

cv.addEventListener('pointerdown',ev=>{
  initAudio();
  if(state!=='play'){if(canStart())reset();return;}
  const r=cv.getBoundingClientRect();
  const x=(ev.clientX-r.left)*W/r.width,y=(ev.clientY-r.top)*H/r.height;
  if(y>BTN_Y)press(Math.min(2,Math.floor(x/(W/3))));
});

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
