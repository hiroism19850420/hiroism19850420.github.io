<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ぱしゃっと♡フレームカメラ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Pacifico&family=Yomogi&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff5fa2; --pink2:#ffd1e6; --ink:#4a2a3a; --line:#06C755;
    --bg1:#fff0f6; --bg2:#ffe3ef;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:"Mochiy Pop One",system-ui,sans-serif;color:var(--ink);
    background:
      radial-gradient(circle at 12px 12px,#ffc4dc 2.5px,transparent 3px) 0 0/28px 28px,
      linear-gradient(160deg,var(--bg1),var(--bg2));
    user-select:none;-webkit-user-select:none;
  }
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
  #app{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:max(6px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom))}
  header h1{margin:2px 0 6px;font-size:18px;letter-spacing:.04em;color:var(--pink);
    text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff}
  #stage{position:relative;border-radius:18px;overflow:hidden;background:#2a1b24;
    box-shadow:0 0 0 5px #fff,0 0 0 8px var(--pink2),0 10px 24px rgba(160,40,90,.25)}
  #view{display:block;width:100%;height:100%}
  #count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:min(34vw,180px);color:#fff;pointer-events:none;
    text-shadow:0 0 0 #fff,0 6px 0 var(--pink),0 0 30px rgba(255,95,162,.8)}
  #count.pop{animation:pop .9s ease-out}
  @keyframes pop{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.85);opacity:.0}}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #flash.on{animation:flash .45s ease-out}
  @keyframes flash{0%{opacity:1}100%{opacity:0}}
  #chip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;
    background:rgba(255,255,255,.88);color:var(--pink);font-size:13px;padding:6px 12px;border-radius:99px;
    opacity:0;transition:opacity .3s;pointer-events:none}
  #chip.on{opacity:1}
  #tabs{display:flex;gap:6px;margin:14px 0 6px;background:#fff;padding:4px;border-radius:99px;box-shadow:0 2px 0 var(--pink2)}
  #tabs button{padding:7px 18px;border-radius:99px;font-size:14px;color:#c07a98}
  #tabs button.on{background:var(--pink);color:#fff}
  #list{width:100%;max-width:640px;display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;scroll-snap-type:x proximity;
    scrollbar-width:none}
  #list::-webkit-scrollbar{display:none}
  .item{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;scroll-snap-align:start;font-size:11px;color:#a5607e}
  .item canvas{display:block;border-radius:12px;background:#fff;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(160,40,90,.18);transition:transform .15s}
  .item.on canvas{box-shadow:0 0 0 3px var(--pink),0 0 0 6px #fff,0 3px 10px rgba(255,95,162,.45);transform:translateY(-2px)}
  .item.on{color:var(--pink)}
  #bar{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:4px}
  .side{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#a5607e;width:62px}
  .side .ic{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:22px;box-shadow:0 2px 0 var(--pink2);margin-bottom:3px}
  #shutter{width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px var(--pink),0 6px 0 5px #e04488;position:relative;transition:transform .1s}
  #shutter::after{content:"";position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffa3c9,var(--pink))}
  #shutter:active{transform:translateY(3px)}
  #shutter[disabled]{opacity:.6}

  .overlay{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10}
  .overlay.on{display:flex}
  #start{background:
      radial-gradient(circle at 12px 12px,#ffc4dc 2.5px,transparent 3px) 0 0/28px 28px,
      linear-gradient(160deg,var(--bg1),var(--bg2));text-align:center}
  #start .logo{font-size:clamp(30px,9vw,46px);line-height:1.25;color:var(--pink);margin:0 0 6px;
    text-shadow:3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 7px 0 var(--pink2)}
  #start .sub{font-size:14px;color:#b0708c;margin-bottom:22px;line-height:1.7}
  #startPreview{width:min(70vw,300px);border-radius:16px;box-shadow:0 0 0 5px #fff,0 10px 24px rgba(160,40,90,.25);margin-bottom:26px;transform:rotate(-3deg)}
  .big{font-size:18px;padding:15px 34px;border-radius:99px;background:var(--pink);color:#fff;box-shadow:0 5px 0 #e04488}
  .big:active{transform:translateY(3px);box-shadow:0 2px 0 #e04488}
  #err{color:#d0325f;font-size:13px;margin-top:16px;line-height:1.6;max-width:340px}

  #result{background:rgba(255,236,245,.97);gap:14px}
  #photo{max-width:min(88vw,460px);max-height:calc(100dvh - 230px);border-radius:10px;
    box-shadow:0 0 0 5px #fff,0 12px 28px rgba(160,40,90,.3);animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes drop{0%{transform:translateY(-30px) rotate(-6deg) scale(.9);opacity:0}100%{transform:none;opacity:1}}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btns button{padding:13px 20px;border-radius:99px;font-size:15px;background:#fff;color:var(--pink);box-shadow:0 4px 0 var(--pink2)}
  .btns #lineBtn{background:var(--line);color:#fff;box-shadow:0 4px 0 #04a04a;font-size:17px;padding:14px 26px}
  .btns button:active{transform:translateY(2px)}
  .hint{font-size:12px;color:#b0708c;margin:0;text-align:center;line-height:1.6}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(74,42,58,.92);color:#fff;
    padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;z-index:20;max-width:90vw;text-align:center;line-height:1.6;pointer-events:none}
  #toast.on{opacity:1;transform:translateX(-50%)}
</style>

<body>
<div id="app">
  <header><h1>ぱしゃっと♡フレームカメラ</h1></header>
  <div id="stage">
    <canvas id="view" width="720" height="960"></canvas>
    <div id="count"></div>
    <div id="flash"></div>
    <div id="chip"></div>
  </div>
  <div id="tabs">
    <button data-tab="frame" class="on">フレーム</button>
    <button data-tab="acc">かぶりもの</button>
  </div>
  <div id="list"></div>
  <div id="bar">
    <button class="side" id="flipBtn"><span class="ic">🔄</span>きりかえ</button>
    <button id="shutter" aria-label="シャッター"></button>
    <button class="side" id="timerBtn"><span class="ic">⏱</span><span id="timerLabel">3びょう</span></button>
  </div>
</div>

<div id="start" class="overlay on">
  <div class="logo">ぱしゃっと♡<br>フレームカメラ</div>
  <div class="sub">フレームと かぶりものを えらんで<br>とったら LINE で おくれるよ</div>
  <canvas id="startPreview" width="360" height="480"></canvas>
  <button class="big" id="startBtn">カメラを はじめる</button>
  <div id="err"></div>
</div>

<div id="result" class="overlay">
  <img id="photo" alt="とった しゃしん">
  <div class="btns">
    <button id="lineBtn">LINEで おくる</button>
  </div>
  <div class="btns">
    <button id="saveBtn">ほぞん</button>
    <button id="againBtn">もういちど</button>
  </div>
  <p class="hint" id="shareHint">「LINEで おくる」→ 出てきた画面で LINE をえらんでね</p>
</div>
<div id="toast"></div>

<video id="video" playsinline muted autoplay style="display:none"></video>

<script type="module">
const W = 1080, H = 1440;
const DBG = new URLSearchParams(location.search).has('dbg');
const MP_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';

const $ = id => document.getElementById(id);
const video = $('video'), view = $('view'), vctx = view.getContext('2d');
const TAU = Math.PI * 2;

// ---------- 小さな道具 ----------
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rrPath(c, x, y, w, h, r){
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function border(c, th, r, fill){
  c.beginPath(); c.rect(0, 0, W, H); rrPath(c, th, th, W - th * 2, H - th * 2, r);
  c.fillStyle = fill; c.fill('evenodd');
}
function innerLine(c, inset, r, color, lw, dash){
  c.save(); c.beginPath(); rrPath(c, inset, inset, W - inset * 2, H - inset * 2, r);
  c.strokeStyle = color; c.lineWidth = lw; if (dash) c.setLineDash(dash); c.stroke(); c.restore();
}
function text(c, s, x, y, font, fill, strokes, rot = 0){
  c.save(); c.translate(x, y); c.rotate(rot);
  c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  for (const [col, lw] of strokes || []){ c.strokeStyle = col; c.lineWidth = lw; c.strokeText(s, 0, 0); }
  c.fillStyle = fill; c.fillText(s, 0, 0); c.restore();
}
function heart(c, x, y, s, fill, stroke, lw){
  c.beginPath(); c.moveTo(x, y + s * .5);
  c.bezierCurveTo(x - s * 1.05, y - s * .1, x - s * .5, y - s * .95, x, y - s * .38);
  c.bezierCurveTo(x + s * .5, y - s * .95, x + s * 1.05, y - s * .1, x, y + s * .5);
  if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw; c.lineJoin = 'round'; c.stroke(); }
  if (fill){ c.fillStyle = fill; c.fill(); }
}
function star(c, x, y, r, ri, fill, stroke, lw, rot = -Math.PI / 2){
  c.beginPath();
  for (let i = 0; i < 10; i++){ const a = rot + i * Math.PI / 5, rr = i % 2 ? ri : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.lineJoin = 'round';
  if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
  if (fill){ c.fillStyle = fill; c.fill(); }
}
function sparkle(c, x, y, r, fill){
  c.beginPath(); c.moveTo(x, y - r);
  c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r);
  c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r);
  c.fillStyle = fill; c.fill();
}
function flower(c, x, y, r, petal, center, rot = 0, n = 5){
  c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = petal;
  for (let i = 0; i < n; i++){ const a = i * TAU / n; c.beginPath(); c.ellipse(Math.cos(a) * r * .55, Math.sin(a) * r * .55, r * .48, r * .4, a, 0, TAU); c.fill(); }
  c.fillStyle = center; c.beginPath(); c.arc(0, 0, r * .28, 0, TAU); c.fill(); c.restore();
}
function pumpkin(c, x, y, r){
  c.save(); c.translate(x, y);
  c.fillStyle = '#5b7d27'; c.beginPath(); c.moveTo(-r * .08, -r * .62); c.quadraticCurveTo(-r * .02, -r * .95, r * .16, -r * 1.02);
  c.lineTo(r * .2, -r * .9); c.quadraticCurveTo(r * .08, -r * .85, r * .09, -r * .6); c.fill();
  const g = c.createRadialGradient(-r * .2, -r * .3, r * .1, 0, 0, r * 1.1);
  g.addColorStop(0, '#ffb347'); g.addColorStop(1, '#e2620b');
  c.fillStyle = g; c.strokeStyle = '#a84300'; c.lineWidth = r * .045;
  for (const [ox, rx] of [[-.42, .58], [.42, .58], [0, .62]]){ c.beginPath(); c.ellipse(ox * r, 0, rx * r, .72 * r, 0, 0, TAU); c.fill(); c.stroke(); }
  c.fillStyle = '#ffdf5e'; c.strokeStyle = '#6b2500'; c.lineWidth = r * .04;
  for (const s of [-1, 1]){ c.beginPath(); c.moveTo(s * r * .42, -r * .3); c.lineTo(s * r * .2, -r * .02); c.lineTo(s * r * .58, -r * .02); c.closePath(); c.stroke(); c.fill(); }
  c.beginPath(); c.moveTo(-r * .55, r * .18);
  const zz = [[-.4, .3], [-.3, .2], [-.15, .36], [0, .22], [.15, .36], [.3, .2], [.4, .3], [.55, .18]];
  for (const [a, b] of zz) c.lineTo(a * r, b * r);
  c.quadraticCurveTo(0, r * .62, -r * .55, r * .18); c.stroke(); c.fill();
  c.restore();
}
function bat(c, x, y, s, flap){
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = '#1c1028';
  for (const d of [-1, 1]){
    c.save(); c.scale(d, flap); c.beginPath(); c.moveTo(0, 0);
    c.quadraticCurveTo(30, -38, 78, -22); c.quadraticCurveTo(66, -6, 58, 6); c.quadraticCurveTo(46, -4, 36, 8);
    c.quadraticCurveTo(22, -2, 6, 12); c.closePath(); c.fill(); c.restore();
  }
  c.beginPath(); c.ellipse(0, 4, 13, 18, 0, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(-10, -8); c.lineTo(-8, -22); c.lineTo(-2, -12); c.moveTo(10, -8); c.lineTo(8, -22); c.lineTo(2, -12); c.fill();
  c.fillStyle = '#ffd84a'; c.beginPath(); c.arc(-5, 0, 2.6, 0, TAU); c.arc(5, 0, 2.6, 0, TAU); c.fill();
  c.restore();
}
function ghost(c, x, y, s, t){
  c.save(); c.translate(x, y); c.scale(s, s); c.rotate(Math.sin(t * 2) * .08);
  c.beginPath(); c.moveTo(-50, 10); c.arc(0, 0, 50, Math.PI, 0); c.lineTo(50, 70);
  for (let i = 0; i < 4; i++){ const x0 = 50 - i * 25; c.quadraticCurveTo(x0 - 6, 88 + Math.sin(t * 5 + i) * 5, x0 - 12.5, 72); c.quadraticCurveTo(x0 - 19, 60, x0 - 25, 72); }
  c.closePath(); c.fillStyle = 'rgba(255,255,255,.95)'; c.strokeStyle = '#cfc6d8'; c.lineWidth = 4; c.fill(); c.stroke();
  c.fillStyle = '#2b2233'; c.beginPath(); c.ellipse(-17, 2, 7, 10, 0, 0, TAU); c.ellipse(17, 2, 7, 10, 0, 0, TAU); c.fill();
  c.fillStyle = '#ffb3cf'; c.beginPath(); c.ellipse(-28, 20, 9, 5, 0, 0, TAU); c.ellipse(28, 20, 9, 5, 0, 0, TAU); c.fill();
  c.strokeStyle = '#2b2233'; c.lineWidth = 3.5; c.beginPath(); c.arc(0, 18, 7, .2, Math.PI - .2); c.stroke();
  c.restore();
}
function snowflake(c, x, y, r, a = 0){
  c.save(); c.translate(x, y); c.rotate(a); c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = Math.max(2, r * .13); c.lineCap = 'round';
  for (let i = 0; i < 6; i++){ c.rotate(TAU / 6); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -r); c.moveTo(0, -r * .55); c.lineTo(-r * .25, -r * .78); c.moveTo(0, -r * .55); c.lineTo(r * .25, -r * .78); c.stroke(); }
  c.restore();
}
function holly(c, x, y, s, rot){
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  for (const d of [-1, 1]){
    c.save(); c.scale(d, 1); c.rotate(-.35); c.beginPath(); c.moveTo(0, 0);
    c.quadraticCurveTo(25, -28, 40, -18); c.quadraticCurveTo(50, -34, 66, -28); c.quadraticCurveTo(70, -45, 92, -42);
    c.quadraticCurveTo(80, -20, 92, -6); c.quadraticCurveTo(70, -8, 64, 10); c.quadraticCurveTo(50, -2, 38, 14); c.quadraticCurveTo(22, 4, 0, 0);
    c.fillStyle = '#1f7a3a'; c.fill(); c.strokeStyle = '#0f4f24'; c.lineWidth = 3; c.stroke(); c.restore();
  }
  for (const [bx, by] of [[-10, 4], [10, 4], [0, -10]]){ c.beginPath(); c.arc(bx, by, 13, 0, TAU); c.fillStyle = '#d7192a'; c.fill(); c.beginPath(); c.arc(bx - 4, by - 4, 4, 0, TAU); c.fillStyle = 'rgba(255,255,255,.7)'; c.fill(); }
  c.restore();
}
function balloon(c, x, y, s, col, sway){
  c.save(); c.translate(x, y); c.rotate(sway); c.scale(s, s);
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 78); c.bezierCurveTo(20, 140, -20, 200, 10, 280); c.stroke();
  c.fillStyle = col; c.beginPath(); c.ellipse(0, 0, 56, 70, 0, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(-9, 78); c.lineTo(9, 78); c.lineTo(0, 66); c.fill();
  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(-20, -26, 12, 20, -.5, 0, TAU); c.fill();
  c.restore();
}
function sunflower(c, x, y, r, rot){
  c.save(); c.translate(x, y); c.rotate(rot);
  for (let k = 0; k < 2; k++){
    c.fillStyle = k ? '#ffd21f' : '#f5a800';
    for (let i = 0; i < 16; i++){ const a = i * TAU / 16 + k * TAU / 32; c.beginPath(); c.ellipse(Math.cos(a) * r * .72, Math.sin(a) * r * .72, r * .38, r * .14, a, 0, TAU); c.fill(); }
  }
  c.fillStyle = '#6b3b12'; c.beginPath(); c.arc(0, 0, r * .45, 0, TAU); c.fill();
  c.fillStyle = '#4a2608'; const R = rng(7);
  for (let i = 0; i < 26; i++){ const a = R() * TAU, d = Math.sqrt(R()) * r * .4; c.beginPath(); c.arc(Math.cos(a) * d, Math.sin(a) * d, r * .035, 0, TAU); c.fill(); }
  c.restore();
}

// ---------- フレーム ----------
const R1 = rng(11);
const seeded = n => Array.from({length: n}, () => [R1(), R1(), R1(), R1()]);
const edgePts = (n, band) => seeded(n).map(([a, b, cc, d]) => {
  // 写真のまんなかを よけて ふちの近くに ちらす
  const side = Math.floor(a * 4), u = b, v = cc * band;
  const p = side === 0 ? [u * W, v] : side === 1 ? [W - v, u * H] : side === 2 ? [u * W, H - v] : [v, u * H];
  return [p[0], p[1], d];
});
const S = {
  hallo: seeded(14), snow: seeded(26), confetti: seeded(60), petals: seeded(26),
  loveHearts: edgePts(34, 150), kira: edgePts(30, 170),
};

const today = () => { const d = new Date(); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`; };

const FRAMES = [
  { id: 'none', name: 'なし', draw(){} },
  { id: 'halloween', name: 'ハロウィン', draw(c, t){
      const g = c.createRadialGradient(W / 2, H / 2, H * .32, W / 2, H / 2, H * .78);
      g.addColorStop(0, 'rgba(70,20,100,0)'); g.addColorStop(1, 'rgba(50,10,80,.6)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
      border(c, 36, 40, '#2a1240'); innerLine(c, 40, 36, '#ff8a1f', 9);
      // くものす
      for (const [x, d] of [[36, 1], [W - 36, -1]]){
        c.save(); c.translate(x, 36); c.scale(d, 1); c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 3;
        for (let i = 0; i <= 5; i++){ const a = i * Math.PI / 10; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * 230, Math.sin(a) * 230); c.stroke(); }
        for (let r = 50; r <= 220; r += 45){ c.beginPath(); for (let i = 0; i <= 5; i++){ const a = i * Math.PI / 10, p = [Math.cos(a) * r, Math.sin(a) * r]; if (i) { const a0 = (i - .5) * Math.PI / 10; c.quadraticCurveTo(Math.cos(a0) * r * .85, Math.sin(a0) * r * .85, p[0], p[1]); } else c.moveTo(p[0], p[1]); } c.stroke(); }

// ---------- 顔さがし ----------
let detector = null, detState = 'off'; // off | loading | ready | fail
let faces = [];       // なめらかにした目の位置（動画の 0〜1 座標）
let lastDet = 0;
async function loadDetector(){
  if (DBG){ detState = 'ready'; return; }
  detState = 'loading';
  try {
    const { FilesetResolver, FaceDetector } = await import(MP_URL);
    const files = await FilesetResolver.forVisionTasks(`${MP_URL}/wasm`);
    const make = delegate => FaceDetector.createFromOptions(files, { baseOptions: { modelAssetPath: FACE_MODEL, delegate }, runningMode: 'VIDEO', minDetectionConfidence: .5 });
    try { detector = await make('GPU'); } catch { detector = await make('CPU'); }
    detState = 'ready';
  } catch (e){ console.warn('face detector', e); detState = 'fail'; }
}
function updateFaces(raw, now){
  const next = [];
  for (const r of raw){
    let best = null, bd = .15;
    for (const f of faces){ const d = Math.hypot(f.ex - r.ex, f.ey - r.ey); if (d < bd && !next.includes(f)){ bd = d; best = f; } }
    if (best){ const k = .5; for (const key of ['x1', 'y1', 'x2', 'y2', 'ex', 'ey']) best[key] += (r[key] - best[key]) * k; best.seen = now; next.push(best); }
    else next.push({ ...r, seen: now });
  }
  for (const f of faces) if (!next.includes(f) && now - f.seen < 350) next.push(f);
  faces = next;
}
function detect(now){
  if (detState !== 'ready' || video.readyState < 2 || now - lastDet < 45) return;
  lastDet = now;
  let raw = [];
  if (DBG) raw = dbgFaces();
  else {
    try {
      const res = detector.detectForVideo(video, now);
      for (const d of res.detections){ const k = d.keypoints; if (!k || k.length < 2) continue;
        raw.push({ x1: k[0].x, y1: k[0].y, x2: k[1].x, y2: k[1].y, ex: (k[0].x + k[1].x) / 2, ey: (k[0].y + k[1].y) / 2 }); }
    } catch (e){ console.warn(e); }
  }
  updateFaces(raw, now);
}

// ---------- えがく ----------
let facing = 'user', frameI = 1, accI = 1;
const mirror = () => facing === 'user';
function vmap(rect){
  const vw = video.videoWidth || 4, vh = video.videoHeight || 3, k = Math.max(rect.w / vw, rect.h / vh), dw = vw * k, dh = vh * k;
  return { ox: rect.x + (rect.w - dw) / 2, oy: rect.y + (rect.h - dh) / 2, dw, dh };
}
function toCanvas(m, x, y){ return [m.ox + (mirror() ? 1 - x : x) * m.dw, m.oy + y * m.dh]; }
function render(c, scale, t){
  const fr = FRAMES[frameI], rect = fr.rect || { x: 0, y: 0, w: W, h: H }, m = vmap(rect);
  c.setTransform(scale, 0, 0, scale, 0, 0);
  c.fillStyle = '#2a1b24'; c.fillRect(0, 0, W, H);
  c.save(); c.beginPath(); c.rect(rect.x, rect.y, rect.w, rect.h); c.clip();
  if (video.readyState >= 2){
    if (mirror()){ c.translate(m.ox + m.dw, m.oy); c.scale(-1, 1); c.drawImage(video, 0, 0, m.dw, m.dh); }
    else c.drawImage(video, m.ox, m.oy, m.dw, m.dh);
  }
  c.restore();
  const acc = ACCS[accI];
  if (acc.id !== 'none'){
    const list = detState === 'fail' ? [{ x1: .42, y1: .42, x2: .58, y2: .42 }] : faces;
    for (const f of list){
      let a = toCanvas(m, f.x1, f.y1), b = toCanvas(m, f.x2, f.y2);
      if (a[0] > b[0]) [a, b] = [b, a];
      const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
      c.save(); c.translate((a[0] + b[0]) / 2, (a[1] + b[1]) / 2); c.rotate(Math.atan2(b[1] - a[1], b[0] - a[0])); c.scale(d / 100, d / 100);
      acc.draw(c, t); c.restore();
    }
  }
  c.save(); fr.draw(c, t); c.restore();
}

// ---------- 見本の絵（サムネイル） ----------
function samplePhoto(c){
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#cfe8ff'); g.addColorStop(1, '#ffe0ec'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = '#ffd9c2'; c.beginPath(); c.arc(W / 2, H * .45, 230, 0, TAU); c.fill();
  c.fillStyle = '#b9a3ff'; c.beginPath(); c.ellipse(W / 2, H * 1.02, 430, 330, 0, 0, TAU); c.fill();
  c.fillStyle = '#5a3a4a'; c.beginPath(); c.arc(W / 2 - 75, H * .44, 20, 0, TAU); c.arc(W / 2 + 75, H * .44, 20, 0, TAU); c.fill();
  c.strokeStyle = '#5a3a4a'; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.arc(W / 2, H * .5, 50, .3, Math.PI - .3); c.stroke();
}
function frameThumb(fr, cv, withAcc){
  const c = cv.getContext('2d'), sc = cv.width / W;
  c.setTransform(sc, 0, 0, sc, 0, 0); c.clearRect(0, 0, W, H);
  const r = fr.rect || { x: 0, y: 0, w: W, h: H };
  c.save(); c.beginPath(); c.rect(r.x, r.y, r.w, r.h); c.clip(); c.translate(r.x, r.y); c.scale(r.w / W, r.h / H); samplePhoto(c);
  if (withAcc){ c.translate(W / 2, H * .44); c.scale(1.5, 1.5); withAcc.draw(c, 0); }
  c.restore(); c.save(); fr.draw(c, 0); c.restore();
}
function accThumb(acc, cv){
  const c = cv.getContext('2d'), s = cv.width / 560;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
  c.fillStyle = '#fff4f8'; c.fillRect(0, 0, cv.width, cv.height);
  c.setTransform(s, 0, 0, s, cv.width / 2, cv.height / 2 + 90 * s);
  c.fillStyle = '#ffd9c2'; c.beginPath(); c.ellipse(0, 20, 125, 150, 0, 0, TAU); c.fill();
  c.fillStyle = '#5a3a4a'; c.beginPath(); c.arc(-50, 0, 12, 0, TAU); c.arc(50, 0, 12, 0, TAU); c.fill();
  c.strokeStyle = '#5a3a4a'; c.lineWidth = 8; c.lineCap = 'round'; c.beginPath(); c.arc(0, 85, 26, .3, Math.PI - .3); c.stroke();
  acc.draw(c, 0);
}

let ac = null;
function beep(f, d = .12, v = .18){
  if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
  o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.001, n + d);
  o.connect(g).connect(ac.destination); o.start(n); o.stop(n + d);
}
function shutterSound(){
  if (!ac) return; const n = ac.currentTime, len = ac.sampleRate * .12, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3) * (i < len * .25 || i > len * .45 ? 1 : .2);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'highpass'; f.frequency.value = 1800; g.gain.value = .5; s.buffer = buf; s.connect(f).connect(g).connect(ac.destination); s.start(n);
}

}

    const t = performance.now() / 1000; fake.x = 320 + Math.sin(t * .7) * 90; fake.y = 230 + Math.sin(t * 1.1) * 30; fake.a = Math.sin(t * .9) * .25;
    const g = c.createLinearGradient(0, 0, 0, 480); g.addColorStop(0, '#9fd3c7'); g.addColorStop(1, '#f6e3b4'); c.fillStyle = g; c.fillRect(0, 0, 640, 480);
    c.save(); c.translate(fake.x, fake.y); c.rotate(fake.a);
    c.fillStyle = '#5b3a29'; c.beginPath(); c.ellipse(0, -20, 92, 100, 0, 0, TAU); c.fill();
