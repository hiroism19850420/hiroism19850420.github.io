<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1840">
<meta name="mobile-web-app-capable" content="yes">
<title>ぷるもち☆バトル ぜんしん版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2a1840;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#2a1840;color:#fff;font-family:"M PLUS Rounded 1c",system-ui,sans-serif;font-weight:800;z-index:10;text-align:center;font-size:18px}
#rot small{color:#ffb3d9;font-size:13px;letter-spacing:.15em}
#rot svg{animation:spin 2.4s ease-in-out infinite}
@keyframes spin{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (orientation:portrait){#rot.touch{display:flex}}
</style>
<script data-goatcounter="https://hiroism.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>
<body>
<canvas id="c"></canvas>
<div id="rot">
  <svg width="90" height="90" viewBox="0 0 90 90"><rect x="28" y="8" width="34" height="74" rx="8" fill="none" stroke="#ff8fc8" stroke-width="3"/><circle cx="45" cy="74" r="3" fill="#ffd84a"/></svg>
  <div>画面を横にしてね</div>
  <small>ROTATE YOUR DEVICE</small>
</div>
<script src="body.js"></script>
<script src="chars.js"></script>
<script src="game.js"></script>
</body>
</html>
