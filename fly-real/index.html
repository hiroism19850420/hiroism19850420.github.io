<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2546">
<title>Fly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#16203f;--glass:#ffffff22;--line:#ffffffcc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2546;color:#fff;
  font-family:'Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo',sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#gl,#streaks{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
#streaks{pointer-events:none;z-index:2}
#vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 58%,rgba(8,12,30,.32) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;background:#fff;opacity:0}
#fade{position:fixed;inset:0;pointer-events:none;z-index:60;background:#0d1330;opacity:1;transition:opacity 1.6s ease}
#fade.off{opacity:0}
#camVideo{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px;top:-10px}
.hide{display:none!important}
svg{display:block}

/* 題名 */
.logo{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;letter-spacing:.06em;color:#fff;
  text-shadow:0 0 30px #ffd9b080,0 2px 16px #0003;line-height:1}

/* よみこみ */
#load{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  background:radial-gradient(ellipse at 50% 70%,#f2b48e 0%,#7b6f9e 45%,#1b2546 100%);transition:opacity 1.2s}
#load .logo{font-size:min(22vw,150px)}
#load .bar{width:min(52vw,320px);height:2px;background:#ffffff30;border-radius:2px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:#fff;transition:width .25s}
#load.off{opacity:0;pointer-events:none}
#load .err{max-width:80vw;font-size:14px;line-height:1.6;text-align:center;opacity:.9}

/* 入口 */
#gate{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;transition:opacity 1s}
#gate .logo{font-size:min(24vw,170px);margin-top:-8vh;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-6px);text-shadow:0 0 44px #ffd9b0aa,0 2px 16px #0003}}
#gate .row{display:flex;gap:min(5vw,34px)}
.ib{width:min(19vw,104px);height:min(19vw,104px);border-radius:50%;border:1.5px solid #ffffffaa;background:#ffffff1a;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0;transition:transform .2s,background .2s,box-shadow .2s;color:#fff}
.ib:hover,.ib:focus-visible{background:#ffffff33;transform:translateY(-3px) scale(1.04);box-shadow:0 0 30px #ffe2c080;outline:none}
.ib:active{transform:scale(.96)}
.ib svg{width:62%;height:62%}
#gate.off{opacity:0;pointer-events:none}
#bCalm{font:13px/1 sans-serif;color:#fff;padding:9px 16px;border-radius:20px;border:1.5px solid #ffffff88;background:#ffffff14;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bCalm.on{background:#ffffff40;border-color:#fff}
#gmsg{min-height:1.6em;font-size:14px;max-width:80vw;text-align:center;line-height:1.6;text-shadow:0 1px 6px #0008}

/* カメラの じゅんび（絵だけ） */
#guide{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:4vw;transition:opacity .8s}
#guide.off{opacity:0;pointer-events:none}
#mirrorWrap{position:relative;width:min(56vw,78vh);aspect-ratio:4/3;border-radius:22px;overflow:hidden;border:1.5px solid #ffffffaa;
  box-shadow:0 10px 40px #0006;background:#0d1330}
#mirror{width:100%;height:100%;display:block}
#ghost{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55;transition:opacity .4s}
#ghost.ok{opacity:.9}
#ghint{position:absolute;right:10px;top:10px;width:30%;aspect-ratio:1;pointer-events:none;opacity:0;transition:opacity .3s}
#ghint.on{opacity:1}
#gring{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .2s}
#gring.on{opacity:1}
#setupPic{width:min(26vw,36vh);opacity:.95}
#guideBack{position:absolute;left:16px;top:16px;width:46px;height:46px}

/* とんでいる間の 絵の合図 */
#cue{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%) translateY(-12px);z-index:15;
  width:min(30vw,170px);aspect-ratio:1;pointer-events:none;opacity:0;transition:opacity .5s,transform .5s;
  filter:drop-shadow(0 2px 8px #0007)}
#cue.on{opacity:1;transform:translateX(-50%)}
#cue.ok{opacity:0;transform:translateX(-50%) scale(1.25);transition:opacity .6s,transform .6s}
#cue svg{width:100%;height:100%}

/* 小さな 鏡（からだが 見えているか） */
#mini{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:min(20vw,150px);aspect-ratio:4/3;
  z-index:14;border-radius:12px;overflow:hidden;opacity:0;transition:opacity .8s;pointer-events:none;background:#0d133055;border:1px solid #ffffff55}
#mini.on{opacity:.75}
#miniCv{width:100%;height:100%;display:block}
#lost{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:54px;height:54px;z-index:14;
  opacity:0;transition:opacity .5s;pointer-events:none;filter:drop-shadow(0 2px 6px #0008)}
#lost.on{opacity:.9;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* タッチ */
#touch{position:fixed;inset:0;z-index:12;display:none;pointer-events:none}
#touch.on{display:block}
#stick{position:absolute;left:max(4vw,env(safe-area-inset-left));bottom:max(6vh,env(safe-area-inset-bottom));width:min(30vh,150px);aspect-ratio:1;border-radius:50%;
  border:1.5px solid #ffffff88;background:#ffffff14;pointer-events:auto;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:#ffffffaa;box-shadow:0 0 18px #fff8}
#flapBtn{position:absolute;right:max(5vw,env(safe-area-inset-right));bottom:max(7vh,env(safe-area-inset-bottom));width:min(24vh,118px);aspect-ratio:1;border-radius:50%;
  border:1.5px solid #ffffff88;background:#ffffff1c;pointer-events:auto;display:flex;align-items:center;justify-content:center;touch-action:none}
#flapBtn svg{width:64%;height:64%}
#flapBtn.hit{background:#ffffff55}

/* おわり */
#endUI{position:fixed;left:50%;bottom:max(9vh,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:22px;
  opacity:0;pointer-events:none;transition:opacity 2s}
#endUI.on{opacity:1;pointer-events:auto}
#bAgain{position:relative}
#endRing{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none;transform:rotate(-90deg)}
#endTp{width:70px;height:70px;opacity:.8}

#credit{position:fixed;left:0;right:0;bottom:max(6px,env(safe-area-inset-bottom));z-index:21;text-align:center;font:10px/1.5 sans-serif;color:#ffffffaa;text-shadow:0 1px 4px #0008;pointer-events:none;padding:0 12px;transition:opacity 1s}
body:not([data-state="gate"]) #credit{opacity:0}
#rotate{position:fixed;inset:0;z-index:90;background:#1b2546;display:none;align-items:center;justify-content:center}
#rotate svg{width:min(40vw,180px);height:min(40vw,180px)}
@media (orientation:portrait){body.touch #rotate{display:flex}}

#dbgInfo{position:fixed;right:6px;top:6px;z-index:95;font:11px/1.35 ui-monospace,Consolas,monospace;color:#fff;background:#000a;
  padding:4px 6px;border-radius:6px;white-space:pre;pointer-events:none;display:none}
</style>
<script data-goatcounter="https://hiroism.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>

<script type="module">
import * as THREE from 'three';
// =====================================================================
//  Fly — 体で 空を とぶ。世界の 名所を めぐって、宇宙の 入り口まで。
// =====================================================================
const Q = new URLSearchParams(location.search);
const DBG = Q.has('dbg');
const TOUCH = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
if (TOUCH) document.body.classList.add('touch');
const QUALITY = Q.get('q') || (TOUCH ? 'low' : 'high');
const HI = QUALITY === 'high';
const $ = id => document.getElementById(id);

// ---------- 小さな 道具 ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (c, t, tau, dt) => tau <= 0 ? t : c + (t - c) * (1 - Math.exp(-dt / tau));
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const V3 = THREE.Vector3;
const wait = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(r));
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f + i * 17.3, y * f - i * 9.1); n += a; a *= 0.5; f *= 2.03; } return s / n; }
function ridged(x, y, o = 4) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * (1 - Math.abs(vnoise(x * f + i * 7.1, y * f + i * 3.3) * 2 - 1)); n += a; a *= 0.5; f *= 2.1; } return s / n; }
const col = h => new THREE.Color(h);
const ex2 = v => Math.exp(-v * v);

// ---------- 空と 霧（すべての 物で 同じ 式を つかう） ----------
const SU = {
  uZen: { value: col('#3a5ba8') }, uHor: { value: col('#f0c9a6') }, uSunDir: { value: new V3(0, 0.1, 1).normalize() },
  uSunCol: { value: col('#ffd2a0') }, uGlow: { value: 1 }, uFogDens: { value: 0.002 }, uFogBase: { value: 0 }, uFogFall: { value: 0.02 },
  uHaze: { value: 0.0002 }, uCloudFog: { value: 0 }, uCloudCol: { value: col('#ffffff') }, uCloudShadow: { value: col('#8c90b8') },
  uTime: { value: 0 }, uStars: { value: 0 }, uSunDisc: { value: 1 }
};
const GL_COMMON = /* glsl */`
uniform vec3 uZen; uniform vec3 uHor; uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uGlow;
uniform float uFogDens; uniform float uFogBase; uniform float uFogFall; uniform float uHaze; uniform float uCloudFog;
uniform vec3 uCloudCol; uniform vec3 uCloudShadow; uniform float uTime; uniform float uStars; uniform float uSunDisc;
vec3 skyCol(vec3 d){
  float y=d.y;
  vec3 c=mix(uHor,uZen,pow(clamp(y,0.0,1.0),0.5));
  c=mix(c,uHor*0.88,clamp(-y*5.0,0.0,1.0));
  float sd=max(dot(d,uSunDir),0.0);
  float hb=exp(-abs(y)*4.0);
  c+=uSunCol*uGlow*(pow(sd,3.0)*0.28*hb+pow(sd,20.0)*0.32+pow(sd,260.0)*0.9);
  return c;
}
float fogAmt(vec3 p){
  vec3 v=p-cameraPosition; float d=length(v);
  float k=uFogFall;
  float e0=exp(-k*(cameraPosition.y-uFogBase)); float e1=exp(-k*(p.y-uFogBase));
  float hf=abs(v.y)>0.5?(e0-e1)/(k*v.y):e0;
  hf=clamp(hf,0.0,30.0);
  float od=uFogDens*d*hf+uHaze*d+uCloudFog*uCloudFog*d*0.08;
  return 1.0-exp(-od);
}
vec3 fogCol(vec3 dir){ return mix(skyCol(dir),uCloudCol,clamp(uCloudFog*1.2,0.0,1.0)); }
vec3 toOut(vec3 c){
#ifdef TONE_MAPPING
  c=toneMapping(c);
#endif
  return linearToOutputTexel(vec4(c,1.0)).rgb;
}
vec3 applyFog(vec3 outc, vec3 wp){ return mix(outc,toOut(fogCol(normalize(wp-cameraPosition))),fogAmt(wp)); }
float h13(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
`;
// three.js の 材料（Lambert など）にも 同じ 霧を つける
function fogPatch(m) {
  m.onBeforeCompile = sh => {
    for (const k in SU) sh.uniforms[k] = SU[k];
    sh.vertexShader = sh.vertexShader
      .replace('#include <fog_pars_vertex>', 'varying vec3 vFW;')
      .replace('#include <fog_vertex>', 'vec4 fwp=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nfwp=instanceMatrix*fwp;\n#endif\nvFW=(modelMatrix*fwp).xyz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <fog_pars_fragment>', 'varying vec3 vFW;\n' + GL_COMMON)
      .replace('#include <fog_fragment>', 'gl_FragColor.rgb=applyFog(gl_FragColor.rgb,vFW);');
  };
  m.customProgramCacheKey = () => 'fogp1';
  return m;
}
function shaderMat(o) {
  const u = Object.assign({}, SU, o.uniforms || {});
  return new THREE.ShaderMaterial(Object.assign({}, o, { uniforms: u, fragmentShader: GL_COMMON + o.fragmentShader }));
}

// ---------- 描画の じゅんび ----------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: HI, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
let PR = Math.min(devicePixelRatio || 1, HI ? 1.75 : 1.35);
renderer.setPixelRatio(PR);
if (HI) { renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; }
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.3, 14000);
scene.add(camera);
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
const hemi = new THREE.HemisphereLight(0x9db1e8, 0xb89880, 1.0);
scene.add(sun, sun.target, hemi);
if (HI) {
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.5;
  const sc = sun.shadow.camera; sc.near = 10; sc.far = 2600;
}
const SpaceCam = new THREE.PerspectiveCamera(70, 1, 0.5, 60000);
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  SpaceCam.aspect = w / h; SpaceCam.updateProjectionMatrix();
  const sc = $('streaks'); const k = Math.min(devicePixelRatio || 1, 1.5);
  sc.width = Math.round(w * k); sc.height = Math.round(h * k);
}

// ---------- 手で 作る 絵（キャンバス） ----------
function canvasTex(w, h, draw, opt = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h, c);
  const t = new THREE.CanvasTexture(c);
  if (opt.noflip) t.flipY = false;
  t.colorSpace = opt.srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  if (opt.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  if (opt.aniso) t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const TEX = {};
function makeTextures() {
  // 地面の こまかい ざらざら（くり返しても つなぎ目が 出ない）
  TEX.detail = canvasTex(256, 256, (g, w, h) => {
    const im = g.createImageData(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let s = 0, a = 0.5, n = 0;
      for (let o = 0; o < 5; o++) {
        const p = 8 << o, fx = x / w * p, fy = y / h * p;
        const xi = Math.floor(fx), yi = Math.floor(fy), xf = fx - xi, yf = fy - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const H = (i, j) => hash2(((i % p) + p) % p + o * 131, ((j % p) + p) % p + o * 71);
        const A = H(xi, yi), B = H(xi + 1, yi), C = H(xi, yi + 1), D = H(xi + 1, yi + 1);
        s += a * (A + (B - A) * u + (C - A) * v + (A - B - C + D) * u * v); n += a; a *= 0.55;
      }
      const vv = Math.round(clamp(s / n, 0, 1) * 255), i = (y * w + x) * 4;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = vv; im.data[i + 3] = 255;
    }
    g.putImageData(im, 0, 0);
  }, { repeat: true, aniso: true });
  // 雲の かたまり（2×2 の 4しゅるい）。R = 光の あたり具合、A = こさ
  TEX.puff = canvasTex(512, 512, (g, w, h) => {
    const im = g.createImageData(w, h);
    const R = rng(77);
    for (let k = 0; k < 4; k++) {
      const balls = [];
      const nb = 5 + Math.floor(R() * 4);
      for (let i = 0; i < nb; i++) balls.push([0.5 + (R() - 0.5) * 0.42, 0.56 + (R() - 0.5) * 0.3 - i * 0.012, 0.13 + R() * 0.12]);
      const dens = (x, y) => {
        let d = 0; for (const b of balls) { const dx = x - b[0], dy = y - b[1]; d += Math.exp(-(dx * dx + dy * dy) / (b[2] * b[2])); }
        d += (fbm(x * 9 + k * 10, y * 9, 4) - 0.5) * 0.9;
        const e = Math.min(x, 1 - x, y, 1 - y); return d * smooth(0.0, 0.16, e);
      };
      const ox = (k % 2) * 256, oy = Math.floor(k / 2) * 256;
      for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
        const u = x / 256, v = y / 256;

}

function waterMat(deep, waveK = 1.0) {
  return shaderMat({
    uniforms: { uNoise: { value: TEX.detail }, uDeep: { value: col(deep) }, uWaveK: { value: waveK } },
    vertexShader: /* glsl */`varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: /* glsl */`varying vec3 vW; uniform sampler2D uNoise; uniform vec3 uDeep; uniform float uWaveK;
    void main(){
      vec2 p=vW.xz; float t=uTime;
      vec2 g=vec2(0.0);
      for(int i=0;i<5;i++){ float fi=float(i); float a=fi*2.1+0.4; vec2 dir=vec2(cos(a),sin(a));
        float fr=0.05*pow(1.75,fi); float amp=0.5/pow(1.9,fi); float ph=dot(dir,p)*fr+t*(0.9+fi*0.45);
        g+=dir*fr*amp*cos(ph); }
      vec2 q1=p*0.021+vec2(t*0.010,t*0.007), q2=p*0.047-vec2(t*0.009,-t*0.012);
      float e=0.004;
      float n0=texture2D(uNoise,q1).r+texture2D(uNoise,q2).r;
      float nx=texture2D(uNoise,q1+vec2(e,0.0)).r+texture2D(uNoise,q2+vec2(e,0.0)).r;
      float nz=texture2D(uNoise,q1+vec2(0.0,e)).r+texture2D(uNoise,q2+vec2(0.0,e)).r;
      g=g*uWaveK+vec2(nx-n0,nz-n0)*7.0*uWaveK;
      vec3 n=normalize(vec3(-g.x,1.0,-g.y));
      vec3 v=normalize(vW-cameraPosition);
      vec3 r=reflect(v,n); r.y=abs(r.y)+0.03; r=normalize(r);
      float f=0.03+0.97*pow(1.0-max(dot(-v,n),0.0),5.0);
      vec3 c=mix(uDeep,skyCol(r),f);
      float sp=pow(max(dot(r,uSunDir),0.0),260.0)*7.0+pow(max(dot(r,uSunDir),0.0),40.0)*0.25;
      c+=uSunCol*sp*uGlow;
      gl_FragColor=vec4(applyFog(toOut(c),vW),1.0);
    }`
  });
}

const Puffs = {
  MAX: 900, list: [], n: 0,
  build() {

    g.instanceCount = 0;
    const mat = shaderMat({
      uniforms: { uPuff: { value: TEX.puff }, uAlpha: { value: 1 } },

      void main(){
        vec4 mv=viewMatrix*vec4(iPos,1.0);
        float c=cos(iSz.y), s=sin(iSz.y);

        mv.xy+=q;

        float a=iSz.w; vUv=vec2(position.x+0.5,0.5-position.y)*0.5+vec2(mod(a,2.0),floor(a/2.0))*0.5;
        gl_Position=projectionMatrix*mv;
      }`,
      fragmentShader: /* glsl */`uniform sampler2D uPuff; uniform float uAlpha; varying vec2 vUv; varying vec3 vW; varying float vT; varying float vA;
      void main(){

        vec3 c=mix(uCloudShadow,uCloudCol,t.r)*vT;

      transparent: true, depthWrite: false

  set(list) { this.list = list.slice(0, this.MAX); this.n = this.list.length; this.mesh.geometry.instanceCount = this.n; this.sortT = 0; this.sort(true); },
  sort(force) {
    const cp = camera.position, L = this.list;
    for (const p of L) p.d = (p.x - cp.x) ** 2 + (p.y - cp.y) ** 2 + (p.z - cp.z) ** 2;
    L.sort((a, b) => b.d - a.d);
    const P = this.aPos.array, S = this.aSz.array;
    for (let i = 0; i < this.n; i++) { const p = L[i]; P[i * 3] = p.x; P[i * 3 + 1] = p.y; P[i * 3 + 2] = p.z; S[i * 4] = p.s; S[i * 4 + 1] = p.r; S[i * 4 + 2] = p.t; S[i * 4 + 3] = p.a; }
    this.aPos.needsUpdate = true; this.aSz.needsUpdate = true;
  },
  update(dt) { if ((this.sortT -= dt) <= 0) { this.sortT = 0.12; this.sort(); } }

function puff(x, y, z, s, R, t = 1) { return { x, y, z, s, r: (R() - 0.5) * 0.5, t: t * (0.92 + R() * 0.16), a: Math.floor(R() * 4) }; }
// 道すじの まわりに 雲を おく（入口・出口の 雲の 中）
function pathClouds(path, s0, s1, count, spread, size, seed, tint = 1) {
  const R = rng(seed), out = [], o = pathPoint();
  for (let i = 0; i < count; i++) {
    const s = lerp(s0, s1, R());
    path.at(s, o);
    const a = R() * Math.PI * 2, r = spread * (0.25 + R() * 0.9);
    const p = o.P.clone().addScaledVector(o.R, Math.cos(a) * r).addScaledVector(o.U, Math.sin(a) * r * 0.7);
    out.push(puff(p.x, p.y, p.z, size * (0.6 + R() * 0.8), R, tint));
  }
  return out;
}

function makeHmap(zone, x0, z0, w, d, res, densFn) {
  const nx = Math.round(w / res), nz = Math.round(d / res), data = new Uint16Array(nx * nz * 2);
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const x = x0 + (i + 0.5) * res, z = z0 + (j + 0.5) * res, k = (j * nx + i) * 2;
    data[k] = THREE.DataUtils.toHalfFloat(zone.grid.h(x, z));
    data[k + 1] = THREE.DataUtils.toHalfFloat(clamp(densFn(x, z), 0, 1));
  }
  const t = new THREE.DataTexture(data, nx, nz, THREE.RGFormat, THREE.HalfFloatType);
  t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}

// 木を ばらまく。dens(x,z) が 0〜1 の 場所に
function scatter(zone, type, count, area, dens, seed, sMin, sMax, tint = '#ffffff') {
  const R = rng(seed), list = [];
  let tries = 0;
  while (list.length < count && tries < count * 30) {
    tries++;
    const x = lerp(area[0], area[1], R()), z = lerp(area[2], area[3], R());
    if (R() > dens(x, z)) continue;
    list.push([x, zone.grid.h(x, z) - 0.4, z, lerp(sMin, sMax, R()), R() * 6.28, R()]);
  }
  const m = new THREE.InstancedMesh(TreeGeo[type], zone.treeMat || (zone.treeMat = treeMat()), list.length);
  const o = new THREE.Object3D(), tc = col(tint), cc = new THREE.Color();
  list.forEach((t, i) => {
    o.position.set(t[0], t[1], t[2]); o.rotation.set(0, t[4], 0); o.scale.setScalar(t[3]); o.updateMatrix(); m.setMatrixAt(i, o.matrix);
    cc.copy(tc).multiplyScalar(0.82 + t[5] * 0.36); m.setColorAt(i, cc);
  });
  m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true;
  m.computeBoundingSphere();
  m.receiveShadow = HI;
  return m;
}

  g.computeVertexNormals();
  return g;
}

// いくつかの こまかい 帯を もつ 方眼
function axisBands(min, max, bands, coarse) {
  const a = []; let v = min;
  while (v < max - 1e-6) {
    a.push(v);
    let st = coarse;
    for (const [lo, hi, s] of bands) { const d = v < lo ? lo - v : v > hi ? v - hi : 0; st = Math.min(st, s + d * 0.05); }
    v += st;
  }
  a.push(max); return Float32Array.from(a);
}

function nazcaTexture() {

    g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineJoin = 'round';
    // 長い まっすぐの 線と 台形
    const R = rng(121);
    g.globalAlpha = 0.55;
    for (let i = 0; i < 26; i++) {
      const a = R() * Math.PI, cx = lerp(-800, 800, R()), cz = lerp(150, 1850, R()), L = 500 + R() * 1300;
      const [x1, y1] = toPx(cx - Math.cos(a) * L / 2, cz - Math.sin(a) * L / 2), [x2, y2] = toPx(cx + Math.cos(a) * L / 2, cz + Math.sin(a) * L / 2);
      g.lineWidth = (1.6 + R() * 2.4) * k; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    }

      const ux = Math.cos(a), uz = Math.sin(a), vx = -uz, vz = ux;

    }

// =====================================================================
//  本物の 地形（標高データ）と 衛星写真
//   標高：Mapzen / AWS Terrain Tiles（Terrarium）
//   写真：Esri World Imagery
//   ゲームを あけるたびに 取りにいく（ファイルには ふくまない）
// =====================================================================
const MR = 6378137, MC = 2 * Math.PI * MR;
const mercXY = (lat, lon) => [MR * lon * D2R, MR * Math.log(Math.tan(Math.PI / 4 + lat * D2R / 2))];
const ESRI = (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
const TERR = (z, x, y) => `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;
const tileXYf = (lat, lon, z) => { const n = 2 ** z, m = mercXY(lat, lon); return [(m[0] / MC + 0.5) * n, (0.5 - m[1] / MC) * n]; };

// ---------- 緯度経度 ⇔ ゲームの 座標 ----------
//  ゲームでは z が 進む向き、x は 左（右 = -x）。bearing：進む向きの 方位（北から 時計まわり）
//  K：ぜんぶを K ばいに ひきのばす（ゲームの 速さに あわせる）
class Geo {
  constructor(lat, lon, bearing, K) {
    this.lat = lat; this.lon = lon; this.B = bearing * D2R; this.K = K;
    const m = mercXY(lat, lon); this.Mx0 = m[0]; this.My0 = m[1]; this.c0 = Math.cos(lat * D2R);
    this.sB = Math.sin(this.B); this.cB = Math.cos(this.B);
  }
  toWorld(lat, lon) {   // → [x, z]
    const m = mercXY(lat, lon), e = (m[0] - this.Mx0) * this.c0, n = (m[1] - this.My0) * this.c0;
    return [-(e * this.cB - n * this.sB) * this.K, (e * this.sB + n * this.cB) * this.K];
  }
  toMerc(x, z) {        // ゲーム座標 → メルカトル m
    const f = z / this.K, r = -x / this.K;
    return [this.Mx0 + (f * this.sB + r * this.cB) / this.c0, this.My0 + (f * this.cB - r * this.sB) / this.c0];
  }
  // 地面の m（東, 北）→ ゲーム
  enToWorld(e, n) { return [-(e * this.cB - n * this.sB) * this.K, (e * this.sB + n * this.cB) * this.K]; }
  // メルカトル範囲（左 L, 上 T, 幅 W, 高さ H）の 画像で、u = a x + b z + c の 係数
  affine(L, T, W, H) {
    const k = 1 / (this.K * this.c0);
    // e = (z sB - x cB)/K,  n = (z cB + x sB)/K
    return {
      u: [-this.cB * k / W, this.sB * k / W, (this.Mx0 - L) / W],
      v: [-this.sB * k / H, -this.cB * k / H, (T - this.My0) / H]
    };
  }
}

// ---------- 通信 ----------
const Net = {
  q: [], busy: 0, MAX: 10, bytes: 0,
  img(url) { return new Promise(res => { this.q.push({ url, res, n: 0 }); this.pump(); }); },
  pump() {
    while (this.busy < this.MAX && this.q.length) {
      const j = this.q.shift(); this.busy++;
      const im = new Image(); im.crossOrigin = 'anonymous';
      const done = ok => {
        this.busy--;
        if (ok) j.res(im); else if (++j.n < 3) setTimeout(() => { this.q.push(j); this.pump(); }, 400 * j.n); else j.res(null);
        this.pump();
      };
      im.onload = () => done(true); im.onerror = () => done(false);
      im.src = j.url;
    }
  }
};

// タイルの 範囲を きめる（中心 lat/lon、片がわ half(m)、ズーム z、最大 cap まい）
function tileRange(geo, o) {
  const n = 2 ** o.z, c = tileXYf(o.lat ?? geo.lat, o.lon ?? geo.lon, o.z), tileM = MC / n * geo.c0, half = o.half / tileM;
  const cap = o.cap || 8;
  const nx = Math.min(cap, Math.floor(c[0] + half) - Math.floor(c[0] - half) + 1), ny = Math.min(cap, Math.floor(c[1] + half) - Math.floor(c[1] - half) + 1);
  const tx0 = Math.round(c[0] - nx / 2), ty0 = Math.round(c[1] - ny / 2);
  return { z: o.z, tx0, ty0, nx, ny, n, left: (tx0 / n - 0.5) * MC, top: (0.5 - ty0 / n) * MC, W: nx * MC / n, H: ny * MC / n };
}

// ---------- 衛星写真（1まいの 大きな 絵に つなぐ） ----------
class ImgLevel {
  constructor(geo, o) { Object.assign(this, tileRange(geo, o)); this.geo = geo; this.fade = o.fade ?? 0.08; this.cpu = null; }

    const cv = this.cv = document.createElement('canvas'); cv.width = this.nx * 256; cv.height = this.ny * 256;
    const g = cv.getContext('2d'); let okN = 0;
    const jobs = [];
    for (let j = 0; j < this.ny; j++) for (let i = 0; i < this.nx; i++)
      jobs.push(Net.img(ESRI(this.z, this.tx0 + i, this.ty0 + j)).then(im => { if (im) { g.drawImage(im, i * 256, j * 256); okN++; } }));
    await Promise.all(jobs);

    const t = this.tex = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace; t.flipY = false; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
    t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    this.aff = this.geo.affine(this.left, this.top, this.W, this.H);
    return this;
  }
  // CPU で 色を しらべるための 小さな 配列

    const g = c2.getContext('2d', { willReadFrequently: true }); g.drawImage(this.cv, 0, 0, Sw, Sh);
    this.cpu = { Sw, Sh, d: g.getImageData(0, 0, Sw, Sh).data };
  }
  // ゲーム座標 (x,z) の 色（0〜1）。はんいの 外は null
  color(x, z, out) {
    this.ensureCpu();
    const a = this.aff, u = a.u[0] * x + a.u[1] * z + a.u[2], v = a.v[0] * x + a.v[1] * z + a.v[2];

// ---------- 標高 ----------
class DemLevel {
  constructor(geo, o) { Object.assign(this, tileRange(geo, o)); this.geo = geo; }
  async load() {
    const W = this.nx * 256, H = this.ny * 256; this.w = W; this.h = H;
    const d = this.d = new Float32Array(W * H), ok = this.ok = new Uint8Array(this.nx * this.ny), tmp = document.createElement('canvas'); tmp.width = tmp.height = 256;
    const g = tmp.getContext('2d', { willReadFrequently: true });
    let okN = 0;
    const ims = [];
    for (let j = 0; j < this.ny; j++) for (let i = 0; i < this.nx; i++) ims.push(Net.img(TERR(this.z, this.tx0 + i, this.ty0 + j)).then(im => [i, j, im]));
    for (const p of ims) {
      const [i, j, im] = await p; if (!im) continue;
      g.clearRect(0, 0, 256, 256); g.drawImage(im, 0, 0);
      const px = g.getImageData(0, 0, 256, 256).data; okN++; ok[j * this.nx + i] = 1;
      for (let y = 0; y < 256; y++) { const row = (j * 256 + y) * W + i * 256; for (let x = 0; x < 256; x++) { const k = (y * 256 + x) * 4; const e = px[k] * 256 + px[k + 1] + px[k + 2] / 256 - 32768; d[row + x] = e < -40 ? -3 : e; } }
    }
    this.okN = okN;
    return this;
  }
  // メルカトル (mx,my) の 標高。範囲外は null。edge：ふちからの 近さ（0〜1）
  at(mx, my) {
    const fx = (mx - this.left) / this.W * this.w - 0.5, fy = (this.top - my) / this.H * this.h - 0.5;
    if (fx < 0 || fy < 0 || fx > this.w - 1 || fy > this.h - 1) return null;
    const x0 = fx | 0, y0 = fy | 0, x1 = Math.min(this.w - 1, x0 + 1), y1 = Math.min(this.h - 1, y0 + 1), tx = fx - x0, ty = fy - y0, d = this.d, w = this.w;
    if (!this.ok[(y0 >> 8) * this.nx + (x0 >> 8)] || !this.ok[(y1 >> 8) * this.nx + (x1 >> 8)]) return null;
    const a = d[y0 * w + x0], b = d[y0 * w + x1], c = d[y1 * w + x0], e = d[y1 * w + x1];
    return (a + (b - a) * tx) * (1 - ty) + (c + (e - c) * tx) * ty;
  }
  edge(mx, my) {
    const u = (mx - this.left) / this.W, v = (this.top - my) / this.H;
    return Math.min(u, 1 - u, v, 1 - v);
  }
}
class DemSet {
  constructor(levels) { this.L = levels; }   // あらい → こまかい の じゅん
  at(mx, my) {
    let h = null;
    for (const L of this.L) {
      const v = L.at(mx, my); if (v == null) continue;
      if (h == null) h = v; else h = lerp(h, v, smooth(0, 0.03, L.edge(mx, my)));
    }
    return h == null ? 0 : h;
  }
}

// ---------- 地面に はる 材料（3まいの 写真を かさねる） ----------
function realTerrainMat(imgs, grade, overlay) {
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff, vertexColors: true });
  fogPatch(m);
  const prev = m.onBeforeCompile;
  const U = { uGrade: { value: new THREE.Vector4(grade.gamma, grade.sat, grade.gain, grade.flat) }, uDet: { value: grade.detail ?? 0.35 }, uNoiseT: { value: TEX.detail } };
  if (overlay) { U.uOvT = { value: overlay.tex }; U.uOvR = { value: new V3(...overlay.rect) }; U.uOvK = overlay.k; }
  imgs.forEach((L, i) => { U['uMap' + i] = { value: L.tex }; U['uU' + i] = { value: new V3(...L.aff.u) }; U['uV' + i] = { value: new V3(...L.aff.v) }; U['uFd' + i] = { value: L.fade }; });
  const n = imgs.length;
  m.onBeforeCompile = sh => {
    prev(sh);
    Object.assign(sh.uniforms, U);
    let decl = 'uniform vec4 uGrade; uniform float uDet; uniform sampler2D uNoiseT;\n' + (overlay ? 'uniform sampler2D uOvT; uniform vec3 uOvR; uniform float uOvK;\n' : ''), body = '';
    for (let i = 0; i < n; i++) decl += `uniform sampler2D uMap${i}; uniform vec3 uU${i}; uniform vec3 uV${i}; uniform float uFd${i};\n`;
    body += `vec3 wq=vec3(vFW.x,vFW.z,1.0); vec3 col=vec3(0.0);\n`;
    for (let i = 0; i < n; i++) {
      body += `{ vec2 uv=vec2(dot(uU${i},wq),dot(uV${i},wq)); vec4 t=texture2D(uMap${i},uv);\n`;
      if (i === 0) body += `col=t.rgb; }\n`;
      else body += `float e=min(min(uv.x,1.0-uv.x),min(uv.y,1.0-uv.y)); float w=smoothstep(0.0,uFd${i},e)*t.a; col=mix(col,t.rgb,w); }\n`;
    }
    if (overlay) body += `{ vec2 lu=(vFW.xz-uOvR.xy)/uOvR.z; if(lu.x>0.0&&lu.y>0.0&&lu.x<1.0&&lu.y<1.0){ float L=texture2D(uOvT,lu).r; col=mix(col,col*0.45+vec3(0.5,0.38,0.27),L*uOvK); } }\n`;
    body += `{ float lum=dot(col,vec3(0.299,0.587,0.114)); col=pow(max(col,vec3(0.0)),vec3(uGrade.x)); col=mix(vec3(lum),col,uGrade.y)*uGrade.z;
      float n1=texture2D(uNoiseT,vFW.xz*0.37).r, n2=texture2D(uNoiseT,vFW.xz*0.071).r;
      float dd=length(vFW-cameraPosition); float fadeN=1.0/(1.0+dd*0.004);
      col*=1.0+(n1-0.5)*uDet*fadeN+(n2-0.5)*uDet*0.6; }
    diffuseColor.rgb*=col;`;
    sh.fragmentShader = sh.fragmentShader
      .replace('varying vec3 vFW;', 'varying vec3 vFW;\n' + decl)
      .replace('#include <map_fragment>', body)
      .replace('#include <opaque_fragment>', `{ vec3 fl=diffuseColor.rgb*(uSunCol*0.5+uZen*0.3+vec3(0.2)); outgoingLight=mix(outgoingLight,fl,uGrade.w); }\n#include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'realterrain' + n;
  m.userData.uniforms = U;
  return m;
}

// ---------- 海・川の 水（透けて 底の 写真が 見える） ----------
function seaMat(tint, waveK = 1.0, alpha = 0.55) {
  return shaderMat({
    uniforms: { uNoise: { value: TEX.detail }, uTint: { value: col(tint) }, uWaveK: { value: waveK }, uAlpha: { value: alpha } },
    vertexShader: /* glsl */`varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: /* glsl */`varying vec3 vW; uniform sampler2D uNoise; uniform vec3 uTint; uniform float uWaveK; uniform float uAlpha;
    void main(){
      vec2 p=vW.xz; float t=uTime; vec2 g=vec2(0.0);
      for(int i=0;i<5;i++){ float fi=float(i); float a=fi*2.1+0.4; vec2 dir=vec2(cos(a),sin(a));
        float fr=0.05*pow(1.75,fi); float amp=0.5/pow(1.9,fi); float ph=dot(dir,p)*fr+t*(0.9+fi*0.45); g+=dir*fr*amp*cos(ph); }
      vec2 q1=p*0.021+vec2(t*0.010,t*0.007), q2=p*0.047-vec2(t*0.009,-t*0.012); float e=0.004;
      float n0=texture2D(uNoise,q1).r+texture2D(uNoise,q2).r, nx=texture2D(uNoise,q1+vec2(e,0.0)).r+texture2D(uNoise,q2+vec2(e,0.0)).r, nz=texture2D(uNoise,q1+vec2(0.0,e)).r+texture2D(uNoise,q2+vec2(0.0,e)).r;
      g=g*uWaveK+vec2(nx-n0,nz-n0)*7.0*uWaveK;
      vec3 n=normalize(vec3(-g.x,1.0,-g.y)); vec3 v=normalize(vW-cameraPosition);
      vec3 r=reflect(v,n); r.y=abs(r.y)+0.03; r=normalize(r);
      float f=0.03+0.97*pow(1.0-max(dot(-v,n),0.0),5.0);
      vec3 c=mix(uTint,skyCol(r),f);
      float sp=pow(max(dot(r,uSunDir),0.0),260.0)*7.0+pow(max(dot(r,uSunDir),0.0),40.0)*0.25; c+=uSunCol*sp*uGlow;
      float a=clamp(uAlpha+(1.0-uAlpha)*f+sp*0.3,0.0,1.0);
      gl_FragColor=vec4(applyFog(toOut(c),vW),a);
    }`,
    transparent: true, depthWrite: false
  });
}

// ---------- 場所の 部品（実際の 地形・写真・ 道すじ） ----------
class RealZone extends Zone {
  constructor(def) { super(def); this.real = true; this.imgs = []; this.status = 'idle'; }
  color(x, z, out = [0, 0, 0]) { for (let i = this.imgs.length - 1; i >= 0; i--) { const c = this.imgs[i].color(x, z, out); if (c) return c; } return null; }
  // x,z の ゲーム座標 → 標高 (m, 実際の)
  realElev(x, z) { const m = this.geo.toMerc(x, z); return this.dem.at(m[0], m[1]); }
  // 道すじの 点（緯度, 経度, 地面からの 高さ, その他）
  wp(lat, lon, agl, o = {}) { const w = this.geo.toWorld(lat, lon); return Object.assign({ p: [w[0], 0, w[1]], g: agl }, o); }
  unload() {
    if (this.status === 'idle') return;
    this.group.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    for (const L of this.imgs) L.dispose();
    this.imgs = []; this.group.clear(); scene.remove(this.group); this.status = 'idle';
  }
}

// 場所を つくる（通信 → 組み立て。重い所は コマを またぐ）
async function buildRealZone(def, onStep) {
  const t0 = performance.now();
  const z = new RealZone(def); z.status = 'loading';
  const geo = z.geo = new Geo(def.geo.lat, def.geo.lon, def.geo.bearing, def.geo.K);
  const cap = HI ? 8 : 6;
  // 通信：標高と 写真を いっぺんに
  const demL = (def.dem || []).map(o => new DemLevel(geo, o));
  const imgL = (def.imagery || []).map(o => new ImgLevel(geo, Object.assign({}, o, { cap: HI ? (o.cap || cap) : Math.min(o.cap || cap, 6) })));
  await Promise.all([...demL.map(d => d.load()), ...imgL.map(i => i.load())]);
  if (demL.every(d => d.okN === 0)) throw new Error('標高が とれませんでした');
  if (imgL.every(i => i.okN === 0)) throw new Error('写真が とれませんでした');
  z.dem = new DemSet(demL.filter(d => d.okN > 0)); z.imgs = imgL.filter(i => i.okN > 0);
  await frame();
  // 標高（基準の 高さは 場所の 中心）
  const base = z.baseElev = def.baseElev != null ? def.baseElev : z.dem.at(geo.Mx0, geo.My0) + (def.baseAdd || 0);
  if (def.pre) def.pre(z);
  const rough = def.rough;
  z.hf = (x, zz) => {
    const m = geo.toMerc(x, zz); let e = z.dem.at(m[0], m[1]);
    if (def.sharpen) { const r = def.sharpen[1] / geo.c0, av = (z.dem.at(m[0] + r, m[1]) + z.dem.at(m[0] - r, m[1]) + z.dem.at(m[0], m[1] + r) + z.dem.at(m[0], m[1] - r)) / 4; e += def.sharpen[0] * (e - av); }
    let h = (e - base) * geo.K;
    if (rough) h += rough[0] * (fbm(x / rough[1] + 5.3, zz / rough[1] - 2.1, 3) - 0.5) * 2 * smooth(0, rough[2] ?? 40, Math.abs(h));
    return def.hfix ? def.hfix(h, x, zz, z) : h;
  };
  const E = def.ext, B = def.bands || {};
  const qs = HI ? 1 : 2, sb = a => (a || []).map(b => [b[0], b[1], b[2] * qs]);
  const xs = axisBands(E[0], E[1], sb(B.x), E[4] || 110), zs = axisBands(E[2], E[3], sb(B.z), E[4] || 110);
  z.grid = await Grid.make(xs, zs, z.hf);
  await frame();
  const overlay = def.overlay ? def.overlay(z) : null;
  z.lineK = overlay ? overlay.k : null;
  z.mat = realTerrainMat(z.imgs, Object.assign({ gamma: 1, sat: 1, gain: 1, flat: 0.5, detail: 0.35 }, def.grade || {}), overlay);
  z.group.add(z.grid.mesh(() => TC.setRGB(1, 1, 1), z.mat, 1 / 14));
  if (def.water != null) {
    z.water = (def.water - base) * geo.K;
    const wm = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), seaMat(def.waterTint || '#1c4a5a', def.waveK || 1, def.waterAlpha ?? 0.5));
    wm.rotation.x = -Math.PI / 2; wm.position.y = z.water; wm.renderOrder = 2;
    z.waterMesh = wm; z.group.add(wm);
  }
  await frame();
  // 道すじは 場所ごとの 組み立て（建物・木・見どころ）が きめる
  const ctrl = await def.build(z, { frame, geo });
  z.path = new Path(ctrl, z, def.pathSmooth);
  await frame();
  await z.path.corridor();
  z.puffList = z.clouds ? z.clouds(z, z.path) : [];
  scene.add(z.group);
  // 画面に 出す 前に 写真を GPU へ送り、色づけの しくみを 作っておく（飛んでいる 途中で とまらないように）
  for (const L of z.imgs) { try { renderer.initTexture(L.tex); } catch (e) {} await frame(); }
  z.group.visible = true;
  try { await renderer.compileAsync(scene, camera); } catch (e) {}
  z.group.visible = false;
  z.status = 'ready';
  if (DBG) console.log('real zone', z.key, 'len', z.path.len, 'ms', (performance.now() - t0).toFixed(0), 'base', base.toFixed(0), 'imgs', z.imgs.map(i => i.z + ':' + i.okN + '/' + i.nx * i.ny).join(' '));
  return z;
}
// 色から 木・草の 量を きめる（緑ほど 多い）
function greenness(c) { return clamp((c[1] - Math.max(c[0] * 0.92, c[2] * 1.1)) * 6 + 0.05, 0, 1); }
// 写真の 色で そだてる 木（雲・建物・水の 所は さける）
async function scatterReal(z, type, count, area, densFn, seed, sMin, sMax, tintFn) {
  const R = rng(seed), list = [], c = [0, 0, 0];
  let tries = 0;
  while (list.length < count && tries < count * 40) {
    tries++;
    const x = lerp(area[0], area[1], R()), zz = lerp(area[2], area[3], R());
    if ((tries & 1023) === 0) await frame();
    const cc = z.color(x, zz, c); if (!cc) continue;
    const d = densFn(x, zz, cc, z); if (R() > d) continue;
    list.push([x, z.grid.h(x, zz) - 0.3 * sMax, zz, lerp(sMin, sMax, R()), R() * 6.28, R(), cc[0], cc[1], cc[2]]);
  }
  const m = new THREE.InstancedMesh(TreeGeo[type], z.treeMat || (z.treeMat = treeMat()), list.length);
  const o = new THREE.Object3D(), cc = new THREE.Color();
  list.forEach((t, i) => {
    o.position.set(t[0], t[1], t[2]); o.rotation.set(0, t[4], 0); o.scale.setScalar(t[3]); o.updateMatrix(); m.setMatrixAt(i, o.matrix);
    if (tintFn) tintFn(cc, t); else cc.setRGB(t[6] * 2.1, t[7] * 2.3, t[8] * 1.7);
    cc.multiplyScalar(0.8 + t[5] * 0.4); m.setColorAt(i, cc);
  });
  m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true;
  m.computeBoundingSphere(); m.receiveShadow = HI;
  return m;
}

// ---------- 建物（OSM の 形を 箱＋屋根に する） ----------
// 向きつきの 箱を 場所ごとに 覚えておいて、地面の 高さ（屋根の 上）を 返す
class RectField {
  constructor(cell = 24) { this.cell = cell; this.h = new Map(); this.list = []; }
  add(cx, cz, hx, hz, yaw, top) {
    const i = this.list.length; this.list.push([cx, cz, hx, hz, Math.cos(yaw), Math.sin(yaw), top]);
    const r = Math.hypot(hx, hz), c = this.cell;
    for (let a = Math.floor((cx - r) / c); a <= Math.floor((cx + r) / c); a++) for (let b = Math.floor((cz - r) / c); b <= Math.floor((cz + r) / c); b++) {
      const k = a * 100003 + b; let l = this.h.get(k); if (!l) { l = []; this.h.set(k, l); } l.push(i);
    }
  }
  at(x, z) {
    const l = this.h.get(Math.floor(x / this.cell) * 100003 + Math.floor(z / this.cell)); if (!l) return -1e4;
    let best = -1e4;
    for (const i of l) {
      const r = this.list[i], dx = x - r[0], dz = z - r[1], u = dx * r[4] - dz * r[5], v = dx * r[5] + dz * r[4];
      if (Math.abs(u) < r[2] && Math.abs(v) < r[3] && r[6] > best) best = r[6];
    }
    return best;
  }
}
// spec(code, w, d, cx, cz) → { h, roof, wall:Color, rc:Color, base?, piles? } か null
function buildFootprints(z, list, spec, field) {
  const gb = new GeoB(), geo = z.geo, wood = new THREE.Color('#6a4a34');
  let n = 0;
  for (const [code, flat] of list) {
    const pts = []; for (let i = 0; i < flat.length; i += 2) pts.push(geo.enToWorld(flat[i], flat[i + 1]));
    let cx = 0, cz = 0; for (const p of pts) { cx += p[0]; cz += p[1]; } cx /= pts.length; cz /= pts.length;
    let sxx = 0, szz = 0, sxz = 0; for (const p of pts) { const dx = p[0] - cx, dz = p[1] - cz; sxx += dx * dx; szz += dz * dz; sxz += dx * dz; }
    const a = 0.5 * Math.atan2(2 * sxz, sxx - szz), ca = Math.cos(a), sa = Math.sin(a);
    let u0 = 1e9, u1 = -1e9, v0 = 1e9, v1 = -1e9;
    for (const p of pts) { const dx = p[0] - cx, dz = p[1] - cz, u = dx * ca + dz * sa, v = -dx * sa + dz * ca; u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v); }
    const w = u1 - u0, d = v1 - v0, mx = cx + ca * (u0 + u1) / 2 - sa * (v0 + v1) / 2, mz = cz + sa * (u0 + u1) / 2 + ca * (v0 + v1) / 2;
    if (w < 1.5 || d < 1.5) continue;
    const s = spec(code, w, d, mx, mz); if (!s) continue;
    let g = 1e9; for (const p of pts) g = Math.min(g, z.hf(p[0], p[1])); g = Math.min(g, z.hf(mx, mz));
    let base = g - 0.6;
    const ry = -a;
    if (s.piles && z.water != null) {
      base = z.water + s.piles;            // 水の 上に 床を はる
      gb.add(new THREE.BoxGeometry(w + 0.8, 0.7, d + 0.8), mtx(mx, base - 0.35, mz, ry), wood);
      gb.add(new THREE.BoxGeometry(w, base - (z.water - 4), d), mtx(mx, (base + z.water - 4) / 2, mz, ry), wood);   // 下は 柱の かたまり
    } else if (z.water != null && g < z.water) base = z.water;
    const wc = s.wall;
    gb.add(new THREE.BoxGeometry(w, s.h + (base - g) * 0 + 1, d), mtx(mx, base + s.h / 2, mz, ry), wc, (x, y, zz, c) => TC.copy(c).multiplyScalar(0.88 + 0.12 * vnoise(x * 0.7, y * 0.9 + zz * 0.7)));
    if (s.roof) gb.add(roofGeo(w, d, s.roof, s.over ?? 0.6), mtx(mx, base + s.h + 0.5, mz, ry), s.rc);
    if (field) field.add(mx, mz, w / 2 + 0.5, d / 2 + 0.5, ry, base + s.h + (s.roof ? s.roof * 0.5 : 0));
    n++;
  }
  return gb;
}
// 石垣・壁の 線（多角形の ふちを 細い 壁に する。屋根なし）
function buildRuinWalls(z, list, thick, hgt, colorFn, field) {
  const gb = new GeoB(), geo = z.geo;
  for (const [code, flat] of list) {
    const pts = []; for (let i = 0; i < flat.length; i += 2) pts.push(geo.enToWorld(flat[i], flat[i + 1]));
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length], L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (L < 0.8) continue;

//  ストーンヘンジ（イギリス）  K = 4.5：石の 高さが ちょうど 実物の 4.5倍
// ---------------------------------------------------------------------
function buildHenge(z) {
  const sar = P('#a49f90'), lich = P('#aaa36a'), dark = P('#6f6b62');
  const stoneC = (x, y, zz, c) => { const t = cmix(c, lich, smooth(0.62, 0.85, vnoise(x / 2.3, zz / 2.3 + y / 3)) * 0.5); return t.lerp(dark, smooth(4, 0, y) * 0.35 + (vnoise(x * 0.9, y * 0.9 + zz) - 0.5) * 0.3); };
  const b = new GeoB(), R = rng(31);
  const RR = 74, H = 18.5, missing = new Set([8, 9, 12, 14, 15, 16, 19, 22]);
  const ang = i => { let a = (6 + 12 * i) * D2R; if (i === 0) a += 3.5 * D2R; if (i === 29) a -= 3.5 * D2R; return a; };
  const pos = i => new V3(RR * Math.sin(ang(i)), 0, -RR * Math.cos(ang(i)));
  const hts = [];
  for (let i = 0; i < 30; i++) {
    hts[i] = H + (R() - 0.5) * 2.2;
    if (missing.has(i)) continue;
    const p = pos(i), a = ang(i), tilt = (R() - 0.5) * 0.06;
    b.add(rockBox(9.5, hts[i] + 2, 5, [2, 4, 2], 0.09, i), mtx(p.x, hts[i] / 2 - 1, p.z, -a, tilt, (R() - 0.5) * 0.05), sar, stoneC);
    z.addObb(new Obb(p.x, hts[i] / 2, p.z, 5.2, hts[i] / 2 + 0.5, 2.8, -a));
  }
  for (let i = 0; i < 30; i++) {
    const j = (i + 1) % 30;
    if (missing.has(i) || missing.has(j) || [5, 18, 26].includes(i) || i === 29) continue;
    const p = pos(i), q = pos(j), m = p.clone().add(q).multiplyScalar(0.5), L = p.distanceTo(q);
    const a = Math.atan2(q.x - p.x, q.z - p.z) + Math.PI / 2, y = Math.max(hts[i], hts[j]) + 1.6;
    b.add(rockBox(L + 1.5, 3.4, 4.4, [3, 1, 1], 0.07, i + 50), mtx(m.x, y, m.z, a, 0, (R() - 0.5) * 0.04), sar, stoneC);
    z.addObb(new Obb(m.x, y, m.z, L / 2 + 0.6, 1.8, 2.3, a));
  }
  for (const [i, rot] of [[14, 0.7], [15, -0.4], [19, 1.2]]) {
    const p = pos(i).add(new V3((R() - 0.5) * 10, 0, (R() - 0.5) * 10));
    b.add(rockBox(18, 4.6, 8.5, [3, 1, 2], 0.09, i + 90), mtx(p.x, 1.6, p.z, rot, 0.05, 0.03), sar, stoneC);
    z.addObb(new Obb(p.x, 1.6, p.z, 9.5, 2.6, 4.6, rot));
  }
  // 三つ石の 馬てい形
  [[180, 33], [128, 28], [232, 28], [76, 25], [284, 25]].forEach(([deg, th], k) => {
    const a = deg * D2R, cx = 40 * Math.sin(a), cz = -40 * Math.cos(a), tx = Math.cos(a), tz = Math.sin(a);
    if (k === 4) {
      b.add(rockBox(30, 5, 9, [3, 1, 2], 0.09, 300), mtx(cx + 6, 2, cz - 4, -a + 0.5), sar, stoneC);
      z.addObb(new Obb(cx + 6, 2, cz - 4, 15.5, 3, 5, -a + 0.5)); return;
    }
    for (const sgn of [-1, 1]) {
      const x = cx + tx * sgn * 5.4, zz = cz + tz * sgn * 5.4;
      b.add(rockBox(9, th + 2, 5.5, [2, 4, 2], 0.08, k * 7 + sgn), mtx(x, th / 2 - 1, zz, -a, (R() - 0.5) * 0.04), sar, stoneC);
      z.addObb(new Obb(x, th / 2, zz, 4.9, th / 2 + 0.5, 3.1, -a));
    }
    b.add(rockBox(22, 4, 5.4, [3, 1, 1], 0.07, k * 11), mtx(cx, th + 2, cz, -a), sar, stoneC);
    z.addObb(new Obb(cx, th + 2, cz, 11.4, 2.2, 3, -a));
  });
  // 小さな 青石の 輪
  const blue = P('#7d8088');
  for (let i = 0; i < 40; i++) {
    if (R() < 0.55) continue;
    const a = (i / 40) * Math.PI * 2 + 0.05, x = 58 * Math.sin(a), zz = -58 * Math.cos(a), h = 6 + R() * 3;
    b.add(rockBox(3.2, h, 2.4, [1, 2, 1], 0.12, i + 400), mtx(x, h / 2 - 0.6, zz, -a + (R() - 0.5) * 0.3, (R() - 0.5) * 0.1), blue, stoneC);
    z.addObb(new Obb(x, h / 2, zz, 1.8, h / 2, 1.4, -a, false));
  }
  // ヒールストーン（77m の 軸の 上）
  b.add(rockBox(8, 22, 7, [2, 4, 2], 0.14, 777), mtx(2, 9.5, -346, 0.3, 0.16, -0.1), sar, stoneC);
  z.addObb(new Obb(2, 10, -346, 4.4, 11, 4, 0.3));
  z.group.add(b.mesh(MAT.land));
  z.focus = { c: new V3(0, 15, 0), r: 170 };
}

// ---------- 場所の 管理（通信は うしろで すすめる。だめなら 手作りの 版に もどす） ----------
const ZoneMgr = {
  proc: [], st: [], prom: [],
  init() { this.proc = ZONES.slice(); this.st = ZONES.map(() => 'idle'); this.prom = ZONES.map(() => null); },
  ready(i) { return this.st[i] === 'ready'; },
  async buildProc(z) {
    if (z.built) return;
    const ctrl = z.build(z); z.path = new Path(ctrl, z); await z.path.corridor();
    z.puffList = z.clouds ? z.clouds(z, z.path) : []; scene.add(z.group); z.built = true;
  },
  prep(i) {
    if (this.prom[i]) return this.prom[i];
    this.st[i] = 'loading';
    return this.prom[i] = (async () => {
      const key = this.proc[i].key, def = ZREAL[key];
      let z = null;
      if (def && !Q.has('proc') && i > 0) {
        try { z = await buildRealZone(def); }
        catch (e) { console.warn('実際の 場所を つくれませんでした', key, e); }
      }
      if (!z) { await frame(); z = this.proc[i]; await this.buildProc(z); }
      ZONES[i] = z; this.st[i] = 'ready'; return z;
    })();
  },
  unload(i) {
    const z = ZONES[i];
    if (z && z.real && z.status === 'ready') { z.unload(); this.st[i] = 'idle'; this.prom[i] = null; ZONES[i] = this.proc[i]; }
  }

//  厳島神社（日本）  K = 1.5：海に たつ 大鳥居を くぐり、社殿の 上を とび、森へ のぼる
//  建物の 形は OSM（OpenStreetMap contributors）
// ---------------------------------------------------------------------
function buildTorii(z, gb, wx, wz, ry, K) {
  const red = P('#c8432c'), blk = P('#211b19'), k = K;
  const M = (x, y, zz) => { const c = Math.cos(ry), s = Math.sin(ry); return [wx + (x * c + zz * s) * k, y * k, wz + (-x * s + zz * c) * k]; };
  const piece = (geo, x, y, zz, rz = 0, ox = 0, color = red) => { const p = M(x, y, zz); gb.add(geo, mtx(p[0], p[1], p[2], ry, 0, rz), color); };
  const y0 = (z.water ?? 0) / k - 1;   // 水面から 立つ
  for (const sx of [-1, 1]) {
    piece(new THREE.CylinderGeometry(0.5 * k, 0.62 * k, 17.2 * k, 16), sx * 5.45, y0 + 8.1, 0);
    for (const sz of [-1, 1]) {
      piece(new THREE.CylinderGeometry(0.3 * k, 0.4 * k, 10.6 * k, 12), sx * 5.45, y0 + 3.3, sz * 3.2);
      const p = M(sx * 5.45, y0 + 3.5, sz * 3.2); z.addObb(new Obb(p[0], p[1], p[2], 0.7 * k, 5.4 * k, 0.7 * k, ry, true));
    }
    const p = M(sx * 5.45, y0 + 9, 0); z.addObb(new Obb(p[0], p[1], p[2], 0.85 * k, 9 * k, 0.85 * k, ry));
    piece(new THREE.BoxGeometry(0.55 * k, 0.6 * k, 8.4 * k), sx * 5.45, y0 + 9.6, 0);
  }
  piece(new THREE.BoxGeometry(14.4 * k, 0.55 * k, 0.55 * k), 0, y0 + 10.4, 0);
  piece(new THREE.BoxGeometry(14.8 * k, 0.85 * k, 0.8 * k), 0, y0 + 14.6, 0);
  piece(new THREE.BoxGeometry(0.7 * k, 2.2 * k, 0.5 * k), 0, y0 + 12.5, 0);
  // かさ木（はしが 反った 屋根）
  const seg = 14;
  for (let i = 0; i < seg; i++) {
    const x0 = (i / seg - 0.5) * 24.4, x1 = ((i + 1) / seg - 0.5) * 24.4, xm = (x0 + x1) / 2, c = x => 1.2 * Math.pow(x / 12.2, 2) + 0.15 * Math.abs(x / 12.2);
    const rz = Math.atan2(c(x1) - c(x0), x1 - x0) * -1;
    piece(new THREE.BoxGeometry((x1 - x0) * 1.04 * k, 0.9 * k, 1.9 * k), xm, y0 + 15.5 + c(xm), 0, rz);
    piece(new THREE.BoxGeometry((x1 - x0) * 1.04 * k, 0.65 * k, 2.6 * k), xm, y0 + 16.35 + c(xm), 0, rz, 0, blk);
  }
  const p = M(0, y0 + 16, 0); z.addObb(new Obb(p[0], p[1], p[2], 12.6 * k, 1.4 * k, 1.5 * k, ry));
}

const SPEEDK = 1.45;
const Fly = {
  zi: 0, z: null, s: 0, x: 0, y: 0, vx: 0, vy: 0, v: 0, boost: 0, kick: 0, flapT: 9,
  pos: new V3(), vel: new V3(), A: pathPoint(), agl: 99, surfKind: null,
  camF: new V3(0, 0, 1), camU: new V3(0, 1, 0), fov: 72, sideL: 0, sideR: 0, frameN: 0,
  prevSky: null, cuesDone: new Set(), climbT: 0, run: 0, time: 0, flying: false,

    }

  },
  // s・x・y から 位置を きめる
  place(snap) {
    const z = this.z, A = z.path.at(this.s, this.A);
    this.pos.copy(A.P).addScaledVector(A.R, this.x).addScaledVector(A.U, this.y);
    if (snap) {
      this.camF.copy(A.T); this.camU.copy(A.U);
    }
  },
  reset() {
    this.cuesDone.clear(); this.prevSky = null; this.z && (this.z.group.visible = false); this.z = null;
    this.boost = 0; this.kick = 0; this.v = 0; this.time = 0; this.flying = false;
    this.enter(0, 0);
  },
  // とぶ 1コマ
  update(dt, inp) {
    const z = this.z, path = z.path;
    let A = path.at(this.s, this.A);

    const vert = smooth(0.55, 0.85, Math.abs(A.T.y));

    if (inp.flap) { this.boost = Math.min(this.boost + 11, 40); this.kick = Math.min(this.kick + 5, 9); this.flapT = 0; Audio_.flap(); }
    this.flapT += dt;
    this.boost = damp(this.boost, 0, 2.4, dt);
    this.kick = damp(this.kick, 0, 0.5, dt);
    const climb = inp.climb, dive = inp.dive;
    let vT = A.v * SPEEDK + this.boost + dive * 16 * (1 - vert);
    vT *= 1 - climb * 0.45 * (1 - vert);
    vT += climb * 22 * vert;

    this.v = damp(this.v, vT, this.v < vT ? 0.8 : 1.4, dt);

    this.s += this.v * dt;

    const g = z.groundAt(this.pos.x, this.pos.z) + CLEAR;
    if (this.pos.y < g) { const need = (g - this.pos.y) / Math.max(A.U.y, 0.3); this.y += need; if (this.vy < 0) this.vy *= 0.3; this.pos.addScaledVector(A.U, need); }

const Space = {
  scene: new THREE.Scene(), t: 0, on: false, R: 6371,
  build() {
    this.U = { uSun: { value: new V3() }, uAlt: { value: 3 }, uR: { value: this.R }, uTime: SU.uTime, uSunVis: { value: 0 }, uFade: { value: 1 }, uFlash: { value: 0 } };
    const mat = new THREE.ShaderMaterial({
      uniforms: this.U,
      vertexShader: /* glsl */`varying vec3 vD; void main(){ vD=position; vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position=p.xyww; }`,
      fragmentShader: /* glsl */`varying vec3 vD; uniform vec3 uSun; uniform float uAlt; uniform float uR; uniform float uTime; uniform float uSunVis; uniform float uFade; uniform float uFlash;
      float h13(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      float hash31(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.yzx+33.33); return fract((p.x+p.y)*p.z); }
      float vn3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
        return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),f.x),mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
                   mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z); }
      float fbm3(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<5;i++){ s+=a*vn3(p); p*=2.07; a*=0.5; } return s; }
      float starL(vec3 d, float sc, float th){
        vec3 p=d*sc; vec3 i=floor(p); vec3 f=fract(p);
        float h=h13(i); if(h<th) return 0.0;
        vec3 c=vec3(h13(i+1.7),h13(i+3.1),h13(i+5.3))*0.6+0.2;
        float tw=0.8+0.2*sin(uTime*(1.0+h*3.0)+h*40.0);
        return smoothstep(0.1,0.0,length(f-c))*(h-th)/(1.0-th)*tw;
      }
      void main(){
        vec3 d=normalize(vD);
        vec3 o=vec3(0.0,uR+uAlt,0.0);
        float ol=length(o); vec3 on=o/ol;
        float b=dot(o,d);
        float sn=length(cross(on,d));
        float hm=ol*sn;                       // 中心から 線までの きょり
        bool toward=b<0.0;
        float hmin=(toward?hm:ol)-uR;         // いちばん 近づく 高さ
        vec3 col=vec3(0.0);
        float sunU=max(dot(d,uSun),0.0);
        // 星
        float st=starL(d,190.0,0.986)*1.4+starL(d,420.0,0.992)*0.9+starL(d,90.0,0.996)*1.6;
        vec3 star=vec3(0.92,0.95,1.0)*st;
        if(toward && hm<uR){
          // 地球に 当たる
          float tt=-b-sqrt((uR-hm)*(uR+hm));
          vec3 p=o+d*tt; vec3 n=normalize(p);
          float mu=dot(n,uSun);
          float land=smoothstep(0.58,0.63,fbm3(n*7.0+vec3(3.1)));
          float cl=smoothstep(0.48,0.78,fbm3(n*48.0+vec3(uTime*0.002,0.0,0.0)))*0.8+smoothstep(0.55,0.8,fbm3(n*160.0))*0.3;
          vec3 day=mix(vec3(0.015,0.06,0.2),vec3(0.12,0.14,0.08),land);

          col+=star*(1.0-clamp(g*4.0,0.0,1.0));

      side: THREE.BackSide, depthWrite: false

    mat.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('void main(){', THREE.ShaderChunk.tonemapping_pars_fragment.replace(/uniform float toneMappingExposure;/, 'float toneMappingExposure=1.0;') + '\nvoid main(){'); };

  start() {

  alt(t) { return 2.5 + 120 * Math.pow(smooth(0.5, 17, t), 1.6); },
  update(dt) {

  }

// ---------- 毎コマ ----------
let last = 0, fpsAcc = 0, fpsN = 0, fps = 60;
const IDLE_IN = { steer: 0, climb: 0, dive: 0, flap: false };
function loop(ts) {
  requestAnimationFrame(loop);
  const raw = last ? (ts - last) / 1000 : 0.016; last = ts;
  fpsAcc += raw; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  if (App.paused) return;
  step(Math.min(0.05, raw), ts);
  render();
}
function step(dt, ts = performance.now()) {
  SU.uTime.value += dt; App.t += dt;
  Body.tick(ts);
  const inp = Input.read(dt);
  const st = App.state;
  if (st === 'space' || st === 'end') {
    const t = Space.update(dt);
    if (st === 'space' && t > 21) { App.setState('end'); App.endHold = 0; }
    if (st === 'end') {
      // もう一回：T の ポーズ か ボタン
      if (Body.mode === 'cam') { if (Body.tposeT > 0.05) App.endHold += dt; else App.endHold = Math.max(0, App.endHold - dt * 2); if (App.endHold > 1.3) { App.endHold = 0; App.again(); } }
      if (Keys.flap !== App.lastKF) { App.lastKF = Keys.flap; App.again(); }
      $('endRingFg').setAttribute('stroke-dashoffset', (295.3 * (1 - clamp(App.endHold / 1.3, 0, 1))).toFixed(1));
      $('endTp').style.display = Body.mode === 'cam' ? '' : 'none';
    }
    Audio_.update({ dt, speed: 60 * Audio_.quiet, boost: 0, roll: 0, sideL: 0, sideR: 0, agl: 999, cloud: 0 });
    return;
  }
  App.lastKF = Keys.flap;
  if (st === 'fly') {
    Fly.update(dt, inp);
    Cue.update(dt, inp);
  } else {
    Fly.place(false);
    if (st === 'ready') {
      if (Body.mode === 'cam') {
        if (Body.tposeT === 0) App.readyArm = true;
        if (App.readyArm && Body.tposeT > 0.8) App.takeoff();
      } else if (Keys.flap !== Input.lastKF0) { Input.lastKF0 = Keys.flap; if (App.t > 0.3) App.takeoff(); }
    }
    if (st === 'guide') guideUpdate(dt);
  }
  Input.lastKF0 = Keys.flap;
  Fly.env(dt);
  // とぶ前は ゆっくり 息をする
  const flyIn = Fly.flying ? inp : IDLE_IN;
  Fly.cam(dt, flyIn);
  if (!Fly.flying) {
    const t = App.t;
    camera.position.y += Math.sin(t * 0.8) * 0.05;
    camera.rotateX(Math.sin(t * 0.37) * 0.006); camera.rotateY(Math.sin(t * 0.23) * 0.01);

  Sky.update(); Puffs.update(dt);
  Arms.update(dt, { eL: Input.eL, eR: Input.eR, speed: Fly.v }, (Fly.flying || st === 'ready') && !(TOUCH && Body.mode !== 'cam') ? 1 : 0);
  // 小さい 鏡
  const showMini = Body.mode === 'cam' && (st === 'fly' || st === 'ready') && (Fly.zi === 0 || Body.lostT > 0.8);
  $('mini').classList.toggle('on', showMini);
  if (showMini) drawMirror($('miniCv'), $('camVideo'), false, 240);
  $('lost').classList.toggle('on', Body.mode === 'cam' && st === 'fly' && Body.lostT > 1.2);
  Streaks.draw(Fly.flying ? smooth(55, 110, Fly.vel.length()) + Fly.kick * 0.04 : 0, dt);
  Audio_.update({ dt, speed: Fly.flying ? Fly.vel.length() : 3, boost: Fly.boost, roll: inp.steer, sideL: Fly.sideL, sideR: Fly.sideR, agl: Fly.agl, cloud: SU.uCloudFog.value });

}

}
function dbgInfo() {
  const el = $('dbgInfo'); el.style.display = 'block';
  el.textContent = `${fps.toFixed(0)}fps ${App.state} z${Fly.zi} ${Fly.z ? Fly.z.key : ''} s${Fly.s.toFixed(0)}/${Fly.z ? Fly.z.path.len : 0}\nv${Fly.v.toFixed(1)} x${Fly.x.toFixed(1)} y${Fly.y.toFixed(1)} agl${Fly.agl.toFixed(1)} t${Fly.time.toFixed(1)}\nst${Input.steer.toFixed(2)} cl${Input.climb.toFixed(2)} dv${Input.dive.toFixed(2)} tp${Body.tposeT.toFixed(1)} draws${renderer.info.render.calls} tri${(renderer.info.render.triangles / 1000).toFixed(0)}k`;
}

// ---------- よみこみ ----------
async function boot() {
  const bar = $('loadBar');
  const prog = p => { bar.style.width = (p * 100).toFixed(0) + '%'; };
  resize(); addEventListener('resize', resize);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', () => setTimeout(resize, 150));
  makeTextures(); makeMats(); buildTreeGeos();
  Sky.build(); Puffs.build(); Grass.build(); Motes.build(); Dust.build(); Shade.build(); Arms.build(); Space.build();
  setIcons(); setupTouch(); Streaks.init();
  prog(0.06); await frame();
  ZoneMgr.init();
  await ZoneMgr.buildProc(ZONES[0]); ZoneMgr.st[0] = 'ready'; ZoneMgr.prom[0] = Promise.resolve(ZONES[0]);
  prog(0.6); await frame();
  Fly.reset();
  try { renderer.compile(scene, camera); } catch (e) {}
  ZoneMgr.prep(1);
  prog(1); await frame();
  App.setState('gate');
  $('load').classList.add('off'); $('fade').classList.add('off');
  requestAnimationFrame(loop);
  if (DBG) setupDbg();
}

// ---------- 確認用（?dbg） ----------
function setupDbg() {
  if (Q.has('clean')) { $('load').style.display = 'none'; $('fade').style.display = 'none'; $('dbgInfo').style.visibility = 'hidden'; const st = document.createElement('style'); st.textContent = '*{transition:none!important}'; document.head.appendChild(st); }
  // MediaPipe が dbg() を よぶので、よべる 関数に しておく
  window.dbg = Object.assign(function () {}, {
    App, Fly, Body, Input, ZONES, Space, SU, renderer, camera, scene, Sky, render, step, THREE, ZoneMgr, Grass, Puffs,
    ready: true,
    pause(b) { App.paused = b; },
    // ゾーン i の s から とぶ
    async go(i, s = 0) { await ZoneMgr.prep(i); Body.mode = Body.mode === 'cam' ? 'cam' : 'off'; Fly.reset(); if (i > 0) { Fly.enter(i, s); } else Fly.s = s; Fly.flying = true; Fly.v = Fly.z.path.at(s, pathPoint()).v; App.setState('fly'); for (let k = 0; k < 4; k++) step(1 / 60); render(); return this.info(); },
    step(sec, d = 1 / 60) { const n = Math.round(sec / d); for (let k = 0; k < n; k++) step(d); render(); return this.info(); },
    // 好きな 場所から 見る（確認用）
    async view(i, s, p, l) { await ZoneMgr.prep(i); Fly.reset(); if (i > 0) Fly.enter(i, s); else Fly.s = s; App.setState('fly'); Fly.flying = true; step(1 / 60); App.paused = true; camera.position.set(...p); camera.up.set(0, 1, 0); camera.lookAt(new V3(...l)); camera.fov = 60; camera.updateProjectionMatrix(); Sky.update(); render(); return this.info(); },
    space(t = 0) { App.toSpace(); for (let k = 0; k < t * 30; k++) step(1 / 30); render(); return this.info(); },
    input(o) { Input.auto = o ? () => o : null; },
    info() { return { st: App.state, zone: Fly.zi, key: Fly.z && Fly.z.key, s: +Fly.s.toFixed(1), len: Fly.z && Fly.z.path.len, v: +Fly.v.toFixed(1), x: +Fly.x.toFixed(1), y: +Fly.y.toFixed(1), agl: +Fly.agl.toFixed(1), time: +Fly.time.toFixed(1), fog: +SU.uCloudFog.value.toFixed(2), pos: Fly.pos.toArray().map(v => +v.toFixed(1)) }; },
    // 道すじが 物や 地面に めりこんでいないか
    // とちゅうの 点を しらべる
    probe(i, s) { const z = ZONES[i], o = z.path.at(s, pathPoint()); return { P: o.P.toArray().map(v => +v.toFixed(1)), g: +z.groundAt(o.P.x, o.P.z).toFixed(1), grid: +z.grid.h(o.P.x, o.P.z).toFixed(1), obst: z.obst.filter(b => b.inside(o.P, 2.4)).map(b => b.c.toArray().map(v => +v.toFixed(0))), lim: [o.limL, o.limR, o.limU, o.limD].map(v => +v.toFixed(1)) }; },
    check() {
      const out = [];
      for (const z of ZONES) { if (!z.path) continue; const P = z.path.P, bad = []; for (let i = 0; i <= z.path.N; i += 2) { const p = new V3(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]); if (z.blocked(p)) bad.push(i); } out.push([z.key, z.path.len, bad.length, bad.slice(0, 12).join(',')]); }
      return out;
    },
    // 全部を とおして 時間を はかる
    async runAll(d = 1 / 30) { for (let i = 0; i < ZONES.length; i++) await ZoneMgr.prep(i); Fly.reset(); Fly.flying = true; App.setState('fly'); let n = 0; const times = []; let zi = 0; while (App.state === 'fly' && n < 60 * 600) { step(d); n++; if (Fly.zi !== zi) { times.push(+(n * d).toFixed(1)); zi = Fly.zi; } } return { total: +(n * d).toFixed(1), zones: times }; },
    async load(i) { await ZoneMgr.prep(i); return ZONES[i].key + ':' + (ZONES[i].real ? 'real' : 'proc'); }
  });
}
boot().catch(e => { console.error(e); $('loadErr').textContent = 'よみこみに しっぱいしました：' + (e && e.message || e); });
</script>
</body>
</html>
