<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>耳でとく 3分間ミステリー｜画面を見ないで遊べる声だけゲーム</title>
<meta name="description" content="事件のお話を聞いて、おかしなところを声で答える推理ゲーム。画面を見ないで遊べるゲーム #4">
<meta property="og:title" content="耳でとく 3分間ミステリー｜画面を見ないで遊べる声だけゲーム">
<meta property="og:description" content="声だけで遊ぶ推理ゲーム。無料・ブラウザで遊べます。">
<meta name="theme-color" content="#120d1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#120d1f; --bg2:#2a1b3d; --ink:#f6f1e6; --dim:#a79fbb;
  --amber:#ffc24b; --cyan:#5fe3ff; --green:#6ff2a4; --red:#ff6b81;
  --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",Meiryo,sans-serif;
  color:var(--ink);background:var(--bg1);overflow:hidden;user-select:none;-webkit-user-select:none;
}
button,select{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ---------- 背景: 夜の探偵事務所 ---------- */
#bg{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(110% 60% at 50% 0%,#4a2f5e 0%,var(--bg2) 40%,var(--bg1) 80%)}
#bg .lamp{position:absolute;left:50%;top:-12%;width:130%;height:70%;transform:translateX(-50%);
  background:radial-gradient(50% 55% at 50% 0%,rgba(255,194,75,.2),transparent 70%);animation:lamp 6s ease-in-out infinite alternate}
@keyframes lamp{from{opacity:.65}to{opacity:1}}
#bg .blind{position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(to bottom,transparent 0 26px,rgba(0,0,0,.2) 26px 30px)}

/* ---------- 画面の切り替え ---------- */
#app{position:relative;height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column}
.view{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .35s,transform .35s}
.view.on{opacity:1;pointer-events:auto;transform:none}

/* ---------- タイトル ---------- */
#title{align-items:center;text-align:center;overflow-y:auto}
.series{margin-top:4px;padding:6px 16px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.06em;
  color:#22123a;background:linear-gradient(90deg,var(--amber),#ffe39a)}
.series b{font-weight:900}
h1{margin:20px 0 6px;line-height:1.08;font-weight:900;letter-spacing:.02em}
h1 span{display:block}
h1 .a{font-size:clamp(22px,6.8vw,30px);color:var(--cyan);text-shadow:0 0 22px rgba(95,227,255,.4);letter-spacing:.1em}
h1 .b{white-space:nowrap;font-size:clamp(32px,10.6vw,54px);background:linear-gradient(180deg,#fff 20%,#ffd98a 95%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.35)) drop-shadow(0 0 26px rgba(255,194,75,.35))}
.lead{margin:6px 0 16px;font-weight:700;color:#e9e2f5;font-size:16px}
.how{width:100%;display:grid;gap:8px;margin:0 0 14px;padding:0}
.how li{list-style:none;display:flex;align-items:center;gap:12px;text-align:left;padding:11px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:14.5px;line-height:1.45}
.how i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;color:#22123a;background:var(--amber)}
.how em{font-style:normal;color:var(--amber)}
#pick{width:100%;margin-bottom:14px;padding:12px 14px;border-radius:14px;background:#241a36;border:1.5px solid var(--line);font-weight:800;font-size:15px;color:var(--ink)}
#startBtn{width:100%;padding:18px 10px;border-radius:22px;font-weight:900;font-size:22px;letter-spacing:.04em;color:#22123a;
  background:linear-gradient(180deg,#ffe08a,#ffb53d);box-shadow:0 7px 0 #b46a12,0 16px 34px rgba(255,170,60,.35);transition:transform .08s,box-shadow .08s,filter .2s}
#startBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #b46a12,0 8px 18px rgba(255,170,60,.3)}
#startBtn:disabled{filter:grayscale(.75) brightness(.8);box-shadow:0 7px 0 #554}
#loadBar{width:100%;height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:14px;overflow:hidden;transition:opacity .4s}
#loadBar b{display:block;height:100%;width:0;background:var(--cyan);transition:width .3s}
.best{margin-top:14px;font-weight:700;color:var(--dim);font-size:13.5px;line-height:1.8}
.best b{color:var(--amber);font-size:18px;font-weight:900;margin:0 2px}
.safety{margin:12px 0 0;font-size:12px;line-height:1.6;color:var(--dim)}
.warn{margin:10px 0 0;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.55;font-weight:700;color:#ffe3e8;background:rgba(255,107,129,.16);border:1px solid rgba(255,107,129,.4)}

/* ---------- ゲーム ---------- */
.hud{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex:none}
.side{flex:1;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.side.r{align-items:flex-end}
.lb{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:.06em}
.loupes{display:flex;gap:4px}
.loupes svg{width:27px;height:27px;fill:rgba(191,233,255,.85);stroke:var(--amber);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(255,194,75,.5));transition:.4s}
.loupes svg.off{fill:none;stroke:rgba(255,255,255,.2);filter:none;transform:scale(.82)}
.loupes svg.pop{animation:lpop .6s}
@keyframes lpop{30%{transform:scale(1.5) rotate(-14deg)}100%{transform:scale(.82)}}
.cno{flex:none;text-align:center;line-height:1;font-weight:900;color:var(--dim);font-size:12px}
.cno b{display:block;font-size:40px;color:var(--amber);margin-top:2px}
.hs{font-size:12px;font-weight:800;color:var(--dim)}
.hs b{font-size:24px;color:#fff;margin:0 3px}

.file{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:12px;margin-top:10px}
#ctitle{text-align:center;font-weight:900;font-size:clamp(20px,6vw,26px);color:#fff;min-height:32px;text-shadow:0 0 18px rgba(255,194,75,.35)}
#cap{min-height:118px;max-height:42vh;overflow:hidden;padding:16px 18px;border-radius:18px;background:rgba(246,236,212,.08);border:1px solid var(--line);
  font-weight:700;font-size:17px;line-height:1.75;color:#f1ead9;display:flex;align-items:center;justify-content:center;text-align:center}
#cap.q{color:var(--cyan)}
#cap.q::before{content:"「"}#cap.q::after{content:"」"}
#cap:empty{opacity:.35}

.stage{flex:none;display:flex;flex-direction:column;align-items:center;padding:10px 0 6px}
#orb{position:relative;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 28%,#4a3f6e,#221a3a 70%);border:2px solid var(--line);transition:background .3s,border-color .3s,box-shadow .3s}
#orb svg{width:48px;height:48px;fill:#fff;opacity:.9;position:absolute;transition:opacity .25s,transform .25s}
#orb .ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--cyan);opacity:0}
#orb .eq{position:absolute;display:flex;gap:6px;align-items:center;height:50px;opacity:0;transition:opacity .25s}
#orb .eq b{width:8px;height:14px;border-radius:5px;background:#22123a}
#orb .ico-mic,#orb .ico-pause,#orb .ico-dots,#orb .ico-ok,#orb .ico-ng{opacity:0;transform:scale(.6)}
#orb[data-s="listen"]{background:radial-gradient(circle at 35% 28%,#8ff0ff,#1c9fd1 75%);border-color:var(--cyan);box-shadow:0 0 44px rgba(95,227,255,.55)}
#orb[data-s="listen"] .ico-mic{opacity:1;transform:none;fill:#06283a}
#orb[data-s="listen"] .ring{animation:ring 1.7s ease-out infinite}
#orb[data-s="listen"] .ring.r2{animation-delay:.55s}
#orb[data-s="listen"] .ring.r3{animation-delay:1.1s}
@keyframes ring{from{opacity:.85;transform:scale(1)}to{opacity:0;transform:scale(1.75)}}
#orb[data-s="speak"]{background:radial-gradient(circle at 35% 28%,#ffe6a8,#ffac2e 75%);border-color:var(--amber);box-shadow:0 0 44px rgba(255,194,75,.5)}
#orb[data-s="speak"] .eq{opacity:1}
#orb[data-s="speak"] .eq b{animation:eq .62s ease-in-out infinite alternate}
#orb[data-s="speak"] .eq b:nth-child(2){animation-delay:-.2s}#orb[data-s="speak"] .eq b:nth-child(3){animation-delay:-.45s}
#orb[data-s="speak"] .eq b:nth-child(4){animation-delay:-.1s}#orb[data-s="speak"] .eq b:nth-child(5){animation-delay:-.33s}
@keyframes eq{from{height:10px}to{height:48px}}
#orb[data-s="pause"] .ico-pause{opacity:.95;transform:none}
#orb[data-s="think"] .ico-dots{opacity:.95;transform:none;animation:think 1s ease-in-out infinite}
@keyframes think{50%{transform:scale(1.12)}}
#orb[data-s="good"]{background:radial-gradient(circle at 35% 28%,#c4ffdc,#2fc878 75%);border-color:var(--green);box-shadow:0 0 50px rgba(111,242,164,.6)}
#orb[data-s="good"] .ico-ok{opacity:1;transform:none;fill:#0d2a1c}
#orb[data-s="bad"]{background:radial-gradient(circle at 35% 28%,#ffc2cc,#e2405c 75%);border-color:var(--red);box-shadow:0 0 50px rgba(255,107,129,.55);animation:shake .45s}
#orb[data-s="bad"] .ico-ng{opacity:1;transform:none}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#status{margin-top:10px;min-height:30px;font-weight:900;font-size:20px;text-align:center}
#heard{min-height:22px;margin-top:2px;font-weight:700;font-size:14px;color:var(--cyan);text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:rtl}
#heard span{direction:ltr;unicode-bidi:bidi-override}
#tbar{width:150px;height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden;opacity:0;transition:opacity .2s}
#tbar.on{opacity:1}
#tbar b{display:block;height:100%;width:100%;background:var(--cyan);transform-origin:0 50%}
#tbar.hot b{background:var(--red)}
#nextBar{flex:none;display:flex;gap:8px;margin-top:4px}
#nextBar button{flex:1;padding:12px 4px;border-radius:15px;font-weight:900;background:var(--glass);border:1.5px solid var(--line)}
#nextBar button.p{background:var(--amber);color:#22123a;border-color:var(--amber)}
.cmds{flex:none;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding-top:8px}
.cmds span{padding:5px 10px;border-radius:999px;background:#241a36;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--dim)}
.cmds b{color:#fff;font-weight:800}
#dbg{flex:none;display:flex;gap:6px;margin-top:10px}
#dbg input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font:inherit;font-size:16px;user-select:text;-webkit-user-select:text}
#dbg button{padding:0 16px;border-radius:12px;background:var(--cyan);color:#06283a;font-weight:900}
[hidden]{display:none!important}
</style>
<script data-goatcounter="https://hiroism.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script></head>
<body>
<div id="bg"><div class="lamp"></div><div class="blind"></div></div>

<main id="app">
  <section id="title" class="view on">
    <div class="series">画面を見ないで遊べるゲーム <b>#4</b></div>
    <h1><span class="a">耳でとく ひろ博士の</span><span class="b">3分間ミステリー</span></h1>
    <p class="lead">事件のお話を聞いて、声で推理する ゲーム。</p>
    <ul class="how">
      <li><i>1</i><span>短い<em>事件のお話</em>を読み上げます。よく聞こう</span></li>
      <li><i>2</i><span>お話の<em>おかしなところ</em>を、声で答える</span></li>
      <li><i>3</i><span>むずかしければ<em>「よんたく」</em>や<em>「ヒント」</em></span></li>
    </ul>
    <select id="pick" aria-label="事件をえらぶ"></select>
    <button id="startBtn" disabled>じゅんびちゅう…</button>
    <div id="loadBar"><b></b></div>
    <div class="best" id="prog"></div>
    <p id="support" class="warn" hidden></p>
    <p class="safety">スタートを押したら、あとは声だけ。<br>運転する人は、発進前に押して、画面は見ないでください。</p>
  </section>

  <section id="game" class="view">
    <header class="hud">
      <div class="side"><span class="lb">虫めがね</span><div class="loupes" id="loupes"></div></div>
      <div class="cno">事件ファイル<b>No.<span id="cno">1</span></b></div>
      <div class="side r"><span class="lb">解決</span><div class="hs"><b id="hsolved">0</b>/ <span id="hall">6</span></div></div>
    </header>
    <div class="file">
      <div id="ctitle"></div>
      <div id="cap"></div>
    </div>
    <div class="stage">
      <button id="orb" data-s="idle" aria-label="一時停止 / 再開">
        <span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span>
        <span class="eq"><b></b><b></b><b></b><b></b><b></b></span>
        <svg class="ico-mic" viewBox="0 0 24 24"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm7-4a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.08A7 7 0 0 0 19 11Z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg>
        <svg class="ico-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.3"/><circle cx="12" cy="12" r="2.3"/><circle cx="19" cy="12" r="2.3"/></svg>
        <svg class="ico-ok" viewBox="0 0 24 24"><path d="M9.6 17.6 4.4 12.4a1.4 1.4 0 0 1 2-2l3.2 3.2 8-8a1.4 1.4 0 0 1 2 2Z"/></svg>
        <svg class="ico-ng" viewBox="0 0 24 24"><path d="M6.3 4.9a1.4 1.4 0 0 0-2 2L9.9 12l-5.600 5.100a1.400 1.400 0 1 0 2 2L12 14l5.700 5.100a1.400 1.400 0 0 0 2-2L14.100 12l5.600-5.100a1.400 1.400 0 0 0-2-2L12 10Z"/></svg>
      </button>
      <div id="status"></div>
      <div id="heard"></div>
      <div id="tbar"><b></b></div>
    </div>
    <div id="nextBar" hidden><button id="nEnd">おわり</button><button id="nAgain">もういっかい</button><button id="nNext" class="p">つぎ</button></div>
    <footer class="cmds">
      <span><b>「よんたく」</b>4つから選ぶ</span>
      <span><b>「ヒント」</b>決め手を聞く</span>
      <span><b>「もういっかい」</b>質問</span>
      <span><b>「さいしょから」</b>お話</span>
      <span><b>「ストップ」</b>ひとやすみ</span>
      <span><b>「おわり」</b>やめる</span>
    </footer>
    <form id="dbg" hidden><input id="dbgIn" autocomplete="off" placeholder="文字で入力（ひらがなでOK）"><button>送信</button></form>
  </section>
</main>

<script src="lib/kuromoji.js"></script>
<script src="cases.js"></script>
<script src="sfx.js"></script>
<script src="game.js"></script>
</body>
</html>
