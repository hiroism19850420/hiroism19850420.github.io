<style>

:root{

}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}

  16%{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) skewX(-12deg) scale(1.2)}
  28%{transform:translate(-50%,-50%) rotate(var(--r)) skewX(-12deg) scale(1)}
  72%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r)) skewX(-12deg) scale(1.06)}
}
#lines{position:absolute;inset:-15%;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 3deg at 50% 50%,transparent 0deg 5deg,rgba(255,255,255,.8) 5.3deg 5.9deg),repeating-conic-gradient(from 0deg at 50% 50%,transparent 0deg 11deg,rgba(26,29,58,.35) 11.4deg 12deg);
  -webkit-mask:radial-gradient(circle at 50% 50%,transparent 30%,#000 72%);mask:radial-gradient(circle at 50% 50%,transparent 30%,#000 72%)}

#gogo{position:absolute;left:0;right:0;top:calc(92px + env(safe-area-inset-top,0px));display:flex;justify-content:center;align-items:flex-start;gap:clamp(2px,1.6vw,18px);opacity:0;transition:opacity .4s}
#gogo span{display:inline-block;font-family:var(--disp);font-size:clamp(28px,5.6vw,60px);line-height:1;color:#b84cff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:4px 5px 0 #2b0f3a}
#gogo span:nth-child(odd){transform:translateY(14px) rotate(-12deg) scale(.82)}
#gogo span:nth-child(even){transform:translateY(-2px) rotate(9deg)}
#gogo span.dots{font-size:clamp(18px,3vw,34px);transform:translateY(30px)}
#gogo i{display:inline-block;font-style:normal;animation:jit .16s steps(2) infinite}
#gogo span:nth-child(3n) i{animation-duration:.13s}
#gogo span:nth-child(3n+1) i{animation-duration:.19s;animation-direction:reverse}

@media (max-height:430px){#gogo{top:calc(70px + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){.go{animation:none}#gogo i{animation:none}#lines.on{animation:none}}

#cue.on{opacity:1}
#cueRow{display:flex;align-items:center;gap:clamp(10px,3vw,28px)}
#cueNum{font-family:var(--disp);font-size:clamp(90px,24vh,190px);line-height:.9;min-width:1.1em;text-align:center;color:#ffe14a;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:6px 7px 0 #b03cff}
#cueNum.go{color:#5fe08a;font-size:clamp(60px,15vh,130px);text-shadow:6px 7px 0 #1f7a44}
#cueIcon{width:clamp(70px,17vh,130px);height:clamp(70px,17vh,130px);border-radius:24px;display:grid;place-items:center;background:var(--hot);box-shadow:0 0 0 4px var(--ink),0 7px 0 4px var(--ink)}
#cueIcon.j{background:#3fc27a}#cueIcon.s{background:#3b8cff}
#cueIcon svg{width:70%;height:70%;stroke:#fff;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
#cueTxt{font-family:var(--disp);font-size:clamp(26px,6vh,50px);color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:4px 5px 0 rgba(26,29,58,.4)}
#cam{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:clamp(120px,22vw,200px);aspect-ratio:4/3;border-radius:14px;overflow:hidden;box-shadow:0 0 0 3px var(--ink),0 4px 0 3px var(--ink);background:#222;display:none}
#cam.on{display:block}
#cam video,#cam canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);object-fit:cover}
#cam .zn{position:absolute;top:0;bottom:0;width:33.33%;border-left:2px dashed rgba(255,255,255,.55);pointer-events:none}
#cam .zn.a{background:rgba(255,122,26,.35)}
#cam .zn.t{box-shadow:inset 0 0 0 3px #5fe08a;background:rgba(95,224,138,.25)}
#camLost{position:absolute;inset:auto 0 0 0;background:var(--hot);color:#fff;font-weight:800;font-size:11px;text-align:center;padding:2px;display:none}
#setup{background:rgba(26,29,58,.7);justify-content:center;text-align:center;cursor:default}
#setup .poster{align-items:center;max-width:620px;text-align:center;margin:0 auto}
#setup .big{font-family:var(--disp);font-size:clamp(28px,6vw,52px);color:var(--tan);text-shadow:3px 3px 0 var(--ink)}
#stat{font-weight:800;font-size:15px;min-height:1.6em}
.go.cam{background:#3fc27a}
.go.sm{font-size:16px;padding:10px 20px}
#title .go.ghostbtn{margin-top:0}

</style>

function colGeo(g, col) {
  const c = new THREE.Color(col), n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r; a[i * 3 + 1] = c.g; a[i * 3 + 2] = c.b; }

function bldGeo(w, h, dp, col, x, y, z) {
  const g = new THREE.BoxGeometry(w, h, dp), uv = g.attributes.uv;
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {

    if (f === 2 || f === 3) { u = .04; v = .04; } else { u *= (f < 2 ? dp : w) / 2.6; v *= h / 3.2; }
    uv.setXY(i, u, v);

}

function makeHigh(lanes) {

  o.mesh.rotation.set(0, o.t === 'on' ? Math.PI : 0, 0);

}

}

      const make = delegate => PoseLandmarker.createFromOptions(files, { baseOptions: { modelAssetPath: MODEL_URL, delegate }, runningMode: 'VIDEO', numPoses: 1, minPoseDetectionConfidence: .5, minPosePresenceConfidence: .5, minTrackingConfidence: .5 });

const sk = $('skel').getContext('2d');

}
const ZONE_IN = .09, ZONE_OUT = .05;
function bodyTick(dt) {

  detect(performance.now());

  const y = BODY.py;
  if (BODY.base === null) BODY.base = y;
  const dev = y - BODY.base;
  if (Math.abs(dev) < .03) BODY.base += dev * Math.min(1, dt * 1.2);

  if (state === 'run' && lead <= 0 && (BODY.seen || BODY.dbg)) {
    if (-dev > J && BODY.jumpCd <= 0 && !BODY.crouch) { act('U'); BODY.jumpCd = .55; }
    if (dev > C && !BODY.crouch) { BODY.crouch = true; act('D'); }
  }

    } else { BODY.setupT = 0; $('setBig').textContent = 'カメラの まえに たってね'; stat('あたまから こしまで うつるように'); }

  else if (z === 1) { if (dx < ZONE_OUT) z = 0; } else if (dx > -ZONE_OUT) z = 0;

}
// スタート前の 3・2・1
function stepLead() {
  if (lead > .2) showCue(String(Math.min(3, Math.ceil(lead - .2))), null, 'じゅんび', 'start');
  else hideCue();
  P.x = P.lane * LANE;
  if (lead <= 0) { showMsg('GO!', .8); if (ac) { bgmOn = true; stepI = 0; nextT = ac.currentTime + .05; } }
}
// ---------- 3・2・1 の よこく（うごく 3びょうまえから）
const ARROW = { L: '<svg viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>', R: '<svg viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7"/></svg>' };
const LEADT = { move: .55, j: .32, s: .22 };
let cueKey = '', cueZone = null;
function showCue(num, icon, txt, key) {
  $('cue').classList.add('on');
  const n = $('cueNum'); n.textContent = num; n.classList.toggle('go', !/^\d$/.test(num));
  const ic = $('cueIcon');
  if (icon) { ic.style.display = ''; if (cueKey !== key) { ic.className = icon.cls; ic.innerHTML = icon.svg; } } else ic.style.display = 'none';
  $('cueTxt').textContent = txt; cueKey = key;
}
function hideCue() { $('cue').classList.remove('on'); cueKey = ''; cueZone = null; }
const lanePhys = l => l * (camS > .5 ? -1 : 1);
function planMove(o) {
  const [a, b] = obsRange(o), cost = [0, 0, 0];
  for (const q of OBS) {
    if (q.spent) continue;
    const [qa, qb] = obsRange(q);
    if (qb < a - 7 || qa > b + 7) continue;

}
const BR_T = [{ e: 186, dl: 200, l: 0 }, { e: 242, dl: 250, l: -1 }, { e: 276, dl: 284, l: 0 }, { e: 294, dl: 302, l: 1 }];
function updateCue() {
  if (state !== 'run' || lead > 0) { if (lead <= 0) hideCue(); return; }
  let cand = null;
  for (const o of OBS) {
    if (o.spent || !o.lanes.includes(P.lane)) continue;
    const [a] = obsRange(o), dd = a - P.d;
    if (dd < -.3) continue;
    const closing = o.t === 'on' ? P.v + .6 * vNom(o.meet) : P.v;
    const t = dd / Math.max(2, closing);
    const kind = (o.t === 'truck' || o.t === 'on') ? 'move' : o.t === 'low' ? 'j' : 's';
    const tAct = t - LEADT[kind];
    if (!cand || tAct < cand.tAct) cand = { tAct, kind, tl: kind === 'move' ? planMove(o) : 0 };
  }
  const T = BR_T.find(q => P.d < q.dl);

  if (!cand || cand.tAct > 3) { hideCue(); return; }
  const { tAct, kind } = cand;
  if (kind !== 'move') cueZone = null;
  let icon, txt, key;
  if (kind === 'move') {
    const tz = lanePhys(cand.tl), dir = Math.sign(tz - lanePhys(P.lane)), far = Math.abs(tz - lanePhys(P.lane)) > 1;
    cueZone = tz;
    icon = { cls: '', svg: ARROW[dir > 0 ? 'R' : 'L'] }; txt = (far ? 'いちばん ' : '') + (dir > 0 ? 'みぎへ！' : 'ひだりへ！'); key = 'm' + dir + far;
  } else if (kind === 'j') { icon = { cls: 'j', svg: ICON.j }; txt = 'ジャンプ！'; key = 'j'; }
  else { icon = { cls: 's', svg: ICON.s }; txt = 'しゃがむ！'; key = 's'; }
  const num = tAct > 2 ? '3' : tAct > 1 ? '2' : tAct > 0 ? '1' : (tAct > -.9 ? '!' : null);
  if (num === null) { hideCue(); return; }
  showCue(num === '!' ? txt.replace('！', '') : num, icon, txt, key + (tAct > 0 ? '' : 'g'));
  if (num !== '!' && cueState !== num + key) { cueState = num + key; sfx.tick(); }
}

// ---------- ループ
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;

}
function resize() {

  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
resetObs(-999);
requestAnimationFrame(frame);

if (DBG) {
  window.tz = {
    god: false, P, OBS, CANS, groundAt, range: obsRange, log: [],
    get state() { return state; },
    get camS() { return camS; },
    setMode,
    get stats() { return { runT: +runT.toFixed(2), hits, misses, canGot, lives, drumGap: drumOn ? +(P.d - drumD - DR).toFixed(2) : null }; },
    go(d, lane = 0) { if (state === 'title' || state === 'result') startRun(); placeAt(d, lane); P.start = 1; resetObs(d); if (d >= CHASE_D) { drumOn = true; drumD = d - DR - 10; drum.visible = true; camS = 1; } return P; },
    act, BODY, feed(x, y) { BODY.dbg = true; BODY.seen = true; BODY.px = x; BODY.py = y; }, get lead() { return lead; }, get cueZone() { return cueZone; }, startNoCam() { BODY.on = false; startRun(); },
  };
}
