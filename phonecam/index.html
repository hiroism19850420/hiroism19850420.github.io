<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スマホカメラ</title>
<style>
  html,body{margin:0;height:100%;background:#101433;color:#fff;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",sans-serif;-webkit-user-select:none;user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;box-sizing:border-box;text-align:center}
  #pv{width:min(100%,560px);max-height:55vh;aspect-ratio:4/3;object-fit:contain;background:#000;border-radius:12px;display:none}
  #pv.self{transform:scaleX(-1)}
  h1{margin:0;font-size:22px;color:#ffe35a}
  #st{font-size:16px;font-weight:700;min-height:1.5em}
  #st.ok{color:#9ff5b0}#st.ng{color:#ffb0a0}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-weight:700;font-size:17px;color:#23306b;background:#ffe35a;border:0;border-radius:999px;padding:12px 24px;box-shadow:0 5px 0 #b98a12}
  button.sub{background:#cfe0ff;box-shadow:0 5px 0 #7a8fc4;font-size:15px;padding:9px 18px}
  button:active{transform:translateY(3px);box-shadow:none}
  .note{font-size:13px;opacity:.8;max-width:520px;line-height:1.6}
  .hide{display:none!important}
  /* つながったあとは 画面を くらくして 電池と 熱を おさえる */
  body.dim #pv{opacity:.35}
</style>
</head>
<body>
<h1>📱 スマホカメラ</h1>
<video id="pv" playsinline muted autoplay></video>
<div id="st">じゅんび中…</div>
<div class="row">
  <button id="bGo">カメラを PC に おくる</button>
  <button id="bFlip" class="sub hide">🔄 カメラを きりかえ</button>
  <button id="bDim" class="sub hide">🌙 がめんを くらく</button>
</div>
<div class="note" id="note">スマホを <b>横向き</b>に たてかけて、<b>頭から 足まで</b> うつる ところに おいてね。<br>この ページは ひらいたままに してください（とじると きれます）。<br>えいぞうと 音は PC にだけ おくり、ほかには おくりません。</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const PREFIX = 'hiro-pcam-';
const $ = id => document.getElementById(id);
const code = (new URLSearchParams(location.search).get('r') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const MIC = new URLSearchParams(location.search).get('mic') === '1';
const pv = $('pv'), st = $('st');
let dc = null;
let facing = 'user', stream = null, peer = null, call = null, lock = null;

function say(t, cls){ st.textContent = t; st.className = cls || ''; }

async function getCam(){
  const s = await navigator.mediaDevices.getUserMedia({ audio: MIC ? { echoCancellation: true, noiseSuppression: true, autoGainControl: true } : false, video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30, max: 30 } } });
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = s; pv.srcObject = s; pv.style.display = 'block';
  pv.classList.toggle('self', facing === 'user');
  try { await pv.play(); } catch (e) {}
  return s;
}
async function keepAwake(){
  try { if (navigator.wakeLock) lock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && stream) keepAwake(); });

function connect(){
  try { peer && peer.destroy(); } catch (e) {}
  say('PC に つなぎ中…');
  peer = new Peer();
  peer.on('open', () => {
    call = peer.call(PREFIX + code, stream);
    if (!call){ say('つなげませんでした。PC の QR を もういちど よみとってね', 'ng'); $('bGo').classList.remove('hide'); return; }
    const pc = call.peerConnection;
    const watch = () => {
      const s = pc && (pc.iceConnectionState || pc.connectionState);
      if (s === 'connected' || s === 'completed') { say('✅ つながった！ PC の 画面を 見てね' + (MIC ? '（🎤 マイクも スマホ）' : ''), 'ok'); $('bGo').classList.add('hide'); if (MIC) openData(); }
      else if (s === 'failed') { say('つなげませんでした。PC と スマホが おなじ Wi-Fi か たしかめてね', 'ng'); $('bGo').classList.remove('hide'); $('bGo').textContent = 'もういちど つなぐ'; }
      else if (s === 'disconnected') say('とぎれています…', 'ng');
    };
    if (pc) pc.addEventListener('iceconnectionstatechange', watch);
    call.on('close', () => { say('PC と きれました。PC で もういちど QR を 出して よみとってね', 'ng'); $('bGo').classList.remove('hide'); $('bGo').textContent = 'もういちど つなぐ'; });
    call.on('error', () => {});
  });
  peer.on('error', e => {
    const t = e.type === 'peer-unavailable' ? 'PC が 見つかりません。PC の 画面の QR を もういちど よみとってね' : 'つうしんエラー（' + (e.type || e) + '）';
    say(t, 'ng'); $('bGo').classList.remove('hide'); $('bGo').textContent = 'もういちど つなぐ';
  });
}

// ---- じゅもんの 聞きとり：PC から {t:'sr', on} が とどいたら、スマホで 聞いて 文字を おくる ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const ANDROID = /Android/i.test(navigator.userAgent);
let rec = null, recWant = false, recOn = false, recDead = !SR, recAt = 0;
function openData(){
  if (dc && dc.open) return;
  dc = peer.connect(PREFIX + code, { reliable: true });
  dc.on('open', () => dc.send({ t: 'sr', ready: !recDead }));
  dc.on('data', d => { if (d && d.t === 'sr') { recWant = !!d.on; recTick(); } });
}
function srSend(o){ try { dc && dc.open && dc.send(Object.assign({ t: 'sr' }, o)); } catch (e) {} }
function recTick(){
  if (recDead) return;
  if (!recWant){ if (recOn){ try { rec.abort(); } catch (e) {} } return; }
  if (recOn) return;
  const wait = 600 - (Date.now() - recAt);
  if (wait > 0){ setTimeout(recTick, wait); return; }
  if (!rec){
    rec = new SR(); rec.lang = 'ja-JP'; rec.continuous = !ANDROID; rec.interimResults = true; rec.maxAlternatives = 3;
    rec.onresult = ev => {
      let t = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) for (let j = 0; j < ev.results[i].length; j++) t += ev.results[i][j].transcript + ' ';
      srSend({ text: t });
    };
    rec.onstart = () => srSend({ listening: true });
    rec.onend = () => { recOn = false; srSend({ listening: false }); if (recWant) recTick(); };
    rec.onerror = ev => {
      if (['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'].includes(ev.error)){ recDead = true; srSend({ dead: true, error: ev.error }); }
    };
  }
  recAt = Date.now();
  try { rec.start(); recOn = true; } catch (e) {}
}

async function go(){
  if (!code){ say('PC の ゲームに 出ている QR を よみとって ひらいてね', 'ng'); return; }
  if (typeof Peer === 'undefined'){ say('つうしんの ぶひんが よみこめませんでした。ネットを たしかめてね', 'ng'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ say('この ブラウザでは カメラを つかえません。Safari か Chrome で ひらいてね（QR アプリの中では うごかないことがあります）', 'ng'); return; }
  $('bGo').classList.add('hide');
  say('カメラを じゅんび中…');
  try { await getCam(); }
  catch (e){ say(MIC ? 'カメラか マイクを つかえませんでした。ブラウザで きょかしてね' : 'カメラを つかえませんでした。ブラウザで カメラを きょかしてね', 'ng'); $('bGo').classList.remove('hide'); return; }
  keepAwake();
  $('bFlip').classList.remove('hide'); $('bDim').classList.remove('hide');
  connect();
}

$('bGo').onclick = go;
$('bFlip').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  try {
    await getCam();
    const senders = call && call.peerConnection ? call.peerConnection.getSenders() : [];
    for (const sd of senders){
      const kind = sd.track ? sd.track.kind : null;
      const nt = kind === 'audio' ? stream.getAudioTracks()[0] : stream.getVideoTracks()[0];
      if (nt && kind !== null) await sd.replaceTrack(nt);
    }
  } catch (e) { say('カメラを きりかえられませんでした', 'ng'); }
};
$('bDim').onclick = () => document.body.classList.toggle('dim');

if (!code) say('PC の ゲームに 出ている QR を よみとって ひらいてね', 'ng');
else { say('「カメラを PC に おくる」を おしてね'); go(); }
</script>
</body>
</html>
