const SPR_MAP={run:'run',charge:'run',stand:'run',jump:'jump',flip:'jump',cheer:'cheer',crash:'jump',sit:'jump'};
const SPR_SCALE=0.55;
function drawGirlSprite(x,y,pose,ph,rot){
  const d=SPR_DATA[SPR_MAP[pose]];if(!d||!d.img.complete||!d.img.naturalWidth)return false;
  const w=d.w*SPR_SCALE,h=d.h*SPR_SCALE;
  let bob=0,tilt=0,ox=0,sy=1;
  if(pose==='run'){bob=-Math.abs(Math.sin(ph))*5;tilt=Math.sin(ph)*0.05;}
  else if(pose==='charge'){ox=Math.sin(clock*55)*1.5;tilt=0.05;}
  else if(pose==='stand'){sy=1+Math.sin(clock*4)*0.012;}
  else if(pose==='cheer'){bob=-Math.abs(Math.sin(clock*9))*0;}
  else if(pose==='crash')tilt=-0.35;
  else if(pose==='sit'){tilt=0.7;}
  ctx.save();ctx.translate(x+ox,y+bob+(pose==='sit'?-4:0));
  if(rot){ctx.translate(0,-h/2);ctx.rotate(rot);ctx.translate(0,h/2);}
  ctx.translate(0,-h/2);ctx.rotate(tilt);ctx.translate(0,h/2);
  ctx.scale(-1,sy);   // 元絵は左向きなので反転
  ctx.drawImage(d.img,-w/2,-h,w,h);
  ctx.restore();
  if(pose==='sit'||pose==='crash'){ctx.save();ctx.translate(x,y);for(let i=0;i<3;i++){const a=clock*4+i*2.1;star(Math.cos(a)*26,-h-8+Math.sin(a)*6,6,'#ffe14d');}ctx.restore();}
  return true;
}

function stageInfo(n){
  const d=Object.assign({n},STAGES[Math.min(n,STAGES.length)-1]);
  if(d.type==='sky')d.ppm=0.01;else d.ppm=d.px/d.hm;
  d.hw0=HW0[d.type];
  d.ideal=45+Math.min(n-1,8)*2.5;
  d.tol=Math.max(15,28-n);
  d.needP=Math.min(0.7,0.2+0.04*(n-1));
  d.peakX=LINE+d.hw0;
  d.landX=d.peakX+d.hw0+(d.type==='gate'?110:d.type==='house'?160:220);
  d.time=14;
  return d;
}
function hw(d,f){
  f=clamp(f,0,1);
  switch(d.type){
    case 'house':return f<0.72?d.hw0:Math.max(2,d.hw0*(1-(f-0.72)/0.28));
    case 'tower':return f<0.78?14+(d.hw0-14)*Math.pow(1-f/0.78,1.8):6;
    case 'skytree':return f<0.55?40+(d.hw0-40)*Math.pow(1-f/0.55,1.3):(f<0.8?28:7);
    case 'fuji':return 70+(d.hw0-70)*Math.pow(1-f,1.6);
    case 'everest':return Math.max(8,d.hw0*Math.pow(1-f,1.25));
    default:return d.hw0;
  }
}
function surf(d,x){      // xの位置での障害物の高さ
  if(d.type==='sky')return 0;
  const r=Math.abs(x-d.peakX);
  if(r>=hw(d,0))return 0;
  if(r<=hw(d,1))return d.px;
  let lo=0,hi=1;
  for(let i=0;i<24;i++){const m=(lo+hi)/2;if(hw(d,m)>r)lo=m;else hi=m;}
  return lo*d.px;
}
function fmtM(m){
  if(m<10)return m.toFixed(1)+'m';
  if(m<100000)return Math.round(m).toLocaleString()+'m';
  return Math.round(m/1000).toLocaleString()+'km';
}

let actx=null,noiseBuf=null;
function initAudio(){
  if(actx){if(actx.state==='suspended')actx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  actx=new AC();
  noiseBuf=actx.createBuffer(1,Math.floor(actx.sampleRate*0.3),actx.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function tone(f,t0,len,type='square',vol=0.1,f2){
  if(!actx)return;const t=actx.currentTime+t0;
  const o=actx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+len);
  const g=actx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+len+0.02);
}
function noise(t0,len,vol,freq,q){
  if(!actx)return;const t=actx.currentTime+t0;
  const s=actx.createBufferSource();s.buffer=noiseBuf;
  const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=actx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+len);
  s.connect(f);f.connect(g);g.connect(actx.destination);s.start(t);s.stop(t+len+0.02);
}

function burst(x,y,n,cols,spd=240,up=0){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(0.3+Math.random()*0.7);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s+up,life:0.7+Math.random()*0.5,t:0,col:cols[i%cols.length],size:4+Math.random()*5,star:Math.random()<0.5});}

function press(i){
  initAudio();flash[i]=0.12;
  if(state==='title'){newGame();return;}
  if(state==='over'){if(performance.now()-overAt>800)newGame();return;}
  if(state!=='play'||jumped)return;
  if(i===1){if(!holding){holding=true;ang=0;angDir=1;}return;}
  const alt=i!==lastRB;v=Math.min(VMAX,v+(alt?60:25));lastRB=i;
  if(alt)playStep();else playBad();
}
function release(i){
  if(i!==1)return;
  if(state==='play'&&holding&&!jumped)takeoff();
  holding=false;
}

function newFlight(type,extra){return Object.assign({type,segs:[],si:0,t:0,x:gx,y:0,rot:0,done:false,reacted:false,hit:false,why:'',P:v/VMAX,E:0,perfect:false},extra);}
function takeoff(){
  jumped=true;holding=false;playJump();state='fly';
  const d=st,P=v/VMAX,dist=LINE-gx,diff=ang-d.ideal,E=clamp(1-Math.abs(diff)/d.tol,0,1);
  const riseT=clamp(0.8+0.0005*d.px,0.8,3.2);
  const j=newFlight('clear',{P,E,gap:dist,angle:ang});
  if(d.type==='sky'){
    const ach=P*(0.3+0.7*E)*(dist>ZONE_FAR?0.6:1);
    j.type='sky';j.apexPx=2000+ach*3000;
    const T=j.apexPx/CAM_SPD;
    j.segs.push({x0:gx,y0:0,x1:gx+200,y1:j.apexPx,T,shape:'sm',pose:'jump',spin:2});
    j.segs.push({x0:gx+200,y0:j.apexPx,x1:gx+200,y1:j.apexPx,T:0.8,shape:'hold',pose:'cheer'});
    j.segs.push({x0:gx+200,y0:j.apexPx,x1:gx+420,y1:0,T,shape:'sm',pose:'flip',spin:1+Math.floor(T/2),end:'skyland'});
    fl=j;return;
  }
  let f=0;
  if(dist>ZONE_FAR){j.type='short';j.why='ふみきりが 早すぎ！';}
  else if(diff>d.tol){j.type='short';j.why='角度が 高すぎ！';}
  else if(diff<-d.tol){j.type='crash';j.why='角度が ひくすぎ！';f=clamp(P/d.needP,0.1,1)*0.5;}
  else if(P<d.needP){j.type='crash';j.why='ダッシュが たりない！';f=clamp(P/d.needP,0.05,1)*0.8;}
  j.perfect=j.type==='clear'&&Math.abs(diff)<=4&&P>=0.9;
  if(j.type==='clear'){
    const apex=d.px+Math.max(60,d.px*0.04)*(1+E),big=d.px>=600;
    const up=big?Math.max(riseT,apex/CAM_SPD):riseT,dn=big?Math.max(1,apex/CAM_SPD):Math.max(0.6,riseT*0.75);
    j.segs.push({x0:gx,y0:0,x1:d.peakX,y1:apex,T:up,shape:big?'sm':'up',pose:'jump',react:true,clamp:true});
    j.segs.push({x0:d.peakX,y0:apex,x1:d.landX,y1:0,T:dn,shape:big?'sm':'down',pose:'flip',spin:big?1+Math.floor(dn/2):1,clamp:true,end:'land'});
  }else if(j.type==='crash')crashSegs(j,f,gx);
  else{
    const apex=clamp(0.4*d.px+60,90,420)*(0.5+0.5*P);
    const lx=Math.min(gx+clamp(Math.min(dist-80,100+P*200),50,400),LINE-50),mx=(gx+lx)/2;
    j.segs.push({x0:gx,y0:0,x1:mx,y1:apex,T:0.5+apex/1200,shape:'up',pose:'jump'});
    j.segs.push({x0:mx,y0:apex,x1:lx,y1:0,T:0.5+apex/1600,shape:'down',pose:'jump',end:'short'});
  }
  fl=j;
}
function crashSegs(j,f,x0){
  const d=st,cy=f*d.px,cx=d.peakX-hw(d,f)-18;
  j.segs.push({x0,y0:0,x1:cx,y1:cy,T:Math.max(0.4,0.8*Math.sqrt(f)+0.3,cy/CAM_SPD),shape:cy>600?'sm':'up',pose:'jump',end:'crash'});
  j.segs.push({x0:cx,y0:cy,x1:cx,y1:cy,T:0.35,shape:'hold',pose:'crash'});
  j.segs.push({x0:cx,y0:cy,x1:cx,y1:0,T:Math.max(0.4,0.3+cy/CAM_SPD),shape:'slide',pose:'crash',end:'ground'});
}
function forcedCrash(){
  jumped=true;holding=false;state='fly';
  const j=newFlight('crash',{why:'ぶつかった！',angle:0,gap:0});
  crashSegs(j,0.03,gx);fl=j;
}
function lateFinish(){
  jumped=true;holding=false;timeLeft=0;lives--;state='result';resT=0;v=0;
  res={type:'late',why:'チャイムが 鳴っちゃった…'};mood='laugh';playChime();
  pop('キンコンカンコン♪',CX,250,'#fff',30,1.8);
}

function segPos(j,s,t){
  const sm=s.shape==='sm'||s.shape==='slide';
  const k=sm?ease(t):s.shape==='up'?1-(1-t)*(1-t):(s.shape==='hold'?0:t*t);
  j.y=s.y0+(s.y1-s.y0)*k;
  j.x=s.shape==='slide'?st.peakX-hw(st,j.y/st.px)-18:(s.shape==='sm'?s.x0+(s.x1-s.x0)*k:s.x0+(s.x1-s.x0)*t);
  if(s.clamp){const sf=surf(st,j.x);if(sf>0)j.y=Math.max(j.y,sf+Math.min(28,sf));}
  j.rot=s.spin?t*s.spin*Math.PI*2:0;
}
function segEnd(e,j){
  if(e==='land'){playThud();pop('ピタッ！',CX,340,'#ffe14d',36);j.final='cheer';finish('clear');}
  else if(e==='skyland'){playThud();j.final='cheer';finish('sky');}
  else if(e==='crash'){playCrash();shake=0.3;burst(j.x+10,j.y,14,['#fff','#ffe14d'],260,80);pop('ガシャーン！',w2sx(j.x),w2sy(j.y)-60,'#fff',32);}
  else if(e==='ground'){j.final='sit';finish('crash');}
  else if(e==='short'){playThud();burst(j.x,10,10,['#e9c58a','#fff'],160,120);pop('ポテッ',w2sx(j.x),w2sy(80),'#fff',30);j.final='sit';finish('short');}
}
function updateFlight(dt){
  const j=fl;if(!j||j.done)return;
  const s=j.segs[j.si];
  if(!s.started)s.started=true;
  j.t+=dt/s.T;const t=Math.min(1,j.t);
  segPos(j,s,t);
  if(s.react&&!j.reacted&&t>0.85&&st.who){j.reacted=true;pop(WHO_TALK[st.who],w2sx(st.peakX)+50,w2sy(st.px)-90,'#fff',24);playReact();}
  if(t>=1){
    j.si++;j.t=0;
    if(s.end)segEnd(s.end,j);
    if(j.si>=j.segs.length){j.done=true;j.si=j.segs.length-1;}
  }
}
function finish(type){
  const j=fl;
  if(type==='clear'){
    const pts=100*stage+Math.round(j.P*300)+Math.round(j.E*200)+Math.round(timeLeft*20)+(j.perfect?500:0);
    score+=pts;res={type:'clear',pts,perfect:j.perfect};
    playClear();mood='shock';burst(st.landX,30,26,['#ffe14d','#ff5fa2','#5ad1ff','#7dff6a'],320,260);
  }else if(type==='sky'){
    skyAlt=j.apexPx/st.ppm;const pts=Math.round(skyAlt/100);score+=pts;
    res={type:'sky',pts,alt:skyAlt};playClear();burst(j.x,10,30,['#ffe14d','#ff5fa2','#5ad1ff','#7dff6a'],340,300);
  }else{
    lives--;res={type,why:j.why};playFail();mood='laugh';
  }
  state='result';resT=0;
}
function toOver(){
  state='over';overAt=performance.now();newBest=false;
  if(score>best){best=score;newBest=true;try{localStorage.setItem('chikoku_bishi_best',best)}catch(e){}}
}

function update(dt){
  clock+=dt;
  popups.forEach(p=>p.t+=dt);popups=popups.filter(p=>p.t<p.life);
  parts.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=520*dt;});parts=parts.filter(p=>p.t<p.life);
  for(let i=0;i<3;i++)flash[i]=Math.max(0,flash[i]-dt);
  if(shake>0)shake-=dt;if(goT>0)goT-=dt;
  const py=camY;

  if(state==='title'){runPhase+=dt*14;camX=gx;camY=0;return;}
  if(state==='preview'){
    prevT+=dt;
    const tcx=Math.max(gx,st.peakX-240),tcy=Math.max(0,st.px-300);
    if(prevT<1.5){camX=tcx;camY=tcy;}
    else{const k=ease(Math.min(1,(prevT-1.5)/1.0));camX=tcx+(gx-tcx)*k;camY=tcy*(1-k);}
    if(prevT>2.6){state='ready';readyT=0;beeped=false;camX=gx;camY=0;}
  }
  if(state==='ready'){
    readyT+=dt;camX=gx;camY=0;
    if(!beeped&&readyT>0.5){beeped=true;playBeep(false);}
    if(readyT>=1.4){state='play';goT=0.8;playBeep(true);}
  }
  if(state==='play'&&!jumped){
    timeLeft-=dt;
    v=Math.max(0,v*Math.exp(-1.2*dt)-40*dt);
    gx+=v*dt;runPhase+=v*dt*0.05;camX=gx;camY=0;
    if(holding){ang+=angDir*ANG_SPD*dt;if(ang>=90){ang=90;angDir=-1;}else if(ang<=0){ang=0;angDir=1;}}
    dustT-=dt;if(v>120&&dustT<=0){dustT=0.06;parts.push({x:gx-14,y:4,vx:-60-v*0.2,vy:40+Math.random()*60,life:0.35,t:0,col:'#f3d9a6',size:5+Math.random()*4,star:false});}
    sweatT-=dt;if(v>200&&sweatT<=0){sweatT=0.1;parts.push({x:gx-6,y:105,vx:-90-v*0.2,vy:80+Math.random()*70,life:0.55,t:0,col:'#8fd8ff',size:3.5+Math.random()*2,star:false});}
    mood=(LINE-gx<ZONE_FAR+500)?'shout':'idle';
    if(LINE-gx<=40){if(st.type==='sky')takeoffForced();else forcedCrash();}
    else if(timeLeft<=0)lateFinish();
  }
  if(state==='fly'&&fl){
    updateFlight(dt);
    const cs=fl.segs[Math.min(fl.si,fl.segs.length-1)],tgt=(cs&&(cs.shape==='down'||cs.shape==='slide'||(cs.shape==='sm'&&cs.y1<cs.y0)))?200:20;
    camOff+=clamp(tgt-camOff,-260*dt,260*dt);
    camX=fl.x;camY=Math.max(0,fl.y-camOff);
    mood=fl.type==='clear'?(fl.si>0?'shock':'shout'):'shout';
  }
  camVy=dt>0?(camY-py)/dt:0;
  if(state==='result'){
    resT+=dt;
    if(resT>2.4){
      if(res.type==='sky'||(res.type==='clear'&&stage>=SKY_STAGE))toOver();
      else if(res.type==='clear'){stage++;beginStage();}
      else if(lives<=0)toOver();
      else beginStage();
    }
  }
}
function takeoffForced(){ang=0;takeoff();}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function circ(x,y,r,fill,lw=3){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ol(fill,lw);}

// ---------- 障害物 ----------
function sil(d,f0,f1,n){
  ctx.beginPath();
  for(let i=0;i<=n;i++){const f=f0+(f1-f0)*i/n;ctx.lineTo(d.peakX-hw(d,f),-f*d.px);}
  for(let i=n;i>=0;i--){const f=f0+(f1-f0)*i/n;ctx.lineTo(d.peakX+hw(d,f),-f*d.px);}
  ctx.closePath();
}
function lattice(d,f1,col){
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();
  const lo=Math.max(0,camY-200),hi=Math.min(d.px*f1,camY+GY+200);
  for(let h=Math.floor(lo/40)*40;h<hi;h+=40){
    const w0=hw(d,h/d.px),w1=hw(d,(h+40)/d.px);
    ctx.moveTo(d.peakX-w0,-h);ctx.lineTo(d.peakX+w1,-h-40);
    ctx.moveTo(d.peakX+w0,-h);ctx.lineTo(d.peakX-w1,-h-40);
    ctx.moveTo(d.peakX-w0,-h);ctx.lineTo(d.peakX+w0,-h);
  }
  ctx.stroke();
}
function drawGate(d){
  const gH=d.px,X=d.peakX;
  ctx.fillStyle=OUT;
  if(d.type==='gate'){
    const step=d.hm>=2?1:0.5;
    for(let m=step;m*d.ppm<=gH+1;m+=step){
      const y=-m*d.ppm;ctx.fillRect(X-40,y-1,22,3);
      text(m+'m',X-46,y,14,'#fff','right');
    }
  }
  rr(X-16,-gH,32,gH+4,3);ol('#33a65a');
  ctx.strokeStyle='rgba(0,70,30,.45)';ctx.lineWidth=2;
  const lo=Math.max(18,Math.floor((camY-200)/18)*18),hi=Math.min(gH,camY+GY+200);
  ctx.beginPath();for(let y=lo;y<hi;y+=18){ctx.moveTo(X-16,-y);ctx.lineTo(X+16,-y);}ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(X-11,-gH+4,5,gH-8);
  for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#222':'#ffd600';ctx.fillRect(X-16+i*4,-gH-8,4,8);}
  ctx.strokeStyle=OUT;ctx.lineWidth=2.5;ctx.strokeRect(X-16,-gH-8,32,8);
  circ(X-16,-gH-16,8,'#ffd23f',2.5);circ(X+16,-gH-16,8,'#ffd23f',2.5);
}

  rr(X-16,-h*0.52,32,h*0.52,4);ol('#a8683a',2.5);circ(X+8,-h*0.26,2.5,'#ffd23f',1);

function drawFuji(d){

function drawEverest(d){

function drawObstacle(d){
  if(d.type==='gate'||d.type==='space')drawGate(d);

const SKY=[[0,[63,182,255],[191,234,255]],[2500,[50,140,235],[160,215,250]],[9000,[35,70,170],[95,145,225]],[25000,[12,22,80],[40,65,140]],[60000,[3,5,22],[12,16,50]],[100000,[0,0,4],[4,4,16]]];
function mixc(p,q,k){return `rgb(${p.map((c,i)=>Math.round(c+(q[i]-c)*k)).join(',')})`;}
function skyCols(a){
  for(let i=1;i<SKY.length;i++){if(a<=SKY[i][0]){const[a0,t0,b0]=SKY[i-1],[a1,t1,b1]=SKY[i],k=(a-a0)/(a1-a0);return[mixc(t0,t1,k),mixc(b0,b1,k)];}}
  const l=SKY[SKY.length-1];return[mixc(l[1],l[1],0),mixc(l[2],l[2],0)];
}
function altNow(){return Math.max(0,camY)/st.ppm;}

    ctx.restore();}
  if(alt>15000){ctx.globalAlpha=Math.min(1,(alt-15000)/30000);for(let i=0;i<70;i++){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(rnd(i)*W,rnd(i+99)*PANEL_Y,1+rnd(i+7)*1.2,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
  if(alt<12000)for(let i=0;i<7;i++){const x=((i*190+60-clock*8-camX*0.05)%760+760)%760-140,y=((i*210+60+camY*0.6)%1500+1500)%1500-300;cloud(x,y,1);}
  if(alt>=12000&&alt<60000){ // UFOと人工衛星
    for(let i=0;i<3;i++){const x=((i*300+clock*30)%700)-110,y=((i*430+camY*0.5)%1100)-200;
      ell(x,y,26,8,'#b9bec7',2.5);ell(x,y-7,12,9,'#9ad7ff',2.5);}

    for(let i=-2;i<8;i++){
      const bx=i*900+300;
      ctx.fillStyle='#fff3d1';ctx.fillRect(bx,-190,400,190);ctx.strokeStyle=OUT;ctx.lineWidth=3;ctx.strokeRect(bx,-190,400,190);
      ctx.fillStyle='#e9a24a';ctx.fillRect(bx-10,-204,420,16);
      for(let r=0;r<3;r++)for(let c=0;c<8;c++){ctx.fillStyle='#8fd3ff';ctx.fillRect(bx+14+c*47,-176+r*56,32,34);ctx.strokeRect(bx+14+c*47,-176+r*56,32,34);}
      ctx.fillStyle='#fff3d1';ctx.fillRect(bx+160,-262,80,60);ctx.strokeRect(bx+160,-262,80,60);
      circ(bx+200,-232,24,'#fff');ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(bx+200,-232);ctx.lineTo(bx+200,-250);ctx.moveTo(bx+200,-232);ctx.lineTo(bx+212,-228);ctx.stroke();
    }
  });
  par(0.75,()=>{
    for(let i=-2;i<30;i++){const tx=i*260+60;ctx.fillStyle='#8a5a34';ctx.fillRect(tx-6,-70,12,70);circ(tx,-92,34,'#4fbf55');circ(tx-22,-72,22,'#45ad4b');circ(tx+22,-72,22,'#45ad4b');}
  });
  ctx.fillStyle='#cfd6dc';const fh=38;ctx.fillRect(x0,-fh-8,x1-x0,6);
  for(let x=Math.floor(x0/28)*28;x<x1;x+=28)ctx.fillRect(x,-fh-8,4,fh+8);
}
function drawGround(x0,x1){
  const bot=(PANEL_Y-GY)+20;
  ctx.fillStyle='#d8c08a';ctx.fillRect(x0,-6,x1-x0,14);
  ctx.fillStyle='#e9733f';ctx.fillRect(x0,6,x1-x0,bot);
  ctx.fillStyle='#fff';
  for(let ly=40;ly<bot;ly+=34)ctx.fillRect(x0,ly,x1-x0,3);
  ctx.fillStyle='rgba(255,255,255,.75)';
  for(let x=Math.floor(x0/100)*100;x<x1;x+=100)ctx.fillRect(x,18,44,4);
  const zx0=LINE-ZONE_FAR,zx1=LINE-ZONE_NEAR,pulse=0.45+Math.sin(clock*8)*0.1;
  ctx.fillStyle=`rgba(255,226,60,${pulse})`;ctx.fillRect(zx0,6,zx1-zx0,44);
  ctx.save();ctx.beginPath();ctx.rect(zx0,6,zx1-zx0,44);ctx.clip();ctx.fillStyle='rgba(255,140,0,.5)';
  for(let x=zx0-50;x<zx1+50;x+=26){ctx.beginPath();ctx.moveTo(x,50);ctx.lineTo(x+13,50);ctx.lineTo(x+39,6);ctx.lineTo(x+26,6);ctx.closePath();ctx.fill();}
  ctx.restore();
  bigText('ジャンプ帯',(zx0+zx1)/2,28,20,'#fff',OUT);
}
function drawWorld(){
  const x0=camX-PX-60,x1=camX+(W-PX)+60;
  drawBack(x0,x1);drawGround(x0,x1);
  drawSign(st);
  drawObstacle(st);
  if(st.type==='gate')drawTeacher(st.peakX+270,0,mood);
  let gxp=gx,gyp=0,pose='stand',rot=0;
  if(state==='title')pose='run';
  else if(state==='play'&&!jumped)pose=holding?'charge':(v>25?'run':'stand');
  else if(fl){gxp=fl.x;gyp=fl.y;const s=fl.segs[Math.min(fl.si,fl.segs.length-1)];pose=fl.final||(s?s.pose:'stand');rot=fl.final?0:fl.rot;}
  else if(state==='result'&&res&&res.type==='late')pose='sit';
  const bread=!fl&&state!=='result';
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(gxp,8,30*Math.max(0.4,1-gyp/400),7,0,0,Math.PI*2);ctx.fill();
  if(pose==='run'&&v>150||state==='title'){ // スピード線
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;ctx.lineCap='round';
    for(let i=0;i<4;i++){const yy=-30-i*24+Math.sin(clock*30+i)*3,len=40+((clock*400+i*37)%40);ctx.beginPath();ctx.moveTo(gxp-46,yy);ctx.lineTo(gxp-46-len,yy);ctx.stroke();}
  }
  drawGirl(gxp,-gyp,pose,runPhase,rot);
  parts.forEach(p=>{ctx.globalAlpha=1-p.t/p.life;if(p.star)star(p.x,-p.y,p.size*1.3,p.col);else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,-p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;});
}

// ---------- HUD ----------
function drawAngleMeter(){
  const cx=150,cy=330,R=78,lo=st.ideal-st.tol,hi=st.ideal+st.tol;
  const a2r=a=>-a*Math.PI/180;
  ctx.lineCap='butt';ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=22;ctx.beginPath();ctx.arc(cx,cy,R,-Math.PI/2,0);ctx.stroke();
  ctx.strokeStyle='#ffe14d';ctx.lineWidth=18;ctx.beginPath();ctx.arc(cx,cy,R,a2r(hi),a2r(lo));ctx.stroke();
  ctx.strokeStyle='#ff7a1a';ctx.lineWidth=18;ctx.beginPath();ctx.arc(cx,cy,R,a2r(st.ideal+3),a2r(st.ideal-3));ctx.stroke();
  const r=a2r(ang);
  ctx.strokeStyle=OUT;ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(r)*(R+18),cy+Math.sin(r)*(R+18));ctx.stroke();
  ctx.strokeStyle='#ff3b3b';ctx.lineWidth=5;ctx.stroke();
  circ(cx,cy,7,'#fff',2.5);
  const ok=ang>=lo&&ang<=hi;
  bigText(Math.round(ang)+'°',cx+R*0.6,cy-R-20,28,ok?'#ffe14d':'#fff');
  if(ok)bigText('いまだ！はなせ！',CX+40,230,26,'#ffe14d');
}
function drawHUD(){
  ctx.fillStyle='rgba(20,20,60,.6)';ctx.fillRect(0,0,W,100);
  text('STAGE '+st.n,12,20,19,'#fff');
  bigText(st.type==='sky'?'どこまで とべる？':'高さ '+fmtM(st.hm),CX+20,20,st.type==='sky'?19:22,'#ffe14d');
  text('SCORE '+score,W-12,20,16,'#fff','right');
  const tx=70,tw=330,ty=38,th=15,tk=clamp(timeLeft/st.time,0,1);
  text('🔔',12,ty+8,16,'#fff');
  ctx.fillStyle='#222';rr(tx,ty,tw,th,7);ctx.fill();
  ctx.fillStyle=timeLeft<4?'#ff4d4d':'#7dff6a';rr(tx,ty,Math.max(4,tw*tk),th,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;rr(tx,ty,tw,th,7);ctx.stroke();
  text(timeLeft.toFixed(1),tx+tw+10,ty+8,14,timeLeft<4?'#ff8a8a':'#fff');
  const by=64,bh=15,pv=clamp(v/VMAX,0,1);
  text('ダッシュ',12,by+8,13,'#fff');
  ctx.fillStyle='#222';rr(tx,by,tw,bh,7);ctx.fill();
  const g=ctx.createLinearGradient(tx,0,tx+tw,0);g.addColorStop(0,'#4af');g.addColorStop(0.6,'#fc3');g.addColorStop(1,'#f44');
  ctx.fillStyle=g;rr(tx,by,Math.max(4,tw*pv),bh,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;rr(tx,by,tw,bh,7);ctx.stroke();
  const nx=tx+tw*st.needP;ctx.fillStyle='#ffe14d';ctx.fillRect(nx-2,by-4,4,bh+8);
  text('ここまで',nx,by+bh+11,10,'#ffe14d','center');
  for(let i=0;i<3;i++)heart(W-78+i*26,50,20,i<lives?'#ff4d6d':'#666');
  if(fl)text('いま '+fmtM(Math.max(0,fl.y)/st.ppm),W-14,88,14,'#9cf','right');
  else text('手前まで '+Math.max(0,(LINE-gx-40)/62).toFixed(1)+'m',W-14,88,13,'#fff','right');
}
function drawSpeedLines(){
  if(state!=='fly')return;
  const s=fl&&fl.segs[Math.min(fl.si,fl.segs.length-1)];
  if(Math.abs(camVy)<500&&!(s&&s.ff))return;
  ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;
  for(let i=0;i<16;i++){const x=rnd(i)*W,y0=((rnd(i+5)*PANEL_Y+camY*1.3)%PANEL_Y+PANEL_Y)%PANEL_Y,len=50+rnd(i+9)*80;ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y0+len);ctx.stroke();}
  if(s&&s.ff)bigText('早送り ▶▶',W-90,130,20,'#fff');
}
function drawButtons(){
  ctx.fillStyle='#1c1c2a';ctx.fillRect(0,PANEL_Y,W,H-PANEL_Y);
  ctx.fillStyle='#ffe14d';ctx.fillRect(0,PANEL_Y,W,4);
  TYPES.forEach((t,i)=>{
    const cx=BW*i+BW/2,down=i===1?(greenDown||flash[i]>0):flash[i]>0,off=down?0:7;
    ctx.beginPath();ctx.arc(cx,BTN_Y+7,BTN_R,0,Math.PI*2);ol(t.dark,3);
    ctx.beginPath();ctx.arc(cx,BTN_Y+7-off,BTN_R,0,Math.PI*2);ol(down?'#fff':t.color,3);
    if(down){ctx.beginPath();ctx.arc(cx,BTN_Y+7-off,BTN_R-6,0,Math.PI*2);ctx.fillStyle=t.color;ctx.fill();}
    ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.ellipse(cx-14,BTN_Y-14-off,13,8,-0.5,0,Math.PI*2);ctx.fill();
    bigText(t.label,cx,BTN_Y+7-off,17,'#fff','rgba(0,0,0,.6)');
    text(t.sub,cx,BTN_Y+72,12,'#aab','center');
  });
}
function drawOverlay(){
  const blink=Math.floor(clock/0.45)%2===0;
  if(state==='title'){
    ctx.fillStyle='rgba(20,10,70,.55)';ctx.fillRect(0,0,W,PANEL_Y);
    [['ちこくだ！','#ff5a5a'],['チャイムだ！','#ffd23f'],['門ジャンプ！','#5ad15a']].forEach(([t,c],i)=>{
      bigText(t,CX,105+i*64+Math.sin(clock*4+i)*4,50,c);
    });
    rr(30,300,420,170,18);ctx.fillStyle='rgba(255,255,255,.94)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OUT;ctx.stroke();
    text('あそびかた',CX,322,18,'#e33','center');
    ['① 赤と青を こうごに 連打！ ダッシュ！','② 緑を おしっぱなしで 角度をためる','③ 黄色い帯の中で はなして ジャンプ！','④ 門→家→電柱→東京タワー→…→宇宙！'].forEach((s,i)=>text(s,CX,355+i*28,15,'#223','center'));
    text('その先は どこまで高く とべるか勝負！',CX,458,14,'#e33','center');
    if(blink)bigText('ボタンを おして スタート！',CX,505,24,'#ffe14d');
    if(best>0)text('BEST '+best,CX,532,14,'#fff','center');
  }
  if(state==='preview'){
    ctx.fillStyle='rgba(20,20,60,.6)';rr(50,300,380,100,14);ctx.fill();
    bigText('STAGE '+st.n+'　こえるのは…',CX,328,22,'#fff');
    bigText(st.type==='sky'?'その先の 宇宙！':st.name+'　'+fmtM(st.hm),CX,370,28,'#ffe14d');
  }
  if(state==='ready'){
    ctx.fillStyle='rgba(20,20,60,.5)';rr(70,118,340,100,14);ctx.fill();
    bigText('STAGE '+st.n+'　'+st.name,CX,148,24,'#fff');
    bigText('高さ '+fmtM(st.hm),CX,190,32,'#ffe14d');
    bigText(readyT<0.9?'よーい…':'…',CX,320,54,'#fff');
  }
  if(state==='play'){
    if(goT>0)bigText('ドン！',CX,300,80*(1+goT*0.3),'#ff5a5a');
    else if(!holding&&!jumped){
      const dist=LINE-gx;
      if(dist>ZONE_FAR+420&&blink)bigText('赤と青を 連打！！',CX,270,30,'#fff');
      else if(dist<=ZONE_FAR+420&&dist>ZONE_FAR&&blink)bigText('緑を おしっぱなし！',CX,270,30,'#ffe14d');
      else if(dist<=ZONE_FAR&&blink)bigText('緑を はなして ジャンプ！',CX,270,26,'#ffe14d');
    }
    if(holding)drawAngleMeter();
  }
  popups.forEach(p=>{const k=p.t/p.life;ctx.globalAlpha=k>0.7?1-(k-0.7)/0.3:1;bigText(p.text,p.x,p.y-p.t*28,p.size*(1+Math.max(0,0.3-p.t)),p.color);ctx.globalAlpha=1;});
  if(state==='result'&&res){
    const r=res;let title,col;
    if(r.type==='clear'){title=r.perfect?'パーフェクト！！':st.name+'を こえた！';col=r.perfect?'#ffe14d':'#7dff6a';}
    else if(r.type==='sky'){title='宇宙のかなたへ！';col='#7dff6a';}
    else if(r.type==='late'){title='ちこく！';col='#ff8a8a';}
    else if(r.type==='crash'){title='ゲキトツ！';col='#ff8a8a';}
    else{title='とどかない！';col='#ffb060';}
    ctx.fillStyle='rgba(20,20,60,.72)';rr(24,130,432,140,16);ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
    bigText(title,CX,172,title.length>9?28:38,col);
    if(r.type==='clear')bigText('+'+r.pts,CX,228,34,'#ffe14d');
    else if(r.type==='sky')bigText('到達 '+fmtM(r.alt),CX,228,32,'#ffe14d');
    else{text(r.why,CX,222,20,'#fff','center');text(lives>0?'のこり ライフ '+lives:'',CX,250,15,'#ccd','center');}
  }
  if(state==='over'){
    ctx.fillStyle='rgba(20,10,50,.78)';ctx.fillRect(0,0,W,PANEL_Y);
    const sky=res&&res.type==='sky';
    bigText(sky?'おつかれさま！':'ゲームオーバー',CX,150,44,sky?'#7dff6a':'#ff5a5a');
    text(sky?'最高到達点 '+fmtM(skyAlt):'STAGE '+stage+'（'+st.name+'）まで とうたつ',CX,225,19,'#fff','center');
    bigText('SCORE '+score,CX,275,30,'#ffe14d');
    text('BEST '+best+(newBest?'  NEW!':''),CX,320,18,newBest?'#ff8fb1':'#ccc','center');
    if(performance.now()-overAt>800&&blink)bigText('ボタンで もう一回！',CX,410,26,'#fff');
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*9,(Math.random()-.5)*9);
  ctx.beginPath();ctx.rect(0,0,W,PANEL_Y);ctx.clip();
  drawSky();
  ctx.save();ctx.translate(PX,GY+camY);ctx.translate(-camX,0);
  drawWorld();
  ctx.restore();
  ctx.restore();
  if(state!=='title'&&state!=='over'&&state!=='preview')drawHUD();
  drawButtons();
  drawOverlay();
}

// ---------- 入力 ----------
const ptrMap=new Map(),greenKeys=new Set();
function refreshGreen(){
  const any=greenKeys.size>0||[...ptrMap.values()].includes(1);
  if(greenDown&&!any){greenDown=false;release(1);}else greenDown=any;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;
  const i=Math.max(0,Math.min(2,Math.floor(x/BW)));
  ptrMap.set(e.pointerId,i);if(i===1)greenDown=true;press(i);
});
const pUp=e=>{if(!ptrMap.has(e.pointerId))return;const i=ptrMap.get(e.pointerId);ptrMap.delete(e.pointerId);if(i===1)refreshGreen();};
cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(e.repeat)return;const k=e.key.toLowerCase();
  if(k===' '||k==='enter'){e.preventDefault();if(state==='title'||state==='over')press(0);return;}
  const i=TYPES.findIndex(t=>t.keys.includes(k));if(i<0)return;
  if(i===1){greenKeys.add(k);greenDown=true;}
  press(i);
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(greenKeys.has(k)){greenKeys.delete(k);refreshGreen();}});

// ---------- ループ ----------
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
