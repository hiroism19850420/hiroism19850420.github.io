<!DOCTYPE html>
<html lang="ja">
<head>

<title>ドンカ道場 〜和太鼓リズムゲーム〜</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#140a05;color:#fff;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.show{display:flex}
.dim{background:rgba(0,0,0,.62)}
#menu{background:radial-gradient(circle at 50% 0%,#ff9d3a 0%,#d8401c 38%,#5a1206 100%);justify-content:flex-start;padding-top:20px}
#menu::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% -10%,rgba(255,255,255,.07) 0 6deg,transparent 6deg 12deg);pointer-events:none}
.logo{position:relative;text-align:center;margin-bottom:12px}
.logo .l1{display:block;font-size:74px;font-weight:900;letter-spacing:8px;color:#fff;-webkit-text-stroke:3px #3a1300;text-shadow:0 6px 0 #3a1300,0 0 24px #ffcf3a}
.logo .l2{display:inline-block;margin-top:6px;font-size:19px;background:#3a1300;padding:4px 18px;border-radius:20px;letter-spacing:4px}
.menuBody{position:relative;display:flex;gap:22px;width:1180px;height:530px}
.panel{background:rgba(30,10,2,.8);border:4px solid #ffcf3a;border-radius:18px;padding:16px;display:flex;flex-direction:column}
.songs{flex:1.15}.opts{flex:1}
.ptitle{font-size:20px;font-weight:bold;color:#ffcf3a;margin:4px 0 8px}
#songList{flex:1;overflow-y:auto;background:rgba(0,0,0,.35);border-radius:10px;padding:6px;touch-action:pan-y}
.song{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:4px 0;border-radius:10px;background:rgba(255,255,255,.08);cursor:pointer;font-size:18px}
.song:hover{background:rgba(255,255,255,.16)}
.song.sel{background:linear-gradient(90deg,#ff5a1f,#ff9a2a);box-shadow:0 0 0 3px #fff inset}
.song .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.song .del{border:none;background:rgba(0,0,0,.4);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px}
.empty{opacity:.75;padding:30px 10px;text-align:center;line-height:1.9}
.btn{display:inline-block;border:none;cursor:pointer;font-family:inherit;font-weight:bold;color:#fff;background:linear-gradient(#ff7a2a,#d8401c);border:3px solid #fff;border-radius:40px;padding:10px 22px;font-size:18px;text-align:center;box-shadow:0 4px 0 #5a1206;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a1206}
.hint{font-size:13px;opacity:.75;margin-top:6px;text-align:center}
#diffs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.diff{border:3px solid rgba(255,255,255,.35);border-radius:12px;padding:12px 4px;text-align:center;font-weight:bold;font-size:17px;cursor:pointer;opacity:.55}
.diff.sel{opacity:1;border-color:#fff;box-shadow:0 0 14px rgba(255,255,255,.7)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0;font-size:16px}
.row input[type=range]{flex:1;max-width:210px}
.row select{font-size:16px;padding:3px 6px;border-radius:6px}
.start{font-size:28px;padding:12px;margin-top:auto;background:linear-gradient(#ffd23a,#ff8a00);color:#4a1a00;box-shadow:0 5px 0 #7a3a00}
.keys{font-size:13px;opacity:.85;text-align:center;margin-top:8px;line-height:1.6}
#loading{background:rgba(20,6,0,.88)}
.ltxt{font-size:30px;margin-bottom:18px}
.bar{width:600px;height:22px;border:3px solid #fff;border-radius:12px;overflow:hidden}
#lbar{height:100%;width:0;background:linear-gradient(90deg,#ff5a1f,#ffd23a);transition:width .2s}
.box{background:rgba(30,10,2,.94);border:4px solid #ffcf3a;border-radius:20px;padding:24px 40px;display:flex;flex-direction:column;align-items:stretch;min-width:360px}
.btitle{font-size:30px;text-align:center;font-weight:900;margin-bottom:8px;max-width:760px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.result{min-width:640px}
.stamp{font-size:46px;font-weight:900;text-align:center;margin:4px 0 8px;-webkit-text-stroke:2px #000}
.rscore{font-size:56px;font-weight:900;text-align:center;color:#ffd23a;-webkit-text-stroke:2px #3a1300}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 34px;font-size:22px;margin:12px 0}
.rgrid div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.3);padding:3px 0}
.rbtns{display:flex;gap:14px;justify-content:center}
</style>

<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="menu" class="screen show">
    <div class="logo"><span class="l1">ドンカ道場</span><span class="l2">好きな曲で叩く 和太鼓リズムゲーム</span></div>
    <div class="menuBody">
      <div class="panel songs">
        <div class="ptitle">曲リスト</div>
        <div id="songList"></div>
        <label class="btn">＋ 曲を追加（MP3 / M4A / MP4 / WAV）
          <input type="file" id="file" accept="audio/*,video/mp4,.mp3,.m4a,.mp4,.aac,.wav,.ogg,.flac" multiple hidden>
        </label>
        <div class="hint">この画面へのドラッグ＆ドロップでも追加可能　追加曲はブラウザ内に保存</div>
      </div>
      <div class="panel opts">
        <div class="ptitle">難易度</div>
        <div id="diffs"></div>
        <div class="ptitle" style="margin-top:12px">設定</div>
        <div class="row">スクロール速度
          <select id="speed"><option>1</option><option>1.25</option><option>1.5</option><option>2</option><option>2.5</option><option>3</option><option>4</option></select>
        </div>
        <div class="row">タイミング調整 <input type="range" id="offset" min="-200" max="200" step="5"><span id="offv" style="width:70px;text-align:right"></span></div>
        <div class="row">曲の音量 <input type="range" id="mvol" min="0" max="100"></div>
        <div class="row">太鼓の音量 <input type="range" id="svol" min="0" max="100"></div>
        <div class="row"><label><input type="checkbox" id="auto"> オート演奏（ズレ確認用）</label></div>
        <button id="start" class="btn start">演奏開始！</button>
        <div class="keys">F・J：ドン（面）　D・K：カッ（縁）　Esc：一時停止<br>スマホは画面下の太鼓をタップ（中央ドン／外側カッ）</div>
      </div>
    </div>
  </div>

  <div id="loading" class="screen"><div class="ltxt" id="ltxt">読み込み中</div><div class="bar"><div id="lbar"></div></div></div>

  <div id="pause" class="screen dim">
    <div class="box"><div class="btitle">一時停止</div>
      <button class="btn" id="pResume">続ける</button>
      <button class="btn" id="pRetry">はじめから</button>
      <button class="btn" id="pQuit">曲選択へ</button>
    </div>
  </div>

  <div id="result" class="screen dim"><div class="box result" id="rbox"></div></div>
</div>

<script>
(()=>{
'use strict';
const W=1280,H=720,TAU=Math.PI*2;
const JX=392,LY=260,LT=192,LB=328,LANE_L=300;
const GREAT=0.042,GOOD=0.092,BAD=0.125,LEAD=2.5;
const $=id=>document.getElementById(id);
const wrap=$('wrap'),cv=$('cv'),X=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR;cv.height=H*DPR;X.setTransform(DPR,0,0,DPR,0,0);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wrap.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
const sleep=()=>new Promise(r=>setTimeout(r,0));
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== 難易度 ===== */
const DIFF={
 easy:{name:'かんたん',color:'#ff7a1a',levels:[0],gapBeats:1,keep:0.5,bigRate:0.1,rollGap:3,rollEvery:12,balloonRate:5,clear:60,fullRate:0.7},
 normal:{name:'ふつう',color:'#3fb34f',levels:[0,1],gapBeats:0.5,keep:0.62,bigRate:0.08,rollGap:3,rollEvery:12,balloonRate:7,clear:70,fullRate:0.72},
 hard:{name:'むずかしい',color:'#4a78c8',levels:[0,1,2],gapBeats:0.25,keep:0.74,bigRate:0.06,rollGap:2.5,rollEvery:14,balloonRate:10,clear:70,fullRate:0.75},
 oni:{name:'おに',color:'#d6246e',levels:[0,1,2,3],gapBeats:0.25,keep:0.9,bigRate:0.04,rollGap:2,rollEvery:15,balloonRate:13,clear:80,fullRate:0.78}
};

/* ===== 設定 ===== */
let S={diff:'normal',speed:1,offset:0,mvol:80,svol:90,auto:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('donka-settings')||'{}'));}catch(_){}
const saveS=()=>{try{localStorage.setItem('donka-settings',JSON.stringify(S));}catch(_){}};

/* ===== オーディオ ===== */
let actx=null,musicGain,seGain,noiseBuf,lastCt=-1,lastPerf=0;
function ensureAudio(){
 if(actx)return;
 actx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
 musicGain=actx.createGain();musicGain.connect(actx.destination);
 seGain=actx.createGain();seGain.connect(actx.destination);
 noiseBuf=actx.createBuffer(1,Math.floor(actx.sampleRate*0.3),actx.sampleRate);
 const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const len=Math.floor(actx.sampleRate*1.1),ir=actx.createBuffer(2,len,actx.sampleRate);
 for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
 const cv=actx.createConvolver();cv.buffer=ir;const rg=actx.createGain();rg.gain.value=0.28;seGain.connect(cv);cv.connect(rg);rg.connect(actx.destination);
 setVolumes();
}
function setVolumes(){if(!actx)return;musicGain.gain.value=S.mvol/100;seGain.gain.value=S.svol/100*0.6;}
function noise(t,type,freq,vol,dur){
 const n=actx.createBufferSource();n.buffer=noiseBuf;
 const f=actx.createBiquadFilter();f.type=type;f.frequency.value=freq;
 const g=actx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
 n.connect(f);f.connect(g);g.connect(seGain);n.start(t);n.stop(t+dur+0.02);
}
function tone(t,type,f0,f1,vol,dur){
 const o=actx.createOscillator(),g=actx.createGain();o.type=type;
 o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*0.7);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
 o.connect(g);g.connect(seGain);o.start(t);o.stop(t+dur+0.02);
}
function playDon(){ /* 和太鼓：腹に響く胴鳴り＋皮の打撃音＋バチ当たり */
 const t=actx.currentTime;
 tone(t,'sine',150,42,1.5,0.7);      /* 胴鳴り(低音) */
 tone(t,'sine',300,80,0.8,0.35);     /* 胴の倍音 */
 tone(t,'triangle',520,140,0.55,0.16);/* 皮の張り */
 noise(t,'bandpass',1400,1.3,0.05);  /* バチのアタック */
 noise(t,'lowpass',500,1.0,0.22);    /* ドン！の圧 */
}
function playKa(){ /* 縁(ふち)を叩く カッ！ */
 const t=actx.currentTime;
 tone(t,'square',2100,900,0.35,0.06);
 tone(t,'triangle',1350,600,0.7,0.12);
 tone(t,'sine',420,220,0.5,0.1);
 noise(t,'highpass',3000,0.9,0.07);
 noise(t,'bandpass',2200,0.7,0.12);
}
function playFanfare(){const t=actx.currentTime;[0,0.16,0.32,0.5].forEach((d,i)=>{playDon2(t+d,i===3);});[523,659,784,1047].forEach((f,i)=>tone(t+i*0.16,'triangle',f,f,0.35,0.5));}
function playDon2(t,big){tone(t,'sine',150,42,big?1.6:1.2,0.6);noise(t,'lowpass',500,0.9,0.2);noise(t,'bandpass',1400,1,0.05);}
function playSad(){const t=actx.currentTime;[392,330,262].forEach((f,i)=>tone(t+i*0.3,'sawtooth',f,f*0.97,0.18,0.5));tone(t+0.9,'sine',90,40,1,0.9);}
function playPop(){const t=actx.currentTime;noise(t,'bandpass',1800,1,0.18);noise(t,'lowpass',400,0.8,0.12);}
const playSE=type=>type==='don'?playDon():playKa();
function audioNow(){const ct=actx.currentTime,p=performance.now();if(ct!==lastCt){lastCt=ct;lastPerf=p;}return ct+Math.min(0.05,(p-lastPerf)/1000);}
const songTime=()=>audioNow()-G.startAt-(actx.outputLatency||0)-G.offset;
function decode(blob){return blob.arrayBuffer().then(ab=>new Promise((res,rej)=>{const p=actx.decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(rej);}));}

/* ===== IndexedDB ===== */
const DBN='donka-dojo',ST='songs';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function dbTx(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(ST,mode);const r=fn(tx.objectStore(ST));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);});}
const dbPut=rec=>dbTx('readwrite',s=>s.put(rec));
const dbDel=id=>dbTx('readwrite',s=>s.delete(id));
const dbAll=()=>dbTx('readonly',s=>s.getAll());

/* ===== 音声解析 ===== */
function pct(a,p){const n=a.length;if(!n)return 0;const step=Math.max(1,Math.floor(n/20000));const s=[];for(let i=0;i<n;i+=step)s.push(a[i]);s.sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(p*s.length))];}
async function filt(mono,sr,type,freq){
 const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
 const oc=new OC(1,mono.length,sr);const b=oc.createBuffer(1,mono.length,sr);b.getChannelData(0).set(mono);
 const s=oc.createBufferSource();s.buffer=b;let node=s;
 for(let k=0;k<2;k++){const f=oc.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=type==='bandpass'?1:0.707;node.connect(f);node=f;}
 node.connect(oc.destination);s.start(0);
 return (await oc.startRendering()).getChannelData(0);
}
async function analyzeAudio(buf,prog){
 const sr=buf.sampleRate,len=buf.length,nc=buf.numberOfChannels;
 const mono=new Float32Array(len);
 for(let c=0;c<nc;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)mono[i]+=d[i]/nc;}
 prog(0.08,'音を帯域ごとに分離中');
 const low=await filt(mono,sr,'lowpass',150);prog(0.2);
 const mid=await filt(mono,sr,'bandpass',1500);prog(0.32);
 const high=await filt(mono,sr,'highpass',5000);prog(0.44,'音の立ち上がりを検出中');await sleep();
 const hop=Math.max(1,Math.round(sr*0.01)),hopT=hop/sr,nF=Math.floor(len/hop);
 const env=x=>{const e=new Float32Array(nF);for(let f=0;f<nF;f++){let s=0;const o=f*hop;for(let i=0;i<hop;i++){const v=x[o+i];s+=v*v;}e[f]=Math.sqrt(s/hop);}return e;};
 const eA=env(mono),eL=env(low),eM=env(mid),eH=env(high);
 const onset=e=>{const l=new Float32Array(nF);for(let i=0;i<nF;i++)l[i]=Math.log1p(e[i]*300);
  const o=new Float32Array(nF);for(let i=1;i<nF;i++)o[i]=Math.max(0,l[i]-l[i-1]);
  const s=new Float32Array(nF);for(let i=1;i<nF-1;i++)s[i]=o[i-1]*0.25+o[i]*0.5+o[i+1]*0.25;
  const p=pct(s,0.995)||1;for(let i=0;i<nF;i++)s[i]/=p;return s;};
 const oA=onset(eA),oL=onset(eL),oM=onset(eM),oH=onset(eH);
 const oC=new Float32Array(nF);for(let i=0;i<nF;i++)oC[i]=0.45*oA[i]+0.3*oL[i]+0.15*oM[i]+0.1*oH[i];
 {const p=pct(oC,0.995)||1;for(let i=0;i<nF;i++)oC[i]/=p;}
 prog(0.55,'テンポ推定中');await sleep();
 const minLag=Math.floor(60/200/hopT),maxLag=Math.ceil(60/65/hopT),top=Math.min(nF-1,maxLag*2+2);
 const acf=new Float32Array(top+1);
 for(let lag=minLag;lag<=top;lag++){let s=0;for(let i=0;i+lag<nF;i++)s+=oC[i]*oC[i+lag];acf[lag]=s/Math.max(1,nF-lag);}
 let best=-1,bl=minLag;
 for(let lag=minLag;lag<=maxLag;lag++){const bpm=60/(lag*hopT);const w=Math.exp(-0.5*Math.pow(Math.log2(bpm/125)/0.8,2));
  const v=(acf[lag]+0.5*(acf[lag*2]||0))*w;if(v>best){best=v;bl=lag;}}
 let lagF=bl;{const y0=acf[bl-1]||0,y1=acf[bl],y2=acf[bl+1]||0,dn=y0-2*y1+y2;if(dn!==0)lagF=bl+Math.max(-0.5,Math.min(0.5,0.5*(y0-y2)/dn));}
 let bpm=60/(lagF*hopT);while(bpm<75)bpm*=2;while(bpm>=190)bpm/=2;
 prog(0.7,'拍の位置を調整中');await sleep();
 let bs=-1,bBpm=bpm,bPh=0;
 for(let cb=bpm*0.98;cb<=bpm*1.02;cb+=0.02){const P=60/cb/hopT;
  for(let ph=0;ph<P;ph+=1){let s=0;for(let x=ph;x<nF;x+=P){s+=oC[Math.round(x)]||0;s+=0.4*(oC[Math.round(x+P/2)]||0);}if(s>bs){bs=s;bBpm=cb;bPh=ph;}}}
 const beat=60/bBpm,phase=(bPh*hopT)%beat;
 prog(0.85,'音符候補を抽出中');await sleep();
 const win=Math.round(0.35/hopT),pre=new Float64Array(nF+1);for(let i=0;i<nF;i++)pre[i+1]=pre[i]+oC[i];
 const eMax=pct(eA,0.995)||1,eMed=pct(eA,0.5),peaks=[];
 for(let i=3;i<nF-3;i++){const v=oC[i];if(v<0.06)continue;let mx=true;
  for(let k=-3;k<=3;k++){if(k&&oC[i+k]>v){mx=false;break;}}if(!mx)continue;
  const a=Math.max(0,i-win),b=Math.min(nF,i+win),mean=(pre[b]-pre[a])/(b-a);
  if(v<mean*1.3+0.03||eA[i]<eMax*0.03)continue;
  let lo=0,hi=0;for(let k=-2;k<=2;k++){lo=Math.max(lo,oL[i+k]);hi=Math.max(hi,0.6*oM[i+k]+0.6*oH[i+k]);}
  peaks.push({t:i*hopT,s:v,lo,hi,loud:eA[i]/eMax});}
 return {bpm:bBpm,beat,phase,peaks,duration:buf.duration,eA,hopT,eMed,eMax};
}
function meanE(an,a,b){const f0=Math.max(0,Math.floor(a/an.hopT)),f1=Math.min(an.eA.length,Math.floor(b/an.hopT));let s=0;for(let i=f0;i<f1;i++)s+=an.eA[i];return f1>f0?s/(f1-f0):0;}
function buildChart(an,dk){
 const D=DIFF[dk],beat=an.beat,step=beat/4,map=new Map(),off=[];
 for(const p of an.peaks){const g=(p.t-an.phase)/step,gi=Math.round(g),dev=Math.abs(g-gi)*step;
  if(dev<=0.04){const m=((gi%4)+4)%4,lv=m===0?0:m===2?1:2,ex=map.get(gi);
   if(ex){ex.s=Math.max(ex.s,p.s);ex.lo=Math.max(ex.lo,p.lo);ex.hi=Math.max(ex.hi,p.hi);ex.loud=Math.max(ex.loud,p.loud);}
   else map.set(gi,{t:an.phase+gi*step,s:p.s,lo:p.lo,hi:p.hi,loud:p.loud,lv});}
  else off.push(Object.assign({},p,{lv:3}));}
 let cand=[...map.values()];if(D.levels.includes(3))cand=cand.concat(off);
 cand=cand.filter(c=>D.levels.includes(c.lv)&&c.t>0.3&&c.t<an.duration-0.2);
 const lvW=[1.35,1.12,1,0.8];cand.forEach(c=>c.sc=c.s*lvW[c.lv]);
 cand.sort((a,b)=>b.sc-a.sc);cand=cand.slice(0,Math.ceil(cand.length*D.keep));
 const gap=Math.max(D.gapBeats*beat*0.97,0.075),acc=[];
 for(const c of cand){if(acc.every(a=>Math.abs(a.t-c.t)>=gap))acc.push(c);}
 acc.sort((a,b)=>a.t-b.t);
 let notes;
 if(acc.length<8){notes=[];let k=0;
  for(let t=an.phase;t<an.duration-0.3;t+=beat*(dk==='easy'?2:1)){if(t<0.3)continue;if(meanE(an,t-0.05,t+0.05)>an.eMax*0.12){notes.push({t,type:k%2?'ka':'don',big:false,s:1,lv:0,loud:1});k++;}}}
 else{const rs=acc.map(c=>c.lo/(c.lo+c.hi+1e-6)),so=[...rs].sort((a,b)=>a-b);
  const thr=Math.min(0.62,Math.max(0.38,so[Math.floor(so.length*0.5)]||0.5));
  notes=acc.map((c,i)=>({t:c.t,type:rs[i]>=thr?'don':'ka',big:false,s:c.s,lv:c.lv,loud:c.loud}));}
 const bc=notes.filter(n=>n.lv<=1).sort((a,b)=>b.s*b.loud-a.s*a.loud),nb=Math.floor(notes.length*D.bigRate),bigs=[];
 for(const n of bc){if(bigs.length>=nb)break;if(bigs.every(b=>Math.abs(b.t-n.t)>beat*1.5)){n.big=true;bigs.push(n);}}
 const s8=beat/2,snap=t=>an.phase+Math.round((t-an.phase)/s8)*s8,out=[];let lastRoll=-99,rc=0;
 for(let i=0;i<notes.length;i++){out.push(notes[i]);
  const a=notes[i].t,b=i+1<notes.length?notes[i+1].t:Math.min(an.duration-0.5,a+beat*6);
  if((b-a)/beat>=D.rollGap&&a-lastRoll>D.rollEvery&&meanE(an,a,b)>an.eMed*0.6){
   const st=snap(a+beat*(dk==='hard'||dk==='oni'?0.5:1));let en=snap(Math.min(b-beat,st+beat*4));
   if(en-st>=beat*0.9){rc++;
    out.push(rc%3===0?{t:st,end:en,type:'balloon',need:Math.max(4,Math.round((en-st)*D.balloonRate)),big:false}
                     :{t:st,end:en,type:'roll',big:rc%2===0});lastRoll=st;}}}
 return {notes:out,bpm:an.bpm,beat,phase:an.phase,duration:an.duration};
}

/* ===== ゲーム状態 ===== */
const G={state:'menu',song:null,chart:null,notes:[],src:null,startAt:0,paused:false,pausedSt:0,diff:'normal',
 score:0,shownScore:0,combo:0,maxCombo:0,great:0,good:0,bad:0,rollHits:0,gauge:0,inc:1,clear:70,total:0,head:0,
 fx:[],flies:[],popups:[],judgeTxt:null,flash:{},laneFlash:null,lastBig:null,pps:450,offset:0,auto:false,
 endShown:false,endT:0,lastEnd:0,autoSide:0};
const xOf=(t,st)=>JX+(t-st)*G.pps;
const isNote=n=>n.type==='don'||n.type==='ka';
const nowR=()=>performance.now()/1000;

function beginPlay(){
 stopMusic();const c=G.chart,D=DIFF[G.diff];
 G.notes=c.notes.map(n=>Object.assign({},n,{judged:false,res:null,hits:0,popped:false,lastAuto:-9}));
 G.total=G.notes.filter(isNote).length;G.inc=100/Math.max(1,G.total*D.fullRate);G.clear=D.clear;
 Object.assign(G,{score:0,shownScore:0,combo:0,maxCombo:0,great:0,good:0,bad:0,rollHits:0,gauge:0,head:0,
  fx:[],flies:[],popups:[],judgeTxt:null,lastBig:null,endShown:false,paused:false,flash:{},laneFlash:null});
 G.lastEnd=G.notes.reduce((m,n)=>Math.max(m,n.end||n.t),0);
 G.pps=c.bpm/60*225*S.speed;G.offset=S.offset/1000;G.auto=S.auto;setVolumes();
 const src=actx.createBufferSource();src.buffer=G.song.buffer;src.connect(musicGain);
 G.startAt=actx.currentTime+LEAD;src.start(G.startAt);G.src=src;lastCt=-1;
 G.state='play';show(null);
}
function stopMusic(){if(G.src){try{G.src.stop();}catch(_){}try{G.src.disconnect();}catch(_){}G.src=null;}}

/* ===== 判定 ===== */
function applyJudge(n,res,side,t){
 const rt=nowR();n.judged=true;n.res=res;G.judgeTxt={res,t:rt};
 if(res==='bad'){G.bad++;G.combo=0;G.gauge=Math.max(0,G.gauge-G.inc*2);return;}
 res==='great'?G.great++:G.good++;
 G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
 const pts=res==='great'?1000:500;G.score+=pts;
 G.gauge=Math.min(100,G.gauge+G.inc*(res==='great'?1:0.5));
 G.fx.push({kind:n.type,big:n.big,res,t:rt});G.flies.push({type:n.type,big:n.big,t:rt});
 if(n.big)G.lastBig={type:n.type,side,t,pts};
 if(G.combo%100===0)G.popups.push({txt:G.combo+'コンボ！',t:rt});
}
function rollHit(n,type){n.hits++;G.rollHits++;G.score+=n.big?200:100;G.flies.push({type:type==='ka'?'ka':'don',big:false,t:nowR()});}
function balloonHit(n){n.hits++;G.rollHits++;G.score+=300;
 if(n.hits>=n.need){n.popped=true;G.score+=5000;playPop();const rt=nowR();G.fx.push({kind:'pop',big:true,res:'great',t:rt});G.popups.push({txt:'パーン！',t:rt});}}
function judgeHit(type,side,t){
 const lb=G.lastBig;
 if(lb&&lb.type===type&&lb.side!==side&&Math.abs(t-lb.t)<=0.05){G.score+=lb.pts;G.fx.push({kind:type,big:true,res:'great',t:nowR()});G.lastBig=null;return;}
 for(let i=G.head;i<G.notes.length;i++){const n=G.notes[i];if(n.t>t+BAD)break;
  if(n.type==='roll'){if(t>=n.t-0.03&&t<=n.end){rollHit(n,type);return;}continue;}
  if(n.type==='balloon'){if(t>=n.t-0.03&&t<=n.end&&!n.popped){if(type==='don')balloonHit(n);return;}continue;}
  if(n.judged||n.type!==type)continue;
  const d=Math.abs(t-n.t);if(d>BAD)continue;
  applyJudge(n,d<=GREAT?'great':d<=GOOD?'good':'bad',side,t);return;}
}
function input(type,side,lag){
 if(G.state!=='play'||G.paused)return;
 const rt=nowR();playSE(type);G.flash[type+side]=rt;G.laneFlash={type,t:rt};
 if(G.auto)return;judgeHit(type,side,songTime()-lag);
}
function autoPlay(st){
 const rt=nowR();
 for(let i=G.head;i<G.notes.length;i++){const n=G.notes[i];if(n.t>st)break;
  if(isNote(n)){if(n.judged)continue;G.autoSide^=1;const sd=G.autoSide?'L':'R';
   playSE(n.type);G.flash[n.type+sd]=rt;G.laneFlash={type:n.type,t:rt};applyJudge(n,'great',sd,n.t);
   if(n.big){G.flash[n.type+(sd==='L'?'R':'L')]=rt;if(G.lastBig){G.score+=G.lastBig.pts;G.lastBig=null;}}}
  else if(!n.popped&&st<=n.end&&st-n.lastAuto>=1/16){n.lastAuto=st;G.autoSide^=1;const sd=G.autoSide?'L':'R';
   playSE('don');G.flash['don'+sd]=rt;G.laneFlash={type:'don',t:rt};n.type==='roll'?rollHit(n,'don'):balloonHit(n);}}
}
function update(st,rt){
 const N=G.notes;if(G.auto)autoPlay(st);
 for(let i=G.head;i<N.length;i++){const n=N[i];if(n.t>st)break;if(isNote(n)&&!n.judged&&st>n.t+BAD)applyJudge(n,'bad','L',st);}
 while(G.head<N.length){const n=N[G.head];const done=isNote(n)?n.judged:(n.popped||st>n.end+0.05);if(!done)break;G.head++;}
 if(G.lastBig&&st-G.lastBig.t>0.1)G.lastBig=null;
 if(!G.endShown&&G.head>=N.length&&st>G.lastEnd+0.5){G.endShown=true;G.endT=rt;}
 if(st>Math.max(G.chart.duration+0.3,G.lastEnd+3.5))finish();
}

/* ===== 描画ヘルパー ===== */
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function sText(t,x,y,font,fill,stroke,lw,align,maxW){X.font=font;X.textAlign=align||'center';X.lineJoin='round';
 if(stroke){X.lineWidth=lw||5;X.strokeStyle=stroke;maxW?X.strokeText(t,x,y,maxW):X.strokeText(t,x,y);}
 X.fillStyle=fill;maxW?X.fillText(t,x,y,maxW):X.fillText(t,x,y);}
const COL={don:['#ff7a52','#e0321a'],ka:['#9ae6f2','#3aa6c8'],roll:['#fff27a','#f0b400'],balloon:['#ffb36a','#ff5a12']};
function drawNote(x,y,type,big,s=1){
 const r=(big?46:31)*s,ir=r-6*s,c=COL[type];
 X.fillStyle='#000';X.beginPath();X.arc(x,y,r+3*s,0,TAU);X.fill();
 X.fillStyle='#fff';X.beginPath();X.arc(x,y,r,0,TAU);X.fill();
 const gr=X.createRadialGradient(x-ir*0.35,y-ir*0.4,ir*0.1,x,y,ir);gr.addColorStop(0,c[0]);gr.addColorStop(1,c[1]);
 X.fillStyle=gr;X.beginPath();X.arc(x,y,ir,0,TAU);X.fill();
 X.fillStyle='rgba(255,255,255,.35)';X.beginPath();X.ellipse(x-ir*0.3,y-ir*0.45,ir*0.4,ir*0.22,-0.4,0,TAU);X.fill();
}
function drawRoll(n,st){
 const x1=xOf(n.t,st),x2=Math.max(x1,xOf(n.end,st)),r=n.big?46:31;
 const body=(rad,col)=>{X.fillStyle=col;X.beginPath();X.moveTo(x1,LY-rad);X.lineTo(x2,LY-rad);X.arc(x2,LY,rad,-Math.PI/2,Math.PI/2);X.lineTo(x1,LY+rad);X.closePath();X.fill();};
 body(r+3,'#000');body(r,'#fff');body(r-6,'#f5c400');drawNote(x1,LY,'roll',n.big);
}
function drawBalloon(x,n){
 const k=1+Math.min(1,n.hits/n.need)*0.6;
 X.strokeStyle='#000';X.lineWidth=3;X.beginPath();X.moveTo(x+30,LY);X.lineTo(x+46,LY);X.stroke();
 X.fillStyle='#000';X.beginPath();X.ellipse(x+46+24*k,LY,24*k,27*k,0,0,TAU);X.fill();
 X.fillStyle='#ff5aa0';X.beginPath();X.ellipse(x+46+24*k,LY,21*k,24*k,0,0,TAU);X.fill();
 X.fillStyle='rgba(255,255,255,.5)';X.beginPath();X.ellipse(x+40+20*k,LY-10*k,6*k,9*k,-0.5,0,TAU);X.fill();
 drawNote(x,LY,'balloon',false);
}
function drawDrum(cx,cy,R,r,rt){
 const A=k=>Math.max(0,1-(rt-(G.flash[k]??-9))/0.12);
 X.fillStyle='#3a1a08';X.beginPath();X.arc(cx,cy,R+7,0,TAU);X.fill();
 X.fillStyle='#8a4a20';X.beginPath();X.arc(cx,cy,R,0,TAU);X.fill();
 const halves=[['L',Math.PI/2,Math.PI*1.5],['R',-Math.PI/2,Math.PI/2]];
 for(const [sd,a0,a1] of halves){const a=A('ka'+sd);if(a>0){X.fillStyle=`rgba(90,210,240,${a})`;X.beginPath();X.moveTo(cx,cy);X.arc(cx,cy,R,a0,a1);X.fill();}}
 X.fillStyle='#f4e2c0';X.beginPath();X.arc(cx,cy,r,0,TAU);X.fill();
 for(const [sd,a0,a1] of halves){const a=A('don'+sd);if(a>0){X.fillStyle=`rgba(240,60,30,${a})`;X.beginPath();X.moveTo(cx,cy);X.arc(cx,cy,r,a0,a1);X.fill();}}
 X.strokeStyle='#3a1a08';X.lineWidth=3;X.beginPath();X.moveTo(cx,cy-R);X.lineTo(cx,cy+R);X.stroke();
 X.beginPath();X.arc(cx,cy,r,0,TAU);X.stroke();
}
function drawChara(x,y,st,rt){
 const b=G.chart?Math.abs(Math.sin((st-G.chart.phase)/G.chart.beat*Math.PI)):0,dy=-b*14,happy=G.gauge>=G.clear;
 y+=dy;
 X.fillStyle='rgba(0,0,0,.3)';X.beginPath();X.ellipse(x,y-dy+92,70,12,0,0,TAU);X.fill();
 X.fillStyle='#e0321a';X.beginPath();X.ellipse(x,y,80,90,0,0,TAU);X.fill();
 X.strokeStyle='rgba(90,10,0,.5)';X.lineWidth=3;
 for(let i=-3;i<=3;i++){X.beginPath();X.ellipse(x,y+i*24,80*Math.sqrt(1-Math.pow(i*24/90,2)),6,0,0,Math.PI);X.stroke();}
 X.fillStyle='#222';rr(x-44,y-100,88,20,6);X.fill();rr(x-44,y+80,88,20,6);X.fill();
 X.fillStyle='#fff';X.beginPath();X.arc(x-26,y-12,14,0,TAU);X.arc(x+26,y-12,14,0,TAU);X.fill();
 X.fillStyle='#000';
 if(happy){X.lineWidth=5;X.strokeStyle='#000';X.beginPath();X.arc(x-26,y-8,8,Math.PI*1.1,Math.PI*1.9);X.stroke();X.beginPath();X.arc(x+26,y-8,8,Math.PI*1.1,Math.PI*1.9);X.stroke();}
 else{X.beginPath();X.arc(x-24,y-10,7,0,TAU);X.arc(x+28,y-10,7,0,TAU);X.fill();}
 X.fillStyle='#5a0a00';X.beginPath();X.arc(x,y+18,happy?20:12,0,Math.PI);X.fill();
 X.fillStyle='rgba(255,150,170,.7)';X.beginPath();X.ellipse(x-48,y+12,11,7,0,0,TAU);X.ellipse(x+48,y+12,11,7,0,0,TAU);X.fill();
}

/* ===== メイン描画 ===== */
function draw(st,rt){
 const bg=X.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#2a0c04');bg.addColorStop(1,'#7a2a0a');
 X.fillStyle=bg;X.fillRect(0,0,W,H);
 // 上部 提灯列
 for(let i=0;i<14;i++){const x=40+i*92,y=40+Math.sin(rt*2+i)*3;X.fillStyle=i%2?'#ffcf3a':'#ff5a1f';X.beginPath();X.ellipse(x,y,20,24,0,0,TAU);X.fill();}
 sText(G.song?G.song.name:'',W-30,110,'bold 30px sans-serif','#fff','#000',6,'right',700);
 const D=DIFF[G.diff];X.fillStyle=D.color;rr(W-200,122,170,28,14);X.fill();sText(D.name,W-115,144,'bold 18px sans-serif','#fff');
 // ゲージ
 const gx=440,gw=620,gy=150,gh=26;
 X.fillStyle='#000';rr(gx-4,gy-4,gw+8,gh+8,8);X.fill();X.fillStyle='#4a1a10';X.fillRect(gx,gy,gw,gh);
 const gv=gw*G.gauge/100,cl=G.gauge>=G.clear;
 const gg=X.createLinearGradient(gx,0,gx+gw,0);
 if(cl){gg.addColorStop(0,'#ff4a4a');gg.addColorStop(.5,'#ffd23a');gg.addColorStop(1,'#4affb0');}else{gg.addColorStop(0,'#ff3a1a');gg.addColorStop(1,'#ff9a2a');}
 X.fillStyle=gg;X.fillRect(gx,gy,gv,gh);
 X.fillStyle='rgba(0,0,0,.35)';for(let i=1;i<50;i++)X.fillRect(gx+i*gw/50,gy,1,gh);
 X.fillStyle='#fff';X.fillRect(gx+gw*G.clear/100-2,gy-8,4,gh+16);
 sText('魂',gx+gw+30,gy+22,'bold 26px sans-serif',G.gauge>=100?'#ffd23a':'#888','#000',5);
 // スコア
 G.shownScore+=(G.score-G.shownScore)*0.25;
 sText(String(Math.round(G.shownScore)),LANE_L-20,LT-20,'bold 40px sans-serif','#fff','#000',7,'right');
 // レーン
 X.fillStyle='#1a1a1a';X.fillRect(0,LT,W,LB-LT);
 X.fillStyle='#2e2e2e';X.fillRect(LANE_L,LT+6,W-LANE_L,LB-LT-12);
 if(G.laneFlash&&rt-G.laneFlash.t<0.12){X.fillStyle=G.laneFlash.type==='don'?'rgba(255,60,30,.25)':'rgba(60,180,255,.25)';X.fillRect(LANE_L,LT+6,W-LANE_L,LB-LT-12);}
 X.save();X.beginPath();X.rect(LANE_L,LT,W-LANE_L,LB-LT);X.clip();
 if(G.chart){const c=G.chart,bar=c.beat*4,t0=st-(JX-LANE_L)/G.pps,t1=st+(W-JX)/G.pps;
  X.fillStyle='rgba(255,255,255,.55)';
  for(let k=Math.ceil((t0-c.phase)/bar);c.phase+k*bar<=t1;k++){const x=xOf(c.phase+k*bar,st);X.fillRect(x-1,LT+6,2,LB-LT-12);}}
 // 判定枠
 X.strokeStyle='#888';X.lineWidth=4;X.beginPath();X.arc(JX,LY,34,0,TAU);X.stroke();
 X.strokeStyle='#666';X.lineWidth=3;X.beginPath();X.arc(JX,LY,50,0,TAU);X.stroke();
 // 音符
 const tMax=st+(W-JX+60)/G.pps,vis=[];
 for(let i=G.head;i<G.notes.length;i++){const n=G.notes[i];if(n.t>tMax)break;if(isNote(n)&&n.judged)continue;vis.push(n);}
 for(let i=vis.length-1;i>=0;i--){const n=vis[i];
  if(n.type==='roll')drawRoll(n,st);
  else if(n.type==='balloon'){if(n.popped)continue;const x=st>=n.t&&st<=n.end?JX:xOf(n.t,st);if(st<=n.end+0.05)drawBalloon(x,n);
   if(st>=n.t&&st<=n.end)sText(String(Math.max(0,n.need-n.hits)),JX,LT-4,'bold 34px sans-serif','#fff','#000',6);}
  else drawNote(xOf(n.t,st),LY,n.type,n.big);}
 // 打撃エフェクト
 G.fx=G.fx.filter(f=>rt-f.t<0.3);
 for(const f of G.fx){const p=(rt-f.t)/0.3;X.globalAlpha=1-p;X.strokeStyle=f.res==='great'?'#ffd23a':'#fff';X.lineWidth=8*(1-p)+2;
  X.beginPath();X.arc(JX,LY,(f.big?50:36)+p*40,0,TAU);X.stroke();X.globalAlpha=1;}
 X.restore();
 // 判定文字
 if(G.judgeTxt&&rt-G.judgeTxt.t<0.4){const j=G.judgeTxt,p=(rt-j.t)/0.4,y=LT-10-Math.min(1,p*4)*12;
  const m={great:['良','#ffd23a'],good:['可','#fff'],bad:['不可','#6ab4ff']}[j.res];
  X.globalAlpha=1-Math.max(0,p-0.6)/0.4;sText(m[0],JX,y,'bold 40px sans-serif',m[1],'#000',7);X.globalAlpha=1;}
 // 左パネル 太鼓とコンボ
 X.fillStyle='#b8321a';X.fillRect(0,LT,LANE_L,LB-LT);
 drawDrum(150,LY,60,40,rt);
 if(G.combo>=10)sText(String(G.combo),150,LY+16,'bold 46px sans-serif',G.combo>=100?'#ffd23a':'#fff','#000',7);
 // ゲージへ飛ぶ音符
 G.flies=G.flies.filter(f=>rt-f.t<0.4);
 for(const f of G.flies){const p=(rt-f.t)/0.4,x=JX+(gx+gw-JX)*p,y=LY-(LY-gy)*p-Math.sin(p*Math.PI)*120;

 if(G.auto)sText('オート演奏中',600,LB+40,'bold 24px sans-serif','#ffd23a','#000',5);
 G.popups=G.popups.filter(p=>rt-p.t<1);
 for(const p of G.popups){const a=1-(rt-p.t);X.globalAlpha=a;sText(p.txt,JX+200,LB+50-(1-a)*20,'bold 36px sans-serif','#ffd23a','#000',7);X.globalAlpha=1;}
 if(G.endShown){const fc=G.bad===0&&G.total>0;sText(fc?(G.good===0?'全良！':'フルコンボ！'):'演奏終了',800,LY+15,'bold 60px sans-serif',fc?'#ffd23a':'#fff','#000',9);}
 if(st<0&&G.state==='play')sText(String(Math.ceil(-st)),800,LY+20,'bold 70px sans-serif','#fff','#000',9);
}
const TX=840,TY=540,TR=125,Tr=80;

/* ===== リザルト ===== */
function finish(){
 if(G.state!=='play')return;G.state='result';G.pausedSt=songTime();stopMusic();
 const cl=G.gauge>=G.clear,fc=G.bad===0&&G.total>0,ap=fc&&G.good===0;
 const stamp=ap?['全良','#ffd23a']:fc?['フルコンボ','#ffd23a']:cl?['ノルマクリア','#ff7a2a']:['ノルマ失敗','#6ab4ff'];
 $('rbox').innerHTML=`<div class="btitle">${esc(G.song.name)}（${DIFF[G.diff].name}）</div>
 <div class="stamp" style="color:${stamp[1]}">${stamp[0]}</div><div class="rscore">${G.score}点</div>
 <div class="rgrid"><div><span>良</span><b>${G.great}</b></div><div><span>最大コンボ</span><b>${G.maxCombo}</b></div>
 <div><span>可</span><b>${G.good}</b></div><div><span>連打数</span><b>${G.rollHits}</b></div>
 <div><span>不可</span><b>${G.bad}</b></div><div><span>魂ゲージ</span><b>${Math.floor(G.gauge)}%</b></div></div>
 <div class="rbtns"><button class="btn" id="rRetry">もう一度</button><button class="btn" id="rQuit">曲選択へ</button></div>`;
 $('rRetry').onclick=beginPlay;$('rQuit').onclick=toMenu;show('result');if(actx)(cl?playFanfare:playSad)();
}
function toMenu(){stopMusic();G.state='menu';G.paused=false;if(actx&&actx.state==='suspended')actx.resume();show('menu');}
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('show'));if(id)$(id).classList.add('show');}

/* ===== ループ ===== */
function loop(){requestAnimationFrame(loop);const rt=nowR();
 if(G.state==='play'){if(G.paused){draw(G.pausedSt,rt);return;}const st=songTime();update(st,rt);if(G.state==='play')draw(st,rt);}
 else if(G.state==='result')draw(G.pausedSt,rt);
 else{X.clearRect(0,0,W,H);}
}
requestAnimationFrame(loop);

/* ===== 入力 ===== */
const KEYS={f:['don','L'],j:['don','R'],d:['ka','L'],k:['ka','R']};
addEventListener('keydown',e=>{
 if(G.state!=='play')return;
 if(e.key==='Escape'){e.preventDefault();G.paused?resume():pause();return;}
 if(e.repeat)return;const m=KEYS[e.key.toLowerCase()];if(!m)return;e.preventDefault();
 const lag=Math.max(0,Math.min(0.1,(performance.now()-e.timeStamp)/1000));input(m[0],m[1],isFinite(lag)?lag:0);
});
cv.addEventListener('pointerdown',e=>{
 if(G.state!=='play'||G.paused)return;const r=wrap.getBoundingClientRect();
 const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
 let cx=TX,cy=TY;if(Math.hypot(x-150,y-LY)<70){cx=150;cy=LY;}
 const d=Math.hypot(x-cx,y-cy);if(d>TR+40&&cx===TX)return;
 input(d<=(cx===TX?Tr:40)?'don':'ka',x<cx?'L':'R',0);
});
function pause(){if(G.paused)return;G.pausedSt=songTime();G.paused=true;actx.suspend();show('pause');}
function resume(){actx.resume().then(()=>{lastCt=-1;G.paused=false;show(null);});}
$('pResume').onclick=resume;
$('pRetry').onclick=()=>actx.resume().then(beginPlay);
$('pQuit').onclick=toMenu;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'&&!G.paused)pause();});

/* ===== メニュー ===== */
let songs=[];const cache={};
async function loadSongs(){try{songs=(await dbAll())||[];}catch(_){songs=[];}songs.sort((a,b)=>a.added-b.added);renderList();}
function renderList(){const L=$('songList');
 if(!songs.length){L.innerHTML='<div class="empty">曲がまだありません<br>下のボタンから MP3・M4A・MP4・WAV を追加<br>追加した曲に合わせてドン・カッを自動生成</div>';return;}
 if(!songs.some(s=>s.id===S.songId))S.songId=songs[0].id;
 L.innerHTML='';for(const s of songs){const d=document.createElement('div');d.className='song'+(s.id===S.songId?' sel':'');
  d.innerHTML=`<span>🥁</span><span class="nm">${esc(s.name)}</span><button class="del">削除</button>`;
  d.onclick=()=>{S.songId=s.id;saveS();renderList();};
  d.querySelector('.del').onclick=async ev=>{ev.stopPropagation();if(!confirm(`「${s.name}」を削除しますか？`))return;await dbDel(s.id);delete cache[s.id];loadSongs();};
  L.appendChild(d);}
}
async function addFiles(files){let last=null;
 for(const f of files){if(!/audio|video|mp4|m4a|wav|mp3|aac|ogg|flac/i.test(f.type+f.name))continue;
  const rec={id:'s'+Date.now()+Math.random().toString(36).slice(2,7),name:f.name.replace(/\.[^.]+$/,''),blob:f,added:Date.now()};
  try{await dbPut(rec);}catch(_){rec.memOnly=true;}songs.push(rec);last=rec.id;}
 if(last){S.songId=last;saveS();}renderList();
}
$('file').onchange=e=>{addFiles([...e.target.files]);e.target.value='';};
wrap.addEventListener('dragover',e=>e.preventDefault());
wrap.addEventListener('drop',e=>{e.preventDefault();if(G.state==='menu')addFiles([...e.dataTransfer.files]);});

const dv=$('diffs');
function renderDiffs(){dv.innerHTML='';for(const k in DIFF){const d=document.createElement('div');d.className='diff'+(k===S.diff?' sel':'');
 d.style.background=DIFF[k].color;d.textContent=DIFF[k].name;d.onclick=()=>{S.diff=k;saveS();renderDiffs();};dv.appendChild(d);}}
renderDiffs();
$('speed').value=String(S.speed);$('speed').onchange=e=>{S.speed=+e.target.value;saveS();};
const offU=()=>$('offv').textContent=(S.offset>0?'+':'')+S.offset+'ms';
$('offset').value=S.offset;offU();$('offset').oninput=e=>{S.offset=+e.target.value;offU();saveS();};
$('mvol').value=S.mvol;$('mvol').oninput=e=>{S.mvol=+e.target.value;setVolumes();saveS();};
$('svol').value=S.svol;$('svol').oninput=e=>{S.svol=+e.target.value;setVolumes();saveS();};
$('auto').checked=S.auto;$('auto').onchange=e=>{S.auto=e.target.checked;saveS();};

const prog=(p,t)=>{$('lbar').style.width=Math.round(p*100)+'%';if(t)$('ltxt').textContent=t;};
$('start').onclick=async()=>{
 const s=songs.find(x=>x.id===S.songId);if(!s){alert('先に曲を追加してください');return;}
 ensureAudio();await actx.resume();show('loading');prog(0,'曲を読み込み中');
 try{if(!cache[s.id]){const buf=await decode(s.blob);const an=await analyzeAudio(buf,prog);cache[s.id]={buf,an};}}
 catch(err){console.error(err);alert('この音声ファイルは読み込めませんでした（ブラウザが対応していない形式の可能性）');show('menu');return;}
 prog(0.95,'譜面を生成中');await sleep();
 const c=cache[s.id];G.diff=S.diff;G.song={name:s.name,buffer:c.buf};G.chart=buildChart(c.an,S.diff);
 prog(1,`BPM ${c.an.bpm.toFixed(1)}　音符 ${G.chart.notes.filter(isNote).length}個`);
 setTimeout(beginPlay,600);
};
loadSongs();
})();
</script>
</body>
</html>
