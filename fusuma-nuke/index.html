<script>
'use strict';
// ふすま ぬけ！ … 前から せまってくる ふすまの 穴と 同じ ポーズを とって くぐりぬける。
// ちがう ポーズだと、その形に ふすまが やぶれる。10まい／30まい れんぞく。はやさは 5だん（いちばん はやいと ダンスくらい）。
const Q = new URLSearchParams(location.search), DBG = Q.has('dbg');
const $ = id => document.getElementById(id);
const W = 1280, H = 720;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const backOut = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const wrap = a => ((a + 180) % 360 + 360) % 360 - 180;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mulberry(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const FONT_B = '"Yuji Syuku","Hiragino Mincho ProN","Yu Mincho",serif';
const FONT_M = '"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif';

// ===================== 世界と カメラ =====================
// カメラは 人の 右うしろ・すこし上。消える点が 人の 右上に くるので、遠くの ふすまが 人に かくれにくい
const CAM = { x: 0.85, y: 2.0, f: 720, cx: 720, cy: 259 };
const ZP = 3.5, ZSPAWN = 26;                 // 人の 奥行き・ふすまが 出てくる 奥行き
const RW = 1.8, RH = 2.85, LINTEL = 2.4, SILL = 0.045;
const PXM = 240, TW = Math.round(2 * RW * PXM), TH = Math.round(RH * PXM);
const FOGC = '#120b07', FOG = [18, 11, 7];
const fogAt = z => clamp(1 - Math.exp(-Math.max(0, z - 5) / 15), 0, 1);
const P = (x, y, z) => [CAM.cx + CAM.f * (x - CAM.x) / z, CAM.cy - CAM.f * (y - CAM.y) / z];
const AV = { x0: CAM.cx - CAM.f * CAM.x / ZP, y0: CAM.cy + CAM.f * CAM.y / ZP, s: CAM.f / ZP };

// ===================== からだ（ピクトグラム） =====================
const B = { torso: 0.50, shX: 0.17, shDown: 0.035, hipX: 0.10, ua: 0.30, fa: 0.29, th: 0.43, sh: 0.45, rA: 0.055, rL: 0.07, rT: 0.05, head: 0.125, headUp: 0.21 };
const SEGS = ['T', 'uaL', 'faL', 'uaR', 'faR', 'thL', 'shL', 'thR', 'shR'];
const TOL = { T: 25, uaL: 30, faL: 34, uaR: 30, faR: 34, thL: 26, shL: 30, thR: 26, shR: 30 };
const HOLE_M = 0.045;   // 穴は からだより これだけ 大きい
const D2R = Math.PI / 180;
const dv = a => [Math.cos(a * D2R), Math.sin(a * D2R)];
const add = (q, d, l) => [q[0] + d[0] * l, q[1] + d[1] * l];

// 角度（度・右が0・上が90）から 関節の 位置を つくる。足の いちばん下が 床（y=0）に つく
function buildBody(a) {
  const t = dv(a.T), p = [t[1], -t[0]];
  const hipL0 = [-p[0] * B.hipX, -p[1] * B.hipX], hipR0 = [p[0] * B.hipX, p[1] * B.hipX];
  const kL0 = add(hipL0, dv(a.thL), B.th), fL0 = add(kL0, dv(a.shL), B.sh);
  const kR0 = add(hipR0, dv(a.thR), B.th), fR0 = add(kR0, dv(a.shR), B.sh);
  const hy = -Math.min(fL0[1], fR0[1], kL0[1], kR0[1]) + B.rL;
  const up = q => [q[0], q[1] + hy];
  const Hc = [0, hy], N = add(Hc, t, B.torso);
  const sL = [N[0] - p[0] * B.shX - t[0] * B.shDown, N[1] - p[1] * B.shX - t[1] * B.shDown];
  const sR = [N[0] + p[0] * B.shX - t[0] * B.shDown, N[1] + p[1] * B.shX - t[1] * B.shDown];
  const eL = add(sL, dv(a.uaL), B.ua), hL = add(eL, dv(a.faL), B.fa);
  const eR = add(sR, dv(a.uaR), B.ua), hR = add(eR, dv(a.faR), B.fa);
  const torso = [
    [N[0] - p[0] * .15, N[1] - p[1] * .15], [N[0] + p[0] * .15, N[1] + p[1] * .15],
    [Hc[0] + p[0] * .11 - t[0] * .02, Hc[1] + p[1] * .11 - t[1] * .02], [Hc[0] - p[0] * .11 - t[0] * .02, Hc[1] - p[1] * .11 - t[1] * .02]];
  return { hy, H: Hc, N, t, p, head: add(N, t, B.headUp), torso,
    limbs: { L: [sL, eL, hL], R: [sR, eR, hR], LL: [up(hipL0), up(kL0), up(fL0)], LR: [up(hipR0), up(kR0), up(fR0)] } };
}
// 当たりと やぶれの 形（カプセルと 円）
function bodyParts(b) {
  const L = b.limbs, t = b.t;
  return [
    { seg: 'T', kind: 'cap', a: [b.H[0] + t[0] * .08, b.H[1] + t[1] * .08], b: [b.N[0] - t[0] * .1, b.N[1] - t[1] * .1], r: .19 },
    { seg: 'T', kind: 'circ', a: b.head, r: B.head },
    { seg: 'uaL', kind: 'cap', a: L.L[0], b: L.L[1], r: B.rA }, { seg: 'faL', kind: 'cap', a: L.L[1], b: L.L[2], r: B.rA },
    { seg: 'uaR', kind: 'cap', a: L.R[0], b: L.R[1], r: B.rA }, { seg: 'faR', kind: 'cap', a: L.R[1], b: L.R[2], r: B.rA },
    { seg: 'thL', kind: 'cap', a: L.LL[0], b: L.LL[1], r: B.rL }, { seg: 'shL', kind: 'cap', a: L.LL[1], b: L.LL[2], r: B.rL },
    { seg: 'thR', kind: 'cap', a: L.LR[0], b: L.LR[1], r: B.rL }, { seg: 'shR', kind: 'cap', a: L.LR[1], b: L.LR[2], r: B.rL },
  ].map((q, i) => (q.ph = i * 1.7, q));
}
// メートルの 座標（y 上向き）で かく。inf だけ ふとらせる
function drawBody(g, b, inf, col) {
  g.fillStyle = col; g.strokeStyle = col; g.lineJoin = 'round'; g.lineCap = 'round';
  g.lineWidth = 2 * (B.rT + inf);
  g.beginPath(); b.torso.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.arc(b.head[0], b.head[1], B.head + inf, 0, Math.PI * 2); g.fill();
  for (const k of ['L', 'R', 'LL', 'LR']) {
    const q = b.limbs[k]; g.lineWidth = 2 * ((k.length === 1 ? B.rA : B.rL) + inf);
    g.beginPath(); g.moveTo(q[0][0], q[0][1]); g.lineTo(q[1][0], q[1][1]); g.lineTo(q[2][0], q[2][1]); g.stroke();
  }
}
// 部分ごとの ふち色（あっている＝金、ずれている＝赤）
const SEGLIMB = { uaL: ['L', 0], faL: ['L', 1], uaR: ['R', 0], faR: ['R', 1], thL: ['LL', 0], shL: ['LL', 1], thR: ['LR', 0], shR: ['LR', 1] };
function drawSegRing(g, b, inf, cols) {
  g.lineJoin = 'round'; g.lineCap = 'round';
  for (const s of SEGS) {
    const c = cols[s]; if (!c) continue;
    g.strokeStyle = c; g.fillStyle = c;
    if (s === 'T') {
      g.lineWidth = 2 * (B.rT + inf); g.beginPath(); b.torso.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath(); g.fill(); g.stroke();
      g.beginPath(); g.arc(b.head[0], b.head[1], B.head + inf, 0, Math.PI * 2); g.fill();
    } else {
      const [k, i] = SEGLIMB[s], q = b.limbs[k];
      g.lineWidth = 2 * ((k.length === 1 ? B.rA : B.rL) + inf);
      g.beginPath(); g.moveTo(q[i][0], q[i][1]); g.lineTo(q[i + 1][0], q[i + 1][1]); g.stroke();
    }
  }
}
function bodyBox(b) {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const pt = (q, r) => { x0 = Math.min(x0, q[0] - r); x1 = Math.max(x1, q[0] + r); y0 = Math.min(y0, q[1] - r); y1 = Math.max(y1, q[1] + r); };
  b.torso.forEach(q => pt(q, B.rT)); pt(b.head, B.head);
  for (const k of ['L', 'R']) b.limbs[k].forEach(q => pt(q, B.rA));
  for (const k of ['LL', 'LR']) b.limbs[k].forEach(q => pt(q, B.rL));
  return { x0, x1, y0, y1 };
}
// 小さな ピクトグラム（札・えらぶボタン）
function drawPicto(g, ang, cx, cy, hMax, wMax, col) {
  const b = buildBody(ang), bb = bodyBox(b);
  const s = Math.min(hMax / (bb.y1 - bb.y0), wMax / (bb.x1 - bb.x0));
  g.save(); g.translate(cx - (bb.x0 + bb.x1) / 2 * s, cy + (bb.y0 + bb.y1) / 2 * s); g.scale(s, -s); drawBody(g, b, 0, col); g.restore();
}

// ===================== ポーズ =====================
const POSES = {
  kiwotsuke: { name: 'きをつけ', T: 90, uaL: -96, faL: -93, uaR: -84, faR: -87, thL: -93, shL: -91, thR: -87, shR: -89 },
  banzai: { name: 'バンザイ', T: 90, uaL: 117, faL: 112, uaR: 63, faR: 68, thL: -96, shL: -92, thR: -84, shR: -88 },
  hai: { name: 'はーい！', T: 90, uaL: -100, faL: -95, uaR: 84, faR: 88, thL: -95, shL: -92, thR: -85, shR: -88 },
  toosenbo: { name: 'とおせんぼ', T: 90, uaL: 180, faL: 180, uaR: 0, faR: 0, thL: -100, shL: -95, thR: -80, shR: -85 },
  ehhen: { name: 'えっへん', T: 90, uaL: -140, faL: -40, uaR: -40, faR: -140, thL: -98, shL: -94, thR: -82, shR: -86 },
  dainoji: { name: 'だいのじ', T: 90, uaL: 150, faL: 150, uaR: 30, faR: 30, thL: -116, shL: -113, thR: -64, shR: -67 },
  mukimuki: { name: 'ムキムキ', T: 90, uaL: 180, faL: 92, uaR: 0, faR: 88, thL: -97, shL: -93, thR: -83, shR: -87 },
  maru: { name: 'まる', T: 90, uaL: 122, faL: 28, uaR: 58, faR: 152, thL: -95, shL: -92, thR: -85, shR: -88 },
  kiran: { name: 'キラーン', T: 90, uaL: -138, faL: -138, uaR: 42, faR: 42, thL: -104, shL: -100, thR: -80, shR: -84 },
  flamingo: { name: 'フラミンゴ', T: 90, uaL: 163, faL: 163, uaR: 17, faR: 17, thL: -92, shL: -90, thR: -22, shR: -148 },
  kani: { name: 'カニ', T: 90, uaL: 180, faL: 92, uaR: 0, faR: 88, thL: -148, shL: -96, thR: -32, shR: -84 },
};
const MIRRORABLE = { hai: 1, kiran: 1, flamingo: 1 };
// はやさ。g10/T10＝10まいの ときの 間かく・見えている 時間（はじめ→さいご）。
// 30まいは 音楽の 拍に あわせて くる：bpm と 何拍ごとか（ダンス＝128bpm で 2拍ごと＝およそ 1びょうに 1まい）
const SPEEDS = [
  { name: 'ゆっくり', icon: '🐢', desc: 'じっくり ポーズを つくれる', g10: [7.0, 5.0], T10: [8.5, 6.5], bpm: 100, beats: 8, T30: 6.5 },
  { name: 'ふつう', icon: '🚶', desc: 'はじめての 人に おすすめ', g10: [5.4, 3.3], T10: [7.0, 4.0], bpm: 110, beats: 6, T30: 5.2 },
  { name: 'はやい', icon: '🏃', desc: 'つぎつぎ くる', g10: [3.6, 2.4], T10: [5.2, 3.6], bpm: 120, beats: 4, T30: 4.0 },
  { name: 'すごく はやい', icon: '⚡', desc: 'からだが いそがしい', g10: [2.4, 1.6], T10: [4.0, 3.0], bpm: 124, beats: 3, T30: 3.3 },
  { name: 'ダンス', icon: '💃', desc: 'おどる くらい。1びょうに 1まい', g10: [1.6, 1.0], T10: [3.2, 2.7], bpm: 128, beats: 2, T30: 2.8 },
];
const SET = { mode: 10, lvl: 1 };
try { const o = JSON.parse(localStorage.getItem('fusuma-nuke-set') || '{}'); if (o.mode === 10 || o.mode === 30) SET.mode = o.mode; if (o.lvl >= 0 && o.lvl < SPEEDS.length) SET.lvl = o.lvl | 0; } catch (e) {}

  g.font = `700 20px ${FONT_M}`; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = '#e8d4b0'; g.fillText(`${N}まい・${S.icon} ${S.name}`, 730, 58);
  if (pg === 0) {
    const tTot = .4;
    if (t > tTot) {
      if (!G.resSound.total) { G.resSound.total = 1; AU.fanfare(); }
      const k = backOut(clamp((t - tTot) / .35, 0, 1)), n = G.score, torn = G.rounds.filter(r => r.res && !r.res.pass), ratio = n / N, big = N <= 10;
      g.save(); g.translate(640, 230); g.scale(k, k);
      g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 16 * RS;
      brush(g, `${N}まい ちゅう ${n}まい ぬけた！`, 0, 0, 72, 'gold', '#1d0f07', 10);
      g.restore();
      const dance = SET.lvl === SPEEDS.length - 1;
      const rank = ratio >= 1 ? (dance ? 'ふすまダンスの かみさま' : 'ふすまの かみさま') : ratio >= .8 ? (dance ? 'ふすまの ダンサー' : 'ふすま めいじん') : ratio >= .6 ? 'なかなかの うでまえ' : ratio >= .3 ? 'ふすま やぶり みならい' : 'ふすま こわし だいおう';
      if (t > tTot + .45) {
        if (!G.resSound.rank) { G.resSound.rank = 1; AU.don(AU.t, .7); }
        let y = 310; g.textAlign = 'center';
        if (!big) { g.font = `900 28px ${FONT_M}`; g.fillStyle = '#ffe9a8'; g.fillText(n === N ? 'ぜんぶ れんぞく！ フルコンボ！' : `さいだい れんぞく ${G.maxCombo || 0}`, 640, y); y += 56; }
        g.font = `900 36px ${FONT_M}`; g.fillStyle = '#fff3d8'; g.fillText(`しょうごう：${rank}`, 640, y);
        if (torn.length) {
          const yen = torn.reduce((s, r) => s + 3800 + r.res.torn * 300, 0);
          g.font = `700 22px ${FONT_M}`; g.fillStyle = '#e8c8a8'; g.fillText(`やぶれた ふすまの はりかえ代 …… ${yen.toLocaleString('ja-JP')}えん`, 640, y + 50);
        }
        if (t > 1.2) { g.font = `700 24px ${FONT_M}`; g.fillStyle = '#f6e7c8'; g.fillText(G.mode === 'cam' ? '▶ みぎてを あげると、しゃしんを 1まいずつ みられるよ' : '▶ 「つぎ」で、しゃしんを 1まいずつ みられるよ', 640, y + 120); }
      }
    }
  } else {
    const r = G.rounds[pg - 1], k = backOut(clamp((G.rt - G.resPageT) / .3, 0, 1));
    const cw = 600, ch = Math.round(cw * TH / TW), cx = 70, cy = 110;
    g.save(); g.translate(cx + cw / 2, cy + ch / 2); g.scale(k, k); g.translate(-cw / 2, -ch / 2);
    g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 20 * RS;
    drawCard(g, r, 0, 0, cw, ch);
    g.restore();
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.font = `900 64px ${FONT_M}`; g.fillStyle = '#fff3d8'; g.fillText(`${pg} / ${N}`, 730, 250);
    g.font = `700 28px ${FONT_M}`; g.fillStyle = '#f3e2c2'; g.fillText(r.name, 730, 310);
    if (r.res) {
      if (r.res.pass) {
        g.save(); g.translate(790, 410); g.scale(2, 2); g.strokeStyle = '#d03a2c'; g.lineCap = 'round'; g.lineWidth = 6; g.beginPath(); g.arc(0, 0, 24, -1.2, 4.9); g.stroke();
        if (r.res.excellent) { g.lineWidth = 4; g.beginPath(); g.arc(0, 0, 12, -1.1, 5.0); g.stroke(); }
        g.restore();
        brush(g, r.res.excellent ? 'かんぺき！' : 'ピッタリ！', 1010, 410, 60, 'gold', '#1d0f07', 8);
      } else brush(g, 'ビリッ！', 900, 410, 80, '#ff6a50', '#1d0f07', 8);
    }
  }
  if (t > 1.2 && G.mode === 'cam') {
    g.font = `700 18px ${FONT_M}`; g.textAlign = 'right'; g.fillStyle = '#f6e7c8';
    g.fillText('🙋 みぎてを あげる＝つぎ ／ ひだりてを あげる＝まえ', 1240, 560);
    g.fillText('りょうてを あげると もういちど', 1240, 590);
    if (G.holdT > 0) { g.fillStyle = '#ffd55e'; g.fillRect(1040, 600, 200 * clamp(G.holdT / .9, 0, 1), 5); }
  }
}
function draw() {
  const g = ctx; g.setTransform(RS, 0, 0, RS, 0, 0);
  let sx = 0, sy = 0; if (G.shake > 0) { sx = (Math.random() - .5) * G.shake; sy = (Math.random() - .5) * G.shake; }
  g.save(); g.translate(sx, sy);
  g.drawImage(room, 0, 0, W, H);
  const all = G.rounds.concat(G.titleR ? [G.titleR] : []).map(r => ({ r, z: zAt(r) })).filter(o => o.z > 1.3 && o.z <= ZSPAWN + .01).sort((a, b) => b.z - a.z);
  for (const o of all) if (o.z >= ZP) drawFus(g, o.r, o.z);
  if (G.state !== 'result') drawAvatar(g, avatarAng());
  for (const o of all) if (o.z < ZP) drawFus(g, o.r, o.z);
  drawParts(g);
  g.restore();
  // ふちを くらく
  const vg = g.createRadialGradient(W / 2, H * .45, H * .35, W / 2, H * .5, H * .95); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  if (G.flash > 0) { g.fillStyle = `rgba(${G.flashC},${G.flash})`; g.fillRect(0, 0, W, H); }
  const st = G.state;
  if (st === 'gate' || st === 'title') drawLogo(g, 96);
  if (st === 'title') {
    g.font = `900 30px ${FONT_M}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff3d8'; g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 8 * RS;
    if (G.mode === 'cam') {
      g.font = `900 26px ${FONT_M}`; g.fillText('りょうてを あげて スタート！', 1032, 472);
      if (G.holdT > 0) { g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(902, 488, 260, 8); g.fillStyle = '#ffd55e'; g.fillRect(902, 488, 260 * clamp(G.holdT / .6, 0, 1), 8); }
      if (!PL.seen) { g.font = `700 21px ${FONT_M}`; g.fillStyle = '#ffb3a0'; g.fillText('カメラに うつってね', 1032, 618); }
      else if (!PL.legs) { g.font = `700 21px ${FONT_M}`; g.fillStyle = '#ffd9a0'; g.fillText('あしまで うつるように はなれてね', 1032, 618); }
    }
    g.shadowBlur = 0;
  }
  if (st === 'count' || st === 'play' || st === 'end') drawHUD(g);
  if (st !== 'result' && st !== 'gate') drawWipe(g);
  if ((st === 'play' || st === 'count') && G.mode === 'cam' && !G.bot) {
    let m = null; if (G.rt - PL.lastSeen > .8) m = 'カメラに うつってね'; else if (!PL.legs) m = 'あしまで うつるように はなれてね';
    if (m) { g.font = `700 22px ${FONT_M}`; g.textAlign = 'center'; g.fillStyle = 'rgba(15,8,4,.7)'; rr(g, 440, 676, 400, 34, 17); g.fill(); g.fillStyle = '#ffd9a0'; g.fillText(m, 640, 694); }
  }
  if (st === 'result') drawResult(g);
  drawTexts(g);
  if (DBG) { g.font = '12px monospace'; g.textAlign = 'left'; g.fillStyle = '#0f0'; g.fillText(`${st} gt=${G.gt.toFixed(2)} cur=${G.cur} fps=${fps.toFixed(0)} det=${DET.cost.toFixed(1)}ms`, 8, H - 8); }
}

// ===================== うごかす =====================
let last = performance.now(), fps = 60;
function frame(now) {
  requestAnimationFrame(frame);
  const dtR = Math.min(.05, (now - last) / 1000); last = now; fps += (1 / Math.max(dtR, 1e-3) - fps) * .05;
  if (G.paused) return;
  DET.tick(now);
  step(dtR);
  // 30まい：ゲームの 時計を 音楽の 時計に そっと あわせる（ふすまが 拍に とどく ように）
  const sy = G.sync;
  if (sy && sy.a0 != null && AU.ctx && AU.ctx.state === 'running' && (G.state === 'count' || G.state === 'play') && G.speed === 1) {
    const d = sy.t0 + (AU.t - sy.a0) - G.gt;
    if (Math.abs(d) > .5) G.gt += d; else G.gt += d * .15;
  }
  draw();
}

// ===================== はじめかた =====================
const gateMsg = t => { $('gateMsg').textContent = t; if (window.PhoneCam && G.camKind === 'phone' && PhoneCam.say) PhoneCam.say(t); };
const CAM_OPT = { video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } } };
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }
async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { gateMsg('この ひらきかたでは カメラを つかえません。https か localhost で ひらいてね。'); return; }
  gateMsg('カメラを じゅんび中…');
  const p = navigator.mediaDevices.getUserMedia(CAM_OPT);
  AU.init();
  let stream; try { stream = await p; } catch (e) { gateMsg('カメラを つかえませんでした。ブラウザで カメラを きょかしてね。'); return; }
  if (window.PhoneCam) try { PhoneCam.stop(); } catch (e) {}
  G.camKind = 'pc'; await useStream(stream);
}
function startPhone() {
  AU.init();
  if (!window.PhoneCam) { gateMsg('スマホを つなぐ ぶひんが よみこめませんでした。公開ページで ひらくと つかえます。'); return; }
  gateMsg('');
  PhoneCam.open({
    mic: false,
    onStream: async remote => {
      const first = G.camKind !== 'phone', v = $('vid');
      G.camKind = 'phone';
      if (first && v.srcObject && v.srcObject.getTracks) v.srcObject.getTracks().forEach(t => t.stop());
      const vs = new MediaStream(remote.getVideoTracks());
      if (!first) { v.srcObject = vs; v.play().catch(() => {}); return; }
      await useStream(vs);
    },
  });
}
async function useStream(stream) {
  const v = $('vid'); v.srcObject = stream;
  try { await Promise.race([v.play(), new Promise(r => setTimeout(r, 3000))]); } catch (e) {}
  if (!(await DET.load(gateMsg))) return;
  DET.on = true; G.mode = 'cam'; PL.reset(); gateMsg(''); keepAwake();
  enterTitle();
}
function startNoCam() { AU.init(); G.mode = 'choice'; PL.reset(); enterTitle(); }

// まいすう・はやさ
function renderSetup() {
  [...$('modeRow').children].forEach(b => b.classList.toggle('on', +b.dataset.m === SET.mode));
  [...$('spdRow').children].forEach((b, i) => b.classList.toggle('on', i === SET.lvl));
  const S = SPEEDS[SET.lvl]; $('spdName').innerHTML = `${S.icon} ${S.name}<small>${S.desc}</small>`;
}
SPEEDS.forEach((S, i) => { const b = document.createElement('button'); b.innerHTML = `${S.icon}<small>${i + 1}</small>`; b.title = S.name; b.onclick = () => setLvl(i); $('spdRow').appendChild(b); });
[...$('modeRow').children].forEach(b => b.onclick = () => setMode(+b.dataset.m));
function setLvl(i) { SET.lvl = clamp(i, 0, SPEEDS.length - 1); saveSet(); renderSetup(); AU.init(); AU.pluck(SCALE[SET.lvl + 2], AU.t, .3); }
function setMode(m) { SET.mode = m; saveSet(); renderSetup(); AU.init(); AU.pop(); }
renderSetup();
$('bCam').onclick = () => startCam();
$('bPhone').onclick = () => startPhone();
$('bNoCam').onclick = () => startNoCam();
$('bStart').onclick = () => startIntro();
$('bRetry').onclick = () => retry();
$('bPrev').onclick = () => resGo(-1);
$('bNext').onclick = () => resGo(1);
$('bTitle').onclick = () => { AU.pop(); enterTitle(); };
// さいごの 1まい（ポーズの しゃしん入り）を がぞうにして シェア
function makeShareImage() {
  const r = G.resPage > 0 ? G.rounds[G.resPage - 1] : [...G.rounds].reverse().find(x => x.res && x.res.body); if (!r || !r.res) return null;
  const cw = 720, ch = Math.round(cw * TH / TW), pad = 40, Wd = cw + pad * 2, Hd = ch + 190;
  const c = mk(Wd, Hd), g = c.getContext('2d');
  g.fillStyle = '#1a100a'; g.fillRect(0, 0, Wd, Hd);
  g.textBaseline = 'middle';
  brush(g, 'ふすま ぬけ！', Wd / 2, 52, 56, '#fff4dc', '#1d0f07', 8);
  drawCard(g, r, pad, 100, cw, ch);
  const res = r.res, N = G.rounds.length;
  g.textAlign = 'center';
  brush(g, res.pass ? (res.excellent ? 'かんぺき！' : 'ピッタリ！') : 'ビリッ！', Wd / 2, 100 + ch + 44, 56, res.pass ? 'gold' : '#ff5b45', '#1d0f07', 8);
  g.font = `700 24px ${FONT_M}`; g.fillStyle = '#e8d4b0';
  g.fillText(`${N}まい ちゅう ${G.score}まい ぬけた！`, Wd / 2, 100 + ch + 112);
  return c;
}
$('bShare').onclick = async () => {
  AU.init(); AU.pop();
  const c = makeShareImage(); if (!c) return;
  const blob = await new Promise(ok => c.toBlob(ok, 'image/png')); if (!blob) return;
  const file = new File([blob], 'fusuma-nuke.png', { type: 'image/png' });
  const data = { files: [file], title: 'ふすま ぬけ！', text: 'ふすま ぬけ！ #ふすまぬけ' };
  try {
    if (navigator.canShare && navigator.canShare(data)) { await navigator.share(data); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'fusuma-nuke.png';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
$('bQuit').onclick = () => { AU.pop(); enterTitle(); };
$('bSound').onclick = () => { AU.init(); AU.setOn(!AU.on); $('bSound').textContent = AU.on ? '🔊 おと' : '🔇 おと'; };
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key;
  if ((k === ' ' || k === 'Enter') && G.state === 'title') { e.preventDefault(); startIntro(); }
  else if ((k === ' ' || k === 'Enter') && G.state === 'result' && $('resBtns').classList.contains('on')) { e.preventDefault(); retry(); }
  else if (k === 'Escape' && G.state !== 'gate') enterTitle();
  else if (/^[1-4]$/.test(k) && G.mode === 'choice' && G.state !== 'title') CH.choose(+k - 1);
  else if ((k === 'ArrowLeft' || k === 'ArrowRight') && G.state === 'result') { e.preventDefault(); resGo(k === 'ArrowLeft' ? -1 : 1); }
  else if ((k === 'ArrowLeft' || k === 'ArrowRight') && G.state === 'title') { e.preventDefault(); setLvl(SET.lvl + (k === 'ArrowLeft' ? -1 : 1)); }
  else if ((k === 'ArrowUp' || k === 'ArrowDown') && G.state === 'title') { e.preventDefault(); setMode(SET.mode === 10 ? 30 : 10); }
  else if (k === 'm') $('bSound').click();
});
addEventListener('pointerdown', () => AU.resume(), { passive: true });
document.addEventListener('visibilitychange', () => {
  if (!AU.ctx) return;
  if (document.visibilityState === 'hidden') AU.ctx.suspend(); else { AU.resume(); keepAwake(); }
});
if (document.fonts && document.fonts.load) {
  document.fonts.load(`64px "Yuji Syuku"`, 'ふすまぬけ！ピッタリかんぺきビリッおしいいくよはじめおわりけっか0123456789十三枚極ぬバンザイはーいとおせんぼえっへんだいのじムキムキまるキラーンフラミンゴカニ').catch(() => {});
  document.fonts.load(`900 30px "Zen Maru Gothic"`).catch(() => {});
}

// ===================== たしかめ用（?dbg） =====================
if (DBG) {
  // MediaPipe の wasm は window.dbg を 関数として よぶので、ただの物に しない
  const d = function () {};
  Object.assign(d, {
    G, PL, DET, AU, BGM, POSES,
    sim(sec, dt = 1 / 60) { for (let t = 0; t < sec; t += dt) step(dt); draw(); return G.state; },
    simTo(gt, dt = 1 / 60) { let n = 0; while (G.gt < gt && n++ < 1e5) step(dt); draw(); return G.state; },
    pose(key) { PL.choose(POSES[key] || key, G.rt); },
    play(mode = 'choice') { AU.init(); G.mode = mode; PL.reset(); enterTitle(); G.titleR = null; G.rounds = makeRounds(); startCount(); },
    title(mode = 'choice') { G.mode = mode; PL.reset(); enterTitle(); },
    pause(v = true) { G.paused = v; if (!v) last = performance.now(); },
  });
  window.dbg = d;
  const go = Q.get('go');
  if (Q.has('bot')) G.bot = parseFloat(Q.get('bot'));
  if (Q.has('speed')) G.speed = parseFloat(Q.get('speed'));
  if (Q.has('n')) SET.mode = +Q.get('n') === 30 ? 30 : 10;
  if (Q.has('lvl')) SET.lvl = clamp(parseInt(Q.get('lvl')), 0, SPEEDS.length - 1);
  renderSetup();
  setTimeout(() => { if (go === 'play') d.play(); else if (go === 'title') d.title(); }, 50);
}

resize();
requestAnimationFrame(frame);
</script>
