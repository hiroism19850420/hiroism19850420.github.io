'use strict';
// ============================================================
//  ノリノリ！ぜんしんリズム
//  カメラの「うごき」だけで あそぶ リズムゲーム（AIモデルなし＝すぐ起動）
//  1人 / 2人（がめんを 左右に わる）
// ============================================================
const W = 1280, H = 720;
const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif';
const INK = '#2b2238', SKIN = '#fff3e2';
const PCOL = ['#ff7a45', '#3fa7ff'];
const cv = document.getElementById('c'), c = cv.getContext('2d');
const vid = document.getElementById('v');
const Q = new URLSearchParams(location.search);
const DBG = Q.has('dbg');
let SCALE = 1, DPR = 1;

function resize() {
  const ww = innerWidth, wh = innerHeight;
  SCALE = Math.min(ww / W, wh / H);
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  cv.style.width = W * SCALE + 'px'; cv.style.height = H * SCALE + 'px';
  cv.width = Math.round(W * SCALE * DPR); cv.height = Math.round(H * SCALE * DPR);

}
addEventListener('resize', resize); resize();

// ---------- ちいさな道具 ----------
const lerp = (a, b, k) => a + (b - a) * k, clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const easeOutBack = k => { k -= 1; return 1 + 2.7 * k * k * k + 1.7 * k * k; };
function rr(x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function circ(x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); }
function ell(x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }
function fs(f, s = INK, lw = 5) { if (f) { c.fillStyle = f; c.fill(); } if (s) { c.strokeStyle = s; c.lineWidth = lw; c.lineJoin = 'round'; c.stroke(); } }
function line(x1, y1, x2, y2, col = INK, lw = 5) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.stroke(); }
function txt(s, x, y, size, col = '#fff', al = 'center', st = null, sw = 8) {
  c.font = `800 ${size}px ${FONT}`; c.textAlign = al; c.textBaseline = 'middle';
  if (st) { c.strokeStyle = st; c.lineWidth = sw; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}
function bubble(x, y, s, size, age, col = '#fff', tail = -1) {
  c.font = `800 ${size}px ${FONT}`;
  const w = c.measureText(s).width + size * 0.9, h = size * 1.45;
  const sc = age < 0.35 ? 0.5 + 0.5 * easeOutBack(age / 0.35) : 1;
  c.save(); c.translate(x, y); c.scale(sc, sc);
  if (tail) { c.beginPath(); c.moveTo(-14 * tail, h / 2 - 6); c.lineTo(-30 * tail, h / 2 + 22); c.lineTo(8 * tail, h / 2 - 6); fs(col, INK, 5); }
  rr(-w / 2, -h / 2, w, h, h / 2); fs(col, INK, 5);
  txt(s, 0, 2, size, INK);
  c.restore();
}

// ============================================================
//  おと（すべて WebAudio で その場で つくる）
// ============================================================
let AC = null, OUT = null, MUS = null, DEST = null, NOISE = null;
const LAT = { cam: 0.16, key: 0.03 }; // うごいてから 判定に とどくまでの おくれ（秒）
let latSet = false;
function initAudio() {
  if (AC) { if (AC.state !== 'running') AC.resume(); return; }

  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4; comp.connect(AC.destination);
  OUT = AC.createGain(); OUT.gain.value = 0.8; OUT.connect(comp);
  MUS = AC.createGain(); MUS.gain.value = 0.5; MUS.connect(OUT);
  DEST = OUT;
  const n = AC.sampleRate; NOISE = AC.createBuffer(1, n, AC.sampleRate);
  const d = NOISE.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  if (!latSet) { const o = (AC.outputLatency || 0) + (AC.baseLatency || 0); LAT.key = o + 0.01; LAT.cam = o + 0.13; }
}
function clock() { return AC ? AC.currentTime : performance.now() / 1000; }
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); }

}

  const g = AC.createGain(); env(g, t, 0.003, vol, dur); s.connect(f); f.connect(g); g.connect(DEST); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}

  const g = AC.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.015); g.gain.setValueAtTime(vol, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  for (const [fq, q, a] of forms) { const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fq; f.Q.value = q; const ga = AC.createGain(); ga.gain.value = a * 3; o.connect(f); f.connect(ga); ga.connect(g); }
  g.connect(DEST); o.start(t); o.stop(t + dur + 0.05);

const V_A = [[800, 5, 1], [1250, 7, 0.6]], V_I = [[300, 5, 1], [2300, 9, 0.5]], V_O = [[500, 5, 1], [880, 7, 0.5]], V_U = [[350, 5, 1], [1300, 8, 0.4]];

  kick: t => osc(t, 'sine', 150, 0.18, 0.9, 45),
  snare: t => { noise(t, 0.13, 0.4, 'highpass', 1500); osc(t, 'triangle', 220, 0.07, 0.25, 120); },
  hat: (t, v = 0.1) => noise(t, 0.03, v, 'highpass', 7000),
  ohat: t => noise(t, 0.16, 0.1, 'highpass', 6000),
  clap: t => { for (let i = 0; i < 3; i++) noise(t + i * 0.011, 0.05, 0.28, 'bandpass', 1500, 1.2); noise(t + 0.034, 0.14, 0.28, 'bandpass', 1400, 1); },
  wood: (t, f = 1300) => osc(t, 'sine', f, 0.08, 0.6, f * 0.92),
  beep: (t, f = 1568) => osc(t, 'square', f, 0.07, 0.08),
  ichi: t => { SND.beep(t); vowel(t, 330, 0.1, 0.8, V_I); noise(t + 0.1, 0.04, 0.3, 'highpass', 4500); vowel(t + 0.13, 330, 0.11, 0.7, V_I); },
  nino: t => { SND.beep(t); vowel(t, 300, 0.11, 0.8, V_I); vowel(t + 0.13, 280, 0.15, 0.8, V_O); },
  umm: t => vowel(t, 200, 0.4, 0.6, V_U, 170),
  shutter: t => { noise(t, 0.025, 0.7, 'bandpass', 3000, 1); osc(t, 'sine', 2400, 0.03, 0.2); noise(t + 0.07, 0.05, 0.5, 'bandpass', 2000, 1); },
  ha: (t, k) => { noise(t, 0.1, 0.25, 'bandpass', 1600, 1); vowel(t + 0.02, 250 + k * 45, 0.28, 0.9, V_A, 290 + k * 55); },
  sneeze: t => { noise(t - 0.04, 0.04, 0.5, 'bandpass', 2500, 2); noise(t, 0.2, 0.6, 'highpass', 2800); vowel(t + 0.16, 340, 0.26, 1, V_O, 170); osc(t, 'sine', 90, 0.3, 0.6, 40); },
  sniff: t => { noise(t, 0.09, 0.35, 'bandpass', 1100, 3); noise(t + 0.14, 0.14, 0.35, 'bandpass', 1500, 3); },
  blip: (t, f = 1760) => osc(t, 'square', f, 0.06, 0.12),
  meow: t => {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle';
    o.frequency.setValueAtTime(620, t); o.frequency.linearRampToValueAtTime(1050, t + 0.12); o.frequency.linearRampToValueAtTime(540, t + 0.4);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.4, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(DEST); o.start(t); o.stop(t + 0.5);
  },
  whistle: (t, d = 0.14) => {
    const o = AC.createOscillator(), l = AC.createOscillator(), lg = AC.createGain(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = 2700; l.frequency.value = 30; lg.gain.value = 200; l.connect(lg); lg.connect(o.frequency);
    env(g, t, 0.01, 0.22, d); o.connect(g); g.connect(DEST); o.start(t); l.start(t); o.stop(t + d + 0.05); l.stop(t + d + 0.05);
  },
  pita: t => { osc(t, 'square', 1250, 0.05, 0.25); SND.clap(t); osc(t, 'sine', 90, 0.25, 0.8, 40); },
  ok: t => { osc(t, 'triangle', mf(79), 0.1, 0.35); osc(t + 0.09, 'triangle', mf(84), 0.22, 0.35); },
  fin: t => { SND.kick(t); noise(t, 0.9, 0.18, 'highpass', 5000); [60, 64, 67, 72].forEach(m => osc(t, 'sawtooth', mf(m), 0.9, 0.05)); },
  jump: (t, good) => good ? osc(t, 'square', 420, 0.12, 0.12, 980) : osc(t, 'triangle', 300, 0.18, 0.2, 140),
  swoosh: (t, good) => { noise(t, 0.12, 0.3, 'bandpass', good ? 1800 : 700, 1.5); },
  stamp: (t, good) => { osc(t, 'sine', 160, 0.16, 0.9, 50); noise(t, 0.04, 0.4, 'lowpass', 1200); if (good) osc(t + 0.02, 'square', 1320, 0.05, 0.08); },
  boo: t => osc(t, 'sawtooth', 180, 0.2, 0.1, 120),

// ---------- おんがく ----------
const MAJ = [0, 2, 4, 5, 7, 9, 11], MIN = [0, 2, 3, 5, 7, 8, 10];
function deg(ch, sc) { if (ch >= '1' && ch <= '7') return sc[ch.charCodeAt(0) - 49]; if (ch === '8') return 12 + sc[0]; if (ch === '9') return 12 + sc[1]; if (ch === '0') return 12 + sc[2]; return null; }
function makeMusic(m) {
  return (s, t, spb) => {
    const st = ((s % 16) + 16) % 16, bar = Math.floor(s / 16), ch = m.prog[((bar % m.prog.length) + m.prog.length) % m.prog.length], dt = spb / 4;
    if (m.k[st] === 'x') SND.kick(t);
    if (m.sn[st] === 'x') SND.snare(t);
    if (m.cl && m.cl[st] === 'x') SND.clap(t);
    if (m.h[st] === 'x') SND.hat(t, m.hv || 0.08);
    if (m.oh && m.oh[st] === 'x') SND.ohat(t);
    const bn = m.bass[st];
    if (bn !== '.') osc(t, m.bt || 'triangle', mf(ch[0] - 12 + (bn === 'o' ? 12 : bn === 'f' ? 7 : 0)), dt * 1.7, 0.4);
    if (m.st[st] === 'x') { const r = ch[0] + 12; [r, r + (ch[1] ? 3 : 4), r + 7].forEach(n => osc(t, m.stt || 'square', mf(n), dt * 0.9, 0.035)); }
    const ml = m.mel[((bar % m.mel.length) + m.mel.length) % m.mel.length][st], d = deg(ml, m.sc);
    if (d != null) osc(t, m.lead, mf(m.root + d), dt * 1.8, m.lv);
  };
}

// ============================================================
//  キャラ（まるっこい人）
// ============================================================
const RIGS = {
  stand: { hy: -82, by: -128, hd: -218, lh: [-58, -88], rh: [58, -88], lf: [-22, 0], rf: [22, 0] },
  jump: { hy: -86, by: -132, hd: -222, lh: [-84, -282], rh: [84, -282], lf: [-48, -16], rf: [48, -16] },
  duck: { hy: -38, by: -78, hd: -150, lh: [-36, -204], rh: [36, -204], lf: [-46, 0], rf: [46, 0] },
  blown: { hy: -82, by: -128, hd: -218, lh: [80, -150], rh: [94, -186], lf: [-12, 0], rf: [36, -8] },
  f1: { hy: -82, by: -128, hd: -218, lh: [-96, -240], rh: [92, -150], lf: [-24, 0], rf: [62, -52] },
  f2: { hy: -60, by: -108, hd: -196, lh: [-40, -290], rh: [-88, -250], lf: [-50, 0], rf: [50, 0] },
  f3: { hy: -82, by: -128, hd: -212, lh: [-96, -176], rh: [96, -176], lf: [-36, 0], rf: [36, 0] },
  f4: { hy: -82, by: -128, hd: -218, lh: [-60, -100], rh: [72, -292], lf: [-22, 0], rf: [-2, -62] },
  win: { hy: -82, by: -128, hd: -218, lh: [-70, -270], rh: [70, -270], lf: [-24, 0], rf: [24, 0] },
  sad: { hy: -74, by: -118, hd: -196, lh: [-40, -84], rh: [40, -84], lf: [-20, 0], rf: [20, 0] },
};
const DA = { hy: -74, by: -122, hd: -210, lh: [-88, -252], rh: [64, -96], lf: [-32, 0], rf: [24, 0] };
const DB = { hy: -74, by: -122, hd: -210, lh: [-64, -96], rh: [88, -252], lf: [-24, 0], rf: [32, 0] };

function drawChar(x, y, s, o) {
  let R;

    const k = (Math.sin(o.ph * Math.PI) + 1) / 2, en = o.en == null ? 0.5 : o.en;
    R = mixRig(DA, DB, k);

// ============================================================

// ============================================================

  if (n === 2) { c.fillStyle = INK; c.fillRect(W / 2 - 4, 0, 8, H); }
  // タイトル
  let title = null, k = 0;
  if (S.key !== 'remix') { if (cb < 6) { title = G[S.key].name; k = cb; } }
  else { const d = cb - seg.b0; if (d < 2.5 && seg.b1 - seg.b0 > 8) { title = seg.g.name; k = d * 2.4; } else if (cb < 6) { title = G.remix.name; k = cb; } }
  if (title) {
    const a = k < 0 ? 0 : k < 0.5 ? k * 2 : k > 5 ? 6 - k : 1;
    c.save(); c.globalAlpha = clamp(a, 0, 1);
    rr(W / 2 - 360, 250, 720, 130, 30); fs('#fff', INK, 7); txt(title, W / 2, 315, 56, INK);
    c.restore();
  }
  if (cb < 4 && cb >= 0) txt(String(4 - Math.floor(cb)), W / 2, 470, 120, '#fff', 'center', INK, 14);
  button(W / 2 - 40, H - 54, 80, 44, '×', quit, { size: 26 });
}
function hud(w, p, cb, tn, seg) {
  const P = S.pl[p];
  rr(14, 14, 84, 46, 20); fs(PCOL[p], INK, 4); txt((p + 1) + 'P', 56, 38, 28, '#fff');
  if (CAM.on) {
    const tw = 150, th = 112, x = 14, y = H - th - 14;
    rr(x - 4, y - 4, tw + 8, th + 8, 10); fs('#000', INK, 4);
    drawVideo(x, y, tw, th, S.np === 2 ? p : -1);
    const m = MOT[p], lv = clamp(m.e / (m.thr * 2), 0, 1);
    c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(x, y + th - 12, tw, 12); c.fillStyle = lv > 0.5 ? '#7cff7a' : '#ffe65a'; c.fillRect(x, y + th - 12, tw * lv, 12);
  }
  // ひょうか の キラキラ
  const [hx, hy] = seg.g.cpos(w), ly = hy + (seg.g.lblDy || 125);
  if (GUIDE && seg.g.go) {
    const lead = Math.min(1.1, S.spb * 1.6);
    let nx = null; for (const x of S.tg) { if (x.t > tn + lead) break; if (x.ev.g !== seg.g || x.res[p]) continue; if (x.t >= tn - 0.3) { nx = x; break; } }
    let trap = null; for (const tr of S.traps) { const dt = tr.t - tn; if (tr.ev.g === seg.g && dt < lead && dt > -0.3 && !tr.res[p]) { trap = tr; break; } }
    if (nx && !(trap && trap.t < nx.t)) {
      const dt = nx.t - tn, k = clamp(dt / lead, 0, 1), now = Math.abs(dt) < 0.13;
      c.save(); circ(hx, hy, 72); c.fillStyle = now ? 'rgba(255,230,90,.55)' : 'rgba(255,255,255,.15)'; c.fill();
      c.setLineDash([10, 8]); c.strokeStyle = '#fff'; c.lineWidth = 5; c.stroke(); c.setLineDash([]);
      circ(hx, hy, 72 + 170 * k); c.strokeStyle = now ? '#ffe65a' : PCOL[p]; c.lineWidth = 10; c.stroke(); c.restore();
      txt(seg.g.go, hx, ly, now ? 54 : 42, now ? '#ffe65a' : '#fff', 'center', INK, 10);
    } else if (trap) txt('✋ ' + seg.g.trapLabel, hx, ly, 42, '#fff', 'center', '#e04848', 10);
  }
  const a = lastAct(P, tn);
  let msg = null, mcol = '#fff', mk = 0;
  if (a && a.tg && tn - a.at < 0.8) {
    const r = a.tg.res[p], d = r ? r.d : 0; mk = (tn - a.at) / 0.8;
    if (a.kind === 'great') { msg = 'ばっちり！'; mcol = '#ffe65a'; }
    else if (a.kind === 'ok') msg = d < 0 ? 'OK（はやめ）' : 'OK（おそめ）';
    else if (a.kind === 'bad') { msg = d < 0 ? 'はやすぎ！' : 'おそすぎ！'; mcol = '#c8c8d8'; }
  } else {
    for (const x of S.tg) { if (x.t > tn) break; const r = x.res[p], k = tn - (x.t + 0.35); if (x.ev.g === seg.g && r && r.kind === 'miss' && k >= 0 && k < 0.8) { msg = 'のがした…'; mcol = '#c8c8d8'; mk = k / 0.8; } }
  }
  if (msg) { c.save(); c.globalAlpha = clamp(1.6 - mk * 1.6, 0, 1); txt(msg, hx, hy - 150 - mk * 30, 40, mcol, 'center', INK, 9); c.restore(); }
  if (a && a.tg && tn - a.at < 0.4) {
    const k = (tn - a.at) / 0.4;
    c.save(); c.globalAlpha = 1 - k;
    if (a.kind === 'great') { for (let i = 0; i < 10; i++) { const an = i / 10 * Math.PI * 2; const r0 = 70 + k * 80; star(hx + Math.cos(an) * r0, hy + Math.sin(an) * r0, 14 * (1 - k * 0.5)); } }
    else if (a.kind === 'ok') { for (let i = 0; i < 6; i++) { const an = i / 6 * Math.PI * 2; circ(hx + Math.cos(an) * (60 + k * 50), hy + Math.sin(an) * (60 + k * 50), 9); fs('#fff', INK, 3); } }
    c.restore();
  }
}
function star(x, y, r) { c.beginPath(); for (let i = 0; i < 10; i++) { const an = i / 10 * Math.PI * 2 - Math.PI / 2, rr2 = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(an) * rr2, y + Math.sin(an) * rr2); } c.closePath(); fs('#ffe65a', INK, 3); }
function quit() { if (S) S.done = true; S = null; go('select'); }
function rankOf(sc) { return sc >= 95 ? ['パーフェクト！', '#ff5aa8'] : sc >= 80 ? ['ノリノリ！', '#ff9a3c'] : sc >= 60 ? ['いいかんじ', '#3fbf6f'] : ['もうちょっと…', '#7a7aa0']; }
function statLine(st, key) {
  const L = [];
  if (key === 'cheese' || key === 'remix') L.push(`いい しゃしん ${st.photo} まい`);
  if (key === 'sneeze' || key === 'remix') L.push(`アフロど ${st.afro}`);
  if (key === 'stamp' || key === 'remix') L.push(`ハンコを おされた ねこ ${st.cat} ひき`);
  if (key === 'freeze' || key === 'remix') L.push(`うごいちゃった ${st.moved} かい`);
  return L;
}
function drawResult(tn) {
  const g = G[RES.key];
  c.fillStyle = g.col; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(255,255,255,.15)'; for (let i = 0; i < 12; i++) { star((i * 211) % W, (i * 89 + tn * 20) % H, 30); }
  txt(g.name + '　けっか', W / 2, 50, 40, '#fff', 'center', INK, 10);
  const k = clamp((tn - RES.t) / 1.2, 0, 1);
  const n = RES.np, cw = n === 2 ? 600 : 800;
  const win = n === 2 ? (RES.pl[0].sc > RES.pl[1].sc ? 0 : RES.pl[1].sc > RES.pl[0].sc ? 1 : -1) : 0;
  for (let p = 0; p < n; p++) {
    const r = RES.pl[p], x0 = n === 2 ? 20 + p * 640 : 240, y0 = 90;
    rr(x0, y0, cw, 520, 28); fs('#fff', INK, 6);
    rr(x0 + 20, y0 + 18, 84, 46, 20); fs(PCOL[p], INK, 4); txt((p + 1) + 'P', x0 + 62, y0 + 42, 28, '#fff');
    const sc = Math.round(r.sc * k);
    txt(sc + ' てん', x0 + cw / 2 + 60, y0 + 70, 64, INK);
    const [rk, rc] = rankOf(r.sc);
    if (k >= 1) txt(rk, x0 + cw / 2 + 60, y0 + 140, 48, rc, 'center', '#fff', 6);
    const won = n === 1 ? r.sc >= 60 : win === p;
    drawChar(x0 + 110, y0 + 470, 0.7, { col: PCOL[p], pose: k < 1 ? 'stand' : won || win === -1 ? 'win' : 'sad', face: k < 1 ? 'norm' : won || win === -1 ? 'happy' : 'sad', afro: Math.min(r.st.afro, 3), sq: won ? Math.abs(Math.sin(tn * 6)) * -10 : 0 });
    if (n === 2 && k >= 1 && win === p) { c.save(); c.translate(x0 + 110, y0 + 90); c.beginPath(); c.moveTo(-40, 20); c.lineTo(-40, -20); c.lineTo(-20, 0); c.lineTo(0, -30); c.lineTo(20, 0); c.lineTo(40, -20); c.lineTo(40, 20); c.closePath(); fs('#ffd23f', INK, 4); c.restore(); }
    statLine(r.st, RES.key).forEach((l, i) => txt(l, x0 + 200, y0 + 200 + i * 36, 24, INK, 'left'));
    r.photos.forEach((ph, i) => polaroid(x0 + 260 + i * 100, y0 + 420, ph, (i % 2 ? 0.08 : -0.06), 0.5, p));
  }
  if (n === 2 && k >= 1) txt(win === -1 ? 'ひきわけ！' : (win + 1) + 'P の かち！', W / 2, 650, 48, '#fff', 'center', INK, 10);
  button(n === 2 ? 30 : 240, 630, 260, 70, 'もういちど', () => startGame(RES.key), { primary: true, size: 30 });
  button(W - 290 - (n === 2 ? 0 : 210), 630, 260, 70, 'ほかの ゲーム', () => go('select'), { size: 28 });
}

// ============================================================
//  入力
// ============================================================
const PTR = { x: -1, y: -1 };
function toLocal(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
cv.addEventListener('pointermove', e => { [PTR.x, PTR.y] = toLocal(e); });
cv.addEventListener('pointerdown', e => {
  initAudio(); const [x, y] = toLocal(e); PTR.x = x; PTR.y = y;
  for (let i = BTNS.length - 1; i >= 0; i--) { const b = BTNS[i]; if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { b.fn(); return; } }
  if (scr === 'play' && S) act(S.np === 2 && x >= W / 2 ? 1 : 0, clock(), 'key');
  else if (scr === 'calib') CAL.hits.push({ t: clock(), type: 'key' });
});
addEventListener('keydown', e => {
  if (e.repeat) return; initAudio();
  const k = e.code;
  if (scr === 'play') {
    if (k === 'Escape') { quit(); return; }
    let p = -1; if (k === 'KeyF' || k === 'Space') p = 0; else if (k === 'KeyJ') p = S && S.np === 2 ? 1 : 0;
    if (p >= 0 && S) { act(p, clock(), 'key'); e.preventDefault(); }
    return;
  }
  if (scr === 'calib' && (k === 'KeyF' || k === 'KeyJ' || k === 'Space')) { CAL.hits.push({ t: clock(), type: 'key' }); e.preventDefault(); return; }
  if (k === 'Enter' || k === 'Space') { const b = BTNS.find(b => b.primary); if (b) { b.fn(); e.preventDefault(); } }
  if (k === 'Escape') { if (scr === 'howto' || scr === 'result') go('select'); else if (scr === 'select' || scr === 'cam') go('title'); }
});

// ============================================================
//  ループ
// ============================================================
function frame() {
  requestAnimationFrame(frame);
  const tn = clock();
  camFrame();
  if (scr === 'play') schedule();
  c.setTransform(SCALE * DPR, 0, 0, SCALE * DPR, 0, 0);
  BTNS = [];
  c.fillStyle = '#1b1530'; c.fillRect(0, 0, W, H);
  if (scr === 'title') drawTitle(tn);
  else if (scr === 'cam') drawCam(tn);
  else if (scr === 'calib') drawCalib(tn);
  else if (scr === 'select') drawSelect(tn);
  else if (scr === 'howto') drawHowto(tn);
  else if (scr === 'play') drawPlay(tn);
  else if (scr === 'result') drawResult(tn);
  if (TOAST && tn - TOAST.t < 3) { rr(W / 2 - 330, H - 110, 660, 64, 30); fs('#fff', INK, 5); txt(TOAST.s, W / 2, H - 78, 26, INK); }
}
setInterval(() => { if (scr === 'play') schedule(); }, 25);
requestAnimationFrame(frame);

if (DBG) {
  window.dbg = {
    go(key = 'cheese', np = 2, bot) { CAM.want = false; MODE.np = np; initAudio(); if (bot) Q.set('bot', bot); startGame(key); },
    S: () => S, MOT, LAT, CAM, G,
    score: () => S ? [0, 1].map(scoreOf) : null,
    jump(b) {
      if (!S) return; const dt = (clock() - b * S.spb) - S.t0;
      S.t0 += dt; S.tg.forEach(x => x.t += dt); S.traps.forEach(x => x.t += dt); S.snds.forEach(x => x.t += dt);
      S.step = Math.floor(b * 4); S.si = S.snds.findIndex(s => s.t > clock()); if (S.si < 0) S.si = S.snds.length;
    },
    res(key = 'cheese', np = 2) { CAM.want = false; MODE.np = np; initAudio(); Q.set('bot', '0.9,0.5'); startGame(key); this.jump(S.end + 1.5); },
  };
  if (Q.get('go')) { const np = +(Q.get('n') || 2); setTimeout(() => dbg.go(Q.get('go'), np), 300); }
}
