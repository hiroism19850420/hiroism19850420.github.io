<html lang="ja">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#22262b;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;color:#222;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{--bg:#abc4db;position:relative;max-width:460px;height:100%;margin:0 auto;background:#fff;overflow:hidden}
section{position:absolute;inset:0;display:none;flex-direction:column}
section.on{display:flex}

/* はじめの画面 */
#setup{align-items:center;justify-content:center;gap:22px;padding:24px;background:#fbfaf7}
#setup h1{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:.22em;color:#3a3d42}
#setup .note{margin:6px 0 0;font-size:13px;letter-spacing:.12em;color:#8b8b8b}
#setup .me{width:92px;height:92px;border-radius:50%;background:#d9dde2;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff}
#setup label{font-size:13px;color:#888}
#nm{width:230px;font:inherit;font-size:20px;text-align:center;padding:10px 4px;border:0;border-bottom:2px solid #cfd4da;background:transparent;outline:none;border-radius:0;-webkit-user-select:text;user-select:text}
#nm:focus{border-color:#7fcf7a}
#go{width:230px;padding:13px;border-radius:26px;background:#7fcf7a;color:#fff;font-size:16px;letter-spacing:.2em}
#go:disabled{background:#d9dde2}

/* トーク一覧 */
#list{background:#fff}
#list header{padding:16px 18px 12px;font-size:20px;font-weight:700;border-bottom:1px solid #eee}
#rows{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;text-align:left}
.row:active{background:#f3f4f6}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv{font-size:12.5px;color:#8b8b8b;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:#a5a5a5}
.badge{min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:#5ac463;color:#fff;font-size:11px;line-height:19px;text-align:center}
#again{display:none;margin:14px auto 22px;font-size:12.5px;color:#a9a9a9;letter-spacing:.15em;padding:8px 16px}
#again.on{display:block}

/* アイコン */
.av{flex:none;width:2.6em;height:2.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1em;overflow:hidden;line-height:1}
.av>i{font-style:normal;font-size:1.35em}
.av svg{width:100%;height:100%;display:block}
.row .av{font-size:19px}
.av-h{background:#ffe9a8}.av-s{background:#d7dcf5}.av-r{background:#ffd4dc}.av-g{background:#d2ecd4}.av-c{background:#e3e3e3}.av-me{background:#c9ced4;color:#fff}

/* トーク */
#chat{background:var(--bg);transition:background 2s}
#chat header{display:flex;align-items:center;gap:4px;padding:10px 8px;background:rgba(255,255,255,.22);color:#1f2a36}
#back{width:38px;height:34px;font-size:28px;line-height:30px}
#ttl{font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log{flex:1;overflow-y:auto;padding:10px 10px 14px;font-size:15px;display:flex;flex-direction:column;gap:.5em;-webkit-overflow-scrolling:touch}
.chip{align-self:center;margin:.35em 0;padding:.28em .9em;border-radius:1em;background:rgba(0,0,0,.16);color:#fff;font-size:.74em;text-align:center;max-width:88%}
.m{display:flex;align-items:flex-end;gap:.4em;max-width:100%;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.l{align-self:flex-start}
.m.r{align-self:flex-end;flex-direction:row-reverse}
.m.l .av{align-self:flex-start}
.m .col{display:flex;flex-direction:column;gap:.18em;min-width:0}
.m .who{font-size:.72em;color:rgba(20,30,40,.75);padding-left:.3em}
.bub{padding:.5em .8em;border-radius:1.15em;background:#fff;line-height:1.45;word-break:break-word;max-width:15.5em;white-space:pre-wrap}
.m.r .bub{background:#a5e68c}
.m.gh{animation:in 1.1s ease-out}
.m.gh .av{opacity:.45}
.m.gh .bub{background:transparent;border:1.5px dashed rgba(255,255,255,.8);color:rgba(255,255,255,.95)}
.bub.raw{padding:0;background:none!important;border-radius:.7em;overflow:hidden}
.meta{flex:none;font-size:.66em;color:rgba(20,30,40,.62);line-height:1.3;padding-bottom:.15em}
.m.r .meta{text-align:right}
.ph{width:11.5em;height:8.4em;border-radius:.7em;overflow:hidden;position:relative;background:#fff}
.ph svg{width:100%;height:100%;display:block}
.st{width:7.4em;height:7.4em}
.st svg{width:100%;height:100%;display:block}

/* クラスに貼られるスクショ */
.shot{width:14.2em;border-radius:.55em;overflow:hidden;background:#a8c0d6;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.shot .hd{background:rgba(255,255,255,.3);padding:.5em .8em;font-size:.72em;font-weight:600;color:#1f2a36}
.shot .bd{padding:.6em .5em .7em;font-size:.68em;display:flex;flex-direction:column;gap:.5em}

/* 入力らん */
#foot,#qfoot{background:#f7f7f8;border-top:1px solid #e3e3e6;padding:8px 10px calc(8px + env(safe-area-inset-bottom));min-height:56px;display:flex;flex-direction:column;gap:7px}
.fake{height:38px;border-radius:19px;background:#fff;border:1px solid #e1e1e4;color:#b5b5b8;font-size:14px;line-height:36px;padding:0 15px}
.opt{width:100%;padding:11px 14px;border-radius:19px;background:#fff;border:1px solid #cfe9cb;font-size:15px;text-align:left;animation:in .25s ease-out}
.opt:active{background:#e3f6df}
.opt.act{text-align:center;background:#7fcf7a;color:#fff;border-color:#7fcf7a}
.fin{align-self:center;font-size:12.5px;color:#a9a9a9;letter-spacing:.15em;padding:10px 16px}

/* クイズ（1周目のあと） */
#quiz{background:var(--bg)}
#quiz header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(255,255,255,.22);color:#1f2a36;font-size:16.5px;font-weight:600}
#qno{font-size:13px;font-weight:400;opacity:.75;font-variant-numeric:tabular-nums}
#qbody{flex:1;overflow-y:auto;padding:16px 10px;font-size:15px;display:flex;flex-direction:column;gap:.6em;justify-content:center}
#qbody .ctx{opacity:.55}
#qbody .m.gh{visibility:hidden}
#qbody.done .m.gh{visibility:visible}
.qq{align-self:center;margin-top:1.6em;color:#fff;font-size:.95em;letter-spacing:.06em;text-align:center}
.qend{align-self:center;color:#fff;font-size:2.6em;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.opt.pick{background:#e9e9ec;border-color:#c9c9cf;color:#888}
.opt.ok{background:#e3f6df;border-color:#7fcf7a;color:#222}
.opt[disabled]{cursor:default}
/* 通知 */
#banner{position:absolute;left:8px;right:8px;top:8px;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(40,44,50,.93);color:#fff;transform:translateY(-140%);transition:transform .35s ease;font-size:15px}
#banner.on{transform:none}
#banner .mid{min-width:0;flex:1}
#banner .nm{font-size:13px;font-weight:600}
#banner .pv{font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

/* 日が変わる */
#inter{position:absolute;inset:0;z-index:9;background:#15181c;color:#d8d8d8;display:flex;align-items:center;justify-content:center;font-size:17px;letter-spacing:.5em;opacity:0;pointer-events:none;transition:opacity .8s}
#inter.on{opacity:1;pointer-events:auto}
</style>

// ───────── 音 ─────────
let AC = null;
function pop(f) {
  if (!AC || quiet || FAST) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + .07);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.05, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .25);
}

// ───────── 表示 ─────────
function show(id) { for (const s of document.querySelectorAll('section')) s.classList.toggle('on', s.id === id); }
function msgEl(room, m) {
  const d = document.createElement('div');
  if (m.type) { d.className = 'chip'; d.textContent = m.text; return d; }
  const mine = m.who === 'me';
  d.className = 'm ' + (mine ? 'r' : 'l') + (m.ghost ? ' gh' : '');
  const meta = m.ghost ? '' : '<div class="meta">' + (mine && m.read ? m.read + '<br>' : '') + m.time + '</div>';
  d.innerHTML = mine ? bodyHTML(m.body) + meta
    : avatar(m.who) + '<div class="col">' + (ROOMS[room].group ? '<div class="who">' + WHO[m.who] + '</div>' : '') + bodyHTML(m.body) + '</div>' + meta;
  return d;
}
function draw(room, m) {
  if (cur !== room) return;
  m.el = msgEl(room, m); log.appendChild(m.el); log.scrollTop = log.scrollHeight;
}
function redraw(m) { if (m.el && m.el.parentNode) { const n = msgEl(cur, m); m.el.replaceWith(n); m.el = n; } }
function push(room, m) {
  const R = ROOMS[room];
  if (R.lastDay !== day) { R.lastDay = day; const c = {type:'date', text:DATES[day]}; R.msgs.push(c); draw(room, c); }
  R.msgs.push(m); R.seq = ++SEQ; draw(room, m);
}
function post(room, who, body, o) {
  o = o || {};
  if (++V.tick % 4 === 0) V.min++;
  const m = {who, body: typeof body === 'string' ? T(body) : body, time: clock()};
  push(room, m);
  pop(who === 'me' ? 520 : 780);
  if (o.k) addShot(o.k, room, {who, body: m.body});
  if (who === 'me' && !o.noRead) setTimeout(() => { m.read = ROOMS[room].group ? '既読 ' + (V.cnt - 1) : '既読'; redraw(m); }, FAST ? 0 : 900);
  return m;
}
function ghost(room, text) { push(room, {who:'h', body:T(text), ghost:1}); }
function postSys(room, text, k) {
  const m = {type:'sys', text}; push(room, m);
  if (k) addShot(k, room, {sys: text});
  return m;
}
function drop(room, m) { const a = ROOMS[room].msgs, i = a.indexOf(m); if (i >= 0) a.splice(i, 1); if (m.el) m.el.remove(); }
function idle() { foot.innerHTML = '<div class="fake">メッセージを入力</div>'; }
function renderList() {
  const ks = Object.keys(ROOMS).filter(k => ROOMS[k].msgs.length || ROOMS[k].pv).sort((a, b) => ROOMS[b].seq - ROOMS[a].seq);
  $('rows').innerHTML = ks.map(k => {
    const R = ROOMS[k], vis = R.msgs.filter(m => !m.ghost), last = vis[vis.length - 1];
    const pv = R.pv || (last ? (last.type ? last.text : preview(last.body)) : '');
    return '<button class="row" data-r="' + k + '">' + avatar(R.av) + '<div class="mid"><div class="nm">' + esc(title(k)) + '</div><div class="pv">' + esc(pv) + '</div></div>'
      + '<div class="rt"><span>' + (R.pt || (last && last.time) || '') + '</span>' + (R.unread ? '<span class="badge">' + R.unread + '</span>' : '') + '</div></button>';
  }).join('');
  $('again').classList.toggle('on', ended); $('again').textContent = afterLabel();
}
function enterRoom(r) {
  hideBanner();
  cur = r; const R = ROOMS[r]; R.unread = 0;
  $('ttl').textContent = title(r);
  log.innerHTML = ''; for (const m of R.msgs) { m.el = msgEl(r, m); m.el.style.animation = 'none'; log.appendChild(m.el); }
  show('chat'); log.scrollTop = log.scrollHeight;
  if (!running) idle();
  if (pend && pend.room === r && !running) { const sc = pend; pend = null; R.pv = null; R.pt = null; run(sc); }
  gates.splice(0).forEach(f => f());
}
function leaveRoom() { cur = null; renderList(); show('list'); }
let bt = 0;
function showBanner(r, text) {
  const b = $('banner'); b.dataset.r = r;
  b.innerHTML = avatar(ROOMS[r].av) + '<div class="mid"><div class="nm">' + esc(title(r)) + '</div><div class="pv">' + esc(text) + '</div></div>';
  b.classList.add('on'); clearTimeout(bt); bt = setTimeout(hideBanner, 6000);
}

// ───────── 進行 ─────────
const gates = [];
let skip = null;
const sleep = ms => new Promise(r => setTimeout(r, FAST ? 0 : ms));
function wait(ms) {
  if (FAST) return Promise.resolve();
  return new Promise(res => { const t = setTimeout(done, ms); function done() { clearTimeout(t); skip = null; res(); } skip = done; });
}
async function gate(room) { while (cur !== room) await new Promise(r => gates.push(r)); }
function choose(opts, act) {
  return new Promise(res => {
    foot.innerHTML = opts.map((t, i) => '<button class="opt' + (act ? ' act' : '') + '" data-i="' + i + '">' + esc(t) + '</button>').join('');
    foot.onclick = e => { const b = e.target.closest('.opt'); if (!b) return; foot.onclick = null; idle(); res(+b.dataset.i); };
    log.scrollTop = log.scrollHeight;
    if (FAST) setTimeout(() => { foot.onclick = null; idle(); res(0); }, 0);
  });
}
const delayFor = b => typeof b === 'string' ? Math.max(750, Math.min(2300, 480 + b.length * 60)) : 1200;

async function run(sc) {
  running = true; idle();
  for (let i = 0; i < sc.steps.length; i++) {
    const st = sc.steps[i];
    await gate(sc.room);
    if (Array.isArray(st)) {
      const o = st[2] || {};
      if (round > 1 && o.g) {
        await wait((o.p || 0) + 1100); await gate(sc.room);
        ghost(sc.room, o.g);
        await wait(1900 + o.g.length * 90); await gate(sc.room);
      }
      await wait(st[0] === 'me' ? 350 : (o.p || 0) + delayFor(st[1]));
      await gate(sc.room);
      post(sc.room, st[0], st[1], o);
    } else if (st.c) {
      await wait(500);
      let n = await choose(st.c.map(T));
      if (st.end && FAST) n = AUTOEND;
      if (st.set === 'N') V.N = st.c[n];
      if (st.set === 'G') {
        V.G = T(st.c[n]); $('ttl').textContent = title('g');
        postSys('g', V.name + 'がグループ名を「' + V.G + '」に変更しました', st.k);
      } else post(sc.room, 'me', st.c[n], st);
      if (st.end) { sc.steps.push(...END[n].tail); S.push(...END[n].scenes); }
    } else if (st.a) {
      await wait(700); await choose([st.a], true); post(sc.room, 'me', st.send, st);
    } else if (st.sys) {
      await wait(1000); postSys(sc.room, T(st.sys));
    } else if (st.fn) await FN[st.fn](sc);
  }
  running = false;
  advance();
}
function advance() {
  si++;
  if (si >= S.length) return;
  const sc = S[si];
  const go = () => {
    pend = sc; const R = ROOMS[sc.room], f = sc.steps[0];
    V.min = toMin(sc.t);
    R.unread = 1; R.pv = T(sc.preview || (Array.isArray(f) ? preview(f[1]) : '')); R.pt = sc.t; R.seq = ++SEQ;
    if (cur === null) renderList();
    quiet = sc.room === 'c';
    pop(780); showBanner(sc.room, R.pv);
    if (FAST) enterRoom(sc.room);
  };
  if (sc.day !== day) setTimeout(async () => { await inter(sc.day); go(); }, FAST ? 0 : 2800);
  else setTimeout(go, FAST ? 0 : (sc.gap || 2000));
}
async function inter(d) {
  const el = $('inter'); el.textContent = DAYNAME[d]; el.classList.add('on');
  await sleep(1000);
  day = d; app.style.setProperty('--bg', BG[d]); hideBanner(); leaveRoom();
  await sleep(1500);
  el.classList.remove('on');
  await sleep(700);
}
function finish() { ended = true; foot.innerHTML = '<button class="fin" id="fin">' + afterLabel() + '</button>'; $('fin').onclick = after; if (cur === null) renderList(); }

const FN = {
  // 一瞬だけ見えて、消える
  async hinataUnsend() {
    await wait(2200); await gate('g');
    if (round > 1) { ghost('g', 'あのね、そのよび方、やめてほしい'); await wait(2600); }
    else { const m = post('g', 'h', 'あのね、そのよび方'); await sleep(850); drop('g', m); }
    postSys('g', 'ひなたがメッセージの送信を取り消しました');
  },
  async sakiUnsend() {
    await sleep(500);
    const v = ROOMS.g.msgs.find(m => m.body && m.body.video); if (v) drop('g', v);
    postSys('g', 'さきがメッセージの送信を取り消しました');
    await sleep(2600);
  },
  async hold() { await sleep(5200); },
  async leave() {
    await sleep(700);
    postSys('g', 'ひなたが退会しました'); V.cnt = 3; $('ttl').textContent = title('g');
    await sleep(2600);
  },
  async endB() {
    await sleep(7000);
    V.duo = true;
    if (cur === null) renderList(); else { const y = log.scrollTop; for (const m of ROOMS[cur].msgs) if (m.who === 'h') redraw(m); log.scrollTop = y; }
    await sleep(5000);
    finish();
  },
  async endA() {
    quiet = true;
    for (let n = 1; n <= 12; n++) { await sleep(n === 1 ? 900 : 620); await gate('c'); if (SHOTS[n]) post('c', 'h', {shot: n}); }
    await sleep(3800); await gate('c');
    await choose(['え', 'まって', 'ちがうの']).then(i => { this._m = post('c', 'me', ['え', 'まって', 'ちがうの'][i], {noRead: 1}); });
    const m = this._m;
    for (const [n, ms] of [[1, 1800], [5, 2600], [18, 3600], [33, 5200]]) { await sleep(ms); m.read = '既読 ' + n; redraw(m); }
    await sleep(9000);
    finish();
  },
};

// ───────── クイズ（1周目のあと） ─────────
// line=送られた文、t=本当の意味、o=選択肢（a 番めが t と同じ意味）
const QUIZ = [
  {who:'h', ctx:[['r','ひとりだけ逆']], line:'やめてよ〜笑', o:['もっと言って、という フリ','ほんとにやめて','はずかしいけど、うれしい'], a:1, t:'ほんとにやめて'},
  {who:'h', line:'あした雨だといいな', o:['雨の日がすき','新しいかさを使いたい','学校、行きたくないな'], a:2, t:'学校、行きたくないな'},
  {who:'h', line:'さいきん朝の教室すきなの。しずかで', o:['だれもいない時間だけ、ほっとする','早起きが楽しくなってきた','朝のうちに勉強したい'], a:0, t:'だれもいない時間だけ、ほっとする'},
  {who:'h', ctx:[['r','{N}まじ有能']], sys:'ひなたがメッセージの送信を取り消しました', line:'ごめん、まちがえた！', o:['スタンプを押しまちがえた','そのよび方、やめてほしい','べつの人に送る文だった'], a:1, t:'あのね、そのよび方、やめてほしい'},
  {who:'h', ctx:[['h','お母さんにね、「学校でなんて呼ばれてるの」って聞かれて']], line:'「ひなちゃん」って言っといた', o:['家ではそう呼ばれているから','お母さんを笑わせたかった','あだ名のこと、お母さんには言えない'], a:2, t:'あだ名のこと、お母さんには言えない'},
  {who:'h', ctx:[['h','笑ってるやつばっかり入ってるの']], line:'これあると、返事にこまらなくて', o:['文字を打つのが めんどう','笑っているふりができる','うさぎがかわいくて好き'], a:1, t:'笑っているふりができるから'},
  {who:'s', line:'最近ちょっと、やりすぎだと思う', o:['さきが、やりすぎた','ひなたが、やりすぎている','{名前}が、やりすぎている'], a:2, t:'{名前}、やりすぎだよ'},
  {who:'h', ctx:[['h','好きなんだよね、その子のこと。だからこまる']], line:'{名前}ちゃんはやさしいね', o:['その子って、{名前}ちゃんのこと','話を聞いてくれて、うれしい','もう、この話はやめたい'], a:0, t:'その子って、{名前}ちゃんのことだよ'},
  {who:'h', ctx:[['h','あ…土よう、塾の模試だ']], line:'うん！たのしんできてね', o:['模試のほうが大事','わたしも行きたかった','おそろいは好きじゃない'], a:1, t:'わたしも行きたかった'},
  {who:'h', line:'土よう、写真おくってね', o:['キーホルダーが見たい','いっしょに行った気分になりたい','それで、さいごにする'], a:2, t:'それで、さいごにする'},
  {who:'h', ctx:[['me',{img:'key'}],['me','りこの分も買っといたよ']], line:'いいな〜かわいい', o:['星の形をほめている','わたしの分は、ないんだね','つぎは自分も買いにいく'], a:1, t:'わたしの分は、ないんだね'},
  {who:'h', line:'{名前}ちゃんは、どっちがいいと思う？', o:['自分では決められない','さきちゃんのことを相談したい','気づいて'], a:2, t:'気づいて'},
];
let qi = 0, qok = 0, quizDone = false;
const after = () => quizDone ? restart() : startQuiz();
const afterLabel = () => quizDone ? 'さいしょから' : '本当の意味';
function qrow(who, text, cls) {
  if (typeof text !== 'string') return '<div class="m ' + (who === 'me' ? 'r ' : 'l ') + cls + '">' + bodyHTML(text) + '</div>';
  return who === 'me' ? '<div class="m r ' + cls + '">' + bodyHTML(T(text)) + '</div>'
    : '<div class="m l ' + cls + '">' + avatar(who) + '<div class="col">' + bodyHTML(T(text)) + '</div></div>';
}
function startQuiz() { quizDone = true; V.duo = false; qi = 0; qok = 0; hideBanner(); cur = null; show('quiz'); drawQ(); }
function drawQ() {
  const q = QUIZ[qi], body = $('qbody'), ft = $('qfoot');
  $('qttl').textContent = WHO[q.who]; $('qno').textContent = (qi + 1) + ' / ' + QUIZ.length;
  body.className = '';
  body.innerHTML = (q.ctx || []).map(c => qrow(c[0], c[1], 'ctx')).join('')
    + qrow(q.who, q.t, 'gh')
    + (q.sys ? '<div class="chip">' + esc(q.sys) + '</div>' : '')
    + qrow(q.who, q.line, '')
    + '<div class="qq">本当の意味は何だと思いますか？</div>';
  ft.innerHTML = q.o.map((t, i) => '<button class="opt" data-i="' + i + '">' + esc(T(t)) + '</button>').join('');
  ft.onclick = e => {
    const b = e.target.closest('.opt'); if (!b || b.dataset.i === undefined) return;
    const n = +b.dataset.i; if (n === q.a) qok++;
    ft.querySelectorAll('.opt').forEach((x, i) => { x.disabled = true; if (i === q.a) x.classList.add('ok'); else if (i === n) x.classList.add('pick'); });
    body.classList.add('done'); pop(n === q.a ? 780 : 420);
    ft.insertAdjacentHTML('beforeend', '<button class="opt act" id="qnext">つぎへ</button>');
    ft.onclick = null;
    $('qnext').onclick = ev => { ev.stopPropagation(); if (++qi < QUIZ.length) drawQ(); else endQuiz(); };
  };
}
function endQuiz() {
  $('qttl').textContent = ''; $('qno').textContent = '';
  $('qbody').className = '';
  $('qbody').innerHTML = '<div class="qend">' + qok + ' / ' + QUIZ.length + '</div>';
  $('qfoot').innerHTML = '<button class="opt act" id="qre">さいしょから読む</button>';
  $('qre').onclick = restart;
}

// ───────── はじまり ─────────
const nm = $('nm');
nm.oninput = () => { const v = nm.value.trim(); $('go').disabled = !v; $('meIcon').textContent = v.slice(0, 1) || '・'; };
nm.onkeydown = e => { if (e.key === 'Enter') nm.blur(); };
$('go').onclick = async () => {
  V.name = nm.value.trim().slice(0, 8); if (!V.name) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  nm.blur();
  begin();
};
async function begin() {
  const el = $('inter'); el.textContent = DAYNAME[0]; el.classList.add('on');
  await sleep(1300); renderList(); show('list'); await sleep(1300); el.classList.remove('on'); await sleep(900);
  advance();
}
// 2周目：同じ会話。ひなたが打って消した文だけが、うすく見える
function restart() {
  round++;
  for (const k in ROOMS) Object.assign(ROOMS[k], {msgs:[], unread:0, seq:0, lastDay:-1, pv:null, pt:null});
  Object.assign(V, {N:'', G:'', cnt:4, min:0, tick:0, duo:false});
  for (const k in SHOTS) delete SHOTS[k];
  S = mkS(); si = -1; day = 0; cur = null; pend = null; running = false; ended = false; SEQ = 0; quiet = false;
  hideBanner(); app.style.setProperty('--bg', BG[0]);
  begin();
}
$('rows').onclick = e => { const b = e.target.closest('.row'); if (b) enterRoom(b.dataset.r); };
$('banner').onclick = () => enterRoom($('banner').dataset.r);
$('back').onclick = leaveRoom;
$('again').onclick = after;
log.onclick = () => { if (skip) skip(); };

// 確認用：URL に ?dbg をつけると window.dbg.auto(0 か 1) で最後まで早送り（0=やり返す 1=あきらめる）、dbg.again() で2周目へ
if (location.search.includes('dbg')) window.dbg = {
  V, ROOMS, SHOTS,
  auto(end) { FAST = true; AUTOEND = end | 0; if (!V.name) { nm.value = 'ゆい'; nm.oninput(); $('go').onclick(); } },
  slow() { FAST = false; },
  again() { restart(); },
  quiz() { startQuiz(); },
  get round() { return round; },
};
</script>
