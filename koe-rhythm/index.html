// ================= 耳（音声認識） =================
const Ear = {
  on: false, rec: null, sess: 0, log: [], denied: false,
  start() { if (!SR || this.on) return; this.on = true; this._go(); },
  _go() {
    if (!this.on) return;
    const rec = new SR(), sess = ++this.sess, map = {};
    rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        let en = map[i];
        if (!en) { en = map[i] = { t: clock(), text: '' }; this.log.push(en); }
        en.text = e.results[i][0].transcript;
      }
      onHeard();
    };
    rec.onerror = e => { if (e.error === 'audio-capture' && Mic.stream) { Mic.close(); return; }   // 録音と ぶつかる機種は 聞き取りを 優先
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { this.on = false; this.denied = true; micDenied(); } };
    rec.onend = () => { if (this.rec === rec) this.rec = null; if (this.on) setTimeout(() => { if (this.on && !this.rec) this._go(); }, 80); };
    this.rec = rec;
    try { rec.start(); } catch (e) { this.rec = null; setTimeout(() => this._go(), 400); }
  },
  stop() { this.on = false; const r = this.rec; this.rec = null; try { r && r.abort(); } catch (e) {} },
};

// ================= マイク（声の大きさ と 録音） =================
// 声の大きさで「拍に あわせて 言えたか」を見る（激アマ）。同じ音を録音して、さいごに 曲と いっしょに 聞きなおす
const Mic = {
  stream: null, an: null, buf: null, floor: .01, level: 0, rec: null, chunks: [], recT0: 0, voiceBuf: null,
  async open() {
    if (this.stream || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      this.an = AC.createAnalyser(); this.an.fftSize = 1024;
      AC.createMediaStreamSource(this.stream).connect(this.an);
      this.buf = new Float32Array(this.an.fftSize);
    } catch (e) { this.stream = null; this.an = null; }
  },
  sample(now) {
    if (!this.an) return;
    this.an.getFloatTimeDomainData(this.buf);
    let q = 0; for (let i = 0; i < this.buf.length; i++) q += this.buf[i] * this.buf[i];
    const rms = this.level = Math.sqrt(q / this.buf.length);

  recStart() {

    } catch (e) { this.rec = null; }
  },
  recStop() {
    const r = this.rec; this.rec = null;

    return new Promise(res => {
      r.onstop = async () => {
        try { this.voiceBuf = await AC.decodeAudioData(await new Blob(this.chunks, { type: r.mimeType }).arrayBuffer()); } catch (e) { this.voiceBuf = null; }
        res(this.voiceBuf);

      r.stop();
    });
  },
  close() { if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; this.an = null; },
};
const Replay = {
  on: false, src: null, off: 0, bi: 0,
  start() {
    if (!Mic.voiceBuf) return;
    this.stop();
    const t0 = clock() + .15, s = AC.createBufferSource(), g = AC.createGain();
    s.buffer = Mic.voiceBuf; g.gain.value = 1.8; s.connect(g); g.connect(master); s.start(t0);
    s.onended = () => { if (this.src === s) this.stop(); };
    this.src = s; this.off = t0 - Mic.recT0; this.bi = 0; this.on = true;
    $('#listenBtn').textContent = '■ とめる';
  },
  stop() {
    const s = this.src; this.src = null; this.on = false;
    try { s && s.stop(); } catch (e) {}
    if (Mic.voiceBuf) $('#listenBtn').textContent = '▶ じぶんの こえを きく';
  },
  tick() {   // 録音にあわせて 曲を もういちど ならす
    if (!this.on) return;
    const ahead = clock() + .15;
    while (this.bi < G.beats.length && G.beats[this.bi].t + this.off < ahead) { const b = G.beats[this.bi++]; playBeat(Object.assign({}, b, { t: b.t + this.off })); }
  },

// ================= かな と 照合 =================
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const kanaOnly = s => toHira(s).replace(/[^ぁ-ゖー]/g, '');
let tokenizer = null;
function reading(text) {
  if (!tokenizer) return kanaOnly(text);
  let out = '';
  for (const tk of tokenizer.tokenize(text)) out += (tk.reading && tk.reading !== '*') ? tk.reading : tk.surface_form;
  return kanaOnly(out);
}
function tokenize(kana, items) {   // かなの列を、ことばの列に
  const forms = [];
  items.forEach(id => WORDS[id].kana.forEach(f => forms.push([f, id])));
  forms.sort((a, b) => b[0].length - a[0].length);
  const out = [];
  for (let i = 0; i < kana.length;) {
    const hit = forms.find(([f]) => kana.startsWith(f, i));
    if (hit) { out.push(hit[1]); i += hit[0].length; } else i++;
  }
  return out;
}
function align(exp, got) {   // 最長共通部分列で、あたった札の番号を返す
  const n = exp.length, m = got.length, L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = exp[i] === got[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);

    if (exp[i] === got[j]) { hit.add(i); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
  }
  return hit;
}

// ================= ゲーム =================
const G = { scene: 'title', stage: null, rounds: [], beats: [], bi: 0, endT: 0, heard: '', heardT: 0, voice: true };
const clock = () => AC ? AC.currentTime : performance.now() / 1000;

function makePattern(items, r) {
  const [A, B] = items;
  if (items.length === 2) {
    if (r === 0) return [A, A, B, B, A, A, B, B];
    if (r === 1) return [A, B, A, B, A, B, A, B];
  }
  for (;;) {
    const p = Array.from({ length: 8 }, () => items[Math.random() * items.length | 0]);
    let sw = 0; for (let i = 1; i < 8; i++) if (p[i] !== p[i - 1]) sw++;
    const want = items.length > 2 ? 4 : r === 2 ? 3 : 4;
    if (sw >= want && sw <= 6 && new Set(p).size >= Math.min(2, items.length)) return p;
  }
}

function startStage(st) {
  initAudio();
  G.stage = st; G.scene = 'play'; G.rounds = []; G.beats = []; G.bi = 0;
  let t = clock() + .6;
  const pool = st.items.length > 2 ? st.items : null;
  BPMS.forEach((bpm, r) => {
    const items = pool ? shuffle(pool.slice()).slice(0, r < 2 ? 3 : 4) : st.items;
    const d = 60 / bpm, R = { r, bpm, d, t0: t, pat: makePattern(items, r), items, hit: new Set(), hitT: {}, ok: {}, fb: {}, done: false, tilt: Array.from({ length: 8 }, () => (Math.random() - .5) * .07) };
    R.sayT = t + SAY0 * d; R.sayEnd = R.sayT + 8 * d;
    G.rounds.push(R);
    for (let k = 0; k < ROUND_BEATS; k++) G.beats.push({ t: t + k * d, k, d, r });
    t += ROUND_BEATS * d;
  });
  G.endT = t + .2;
  Ear.log.length = 0;
  Replay.stop();
  if (G.voice) { Ear.start(); Mic.recStart(); }
  show(null); $('#quit').hidden = false;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function judge(R, now) {
  const from = R.sayT - R.d * .6, to = R.sayEnd + 1.6;
  const txt = Ear.log.filter(e => e.t >= from && e.t < to).map(e => e.text).join(' ');
  const got = tokenize(reading(txt), R.items).slice(0, 12);
  const hit = align(R.pat, got);
  hit.forEach(i => { if (!R.hit.has(i)) { R.hit.add(i); R.hitT[i] = Math.max(now, R.sayT + i * R.d); bacchiri(R, i, R.hitT[i]); } });
  return txt;
}
function bacchiri(R, i, t) {   // 拍に声が出た か、ことばが あたった ら「ばっちり！」
  if (R.fb[i] != null) return;
  R.fb[i] = t;
  tone(Math.max(clock(), t), hz(PENTA[5 + (i % 3)]), 'sine', .1, .18);
}
function markVoice(t) {   // その時の 声を、いちばん近い 拍の札へ（ずれは 前0.4拍・後0.6拍まで 許す）
  if (G.scene !== 'play') return;
  for (const R of G.rounds) {
    const j = Math.floor((t - R.sayT) / R.d + .4);
    if (j >= 0 && j < 8 && R.ok[j] == null) { R.ok[j] = t; bacchiri(R, j, t); }

}
function cardPts(R, i) { const w = R.hit.has(i), v = R.ok[i] != null; return w && v ? 1 : w || v ? .85 : 0; }

  let raw = 0, n = 0;
  G.rounds.forEach(R => { for (let i = 0; i < 8; i++) { raw += cardPts(R, i); n++; } });
  const x = raw / n;

function onHeard() {
  if (G.scene !== 'play') return;
  const now = clock();
  for (const R of G.rounds) if (!R.done && now >= R.sayT - R.d && now < R.sayEnd + 1.6) {
    const txt = judge(R, now);
    if (txt.trim()) { G.heard = txt.trim().slice(-24); G.heardT = now; }
  }
}

function finish() {
  G.scene = 'result'; Ear.stop(); $('#quit').hidden = true;
  const per = G.rounds.map(R => Object.keys(R.fb).length), sum = per.reduce((a, b) => a + b, 0), max = G.rounds.length * 8;
  const score = totalScore();
  $('#resTitle').textContent = G.stage.name;
  $('#resScore').innerHTML = G.voice || DBG ? `${score}<small>てん</small>` : '<small>みるだけ</small>';
  $('#resPraise').textContent = !G.voice ? 'こえなしで みたよ' : score >= 100 ? 'まんてん！ リズムの たつじん！' : score >= 90 ? 'ばっちり！ すごすぎる！' : score >= 75 ? 'すごい！ リズム ばっちり！' : score >= 50 ? 'いいね！ そのちょうし！' : 'たのしかったね！ もういっかい！';
  $('#resSub').textContent = G.voice || DBG ? `ばっちり ${sum} / ${max}` : '';
  $('#rounds').innerHTML = per.map((n, i) => `<span class="${n === 8 ? 'full' : ''}">${i + 1}かいめ ${n}/8</span>`).join('');
  if (G.voice) { const best = getBest(); if (score > (best[G.stage.id] || 0)) { best[G.stage.id] = score; setBest(best); } }
  if (score >= 90 && G.voice) { const t = clock(); [72, 76, 79, 84].forEach((m, i) => tone(t + i * .1, hz(m), 'square', .1, .3)); }
  const lb = $('#listenBtn');
  lb.hidden = !Mic.rec; lb.disabled = true; lb.textContent = 'ろくおんを じゅんびちゅう…';
  Mic.recStop().then(buf => { lb.hidden = !buf; lb.disabled = false; lb.textContent = '▶ じぶんの こえを きく'; });

}
function getBest() { try { return JSON.parse(localStorage.getItem('koeRhythmScore') || '{}'); } catch (e) { return {}; } }
function setBest(b) { try { localStorage.setItem('koeRhythmScore', JSON.stringify(b)); } catch (e) {} }

// ================= 描画 =================
const cv = $('#cv'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
addEventListener('resize', resize); resize();

const ease = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

function roundRect(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, r)) : c.rect(x, y, w, h); }

function drawBg(now, pulse) {
  cx.fillStyle = '#bfe8de'; cx.fillRect(0, 0, W, H);
  const s = 46, off = (now * 18) % (s * 2);
  cx.save(); cx.strokeStyle = '#b0e0d4'; cx.lineWidth = s * .5;
  for (let x = -H - s * 2; x < W + s * 2; x += s * 2) { cx.beginPath(); cx.moveTo(x + off, 0); cx.lineTo(x + off + H, H); cx.stroke(); }
  cx.restore();
  if (pulse > 0) { cx.fillStyle = `rgba(255,255,255,${pulse * .18})`; cx.fillRect(0, 0, W, H); }
}

function layout() {
  const port = H > W * 1.05, cols = port ? 2 : 4, rows = port ? 4 : 2;
  const top = Math.max(H * (port ? .17 : .2), 70), bot = Math.max(H * .12, 46);
  const gap = Math.min(W, H) * .03;
  const size = Math.max(Math.min((W * .9 - 32 - gap * (cols - 1)) / cols, (H - top - bot - gap * (rows - 1)) / rows, 220), 24);
  const gw = cols * size + gap * (cols - 1), gh = rows * size + gap * (rows - 1);
  const x0 = (W - gw) / 2, y0 = top + (H - top - bot - gh) / 2;
  return { cols, size, gap, top, bot, pos: i => [x0 + (i % cols) * (size + gap) + size / 2, y0 + Math.floor(i / cols) * (size + gap) + size / 2] };
}

function drawCard(c, id, x, y, s, rot, sc, lift, lit, stampA, dim) {
  c.save(); c.translate(x, y - lift); c.rotate(rot); c.scale(sc, sc);
  c.fillStyle = 'rgba(34,38,59,.22)'; roundRect(c, -s / 2 + 4, -s / 2 + 7 + lift * .6, s, s, s * .1); c.fill();
  if (lit) { c.fillStyle = '#ffd23f'; roundRect(c, -s / 2 - s * .07, -s / 2 - s * .07, s * 1.14, s * 1.14, s * .15); c.fill(); }
  c.fillStyle = '#fffdf7'; roundRect(c, -s / 2, -s / 2, s, s, s * .1); c.fill();
  c.lineWidth = Math.max(3, s * .035); c.strokeStyle = INK; c.stroke();
  c.save(); c.scale(s / 118, s / 118); ART[id](c); c.restore();
  if (dim) { c.fillStyle = `rgba(255,253,247,${dim})`; roundRect(c, -s / 2, -s / 2, s, s, s * .1); c.fill(); }
  if (stampA > 0) {   // あたり の はなまる
    const k = back(clamp(stampA)), r = s * .13 * k;
    c.save(); c.translate(s * .42, -s * .42);
    c.fillStyle = '#2fbf71'; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
    c.lineWidth = Math.max(3, s * .03); c.strokeStyle = INK; c.stroke();
    c.lineWidth = s * .035; c.strokeStyle = '#fff'; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-r * .45, 0); c.lineTo(-r * .1, r * .38); c.lineTo(r * .5, -r * .35); c.stroke();
    c.restore();
  }
  c.restore();
}

function text(str, x, y, size, col = INK, font = 'Mochiy Pop One', stroke) {
  cx.font = `${size}px "${font}", "M PLUS Rounded 1c", sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  if (stroke) { cx.lineWidth = size * .16; cx.strokeStyle = stroke; cx.lineJoin = 'round'; cx.strokeText(str, x, y); }
  cx.fillStyle = col; cx.fillText(str, x, y);
}

function frame() {
  requestAnimationFrame(frame);
  const now = clock() - (AC && AC.outputLatency || 0);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  Replay.tick();
  if (G.scene !== 'play') { drawBg(now, 0); drawDeco(now); return; }

  // 音の予約
  const ahead = clock() + .15;
  while (G.bi < G.beats.length && G.beats[G.bi].t < ahead) {
    const b = G.beats[G.bi++];
    playBeat(b);
    if (DBG && dbg.auto && b.k >= SAY0 && b.k < SAY0 + 8) { const R = G.rounds[b.r]; setTimeout(() => dbg.say(WORDS[R.pat[b.k - SAY0]].name), (b.t - clock()) * 1000 + 350); }
  }
  Mic.sample(now);
  let R = G.rounds[0];
  for (const x of G.rounds) if (now >= x.t0) R = x;
  for (const x of G.rounds) if (!x.done && now > x.sayEnd + 1.6) { judge(x, now); x.done = true; }
  if (now > G.endT + 1.4) { finish(); return; }

  const k = Math.floor((now - R.t0) / R.d), ph = clamp((now - R.t0) / R.d - k);
  const pulse = k >= 2 ? Math.pow(1 - ph, 3) : 0;
  drawBg(now, pulse);
  const L = layout(), s = L.size;

  // 上：なんかいめ と スコア
  const ty = Math.min(L.top * .5, 70);
  text(G.stage.name, W / 2, ty - Math.min(26, ty * .45), Math.min(18, W * .04), '#4d5a73', 'M PLUS Rounded 1c');
  text(`${R.r + 1} / ${G.rounds.length}`, W / 2, ty + 6, Math.min(40, L.top * .36), INK, 'Mochiy Pop One', '#fffdf7');
  const pillW = Math.min(64, W * .12);
  G.rounds.forEach((x, i) => {
    const px = (i < 2 ? 16 + i * (pillW + 6) + pillW / 2 : W - 16 - (G.rounds.length - 1 - i) * (pillW + 6) - pillW / 2);
    if (W < 520) return;
    const y = ty + 6, active = x === R;
    const nb = Object.keys(x.fb).length;
    cx.fillStyle = nb === 8 ? '#ffd23f' : active ? '#fffdf7' : 'rgba(255,253,247,.6)';
    roundRect(cx, px - pillW / 2, y - 15, pillW, 30, 15); cx.fill(); cx.lineWidth = 3; cx.strokeStyle = INK; cx.stroke();
    text(now >= x.sayT ? `${nb}/8` : '・', px, y + 1, 15, INK, 'M PLUS Rounded 1c');
  });

  // よびこみ：大きな数字
  if (k < 2) {
    const p = clamp((now - R.t0) / (R.d * 2));
    text(`${R.r + 1}かいめ`, W / 2, H / 2 - s * .15, Math.min(W * .14, 110) * back(clamp(p * 3)), INK, 'Mochiy Pop One', '#ffd23f');
    text(`はやさ ${'♪'.repeat(R.r + 1)}`, W / 2, H / 2 + s * .45, Math.min(W * .05, 28), '#4d5a73', 'M PLUS Rounded 1c');
    return;
  }

  // 札
  const sayIdx = now >= R.sayT && now < R.sayEnd ? Math.floor((now - R.sayT) / R.d) : -1;
  for (let i = 0; i < 8; i++) {
    const [x, y] = L.pos(i), appear = R.t0 + (2 + i) * R.d;
    const a = clamp((now - appear) / .28);
    if (a <= 0) {
      cx.save(); cx.setLineDash([8, 8]); cx.lineWidth = 3; cx.strokeStyle = 'rgba(34,38,59,.25)';
      roundRect(cx, x - s / 2, y - s / 2, s, s, s * .1); cx.stroke(); cx.restore();
      continue;
    }
    const lit = i === sayIdx, lp = lit ? ph : 0;
    const lift = lit ? s * .08 * (1 - lp * .5) : 0;
    const sc = back(a) * (lit ? 1.08 + .06 * Math.pow(1 - lp, 3) : 1);
    const ht = R.hitT[i], stampA = ht != null && now >= ht ? (now - ht) / .22 : 0;
    drawCard(cx, R.pat[i], x, y, s, R.tilt[i], sc, lift, lit, stampA, 0);
  }
  for (let i = 0; i < 8; i++) {   // 「ばっちり！」は 札の上に 重ねて 描く
    const ft = R.fb[i], p = ft != null ? (now - ft) / .9 : -1;
    if (p < 0 || p > 1) continue;
    const [x, y] = L.pos(i), fs = Math.max(16, s * .19) * back(clamp(p * 4));
    cx.save(); cx.globalAlpha = 1 - clamp((p - .6) / .4);
    cx.translate(x, y - s * .5 - p * s * .18); cx.rotate(-.08);
    text('ばっちり！', 0, 0, fs, '#ff6b8b', 'Mochiy Pop One', '#fffdf7');
    cx.restore();
  }
  // 「いってね」
  if (now >= R.sayT - R.d * 2 && now < R.sayT) text('せーの！', W / 2, L.top - Math.min(22, L.top * .2), Math.min(W * .05, 30), '#ff6b8b', 'Mochiy Pop One', '#fffdf7');

  // 下：きこえた ことば
  const by = H - L.bot / 2 - 4;
  if (!G.voice) text('こえなし モード（みるだけ）', W / 2, by, 15, '#4d5a73', 'M PLUS Rounded 1c');
  else {
    const fresh = now - G.heardT < 2.5 && G.heard;
    const label = fresh ? `🎤 ${G.heard}` : sayIdx >= 0 ? '🎤 きいてるよ…' : '';
    if (label) {
      cx.font = `800 16px "M PLUS Rounded 1c", sans-serif`;
      const w = Math.min(W - 32, cx.measureText(label).width + 36);
      cx.fillStyle = 'rgba(255,253,247,.92)'; roundRect(cx, W / 2 - w / 2, by - 18, w, 36, 18); cx.fill();
      cx.lineWidth = 3; cx.strokeStyle = INK; cx.stroke();
      text(label, W / 2, by + 1, 16, INK, 'M PLUS Rounded 1c');
    }
  }
}

// タイトル・えらぶ画面の かざり（ゆっくり ただよう札）
const DECO = Array.from({ length: 10 }, (_, i) => ({ id: Object.keys(ART)[i % 8], x: i % 2 ? .04 + Math.random() * .14 : .82 + Math.random() * .14, y: Math.random(), r: (Math.random() - .5) * .5, v: .2 + Math.random() * .3 }));
function drawDeco(now) {
  const s = Math.min(W, H) * .16;
  cx.globalAlpha = .55;
  DECO.forEach((d, i) => {
    const x = d.x * W, y = ((d.y * (H + s * 2) - now * d.v * 20) % (H + s * 2) + H + s * 2) % (H + s * 2) - s;
    drawCard(cx, d.id, x, y, s, d.r + Math.sin(now * .6 + i) * .08, 1, 0, false, 0, 0);
  });
  cx.globalAlpha = 1;
}
requestAnimationFrame(frame);
setInterval(() => Replay.tick(), 50);

// ================= 画面 =================
function show(id) { ['#title', '#select', '#result'].forEach(s => $(s).hidden = s !== id); }
function micDenied() { $('#selNote').innerHTML = '<span class="warn">マイクが つかえません。ブラウザの マイクを「許可」にしてね。</span>'; }

function buildStages() {
  const best = getBest();
  $('#stages').innerHTML = '';
  STAGES.forEach(st => {
    const b = document.createElement('button'); b.className = 'st'; b.id = 'st-' + st.id;
    const c = document.createElement('canvas'); c.width = 240; c.height = 120;
    const g = c.getContext('2d');
    const show2 = st.items.length > 2 ? ['tako', 'neko', 'ringo'] : st.items;
    show2.forEach((id, i) => { const n = show2.length, x = 120 + (i - (n - 1) / 2) * (n > 2 ? 74 : 92); drawCard(g, id, x, 62, 92 - n * 6, (i - .5) * .12, 1, 0, false, 0, 0); });
    b.appendChild(c);
    const nm = document.createElement('span'); nm.textContent = st.name; b.appendChild(nm);
    const bs = document.createElement('span'); bs.className = 'best'; bs.textContent = best[st.id] != null ? `さいこう ${best[st.id]}てん` : 'まだ あそんでない'; b.appendChild(bs);
    b.addEventListener('click', () => startStage(st));
    $('#stages').appendChild(b);
  });
}

$('#startBtn').addEventListener('click', () => {
  initAudio();
  G.voice = !!SR;
  Mic.open();
  if (SR) { Ear.start(); setTimeout(() => { if (G.scene !== 'play') Ear.stop(); }, 1500); }   // ここで マイクの許可を もらっておく
  G.scene = 'select'; buildStages();
  $('#selNote').textContent = SR ? '絵が ひかったら、その なまえを いってね。' : 'このブラウザは 声が つかえないので、見るだけ モードです。';
  show('#select');
});
$('#listenBtn').addEventListener('click', () => Replay.on ? Replay.stop() : Replay.start());
$('#againBtn').addEventListener('click', () => startStage(G.stage));
$('#backBtn').addEventListener('click', () => { Replay.stop(); G.scene = 'select'; buildStages(); show('#select'); });
$('#quit').addEventListener('click', () => { Ear.stop(); G.scene = 'select'; $('#quit').hidden = true; buildStages(); show('#select'); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.scene === 'play') $('#quit').click(); });

// 辞書（漢字 → よみ）。読めなくても かなだけで 遊べる
function ready() { const b = $('#startBtn'); b.disabled = false; b.textContent = 'はじめる'; $('#loadBar').hidden = true; }
if (!SR) $('#titleNote').innerHTML = '<span class="warn">このブラウザは 声の聞き取りに たいおう していません。</span><br>Chrome（PC・Android）か Safari（iPhone）で ひらいてね。';
(function loadDict() {
  if (!window.kuromoji) return ready();
  let done = 0;
  const send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function () {
    this.addEventListener('loadend', () => { $('#loadBar b').style.width = Math.min(100, ++done / 12 * 100) + '%'; });
    return send.apply(this, arguments);
  };
  kuromoji.builder({ dicPath: 'dict/' }).build((err, t) => {
    XMLHttpRequest.prototype.send = send;
    if (!err) tokenizer = t;
    ready();
  });
})();

// ================= 確認用 =================
const dbg = { auto: false };
if (DBG) {
  Object.assign(dbg, {
    say(text, loud = true) { if (loud) markVoice(clock() - (AC.outputLatency || 0) - .05); Ear.log.push({ t: clock(), text }); onHeard(); },
    Mic, Replay, totalScore,
    play(i = 0, auto = true) { dbg.auto = auto; initAudio(); startStage(STAGES[i]); },
    G, reading, tokenize, align, Ear,
  });
  window.dbg = dbg;
}
})();
</script>
</body>
