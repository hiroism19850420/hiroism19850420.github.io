<html lang="ja">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>なきごえ パンパン！｜声で答えるリズムゲーム</title>
<meta name="description" content="どうぶつの なきごえを、8分音符のリズムで 声で言うゲーム。ワン・ニャン・メー・ブー…">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#ffe6cc; --ink:#1d1d24; --paper:#fffdf8; --band:#ffd400; --red:#e60012; --sub:#6b5546; --green:#2fbf71;
  --pop:"Mochiy Pop One","M PLUS Rounded 1c",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c",system-ui,sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:16px;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-sizing:border-box;text-align:center}
.scr[hidden]{display:none!important}
.logo{font-family:var(--pop);font-size:clamp(24px,min(8vmin,7.4vw),76px);white-space:nowrap;line-height:1.1;margin:0;color:var(--ink);background:var(--band);padding:.15em .6em;border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);transform:rotate(-2deg)}
.logo b{color:var(--red);-webkit-text-stroke:0}
.kicker{font-family:var(--pop);font-size:clamp(14px,2.6vmin,20px);margin:0;color:var(--sub)}
.lead{margin:0;font-size:clamp(14px,2.5vmin,18px);line-height:1.75;font-weight:500;color:var(--sub)}
.btn{font-family:var(--pop);font-size:clamp(18px,3.6vmin,28px);color:var(--ink);background:var(--band);border:4px solid var(--ink);border-radius:999px;
  padding:.45em 1.6em;box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--red);outline-offset:4px}
.btn.sub{background:var(--paper);font-size:clamp(15px,2.8vmin,21px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.speed{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.speed button small{display:block;font-family:var(--body);font-weight:800;font-size:.72em;color:var(--sub)}
.speed button.sel{background:var(--red);color:#fff}
.speed button.sel small{color:#ffe3e6}
.speed button:focus-visible{outline:4px solid var(--red);outline-offset:3px}
.note{font-size:13px;color:var(--sub);margin:0;min-height:1.4em;line-height:1.6}
.warn{color:#c2334f;font-weight:800}

.big small{font-size:.36em;color:var(--ink);-webkit-text-stroke:0}
.praise{font-family:var(--pop);font-size:clamp(20px,4.4vmin,34px);margin:0}

  background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink);z-index:2}

.bar b{display:block;height:100%;width:0;background:var(--green);transition:width .2s}

<body>
<canvas id="cv"></canvas>

<section class="scr" id="title">
  <p class="kicker">声で こたえる リズムゲーム</p>
  <h1 class="logo">なきごえ <b>パンパン！</b></h1>
  <p class="lead">どうぶつが ならんだら、つぎは あなたの ばん。<br>上から じゅんに なきごえを、<b>タタタタ</b>っと リズムで いってね。</p>
  <div class="speed" id="speed">
    <button data-mode="easy" id="mdEasy">かんたん<small>1はくに 1こ・90</small></button>
    <button data-mode="slow" id="mdSlow">ゆっくり<small>8分音符・96</small></button>
    <button data-mode="normal" id="mdNormal" class="sel">ふつう<small>動画と おなじ・120</small></button>
    <button data-mode="fast" id="mdFast">はやい<small>リズムの たつじん</small></button>
  </div>
  <div class="speed" id="yomi">
    <button data-yomi="1" id="ymOn" class="sel">よみあり<small>なきごえが 横に でる</small></button>
    <button data-yomi="0" id="ymOff">絵だけ<small>絵を 見て こたえる</small></button>
  </div>
  <div class="bar" id="loadBar"><b></b></div>
  <button class="btn" id="startBtn" disabled>じゅんびちゅう…</button>
  <p class="note" id="titleNote">マイクを つかいます。Chrome か Safari で ひらいてね。</p>
</section>

<section class="scr" id="result" hidden>
  <h2 id="resTitle">けっか</h2>
  <p class="big" id="resScore">0<small>てん</small></p>
  <p class="praise" id="resPraise"></p>
  <p class="note" id="resSub"></p>
  <div id="rounds"></div>
  <button class="btn sub" id="listenBtn" hidden>▶ じぶんの こえを きく</button>
  <div class="row">
    <button class="btn" id="againBtn">もういちど</button>
    <button class="btn sub" id="backBtn">タイトルへ</button>
  </div>
</section>

<button id="quit" hidden>やめる</button>

// ================= 音 =================
let AC = null, master = null, noiseBuf = null;

  if (AC) { AC.resume(); return; }

  master = AC.createGain(); master.gain.value = .7; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);

const hz = m => 440 * Math.pow(2, (m - 69) / 12);

const kick = t => tone(t, 160, 'sine', .95, .26, .002, 45);
const clap = (t, v = 1) => { noise(t, .32 * v, .05, 1000, 'bandpass'); noise(t + .011, .28 * v, .05, 1100, 'bandpass'); noise(t + .022, .3 * v, .14, 1000, 'bandpass'); };

const POP = [72, 74, 76, 79, 81, 84, 86, 88];

// 8分音符ひとつぶ ごとの 音
function playEighth(ev) {
  const { t, g, e, ph, i } = ev, inBar = g % 8, beat = inBar % 2 === 0, bar = Math.floor(g / 8);
  if (ph === 'intro') {
    if (beat) kick(t);
    if (inBar === 4 || inBar === 6) clap(t, 1.3);   // パン！ パン！
    hat(t, inBar % 2 ? .12 : .06);
    return;
  }
  if (ph === 'end') {
    if (inBar === 0) { noise(t, .3, 1.2, 4000); [60, 64, 67, 72].forEach(m => tone(t, hz(m), 'square', .06, 1.2, .01)); kick(t); }
    return;
  }
  if (beat) kick(t);
  if (inBar === 2 || inBar === 6) clap(t);
  hat(t, inBar % 2 ? .13 : .06);
  const root = ROOTS[bar % 4];
  tone(t, hz(root + (inBar % 2 ? 12 : 0)), 'triangle', inBar % 2 ? .22 : .38, e * .9);
  if (ph === 'show' && i >= 0) tone(t, hz(POP[i]), 'sine', .26, .18);   // 絵が出る「ぽん」

// ================= 耳（音声認識） =================
const Ear = {
  on: false, rec: null, log: [],
  start() { if (!SR || this.on) return; this.on = true; this._go(); },
  _go() {
    if (!this.on) return;
    const rec = new SR(), map = {};
    rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        let en = map[i];
        if (!en) { en = map[i] = { t: clock(), text: '' }; this.log.push(en); }
        en.text = e.results[i][0].transcript;
      }
      onHeard();
    };
    rec.onerror = e => {
      if (e.error === 'audio-capture' && Mic.stream) { Mic.close(); return; }   // 録音と ぶつかる機種は 聞き取りを 優先
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { this.on = false; micDenied(); }
    };
    rec.onend = () => { if (this.rec === rec) this.rec = null; if (this.on) setTimeout(() => { if (this.on && !this.rec) this._go(); }, 80); };
    this.rec = rec;
    try { rec.start(); } catch (e) { this.rec = null; setTimeout(() => this._go(), 400); }
  },
  stop() { this.on = false; const r = this.rec; this.rec = null; try { r && r.abort(); } catch (e) {} },

// ================= マイク（声の出だし と 録音） =================
// 8分音符は 0.25秒。つづけて言っても 音の「出だし」を ひろえるよう、音量の上がり と 周波数の変化 の 両方を見る
const Mic = {
  stream: null, an: null, tbuf: null, fbuf: null, prev: null, floor: .01, level: 0, voiced: false, quietT: 0, lastOn: -1, fluxAvg: 0,

  async open() {

    this.stop();

    s.buffer = Mic.voiceBuf; g.gain.value = 1.8; s.connect(g); g.connect(master); s.start(t0);
    s.onended = () => { if (this.src === s) this.stop(); };

// ================= かな と 照合 =================
const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const kanaOnly = s => toHira(s).replace(/[^ぁ-ゖー]/g, '');
let tokenizer = null;

  if (!tokenizer) return kanaOnly(text);

  for (const tk of tokenizer.tokenize(text)) out += (tk.reading && tk.reading !== '*') ? tk.reading : tk.surface_form;
  return kanaOnly(out);
}
function tokenize(kana) {
  const forms = [];

  forms.sort((a, b) => b[0].length - a[0].length);
  const out = [];
  for (let i = 0; i < kana.length;) {
    const hit = forms.find(([f]) => kana.startsWith(f, i));

// ================= ゲーム =================
// 1かい＝2小節（8分音符16こ）。前の小節で 絵が 8分で ならび、うしろの小節で 同じリズムで なきごえを 言う
const G = { scene: 'title', mode: 'normal', yomi: true, bpm: 120, rounds: [], evs: [], ei: 0, endT: 0, voice: true, heard: '', heardT: 0 };
const clock = () => AC ? AC.currentTime : performance.now() / 1000;
const pick = a => a[Math.random() * a.length | 0];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function expand(ids) {   // 絵の ならび → 箱（またがる絵は 何こ ぶんにも なる）
  const out = [];
  ids.forEach(id => ITEMS[id].say.forEach((w, p) => out.push({ id, p, len: ITEMS[id].say.length, say: w, tok: ITEMS[id].tok[p] })));
  return out;
}
function makeRounds(m) {
  const easy = ['inu', 'neko', 'hitsuji', 'buta'];
  if (m.rows === 4) return [   // かんたん：4こ
    new Array(4).fill(pick(['inu', 'neko'])),
    Array.from({ length: 4 }, () => pick(easy)),
    ['kitsune', 'buta', 'kombu'],              // コン ブー コン ブ
    [pick(FOOD), 'wantan'],                    // ○○ ワン タン メン
  ].map(expand);
  return [
    new Array(5).fill(pick(['inu', 'neko'])),                // 1かいめ：ぜんぶ おなじ
    Array.from({ length: 5 }, () => pick(easy)),             // 2かいめ：4しゅるい まぜる
    ['kitsune', 'kitsune', 'buta', 'kombu'],                 // 3かいめ：コン コン ブー こんぶ（動画の オチ）
    shuffle([pick(ANIMAL_KEYS), 'men', 'nan', 'pan']).concat(['wantan']),   // 4かいめ：メン ナン パン … ワンタンメン
  ].map(expand);
}

function startGame() {
  initAudio();
  const m = MODES[G.mode], e = 60 / m.bpm / 2;
  G.scene = 'play'; G.m = m; G.bpm = m.bpm; G.e = e; G.sl = e * m.step; G.rounds = []; G.evs = []; G.ei = 0;
  let t = clock() + .5, g = 0;
  const push = (ph, r, i) => { G.evs.push({ t, g, e, ph, r, i }); t += e; g++; };
  G.introT = t;
  for (let k = 0; k < 8; k++) push('intro', -1, -1);
  makeRounds(m).forEach((slots, r) => {
    const R = { r, slots, n: slots.length, t0: t, showT: t, sayT: t + 8 * e, hit: new Set(), ok: {}, fb: {}, fbWord: {}, done: false };
    G.rounds.push(R);
    for (let k = 0; k < 16; k++) {
      const kk = k % 8, si = kk % m.step === 0 ? kk / m.step : -1;
      push(k < 8 ? 'show' : 'say', r, si >= 0 && si < R.n ? si : -1);
    }
  });
  G.clearT = t;
  for (let k = 0; k < 8; k++) push('end', -1, -1);
  G.endT = t;
  Ear.log.length = 0; Replay.stop();
  if (G.voice) { Ear.start(); Mic.recStart(); }
  show(null); $('#quit').hidden = false;
}

const PRAISE = { 'ばっちり！': '#e60012', 'いいね！': '#ff7a00', 'ナイス！': '#1f8fe0' };
function fill(R, i, t, word) {   // 声が出た瞬間に こたえの箱を うめる（音は ならさない）
  if (R.fb[i] != null) return;
  R.fb[i] = t; R.fbWord[i] = word;
}
function markVoice(t, onset) {   // 声を いちばん近い 8分の箱へ（前0.4・後0.6 ぶんまで 許す）
  if (G.scene !== 'play') return;
  for (const R of G.rounds) {
    const x = (t - R.sayT) / G.sl, j = Math.floor(x + .4);
    if (j < 0 || j >= R.n || R.ok[j] != null) continue;
    if (!onset && Math.abs(x - j) > .3) continue;   // 声が のびているだけ のときは 箱の まんなか近くだけ
    const off = Math.abs(x - j - .05 / G.sl);       // マイクの おくれ（0.05秒）を 引いた ずれ
    const word = !onset ? 'いいね！' : off < .3 ? 'ばっちり！' : off < .45 ? 'いいね！' : 'ナイス！';
    R.ok[j] = t; fill(R, j, t, word);
  }
}
function judge(R, now) {
  const from = R.sayT - G.e * 2, to = R.sayT + 8 * G.e + 1.6;
  const txt = Ear.log.filter(en => en.t >= from && en.t < to).map(en => en.text).join(' ');
  const got = tokenize(reading(txt)).slice(0, R.n + 4);
  align(R.slots.map(x => x.tok), got).forEach(i => { if (!R.hit.has(i)) { R.hit.add(i); fill(R, i, Math.max(now, R.sayT + i * G.sl), 'ばっちり！'); } });
  return txt;
}
function onHeard() {
  if (G.scene !== 'play') return;
  const now = clock();
  for (const R of G.rounds) if (!R.done && now >= R.sayT - G.e * 2 && now < R.sayT + 8 * G.e + 1.6) {
    const txt = judge(R, now);
    if (txt.trim()) { G.heard = txt.trim().slice(-20); G.heardT = now; }
  }

function cellPts(R, i) { const w = R.hit.has(i), v = R.ok[i] != null; return w && v ? 1 : w || v ? .85 : 0; }
function totalScore() {   // 総合得点（激アマ）
  let raw = 0, n = 0;
  G.rounds.forEach(R => { for (let i = 0; i < R.n; i++) { raw += cellPts(R, i); n++; } });
  const x = raw / n;
  return x <= 0 ? 0 : Math.min(100, Math.max(30, Math.round(100 * Math.pow(x, .55))));
}

function finish() {
  G.scene = 'result'; Ear.stop(); $('#quit').hidden = true;
  const per = G.rounds.map(R => Object.keys(R.fb).length), sum = per.reduce((a, b) => a + b, 0), max = G.rounds.reduce((a, R) => a + R.n, 0);
  const score = totalScore();
  $('#resTitle').textContent = `${G.m.name}（${G.m.bpm}）・${G.yomi ? 'よみあり' : '絵だけ'}`;
  $('#resScore').innerHTML = G.voice || DBG ? `${score}<small>てん</small>` : '<small>みるだけ</small>';
  $('#resPraise').textContent = !G.voice ? 'こえなしで みたよ' : score >= 100 ? 'まんてん！ リズムの かみさま！' : score >= 90 ? 'ばっちり！ リズム かんぺき！' : score >= 75 ? 'すごい！ ノリノリだね！' : score >= 50 ? 'いいね！ そのちょうし！' : 'たのしかったね！ もういっかい！';
  $('#resSub').textContent = G.voice || DBG ? `いえた かず ${sum} / ${max}` : '';
  $('#rounds').innerHTML = per.map((n, i) => `<span class="${n === G.rounds[i].n ? 'full' : ''}">${i + 1}かいめ ${n}/${G.rounds[i].n}</span>`).join('');
  const lb = $('#listenBtn');
  lb.hidden = !Mic.rec; lb.disabled = true; lb.textContent = 'ろくおんを じゅんびちゅう…';
  Mic.recStop().then(buf => { lb.hidden = !buf; lb.disabled = false; lb.textContent = '▶ じぶんの こえを きく'; });
  show('#result');
}

// ================= 描画 =================
const cv = $('#cv'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
addEventListener('resize', resize); resize();
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, r)) : c.rect(x, y, w, h); }
function text(str, x, y, size, col = INK, font = 'Mochiy Pop One', stroke, sw = .2) {
  cx.font = `${size}px "${font}", "M PLUS Rounded 1c", sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  if (stroke) { cx.lineWidth = size * sw; cx.strokeStyle = stroke; cx.lineJoin = 'round'; cx.strokeText(str, x, y); }
  cx.fillStyle = col; cx.fillText(str, x, y);
}
function drawPic(c, id, x, y, w, h, sc = 1) {   // 絵の札（写真の かわりに 色つきの 背景）。たて長の札は 絵を まんなかに
  c.save(); c.translate(x, y); c.scale(sc, sc);
  c.fillStyle = 'rgba(29,29,36,.2)'; rr(c, -w / 2 + 3, -h / 2 + 5, w, h, Math.min(w, h) * .12); c.fill();
  const rad = Math.min(w, h) * .12;
  c.fillStyle = ITEMS[id].bg; rr(c, -w / 2, -h / 2, w, h, rad); c.fill();
  c.lineWidth = Math.max(2.5, Math.min(w, h) * .045); c.strokeStyle = INK; c.stroke();
  c.save(); rr(c, -w / 2, -h / 2, w, h, rad); c.clip();
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(-w * .25, h * .5, w * .5, Math.min(h, w) * .35, 0, 0, 7); c.fill();
  const k = Math.min(h, w / 1.3) / 104 * (h > w ? 1.3 : 1); c.scale(k, k); ART[id](c);
  c.restore(); c.restore();
}

function drawBg(now, pulse) {
  cx.fillStyle = '#ffe6cc'; cx.fillRect(0, 0, W, H);
  cx.fillStyle = 'rgba(255,170,110,.18)';
  const s = 34;
  for (let y = 0; y < H + s; y += s) for (let x = (y / s % 2) * s / 2; x < W + s; x += s) { cx.beginPath(); cx.arc(x, y + (now * 10) % s, 3, 0, 7); cx.fill(); }
  if (pulse > 0) { cx.fillStyle = `rgba(255,255,255,${pulse * .22})`; cx.fillRect(0, 0, W, H); }
}

function layout() {
  const band = Math.max(54, Math.min(H * .1, 84));
  const top = band + 14, bot = Math.max(40, H * .07);
  const rows = G.m ? G.m.rows : 7;
  const rowH = Math.min((H - top - bot) / (rows + .3), rows < 5 ? 150 : 120, (W - 60) / 3.05), gap = rowH * .14;
  const picW = rowH * 1.3, boxW = rowH * 1.55, colW = picW + gap + boxW;
  const port = H > W;
  const x0 = port ? Math.max(26, (W - colW) / 2 - rowH * .25) : W / 2 - colW / 2;
  const top2 = rows < 5 ? top + Math.max(0, (H - top - bot - rows * (rowH + gap * .5)) / 2 - rowH * .3) : top;
  return { band, top: top2, rowH, gap, picW, boxW, colW, x0, port };
}

function frame() {
  requestAnimationFrame(frame);
  const now = clock() - (AC && AC.outputLatency || 0);
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.scene !== 'play') { drawBg(now, 0); drawDeco(now); return; }

  const ahead = clock() + .15;
  while (G.ei < G.evs.length && G.evs[G.ei].t < ahead) {
    const ev = G.evs[G.ei++];
    playEighth(ev);
    if (DBG && dbg.auto && ev.ph === 'say' && ev.i >= 0) { const R = G.rounds[ev.r]; setTimeout(() => dbg.say(R.slots[ev.i].say), (ev.t - clock()) * 1000 + 60); }
  }
  Mic.sample(now);
  for (const R of G.rounds) if (!R.done && now > R.sayT + 8 * G.e + 1.6) { judge(R, now); R.done = true; }
  if (now > G.endT + 1.6) { finish(); return; }

  const gi = Math.floor((now - G.introT) / G.e), ph = (now - G.introT) / G.e - gi;
  const pulse = gi >= 0 && gi % 2 === 0 ? Math.pow(1 - ph, 3) : 0;
  drawBg(now, pulse * .8);
  const L = layout();

  // 上の 帯
  cx.fillStyle = '#ffd400'; cx.fillRect(0, 0, W, L.band);
  cx.fillStyle = INK; cx.fillRect(0, L.band - 4, W, 4);
  text('なきごえ パンパン！', W / 2, L.band / 2 + 1, Math.min(L.band * .48, W * .062), INK, 'Mochiy Pop One', '#fff', .28);

  // いまの かい
  let R = null;
  for (const x of G.rounds) if (now >= x.t0 - G.e) R = x;
  if (!R) {   // はじまる前：パン！パン！
    const k = Math.floor((now - G.introT) / G.e);
    const msg = k < 4 ? 'よーい…' : 'パン！';
    const p = k >= 4 ? 1 - ((now - G.introT) / G.e - k) * .4 : 1;
    if (k >= 0) text(k >= 4 && k % 2 === 1 ? 'パン！' : msg, W / 2, H / 2, Math.min(W * .16, 120) * p, RED, 'Mochiy Pop One', '#fff', .22);
    return;
  }
  const inClear = now >= G.clearT;
  // 右上：なんかいめ
  const lab = `${R.r + 1}/${G.rounds.length}`, lw = Math.min(L.band * .9, 70);
  cx.fillStyle = INK; rr(cx, 12, L.band / 2 - lw * .3, lw, lw * .6, lw * .3); cx.fill();
  text(lab, 12 + lw / 2, L.band / 2 + 1, lw * .32, '#fff', 'Mochiy Pop One');

  // たての 列：左に 絵（またがる絵は 何行ぶんも のびる）、右に こたえの箱
  const S = G.sl, step = L.rowH + L.gap * .5, rowY = i => L.top + i * step + L.rowH / 2;
  const sayIdx = now >= R.sayT && now < R.sayT + R.n * S ? Math.floor((now - R.sayT) / S) : -1;
  const pops = [];   // 箱より 上に 描く「ワンタンメン！」
  R.slots.forEach((sl, i) => {
    if (sl.p !== 0) return;
    const a = clamp((now - (R.showT + i * S)) / .16);
    if (a <= 0) return;
    const y1 = rowY(i) - L.rowH / 2, y2 = rowY(i + sl.len - 1) + L.rowH / 2, px = L.x0 + L.picW / 2;
    const lit = sayIdx >= i && sayIdx < i + sl.len;
    if (lit) { cx.fillStyle = '#ffd400'; rr(cx, L.x0 - 6, y1 - 6, L.picW + 12, y2 - y1 + 12, L.rowH * .16); cx.fill(); }
    drawPic(cx, sl.id, px, (y1 + y2) / 2, L.picW, y2 - y1, back(a) * (lit ? 1.04 : 1));
    if (sl.len > 1) {   // ぜんぶ 言えたら 名前が でる
      let last = 0;
      for (let k = 0; k < sl.len; k++) { const f = R.fb[i + k]; last = f == null ? Infinity : Math.max(last, f); }
      if (now >= last) {
        const lb = ITEMS[sl.id].label, q = (now - last) / 1.3;
        text(lb, px, y2 - L.rowH * .2, Math.min(L.picW * .92 / lb.length, L.rowH * .26) * back(clamp((now - last) / .2)), RED, 'Mochiy Pop One', '#fff', .32);
        if (q < 1) pops.push({ lb, y: (y1 + y2) / 2, q });
      }
    }
  });
  for (let i = 0; i < R.n; i++) {
    const y = rowY(i), bx = L.x0 + L.picW + L.gap + L.boxW / 2, sw = R.slots[i].say, lit = i === sayIdx;
    const shown = now >= R.showT + i * S;
    const ft = R.fb[i];
    cx.fillStyle = ft != null ? '#fff' : 'rgba(255,255,255,.5)';
    rr(cx, bx - L.boxW / 2, y - L.rowH / 2, L.boxW, L.rowH, L.rowH * .08); cx.fill();
    const fs = Math.min(L.rowH * .5, L.boxW * .86 / sw.length);
    if (ft != null && now >= ft) {
      text(sw, bx, y + 2, fs * back(clamp((now - ft) / .14)), RED, 'Mochiy Pop One', '#fff', .3);
      const p = (now - ft) / .9;   // 「ばっちり！」は 箱の 右上に 出て、すっと きえる
      if (p < 1) {
        const wd = R.fbWord[i];
        cx.save(); cx.globalAlpha = 1 - clamp((p - .6) / .4);
        cx.translate(bx + L.boxW * .3, y - L.rowH * .42 - p * L.rowH * .2); cx.rotate(-.12);
        text(wd, 0, 0, Math.max(13, L.rowH * .24) * back(clamp(p * 4)), PRAISE[wd], 'Mochiy Pop One', '#fff', .3);
        cx.restore();
      }
    } else {
      if (G.yomi && shown) { cx.save(); cx.globalAlpha = .38; text(sw, bx, y + 2, fs * back(clamp((now - R.showT - i * S) / .16)), '#9a6b5a', 'Mochiy Pop One'); cx.restore(); }   // よみあり：よみを うすく
      if (lit) { cx.strokeStyle = RED; cx.lineWidth = 3; cx.setLineDash([6, 5]); rr(cx, bx - L.boxW / 2 + 3, y - L.rowH / 2 + 3, L.boxW - 6, L.rowH - 6, L.rowH * .08); cx.stroke(); cx.setLineDash([]); }
    }
  }
  pops.forEach(({ lb, y, q }) => {
    cx.save(); cx.globalAlpha = 1 - clamp((q - .7) / .3);
    cx.translate(L.x0 + L.colW / 2, y - q * L.rowH * .3); cx.rotate(-.1);
    text(lb, 0, 0, Math.min(L.colW * 1.1 / lb.length, 70) * back(clamp(q * 5)), '#fff', 'Mochiy Pop One', RED, .32);
    cx.restore();
  });
  if (sayIdx >= 0) {   // いまの 行を さす ▶
    const y = rowY(sayIdx), x = L.x0 - 10;
    cx.fillStyle = RED; cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - 13, y - 9); cx.lineTo(x - 13, y + 9); cx.closePath(); cx.fill();
  }
  // 小節の あいず：絵が出る間は「よく見て」、言う 直前に「せーの」
  const msgY = L.top + R.n * (L.rowH + L.gap * .5) + Math.min(24, L.rowH * .3);
  if (!inClear && now < R.sayT && now >= R.showT) text(now >= R.sayT - G.e * 2 ? 'せーの！' : 'よく 見て…', L.x0 + L.colW / 2, Math.min(msgY, H - 44), Math.min(26, L.rowH * .32), now >= R.sayT - G.e * 2 ? RED : '#6b5546', 'Mochiy Pop One', '#fff', .25);
  if (inClear) {
    const p = clamp((now - G.clearT) / .25);
    cx.save(); cx.translate(L.x0 + L.colW / 2, L.top + 3.5 * L.rowH); cx.rotate(-.12);
    text('CLEAR!!', 0, 0, Math.min(L.colW * .3, 110) * back(p), '#fff', 'Mochiy Pop One', RED, .3);
    cx.restore();
  }
  // 下：きこえた ことば
  if (G.voice) {
    const fresh = now - G.heardT < 2 && G.heard;
    if (fresh) text(`🎤 ${G.heard}`, W / 2, H - 14, 14, '#6b5546', 'M PLUS Rounded 1c');
  } else text('こえなし モード（みるだけ）', W / 2, H - 14, 12, '#6b5546', 'M PLUS Rounded 1c');
}

// タイトルの かざり
const DECO = Array.from({ length: 10 }, (_, i) => ({ id: KEYS[i % KEYS.length], x: i % 2 ? .03 + Math.random() * .14 : .83 + Math.random() * .14, y: Math.random(), r: (Math.random() - .5) * .4, v: .25 + Math.random() * .3 }));
function drawDeco(now) {
  const h = Math.min(W, H) * .13;
  cx.globalAlpha = .6;
  DECO.forEach((d, i) => {
    const y = ((d.y * (H + h * 2) - now * d.v * 22) % (H + h * 2) + H + h * 2) % (H + h * 2) - h;
    cx.save(); cx.translate(d.x * W, y); cx.rotate(d.r + Math.sin(now * .7 + i) * .08); drawPic(cx, d.id, 0, 0, h * 1.3, h); cx.restore();
  });
  cx.globalAlpha = 1;
}
requestAnimationFrame(frame);
setInterval(() => Replay.tick(), 50);

// ================= 画面 =================
function show(id) { ['#title', '#result'].forEach(s => $(s).hidden = s !== id); }
function micDenied() { $('#titleNote').innerHTML = '<span class="warn">マイクが つかえません。ブラウザの マイクを「許可」にしてね。</span>'; }

document.querySelectorAll('#yomi button').forEach(b => b.addEventListener('click', () => {
  G.yomi = b.dataset.yomi === '1';
  document.querySelectorAll('#yomi button').forEach(x => x.classList.toggle('sel', x === b));
}));
document.querySelectorAll('#speed button').forEach(b => b.addEventListener('click', () => {
  G.mode = b.dataset.mode;
  document.querySelectorAll('#speed button').forEach(x => x.classList.toggle('sel', x === b));
}));
$('#startBtn').addEventListener('click', () => {
  initAudio();
  G.voice = !!SR;
  Mic.open();
  startGame();
});
$('#listenBtn').addEventListener('click', () => Replay.on ? Replay.stop() : Replay.start());
$('#againBtn').addEventListener('click', () => startGame());
$('#backBtn').addEventListener('click', () => { Replay.stop(); G.scene = 'title'; show('#title'); });
$('#quit').addEventListener('click', () => { Ear.stop(); Mic.recStop(); G.scene = 'title'; $('#quit').hidden = true; show('#title'); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.scene === 'play') $('#quit').click(); });

function ready() { const b = $('#startBtn'); b.disabled = false; b.textContent = 'はじめる'; $('#loadBar').hidden = true; }
if (!SR) $('#titleNote').innerHTML = '<span class="warn">このブラウザは 声の聞き取りに たいおう していません。</span><br>Chrome（PC・Android）か Safari（iPhone）で ひらいてね。';
(function loadDict() {
  if (!window.kuromoji) return ready();
  let done = 0;
  const send = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function () {
    this.addEventListener('loadend', () => { $('#loadBar b').style.width = Math.min(100, ++done / 12 * 100) + '%'; });
    return send.apply(this, arguments);
  };
  kuromoji.builder({ dicPath: 'dict/' }).build((err, t) => {
    XMLHttpRequest.prototype.send = send;
    if (!err) tokenizer = t;
    ready();
  });
})();

// ================= 確認用 =================
const dbg = { auto: false, late: 0 };
if (DBG) {
  Object.assign(dbg, {
    say(text, loud = true) { if (loud) markVoice(clock() - (AC.outputLatency || 0) + dbg.late, true); Ear.log.push({ t: clock(), text }); onHeard(); },
    play(mode = 'normal', auto = true, yomi = true) { dbg.auto = auto; G.mode = mode; G.yomi = yomi; G.voice = false; initAudio(); startGame(); },
    now: () => clock(),
    sheet(ids = Object.keys(ITEMS), h = 60) { const c = document.createElement('canvas'); c.width = ids.length * h * 1.4 * 2; c.height = h * 1.2 * 2; c.style.cssText = `position:fixed;left:0;top:0;width:${ids.length * h * 1.4}px;height:${h * 1.2}px;z-index:9;background:#ffe6cc`; const g = c.getContext('2d'); g.scale(2, 2); ids.forEach((id, i) => drawPic(g, id, h * 1.4 * i + h * .7, h * .6, h * 1.26, h * .9)); document.body.appendChild(c); return c; },
    G, Mic, Replay, totalScore, mark: markVoice, reading, tokenize,
  });
  window.dbg = dbg;
}
})();
</script>
</body>
</html>
