<style>

}

  state = 'respawn'; resT = 0; resDone = false; misses++;
  sfx.miss(); showMsg('ミス！', .8, true);
  $('fade').classList.add('on');
}
function doRespawn() {
  const dd = P.d - 8;
  let cp = CPS[0]; for (const c of CPS) if (c.d <= dd) cp = c;
  placeAt(cp.d, cp.i); P.start = .5; P.inv = 1.2;
  lives = 3; drawHearts();
  resetObs(cp.d);
  if (cp.d >= CHASE_D) { drumOn = true; drumD = P.d - DR - 16; drum.visible = true; camS = 1; } else { drumOn = false; drum.visible = false; camS = 0; intense = false; }
  $('fade').classList.remove('on');
}
function knock(o, power = 1) {
  o.spent = true;
  const side = Math.sign(o.bx - P.x) || (Math.random() < .5 ? -1 : 1);
  o.fly = { v: new THREE.Vector3(side * (4 + Math.random() * 4) * power, (4 + Math.random() * 4) * power, -10 - 8 * power), w: new THREE.Vector3(Math.random() * 6, Math.random() * 6, Math.random() * 6).multiplyScalar(power), t: 0 };
}
function hitBy(o) {
  if (DBG && window.dbg.god) return;
  if (DBG) window.dbg.log.push({ d: +P.d.toFixed(2), x: +P.x.toFixed(2), y: +P.y.toFixed(2), cell: [P.col, P.row], t: o.t, cells: o.cells, at: obsRange(o).map(v => +v.toFixed(2)) });
  lives--; hits++; popHeart(); drawHearts(); sfx.hit(); shake = .35;
  fx(o.t === 'J' ? 'ドグシャァ！' : o.t === 'C' ? 'バリバリッ！' : 'ゴシャッ！', { size: 84, fill: o.t === 'C' ? '#ffe14a' : '#ff3b4e', sh: '#2b0f3a', oy: -70, life: .9 }); burst();
  emit(P.x, P.y + .6, -P.d - .4, ['#ffffff', '#ffd84a'], 12, 6, 4, .14, .45);
  if (lives <= 0) { die(); return; }
  P.inv = 1.4; P.stum = .5; P.spin = 1; knock(o, .8);
}
// マスの当たり：しょうがいぶつは 1マスの まん中から ±0.9、こちらは ±0.4
// 調べるのは 行き先のマスと、まだ近くにいる 出たマスだけ
function collide() {
  if (P.inv > 0) return;
  const near = (c, r) => Math.abs(P.x - COLX[c]) < 1.3 && Math.abs(P.y - ROWY[r]) < 1.3;
  for (const o of OBS) {
    if (o.spent) continue;
    const [a, b] = obsRange(o);
    if (b < P.d - .4 || a > P.d + .4) continue;
    for (const [c, r] of o.cells) {
      const mine = (c === P.col && r === P.row) || (c === P.pc && r === P.pr);
      if (mine && near(c, r)) { hitBy(o); return; }
    }
  }
}
function collectCans(dt) {
  for (const c of CANS) {
    if (c.got) { if (c.pop > 0) { c.pop -= dt; c.mesh.position.y += dt * 4; c.mesh.scale.setScalar(1 + (.35 - c.pop) * 3); if (c.pop <= 0) c.mesh.visible = false; } continue; }
    if (state === 'run' && Math.abs(c.d - P.d) < .9 && Math.abs(c.x - P.x) < 1 && Math.abs(c.y - P.y) < 1) {
      c.got = true; c.pop = .35; canGot++; setText('canN', String(canGot)); sfx.can();
      emit(c.x, c.y, -c.d, ['#ff7a1a', '#ffd84a', '#ffffff'], 6, 3, 3, .07, .4);
    }
  }
}
function stepPlayer(dt) {
  let v = vNom(P.d);
  if (state === 'goal') v = P.v * Math.max(0, 1 - dt * 2.2);
  else if (P.stum > 0) { P.stum -= dt; v *= .6; }
  P.start = Math.min(1, P.start + dt * 1.8);
  if (state !== 'goal') v *= .25 + .75 * smooth(P.start);
  P.v = v; P.d += v * dt;
  const k = Math.min(1, dt * (K > 1 ? 24 : 18));
  P.x += (COLX[P.col] - P.x) * k; P.y += (ROWY[P.row] - P.y) * k;
  if (P.spin > 0) P.spin = Math.max(0, P.spin - dt * 2);
}
function stepObs(dt) {
  for (const o of OBS) {
    if (o.t === 'J' && !o.spent) {
      if (!o.active) { o.td = o.meet + (o.meet - P.d) * .8; if (P.d > o.meet - 150) o.active = true; }
      else o.td -= .8 * vNom(o.meet) * dt;
      const [a, b] = obsRange(o); o.mesh.position.z = -(a + b) / 2;
    }
    if (o.fly) {
      o.fly.t += dt; o.fly.v.y -= 14 * dt;
      o.mesh.position.addScaledVector(o.fly.v, dt);
      o.mesh.rotation.x += o.fly.w.x * dt; o.mesh.rotation.y += o.fly.w.y * dt; o.mesh.rotation.z += o.fly.w.z * dt;
      if (o.fly.t > 2.5) o.mesh.visible = false;
      continue;
    }
    const [a] = obsRange(o);
    o.mesh.visible = a < P.d + 250 && a > P.d - 60;
    if (o.mesh.visible && o.anim) o.anim(clock, dt);
  }
  for (const c of CANS) if (!c.got) { c.mesh.rotation.y += dt * 3; c.mesh.visible = c.d < P.d + 200 && c.d > P.d - 20; }
}
function stepDrum(dt) {
  if (!drumOn) {
    if (P.d >= CHASE_D && state === 'run') {
      drumOn = true; drumD = P.d - DR - 34; drum.visible = true; intense = true; showMsg('にげろ！', 1.1, true); shake = .25;
      fx('ドドドドド', { at: [innerWidth * .5, innerHeight * .72], ox: 0, oy: 0, size: 60, fill: '#c04dff', sh: '#2b0f3a', r: 6, dy: 0, life: 1.1 });
    } else return;
  }
  intense = state === 'run' || state === 'respawn';
  const over = state === 'goal' || state === 'result';
  const gap = P.d - (drumD + DR);
  let dv = vNom(P.d);
  if (over) dv = Math.max(0, drumV - 16 * dt);
  else if (gap > 11) dv += 9 * K;
  else if (P.stum > 0) dv = P.v + 6 * K;
  else if (gap < 7.5) dv -= 2.5 * K;
  if (state === 'respawn') dv = 0;
  drumV = dv; drumD += dv * dt; drumRot -= dv * dt / DR;
  const g2 = P.d - (drumD + DR);
  if (g2 < .3) {
    if (over || P.inv > 0 || (DBG && window.dbg.god)) { drumD = P.d - DR - .3; if (over) drumV = 0; }
    else { shake = .5; sfx.hit(); fx('ドグシャァ！', { size: 84, fill: '#ff3b4e', sh: '#2b0f3a', oy: -70, life: .9 }); die(); }
  }
  for (const o of OBS) {
    if (o.spent || o.t === 'J') continue;
    const [a, b] = obsRange(o);
    if (b > drumD - DR && a < drumD + DR) { knock(o, 1.6); sfx.smash(); shake = Math.max(shake, .2); }
  }
  drum.position.set(0, MIDY + Math.sin(clock * 3) * .15, -drumD); roll.rotation.x = drumRot;
  for (const f of flames) f.scale.set(1, .7 + Math.random() * .6, 1);
  if (rumbleG) rumbleG.gain.value = state === 'run' ? clamp(1 - g2 / 18, 0, 1) * .5 : 0;
  // ゴゴゴ…は 近いほど濃く
  $('gogo').style.opacity = (state === 'run' || state === 'respawn') ? clamp(1.25 - g2 / 14, .55, 1) : 0;
}
function stepGhost() {
  if (!best || !best.trace || state === 'title') { ghost.root.visible = false; $('ghostDot').hidden = true; return; }
  const f = runT / .1, i = Math.floor(f), tr = best.trace;
  if (i >= tr.length - 1) { ghost.root.visible = false; $('ghostDot').style.left = '100%'; return; }
  const a = tr[i], b = tr[i + 1], k = f - i;
  const d = lerp(a[0], b[0], k), x = lerp(a[1], b[1], k), y = lerp(a[2], b[2], k);
  ghost.root.visible = a[3] !== 3 && Math.abs(d - P.d) > 1.5;
  ghost.root.position.set(x, y - .3, -d + .95);
  $('ghostDot').hidden = false; $('ghostDot').style.left = clamp(d / GOAL * 100, 0, 100) + '%';
  applyPose(ghost, POSE.fly(clock), 1 / 60);
}
function updateCam(dt) {
  const want = (state !== 'title' && P.d >= CHASE_D - 2) ? 1 : 0;
  camS = clamp(camS + (want ? dt / 1.3 : -dt / .5), 0, 1);
  const s = smooth(camS), ang = s * Math.PI;
  const portrait = innerWidth < innerHeight;
  const dist = (portrait ? 10.6 : 7.6) - s * .4;
  // 低めの ななめうしろから 見ると、水平に とんでいる形が よく見える
  const h = MIDY + lerp(portrait ? 1.6 : 1.15, .9, s) + (P.y - MIDY) * .35;
  const fz = -P.d;
  cam.position.set(P.x * .38 + Math.sin(ang) * dist * .7 + (1 - s) * .9, h, fz + Math.cos(ang) * dist);
  cam.lookAt(P.x * .42, MIDY - .15 + (P.y - MIDY) * .45, fz + lerp(-12, 6, s));
  if (DBG && window.dbg?.camOff) { const o = window.dbg.camOff; cam.position.set(P.x + o[0], P.y + o[1], fz + o[2]); cam.lookAt(P.x, P.y, fz); }
  if (shake > 0) { shake -= dt; const a = shake * .5; cam.position.x += (Math.random() - .5) * a; cam.position.y += (Math.random() - .5) * a; }
  fovKick *= Math.exp(-dt * 6);
  const fov = (portrait ? 74 : 62) + (state === 'run' ? clamp((P.v - 15) * .4, 0, 8) : 0) + fovKick;
  if (Math.abs(cam.fov - fov) > .05) { cam.fov = lerp(cam.fov, fov, Math.min(1, dt * 8)); cam.updateProjectionMatrix(); }
  sun.position.set(P.x - 6, 18, -P.d + 8); sun.target.position.set(P.x, 0, -P.d - 4);
  sunDisc.position.set(cam.position.x + 60, cam.position.y + 70, cam.position.z - 260 * (s > .5 ? -1 : 1)); sunDisc.lookAt(cam.position);
  sunGlow.position.copy(sunDisc.position); sunGlow.lookAt(cam.position);
}
// 6マスの目安：いまいるマスを明るく、追いかけっこでは あぶないマスに ✕
function updateGrid() {
  const on = state === 'run' || state === 'respawn';
  $('grid').classList.toggle('on', on);
  const showWarn = camS > .6 && state === 'run';
  // いちばん近い壁だけを見せる（2つ先の壁と まざらないように）
  let near = 1e9;
  if (showWarn) for (const o of OBS) { if (o.spent) continue; const dd = obsRange(o)[0] - P.d; if (dd > .5 && dd < near) near = dd; }
  gridEls.forEach((el, gi) => {
    let col = gi % 3; const row = gi < 3 ? 1 : 0;
    if (front()) col = 2 - col;
    el.classList.toggle('me', on && col === P.col && row === P.row);
    let bd = 1e9;
    if (showWarn) for (const o of OBS) {
      if (o.spent || !o.cells.some(([c, r]) => c === col && r === row)) continue;
      const [a] = obsRange(o), dd = a - P.d;
      if (dd > .5 && dd < 30 && dd < near + 4 && dd < bd) bd = dd;
    }
    el.lastElementChild.style.opacity = bd < 1e9 ? clamp(1.3 - bd / 30, .35, 1) : 0;
  });
}
function poseRunner(dt) {
  const r = runner;
  let tg;
  const up = state === 'title' || (state === 'goal' && P.v < 4) || state === 'result';
  if (state === 'title') tg = POSE.idle(clock);
  else if (up) tg = POSE.win(clock);
  else tg = POSE.fly(clock);
  applyPose(r, tg, dt);
  waveCape(r.cape, clock, up ? .35 : 1);
  const bob = Math.sin(clock * 3.2) * .08;
  // 体の まん中が マスの まん中に来るよう ずらす（立っているときと 水平のときで ちがう）
  const flat = clamp(-r.cur.bodyX / 1.4, 0, 1);
  r.root.position.set(P.x, P.y + bob + lerp(-.85, -.3, flat), -P.d + lerp(0, .95, flat));
  // 横へ動くときは 体をかたむけ、上下へ動くときは 頭を上げ下げする
  r.root.rotation.set(clamp((ROWY[P.row] - P.y) * .16, -.4, .4), 0, clamp((P.x - COLX[P.col]) * .2, -.55, .55) + P.spin * Math.PI * 2);
  r.root.visible = !(P.inv > 0 && state === 'run' && Math.sin(clock * 34) > .2);
  // 足もとから 飛行雲
  if (state === 'run' && Math.random() < dt * 40) emit(P.x + (Math.random() - .5) * .3, P.y - .1, -P.d + 1.6, '#ffffff', 1, .3, .1, .12, .5, 0);
}
function recordTrace(dt) {
  traceT += dt;
  while (traceT >= .1) {
    traceT -= .1;
    trace.push([+P.d.toFixed(2), +P.x.toFixed(2), +P.y.toFixed(2), state === 'respawn' ? 3 : 0]);
  }
}
function finish() {
  state = 'goal'; goalT = 0; bgmOn = false; intense = false; sfx.goal();
  showMsg('GOAL!', 1.4); burst(); $('gogo').style.opacity = 0;
  fx('バァ――ン！', { at: [innerWidth * .5, innerHeight * .26], ox: 0, oy: 0, size: 92, fill: '#ffb21a', sh: '#ff2f6a', r: -6, dy: -10, life: 1.6 });
  emit(P.x, P.y + 2, -P.d - 2, ['#ff7a1a', '#ffd84a', '#5fd7ff', '#ff3b4e', '#ffffff'], 40, 9, 8, .12, 1.6, -6);
}
function showResult() {
  state = 'result'; resultLock = .6;
  const isNew = !best || runT < best.time;
  if (isNew) { best = { time: runT, trace }; store.set(BEST_KEY(), best); showBest(); }
  const rank = misses === 0 && hits === 0 ? 'S' : misses === 0 ? 'A' : misses === 1 ? 'B' : 'C';
  $('rRank').textContent = rank;
  $('rTime').textContent = fmt(runT);
  $('rBest').textContent = isNew ? '' : 'ベスト ' + fmt(best.time) + '（+' + fmt(runT - best.time) + '）';
  $('rMode').textContent = MODE_NAME[MODE]; $('rMode').classList.toggle('n', MODE === 'normal');
  $('rNew').hidden = !isNew;
  $('rHit').textContent = hits; $('rMiss').textContent = misses; $('rCan').textContent = canGot + '/' + CANS.length;
  $('result').hidden = false;
  setTimeout(() => $('againBtn').focus({ preventScroll: true }), 50);
}

// ---------- ループ
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; clock += dt;
  if (state === 'run' || state === 'respawn') runT += dt;
  if (state === 'run' || state === 'goal') {
    // 速いときに うすい物を すり抜けないよう、細かく区切って進める
    const n = Math.max(1, Math.ceil(dt * 120)), h = dt / n;
    for (let i = 0; i < n && (state === 'run' || state === 'goal'); i++) {
      stepPlayer(h);
      if (P.inv > 0) P.inv -= h;
      if (state === 'run') { collide(); if (P.d >= GOAL) finish(); }
    }
  } else if (state === 'respawn') {
    resT += dt;
    if (resT > .45 && !resDone) { resDone = true; doRespawn(); }
    if (resT > .8) state = 'run';
  }
  if (state === 'run' || state === 'respawn') recordTrace(dt);
  if (state === 'goal') { goalT += dt; if (goalT > 2.0) showResult(); }
  if (state === 'result') resultLock -= dt;
  stepObs(dt);
  if (state !== 'title') { collectCans(dt); stepDrum(dt); }
  if (!drumOn && $('gogo').style.opacity !== '0') $('gogo').style.opacity = 0;
  stepGhost();
  poseRunner(dt);
  updateParts(dt);
  updateCam(dt);
  updateGrid();
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) $('msg').classList.remove('on'); }
  setText('time', fmt(runT));
  $('meDot').style.left = clamp(P.d / GOAL * 100, 0, 100) + '%';
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
resetObs(-999);
requestAnimationFrame(frame);

if (DBG) {
  window.dbg = {
    god: false, P, OBS, CANS, COLX, ROWY, range: obsRange, log: [], runner,
    get state() { return state; },
    get camS() { return camS; },
    setMode,
    get stats() { return { runT: +runT.toFixed(2), hits, misses, canGot, cans: CANS.length, lives, drumGap: drumOn ? +(P.d - drumD - DR).toFixed(2) : null }; },
    go(d, i = 4) { if (state === 'title' || state === 'result') startRun(); placeAt(d, i); P.start = 1; resetObs(d); if (d >= CHASE_D) { drumOn = true; drumD = d - DR - 10; drum.visible = true; camS = 1; } return P; },
    act,
  };
}
</script>
