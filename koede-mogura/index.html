// かならず タップの中から、await より前に 呼ぶ（スマホは タップの直後でないと マイクを ことわる）
async function startMic() {
  micState = 'asking'; micErr = ''; micMsg = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { micState = 'denied'; micErr = 'nosupport'; return; }
  const ask = navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: false } });
  let stream;
  try { stream = await ask; }
  catch (e) { console.warn(e); micState = 'denied'; micErr = e && e.name || 'error'; micMsg = e && e.message || ''; return; }
  // マイクは とれた。ここから先で 失敗しても、別のやり方で 音を読む
  try { if (ac.state !== 'running') ac.resume(); } catch (e) {}
  let src;
  try { src = ac.createMediaStreamSource(stream); }
  catch (e) {
    // 音の周波数が マイクと ちがうと ことわられることがある → マイクに合わせて 作りなおす
    console.warn(e);
    try {
      const rate = stream.getAudioTracks()[0].getSettings().sampleRate;
      try { ac.close(); } catch (e3) {}
      makeAudio(rate);
      src = ac.createMediaStreamSource(stream);
    } catch (e2) { console.warn(e2); micState = 'denied'; micErr = e2.name || 'error'; micMsg = e2.message || ''; return; }
  }
  try {
    const sp = ac.createScriptProcessor(512, 1, 1);
    const zero = ac.createGain(); zero.gain.value = 0;
    src.connect(sp); sp.connect(zero); zero.connect(ac.destination);
    sp.onaudioprocess = e => {
      const d = e.inputBuffer.getChannelData(0); let s = 0;
      for (let i = 0; i < d.length; i++) s += d[i] * d[i];
      feed(Math.sqrt(s / d.length), ac.currentTime - TUNE.micLat);
    };
    mic = { stream, sp };
  } catch (e) {
    // ScriptProcessor が つかえないときは Analyser を 10ミリ秒ごとに 読む
    console.warn(e);
    const an = ac.createAnalyser(); an.fftSize = 512; src.connect(an);
    const buf = new Float32Array(an.fftSize);
    setInterval(() => { an.getFloatTimeDomainData(buf); let q = 0; for (let i = 0; i < buf.length; i++) q += buf[i] * buf[i]; feed(Math.sqrt(q / buf.length), ac.currentTime - TUNE.micLat); }, 10);
    mic = { stream, an };
  }
  micState = 'on';
}
// 声の区切りを見つける（大きさだけで判定。ことばは聞き取らない）
function feed(rms, t) {
  level = rms;
  const on = Math.max(TUNE.onMin, floorLv * 4), off = on * 0.6;
  if (!voiced) {
    floorLv += (Math.min(rms, 0.05) - floorLv) * 0.02;
    if (rms > on) { voiced = true; quietSince = 0; segs.push({ t0: t, t1: 0, peak: rms }); }
  } else {
    const s = segs[segs.length - 1]; s.peak = Math.max(s.peak, rms);
    if (rms < off) { if (!quietSince) quietSince = t; if (t - quietSince > 0.12) { voiced = false; s.t1 = quietSince; } }
    else quietSince = 0;
  }
  if (segs.length > 60) segs.shift();
}
// タップで遊ぶとき（マイクなし）：おしたら声、はなしたら おわり。長おしで「のばす」
function tapDown(t) { if (voiced) return; voiced = true; segs.push({ t0: t, t1: 0, peak: 1, tap: true }); level = 0.2; }
function tapUp(t) { if (!voiced) return; voiced = false; segs[segs.length - 1].t1 = t; level = 0; }

// ===== 状態 =====
let scene = 'title'; // title / check / play / result
let st = null, plan = [], t0 = 0, spb = 0.65, evs = [], evI = 0, endTime = 0, nextBeat = 0;
let result = { p: 0, o: 0, x: 0, pts: 0 };
let buttons = [], resultAt = 0, checkAt = 0;
let best = {}; try { best = JSON.parse(localStorage.getItem('koedemogura_best') || '{}'); } catch (e) {}
const dbg = location.search.includes('dbg') ? (window.dbg = { auto: false, start: i => startStage(i), get state() { return { scene, result, micState, segs: segs.length }; }, get plan() { return plan; }, now: () => now(), TUNE }) : null;
function now() { return ac ? ac.currentTime : performance.now() / 1000; }

function startStage(i) {
  st = STAGES[i]; st.i = i; spb = 60 / st.bpm;
  t0 = now() + 0.5 + LEAD * spb;
  plan = []; evs = []; evI = 0; nextBeat = 0;
  result = { p: 0, o: 0, x: 0, pts: 0 };
  st.rounds.forEach(([types, sp], r) => {
    const base = t0 + r * ROUND_BEATS * spb, times = SPACING[sp].map(b => base + b * spb);
    const moles = [...types].map((k, m) => ({ k, t: times[m], dur: 0 }));
    const last = moles[3].k;
    const R = { r, base, moles, you: { t: times[4], expect: last === 'z' ? 'q' : last }, sp, res: null, seg: null, end: base + ROUND_BEATS * spb };
    plan.push(R);
    // 歌の声（make_sing.py）は 歌いだしの前に SING_REST の休みがあるので、その分 早く鳴らす。半拍ずつの回は 倍のテンポの声
    const vb = st.bpm * (sp === 'e' ? 2 : 1);
    moles.forEach((m, j) => evs.push({ t: m.t - SING_REST, f: () => {
      if (m.k === 'z') m.dur = voice(m.t, 'z' + j, 0.6);
      else m.dur = Math.max(0.15, voice(m.t - SING_REST, m.k + j + '_' + vb, 1) - SING_REST - SING_TAIL);
      SND.pop(m.t);
    } }));
  });
  for (let k = 0; k < LEAD; k++) { const tt = t0 - (LEAD - k) * spb; evs.push({ t: tt, f: () => SND.count(tt, k === 0) }); }
  evs.sort((a, b) => a.t - b.t);
  endTime = t0 + st.rounds.length * ROUND_BEATS * spb;
  segs = [];
  scene = 'play';
}

function schedule() {
  const ahead = now() + 0.15;
  while (evI < evs.length && evs[evI].t < ahead) { const e = evs[evI++]; if (e.t > now() - 0.05) e.f(); }
  const total = st.rounds.length * ROUND_BEATS;
  // ドラム：4つ打ちのキック、2・4拍目にスネアと手拍子、うら拍にオープンハット。回のおわりはフィルで あおって、つぎの回の頭でシンバル
  while (nextBeat < total && t0 + nextBeat * spb < ahead) {
    const t = t0 + nextBeat * spb, rb = nextBeat % ROUND_BEATS, h = spb / 2, q = spb / 4;
    const ci = Math.floor(nextBeat / 2) % 4, root = BASS[ci];
    const last = nextBeat >= total - ROUND_BEATS;
    if (rb === 0) SND.crash(t, nextBeat === 0 ? 1.2 : 0.8);
    if (rb < 7) {
      SND.kick(t);
      if (rb % 2 === 1) { SND.snare(t); SND.clap(t); }
      if (rb === 2 || rb === 5) SND.kick(t + h + q, 0.6);
      SND.hat(t, 0.05); SND.ohat(t + h, 0.07); SND.hat(t + h + q, 0.03);
    } else if (!last) {
      // フィル：スネア 16分 → タム
      SND.kick(t);
      SND.snare(t, 0.5); SND.snare(t + q, 0.65); SND.tom(t + h, 220); SND.tom(t + h + q, 150);
    } else { SND.kick(t); SND.crash(t, 1.3); }
    // ベース（8分で はずむ）とコードのきざみ
    osc('triangle', root, t, 0.004, h * 0.8, 0.26); osc('triangle', root * 2, t + h, 0.004, h * 0.7, 0.18);
    SND.stab(t + h, CHORD[ci]);
    nextBeat++;
  }
}

// 聞きはじめる時刻。すぐ上の もぐらの声を 拾わないよう、その声のあとから（ただし 拍の0.1秒前には かならず聞く）
function windowFrom(R) {
  const T = R.you.t, m = R.moles[3];
  const lastEnd = m.t + (m.k === 'z' ? 0 : m.dur || 0.3);
  return Math.min(Math.max(T - TUNE.ok, lastEnd + 0.04), T - 0.1);
}
// あなたの番を 判定する
function judge(R, t) {
  const T = R.you.t, ex = R.you.expect;
  const from = windowFrom(R);
  // 激アマ：少し早く言いはじめて 拍をまたいでいる声も みとめる
  const s = segs.find(s => s.t0 >= from && s.t0 <= T + TUNE.ok) || (ex !== 'q' && segs.find(s => s.t0 > T - 0.9 && s.t0 < from && (!s.t1 || s.t1 > T - 0.05)));
  if (ex === 'q') {
    const bad = segs.find(s => s.t0 >= from && s.t0 <= T + 0.5);
    if (bad) return { kind: 'x', text: 'しーっ！', sub: 'ねてたよ', seg: bad };
    return { kind: 'p', text: 'えらい！', sub: 'だまれた' };
  }
  if (!s) return { kind: 'x', text: 'スカッ', sub: '' };
  if (ex === 'l' && t < s.t0 + TUNE.longSec + 0.05 && !s.t1) return null; // まだ のばしている
  const dt = s.t0 - T;
  const len = (s.t1 || t) - s.t0;
  // 言い方が ちがっても 減点しない（ひとことだけ 出す）
  let sub = ex === 'b' ? 'おおごえ！' : ex === 'l' ? 'のびのび' : '';
  if (ex === 'b' && !s.tap && s.peak < peakLoud) sub = 'もっと おおきくても いいよ';
  if (ex === 'l' && len < TUNE.longSec) sub = 'もっと のばしても いいよ';
  if (Math.abs(dt) <= TUNE.perfect || s.t0 < from) return { kind: 'p', text: 'ピッタリ！', sub, seg: s };
  return { kind: 'o', text: dt < 0 ? 'はやい' : 'おそい', sub: '', seg: s };
}

function update() {
  if (scene !== 'play') return;
  const t = now();
  schedule();
  for (const R of plan) {
    const T = R.you.t;
    if (dbg && dbg.auto && !R.autoDone && t >= T && R.you.expect !== 'q') {
      R.autoDone = true;
      const len = R.you.expect === 'l' ? 0.8 : 0.35;
      segs.push({ t0: T + (Math.random() - 0.5) * 0.06, t1: T + len, peak: R.you.expect === 'b' ? 1 : 0.06 });
    }
    if (R.res) continue;
    const wait = R.you.expect === 'l' ? TUNE.longSec + 0.4 : R.you.expect === 'q' ? 0.55 : TUNE.ok + 0.05;
    // ふつう・おおごえは、声が きこえたら すぐ判定する
    const early = (R.you.expect === 'n' || R.you.expect === 'b') && segs.find(s => s.t0 >= windowFrom(R) && s.t0 <= T + TUNE.ok && t > s.t0 + 0.15);
    if (t < T + wait && !early) continue;
    const j = judge(R, t); if (!j) continue;
    R.res = j; R.resAt = t;
    if (j.kind === 'p') { result.p++; result.pts += 100; SND.good(ac.currentTime); }
    else if (j.kind === 'o') { result.o++; result.pts += 60; SND.wood(ac.currentTime, 600); }
    else { result.x++; j.text === 'しーっ！' ? SND.shh(ac.currentTime) : SND.bad(ac.currentTime); }
  }
  if (t > endTime + 0.4) {
    scene = 'result'; resultAt = t;
    const sc = score();
    if (!(best[st.name] >= sc)) { best[st.name] = sc; try { localStorage.setItem('koedemogura_best', JSON.stringify(best)); } catch (e) {} }
    SND.fanfare(ac.currentTime + 0.1, sc >= 70);
  }
}
function score() { return Math.round(result.pts / plan.length); }

// ===== 入力 =====
function toLocal(e) { return { x: (e.clientX - ox) / scale, y: (e.clientY - oy) / scale }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = toLocal(e);
  ensureAudio();
  if (scene === 'play') { if (micState === 'tap') tapDown(now()); return; }
  for (const b of buttons) if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) { b.fn(); return; }
});
addEventListener('pointerup', () => { if (scene === 'play' && micState === 'tap') tapUp(now()); });
addEventListener('keydown', async e => {
  if (e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); await ensureAudio(); if (scene === 'play' && micState === 'tap') tapDown(now()); }
  if (e.code === 'Escape' && scene === 'play') scene = 'title';
});
addEventListener('keyup', e => { if (e.code === 'Space' && scene === 'play' && micState === 'tap') tapUp(now()); });

function goCheck(i) {
  st = STAGES[i]; st.i = i;
  if (micState === 'on') { startStage(i); return; }
  scene = 'check'; checkAt = now(); normalPeak = 0; segs = [];
  if (micState !== 'tap') startMic();
}
const MIC_ERR = {
  NotAllowedError: ['マイクが ゆるされていません', 'アドレスバーの 🔒 や 設定から', 'このページの マイクを「許可」にしてね'],
  SecurityError: ['マイクが ゆるされていません', 'アドレスバーの 🔒 や 設定から', 'このページの マイクを「許可」にしてね'],
  NotFoundError: ['マイクが みつかりません', 'マイクや イヤホンを つないでね', ''],
  NotReadableError: ['マイクを ほかのアプリが つかっています', '通話や 録音アプリを とじてね', ''],
  nosupport: ['この ブラウザでは マイクが つかえません', 'LINE などの アプリの中で ひらいたときは', 'Safari か Chrome で ひらいてね'],
};

// ===== 描画 =====
let bg = null;
function makeBg() {
  bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const p = bg.getContext('2d');
  const sky = p.createLinearGradient(0, 0, 0, 200); sky.addColorStop(0, '#bfe6f5'); sky.addColorStop(1, '#e6f6dc');
  p.fillStyle = sky; p.fillRect(0, 0, W, 200);
  p.fillStyle = '#8fcf6a'; p.fillRect(0, 170, W, 40);
  for (let x = 0; x < W; x += 9) { p.fillStyle = x % 18 ? '#7dbf58' : '#a5dc80'; p.beginPath(); p.moveTo(x, 210); p.lineTo(x + 5, 168 + Math.random() * 14); p.lineTo(x + 10, 210); p.fill(); }
  const dirt = p.createLinearGradient(0, 205, 0, H); dirt.addColorStop(0, '#a87a52'); dirt.addColorStop(1, '#7c5636');
  p.fillStyle = dirt; p.fillRect(0, 205, W, H - 205);
  for (let i = 0; i < 260; i++) {
    p.fillStyle = `rgba(${Math.random() < 0.5 ? '60,35,15' : '230,200,160'},${0.08 + Math.random() * 0.1})`;
    p.beginPath(); p.ellipse(Math.random() * W, 215 + Math.random() * (H - 215), 2 + Math.random() * 5, 1.5 + Math.random() * 3, Math.random() * 3, 0, Math.PI * 2); p.fill();
  }
}
makeBg();
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function txt(s, x, y, size, col, align = 'center', weight = 800, stroke = null, sw = 0) {
  g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineWidth = sw || size / 5; g.strokeStyle = stroke; g.lineJoin = 'round'; g.strokeText(s, x, y); }
  g.fillStyle = col; g.fillText(s, x, y);
}
const ROW_Y = i => 300 + i * 118, HOLE_X = 96;

// もぐら1ぴき。up = 穴から出ている量(0〜1)、mouth = 口のあき、sleep = ねてる
function drawMole(i, up, mouth, sleep, label) {
  const M = MOLES[i], x = HOLE_X, y = ROW_Y(i);
  // 穴
  g.fillStyle = '#3a2516'; g.beginPath(); g.ellipse(x, y + 30, 58, 17, 0, 0, Math.PI * 2); g.fill();
  g.save(); g.beginPath(); g.rect(x - 80, y - 120, 160, 150); g.ellipse(x, y + 30, 58, 17, 0, 0, Math.PI); g.clip();
  const by = y + 38 - up * 74;
  g.lineWidth = 4; g.strokeStyle = INK;
  g.fillStyle = M.body; g.beginPath(); g.ellipse(x, by + 22, 44, 52, 0, Math.PI, 0); g.lineTo(x + 44, by + 80); g.lineTo(x - 44, by + 80); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = M.shade; g.beginPath(); g.ellipse(x, by + 46, 26, 22, 0, 0, Math.PI * 2); g.fill();
  // 目
  if (sleep) { g.lineWidth = 3.5; g.beginPath(); g.arc(x - 16, by + 2, 6, 0.2, Math.PI - 0.2); g.moveTo(x + 22, by + 2); g.arc(x + 16, by + 2, 6, 0.2, Math.PI - 0.2); g.stroke(); }
  else { g.fillStyle = INK; g.beginPath(); g.arc(x - 16, by + 2, 4.5, 0, Math.PI * 2); g.arc(x + 16, by + 2, 4.5, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x - 15, by + 0.5, 1.6, 0, Math.PI * 2); g.arc(x + 17, by + 0.5, 1.6, 0, Math.PI * 2); g.fill(); }
  // ほっぺ
  g.fillStyle = 'rgba(255,120,120,0.35)'; g.beginPath(); g.ellipse(x - 27, by + 16, 8, 5, 0, 0, Math.PI * 2); g.ellipse(x + 27, by + 16, 8, 5, 0, 0, Math.PI * 2); g.fill();
  // 鼻と口
  g.fillStyle = '#ff7f9c'; g.lineWidth = 3; g.beginPath(); g.ellipse(x, by + 14, 9, 7, 0, 0, Math.PI * 2); g.fill(); g.stroke();
  if (mouth > 0.05) { g.fillStyle = '#7a2f2f'; g.beginPath(); g.ellipse(x, by + 30, 7 + mouth * 4, 3 + mouth * 9, 0, 0, Math.PI * 2); g.fill(); g.stroke(); }
  else { g.beginPath(); g.moveTo(x - 7, by + 25); g.quadraticCurveTo(x - 3, by + 30, x, by + 25); g.quadraticCurveTo(x + 3, by + 30, x + 7, by + 25); g.stroke(); }
  // つめ
  g.fillStyle = '#fff4e6'; g.lineWidth = 3;
  for (const sx of [-1, 1]) { g.beginPath(); g.ellipse(x + sx * 34, by + 52, 12, 8, sx * 0.4, 0, Math.PI * 2); g.fill(); g.stroke(); }
  g.restore();
  // 穴のふち
  g.strokeStyle = '#5c3b22'; g.lineWidth = 5; g.beginPath(); g.ellipse(x, y + 30, 58, 17, 0, 0, Math.PI); g.stroke();
  if (label) { g.fillStyle = '#e8402e'; rr(x - 36, y + 44, 72, 28, 14); g.fill(); txt(label, x, y + 58, 17, '#fff'); }
}
// ふきだし
function drawBubble(i, word, kind, a, shake, me) {
  const y = ROW_Y(i), x = 170, w = 340, h = 86;
  g.save(); g.globalAlpha = a; g.translate(shake ? (Math.random() - 0.5) * 6 : 0, 0);
  g.fillStyle = me ? '#fff6ee' : '#fff'; g.strokeStyle = INK; g.lineWidth = 4;
  rr(x, y - h / 2 + 6, w, h, 22); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x + 2, y - 4); g.lineTo(x - 18, y + 8); g.lineTo(x + 2, y + 20); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = g.strokeStyle = 'transparent';
  const big = kind === 'b';
  const col = kind === 'z' ? '#9a9a9a' : me ? '#e8402e' : big ? '#e8402e' : INK;
  if (kind === 'l') { g.save(); g.translate(x + w / 2, y + 6); g.scale(1.18, 1); txt(word, 0, 0, 44, col); g.restore(); }
  else txt(word, x + w / 2, y + 6, big ? 56 : kind === 'z' ? 34 : 48, col);
  g.restore();
}

function drawTitleBar(sub) {
  g.fillStyle = '#ffd84a'; g.strokeStyle = INK; g.lineWidth = 5;
  rr(24, 28, W - 48, 120, 26); g.fill(); g.stroke();
  txt('こえで もぐら！', W / 2, 78, 50, INK);
  txt(sub, W / 2, 124, 20, '#6b4b2c', 'center', 500);
}

function drawPlay(t) {
  g.drawImage(bg, 0, 0);
  // 今の回
  let R = plan[0];
  for (const P of plan) if (t >= P.base - 0.25 * spb) R = P;
  const rIdx = R.r;
  drawTitleBar((st.name) + '　' + (rIdx + 1) + ' / ' + plan.length + '　すぐ上の もぐらと おなじに いおう');
  const fade = t > R.end - 0.6 * spb ? Math.max(0, (R.end - t) / (0.6 * spb)) : 1;
  for (let i = 0; i < 4; i++) {
    const m = R.moles[i], d = t - m.t;
    const said = d >= 0;
    // 出たあとは 拍に合わせて 体をはずませる（歌っている感じ）
    const bounce = m.k === 'z' ? 0 : 0.08 * Math.abs(Math.sin(Math.PI * (t - t0) / spb));
    const up = !said ? 0 : (Math.min(1, d / 0.07) - bounce) * (m.k === 'z' ? 0.8 : 1) * (0.3 + 0.7 * fade);
    const talking = said && d < (m.dur || 0.3);
    // 口は「も・ぐ・ら」の3つで ぱくぱく
    const syl = talking ? Math.abs(Math.sin(Math.PI * 3 * d / (m.dur || 0.3))) : 0;
    drawMole(i, up, talking ? 0.3 + 0.7 * syl : 0, m.k === 'z', '');
    if (said && m.k !== 'z' && d < (m.dur || 0.3) + 0.5) {
      // ♪ が ふわっと のぼる
      for (let k = 0; k < 2; k++) {
        const ph = Math.min(1, (d - k * 0.12) / 0.8); if (ph <= 0) continue;
        g.globalAlpha = (1 - ph) * fade;
        txt(k ? '♫' : '♪', HOLE_X - 44 + k * 20 + Math.sin(ph * 6 + i) * 8, ROW_Y(i) - 30 - ph * 50, 26, ['#e8402e', '#2f6fd0', '#d08a00', '#2f7d32'][i]);
        g.globalAlpha = 1;
      }
    }
    if (said) {
      drawBubble(i, WORD[m.k], m.k, fade, m.k === 'b' && d < 0.3, false);
      if (m.k === 'z') { for (let k = 0; k < 3; k++) { const ph = (t * 0.8 + k / 3) % 1; txt('z', HOLE_X + 40 + ph * 30, ROW_Y(i) - 40 - ph * 40, 16 + ph * 12, `rgba(80,80,120,${1 - ph})`); } }
    }
  }
  // あなた
  const T = R.you.t, myTurn = t > T - spb * 1.2 && t < T + 0.8;
  if (myTurn && !R.res) { g.fillStyle = `rgba(255,230,120,${0.35 + 0.25 * Math.sin(t * 14)})`; rr(16, ROW_Y(4) - 62, W - 32, 128, 24); g.fill(); }
  const mySeg = segs.length && voiced ? segs[segs.length - 1] : null;
  const speaking = mySeg && mySeg.t0 > T - TUNE.ok - 0.2;
  const shown = R.res && R.res.seg ? R.res.seg : (speaking ? mySeg : null);
  drawMole(4, shown || myTurn || R.res ? 1 * fade : 0.15, voiced ? Math.min(1, level * 12) : 0, false, 'あなた');
  if (shown) {
    const len = (shown.t1 || t) - shown.t0;
    const k = len >= TUNE.longSec ? 'l' : (!shown.tap && shown.peak >= peakLoud) ? 'b' : 'n';
    drawBubble(4, WORD[k], k, fade, k === 'b' && voiced, true);
  } else if (myTurn && !R.res && R.you.expect !== 'q' && t > T - spb * 0.5) {
    drawBubble(4, '？', 'n', 0.5, false, true);
  }
  // 判定
  if (R.res) {
    const d = t - R.resAt, col = R.res.kind === 'p' ? '#e8402e' : R.res.kind === 'o' ? '#2f7d32' : '#555';
    const y = ROW_Y(4) + 96 - Math.min(d, 0.2) * 60;
    g.globalAlpha = Math.min(1, fade * 3);
    txt(R.res.text, W / 2, y, 54, col, 'center', 800, '#fff', 10);
    if (R.res.sub) txt(R.res.sub, W / 2, y + 40, 22, '#fff', 'center', 800, INK, 6);
    g.globalAlpha = 1;
  }
  // カウント
  const cb = (t - t0) / spb;
  if (cb < 0) txt(cb < -3 ? 'よーい' : String(Math.ceil(-cb)), W / 2, ROW_Y(1) + 60, cb < -3 ? 60 : 110, '#fff', 'center', 800, INK, 12);
  drawMeter(t);
}
function drawMeter(t) {
  const y = H - 18;
  g.fillStyle = 'rgba(0,0,0,0.35)'; rr(30, y - 10, W - 60, 20, 10); g.fill();
  const v = micState === 'tap' ? (voiced ? 0.5 : 0) : Math.min(1, level * 8);
  g.fillStyle = voiced ? '#ffd84a' : '#9fd47f'; rr(30, y - 10, (W - 60) * v, 20, 10); g.fill();
  if (micState === 'on') { const lx = 30 + (W - 60) * Math.min(1, peakLoud * 8); g.fillStyle = '#e8402e'; g.fillRect(lx - 2, y - 14, 4, 28); }
  txt(micState === 'tap' ? 'タップ' : '🎤', 30, y - 26, 16, '#fff', 'left', 800);
}

function drawTitle(t) {
  g.drawImage(bg, 0, 0);
  drawTitleBar('もぐらと おなじに「もぐら」と いおう');
  buttons = [];
  for (let i = 0; i < 3; i++) {
    const ph = (t * 1.6 + i * 0.25) % 2.4, up = ph < 1 ? Math.sin(ph * Math.PI / 1) : 0;
    drawMole(i, 0.25 + up * 0.75, up > 0.6 ? 0.7 : 0, false, '');
  }
  const COL = [['#fff', INK, '#7b6a5a'], ['#ffd84a', INK, '#6b4b2c'], ['#3a2a1f', '#ffd84a', '#fff']];
  STAGES.forEach((S, i) => {
    const x = 196, y = ROW_Y(i) - 40, w = 300, h = 80, c = COL[i];
    g.fillStyle = c[0]; g.strokeStyle = INK; g.lineWidth = 4; rr(x, y, w, h, 22); g.fill(); g.stroke();
    txt(S.name, x + 24, y + 40, S.name.length > 4 ? 30 : 34, c[1], 'left');
    txt(best[S.name] !== undefined ? '★' + best[S.name] : 'BPM ' + S.bpm, x + w - 18, y + 40, 19, c[2], 'right', 500);
    buttons.push({ x, y, w, h, fn: () => goCheck(i) });
  });
  // マイクなし
  const x = 120, y = 612, w = 300, h = 56;
  g.fillStyle = micState === 'tap' ? '#ffd84a' : 'rgba(255,255,255,0.75)'; g.strokeStyle = INK; g.lineWidth = 3; rr(x, y, w, h, 18); g.fill(); g.stroke();
  txt(micState === 'tap' ? '✓ タップで あそぶ' : 'マイクなしで あそぶ', x + w / 2, y + 28, 22, INK);
  buttons.push({ x, y, w, h, fn: () => { micState = micState === 'tap' ? (mic ? 'on' : 'off') : 'tap'; } });
  // あそびかた
  const by = 690;
  g.fillStyle = 'rgba(255,255,255,0.88)'; g.strokeStyle = INK; g.lineWidth = 3; rr(30, by, W - 60, 214, 22); g.fill(); g.stroke();
  txt('すぐ上の もぐらと おなじに いおう', W / 2, by + 28, 21, INK);
  const lines = [['もぐら', INK, 'ふつうに「もぐら」'], ['もぐら！', '#e8402e', 'おおごえで「もぐら！」'], ['もぉ〜ぐら', INK, 'のばして「もぉ〜ぐら」'], ['すぴー…', '#9a9a9a', 'ねてたら だまる（むずかしい）']];
  lines.forEach(([a, c, b], k) => { const yy = by + 70 + k * 38; txt(a, 56, yy, 24, c, 'left'); txt('→ ' + b, 210, yy, 18, '#5a4634', 'left', 500); });
  txt('声：VOICEVOX 四国めたん・ずんだもん・春日部つむぎ・白上虎太郎', W / 2, H - 34, 14, '#fff', 'center', 500, INK, 4);
  if (micState === 'denied') txt('マイクが つかえません。「マイクなしで あそぶ」を おしてね', W / 2, H - 12, 17, '#fff', 'center', 800, INK, 5);
}

function drawCheck(t) {
  g.drawImage(bg, 0, 0);
  drawTitleBar('マイクの じゅんび');
  buttons = [];
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.strokeStyle = INK; g.lineWidth = 4; rr(30, 200, W - 60, 520, 26); g.fill(); g.stroke();
  if (micState === 'asking') { txt('マイクを つかって いい？', W / 2, 330, 30, INK); txt('画面の 「許可」を おしてね', W / 2, 380, 22, '#6b4b2c', 'center', 500); return; }
  if (micState === 'denied') {
    const m = MIC_ERR[micErr] || ['マイクが つかえませんでした', 'もういちど ためすか、', 'タップで あそんでね'];
    txt(m[0], W / 2, 300, 28, INK);
    txt(m[1], W / 2, 360, 21, '#6b4b2c', 'center', 500); txt(m[2], W / 2, 394, 21, '#6b4b2c', 'center', 500);
    txt('（' + micErr + (micMsg ? ': ' + micMsg.slice(0, 40) : '') + '）', W / 2, 440, 14, '#a09080', 'center', 500);
    const x = 120, y = 500, w = 300, h = 80;
    g.fillStyle = '#ffd84a'; g.strokeStyle = INK; g.lineWidth = 4; rr(x, y, w, h, 22); g.fill(); g.stroke();
    txt('もういちど ためす', x + w / 2, y + 40, 28, INK);
    buttons.push({ x, y, w, h, fn: () => { checkAt = now(); startMic(); } });
    txt('「はじめる」で タップあそびに なります', W / 2, 640, 18, '#6b4b2c', 'center', 500);
  }
  else if (micState === 'tap') { txt('タップで あそぶ', W / 2, 300, 32, INK); txt('おしているあいだが 声のかわり', W / 2, 350, 20, '#6b4b2c', 'center', 500); txt('ながく おすと「もぉ〜ぐら」', W / 2, 385, 20, '#6b4b2c', 'center', 500); }
  else {
    for (const s of segs) if (s.t0 > checkAt) normalPeak = Math.max(normalPeak, s.peak);
    txt('「もぐら」と いってみて', W / 2, 270, 32, INK);
    g.save(); g.translate(W / 2 - HOLE_X, 420 - ROW_Y(4));
    drawMole(4, 1, voiced ? Math.min(1, level * 12) : 0, false, 'あなた');
    g.restore();
    const v = Math.min(1, level * 8);
    g.fillStyle = '#ddd'; rr(80, 560, W - 160, 26, 13); g.fill();
    g.fillStyle = voiced ? '#ffd84a' : '#9fd47f'; rr(80, 560, (W - 160) * v, 26, 13); g.fill();
    if (normalPeak > 0) { txt('きこえた！', W / 2, 620, 30, '#2f7d32'); peakLoud = Math.min(0.4, Math.max(0.04, normalPeak * TUNE.loudMul)); }
    else txt('（まだ きこえない）', W / 2, 620, 20, '#999', 'center', 500);
    txt('イヤホンを つかうと もっと よく きこえるよ', W / 2, 680, 17, '#6b4b2c', 'center', 500);
  }
  const ready = micState !== 'on' || normalPeak > 0;
  const x = 120, y = 750, w = 300, h = 90;
  g.fillStyle = ready ? '#3a2a1f' : '#9a8a7a'; rr(x, y, w, h, 24); g.fill(); g.stroke();
  txt(ready ? 'はじめる' : 'いってから はじめる', x + w / 2, y + 45, ready ? 34 : 22, '#ffd84a');
  buttons.push({ x, y, w, h, fn: () => { if (micState === 'denied') micState = 'tap'; startStage(st.i); } });
}

function drawResult(t) {
  g.drawImage(bg, 0, 0);
  drawTitleBar(st.name + ' の けっか');
  const sc = score(), d = t - resultAt;
  const rank = sc >= 90 ? ['もぐらマスター', '#e8402e'] : sc >= 70 ? ['いいもぐら', '#e08a00'] : sc >= 40 ? ['もぐら見習い', '#2f7d32'] : ['もういっかい', '#777'];
  g.fillStyle = 'rgba(255,255,255,0.92)'; g.strokeStyle = INK; g.lineWidth = 4; rr(30, 190, W - 60, 560, 26); g.fill(); g.stroke();
  for (let i = 0; i < 5; i++) { const ph = (t * 2 + i * 0.4) % 1.2; }
  if (d > 0.4) txt(rank[0], W / 2, 280, 52, rank[1], 'center', 800, '#fff', 10);
  txt(sc + ' てん', W / 2, 370, 46, INK);
  txt('ピッタリ ' + result.p + '　おしい ' + result.o + '　ミス ' + result.x, W / 2, 440, 22, '#5a4634', 'center', 500);
  buttons = [];
  const bt = (label, x, fn, dark) => {
    g.fillStyle = dark ? INK : '#fff'; g.strokeStyle = INK; g.lineWidth = 4; rr(x, 620, 210, 90, 22); g.fill(); g.stroke();
    txt(label, x + 105, 665, 28, dark ? '#ffd84a' : INK);
    buttons.push({ x, y: 620, w: 210, h: 90, fn });
  };
  bt('もういちど', 55, () => startStage(st.i), true);
  bt('もどる', 275, () => { scene = 'title'; });
  // もぐらの おじぎ
  for (let i = 0; i < 5; i++) {
    const x = 70 + i * 100, y = 540, b = Math.max(0, Math.sin((t - i * 0.12) * 5));
    g.fillStyle = MOLES[i].body; g.strokeStyle = INK; g.lineWidth = 3;
    g.beginPath(); g.ellipse(x, y - b * 14, 30, 34, 0, Math.PI, 0); g.lineTo(x + 30, y + 20); g.lineTo(x - 30, y + 20); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = INK; g.beginPath(); g.arc(x - 10, y - 12 - b * 14, 3, 0, Math.PI * 2); g.arc(x + 10, y - 12 - b * 14, 3, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#ff7f9c'; g.beginPath(); g.ellipse(x, y - 2 - b * 14, 6, 5, 0, 0, Math.PI * 2); g.fill();
  }
}

function frame() {
  update();
  const t = now();
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#3b2f25'; g.fillRect(0, 0, innerWidth, innerHeight);
  g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  if (scene === 'title') drawTitle(t);
  else if (scene === 'check') drawCheck(t);
  else if (scene === 'play') drawPlay(t);
  else drawResult(t);
  g.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
